# Fechas de fin de soporte de Windows (servicio de seguridad). Se actualiza con el paquete "datos".
# consumo  = Home, Pro, Pro Education, Pro for Workstations
# empresa  = Enterprise, Education, IoT Enterprise
# ltsc     = canal de mantenimiento a largo plazo (EnterpriseS / EnterpriseSN)
# ltsc_iot = IoT Enterprise LTSC (IoTEnterpriseS), que tiene un ciclo más largo
fuentes:
  - https://learn.microsoft.com/windows/release-health/windows11-release-information
  - https://learn.microsoft.com/windows/release-health/release-information
  - https://learn.microsoft.com/lifecycle/products/windows-10-home-and-pro
nota_windows10: >-
  Windows 10 22H2 dejó de recibir actualizaciones gratuitas el 14/10/2025. Las PCs inscriptas en el programa
  de Actualizaciones de Seguridad Extendidas (ESU) siguen recibiendo parches de seguridad; según lo informado
  en junio de 2026, el ESU para consumidores se extendió hasta el 12/10/2027 (confirmar en Windows Update).
