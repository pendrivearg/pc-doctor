id: INS-012
area: windows
titulo:
  sencillo: "La compu no me deja instalar programas que no sean de la Microsoft Store"
  tecnico: "Windows en modo S: solo aplicaciones de Microsoft Store"
explicacion:
  sencillo: >-
    Muchas notebooks económicas vienen con Windows «en modo S»: por seguridad, solo deja instalar aplicaciones de
    la Microsoft Store y usa Microsoft Edge como navegador. No está roto: es así a propósito. Si necesitás un
    programa que no está en la Store, hay que salir del modo S.
  tecnico: "Modo S: solo apps de Microsoft Store, Edge como navegador predeterminado y Bing como buscador predeterminado; Windows Security como antivirus compatible. En Windows 11 solo existe para la edición Home."
frases: ["no me deja instalar programas bajados de internet", "dice que solo puedo instalar apps de la store", "mi notebook tiene windows en modo s", "qué es windows 11 home en modo s"]
pasos:
  - texto: "Abrí Activación: si tu Windows está en modo S, ahí aparece una sección para cambiar a Windows sin modo S."
    abrir: "ms-settings:activation"
  - texto: "Antes de salir, buscá si el programa que necesitás está en la Microsoft Store: muchas veces está y no hace falta cambiar nada."
  - texto: "Si de verdad necesitás programas de fuera de la Store, se puede salir del modo S gratis, pero NO tiene vuelta atrás. Escribile a PC Doctor «salir del modo S»."
    abrir: "https://support.microsoft.com/windows/windows-10-and-windows-11-in-s-mode-faq-851057d6-1ee9-b9e5-c30b-93baebeebc85"
fuentes:
  - https://support.microsoft.com/windows/windows-10-and-windows-11-in-s-mode-faq-851057d6-1ee9-b9e5-c30b-93baebeebc85
  - https://learn.microsoft.com/windows/whats-new/windows-11-requirements
madurez: T0
