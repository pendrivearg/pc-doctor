id: INS-007
area: windows
titulo:
  sencillo: "No tengo puntos de restauración: quiero activar la protección del sistema"
  tecnico: "Activar la Protección del sistema (puntos de restauración)"
explicacion:
  sencillo: >-
    La «Protección del sistema» es lo que guarda los puntos de restauración. Microsoft avisa que no viene
    activada de fábrica, pero recomienda activarla. Usa un poco de espacio del disco, que vos podés limitar.
  tecnico: "Protección del sistema > Configurar > Activar protección del sistema; control deslizante de uso máximo de disco; Windows crea puntos automáticamente cuando hace falta."
frases: ["la protección del sistema está desactivada", "no me aparecen puntos de restauración", "activar restaurar sistema", "el botón crear punto de restauración está gris"]
pasos:
  - texto: "Tocá Inicio, escribí «Crear un punto de restauración» y abrilo."
    abrir: "https://support.microsoft.com/windows/system-protection-e9126e6e-fa64-4f5f-874d-9db90e57645a"
  - texto: "En la pestaña «Protección del sistema», elegí el disco de Windows (suele ser C:) y tocá «Configurar...»."
  - texto: "Marcá la opción para activar la protección del sistema. Con la barrita elegí cuánto espacio del disco puede usar como máximo y tocá «Aplicar»."
  - texto: "Desde ahí Windows crea puntos de restauración solo cuando hace falta. Si querés uno ya, tocá «Crear...»."
fuentes:
  - https://support.microsoft.com/windows/system-protection-e9126e6e-fa64-4f5f-874d-9db90e57645a
madurez: T0
