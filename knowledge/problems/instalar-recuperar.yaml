# Instalar, actualizar y recuperar Windows: pendrive de instalación, unidad de recuperación, instalación desde cero, restablecer, puntos de restauración, ESU, Windows 11, modo S, ediciones, licencia, particiones y Windows.old. Guiadas con fuente oficial.
id: INS-001
area: windows
titulo:
  sencillo: "Quiero armar un pendrive para instalar Windows 11"
  tecnico: "Crear medios de instalación de Windows 11 (Media Creation Tool)"
explicacion:
  sencillo: >-
    Microsoft tiene un programa gratis que descarga Windows 11 y lo copia en un pendrive para poder instalarlo o
    reinstalarlo. Ojo: todo lo que tenga ese pendrive se borra, así que usá uno vacío o copiá antes lo que tenga.
  tecnico: "Herramienta de creación de medios: USB de arranque (8 GB o más) o ISO; solo procesadores de 64 bits; requiere licencia de Windows 11 o equipo con Windows 10 que califique."
frases: ["cómo hago un pendrive booteable de windows 11", "quiero bajar windows 11 en un pendrive", "dónde descargo la herramienta para crear el usb de windows", "necesito un pendrive para reinstalar windows"]
pasos:
  - texto: "ATENCIÓN: el programa BORRA todo lo que tenga el pendrive. Usá uno vacío de 8 GB o más, o copiá antes lo que tenga a otro lado."
  - texto: "Entrá a la página oficial de descarga de Microsoft y, en la sección para crear medios de instalación de Windows 11, descargá la herramienta. Necesitás conexión a internet."
    abrir: "https://www.microsoft.com/software-download/windows11"
  - texto: "Abrí la herramienta (pide permiso de administrador), aceptá los términos y elegí el idioma y la edición. Usá el mismo idioma que vas a usar al instalar."
  - texto: "Elegí crear los medios para otra PC, después la opción de unidad flash USB, seleccioná tu pendrive y esperá a que termine. Después ya podés usarlo para arrancar la PC donde vas a instalar."
fuentes:
  - https://www.microsoft.com/software-download/windows11
madurez: T0
