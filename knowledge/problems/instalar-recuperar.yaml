id: INS-017
area: windows
titulo:
  sencillo: "Cambié la placa madre (u otra pieza grande) y Windows dejó de estar activado"
  tecnico: "Reactivar Windows después de un cambio de hardware (solucionador de activación)"
explicacion:
  sencillo: >-
    Windows reconoce la PC por sus piezas. Si cambiaste algo grande, como la placa madre, cree que es otra
    computadora y se desactiva. Si tu licencia estaba vinculada a tu cuenta Microsoft, se puede volver a activar
    con el solucionador de problemas de activación.
  tecnico: "Activación > Solucionar problemas > «I changed hardware on this device recently» > iniciar sesión con la cuenta vinculada > «This is the device I'm using right now» > Activar. La edición debe coincidir. Alternativas: cambiar la clave de producto o comprar una licencia."
frases: ["cambié la placa madre y windows no está activado", "después de cambiar el motherboard me pide activar windows", "reactivar windows después de cambiar piezas", "cambié el disco y la placa y windows dice que no es original"]
pasos:
  - texto: "Conectá la PC a internet e iniciá sesión con una cuenta de administrador."
  - texto: "Abrí Activación y tocá «Solucionar problemas». Elegí la opción que dice que cambiaste el hardware de este dispositivo hace poco y seguí."
    abrir: "ms-settings:activation"
  - texto: "Iniciá sesión con la cuenta Microsoft que tenía vinculada la licencia (escribí la contraseña solo en la ventana de Windows). En la lista, marcá el equipo que estás usando ahora y tocá «Activar»."
    abrir: "https://support.microsoft.com/windows/activation/reactivating-windows-after-a-hardware-change"
  - texto: "Si tu equipo no aparece, revisá que hayas entrado con la misma cuenta. Si tenés una clave de producto, podés usar la opción para cambiar la clave en Activación. Si no tenés licencia, desde ahí mismo se puede comprar en la Store."
derivar: "Si nada de esto funciona, contactá al soporte de Microsoft. PC Doctor nunca activa Windows por vías no oficiales."
fuentes:
  - https://support.microsoft.com/windows/activation/reactivating-windows-after-a-hardware-change
madurez: T0
