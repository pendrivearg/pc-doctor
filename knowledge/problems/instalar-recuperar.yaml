id: INS-010
area: windows
titulo:
  sencillo: "Quiero pasar a Windows 11 con el Asistente de instalación"
  tecnico: "Asistente para la instalación de Windows 11 (actualización en el mismo equipo)"
explicacion:
  sencillo: >-
    El «Asistente para la instalación de Windows 11» es un programa oficial de Microsoft que actualiza la misma PC
    que estás usando a Windows 11. Microsoft aconseja esperar a que Windows Update te lo ofrezca, pero el asistente
    se puede usar antes si tu PC cumple los requisitos.
  tecnico: "Requiere licencia de Windows 10/11, Windows 10 versión 2004 o posterior, 9 GB libres, procesador x64 y permisos de administrador. Resultados posibles: instalar, usar PC Health Check o requisitos no cumplidos."
frases: ["asistente de instalación de windows 11", "quiero actualizar a windows 11 sin esperar a windows update", "programa de microsoft para pasar a windows 11", "cómo instalo windows 11 encima de windows 10"]
pasos:
  - texto: "Antes de actualizar, hacé una copia de tus archivos importantes."
  - texto: "Necesitás Windows 10 versión 2004 o posterior y al menos 9 GB libres en el disco. Fijate tu versión en «Acerca de»."
    abrir: "ms-settings:about"
  - texto: "En la página oficial de descarga, bajá el «Asistente para la instalación de Windows 11» y abrilo (pide permiso de administrador)."
    abrir: "https://www.microsoft.com/software-download/windows11"
  - texto: "Si te ofrece instalar, aceptá la licencia para instalar y, cuando termine, tocá «Reiniciar ahora». La PC se reinicia varias veces: no la apagues; si es portátil, dejala enchufada."
  - texto: "Si te pide usar PC Health Check, instalalo, hacé la revisión y volvé a cargar el asistente con su botón para actualizar. Si dice que no cumple los requisitos, Microsoft recomienda quedarse en Windows 10."
    abrir: "https://support.microsoft.com/windows/ways-to-install-windows-11-e0edbbfb-cfc5-4011-868b-2ce77ac7c70e"
fuentes:
  - https://www.microsoft.com/software-download/windows11
  - https://support.microsoft.com/windows/ways-to-install-windows-11-e0edbbfb-cfc5-4011-868b-2ce77ac7c70e
madurez: T0
