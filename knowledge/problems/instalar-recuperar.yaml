id: INS-018
area: windows
titulo:
  sencillo: "En el disco aparecen particiones raras, como «Partición de recuperación»"
  tecnico: "Particiones del sistema en UEFI/GPT: EFI, MSR, Windows y recuperación"
explicacion:
  sencillo: >-
    Es normal. Windows arma varias partes en el disco: una chiquita para arrancar, otra reservada, la de Windows
    (C:) y una de recuperación con las herramientas para reparar la PC. No tienen letra y no se ven en el
    Explorador. NO las borres: la PC puede dejar de arrancar o perder sus herramientas de reparación.
  tecnico: "Diseño predeterminado UEFI: partición del sistema EFI (FAT32, 200 MB o más), MSR de 16 MB, partición de Windows (NTFS) y partición de recuperación con WinRE, ubicada después de la de Windows. Sin letra de unidad."
frases: ["me aparecen particiones raras en el disco", "qué es la partición de recuperación", "puedo borrar la partición de recuperación", "en administración de discos hay partes sin letra", "partición del sistema efi qué es"]
pasos:
  - texto: "Podés ver las partes del disco en «Discos y volúmenes» (o en «Administración de discos»). Las que no tienen letra (sistema EFI, reservada y recuperación) son de Windows: dejalas como están."
    abrir: "ms-settings:disksandvolumes"
  - texto: "NO elimines ni formatees esas particiones: si las borrás, Windows puede no arrancar o quedarte sin las opciones de reparación. Microsoft explica para qué sirve cada una (en inglés)."
    abrir: "https://learn.microsoft.com/windows-hardware/manufacture/desktop/configure-uefigpt-based-hard-drive-partitions"
  - texto: "Esas particiones ocupan poco. Si lo que te preocupa es el espacio, escribile a PC Doctor «el disco está casi lleno»."
derivar: "Si un programa o un técnico te propone borrar o unir particiones, pedí que primero haga una copia completa del disco."
fuentes:
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/configure-uefigpt-based-hard-drive-partitions
madurez: T0
