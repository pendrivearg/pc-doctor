id: INS-015
area: windows
titulo:
  sencillo: "¿Dónde encuentro la clave de producto de Windows?"
  tecnico: "Clave de producto de 25 caracteres frente a licencia digital"
explicacion:
  sencillo: >-
    La clave de producto es un código de 25 letras y números para activar Windows. Muchas PCs no la necesitan:
    si Windows vino con la compu o lo actualizaste gratis, se activa con una «licencia digital» y no hay clave que
    buscar. Si lo compraste aparte, la clave está en la caja, en el correo de compra o en tu cuenta.
  tecnico: "Formato XXXXX-XXXXX-XXXXX-XXXXX-XXXXX. Licencia digital: activación sin clave (actualizaciones gratuitas desde 7, 8.1 o 10, compras en la app Microsoft Store). PC nueva: clave preinstalada o en el certificado de autenticidad (COA)."
frases: ["no encuentro la clave de windows", "dónde está el número de serie de windows", "me piden la clave de producto para instalar windows", "perdí la clave de windows que compré"]
pasos:
  - texto: "Primero fijate en Activación si Windows ya está activado. Si dice que está activado con una licencia digital, no necesitás ninguna clave."
    abrir: "ms-settings:activation"
  - texto: "Si la PC vino con Windows, la clave viene cargada en la propia computadora; a veces también está en una etiqueta o en la caja. Si no aparece, consultá al fabricante."
  - texto: "Si compraste Windows en caja, la clave está en una etiqueta o tarjeta adentro. Si lo compraste por internet, buscá el correo de confirmación de la compra. Si fue en la tienda online de Microsoft, también figura en el historial de pedidos de tu cuenta Microsoft."
    abrir: "https://support.microsoft.com/windows/activation/find-your-windows-product-key"
fuentes:
  - https://support.microsoft.com/windows/activation/find-your-windows-product-key
madurez: T0
