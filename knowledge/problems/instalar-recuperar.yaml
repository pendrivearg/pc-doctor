id: INS-019
area: archivos
titulo:
  sencillo: "Después de actualizar Windows tengo una carpeta «Windows.old» que ocupa muchísimo"
  tecnico: "Eliminar la instalación anterior de Windows (Windows.old)"
explicacion:
  sencillo: >-
    Cuando Windows se actualiza a una versión nueva, guarda la anterior en la carpeta «Windows.old» por si querés
    volver atrás. A los 10 días se borra sola. Si la borrás antes, liberás espacio, pero ya NO vas a poder volver
    a la versión anterior.
  tecnico: "Configuración > Sistema > Almacenamiento > Archivos temporales > casilla «Previous version of Windows» > «Remove files» (nombres de la documentación en inglés). Requiere permisos de administrador; eliminación automática a los 10 días."
frases: ["qué es la carpeta windows.old", "puedo borrar windows.old", "windows.old ocupa muchos gigas", "cómo elimino la versión anterior de windows"]
pasos:
  - texto: "ATENCIÓN: si la borrás, no vas a poder volver a la versión anterior de Windows. Si todavía no estás seguro de quedarte con la nueva, esperá: a los 10 días se borra sola."
  - texto: "Si te faltan archivos después de actualizar, recuperalos ANTES de borrarla (escribile a PC Doctor «recuperar archivos de windows.old»)."
  - texto: "Abrí Almacenamiento y entrá en «Archivos temporales»."
    abrir: "ms-settings:storagesense"
  - texto: "Marcá la casilla de la versión anterior de Windows y tocá el botón para quitar los archivos. Necesitás ser administrador."
    abrir: "https://support.microsoft.com/windows/deployment/install-upgrade/delete-your-previous-version-of-windows"
fuentes:
  - https://support.microsoft.com/windows/deployment/install-upgrade/delete-your-previous-version-of-windows
madurez: T0
