id: INS-020
area: archivos
titulo:
  sencillo: "Después de actualizar o reinstalar me faltan archivos: ¿están en Windows.old?"
  tecnico: "Recuperar archivos de la carpeta Windows.old"
explicacion:
  sencillo: >-
    Si después de una actualización grande te faltan documentos o fotos, muchas veces están guardados en la carpeta
    «Windows.old» del disco C:. Solo duran 10 días desde la actualización, así que conviene copiarlos cuanto antes.
  tecnico: "C:\\Windows.old\\Users\\<usuario>: requiere cuenta de administrador. Plazo de 10 días. No existe tras una instalación limpia desde medios ni tras «Restablecer este equipo»; una nueva instalación, actualización o restablecimiento la reemplaza."
frases: ["recuperar archivos de windows.old", "después de actualizar windows desaparecieron mis documentos", "cómo saco mis fotos de la carpeta windows.old", "perdí el escritorio después de la actualización"]
pasos:
  - texto: "No reinstales, restablezcas ni actualices Windows de nuevo mientras tanto: eso borra la carpeta Windows.old y lo que tenga adentro."
  - texto: "Con una cuenta de administrador, abrí el Explorador de archivos, entrá a «Este equipo» > disco C: > «Windows.old» > «Users» y abrí la carpeta con tu nombre de usuario. Si dice que no tenés permiso, tocá «Continuar»."
    abrir: "https://support.microsoft.com/windows/deployment/install-upgrade/retrieve-files-from-the-windows-old-folder-after-a-windows-upgrade"
  - texto: "Entrá a la carpeta donde estaban tus cosas (Documentos, Imágenes, Escritorio) y copiá lo que necesites a tu carpeta actual o a un pendrive."
  - texto: "Si no existe la carpeta Windows.old, puede que hayas hecho una instalación limpia o un restablecimiento: en esos casos no se crea. Buscá en tus copias de seguridad o en OneDrive."
derivar: "Si los archivos eran muy importantes y no aparecen, no sigas usando la PC para instalar cosas y consultá a un técnico en recuperación de datos."
fuentes:
  - https://support.microsoft.com/windows/deployment/install-upgrade/retrieve-files-from-the-windows-old-folder-after-a-windows-upgrade
madurez: T0
