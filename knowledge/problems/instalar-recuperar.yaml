id: INS-005
area: windows
titulo:
  sencillo: "Al restablecer me pregunta «Descarga de la nube» o «Reinstalación local»: ¿cuál elijo?"
  tecnico: "Restablecer este equipo: descarga en la nube frente a reinstalación local"
explicacion:
  sencillo: >-
    Las dos reinstalan Windows. «Descarga de la nube» baja un Windows nuevo de internet, ya actualizado, y sirve si
    el de la PC está dañado; necesita buena conexión. «Reinstalación local» usa lo que ya está en la PC: es más
    rápida si tu internet es lento, pero puede quedar sin las últimas actualizaciones.
  tecnico: "Cloud download: imagen nueva desde la nube con las últimas actualizaciones, recomendada si los archivos locales están dañados o faltan. Local reinstall: usa los archivos del equipo; más rápida con conexión lenta."
frases: ["descarga de la nube o reinstalación local", "qué conviene al restablecer windows nube o local", "restablecer desde internet o desde la pc", "me pregunta cómo quiero reinstalar windows"]
pasos:
  - texto: "Antes de restablecer, copiá tus archivos importantes. Recordá: «Mantener mis archivos» conserva documentos y fotos, pero borra los programas; «Quitar todo» borra todo."
  - texto: "Si Windows andaba muy mal o tira errores de archivos dañados, elegí «Descarga de la nube». Si tu internet es lento o tiene límite de datos, elegí «Reinstalación local»."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/reset-your-pc"
  - texto: "Durante el proceso la pantalla puede quedar negra mucho tiempo (a veces más de 15 minutos) y la PC se reinicia sola: no la apagues. Si es portátil, dejala enchufada."
derivar: "Si la reinstalación local falla, probá con «Descarga de la nube»."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/reset-your-pc
madurez: T0
