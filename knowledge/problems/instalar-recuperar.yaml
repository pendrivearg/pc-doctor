id: INS-004
area: windows
titulo:
  sencillo: "Quise restablecer la PC y dice «Hubo un problema al restablecer el PC»"
  tecnico: "Restablecer este equipo falla y no aplica cambios"
explicacion:
  sencillo: >-
    A veces «Restablecer este equipo» no puede terminar y Windows vuelve a como estaba, sin cambios. Hay otras
    formas de reinstalar Windows: algunas conservan tus cosas y otras no, así que hacé una copia antes.
  tecnico: "Alternativas oficiales cuando el restablecimiento no es posible: reinstalar Windows con Windows Update (conserva archivos y apps), unidad de recuperación o medios de instalación creados en otra PC."
frases: ["hubo un problema al restablecer el pc", "no me deja restablecer la compu", "restablecer de fábrica da error", "intenté resetear windows y dice que no se hicieron cambios"]
pasos:
  - texto: "Antes que nada, copiá tus fotos y documentos a un disco externo o a la nube: cualquier reinstalación tiene riesgo."
  - texto: "En Recuperación, probá la opción para reinstalar la versión actual de Windows usando Windows Update (en Windows 11 22H2 o posterior). Conserva tus archivos, programas y configuraciones."
    abrir: "ms-settings:recovery"
  - texto: "Si eso tampoco funciona, Microsoft sugiere reinstalar con una unidad de recuperación o con un pendrive de instalación creado en otra computadora. Ojo: la unidad de recuperación borra archivos y programas."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/recovery-options-in-windows"
  - texto: "Si vuelve a intentar restablecer, no apagues la PC aunque la pantalla quede negra un buen rato: apagarla a mano puede hacer que falle."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/reset-your-pc"
derivar: "Si la PC es del trabajo o de la escuela, consultá primero con el área de sistemas."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/recovery-options-in-windows
  - https://support.microsoft.com/windows/experience/backup-recovery/reset-your-pc
madurez: T0
