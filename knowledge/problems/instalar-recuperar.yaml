id: INS-011
area: windows
titulo:
  sencillo: "Vi un truco en internet para poner Windows 11 en una PC que no es compatible"
  tecnico: "Windows 11 en equipos que no cumplen los requisitos mínimos: no recomendado"
explicacion:
  sencillo: >-
    Hay videos y programas que prometen instalar Windows 11 en PCs que no cumplen los requisitos. Microsoft no lo
    recomienda: esas PCs pueden fallar, no tienen garantizadas las actualizaciones de seguridad, muestran una marca
    de agua y los daños no los cubre la garantía. PC Doctor no te va a guiar por esos métodos.
  tecnico: "Instalación no admitida: sin soporte, sin garantía de actualizaciones (incluidas las de seguridad), marca de agua en el escritorio y aviso en Configuración. Microsoft recomienda volver a Windows 10 de inmediato (opción «Volver», 10 días)."
frases: ["truco para instalar windows 11 en pc no compatible", "saltear el tpm para poner windows 11", "instalé windows 11 con rufus y me sale una marca de agua", "conviene forzar windows 11 en una compu vieja"]
pasos:
  - texto: "No uses programas ni trucos para saltear los requisitos: Microsoft advierte que la PC puede no recibir actualizaciones de seguridad y quedar más expuesta."
    abrir: "https://support.microsoft.com/windows/experience/compatibility/windows-11-on-devices-that-don-t-meet-minimum-system-requirements"
  - texto: "Si ya lo instalaste así, Microsoft recomienda volver a Windows 10 enseguida: en Recuperación, usá «Volver». Solo está disponible 10 días después de actualizar."
    abrir: "ms-settings:recovery"
  - texto: "Si tu PC no cumple los requisitos, podés seguir con Windows 10 inscripto en las Actualizaciones de Seguridad Extendidas (escribile a PC Doctor «inscribirme en ESU»)."
  - texto: "A veces la PC sí cumple y solo hay que activar el TPM o el Arranque seguro: escribile a PC Doctor «esta pc no puede ejecutar windows 11» para revisarlo."
fuentes:
  - https://support.microsoft.com/windows/experience/compatibility/windows-11-on-devices-that-don-t-meet-minimum-system-requirements
  - https://www.microsoft.com/software-download/windows11
madurez: T0
