id: INS-014
area: windows
titulo:
  sencillo: "Tengo Windows Home y quiero pasar a Windows Pro"
  tecnico: "Actualización de edición Home a Pro (clave de producto o Microsoft Store)"
explicacion:
  sencillo: >-
    Windows Pro trae algunas funciones extra pensadas para oficinas. Para pasar de Home a Pro hace falta una
    licencia de Pro: se pone la clave en Activación o se compra en la Microsoft Store. Después no se puede volver
    a Home cambiando la clave.
  tecnico: "Home > Pro: solo ingresando manualmente la clave de producto (Activación > Cambiar clave de producto) o comprando la actualización en la Microsoft Store; requiere reinicio. Bajar de Pro a Home no es una ruta admitida."
frases: ["cómo paso de windows home a pro", "quiero windows pro en vez de home", "tengo una clave de windows pro y tengo home instalado", "actualizar la edición de windows a profesional"]
pasos:
  - texto: "En Activación podés ver qué edición tenés (Home o Pro)."
    abrir: "https://support.microsoft.com/windows/activation/reactivating-windows-after-a-hardware-change"
  - texto: "Si ya tenés una clave de Windows Pro comprada en un lugar oficial, abrí Activación, tocá la opción para cambiar la clave de producto, escribila y seguí las instrucciones en pantalla. La PC se reinicia."
    abrir: "ms-settings:activation"
  - texto: "Si no tenés clave, la actualización a Pro se puede comprar en la Microsoft Store."
    abrir: "https://learn.microsoft.com/windows/deployment/upgrade/windows-edition-upgrades"
  - texto: "Antes de pagar, pensá si de verdad necesitás Pro: Microsoft no admite volver de Pro a Home con una clave."
fuentes:
  - https://learn.microsoft.com/windows/deployment/upgrade/windows-edition-upgrades
  - https://support.microsoft.com/windows/activation/reactivating-windows-after-a-hardware-change
madurez: T0
