id: INS-024
area: windows
titulo:
  sencillo: "Al activar Windows sale un código de error (0xC004C003, 0xC004F034, 0x803F7001…)"
  tecnico: "Errores de activación de Windows: clave no válida, edición distinta o licencia no encontrada"
explicacion:
  sencillo: >-
    Cuando Windows no se puede activar muestra un código. Los más comunes quieren decir que la clave ya se usó en
    otras compus, que es de otra edición (por ejemplo de Pro y tenés Home) o que Windows no encuentra tu licencia,
    muchas veces después de cambiar piezas. Cada caso tiene su salida.
  tecnico: "0xC004C003: clave bloqueada por uso en varios equipos. 0xC004F034 / 0xC004F210 / 0xC004F212: clave o licencia de otra versión o edición. 0x803F7001: sin licencia válida. 0xC004F211 / 0xC004F213: cambio de hardware. 0xC004C060 / 0x803FA067: clave no utilizable o servidores ocupados."
frases: ["error 0xc004c003 al activar windows", "dice que la clave de producto no es válida", "me sale el error 0x803f7001 en activación", "me tira un código raro cuando quiero activar windows"]
pasos:
  - texto: "Anotá el código que aparece. Abrí Activación y, si está, tocá «Solucionar problemas». Revisá también que tengas internet y la fecha y hora bien puestas."
    abrir: "ms-settings:activation"
  - texto: "Si dice que la clave no es válida o ya se usó (0xC004C003): si la compraste a un revendedor, reclamale a él; si Windows vino con la PC, consultá al fabricante. Si un técnico te arregló la compu, preguntale si hace falta una licencia nueva."
    abrir: "https://support.microsoft.com/windows/activation/get-help-with-windows-activation-errors"
  - texto: "Si la clave es de otra edición (0xC004F034 y parecidos), tiene que coincidir con la que tenés instalada: una clave de Pro no activa Home, y al revés."
  - texto: "Si no encuentra licencia (0x803F7001) o cambiaste piezas (0xC004F213), escribile a PC Doctor «reactivar windows después de cambiar piezas». Si no tenés licencia, desde Activación se puede comprar en la Microsoft Store."
derivar: "Si el código no está en la lista o nada funciona, contactá al soporte de Microsoft. PC Doctor nunca activa Windows con «activadores» ni claves no oficiales."
fuentes:
  - https://support.microsoft.com/windows/activation/get-help-with-windows-activation-errors
madurez: T0
