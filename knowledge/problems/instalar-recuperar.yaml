id: INS-023
area: windows
titulo:
  sencillo: "Quiero volver la PC a como estaba ayer con la restauración a un momento dado"
  tecnico: "Restauración a un momento dado (Point-in-time restore)"
explicacion:
  sencillo: >-
    Es una función nueva de Windows que guarda una «foto» completa del disco de Windows más o menos una vez por día
    y la conserva hasta 3 días. Si algo se rompe, podés volver a ese momento. Ojo: se pierde TODO lo que hiciste
    después en ese disco, incluidos archivos nuevos, programas y cambios de contraseña.
  tecnico: "Configuración > Sistema > Recuperación > Point-in-time restore. Puntos cada ~24 h, retención de hasta 72 h, hasta 2 % del disco. Se restaura desde WinRE: Solucionar problemas > Point-in-time restore. Revierte toda la unidad de Windows; OneDrive y otras unidades no se tocan."
frases: ["volver la compu a como estaba ayer", "restauración a un momento dado de windows 11", "quiero deshacer lo que pasó hoy en la compu", "restaurar windows de hace unas horas"]
pasos:
  - texto: "Para activarla: en Recuperación buscá la opción de restauración a un momento dado, tocá para ver o editar, aceptá el permiso y poné el interruptor en Activado."
    abrir: "ms-settings:recovery"
  - texto: "ATENCIÓN antes de restaurar: se pierde todo lo hecho en el disco de Windows después de ese momento (archivos nuevos, programas, configuraciones y contraseñas). Copiá antes a un pendrive o a OneDrive lo que hayas hecho desde entonces."
  - texto: "Para restaurar: entrá al Entorno de recuperación de Windows, elegí «Solucionar problemas» y luego la restauración a un momento dado. Elegí el punto, revisalo y confirmá. Si pide la clave de BitLocker, tenela a mano."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/point-time-restore-for-windows"
  - texto: "Enchufá la PC y no la apagues mientras restaura. Al terminar, volvé a instalar las actualizaciones de Windows, porque pueden haberse deshecho."
    abrir: "ms-settings:windowsupdate"
derivar: "Si necesitás volver más de 3 días atrás, usá «Restaurar sistema» (escribile a PC Doctor «volver la compu a una fecha anterior»)."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/point-time-restore-for-windows
  - https://support.microsoft.com/windows/experience/backup-recovery/recovery-options-in-windows
madurez: T0
