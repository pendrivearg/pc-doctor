id: INS-002
area: windows
titulo:
  sencillo: "Quiero hacer un pendrive de recuperación por si Windows deja de arrancar"
  tecnico: "Crear una unidad de recuperación (recoverydrive.exe)"
explicacion:
  sencillo: >-
    Una «unidad de recuperación» es un pendrive que te permite reinstalar Windows si un día la PC no arranca.
    Conviene hacerla ahora, mientras la compu anda bien. Crearla borra todo lo que tenga el pendrive.
  tecnico: "Unidad de recuperación con «Hacer copia de seguridad de los archivos del sistema»: incluye los archivos de Windows, las actualizaciones a la fecha y las personalizaciones del fabricante. Recomendado recrearla una vez por año."
frases: ["cómo hago un usb de recuperación", "crear unidad de recuperación de windows", "quiero tener un pendrive por si se rompe windows", "pendrive de rescate de windows por si no arranca"]
pasos:
  - texto: "ATENCIÓN: crear la unidad BORRA todo lo que haya en el pendrive. Usá uno vacío o copiá antes lo que tenga."
  - texto: "Tocá Inicio, escribí «Unidad de recuperación» y abrila. Dejá marcada la opción de hacer copia de seguridad de los archivos del sistema y tocá «Siguiente»."
    abrir: "https://support.microsoft.com/windows/create-a-recovery-drive-abb4691b-5324-6d4a-8766-73fab304c246"
  - texto: "Conectá el pendrive, elegilo en la lista, seguí y tocá el botón para crear la unidad. Puede tardar bastante: no lo desenchufes."
  - texto: "Guardalo en un lugar seguro con una etiqueta. Microsoft recomienda volver a crearlo una vez por año para que tenga las actualizaciones nuevas."
derivar: "Si un día la usás para reinstalar Windows, se borran tus archivos y programas: tené siempre una copia de tus cosas aparte."
fuentes:
  - https://support.microsoft.com/windows/create-a-recovery-drive-abb4691b-5324-6d4a-8766-73fab304c246
  - https://support.microsoft.com/windows/experience/backup-recovery/recovery-options-in-windows
madurez: T0
