id: INS-009
area: windows
titulo:
  sencillo: "Quiero pasar de Windows 10 a Windows 11 gratis"
  tecnico: "Actualización gratuita de Windows 10 a Windows 11 por Windows Update"
explicacion:
  sencillo: >-
    Si tu PC cumple los requisitos, pasar de Windows 10 a Windows 11 es gratis y se hace desde Windows Update.
    Tus archivos pasan al Windows nuevo, pero igual conviene hacer una copia antes. Si no te gusta, tenés 10 días
    para volver a Windows 10.
  tecnico: "Requiere Windows 10 versión 2004 o posterior y cumplir los requisitos mínimos (comprobables con PC Health Check). Windows Update > Buscar actualizaciones > Descargar e instalar. Algunas apps incompatibles se quitan. Reversión disponible 10 días."
frases: ["cómo paso a windows 11 gratis", "windows update me ofrece windows 11", "quiero actualizar de windows 10 a 11 sin pagar", "es gratis pasar a windows 11"]
pasos:
  - texto: "Antes de actualizar, copiá tus fotos y documentos a un disco externo o a OneDrive."
  - texto: "Abrí Windows Update y tocá «Buscar actualizaciones». Si hay actualizaciones pendientes, instalalas, reiniciá y volvé a buscar."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si aparece Windows 11 listo para tu PC, tocá «Descargar e instalar» y aceptá la licencia. Cuando pida reiniciar, tocá «Reiniciar ahora». Se reinicia varias veces: no la apagues."
    abrir: "https://support.microsoft.com/windows/ways-to-install-windows-11-e0edbbfb-cfc5-4011-868b-2ce77ac7c70e"
  - texto: "Si no aparece, puede que tu PC todavía no esté lista o no cumpla los requisitos. Revisalo con la aplicación PC Health Check de Microsoft."
    abrir: "https://www.microsoft.com/windows/windows-11-specifications"
  - texto: "Si después no te convence, durante 10 días podés volver a Windows 10 desde Recuperación."
    abrir: "ms-settings:recovery"
fuentes:
  - https://support.microsoft.com/windows/deployment/install-upgrade/upgrade-to-windows-11-faq
  - https://support.microsoft.com/windows/ways-to-install-windows-11-e0edbbfb-cfc5-4011-868b-2ce77ac7c70e
  - https://www.microsoft.com/windows/windows-11-specifications
madurez: T0
