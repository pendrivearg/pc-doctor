id: INS-003
area: windows
titulo:
  sencillo: "Quiero instalar Windows desde cero (formatear)"
  tecnico: "Instalación limpia de Windows 11 desde medios de instalación"
explicacion:
  sencillo: >-
    Instalar desde cero deja la PC como recién comprada, pero BORRA TODO: fotos, documentos, programas y
    configuraciones. Antes de empezar tenés que tener una copia de tus cosas en un disco externo o en la nube.
  tecnico: "Arranque desde USB de instalación, «Instalar Windows 11», eliminación de las particiones del Disco 0 e instalación en el espacio sin asignar. La licencia se aplica al iniciar sesión con la cuenta Microsoft."
frases: ["quiero formatear e instalar windows de cero", "instalación limpia de windows 11", "borrar todo el disco y poner windows nuevo", "cómo formateo la compu con el pendrive"]
pasos:
  - texto: "ATENCIÓN: esto BORRA TODO lo que hay en el disco. Primero copiá tus fotos, documentos y todo lo que quieras conservar en un disco externo, un pendrive o en OneDrive."
  - texto: "Antes de empezar, fijate en Activación que tu licencia esté vinculada a tu cuenta Microsoft (o tené a mano la clave de producto). Si no lo está, Microsoft recomienda vincularla antes."
    abrir: "ms-settings:activation"
  - texto: "Con el pendrive de instalación hecho, arrancá la PC desde el pendrive (cómo se hace depende de la marca: fijate en la página del fabricante). Elegí idioma y teclado, y después «Instalar Windows 11», confirmando que se va a borrar todo."
    abrir: "https://support.microsoft.com/windows/deployment/install-upgrade/reinstall-windows-with-the-installation-media"
  - texto: "Si te pide clave de producto y no la tenés, elegí la opción de que no tenés clave y la edición que corresponde a tu licencia (Home o Pro). Al elegir dónde instalar, solo se tocan las particiones del «Disco 0»: no toques otros discos."
  - texto: "Cuando termine, iniciá sesión con tu cuenta Microsoft para que se active la licencia y después devolvé tus archivos desde la copia."
derivar: "Si en la PC hay información importante y no estás seguro de tener todo copiado, no lo hagas solo: pedile ayuda a alguien de confianza o a un técnico."
fuentes:
  - https://support.microsoft.com/windows/deployment/install-upgrade/reinstall-windows-with-the-installation-media
  - https://www.microsoft.com/software-download/windows11
madurez: T0
