id: INS-025
area: windows
titulo:
  sencillo: "Quiero reinstalar Windows encima sin perder mis archivos ni programas"
  tecnico: "Reinstalación sobre el sistema actual desde los medios (setup.exe, «Change what to keep»)"
explicacion:
  sencillo: >-
    Si Windows anda mal, se puede reinstalar «por encima» desde el pendrive o el ISO, eligiendo conservar tus
    archivos y programas. Es una reparación profunda que no formatea, pero igual conviene hacer una copia antes.
  tecnico: "Ejecutar setup.exe desde la raíz del medio dentro de Windows; «Change what to keep»: «Keep personal files and apps», «Keep personal files only» o «Keep nothing»."
frases: ["reparar windows reinstalando sin formatear", "reinstalar windows conservando mis programas", "reinstalar windows con el pendrive sin borrar nada", "instalar windows encima del que tengo"]
pasos:
  - texto: "Hacé una copia de tus archivos importantes por las dudas."
  - texto: "Con el pendrive de instalación conectado (o el ISO abierto con doble clic), abrí el Explorador de archivos, entrá a esa unidad y ejecutá «setup.exe». Aceptá el permiso."
    abrir: "https://support.microsoft.com/windows/deployment/install-upgrade/reinstall-windows-with-the-installation-media"
  - texto: "Cuando aparezca la opción para cambiar lo que se conserva, elegí conservar archivos personales y aplicaciones. ATENCIÓN: si elegís no conservar nada, se borra todo."
  - texto: "Tocá «Instalar». La PC se reinicia varias veces: no la apagues."
derivar: "Si Windows ya no arranca, esta opción no sirve: escribile a PC Doctor «la computadora no arranca»."
fuentes:
  - https://support.microsoft.com/windows/deployment/install-upgrade/reinstall-windows-with-the-installation-media
  - https://support.microsoft.com/windows/ways-to-install-windows-11-e0edbbfb-cfc5-4011-868b-2ce77ac7c70e
madurez: T0
