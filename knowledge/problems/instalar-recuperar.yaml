id: INS-008
area: windows
titulo:
  sencillo: "Quiero anotar mi PC con Windows 10 en las Actualizaciones de Seguridad Extendidas (ESU)"
  tecnico: "Inscripción en ESU para consumidores de Windows 10"
explicacion:
  sencillo: >-
    Si tu PC no puede pasar a Windows 11, podés seguir recibiendo arreglos de seguridad para Windows 10 hasta el
    12 de octubre de 2027 inscribiéndola en ESU. Hay una opción gratis (sincronizar tu configuración con Copia de
    seguridad de Windows), otra con 1.000 puntos de Microsoft Rewards y otra paga.
  tecnico: "Requisitos: Windows 10 22H2 (Home, Pro, Pro Education o Workstations) con las últimas actualizaciones, paquete KB5126256 y cuenta Microsoft administradora (no infantil). Una licencia sirve para hasta 10 equipos. Solo actualizaciones de seguridad críticas e importantes, sin soporte técnico."
frases: ["cómo me inscribo en las actualizaciones extendidas de windows 10", "dónde está el botón inscribirse ahora de windows 10", "esu gratis windows 10", "quiero seguir con windows 10 pero con seguridad"]
pasos:
  - texto: "Primero instalá todas las actualizaciones pendientes en Windows Update."
    abrir: "ms-settings:windowsupdate"
  - texto: "En esa misma pantalla de Windows Update, tocá la opción para inscribirte en las actualizaciones extendidas (en inglés aparece como «Enroll now»). Si usás una cuenta local, te va a pedir que inicies sesión con una cuenta Microsoft."
  - texto: "Elegí una de las opciones: sincronizar tu configuración con Copia de seguridad de Windows (gratis), canjear 1.000 puntos de Microsoft Rewards o hacer un pago único."
    abrir: "https://www.microsoft.com/windows/extended-security-updates"
  - texto: "ESU solo trae arreglos de seguridad: no agrega funciones nuevas ni soporte técnico. Las opciones pueden variar según la región."
derivar: "Si el botón no aparece, revisá que tengas Windows 10 22H2 y todas las actualizaciones, y que la PC no esté administrada por una empresa o escuela."
fuentes:
  - https://www.microsoft.com/windows/extended-security-updates
madurez: T0
