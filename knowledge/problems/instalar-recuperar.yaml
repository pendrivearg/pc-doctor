id: INS-022
area: windows
titulo:
  sencillo: "Voy a vender o regalar la compu y quiero borrar todo lo mío"
  tecnico: "Restablecer este equipo con «Quitar todo» y limpieza de datos antes de entregar el equipo"
explicacion:
  sencillo: >-
    Antes de vender o regalar la PC conviene restablecerla con «Quitar todo»: reinstala Windows y borra tus
    archivos, programas y configuraciones. Si además elegís limpiar los datos, tarda más pero a otra persona le
    cuesta mucho más recuperar tus archivos. Todo lo que no hayas copiado antes se pierde.
  tecnico: "Restablecer este equipo > Quitar todo (Reset) + Clean data: borra y limpia la unidad; Microsoft aclara que no cumple normas de borrado gubernamentales ni de la industria. Con BitLocker, tener la clave de recuperación."
frases: ["voy a vender la compu cómo borro todo", "quiero regalar la notebook sin dejar mis cosas", "borrar todos mis datos antes de vender la pc", "dejar la computadora limpia para otra persona"]
pasos:
  - texto: "ATENCIÓN: esto BORRA TODO. Primero copiá tus fotos, documentos y lo que quieras conservar a un disco externo, un pendrive o a la nube, y fijate que la copia abra bien."
  - texto: "Si el disco está cifrado con BitLocker, tené a mano la clave de recuperación antes de empezar."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/reset-your-pc"
  - texto: "En Recuperación, tocá «Restablecer el PC» y elegí «Quitar todo». En la configuración adicional, activá la opción para limpiar los datos: tarda más, pero hace más difícil recuperar tus archivos."
    abrir: "ms-settings:recovery"
  - texto: "Dejala enchufada. La pantalla puede quedar negra mucho tiempo y la PC se reinicia sola: no la apagues hasta que aparezca la pantalla de configuración inicial."
derivar: "Si el disco tiene información muy delicada (por ejemplo de un trabajo o de bancos), consultá a un técnico: Microsoft aclara que esta limpieza no cumple normas oficiales de borrado."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/reset-your-pc
madurez: T0
