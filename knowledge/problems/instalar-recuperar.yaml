id: INS-016
area: windows
titulo:
  sencillo: "Quiero que mi licencia de Windows quede guardada en mi cuenta Microsoft"
  tecnico: "Vincular la licencia digital de Windows con la cuenta Microsoft"
explicacion:
  sencillo: >-
    Si vinculás tu licencia de Windows con tu cuenta Microsoft, el día que cambies una pieza grande (por ejemplo
    la placa madre) o reinstales, vas a poder volver a activar Windows mucho más fácil. Conviene hacerlo ahora,
    con Windows activado y funcionando.
  tecnico: "Activación > «Add an account» (como administrador; nombres de la documentación en inglés). Mensaje esperado: «Windows is activated with a digital license linked to your Microsoft account». Habilita el solucionador de activación tras cambios de hardware."
frases: ["vincular la licencia de windows a mi cuenta microsoft", "cómo guardo la licencia de windows en mi cuenta", "licencia digital vinculada a la cuenta", "quiero asegurarme de no perder la activación si cambio la placa"]
pasos:
  - texto: "Abrí Activación y leé el mensaje de estado. Si ya dice que Windows está activado con una licencia digital vinculada a tu cuenta Microsoft, no tenés que hacer nada."
    abrir: "ms-settings:activation"
  - texto: "Si solo dice que está activado con una licencia digital, revisá en «Tu información» que estés usando una cuenta Microsoft (aparece un correo arriba de «Administrador»)."
    abrir: "ms-settings:yourinfo"
  - texto: "Volvé a Activación, tocá la opción para agregar una cuenta e iniciá sesión con tu cuenta Microsoft. PC Doctor nunca te va a pedir esa contraseña: escribila solo en la ventana de Windows."
    abrir: "https://support.microsoft.com/windows/activation/reactivating-windows-after-a-hardware-change"
  - texto: "De paso, anotá qué edición tenés (Home o Pro), que aparece en esa misma pantalla: para reactivar, la edición tiene que ser la misma."
fuentes:
  - https://support.microsoft.com/windows/activation/reactivating-windows-after-a-hardware-change
madurez: T0
