id: INS-021
area: windows
titulo:
  sencillo: "Al instalar Windows dice que no se puede instalar en este disco por el «estilo de partición GPT»"
  tecnico: "«Windows no se puede instalar en este disco. El disco seleccionado no tiene el estilo de partición GPT»"
explicacion:
  sencillo: >-
    Pasa cuando la PC arrancó desde el pendrive en el modo moderno (UEFI) pero el disco está preparado para el modo
    antiguo. Se arregla arrancando en el otro modo o preparando el disco de nuevo, y esto último BORRA todo lo que tiene.
  tecnico: "Arranque en UEFI con disco MBR. Opciones: arrancar en modo BIOS heredado, convertir con MBR2GPT conservando datos, o eliminar las particiones en el instalador para que lo reformatee como GPT (borra todo)."
frases: ["windows no se puede instalar en este disco gpt", "el disco seleccionado no tiene el estilo de partición gpt", "error de partición mbr al instalar windows", "no me deja elegir el disco para instalar windows"]
pasos:
  - texto: "ATENCIÓN: la solución más común borra TODO el disco. Si tiene archivos que querés, cancelá la instalación y copialos primero."
  - texto: "Arrancá desde el pendrive eligiendo en el menú de arranque la opción que empieza con «UEFI:» (por ejemplo «UEFI: USB»)."
    abrir: "https://learn.microsoft.com/windows-hardware/manufacture/desktop/boot-to-uefi-mode-or-legacy-bios-mode"
  - texto: "En el instalador, elegí la instalación personalizada. En la pantalla para elegir dónde instalar, eliminá las particiones de ESE disco (fijate bien de no tocar otros discos) hasta que quede un solo espacio sin asignar. Elegilo y seguí: Windows lo prepara solo."
    abrir: "https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-setup-installing-using-the-mbr-or-gpt-partition-style"
derivar: "Si no podés perder lo que tiene el disco, pedile ayuda a un técnico: Microsoft tiene una herramienta (MBR2GPT) para convertirlo sin borrar, pero no es para principiantes."
fuentes:
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-setup-installing-using-the-mbr-or-gpt-partition-style
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/boot-to-uefi-mode-or-legacy-bios-mode
madurez: T0
