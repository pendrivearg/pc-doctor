id: INS-013
area: windows
titulo:
  sencillo: "Quiero sacar Windows del modo S"
  tecnico: "Salir del modo S (Activación > Ir a Store)"
explicacion:
  sencillo: >-
    Salir del modo S es gratis y te deja instalar programas de cualquier lado. Pero es PARA SIEMPRE: después no
    se puede volver al modo S. Desde ahí, cuidá más qué programas bajás.
  tecnico: "Configuración > Sistema > Activación > sección «Switch to Windows 11 Pro» (o Home) > enlace «Go to the Store» > Obtener (nombres de la documentación en inglés). No usar «Upgrade your edition of Windows», que mantiene el modo S. Gratis, requiere internet e irreversible."
frases: ["cómo salgo del modo s", "quitar el modo s de windows 11", "salir del modo s es gratis", "quiero instalar chrome y tengo modo s"]
pasos:
  - texto: "Pensalo bien: salir del modo S no tiene vuelta atrás. Si la PC es de una empresa o escuela, consultá antes con quien la administra."
  - texto: "Abrí Activación. En la sección para cambiar a Windows (Home o Pro) sin modo S, tocá el enlace que lleva a la Store. No uses el enlace para actualizar la edición de Windows, porque te deja en modo S."
    abrir: "ms-settings:activation"
  - texto: "En la página de la Microsoft Store que se abre, tocá «Obtener» y confirmá. Es gratis y necesitás internet."
    abrir: "https://support.microsoft.com/windows/windows-10-and-windows-11-in-s-mode-faq-851057d6-1ee9-b9e5-c30b-93baebeebc85"
  - texto: "Desde ahora, bajá programas solo de sus páginas oficiales. Escribile a PC Doctor «instalar un programa sin riesgo de virus» para consejos."
fuentes:
  - https://support.microsoft.com/windows/windows-10-and-windows-11-in-s-mode-faq-851057d6-1ee9-b9e5-c30b-93baebeebc85
  - https://learn.microsoft.com/windows/whats-new/windows-11-requirements
madurez: T0
