id: INS-006
area: windows
titulo:
  sencillo: "Quiero crear un punto de restauración antes de instalar algo"
  tecnico: "Crear manualmente un punto de restauración del sistema"
explicacion:
  sencillo: >-
    Un punto de restauración es como una foto de cómo está Windows hoy. Si después de instalar un programa o un
    controlador algo se rompe, podés volver a esa foto sin perder tus documentos.
  tecnico: "Propiedades del sistema > Protección del sistema > Crear (systempropertiesprotection.exe). Requiere la protección del sistema activada en la unidad."
frases: ["cómo hago un punto de restauración", "crear punto de restauración a mano", "quiero guardar cómo está windows antes de instalar un programa", "hacer un punto de restauración antes de actualizar drivers"]
pasos:
  - texto: "Tocá Inicio, escribí «Crear un punto de restauración» y abrilo (o apretá Windows + R, escribí  systempropertiesprotection  y Enter)."
    abrir: "https://support.microsoft.com/windows/system-protection-e9126e6e-fa64-4f5f-874d-9db90e57645a"
  - texto: "En la pestaña «Protección del sistema», tocá «Crear...». Si el botón está gris, primero hay que activar la protección (escribile a PC Doctor «activar la protección del sistema»)."
  - texto: "Poné un nombre que te ayude a reconocerlo, por ejemplo «antes de instalar la impresora», y tocá «Crear». Esperá el aviso de que se creó."
  - texto: "Si más adelante necesitás volver a ese punto, escribile a PC Doctor «volver la compu a una fecha anterior»."
fuentes:
  - https://support.microsoft.com/windows/system-protection-e9126e6e-fa64-4f5f-874d-9db90e57645a
  - https://support.microsoft.com/windows/experience/backup-recovery/system-restore
madurez: T0
