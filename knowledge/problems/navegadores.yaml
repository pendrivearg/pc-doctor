id: NAV-015
area: seguridad
titulo:
  sencillo: "El navegador bloqueó una descarga"
  tecnico: "Descargas bloqueadas: Navegación segura de Chrome y Microsoft Defender SmartScreen"
explicacion:
  sencillo: "Si el navegador dice que un archivo es peligroso, que no se puede descargar de forma segura o que no se descarga con frecuencia, te está cuidando. Lo más seguro es no bajarlo y buscarlo en la página oficial del programa."
  tecnico: "Chrome marca descargas como peligrosas, sospechosas, sin verificar o inseguras (sin HTTPS). Edge usa SmartScreen por reputación del archivo."
frases: ["no se puede descargar de forma segura", "el chrome me bloquea una descarga", "dice que el archivo puede ser peligroso", "el edge no me deja bajar un programa"]
pasos:
  - texto: "Si Chrome dice que es peligroso, no hace falta hacer nada: no lo bajes. Si dice «inseguro», es porque la página no usa conexión segura (https): buscá el archivo en el sitio oficial."
    abrir: "https://support.google.com/chrome/answer/6261569?hl=es-419"
  - texto: "En Edge, el aviso viene de Microsoft Defender SmartScreen, que compara el archivo con los conocidos como peligrosos o poco descargados. No lo apagues para bajar un archivo dudoso."
    abrir: "https://support.microsoft.com/edge/how-can-smartscreen-help-protect-me-in-microsoft-edge"
  - texto: "Bajá programas solo desde la página oficial de quien los hace. Escribile a PC Doctor «instalar un programa sin riesgo de virus»."
    abrir: "https://support.google.com/chrome/answer/2765944?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Si ya abriste un archivo sospechoso, pasá un análisis con Seguridad de Windows."
    abrir: "ms-settings:windowsdefender"
fuentes:
  - https://support.google.com/chrome/answer/6261569?hl=es-419
  - https://support.microsoft.com/edge/how-can-smartscreen-help-protect-me-in-microsoft-edge
  - https://support.google.com/chrome/answer/2765944?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a
madurez: T0
