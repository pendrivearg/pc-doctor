id: NAV-009
area: rendimiento
titulo:
  sencillo: "Tengo demasiadas pestañas abiertas"
  tecnico: "Ahorro de memoria, pestañas suspendidas y grupos de pestañas"
explicacion:
  sencillo: "Cada pestaña gasta memoria. Los navegadores pueden «dormir» las que no usás para que la compu no se ponga lenta, y también podés agruparlas para ordenarlas."
  tecnico: "Chrome: Configuración > Rendimiento > Ahorro de memoria; grupos de pestañas. Edge: pestañas en suspensión."
frases: ["tengo mil pestañas abiertas", "no encuentro la pestaña entre tantas", "las pestañas me ponen lenta la compu", "cómo ordeno las pestañas"]
pasos:
  - texto: "En Chrome: tres puntitos («Más») > «Configuración» > «Rendimiento» y activá «Ahorro de memoria». Las pestañas que no usás se liberan y vuelven a cargar cuando las tocás."
    abrir: "https://support.google.com/chrome/answer/12929150?hl=es-419"
  - texto: "Para ordenarlas: clic derecho en una pestaña > «Agregar pestaña al grupo» > «Grupo nuevo». Un grupo se puede cerrar y volver a abrir después."
    abrir: "https://support.google.com/chrome/answer/2391819?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Para buscar una pestaña entre muchas: apretá Ctrl + Mayús + A y escribí parte del nombre."
  - texto: "Cerrá con Ctrl + W las que ya no necesites. Si cerrás una sin querer, Ctrl + Mayús + T la vuelve a abrir."
fuentes:
  - https://support.google.com/chrome/answer/12929150?hl=es-419
  - https://support.google.com/chrome/answer/2391819?hl=es-419&co=GENIE.Platform%3DDesktop
madurez: T0
---
id: NAV-010
area: basico
titulo:
  sencillo: "Cerré una pestaña sin querer y la quiero recuperar"
  tecnico: "Volver a abrir pestañas cerradas (Ctrl + Mayús + T) e historial"
explicacion:
  sencillo: "Las pestañas que cerraste se pueden volver a abrir con un atajo de teclado. Y si ya pasó tiempo, la página está en el historial."
  tecnico: "Ctrl + Mayús + T reabre pestañas en el orden en que se cerraron; Ctrl + H abre el historial; opción «Al iniciar» para retomar la sesión."
frases: ["cerré una pestaña sin querer", "se me cerró el navegador y perdí las pestañas", "recuperar la página que tenía abierta", "volver a abrir lo que cerré"]
pasos:
  - texto: "Apretá Ctrl + Mayús + T. Cada vez que lo apretás vuelve otra pestaña, en el orden en que las cerraste. También recupera una ventana entera cerrada."
    abrir: "https://support.google.com/chrome/answer/2391819?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Si fue hace más tiempo, apretá Ctrl + H para abrir el historial y buscá la página ahí."
    abrir: "https://support.google.com/chrome/answer/157179?hl=es-419"
  - texto: "Para que Chrome abra siempre las pestañas de la última vez: «Más» > «Configuración» > «Al iniciar» > «Continuar la sesión desde donde la dejaste»."
    abrir: "https://support.google.com/chrome/answer/95314?hl=es-419"
fuentes:
  - https://support.google.com/chrome/answer/2391819?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.google.com/chrome/answer/157179?hl=es-419
  - https://support.google.com/chrome/answer/95314?hl=es-419
madurez: T0
