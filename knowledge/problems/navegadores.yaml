id: NAV-006
area: programas
titulo:
  sencillo: "Quiero borrar la caché y las cookies del navegador"
  tecnico: "Borrar datos de navegación (caché y cookies) en Chrome y Edge"
explicacion:
  sencillo: "El navegador guarda copias de las páginas (caché) y datos de los sitios (cookies). Borrarlos arregla muchas páginas que andan mal, pero te cierra la sesión en los sitios donde estabas adentro."
  tecnico: "Chrome: Más > Borrar datos de navegación (Ctrl + Mayús + Supr). Edge: Configuración > Privacidad, búsqueda y servicios > Borrar datos de exploración."
frases: ["cómo borro las cookies", "limpiar la caché del navegador", "borrar el historial y los datos del chrome", "me dijeron que borre la memoria del navegador"]
pasos:
  - texto: "Antes de borrar: las cookies guardan tus sesiones, así que después vas a tener que volver a entrar con usuario y clave en tus páginas (correo, banco, redes). Tené esos datos a mano."
  - texto: "En Chrome: apretá Ctrl + Mayús + Supr (o «Más» > «Borrar datos de navegación»). Elegí el período («Todos»), marcá «Cookies y otros datos de sitios» y también la casilla de imágenes y archivos guardados en caché, y tocá «Borrar datos»."
    abrir: "https://support.google.com/accounts/answer/32050?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "En Edge: tres puntitos («Configuración y más») > «Configuración» > «Privacidad, búsqueda y servicios» > «Borrar datos de exploración» > «Elegir lo que se debe borrar». Marcá las imágenes y archivos en caché y las cookies, dejá sin marcar «Contraseñas» y tocá «Borrar ahora»."
    abrir: "https://support.microsoft.com/microsoft-edge/view-and-delete-browser-history-in-microsoft-edge-00cf7943-a9e1-975a-a33d-ac10ce454ca4"
  - texto: "Si tenés la sincronización activada, en Edge el borrado puede aplicarse también en tus otros dispositivos: Microsoft explica cómo evitarlo."
fuentes:
  - https://support.google.com/accounts/answer/32050?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.google.com/chrome/answer/157179?hl=es-419
  - https://support.microsoft.com/microsoft-edge/view-and-delete-browser-history-in-microsoft-edge-00cf7943-a9e1-975a-a33d-ac10ce454ca4
madurez: T0
