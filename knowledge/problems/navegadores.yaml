id: NAV-024
area: programas
titulo:
  sencillo: "Quiero dejar Chrome como recién instalado"
  tecnico: "Restablecer la configuración predeterminada de Chrome"
explicacion:
  sencillo: "Si Chrome anda raro, cambia solo de buscador o abre propaganda, se puede volver a su configuración original sin perder tus favoritos ni tus contraseñas guardadas. Ojo: se desactivan las extensiones y se borran las cookies, así que vas a tener que volver a entrar en tus páginas."
  tecnico: "Más > Configuración > Restablecer la configuración: buscador, página principal, pestañas fijadas, permisos de sitios, cookies, extensiones y temas vuelven a los valores originales."
frases: ["restablecer el chrome", "dejar el chrome de fábrica", "el chrome quedó todo cambiado y quiero volverlo como antes", "resetear la configuración del navegador"]
pasos:
  - texto: "Antes: tené a mano el usuario y la clave de tus páginas, porque se borran las cookies y se cierran las sesiones. Los favoritos y las contraseñas guardadas no se borran."
  - texto: "Si sospechás de un programa raro, revisá primero los programas instalados y desinstalá los que no reconozcas."
    abrir: "ms-settings:appsfeatures"
  - texto: "En Chrome: tres puntitos («Más») > «Configuración» > «Restablecer la configuración» > «Restablecer la configuración a los valores predeterminados originales» > «Restablecer la configuración»."
    abrir: "https://support.google.com/chrome/answer/3296214?hl=es-419"
  - texto: "Después, volvé a activar solo las extensiones que conocés y confiás."
    abrir: "https://support.google.com/chrome/answer/2765944?hl=es-419&co=GENIE.Platform%3DDesktop"
fuentes:
  - https://support.google.com/chrome/answer/3296214?hl=es-419
  - https://support.google.com/chrome/answer/2765944?hl=es-419&co=GENIE.Platform%3DDesktop
