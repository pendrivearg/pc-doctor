# Navegadores (Microsoft Edge y Google Chrome): errores de conexión y certificado, caché y cookies, pestañas, favoritos, contraseñas, descargas, permisos, extensiones y más. Guiadas con fuente oficial.
id: NAV-001
area: seguridad
titulo:
  sencillo: "El navegador dice «La conexión no es privada»"
  tecnico: "Errores de certificado (NET::ERR_CERT_AUTHORITY_INVALID, ERR_CERT_COMMON_NAME_INVALID, ERR_CERT_DATE_INVALID)"
explicacion:
  sencillo: "Ese cartel aparece cuando el navegador no puede comprobar que la página sea segura. No pongas claves ni datos de tarjeta en esa página hasta que el aviso desaparezca."
  tecnico: "Falla la validación del certificado TLS: portal cautivo, extensión o antivirus que inspecciona HTTPS, sistema desactualizado o fecha y hora incorrectas."
frases: ["me sale que la conexión no es privada", "dice net::err_cert_authority_invalid", "error de certificado en una página", "el navegador dice que el sitio no es seguro y no me deja entrar", "aparece un candado rojo tachado"]
pasos:
  - texto: "Si estás en un Wi-Fi de bar, hotel o aeropuerto, puede que la red pida aceptar sus condiciones primero: abrí cualquier página y fijate si aparece la pantalla de acceso de esa red."
  - texto: "Si el cartel habla del reloj («El reloj está atrasado» o ERR_CERT_DATE_INVALID), corregí la fecha y la hora de la compu desde Configuración."
    abrir: "ms-settings:dateandtime"
  - texto: "Probá abrir la misma página en una ventana de incógnito (Ctrl + Mayús + N en Chrome). Si ahí anda, el problema es una extensión: desactivalas y probá de a una."
  - texto: "Actualizá Windows. Si tu antivirus tiene una opción de «análisis HTTPS» o «protección web», puede estar causando el aviso: Google explica cómo revisarlo. Nunca instales certificados que te pida una página."
    abrir: "https://support.google.com/chrome/answer/95669?hl=es-419"
derivar: "Si el aviso aparece en todas las páginas, escribile a PC Doctor «la hora de la computadora está mal»."
fuentes:
  - https://support.google.com/chrome/answer/95669?hl=es-419
  - https://support.google.com/chrome/answer/157179?hl=es-419
madurez: T0
---
id: NAV-002
area: programas
titulo:
  sencillo: "Quiero actualizar el navegador"
  tecnico: "Actualizar Google Chrome y Microsoft Edge"
explicacion:
  sencillo: "Los navegadores se actualizan casi solos, pero a veces esperan a que los cierres y los vuelvas a abrir. Tenerlos al día corrige errores y te protege de páginas peligrosas."
  tecnico: "Chrome: Más > Ayuda > Acerca de Google Chrome > Reiniciar. Edge: Configuración y más > Configuración > Acerca de Microsoft Edge."
frases: ["cómo actualizo el chrome", "el navegador está desactualizado", "me dice que actualice el navegador", "qué versión de edge tengo"]
pasos:
  - texto: "En Chrome: tocá los tres puntitos de arriba a la derecha («Más») > «Ayuda» > «Acerca de Google Chrome». Si aparece «Reiniciar», tocalo: Chrome se cierra y vuelve a abrir con tus pestañas (las de incógnito no vuelven)."
    abrir: "https://support.google.com/chrome/answer/95414?hl=es-419"
  - texto: "En Edge: tocá los tres puntitos de arriba a la derecha («Configuración y más») > «Configuración» > «Acerca de Microsoft Edge». Si hay una actualización, se instala ahí; después reiniciá el navegador."
    abrir: "https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a"
fuentes:
  - https://support.google.com/chrome/answer/95414?hl=es-419
  - https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a
madurez: T0
---
id: NAV-003
area: red
titulo:
  sencillo: "Una página tarda y al final dice ERR_CONNECTION_TIMED_OUT"
  tecnico: "Tiempo de espera de conexión agotado (ERR_CONNECTION_TIMED_OUT, ERR_TIMED_OUT)"
explicacion:
  sencillo: "El navegador esperó y la página nunca contestó. Puede ser la página, tu Internet o algo de la compu que bloquea la conexión."
  tecnico: "El servidor no respondió dentro del tiempo límite: sitio caído, conexión inestable, firewall, antivirus o proxy."
frases: ["me sale err_connection_timed_out", "la página tarda una eternidad y no carga", "dice que el sitio tardó demasiado en responder", "se queda cargando y después da error"]
pasos:
  - texto: "Revisá que la dirección esté bien escrita y tocá «Volver a cargar esta página» (la flechita en círculo, arriba a la izquierda)."
  - texto: "Probá abrir otra página conocida. Si tampoco anda ninguna, el problema es tu Internet: apagá el módem y el router, esperá un minuto y prendelos."
    abrir: "ms-settings:network-status"
  - texto: "Si solo falla esa página, probá en una ventana de incógnito y, si ahí anda, desactivá las extensiones. Si sigue igual, puede que la página esté caída: probá más tarde."
    abrir: "https://support.google.com/chrome/answer/6098869?hl=es-419"
  - texto: "Revisá que el antivirus o el firewall no estén bloqueando el navegador."
derivar: "Si no abre ninguna página pero hay Internet, escribile a PC Doctor «hay Internet pero las páginas no abren»."
fuentes:
  - https://support.google.com/chrome/answer/6098869?hl=es-419
  - https://support.google.com/chrome/answer/95669?hl=es-419
madurez: T0
---
id: NAV-004
area: red
titulo:
  sencillo: "Dice que no se encuentra la dirección del sitio (ERR_NAME_NOT_RESOLVED)"
  tecnico: "Fallo de resolución de nombre (ERR_NAME_NOT_RESOLVED, DNS_PROBE_FINISHED_NXDOMAIN)"
explicacion:
  sencillo: "La compu no pudo encontrar a qué lugar de Internet corresponde ese nombre de página. Muchas veces es una letra mal escrita en la dirección o una página que ya no existe."
  tecnico: "La consulta DNS del dominio no devolvió dirección: error de tipeo, dominio inexistente o problema con el servidor DNS."
frases: ["me sale err_name_not_resolved", "dns_probe_finished_nxdomain", "no se puede acceder a este sitio", "dice que no encuentra la dirección ip del servidor"]
pasos:
  - texto: "Mirá con atención la dirección: una letra de más o de menos (por ejemplo «gogle» en vez de «google») alcanza para que no la encuentre. Corregila y tocá «Volver a cargar»."
  - texto: "Si la sacaste de un correo o mensaje, buscala en Google por su nombre en vez de usar el enlace."
  - texto: "Probá con otra página conocida. Si ninguna abre, revisá el Wi-Fi y reiniciá el módem y el router."
    abrir: "https://support.google.com/chrome/answer/6098869?hl=es-419"
derivar: "Si con Internet funcionando no abre ninguna página, escribile a PC Doctor «hay Internet pero las páginas no abren»."
fuentes:
  - https://support.google.com/chrome/answer/6098869?hl=es-419
  - https://support.google.com/chrome/answer/95669?hl=es-419
madurez: T0
---
id: NAV-005
area: programas
titulo:
  sencillo: "La página dice «demasiadas redirecciones» y no entra"
  tecnico: "Bucle de redireccionamiento (ERR_TOO_MANY_REDIRECTS)"
explicacion:
  sencillo: "La página te manda de un lado a otro sin parar y el navegador corta. Casi siempre se arregla borrando las cookies de ese sitio. Ojo: vas a tener que volver a entrar con tu usuario en esa página."
  tecnico: "Bucle de redirecciones HTTP, en general por cookies del sitio desactualizadas o dañadas."
frases: ["me sale err_too_many_redirects", "la página tiene un bucle de redireccionamiento", "la página se recarga sola sin parar y da error", "dice que te redireccionó demasiadas veces"]
pasos:
  - texto: "Antes de seguir: al borrar las cookies de esa página se cierra tu sesión ahí. Fijate que sepas tu usuario y clave de ese sitio."
  - texto: "En Chrome: tres puntitos («Más») > «Configuración» > «Privacidad y seguridad» > «Cookies de terceros» > «Ver todos los datos y permisos de sitios». Buscá el nombre de la página, tocá el tacho de basura a la derecha y confirmá con «Borrar»."
    abrir: "https://support.google.com/chrome/answer/95647?hl=es-419"
  - texto: "Volvé a abrir la página. Si sigue igual, el problema es de la página: avisale al dueño del sitio o probá más tarde."
    abrir: "https://support.google.com/chrome/answer/95669?hl=es-419"
fuentes:
  - https://support.google.com/chrome/answer/95669?hl=es-419
  - https://support.google.com/chrome/answer/95647?hl=es-419
madurez: T0
