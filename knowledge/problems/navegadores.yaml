id: NAV-011
area: programas
titulo:
  sencillo: "Quiero guardar mis favoritos o pasarlos a otro navegador"
  tecnico: "Exportar e importar favoritos (archivo HTML)"
explicacion:
  sencillo: "Los favoritos (las páginas que marcaste con la estrellita) se pueden guardar en un archivo y después cargarlos en otro navegador o en otra compu."
  tecnico: "Chrome: Administrador de favoritos > Exportar favoritos (HTML). Edge: Configuración > Perfiles > Importar datos del explorador."
frases: ["cómo paso mis favoritos a la compu nueva", "exportar los marcadores", "guardar los favoritos del chrome", "pasar los favoritos de chrome a edge"]
pasos:
  - texto: "En Chrome, para guardarlos en un archivo: tres puntitos («Más») > «Favoritos y listas» > «Administrador de favoritos». Arriba, tocá los tres puntitos > «Exportar favoritos» y guardá el archivo (por ejemplo en un pendrive)."
    abrir: "https://support.google.com/chrome/answer/96816?hl=es-419"
  - texto: "Para cargarlos en Chrome desde ese archivo: «Más» > «Favoritos y listas» > «Importar favoritos y configuración» > «Seleccionar archivo»."
  - texto: "Para pasarlos a Edge: «Configuración y más» > «Configuración» > «Perfiles» > la opción para importar datos de otro navegador. Elegí Chrome directamente o, en otras ubicaciones, el archivo HTML de favoritos. Aparecen en una carpeta de la barra de favoritos."
    abrir: "https://support.microsoft.com/en-gb/edge/import-your-favorites-and-passwords-in-microsoft-edge"
  - texto: "Otra opción: si iniciás sesión con la misma cuenta en las dos compus, los favoritos se pasan solos. Escribile a PC Doctor «sincronizar el navegador»."
fuentes:
  - https://support.google.com/chrome/answer/96816?hl=es-419
  - https://support.microsoft.com/en-gb/edge/import-your-favorites-and-passwords-in-microsoft-edge
madurez: T0
---
id: NAV-012
area: programas
titulo:
  sencillo: "Desaparecieron mis favoritos o la barra de favoritos"
  tecnico: "Mostrar la barra de favoritos y buscar marcadores"
explicacion:
  sencillo: "Muchas veces los favoritos siguen ahí y solo se ocultó la barra de arriba. Si los borraste, Chrome no los puede recuperar, pero si tenías la sincronización activa pueden estar en tu cuenta."
  tecnico: "Chrome: Más > Favoritos y listas > Mostrar barra de favoritos; búsqueda con @favoritos; un favorito borrado no se recupera."
frases: ["se me borraron los favoritos", "desapareció la barra de marcadores", "no encuentro mis páginas guardadas", "dónde quedaron mis favoritos"]
pasos:
  - texto: "En Chrome: tres puntitos («Más») > «Favoritos y listas» > «Mostrar barra de favoritos»."
    abrir: "https://support.google.com/chrome/answer/188842?hl=es-419"
  - texto: "Para buscar uno: en la barra de direcciones escribí @favoritos, apretá la barra espaciadora y escribí parte del nombre. O abrí el «Administrador de favoritos» con Ctrl + Mayús + O."
    abrir: "https://support.google.com/chrome/answer/157179?hl=es-419"
  - texto: "Google aclara que un favorito borrado no se puede recuperar. Si usabas tu cuenta de Google en otra compu o en el celular, fijate si siguen ahí y activá la sincronización."
    abrir: "https://support.google.com/chrome/answer/165139?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Si cambiaste de navegador, quizás estén en el otro: escribile a PC Doctor «pasar los favoritos a otro navegador»."
fuentes:
  - https://support.google.com/chrome/answer/188842?hl=es-419
  - https://support.google.com/chrome/answer/157179?hl=es-419
  - https://support.google.com/chrome/answer/165139?hl=es-419&co=GENIE.Platform%3DDesktop
madurez: T0
