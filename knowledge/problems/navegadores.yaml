id: NAV-021
area: perifericos
titulo:
  sencillo: "Una página no puede usar mi cámara o mi micrófono"
  tecnico: "Permisos de cámara y micrófono por sitio en Chrome y Edge"
explicacion:
  sencillo: "Para una videollamada en el navegador, la página necesita tu permiso para usar la cámara y el micrófono. Si alguna vez tocaste «No permitir», hay que cambiarlo."
  tecnico: "Permiso por sitio en el navegador más el permiso de Windows «Permitir que las aplicaciones de escritorio accedan a la cámara/micrófono»."
frases: ["la página no me toma la cámara", "en la videollamada por el navegador no me escuchan", "bloqueé la cámara sin querer en una página", "el meet no detecta el micrófono"]
pasos:
  - texto: "Cuando la página pregunte, tocá «Permitir mientras visitas el sitio». Si ya la bloqueaste: tocá el ícono que está a la izquierda de la dirección > «Configuración de sitios» y cambiá «Cámara» y «Micrófono» a «Permitir»."
    abrir: "https://support.google.com/chrome/answer/114662?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "También en Chrome: «Más» > «Configuración» > «Privacidad y seguridad» > «Configuración de sitios» > «Cámara» o «Micrófono». Ahí ves los sitios bloqueados y podés elegir qué cámara o micrófono usar."
    abrir: "https://support.google.com/chrome/answer/2693767?hl=es-419"
  - texto: "Revisá que Windows deje usar la cámara a las aplicaciones de escritorio (los navegadores cuentan como tales)."
    abrir: "ms-settings:privacy-webcam"
  - texto: "Lo mismo para el micrófono. Después cerrá y volvé a abrir el navegador."
    abrir: "ms-settings:privacy-microphone"
derivar: "Si la cámara no anda en ningún programa, escribile a PC Doctor «no funciona la cámara»."
fuentes:
  - https://support.google.com/chrome/answer/2693767?hl=es-419
  - https://support.google.com/chrome/answer/114662?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.microsoft.com/windows/privacy/windows-camera-microphone-and-privacy
madurez: T0
