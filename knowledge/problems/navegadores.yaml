id: NAV-019
area: seguridad
titulo:
  sencillo: "Quiero navegar sin que quede guardado (modo incógnito o InPrivate)"
  tecnico: "Ventana de incógnito (Chrome) e InPrivate (Edge)"
explicacion:
  sencillo: "En una ventana de incógnito el navegador no guarda las páginas que visitaste ni las cookies cuando la cerrás. Sirve en una compu prestada. Ojo: no te hace invisible; la página que visitás y quien maneja la red pueden ver lo que hacés."
  tecnico: "Chrome: Ctrl + Mayús + N. Edge: Configuración y más > Nueva ventana InPrivate. Se conservan descargas y favoritos."
frases: ["abrir una ventana de incógnito", "navegar en privado", "que no quede el historial de lo que busco", "entrar a mi correo en una compu ajena sin que quede guardado"]
pasos:
  - texto: "En Chrome: apretá Ctrl + Mayús + N, o tres puntitos («Más») > «Nueva ventana de incógnito»."
    abrir: "https://support.google.com/chrome/answer/95464?hl=es-419"
  - texto: "En Edge: tres puntitos («Configuración y más») > «Nueva ventana InPrivate»."
    abrir: "https://support.microsoft.com/en-gb/edge/browse-inprivate-in-microsoft-edge"
  - texto: "Lo que descargues y los favoritos que agregues sí quedan guardados en la compu."
  - texto: "Cuando termines, cerrá todas las ventanas de incógnito con la X de arriba a la derecha: recién ahí se borra lo de esa sesión."
fuentes:
  - https://support.google.com/chrome/answer/95464?hl=es-419
  - https://support.microsoft.com/en-gb/edge/browse-inprivate-in-microsoft-edge
madurez: T0
