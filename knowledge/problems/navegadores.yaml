id: NAV-014
area: programas
titulo:
  sencillo: "El navegador completa solo mi dirección o mi tarjeta y quiero cambiarlo"
  tecnico: "Autocompletar: direcciones y métodos de pago"
explicacion:
  sencillo: "El navegador puede recordar tu nombre, dirección o tarjeta para llenar formularios más rápido. Podés corregir esos datos, borrarlos o apagar la función."
  tecnico: "Chrome: Más > Contraseñas y autocompletar (Pagos, direcciones). Edge: Configuración > Contraseñas y autocompletar > Direcciones y más."
frases: ["el navegador me completa una dirección vieja", "borrar la tarjeta guardada en el chrome", "no quiero que se autocomplete el formulario", "cambiar los datos que completa solo el navegador"]
pasos:
  - texto: "En Chrome: tres puntitos («Más») > «Contraseñas y autocompletar». Elegí la categoría (por ejemplo «Pagos» o direcciones). Con los tres puntitos al lado de cada dato podés «Editar» o «Borrar»."
    abrir: "https://support.google.com/chrome/answer/142893?hl=es-419"
  - texto: "Para que Chrome no complete más esa información, apagá «Guardar y completar» en esa misma categoría."
  - texto: "En Edge: «Configuración» > «Contraseñas y autocompletar» > «Direcciones y más». Ahí podés editar o borrar los datos, o apagar la opción de guardar y completar direcciones."
    abrir: "https://support.microsoft.com/edge/get-started-with-autofill-microsoft-edge"
  - texto: "Si tenés la sesión iniciada con tu cuenta, los cambios se aplican también en tus otros dispositivos."
fuentes:
  - https://support.google.com/chrome/answer/142893?hl=es-419
  - https://support.microsoft.com/edge/get-started-with-autofill-microsoft-edge
madurez: T0
