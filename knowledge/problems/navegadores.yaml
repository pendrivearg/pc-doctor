id: NAV-023
area: seguridad
titulo:
  sencillo: "Tengo extensiones raras en el navegador"
  tecnico: "Revisar, desactivar y quitar extensiones de Chrome y Edge"
explicacion:
  sencillo: "Las extensiones son agregados del navegador. Algunas se instalan sin que te des cuenta y muestran publicidad o cambian páginas. Las que no reconocés conviene quitarlas."
  tecnico: "Chrome: Más > Extensiones > Administrar extensiones. Edge: Extensiones > Administrar extensiones. Quitar las desconocidas y revisar programas instalados."
frases: ["me apareció una extensión que no instalé", "hay un agregado raro en el chrome", "cómo saco una extensión del navegador", "el navegador tiene una barra de herramientas que no puse"]
pasos:
  - texto: "En Chrome: tres puntitos («Más») > «Extensiones» > «Administrar extensiones». Con el interruptor la desactivás; con «Quitar» la borrás."
    abrir: "https://support.google.com/chrome_webstore/answer/2664769?hl=es-419"
  - texto: "En Edge: tocá el botón «Extensiones», a la derecha de la barra de direcciones (o tres puntitos > «Extensiones») > «Administrar extensiones». Usá el interruptor para apagarla o «Quitar de Microsoft Edge» para borrarla."
    abrir: "https://support.microsoft.com/edge/add-turn-off-or-remove-extensions-in-microsoft-edge"
  - texto: "Si la extensión vuelve sola, puede haber un programa no deseado: revisá la lista de programas instalados y desinstalá lo que no reconozcas."
    abrir: "ms-settings:appsfeatures"
  - texto: "Pasá un análisis con Seguridad de Windows. En la compu del trabajo, algunas extensiones las pone la empresa: consultá antes de quitarlas."
    abrir: "ms-settings:windowsdefender"
fuentes:
  - https://support.google.com/chrome_webstore/answer/2664769?hl=es-419
  - https://support.google.com/chrome/answer/2765944?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.microsoft.com/edge/add-turn-off-or-remove-extensions-in-microsoft-edge
  - https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a
madurez: T0
