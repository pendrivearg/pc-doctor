id: NAV-018
area: archivos
titulo:
  sencillo: "Quiero abrir un PDF en el navegador (o que se descargue en vez de abrirse)"
  tecnico: "Visor de PDF del navegador y programa predeterminado para PDF"
explicacion:
  sencillo: "Chrome y Edge abren los PDF directamente, sin instalar nada: los podés leer, imprimir, completar y firmar. Si preferís que se descarguen, también se puede elegir."
  tecnico: "Visor de PDF integrado; Chrome: chrome://settings/content/pdfDocuments; programa predeterminado para .pdf en Aplicaciones predeterminadas."
frases: ["no puedo abrir un pdf", "quiero que el pdf se abra en el navegador", "el pdf se descarga y no se abre", "completar un formulario pdf en la compu"]
pasos:
  - texto: "Tocá el enlace del PDF: se abre en una pestaña. Si no se abre, usá el menú de Chrome y elegí «Abrir en una pestaña nueva» o «Descargar»."
    abrir: "https://support.google.com/chrome/answer/16215622?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Dentro del PDF podés «Agregar texto» para completarlo o «Dibujar» para firmarlo, y bajarlo con tus cambios con el ícono de descarga."
  - texto: "Para elegir si los PDF se abren en Chrome o se descargan: escribí chrome://settings/content/pdfDocuments en la barra de direcciones y elegí la opción."
  - texto: "Para que los PDF de la compu se abran siempre con un programa (Edge, Chrome u otro lector), cambialo en Aplicaciones predeterminadas."
    abrir: "ms-settings:defaultapps"
fuentes:
  - https://support.google.com/chrome/answer/16215622?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.google.com/chrome/answer/95417?hl=es-419&co=GENIE.Platform%3DDesktop
madurez: T0
