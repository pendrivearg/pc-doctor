id: NAV-008
area: rendimiento
titulo:
  sencillo: "El navegador anda muy lento"
  tecnico: "Navegador lento: memoria, extensiones y versión"
explicacion:
  sencillo: "Cuando hay muchas pestañas abiertas o extensiones de más, el navegador se pone pesado. Se puede ver qué lo está frenando y cerrarlo."
  tecnico: "Consumo de memoria por pestañas y extensiones; Administrador de tareas del navegador (Mayús + Esc); actualización pendiente."
frases: ["el chrome anda lentísimo", "internet anda lento solo en el navegador", "el navegador tarda mucho en abrir las páginas", "el edge se pone pesado"]
pasos:
  - texto: "Cerrá las pestañas que no estés usando y las descargas que no necesites."
  - texto: "En Chrome, apretá Mayús + Esc: se abre el Administrador de tareas de Chrome, donde ves qué tenés abierto adentro del navegador."
    abrir: "https://support.google.com/chrome/answer/157179?hl=es-419"
  - texto: "Desinstalá las extensiones que no uses. Escribile a PC Doctor «extensiones sospechosas en el navegador» si no sabés cuáles son."
    abrir: "https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a"
  - texto: "Actualizá el navegador y reinicialo. Si anda lenta toda la computadora, no solo el navegador, escribile a PC Doctor «la computadora está lenta»."
    abrir: "https://support.google.com/chrome/answer/6098869?hl=es-419"
fuentes:
  - https://support.google.com/chrome/answer/6098869?hl=es-419
  - https://support.google.com/chrome/answer/157179?hl=es-419
  - https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a
madurez: T0
