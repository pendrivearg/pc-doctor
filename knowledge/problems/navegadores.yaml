id: NAV-022
area: seguridad
titulo:
  sencillo: "Una página me pide la ubicación y no sé si darla"
  tecnico: "Permiso de ubicación por sitio en Chrome y Edge"
explicacion:
  sencillo: "Algunas páginas (mapas, delivery, el clima) piden saber dónde estás. Podés permitirlo solo a las que confiás y bloquearlo en las demás."
  tecnico: "Permiso de ubicación por sitio y predeterminado; en Windows además depende de la configuración de ubicación del sistema."
frases: ["una página quiere saber mi ubicación", "cómo saco el permiso de ubicación de una página", "la página del mapa no sabe dónde estoy", "no quiero que las páginas sepan dónde vivo"]
pasos:
  - texto: "Cuando una página pregunte, tocá «Permitir» solo si confiás en ella y la necesitás (por ejemplo un mapa)."
  - texto: "Para cambiarlo en una página: tocá el ícono a la izquierda de la dirección > «Configuración de sitios» (Chrome) o «Permisos para este sitio» (Edge) y elegí permitir o bloquear la ubicación."
    abrir: "https://support.google.com/chrome/answer/114662?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Para todas las páginas en Chrome: «Más» > «Configuración» > «Privacidad y seguridad» > «Configuración de sitios» > «Ubicación» y elegí la opción predeterminada."
    abrir: "https://support.google.com/chrome/answer/142065?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "En Edge: «Configuración» > «Privacidad, búsqueda y servicios» > «Permisos del sitio» > «Todos los permisos» > «Ubicación». Si una página de mapas no te ubica, revisá también que la ubicación esté activada en Windows."
    abrir: "https://support.microsoft.com/edge/location-and-privacy-in-microsoft-edge"
fuentes:
  - https://support.google.com/chrome/answer/142065?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.google.com/chrome/answer/114662?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.microsoft.com/edge/location-and-privacy-in-microsoft-edge
madurez: T0
