id: NAV-007
area: programas
titulo:
  sencillo: "Una página se ve desarmada o rota"
  tecnico: "Página que no carga bien: caché, extensiones o recarga forzada"
explicacion:
  sencillo: "A veces una página aparece toda desordenada, sin imágenes o con botones que no andan. Suele arreglarse recargándola bien, probando sin extensiones o borrando la caché."
  tecnico: "Recursos en caché desactualizados o extensiones que modifican la página; recargar ignorando la caché (Mayús + F5)."
frases: ["la página se ve toda desarmada", "no cargan las imágenes de una página", "la página se ve rara y los botones no funcionan", "la página aparece toda desordenada"]
pasos:
  - texto: "Apretá Mayús + F5: recarga la página sin usar lo que el navegador tenía guardado."
    abrir: "https://support.google.com/chrome/answer/157179?hl=es-419"
  - texto: "Abrí la página en una ventana de incógnito (Ctrl + Mayús + N). Si ahí se ve bien, una extensión la está rompiendo: desactivá las extensiones y volvé a activarlas de a una."
    abrir: "https://support.google.com/chrome/answer/6098869?hl=es-419"
  - texto: "Si sigue igual, borrá la caché y las cookies (vas a tener que volver a iniciar sesión en tus páginas). Escribile a PC Doctor «borrar la caché del navegador»."
  - texto: "Probá con otro navegador. Si en todos se ve mal, el problema es de la página."
    abrir: "https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a"
fuentes:
  - https://support.google.com/chrome/answer/157179?hl=es-419
  - https://support.google.com/chrome/answer/6098869?hl=es-419
  - https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a
madurez: T0
