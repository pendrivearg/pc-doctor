id: NAV-025
area: programas
titulo:
  sencillo: "El navegador se abre solo"
  tecnico: "Navegador que se inicia con Windows, aumento de inicio de Edge o software no deseado"
explicacion:
  sencillo: "Si el navegador se abre solo al prender la compu, puede estar puesto para arrancar con Windows. Si además abre pestañas o propaganda por su cuenta, puede haber un programa no deseado."
  tecnico: "Aplicaciones de inicio de Windows; Edge «Aumento de inicio» deja procesos en segundo plano; pestañas que se abren solas son señal de software no deseado."
frases: ["el chrome se abre solo cuando prendo la compu", "se me abre el navegador sin que lo toque", "el edge arranca solo con windows", "se abren pestañas solas"]
pasos:
  - texto: "Abrí Aplicaciones de inicio y apagá el navegador si aparece en la lista: así no arranca solo con Windows."
    abrir: "ms-settings:startupapps"
  - texto: "En Edge existe el «aumento de inicio», que lo deja preparado en segundo plano para que abra más rápido. Se maneja escribiendo edge://settings/system/manageSystem en la barra de direcciones."
    abrir: "https://support.microsoft.com/edge/get-help-with-startup-boost"
  - texto: "Si al abrirse aparecen páginas de propaganda o pestañas que no pediste, revisá los programas instalados y las extensiones, y desinstalá lo que no reconozcas."
    abrir: "https://support.google.com/chrome/answer/2765944?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Pasá un análisis con Seguridad de Windows."
    abrir: "ms-settings:windowsdefender"
