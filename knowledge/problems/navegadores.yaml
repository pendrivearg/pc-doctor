id: NAV-013
area: seguridad
titulo:
  sencillo: "¿Dónde están las contraseñas que guardó el navegador?"
  tecnico: "Administrador de contraseñas de Google y Microsoft Password Manager"
explicacion:
  sencillo: "Chrome y Edge pueden guardar tus claves de las páginas. Se administran en una sección del navegador que te pide el PIN o la clave de la compu antes de mostrarlas. PC Doctor nunca las lee ni te las pide."
  tecnico: "Chrome: Más > Contraseñas y autocompletar > Administrador de contraseñas de Google. Edge: Configuración > Contraseñas y autocompletar > Microsoft Password Manager."
frases: ["dónde guarda las claves el chrome", "quiero ver una contraseña que guardé en el navegador", "el navegador recuerda mis claves y no sé dónde", "que el navegador deje de preguntar si guardo la contraseña"]
pasos:
  - texto: "En Chrome: tres puntitos («Más») > «Contraseñas y autocompletar» > «Administrador de contraseñas de Google». Ahí podés ver tus sitios guardados, borrar uno («Borrar») o, en «Configuración», apagar «Ofrecer guardar contraseñas y llaves de acceso»."
    abrir: "https://support.google.com/chrome/answer/95606?hl=es-419"
  - texto: "En Edge: tres puntitos («Configuración y más») > «Configuración» > «Contraseñas y autocompletar» > «Microsoft Password Manager». Para ver una clave, Windows te pide tu PIN o la clave de la compu."
    abrir: "https://support.microsoft.com/microsoft-edge/save-or-forget-passwords-in-microsoft-edge-b4beecb0-f2a8-1ca0-f26f-9ec247a3f336"
  - texto: "Cambiar una clave en el navegador no la cambia en la página: si la cambiás, hacelo en los dos lados. No le muestres ni le dictes tus claves a nadie que te las pida por teléfono o mensaje."
fuentes:
  - https://support.google.com/chrome/answer/95606?hl=es-419
  - https://support.microsoft.com/microsoft-edge/save-or-forget-passwords-in-microsoft-edge-b4beecb0-f2a8-1ca0-f26f-9ec247a3f336
madurez: T0
