id: NAV-020
area: programas
titulo:
  sencillo: "Quiero tener los mismos favoritos y claves en la compu y en el celular"
  tecnico: "Sincronizar Chrome (Cuenta de Google) y Edge (cuenta de Microsoft)"
explicacion:
  sencillo: "Si entrás al navegador con tu cuenta (de Google en Chrome, de Microsoft en Edge), tus favoritos, contraseñas y otras cosas aparecen en todos tus dispositivos, y no se pierden si cambiás de compu."
  tecnico: "Chrome: Configuración > Tú y Google. Edge: ícono de perfil > Iniciar sesión para sincronizar datos; Configuración > Perfiles > Sincronizar."
frases: ["sincronizar los favoritos con el celular", "tener mis cosas del chrome en otra compu", "que el edge me guarde todo en la cuenta", "no me aparecen los favoritos en el celular"]
pasos:
  - texto: "En Chrome: tocá tu foto o el ícono de perfil arriba a la derecha > «Acceder a Chrome» y entrá con tu cuenta de Google. Para elegir qué se guarda: «Más» > «Configuración» > «Tú y Google» > tu nombre."
    abrir: "https://support.google.com/chrome/answer/165139?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "En Edge: tocá el ícono de perfil arriba a la derecha, elegí tu cuenta de Microsoft y «Iniciar sesión para sincronizar datos». Qué se sincroniza se elige en «Configuración» > «Perfiles» > «Sincronizar»."
    abrir: "https://support.microsoft.com/en-gb/edge/sign-in-to-sync-microsoft-edge-across-devices"
  - texto: "En el celular, abrí el mismo navegador y entrá con la misma cuenta."
    abrir: "https://support.google.com/chrome/answer/185277?hl=es-419"
  - texto: "Si en una compu ajena entraste con tu cuenta, salí al terminar («Salir de Chrome» en el ícono de perfil)."
fuentes:
  - https://support.google.com/chrome/answer/165139?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.google.com/chrome/answer/185277?hl=es-419
  - https://support.microsoft.com/en-gb/edge/sign-in-to-sync-microsoft-edge-across-devices
madurez: T0
