id: NAV-016
area: basico
titulo:
  sencillo: "Quiero traducir una página que está en otro idioma"
  tecnico: "Traducir páginas (Google Traductor en Chrome, Microsoft Translator en Edge)"
explicacion:
  sencillo: "Chrome y Edge pueden mostrarte en castellano una página que está en inglés u otro idioma, con un solo clic."
  tecnico: "Ícono de traducir en la barra de direcciones o clic derecho > Traducir; se activa en Configuración > Idiomas."
frases: ["traducir una página en inglés", "la página está en otro idioma", "cómo pongo la página en español", "el navegador no me ofrece traducir"]
pasos:
  - texto: "En Chrome: tocá el ícono de traducir a la derecha de la barra de direcciones, o hacé clic derecho en la página > «Traducir al español». Si no traduce, recargá la página."
    abrir: "https://support.google.com/chrome/answer/173424?hl=es-419"
  - texto: "En Edge: cuando aparece el aviso, elegí el idioma y tocá «Traducir». Si no aparece, tocá el ícono de traducir en la barra de direcciones. Para volver al idioma original, el mismo ícono tiene «Mostrar original»."
    abrir: "https://support.microsoft.com/en-gb/topic/use-microsoft-translator-in-microsoft-edge-browser-4ad1c6cb-01a4-4227-be9d-a81e127fcb0b"
  - texto: "Si nunca te ofrece traducir: en Chrome, «Configuración» > «Idiomas» > activá «Usar Google Traductor»; en Edge, «Configuración» > «Idiomas» > activá la opción de ofrecer traducir las páginas."
fuentes:
  - https://support.google.com/chrome/answer/173424?hl=es-419
  - https://support.microsoft.com/en-gb/topic/use-microsoft-translator-in-microsoft-edge-browser-4ad1c6cb-01a4-4227-be9d-a81e127fcb0b
madurez: T0
