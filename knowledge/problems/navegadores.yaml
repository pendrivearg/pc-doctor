id: NAV-017
area: perifericos
titulo:
  sencillo: "Quiero imprimir una página de Internet"
  tecnico: "Imprimir desde Chrome o Edge (Ctrl + P)"
explicacion:
  sencillo: "Cualquier página se puede imprimir, entera o solo algunas hojas, y también guardarla como PDF."
  tecnico: "Ctrl + P abre la vista de impresión: destino, páginas, diseño, color y más opciones; Edge: Ctrl + Mayús + P abre el diálogo del sistema."
frases: ["imprimir una página web", "cómo imprimo lo que estoy viendo en internet", "imprimir solo una hoja de la página", "imprimir un comprobante desde el navegador"]
pasos:
  - texto: "Apretá Ctrl + P. En «Destino» (o «Impresora») elegí tu impresora, o «Guardar como PDF» si querés guardarlo."
    abrir: "https://support.google.com/chrome/answer/1069693?hl=es-419"
  - texto: "En «Páginas» podés elegir todas o escribir solo algunas (por ejemplo 1-2). Revisá la vista previa y tocá «Imprimir»."
    abrir: "https://support.microsoft.com/edge/print-in-microsoft-edge"
  - texto: "Para imprimir solo una parte: seleccioná el texto con el mouse, hacé clic derecho sobre lo marcado y elegí «Imprimir»."
  - texto: "Si la impresora no responde, escribile a PC Doctor «la impresora no imprime»."
fuentes:
  - https://support.google.com/chrome/answer/1069693?hl=es-419
  - https://support.microsoft.com/edge/print-in-microsoft-edge
madurez: T0
