id: PWR-SCR-001
area: windows
titulo:
  sencillo: "La pantalla se apaga o la compu se duerme demasiado rápido"
  tecnico: "Tiempos de apagado de pantalla y suspensión"
explicacion:
  sencillo: "Windows apaga la pantalla y duerme la computadora después de unos minutos sin tocarla, para ahorrar energía. Ese tiempo se puede alargar."
  tecnico: "Configuración > Sistema > Energía y batería > Tiempos de espera de pantalla, suspensión e hibernación (con batería y enchufada)."
frases: ["la pantalla se apaga sola a cada rato", "la compu se duerme muy rápido", "se apaga la pantalla mientras leo", "que la pantalla no se apague tan rápido"]
pasos:
  - texto: "Abrí Energía y elegí más minutos en «Apagar la pantalla después de» y «Suspender el dispositivo después de» (hay un valor enchufada y otro con batería)."
    abrir: "ms-settings:powersleep"
  - texto: "Si la computadora se apaga del todo (no solo la pantalla), es otro problema: pasá el diagnóstico de PC Doctor."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/power-settings-in-windows-11-0d6a2b6b-2e87-4611-9980-ac9ea2175734"
fuentes:
  - https://support.microsoft.com/windows/power-settings-in-windows-11-0d6a2b6b-2e87-4611-9980-ac9ea2175734
madurez: T0
