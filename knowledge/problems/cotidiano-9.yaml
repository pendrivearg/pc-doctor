# Pantalla (brillo, apagado, fondo), teclado en pantalla, notebook que no carga, fotos del iPhone, instalar programas seguros y encontrar documentos. Guiadas con fuente oficial.
id: DSP-BRI-001
area: windows
titulo:
  sencillo: "La pantalla está muy oscura o muy brillante"
  tecnico: "Brillo de la pantalla"
explicacion:
  sencillo: "En las notebooks el brillo se cambia desde Windows. En las computadoras de escritorio, casi siempre con los botones del propio monitor."
  tecnico: "Control deslizante de brillo (configuración rápida o Sistema > Pantalla); en monitores externos, el menú del monitor."
frases: ["la pantalla está muy oscura", "subir el brillo de la pantalla", "la pantalla brilla demasiado y me molesta", "cómo bajo el brillo"]
pasos:
  - texto: "Notebook: tocá el ícono de Wi-Fi (abajo a la derecha) y mové la barrita del brillo. También está en Configuración > Sistema > Pantalla."
    abrir: "ms-settings:display"
  - texto: "Computadora de escritorio: usá los botones del monitor (suelen estar abajo o al costado) y buscá «Brillo» en su menú."
  - texto: "Si en una notebook la barrita no aparece o no cambia nada, puede faltar el controlador de video: pasá el diagnóstico de PC Doctor."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/change-display-brightness-and-color-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/change-display-brightness-and-color-in-windows
madurez: T0
