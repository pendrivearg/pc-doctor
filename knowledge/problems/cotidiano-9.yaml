id: FIL-FND-001
area: archivos
titulo:
  sencillo: "No encuentro un documento que guardé"
  tecnico: "Buscar archivos en Windows"
explicacion:
  sencillo: "Windows puede buscar un archivo por su nombre o por una palabra que tenga adentro. Lo último que usaste también aparece en el Explorador."
  tecnico: "Búsqueda de la barra de tareas (pestaña Documentos), búsqueda del Explorador desde Este equipo, y archivos recientes en Inicio del Explorador."
frases: ["no encuentro un documento que guardé", "dónde guardé el archivo", "perdí una carta que escribí en word", "buscar un archivo en la compu"]
pasos:
  - texto: "Tocá la lupa de la barra de tareas y escribí parte del nombre o una palabra del documento. Arriba elegí «Documentos» para ver solo eso."
  - texto: "Abrí el Explorador (Windows + E): en «Inicio» están los archivos que usaste hace poco. Para buscar en toda la PC, entrá a «Este equipo» y usá el cuadro de búsqueda."
  - texto: "En Word o Excel: Archivo > Abrir muestra los últimos documentos que usaste."
  - texto: "Si lo borraste, escribile a PC Doctor «borré un archivo sin querer». Microsoft explica cómo buscar."
    abrir: "https://support.microsoft.com/windows/find-your-files-and-apps-in-windows-5c7c8cfe-c289-fae4-f5f8-6b3fdba418d2"
fuentes:
  - https://support.microsoft.com/windows/find-your-files-and-apps-in-windows-5c7c8cfe-c289-fae4-f5f8-6b3fdba418d2
madurez: T0
