id: LAP-CHG-001
area: hardware
titulo:
  sencillo: "La notebook está enchufada pero no carga"
  tecnico: "La batería no carga o carga lento"
explicacion:
  sencillo: >-
    Suele ser el cargador (que no es el original o no da suficiente potencia), el enchufe, o el conector sucio.
    Si el ícono de la batería muestra un corazón, no es una falla: la notebook frena la carga a propósito para cuidar la batería.
  tecnico: "Cargador incompatible o de poca potencia, cable, puerto; carga inteligente (Smart charging) del fabricante."
frases: ["la notebook no carga", "está enchufada pero no carga la batería", "el cargador no carga la compu", "la batería no sube aunque esté enchufada"]
sondas: [bateria]
pasos:
  - texto: "Mirá el ícono de la batería (abajo a la derecha). Si tiene un corazón y dice «carga inteligente», es normal: la notebook decidió no cargar al 100 % para cuidar la batería."
    abrir: "https://support.microsoft.com/windows/experience/power-battery/use-smart-charging-in-windows"
  - texto: "Probá otro enchufe, revisá que el cable esté bien conectado en los dos lados y usá el cargador original de la notebook (otros pueden no dar suficiente potencia)."
  - texto: "Para que cargue más rápido, dejala cargando apagada o suspendida."
    abrir: "https://support.microsoft.com/windows/experience/power-battery/pc-is-charging-slowly-or-discharging-while-it-s-plugged-in"
derivar: "Si con el cargador original y otro enchufe sigue sin cargar, puede ser el cargador, el conector o la batería: consultá al fabricante o a un técnico."
fuentes:
  - https://support.microsoft.com/windows/experience/power-battery/pc-is-charging-slowly-or-discharging-while-it-s-plugged-in
  - https://support.microsoft.com/windows/experience/power-battery/use-smart-charging-in-windows
madurez: T0
