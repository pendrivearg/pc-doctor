id: BAS-BG-001
area: basico
titulo:
  sencillo: "Quiero cambiar la foto de fondo de la pantalla"
  tecnico: "Fondo de escritorio"
explicacion:
  sencillo: "Podés poner de fondo cualquier foto tuya, un color o las imágenes que trae Windows."
  tecnico: "Personalización > Fondo: imagen, color sólido, presentación o Windows destacado; o clic derecho en una imagen > Establecer como fondo de escritorio."
frases: ["cambiar el fondo de pantalla", "poner una foto mía de fondo en la compu", "cambiar la imagen del escritorio"]
pasos:
  - texto: "Lo más rápido: en el Explorador de archivos, clic derecho sobre la foto > «Establecer como fondo de escritorio»."
  - texto: "O desde Personalización > Fondo: elegí «Imagen» y tocá «Examinar fotos»."
    abrir: "ms-settings:personalization-background"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/personalization/change-the-desktop-background-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/personalization/change-the-desktop-background-in-windows
madurez: T0
