id: APP-STO-001
area: programas
titulo:
  sencillo: "Quiero instalar un programa sin riesgo de virus"
  tecnico: "Instalar aplicaciones desde fuentes de confianza (Microsoft Store)"
explicacion:
  sencillo: >-
    La forma más segura es la Microsoft Store, que viene con Windows: los programas de ahí se revisan y se actualizan solos.
    Si el programa no está, bajalo solo de la página oficial de quien lo hace, nunca de páginas de descargas con muchos botones.
  tecnico: "Microsoft recomienda instalar desde Microsoft Store; evitar instaladores de sitios de terceros (software no deseado incluido)."
frases: ["cómo instalo un programa sin que tenga virus", "dónde bajo programas seguros", "quiero instalar una aplicación", "descargar programas de forma segura"]
pasos:
  - texto: "Abrí Inicio > Microsoft Store, buscá el programa y tocá «Obtener» o «Instalar». Te puede pedir tu cuenta de Microsoft."
    abrir: "https://support.microsoft.com/accounts-billing/get-trusted-apps-and-games-from-microsoft-store"
  - texto: "Si no está en la Store, entrá a la página oficial del fabricante. Desconfiá de las páginas con varios botones de «Descargar» o que piden instalar otra cosa primero."
    abrir: "https://support.microsoft.com/windows/security/threat-malware-protection/protect-your-pc-from-unwanted-software"
fuentes:
  - https://support.microsoft.com/accounts-billing/get-trusted-apps-and-games-from-microsoft-store
  - https://support.microsoft.com/windows/security/threat-malware-protection/protect-your-pc-from-unwanted-software
madurez: T0
