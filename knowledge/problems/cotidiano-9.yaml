id: BAS-OSK-001
area: basico
titulo:
  sencillo: "El teclado no anda y necesito escribir igual"
  tecnico: "Teclado en pantalla (OSK)"
explicacion:
  sencillo: "Windows tiene un teclado que aparece en la pantalla y se usa con el mouse. Sirve para salir del paso hasta arreglar o cambiar el teclado, incluso para poner la clave al entrar."
  tecnico: "Teclado en pantalla: Windows + Ctrl + O, Accesibilidad > Teclado, o el botón de accesibilidad de la pantalla de inicio de sesión."
frases: ["se rompió el teclado y necesito escribir", "un teclado en la pantalla", "escribir con el mouse", "no tengo teclado para poner la clave"]
pasos:
  - texto: "En la pantalla para entrar a Windows: tocá el botón de accesibilidad (abajo a la derecha) > «Teclado en pantalla»."
  - texto: "Ya dentro de Windows: Accesibilidad > Teclado > activá «Teclado en pantalla». Hacé clic en las teclas con el mouse."
    abrir: "ms-settings:easeofaccess-keyboard"
  - texto: "Para ver por qué no anda el teclado, escribile a PC Doctor «el mouse o el teclado no funcionan»."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/use-the-on-screen-keyboard-osk-to-type"
fuentes:
  - https://support.microsoft.com/accessibility/windows/use-the-on-screen-keyboard-osk-to-type
madurez: T0
