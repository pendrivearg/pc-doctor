id: PHN-HEIC-001
area: archivos
titulo:
  sencillo: "Las fotos que pasé del iPhone no se abren en la compu"
  tecnico: "Fotos HEIC/HEIF y videos HEVC"
explicacion:
  sencillo: >-
    Los iPhone y algunos Android guardan las fotos en un formato (HEIC) que Windows no abre solo.
    Hay formas gratuitas de verlas: subirlas a OneDrive o mandártelas por correo, que las convierte.
  tecnico: "Formato HEIF/HEVC: extensiones de Microsoft Store (HEIF gratis, HEVC paga) o conversión automática al transferir o al subir a OneDrive."
frases: ["las fotos del iphone no se abren en la compu", "no puedo abrir fotos heic", "no puedo ver las fotos que pasé del celular", "dice que necesito una extensión para ver la foto"]
pasos:
  - texto: "Gratis: subí las fotos a OneDrive (con tu cuenta de Microsoft) o mandátelas por correo y guardalas desde ahí; en muchos casos se convierten solas a un formato común."
  - texto: "Otra opción: instalar las extensiones de Microsoft Store. Microsoft indica que hacen falta las dos: la de imágenes HEIF es gratis y la de video HEVC cuesta US$ 0,99."
  - texto: "Microsoft explica las tres opciones."
    abrir: "https://support.microsoft.com/windows/apps/photos/photos-app-video-editor-error-can-t-view-this-file-type"
fuentes:
  - https://support.microsoft.com/windows/apps/photos/photos-app-video-editor-error-can-t-view-this-file-type
madurez: T0
