# Seguridad, estafas y cuentas hackeadas: cuenta de Google, verificación en dos pasos, contraseñas filtradas, mensajes falsos, avisos de Windows y Defender. Guiadas con fuente oficial.
id: SEG-001
area: seguridad
titulo:
  sencillo: "Me hackearon el Gmail o la cuenta de Google"
  tecnico: "Proteger una Cuenta de Google comprometida"
explicacion:
  sencillo: "Si alguien entró a tu cuenta de Google, se puede echar y volver a cerrarla con llave: revisar qué pasó, sacar los aparatos que no son tuyos y cambiar la clave. Google nunca te pide la clave ni códigos por correo, llamada o mensaje."
  tecnico: "Cuenta de Google > Seguridad y acceso: eventos de seguridad recientes, dispositivos, cambio de contraseña, opciones de recuperación, filtros y reenvíos de Gmail, Verificación en 2 pasos."
frases: ["me hackearon el gmail", "alguien entró a mi cuenta de google", "mi mail manda correos que yo no mandé", "me robaron la cuenta de google", "creo que alguien usa mi gmail"]
pasos:
  - texto: "Si no podés entrar, usá solo la recuperación oficial de Google, desde una compu o celular que uses siempre. Nunca le pases la clave ni códigos a nadie que te escriba o te llame."
    abrir: "https://support.google.com/accounts/answer/7299973?hl=es-419"
  - texto: "Si podés entrar, abrí tu Cuenta de Google > «Seguridad y acceso» > «Revisar los eventos de seguridad». Si ves algo que no hiciste, tocá «No, no fui yo» y seguí las instrucciones."
  - texto: "En «Tus dispositivos» > «Administrar dispositivos», sacá los que no reconozcas. Cambiá la contraseña ya, y también en otros sitios donde usabas la misma."
  - texto: "Revisá que el teléfono y el correo de recuperación sean tuyos, y en Gmail borrá filtros y reenvíos que no hayas creado vos. Google lo explica paso por paso."
    abrir: "https://support.google.com/accounts/answer/6294825?hl=es-419"
  - texto: "Para que no vuelva a pasar, activá la verificación en 2 pasos: escribile a PC Doctor «quiero activar la verificación en dos pasos de Google»."
fuentes:
  - https://support.google.com/accounts/answer/6294825?hl=es-419
  - https://support.google.com/accounts/answer/7299973?hl=es-419
madurez: T0
