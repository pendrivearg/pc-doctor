id: SEG-016
area: seguridad
titulo:
  sencillo: "Me llegó un correo amenazándome con publicar videos míos si no pago"
  tecnico: "Correo de extorsión o sextorsión"
explicacion:
  sencillo: "Es una estafa conocida: buscan asustarte para que pagues rápido. Lo más importante es no pagar, no responder y no mandar nada."
  tecnico: "Sextorsión: chantaje con supuesto material íntimo; se basa en urgencia y miedo. Reportar como phishing y reforzar la seguridad de la cuenta."
frases: ["me llegó un mail diciendo que tienen videos míos", "me piden bitcoin o publican un video", "un correo me amenaza con mandar fotos a mis contactos", "dicen que hackearon mi cámara y me grabaron"]
pasos:
  - texto: "Mantené la calma y no pagues, no contestes ni mandes nada. Ninguna persona u organización seria te exige un pago en el momento."
    abrir: "https://support.google.com/faqs/answer/10123518?hl=es-419"
  - texto: "Si está en Gmail, abrí el correo, tocá «Más» al lado de «Responder» y elegí «Denunciar phishing». Después borralo."
    abrir: "https://support.google.com/mail/answer/8253?hl=es-419"
  - texto: "Si el correo menciona una contraseña tuya real, cambiala en todos los sitios donde la uses y activá la verificación en dos pasos."
    abrir: "https://support.google.com/accounts/answer/6294825?hl=es-419"
  - texto: "Si publicaron algo tuyo o la amenaza sigue, guardá los mensajes y hacé la denuncia."
fuentes:
  - https://support.google.com/faqs/answer/10123518?hl=es-419
  - https://support.google.com/mail/answer/8253?hl=es-419
  - https://support.google.com/accounts/answer/6294825?hl=es-419
madurez: T0
