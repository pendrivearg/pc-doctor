id: SEG-002
area: seguridad
titulo:
  sencillo: "Quiero revisar si mi cuenta de Google está segura"
  tecnico: "Verificación de seguridad de la Cuenta de Google"
explicacion:
  sencillo: "Google tiene un chequeo que en un par de minutos te dice qué conviene mejorar en tu cuenta: el teléfono de recuperación, los aparatos conectados, las aplicaciones con permiso y más."
  tecnico: "Verificación de seguridad (Acciones recomendadas): opciones de recuperación, llaves de acceso, Verificación en 2 pasos, apps vinculadas, bloqueo de pantalla."
frases: ["revisar la seguridad de mi cuenta de google", "cómo sé si mi gmail está seguro", "hacer el chequeo de seguridad de google", "google me dice que tengo acciones recomendadas"]
pasos:
  - texto: "Entrá a tu Cuenta de Google y abrí la Verificación de seguridad. Si aparece «Acciones recomendadas» con un signo de exclamación de color, hacé lo que te sugiere. Si ves un escudo verde, no hay nada urgente."
    abrir: "https://support.google.com/accounts/answer/46526?hl=es-419"
  - texto: "Fijate que el teléfono y el correo de recuperación estén al día: sirven para avisarte de algo raro y para volver a entrar si te bloquean."
  - texto: "Revisá las «apps vinculadas» y quitá las que ya no uses o no reconozcas."
  - texto: "Poné bloqueo de pantalla (PIN o huella) en tu celular y tu compu, y usá una contraseña distinta para cada cuenta."
fuentes:
  - https://support.google.com/accounts/answer/46526?hl=es-419
madurez: T0
---
id: SEG-003
area: seguridad
titulo:
  sencillo: "Quiero activar la verificación en dos pasos de Google"
  tecnico: "Activar la Verificación en 2 pasos (Cuenta de Google)"
explicacion:
  sencillo: "Con la verificación en dos pasos, aunque alguien consiga tu clave, no puede entrar: además te pide una confirmación en tu celular. Es la mejor defensa contra los robos de cuenta."
  tecnico: "Seguridad y acceso > Cómo acceder a Google > Activar la Verificación en 2 pasos; segundos pasos: mensajes de Google, apps de autenticación, SMS, llaves de seguridad, códigos de respaldo."
frases: ["activar la verificación en dos pasos de gmail", "que me pida confirmar en el celular cuando entro al mail", "poner doble seguridad en mi cuenta de google", "cómo activo la autenticación en dos pasos"]
pasos:
  - texto: "Entrá a tu Cuenta de Google (myaccount.google.com) > «Seguridad y acceso». En «Cómo acceder a Google», elegí «Activar la Verificación en 2 pasos» y seguí los pasos de la pantalla."
    abrir: "https://support.google.com/accounts/answer/185839?hl=es-419"
  - texto: "Como segundo paso, Google recomienda el aviso en tu celular (tocás «Sí» o «No»). Los códigos por SMS también sirven, pero son menos seguros."
  - texto: "Solo en tu compu o celular propios podés marcar que no te lo vuelva a pedir. En una compu compartida, nunca."
  - texto: "Guardá los códigos de respaldo por si perdés el celular: escribile a PC Doctor «códigos de respaldo de Google»."
fuentes:
  - https://support.google.com/accounts/answer/185839?hl=es-419
madurez: T0
---
id: SEG-004
area: seguridad
titulo:
  sencillo: "Quiero tener códigos de respaldo por si pierdo el celular"
  tecnico: "Códigos de respaldo de la Verificación en 2 pasos de Google"
explicacion:
  sencillo: "Si tenés la verificación en dos pasos y perdés el celular, los códigos de respaldo te dejan entrar igual. Son 10 códigos de 8 números; cada uno sirve una sola vez. Se guardan en papel, como un documento importante."
  tecnico: "Seguridad y acceso > Verificación en 2 pasos > Códigos de respaldo > Obtener códigos de respaldo (10 códigos de un solo uso; Actualizar invalida el juego anterior)."
frases: ["códigos de respaldo de google", "qué hago si pierdo el celular con la verificación en dos pasos", "imprimir los códigos de seguridad de gmail", "perdí los códigos de respaldo"]
pasos:
  - texto: "Primero tenés que tener activada la verificación en 2 pasos. Después, en tu Cuenta de Google > «Seguridad y acceso» > «Verificación en 2 pasos», buscá «Códigos de respaldo» y tocá «Obtener códigos de respaldo»."
    abrir: "https://support.google.com/accounts/answer/1187538?hl=es-419"
  - texto: "Imprimilos o descargalos y guardalos en un lugar seguro, por ejemplo junto al pasaporte. No se los pases a nadie: Google solo te pide uno cuando vos iniciás sesión."
  - texto: "Para usarlos: al entrar, tocá «Probar otro método» y escribí un código que no hayas usado."
  - texto: "Si los perdiste, se te acabaron o creés que alguien los vio, tocá «Actualizar»: se crean nuevos y los viejos dejan de servir."
fuentes:
  - https://support.google.com/accounts/answer/1187538?hl=es-419
madurez: T0
