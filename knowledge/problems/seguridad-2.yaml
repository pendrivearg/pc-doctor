id: SEG-018
area: seguridad
titulo:
  sencillo: "Al abrir un programa sale «Windows protegió su PC»"
  tecnico: "Advertencia de Microsoft Defender SmartScreen para aplicaciones no reconocidas"
explicacion:
  sencillo: "Ese cartel azul aparece cuando Windows no conoce el programa que bajaste: puede ser nuevo, no tener firma del fabricante o ser peligroso. No quiere decir que sí o sí sea un virus, pero conviene frenar y fijarte de dónde salió."
  tecnico: "SmartScreen evalúa la reputación del archivo y del editor; sin reputación o sin firma muestra la advertencia y hay que elegir explícitamente ejecutarlo (Run anyway)."
frases: ["me sale windows protegió su pc", "cartel azul al abrir un programa que bajé", "windows no me deja abrir un instalador", "smartscreen bloqueó una aplicación"]
pasos:
  - texto: "Pensá de dónde lo bajaste. Si vino de un enlace que te mandaron, de una publicidad o de una página que no es la del fabricante, no lo abras y borralo."
    abrir: "https://learn.microsoft.com/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/"
  - texto: "Si lo bajaste de la página oficial y confiás en el fabricante, el cartel tiene una opción para ejecutarlo igual (aparece al tocar el enlace de más información). Hacelo solo en ese caso."
    abrir: "https://learn.microsoft.com/windows/apps/package-and-deploy/smartscreen-reputation"
  - texto: "Lo más seguro es instalar desde Microsoft Store: esas aplicaciones no muestran este aviso. Escribile a PC Doctor «quiero instalar un programa sin riesgo de virus»."
fuentes:
  - https://learn.microsoft.com/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/
  - https://learn.microsoft.com/windows/apps/package-and-deploy/smartscreen-reputation
madurez: T0
