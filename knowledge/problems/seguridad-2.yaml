id: SEG-025
area: seguridad
titulo:
  sencillo: "Me robaron o perdí el celular y quiero proteger mis cuentas"
  tecnico: "Dispositivo Android perdido: Localizador, bloqueo remoto y cierre de sesión"
explicacion:
  sencillo: "Desde la computadora podés bloquear el celular perdido, hacerlo sonar o borrarlo, y sacarle el acceso a tu cuenta de Google para que nadie lea tus correos."
  tecnico: "Localizador de Google (Marcar como perdido, Reproducir sonido, Restablecer configuración de fábrica); quitar el dispositivo en Administrar todos los dispositivos; IMEI para el operador."
frases: ["me robaron el celular y tengo todo ahí", "perdí el teléfono con el mail abierto", "bloquear el celular robado desde la compu", "cómo encuentro mi celular perdido"]
pasos:
  - texto: "Desde la compu, entrá a la versión web de Localizador con tu cuenta de Google y elegí el celular. Podés verlo en el mapa, «Reproducir sonido» o «Marcar como perdido» para bloquearlo con un mensaje."
    abrir: "https://support.google.com/accounts/answer/6160491?hl=es-419"
  - texto: "Si no lo vas a recuperar, «Restablecer configuración de fábrica» borra todo. Ojo: después ya no aparece en Localizador."
  - texto: "En tu Cuenta de Google > «Seguridad y acceso» > «Administrar todos los dispositivos», tocá el celular y «Salir». Cambiá la contraseña."
    abrir: "https://support.google.com/accounts/answer/3067630?hl=es-419"
  - texto: "Llamá a tu compañía de celular para bloquear la línea y el equipo (el IMEI figura en Localizador > «Configuración»), y hacé la denuncia."
fuentes:
  - https://support.google.com/accounts/answer/6160491?hl=es-419
  - https://support.google.com/accounts/answer/3067630?hl=es-419
madurez: T0
