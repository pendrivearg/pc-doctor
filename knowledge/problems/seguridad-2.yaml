id: SEG-011
area: seguridad
titulo:
  sencillo: "Quiero revisar si mi Chrome está seguro"
  tecnico: "Verificación de seguridad de Chrome (Safety Check)"
explicacion:
  sencillo: "Chrome tiene un chequeo que en un minuto revisa si tus contraseñas se filtraron, si la protección está activa, si falta actualizar y si hay extensiones o notificaciones sospechosas."
  tecnico: "Configuración > Privacidad y seguridad > Verificación de seguridad: contraseñas, Navegación segura, actualizaciones, notificaciones, permisos y extensiones."
frases: ["revisar la seguridad de chrome", "chequear si el navegador tiene algo raro", "chrome tiene extensiones sospechosas", "cómo sé si chrome está protegido"]
pasos:
  - texto: "En Chrome, tocá «Más» (los tres puntos de arriba a la derecha) > «Configuración». A la izquierda, «Privacidad y seguridad»."
  - texto: "En «Verificación de seguridad», elegí «Ir a la Verificación de seguridad»."
    abrir: "https://support.google.com/chrome/answer/10468685?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Si encuentra algo, tocá ese punto y seguí las instrucciones de la pantalla (por ejemplo, cambiar una clave o quitar una extensión)."
fuentes:
  - "https://support.google.com/chrome/answer/10468685?hl=es-419&co=GENIE.Platform%3DDesktop"
madurez: T0
