id: SEG-014
area: seguridad
titulo:
  sencillo: "Me llegó un SMS raro del banco, del correo o diciendo que me hackearon"
  tecnico: "Mensajes de texto fraudulentos (smishing)"
explicacion:
  sencillo: "Los estafadores mandan mensajes que parecen del banco, del correo o de Google, con apuro y un enlace, para robarte datos o plata. Ninguna empresa seria te exige datos o pagos en el momento por mensaje."
  tecnico: "Smishing: SMS con suplantación de identidad, urgencia y enlaces a sitios falsos; verificar por canales oficiales, no responder ni abrir enlaces."
frases: ["me llegó un sms del banco con un link", "mensaje de que mi paquete está retenido en el correo", "me mandaron un mensaje que mi cuenta fue bloqueada", "sms diciendo que me hackearon la cuenta"]
pasos:
  - texto: "No toques el enlace, no contestes y no llames a números que vengan en el mensaje. Tomate tu tiempo: el apuro es parte del engaño."
    abrir: "https://support.google.com/faqs/answer/10122683?hl=es-419"
  - texto: "Si dice que es del banco, llamá vos al número que figura en tu tarjeta. Si habla de tu cuenta de Google o de otro servicio, entrá vos directamente desde la compu y revisá la actividad reciente."
  - texto: "Google no te manda SMS ni te llama para verificar tu identidad. Nunca des contraseñas, números de tarjeta ni códigos."
    abrir: "https://support.apple.com/es-lamr/102568"
  - texto: "Marcá el mensaje como spam o no deseado en tu celular y borralo."
fuentes:
  - https://support.google.com/faqs/answer/10122683?hl=es-419
  - https://support.apple.com/es-lamr/102568
madurez: T0
---
id: SEG-015
area: seguridad
titulo:
  sencillo: "Alguien me pide por mensaje un código que me llegó al celular"
  tecnico: "Estafa del código de verificación (robo de cuenta por código de un solo uso)"
explicacion:
  sencillo: "Si te llegó un código por SMS y alguien te lo pide (aunque parezca un amigo, el banco o soporte técnico), es para robarte la cuenta. Esos códigos son solo para vos: ninguna empresa seria los pide."
  tecnico: "Los códigos de verificación y de dos pasos autorizan el acceso a la cuenta; compartirlos permite que un tercero la tome. Google y Apple nunca los piden por mensaje o llamada."
frases: ["me piden un código de 6 dígitos por whatsapp", "un amigo me pidió que le pase un código que me llegó por sms", "me llamaron pidiendo el código que me mandaron", "me llegó un código que no pedí"]
pasos:
  - texto: "No pases el código a nadie, ni siquiera a un conocido: su cuenta puede estar robada y el mensaje lo manda el estafador."
    abrir: "https://support.apple.com/es-lamr/102568"
  - texto: "Google nunca te pide la clave ni códigos por correo, llamada o mensaje. Solo los escribís vos en la página oficial cuando vos estás entrando."
    abrir: "https://support.google.com/accounts/answer/7299973?hl=es-419"
  - texto: "Si ya lo pasaste, cambiá la contraseña de esa cuenta enseguida y activá la verificación en dos pasos. Si era tu cuenta de Google, escribile a PC Doctor «me hackearon el gmail»."
  - texto: "Avisale a tus contactos por otro medio que no respondan pedidos de plata o códigos hechos en tu nombre."
fuentes:
  - https://support.apple.com/es-lamr/102568
  - https://support.google.com/accounts/answer/7299973?hl=es-419
madurez: T0
