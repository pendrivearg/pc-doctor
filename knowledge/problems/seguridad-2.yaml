id: SEG-024
area: seguridad
titulo:
  sencillo: "El virus vuelve aunque el antivirus lo encuentra"
  tecnico: "Examen de Microsoft Defender sin conexión (Offline)"
explicacion:
  sencillo: "Algunos virus se esconden mientras Windows está andando. El examen sin conexión reinicia la compu y la revisa antes de que Windows arranque, en unos 15 minutos. Después vuelve a Windows sola."
  tecnico: "Microsoft Defender Offline: análisis desde un entorno de confianza fuera del kernel de Windows (rootkits, MBR); requiere WinRE habilitado; resultados en Historial de protección."
frases: ["el virus vuelve a aparecer siempre", "el antivirus no puede borrar el virus", "examen sin conexión de defender", "revisar la compu antes de que arranque windows"]
pasos:
  - texto: "Guardá todo lo que tengas abierto y cerrá los programas: la compu se va a reiniciar."
  - texto: "Abrí Seguridad de Windows > la parte de virus y amenazas > opciones de examen. Elegí el examen de Microsoft Defender sin conexión y tocá el botón para examinar ahora. Aceptá los avisos."
    abrir: "ms-settings:windowsdefender"
  - texto: "Si tu disco está cifrado con BitLocker, al reiniciar puede pedirte la clave de recuperación: tenela a mano."
    abrir: "https://learn.microsoft.com/defender-endpoint/microsoft-defender-offline"
  - texto: "Cuando vuelva Windows, mirá el resultado en el historial de protección de Seguridad de Windows."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-offline
madurez: T0
