id: SEG-017
area: seguridad
titulo:
  sencillo: "Compré en una página de Internet y creo que era falsa"
  tecnico: "Tiendas en línea fraudulentas y sitios que imitan comercios"
explicacion:
  sencillo: "Hay páginas que copian tiendas conocidas o publican ofertas demasiado buenas para cobrarte y no mandar nada. Antes de pagar conviene revisar bien la dirección; si ya pagaste, actuá rápido."
  tecnico: "Sitios de phishing que imitan comercios (URL parecidas), ofertas irreales y presión para pagar; Navegación segura avisa de algunos sitios falsos."
frases: ["compré algo por internet y nunca llegó", "creo que la tienda online era trucha", "una oferta en internet demasiado barata", "pagué en una página falsa"]
pasos:
  - texto: "Antes de comprar: desconfiá de ofertas demasiado buenas y de los apuros. Escribí vos la dirección de la tienda en lugar de tocar enlaces de mensajes o publicidades."
    abrir: "https://support.google.com/mail/answer/8253?hl=es-419"
  - texto: "Mirá bien la dirección: si Chrome pregunta «¿Es el sitio correcto?» o dice que el sitio es falso, no sigas."
    abrir: "https://support.google.com/chrome/answer/99020?hl=es-419"
  - texto: "Si ya pagaste con tarjeta, llamá enseguida al número que figura en tu tarjeta. No mandes más plata aunque te la pidan."
    abrir: "https://support.google.com/faqs/answer/2952493?hl=es-419"
  - texto: "Guardá comprobantes y capturas, y hacé la denuncia."
    abrir: "https://support.google.com/faqs/answer/10123027?hl=es-419"
fuentes:
  - https://support.google.com/chrome/answer/99020?hl=es-419
  - https://support.google.com/mail/answer/8253?hl=es-419
  - https://support.google.com/faqs/answer/2952493?hl=es-419
  - https://support.google.com/faqs/answer/10123027?hl=es-419
madurez: T0
