id: SEG-006
area: seguridad
titulo:
  sencillo: "Google me avisó que alguien entró a mi cuenta desde otro aparato"
  tecnico: "Responder a una alerta de seguridad de Google"
explicacion:
  sencillo: "Google manda un aviso cuando alguien entra desde un aparato nuevo o hace algo raro. Si fuiste vos, no pasa nada. Si no, hay que proteger la cuenta enseguida, pero entrando vos directamente a Google, sin tocar enlaces del correo."
  tecnico: "Alertas por inicio de sesión nuevo o actividad sospechosa: No, proteger la cuenta; panel Se encontraron problemas de seguridad > Proteger la cuenta."
frases: ["me llegó un mail de google de un inicio de sesión nuevo", "google dice que entraron a mi cuenta desde otro celular", "alerta de seguridad de google", "aviso de actividad sospechosa en mi cuenta"]
pasos:
  - texto: "Mirá en el aviso qué aparato, a qué hora y desde dónde fue. Si fuiste vos, elegí «Sí» y listo."
  - texto: "Si no fuiste vos, elegí «No, proteger la cuenta» y seguí los pasos (puede pedirte cambiar la contraseña)."
    abrir: "https://support.google.com/accounts/answer/2590353?hl=es-419"
  - texto: "Si dudás de que el aviso sea real, no toques sus enlaces: escribí vos myaccount.google.com en el navegador y, si aparece «Se encontraron problemas de seguridad», tocá «Proteger la cuenta»."
    abrir: "https://support.google.com/mail/answer/8253?hl=es-419"
fuentes:
  - https://support.google.com/accounts/answer/2590353?hl=es-419
  - https://support.google.com/mail/answer/8253?hl=es-419
madurez: T0
