id: SEG-023
area: seguridad
titulo:
  sencillo: "Un programa no puede guardar en Documentos porque Windows lo bloquea"
  tecnico: "Acceso controlado a carpetas bloqueó una aplicación de confianza"
explicacion:
  sencillo: "Si activaste la protección de carpetas, Windows frena a los programas que no conoce cuando quieren cambiar tus documentos. A veces frena uno bueno; si estás seguro de que es confiable, lo podés autorizar."
  tecnico: "Notificación de bloqueo y entrada en el historial de protección; protección contra ransomware > permitir una aplicación (Allow an app through Controlled folder access) > aplicaciones bloqueadas recientemente."
frases: ["no me deja guardar en mis documentos", "acceso controlado a carpetas bloqueó un programa", "un programa no puede guardar los archivos por la protección de windows", "windows bloquea los cambios en mi carpeta de imágenes"]
pasos:
  - texto: "Abrí Seguridad de Windows > virus y amenazas > protección contra ransomware. En la parte de acceso controlado a carpetas, tocá la opción para permitir una aplicación y aceptá con «Sí»."
    abrir: "ms-settings:windowsdefender"
  - texto: "Tocá agregar una aplicación permitida > aplicaciones bloqueadas recientemente, y elegí el programa. Hacelo solo si sabés qué programa es y de dónde salió."
    abrir: "https://learn.microsoft.com/defender-endpoint/controlled-folder-access-configure"
  - texto: "Cerrá y volvé a abrir el programa para que tome el permiso."
    abrir: "https://learn.microsoft.com/defender-endpoint/controlled-folders"
fuentes:
  - https://learn.microsoft.com/defender-endpoint/controlled-folder-access-configure
  - https://learn.microsoft.com/defender-endpoint/controlled-folders
madurez: T0
