id: SEG-019
area: seguridad
titulo:
  sencillo: "El antivirus de Windows dice que encontró una amenaza"
  tecnico: "Microsoft Defender: detecciones e Historial de protección"
explicacion:
  sencillo: "Cuando Microsoft Defender encuentra algo peligroso, avisa y lo frena. En el historial de protección podés ver qué encontró y qué hizo con eso."
  tecnico: "Aplicación Seguridad de Windows: sección de protección contra virus y amenazas > historial de protección (Protection history); examen rápido o completo desde las opciones de examen."
frases: ["el antivirus de windows encontró una amenaza", "me salió un aviso de defender de amenaza encontrada", "dónde veo lo que bloqueó el antivirus", "windows defender detectó un virus"]
pasos:
  - texto: "Abrí Seguridad de Windows, entrá en la parte de virus y amenazas (el ícono del escudo) y elegí el historial de protección. Ahí aparece lo que encontró."
    abrir: "ms-settings:windowsdefender"
  - texto: "Si no sabés qué es lo que encontró, no lo permitas ni lo restaures."
    abrir: "https://learn.microsoft.com/defender-endpoint/microsoft-defender-security-center-antivirus"
  - texto: "Para revisar todo, en la misma parte de virus y amenazas abrí las opciones de examen y elegí el examen completo. Tarda un rato."
  - texto: "Si el aviso vuelve a aparecer, probá el examen sin conexión: escribile a PC Doctor «examen sin conexión de Defender»."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-security-center-antivirus
madurez: T0
