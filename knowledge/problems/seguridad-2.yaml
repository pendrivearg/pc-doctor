id: SEG-012
area: seguridad
titulo:
  sencillo: "Chrome me muestra una pantalla roja que dice «Sitio peligroso»"
  tecnico: "Advertencias de Navegación segura de Chrome"
explicacion:
  sencillo: "Esa pantalla roja aparece cuando Chrome sabe que la página roba datos, tiene virus o engaña. También avisa si la dirección se parece a una que visitás pero es falsa. Lo seguro es no entrar."
  tecnico: "Navegación segura: sitios de phishing, software malicioso o no deseado, ingeniería social; avisos de URL parecidas («¿Es el sitio correcto?»)."
frases: ["chrome me sale todo en rojo sitio peligroso", "me dice que la página es engañosa", "chrome pregunta si quise decir otra página", "me aparece que el sitio es falso"]
pasos:
  - texto: "No entres a la página: volvé atrás o cerrá la pestaña. Chrome no recomienda seguir."
    abrir: "https://support.google.com/chrome/answer/99020?hl=es-419"
  - texto: "Si dice «¿Es el sitio correcto?» o que el sitio es falso, fijate bien la dirección: puede ser una copia de tu banco o de una tienda. Escribí vos la dirección verdadera."
  - texto: "No desactives la protección: la opción «Sin protección» también apaga los avisos de descargas peligrosas."
fuentes:
  - https://support.google.com/chrome/answer/99020?hl=es-419
madurez: T0
---
id: SEG-013
area: seguridad
titulo:
  sencillo: "Chrome no me deja bajar un archivo porque dice que es peligroso"
  tecnico: "Descargas bloqueadas por Chrome (peligrosas, sospechosas, no verificadas)"
explicacion:
  sencillo: "Chrome frena las descargas que pueden traer virus. Si lo bloqueó, no tenés que hacer nada: tu compu queda protegida. Ojo con las páginas que te dicen que tenés virus para que bajes algo: es un engaño."
  tecnico: "Bloqueo de descargas por Navegación segura: archivo peligroso, sospechoso, no verificado o inseguro; análisis opcional con Protección mejorada."
frases: ["chrome bloqueó una descarga", "chrome avisa que la descarga es peligrosa", "no me deja descargar un programa", "este archivo puede ser peligroso qué hago"]
pasos:
  - texto: "Si ves «Este archivo puede ser peligroso», lo mejor es cancelar la descarga. No hace falta hacer nada más."
    abrir: "https://support.google.com/chrome/answer/6261569?hl=es-419"
  - texto: "Desconfiá si alguien te pide que ignores el aviso, o si una página dice que tu compu tiene virus para que bajes algo."
    abrir: "https://support.google.com/chrome/answer/99020?hl=es-419"
  - texto: "Si necesitás ese programa, buscalo en la página oficial del fabricante o en Microsoft Store: escribile a PC Doctor «quiero instalar un programa sin riesgo de virus»."
fuentes:
  - https://support.google.com/chrome/answer/6261569?hl=es-419
  - https://support.google.com/chrome/answer/99020?hl=es-419
madurez: T0
