id: SEG-021
area: seguridad
titulo:
  sencillo: "Windows bloqueó un programa con el «Control inteligente de aplicaciones»"
  tecnico: "Control inteligente de aplicaciones (Smart App Control) en Windows 11"
explicacion:
  sencillo: "Es una protección de Windows 11 que solo deja abrir programas que Microsoft considera seguros o que vienen firmados por su fabricante. Bloquea virus, programas no deseados y programas desconocidos sin firma."
  tecnico: "Smart App Control: modos de cumplimiento (On), evaluación y apagado; bloquea binarios sin reputación positiva ni firma de una CA del Trusted Root Program."
frases: ["control inteligente de aplicaciones bloqueó un programa", "windows no me deja abrir un programa viejo", "qué es el control inteligente de aplicaciones", "smart app control"]
pasos:
  - texto: "Fijate cómo está: en Configuración, abrí Seguridad de Windows y entrá en la parte de control de aplicaciones y navegador. Si está activado, te está protegiendo; si está en evaluación, todavía está probando si te conviene; si está desactivado, no funciona."
    abrir: "ms-settings:windowsdefender"
  - texto: "En modo de evaluación, si Windows ve que te molesta en tu trabajo diario, lo apaga solo. Cuando pasa a estar activo, te avisa con una notificación."
    abrir: "https://learn.microsoft.com/windows/apps/develop/smart-app-control/overview"
  - texto: "Si bloqueó algo que necesitás, buscá ese programa en Microsoft Store o en la página oficial del fabricante, en una versión firmada. No instales copias de otras páginas."
fuentes:
  - https://learn.microsoft.com/windows/apps/develop/smart-app-control/overview
madurez: T0
---
id: SEG-022
area: seguridad
titulo:
  sencillo: "Quiero proteger mis documentos y fotos de los virus que secuestran archivos"
  tecnico: "Protección contra ransomware: Acceso controlado a carpetas"
explicacion:
  sencillo: "Windows puede cerrar con llave las carpetas de Documentos, Imágenes, Videos y Música para que solo los programas confiables puedan cambiarlas. Así, un virus que quiere secuestrar tus archivos no puede tocarlos."
  tecnico: "Acceso controlado a carpetas (Microsoft Defender Antivirus): solo apps de confianza modifican carpetas protegidas; viene desactivado; requiere protección en tiempo real."
frases: ["proteger mis fotos de un virus que pide rescate", "activar la protección contra ransomware", "que ningún programa raro me toque los documentos", "acceso controlado a carpetas"]
pasos:
  - texto: "Abrí Seguridad de Windows > la parte de virus y amenazas (el escudo). En la configuración, tocá «Administrar la configuración» y después la opción para administrar el acceso controlado a carpetas."
    abrir: "ms-settings:windowsdefender"
  - texto: "En la pantalla de protección contra ransomware, activá el interruptor de acceso controlado a carpetas y aceptá con «Sí» la pregunta de Windows."
    abrir: "https://learn.microsoft.com/defender-endpoint/controlled-folder-access-configure"
  - texto: "Ya quedan protegidas Documentos, Imágenes, Videos, Música y Favoritos. Si guardás cosas importantes en otra carpeta, agregala en «Carpetas protegidas»."
    abrir: "https://learn.microsoft.com/defender-endpoint/controlled-folders"
  - texto: "Igual hacé copias de seguridad: escribile a PC Doctor «quiero hacer una copia de seguridad de mis cosas»."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/controlled-folder-access-configure
  - https://learn.microsoft.com/defender-endpoint/controlled-folders
madurez: T0
