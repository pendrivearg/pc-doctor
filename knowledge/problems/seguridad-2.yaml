id: SEG-020
area: seguridad
titulo:
  sencillo: "El antivirus bloqueó una «aplicación potencialmente no deseada»"
  tecnico: "Aplicaciones potencialmente no deseadas (PUA)"
explicacion:
  sencillo: "No es un virus, pero es un programa que molesta: llena de publicidad, pone la compu lenta o instala otros programas sin avisar bien. Suelen venir escondidos en instaladores gratis."
  tecnico: "PUA: adware, software de agrupación (bundling) o evasión; Defender lo pone en cuarentena con el prefijo «PUA:»; Edge puede bloquear su descarga con SmartScreen."
frases: ["el antivirus dice aplicación potencialmente no deseada", "me salió un aviso que empieza con PUA", "se me instalaron programas que no pedí con otro programa", "qué es una aplicación no deseada"]
pasos:
  - texto: "Si el aviso empieza con «PUA:», Defender bloqueó ese programa y lo mandó a cuarentena. Podés verlo en el historial de protección de Seguridad de Windows."
    abrir: "ms-settings:windowsdefender"
  - texto: "Si se te instaló algo que no pediste junto con otro programa, desinstalalo desde la lista de aplicaciones instaladas."
    abrir: "ms-settings:appsfeatures"
  - texto: "En Edge podés bloquear estas descargas: tres puntos > Configuración > la sección de privacidad, búsqueda y servicios > en «Seguridad», activá el bloqueo de aplicaciones potencialmente no deseadas."
    abrir: "https://learn.microsoft.com/defender-endpoint/detect-block-potentially-unwanted-apps-microsoft-defender-antivirus"
fuentes:
  - https://learn.microsoft.com/defender-endpoint/detect-block-potentially-unwanted-apps-microsoft-defender-antivirus
madurez: T0
