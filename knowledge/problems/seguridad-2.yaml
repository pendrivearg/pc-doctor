id: SEG-007
area: seguridad
titulo:
  sencillo: "Google me ofrece entrar con huella o cara en vez de contraseña"
  tecnico: "Llaves de acceso (passkeys) en la Cuenta de Google"
explicacion:
  sencillo: "Una llave de acceso te deja entrar a Google con lo mismo que usás para desbloquear el celular o la compu: huella, cara o PIN. No se puede copiar ni contar a nadie, así que protege mucho mejor contra los engaños. Tu huella no sale del aparato."
  tecnico: "Llaves de acceso FIDO: myaccount.google.com/signinoptions/passkeys > Crear una llave de acceso; requiere bloqueo de pantalla; solo en dispositivos personales."
frases: ["qué es una llave de acceso de google", "entrar al gmail con la huella", "google me pide crear una llave de acceso", "entrar sin contraseña a mi cuenta de google"]
pasos:
  - texto: "Asegurate de que tu celular o compu tenga bloqueo de pantalla (PIN, huella o cara). Creá llaves solo en aparatos tuyos: quien pueda desbloquearlo podría entrar a tu cuenta."
  - texto: "Entrá a myaccount.google.com/signinoptions/passkeys, tocá «Crear una llave de acceso», confirmá y desbloqueá el aparato cuando te lo pida."
    abrir: "https://support.google.com/accounts/answer/13548313?hl=es-419"
  - texto: "Puede tardar hasta 7 días en estar disponible. Mientras tanto, seguís entrando como siempre."
fuentes:
  - https://support.google.com/accounts/answer/13548313?hl=es-419
madurez: T0
---
id: SEG-008
area: seguridad
titulo:
  sencillo: "Quiero que la compu me guarde las contraseñas de forma segura"
  tecnico: "Administrador de contraseñas del navegador (Google, Microsoft Edge)"
explicacion:
  sencillo: "Chrome y Edge traen un administrador de contraseñas: guarda las claves por vos, las completa solo en el sitio correcto y te deja usar una clave distinta y difícil para cada página sin tener que recordarlas."
  tecnico: "Administrador de contraseñas de Google (Chrome, passwords.google.com) y administrador integrado de Microsoft Edge: guardado cifrado, autocompletado por sitio, sugerencia de contraseñas seguras."
frases: ["dónde guardo todas mis contraseñas", "me olvido siempre las claves de las páginas", "que el navegador recuerde mis contraseñas", "programa para guardar contraseñas"]
pasos:
  - texto: "En Chrome, cuando entrás a un sitio con una clave nueva, te pregunta si querés guardarla: decí que sí. Al registrarte en un sitio nuevo, también te puede sugerir una contraseña segura."
  - texto: "Para verlas o cambiarlas: en Chrome, tocá «Más» (los tres puntos) > «Contraseñas y autocompletar» > «Administrador de contraseñas de Google». También podés entrar desde passwords.google.com."
    abrir: "https://support.google.com/chrome/answer/95606?hl=es-419"
  - texto: "Si usás Edge, también tiene su propio administrador. Microsoft lo recomienda porque solo completa la clave en el sitio verdadero, lo que ayuda contra las páginas falsas."
    abrir: "https://learn.microsoft.com/deployedge/microsoft-edge-security-password-manager-security"
  - texto: "Lo que protege todo es la clave de tu computadora: no la compartas y mantené el antivirus activo."
fuentes:
  - https://support.google.com/chrome/answer/95606?hl=es-419
  - https://learn.microsoft.com/deployedge/microsoft-edge-security-password-manager-security
madurez: T0
---
id: SEG-009
area: seguridad
titulo:
  sencillo: "Chrome me avisa que una contraseña mía apareció en una filtración"
  tecnico: "Contraseñas comprometidas: Revisión de contraseñas de Google"
explicacion:
  sencillo: "Si una página donde tenías cuenta sufrió un robo de datos, tu clave pudo quedar publicada. Chrome y Google te avisan para que la cambies antes de que alguien la use."
  tecnico: "Alerta de contraseña y Revisión de contraseñas (expuestas, reutilizadas, débiles) en el Administrador de contraseñas de Google."
frases: ["chrome dice que mi contraseña fue filtrada", "me salió un aviso de contraseña comprometida", "google dice que mi clave apareció en una filtración de datos", "cambiar contraseñas expuestas"]
pasos:
  - texto: "No toques enlaces de mensajes: abrí vos la revisión. En Chrome, «Más» (los tres puntos) > «Contraseñas y autocompletar» > «Administrador de contraseñas de Google» > «Revisión» (o entrá a passwords.google.com)."
    abrir: "https://support.google.com/accounts/answer/9457609?hl=es-419"
  - texto: "Para cada contraseña marcada como expuesta, entrá a ese sitio y cambiala. Usá una clave distinta para cada cuenta."
  - texto: "Si la clave filtrada era la de tu cuenta de Google o la usabas en varios lados, hacé también la Verificación de seguridad: escribile a PC Doctor «revisar la seguridad de mi cuenta de google»."
    abrir: "https://support.google.com/chrome/answer/95606?hl=es-419"
fuentes:
  - https://support.google.com/accounts/answer/9457609?hl=es-419
  - https://support.google.com/chrome/answer/95606?hl=es-419
madurez: T0
---
id: SEG-010
area: seguridad
titulo:
  sencillo: "Quiero que Edge me avise si alguna contraseña mía se filtró"
  tecnico: "Monitor de contraseñas (Password Monitor) de Microsoft Edge"
explicacion:
  sencillo: "Edge puede comparar las claves que tenés guardadas con las que aparecieron en robos de datos de otras páginas, y avisarte cuál tenés que cambiar."
  tecnico: "Password Monitor compara de forma segura las contraseñas guardadas con credenciales filtradas conocidas; se activa en Configuración > Contraseñas."
frases: ["edge me dice que una contraseña es insegura", "aviso de contraseña filtrada en edge", "cómo sé si mis claves se filtraron en edge"]
pasos:
  - texto: "En Edge, abrí la configuración (los tres puntos de arriba a la derecha) y entrá a la parte de contraseñas. Activá la opción que avisa de contraseñas filtradas (Password Monitor)."
    abrir: "https://learn.microsoft.com/deployedge/microsoft-edge-security-password-monitor"
  - texto: "Si Edge te avisa de una clave filtrada, entrá vos a ese sitio y cambiala por una nueva que no uses en ningún otro lado."
  - texto: "Si es la computadora del trabajo, puede que la empresa maneje esta opción y no la puedas cambiar."
fuentes:
  - https://learn.microsoft.com/deployedge/microsoft-edge-security-password-monitor
  - https://support.google.com/accounts/answer/9457609?hl=es-419
madurez: T0
