id: SEG-005
area: seguridad
titulo:
  sencillo: "Quiero ver en qué aparatos está abierta mi cuenta de Google"
  tecnico: "Administrar dispositivos con sesión iniciada en la Cuenta de Google"
explicacion:
  sencillo: "Google muestra la lista de celulares y computadoras donde está abierta tu cuenta. Si aparece uno que no es tuyo, o uno que ya no usás, podés cerrarle la sesión desde ahí."
  tecnico: "Seguridad y acceso > Tus dispositivos > Administrar todos los dispositivos > (dispositivo) > Salir."
frases: ["ver dónde tengo abierta la cuenta de google", "cerrar mi gmail en otra compu", "dejé el mail abierto en una computadora ajena", "cerrar sesión de google en todos lados"]
pasos:
  - texto: "Entrá a tu Cuenta de Google > «Seguridad y acceso». En el panel «Tus dispositivos», elegí «Administrar todos los dispositivos»."
    abrir: "https://support.google.com/accounts/answer/3067630?hl=es-419"
  - texto: "Tocá el aparato que quieras sacar y después «Salir». Si hay varias sesiones con el mismo nombre, cerralas todas."
  - texto: "Si aparece un aparato que no reconocés, cambiá la contraseña y revisá tu cuenta: escribile a PC Doctor «me hackearon el gmail»."
    abrir: "https://support.google.com/accounts/answer/6294825?hl=es-419"
fuentes:
  - https://support.google.com/accounts/answer/3067630?hl=es-419
  - https://support.google.com/accounts/answer/6294825?hl=es-419
madurez: T0
