id: WRD-021
area: programas
titulo:
  sencillo: "En Word la foto se me mueve sola cuando escribo"
  tecnico: "Ajuste de texto, posición y anclaje de imágenes en Word"
explicacion:
  sencillo: "Cada foto está «pegada» a un párrafo. Cuando escribís arriba, el párrafo baja y la foto se va con él. Se puede elegir que la foto quede quieta en un lugar de la hoja o que acompañe al texto."
  tecnico: "Opciones de diseño: Con ajuste de texto (Cuadrado, Delante del texto); Mover con texto / Corregir posición en la página; Ver más > Bloquear anclaje. No disponible En línea con el texto."
frases: ["la imagen salta para otro lado cuando escribo", "la foto se me corre de lugar en el word", "quiero que la imagen quede fija en la hoja", "el texto no rodea la foto"]
pasos:
  - texto: "Hacé clic en la foto. Al lado aparece un botoncito de «Opciones de diseño»: tocalo."
    abrir: "https://support.microsoft.com/es-es/word/wrap-text-and-move-pictures-in-word"
  - texto: "Si querés que el texto la rodee y que suba o baje junto con el texto, elegí «Cuadrado» y marcá «Mover con texto»."
  - texto: "Si querés que quede quieta en un lugar de la hoja, elegí «Delante del texto» y marcá «Corregir posición en la página»."
  - texto: "Para que no se escape aunque borres texto cerca, en ese mismo menú tocá «Ver más» y activá «Bloquear anclaje». (Si la foto está «En línea con el texto», primero elegí otro ajuste.)"
fuentes:
  - https://support.microsoft.com/es-es/word/wrap-text-and-move-pictures-in-word
madurez: T0
---
id: WRD-022
area: programas
titulo:
  sencillo: "Quiero poner una marca de agua (como «BORRADOR») en el fondo de las hojas"
  tecnico: "Insertar una marca de agua en Word"
explicacion:
  sencillo: "La marca de agua es un texto o un logo clarito que se ve atrás del texto en todas las hojas, por ejemplo «CONFIDENCIAL» o el logo de un negocio."
  tecnico: "Diseño > Marca de agua: predefinidas o Marca de agua personalizada (texto o imagen). Word para la web no las inserta."
frases: ["poner borrador de fondo en el word", "marca de agua en el documento", "poner el logo clarito atrás del texto", "que diga confidencial en todas las hojas"]
pasos:
  - texto: "En la pestaña de diseño, tocá «Marca de agua» y elegí una de las que vienen (por ejemplo BORRADOR o CONFIDENCIAL)."
    abrir: "https://support.microsoft.com/es-es/word/training/insert-a-watermark"
  - texto: "Para un texto tuyo o un logo: «Marca de agua» > «Marca de agua personalizada» y elegí texto o imagen."
  - texto: "Si usás Word desde el navegador, ahí no se pueden poner: abrí el documento en Word de la compu."
fuentes:
  - https://support.microsoft.com/es-es/word/training/insert-a-watermark
madurez: T0
