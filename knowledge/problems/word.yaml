id: WRD-007
area: programas
titulo:
  sencillo: "Quiero que el primer renglón de cada párrafo empiece más adentro"
  tecnico: "Sangría de primera línea y sangría francesa en Word"
explicacion:
  sencillo: "La sangría es ese espacio al principio del primer renglón de un párrafo. Se hace con la tecla Tab o desde las opciones de párrafo. También existe la sangría «francesa», que deja el primer renglón afuera y mete los demás (se usa en bibliografías)."
  tecnico: "Tab al inicio del párrafo; cuadro Párrafo > Sangría > Especial: Primera línea / Francesa, En; Establecer como predeterminado."
frases: ["cómo hago la sangría en word", "que el párrafo empiece más corrido", "poner sangría francesa en la bibliografía", "dejar un espacio al principio de cada párrafo"]
pasos:
  - texto: "La forma rápida: poné el cursor al principio del párrafo y apretá la tecla Tab. Cuando apretás Entrar, el párrafo siguiente sigue con la sangría."
    abrir: "https://support.microsoft.com/es-es/word/training/indent-the-first-line-of-a-paragraph"
  - texto: "Para una medida exacta: seleccioná los párrafos y abrí la ventana de «Párrafo» (la flechita chica en la esquina del grupo «Párrafo», en la pestaña «Inicio»)."
    abrir: "https://support.microsoft.com/es-es/word/adjust-indents-and-spacing"
  - texto: "En «Sangría», en la lista «Especial», elegí «Primera línea» (o «Francesa») y escribí la medida en el cuadro de al lado. Mirá cómo queda en la vista previa y tocá «Aceptar»."
fuentes:
  - https://support.microsoft.com/es-es/word/adjust-indents-and-spacing
  - https://support.microsoft.com/es-es/word/training/indent-the-first-line-of-a-paragraph
madurez: T0
---
id: WRD-008
area: programas
titulo:
  sencillo: "La numeración de mi lista en Word sigue de antes o empieza en cualquier número"
  tecnico: "Reiniciar o establecer el valor de una lista numerada"
explicacion:
  sencillo: "A veces Word continúa la numeración de una lista anterior (empieza en 5 en vez de 1) o se mezcla. Se arregla desde el menú del número, sin escribir los números a mano, porque a mano después se desordena más."
  tecnico: "Clic derecho en el número > Reiniciar en 1 / Establecer valor de numeración."
frases: ["la lista de word empieza en 4 en vez de 1", "se me desordenaron los números de la lista", "quiero que la numeración vuelva a empezar en uno", "word sigue numerando de la lista anterior"]
pasos:
  - texto: "Hacé doble clic sobre los números de la lista para seleccionarlos."
    abrir: "https://support.microsoft.com/es-es/word/change-the-numbering-in-a-numbered-list"
  - texto: "Hacé clic derecho en el número desde donde querés que arranque de nuevo y elegí «Reiniciar en 1»."
  - texto: "Si querés que empiece en otro número: clic derecho > «Establecer valor de numeración» y elegí el número con las flechitas."
  - texto: "No borres ni escribas los números a mano: Word se pierde y la lista se desordena más cuando la cambiás después."
fuentes:
  - https://support.microsoft.com/es-es/word/change-the-numbering-in-a-numbered-list
madurez: T0
---
id: WRD-009
area: programas
titulo:
  sencillo: "Quiero que lo que sigue empiece en una hoja nueva en Word"
  tecnico: "Insertar un salto de página"
explicacion:
  sencillo: "En vez de apretar Entrar muchas veces hasta llegar a la otra hoja (que después se desacomoda), conviene poner un «salto de página»: lo que sigue siempre empieza arriba de una hoja nueva."
  tecnico: "Insertar > Salto de página; ver y borrar saltos con Inicio > Mostrar u ocultar."
frases: ["empezar un capítulo en una hoja nueva", "aprieto enter mil veces para pasar a la otra hoja", "cortar la página y seguir en la siguiente", "que el título quede arriba de la hoja siguiente"]
pasos:
  - texto: "Hacé clic justo donde querés que termine la hoja."
    abrir: "https://support.microsoft.com/es-es/word/insert-a-page-break-in-word"
  - texto: "En la pestaña «Insertar», tocá «Salto de página». Lo que estaba después del cursor pasa al principio de la hoja siguiente."
  - texto: "Para ver dónde hay saltos (y borrar uno), en «Inicio» tocá «Mostrar u ocultar»: seleccioná el salto y borralo."
    abrir: "https://support.microsoft.com/es-es/word/training/insert-a-page-break"
fuentes:
  - https://support.microsoft.com/es-es/word/insert-a-page-break-in-word
  - https://support.microsoft.com/es-es/word/training/insert-a-page-break
madurez: T0
