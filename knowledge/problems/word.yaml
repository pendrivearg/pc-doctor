id: WRD-017
area: programas
titulo:
  sencillo: "Quiero imprimir la dirección en un sobre con Word"
  tecnico: "Crear e imprimir un sobre en Word"
explicacion:
  sencillo: "Word tiene una opción para escribir la dirección y el remitente y mandarlos a la impresora en el lugar justo del sobre. Conviene probar primero, porque cada impresora pone el sobre de una forma distinta."
  tecnico: "Correspondencia > Sobres: Dirección, Remite (Omitir), Opciones (tamaño y Opciones de impresión: orientación de alimentación), Imprimir o Agregar al documento."
frases: ["imprimir un sobre con la dirección", "cómo pongo el sobre en la impresora", "escribir el remitente en un sobre desde la compu", "me sale la dirección torcida en el sobre"]
pasos:
  - texto: "En la pestaña «Correspondencia», tocá «Sobres». Escribí la dirección de quien lo recibe y, en el remite, la tuya (o marcá «Omitir» para no ponerla)."
    abrir: "https://support.microsoft.com/es-es/word/create-and-print-a-single-envelope-in-word"
  - texto: "Tocá «Opciones»: elegí el tamaño del sobre y, en «Opciones de impresión», fijate cómo hay que poner el sobre en la impresora (de qué lado y para qué lado)."
  - texto: "Hacé una prueba antes: poné un sobre como indican las opciones de impresión e imprimí. Si sale torcido o al revés, cambiá esas opciones y probá de nuevo."
  - texto: "Cuando salga bien, imprimilo, o tocá «Agregar al documento» para guardarlo e imprimirlo después."
fuentes:
  - https://support.microsoft.com/es-es/word/create-and-print-a-single-envelope-in-word
madurez: T0
