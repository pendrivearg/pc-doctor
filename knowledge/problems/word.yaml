id: WRD-003
area: programas
titulo:
  sencillo: "Quiero poner un índice automático en Word"
  tecnico: "Insertar y actualizar una tabla de contenido"
explicacion:
  sencillo: "Word puede armar solo el índice con los títulos y el número de página de cada uno. Para eso, los títulos tienen que estar marcados con el estilo «Título 1», «Título 2», etc."
  tecnico: "Estilos de título (Título 1–3) + Referencias > Tabla de contenido > tabla automática; clic derecho > Actualizar campo."
frases: ["hacer el índice de un trabajo en word", "que el índice se arme solo con las páginas", "el índice no se actualiza con los números de página", "poner tabla de contenido en la monografía"]
pasos:
  - texto: "Primero marcá los títulos: seleccioná cada título y en la pestaña «Inicio», en los estilos, elegí «Título 1» (y «Título 2» para los subtítulos). Solo lo que tenga estilo de título entra al índice."
    abrir: "https://support.microsoft.com/es-es/office/insertar-una-tabla-de-contenido-882e8564-0edb-435e-84b5-1d8552ccf0c0"
  - texto: "Hacé clic donde querés el índice (normalmente al principio). En la pestaña «Referencias», tocá «Tabla de contenido» y elegí una de las automáticas (no la «manual»)."
  - texto: "Si después cambiás el texto o se mueven las páginas: clic derecho sobre el índice > «Actualizar campo» y elegí actualizar toda la tabla."
fuentes:
  - https://support.microsoft.com/es-es/office/insertar-una-tabla-de-contenido-882e8564-0edb-435e-84b5-1d8552ccf0c0
madurez: T0
---
id: WRD-004
area: programas
titulo:
  sencillo: "Quiero poner algo escrito arriba o abajo de todas las hojas en Word"
  tecnico: "Insertar, editar o quitar encabezado y pie de página"
explicacion:
  sencillo: "El encabezado es lo que se repite arriba de cada hoja (por ejemplo, el nombre del colegio) y el pie de página lo que se repite abajo. Lo escribís una vez y aparece en todas."
  tecnico: "Insertar > Encabezado / Pie de página > estilo integrado o Editar; Cerrar encabezado y pie de página (Esc); Primera página diferente; Quitar encabezado/pie."
frases: ["poner el nombre arriba de todas las hojas", "que se repita un texto abajo de cada página", "cómo pongo el membrete en word", "sacar lo que está escrito arriba de todas las hojas"]
pasos:
  - texto: "En la pestaña «Insertar», tocá «Encabezado» (arriba) o «Pie de página» (abajo) y elegí un estilo de la lista."
    abrir: "https://support.microsoft.com/es-es/office/insertar-un-encabezado-o-pie-de-p%C3%A1gina-b87ee4df-abc1-41f8-995b-b39f6d99c7ed"
  - texto: "Escribí el texto. Cuando termines, tocá «Cerrar encabezado y pie de página» o apretá Esc. Para cambiarlo después, hacé doble clic sobre él."
  - texto: "Si no lo querés en la primera hoja (la carátula), marcá «Primera página diferente»."
  - texto: "Para sacarlo: «Insertar» > «Encabezado» (o «Pie de página») > «Quitar encabezado» (o «Quitar pie de página»)."
fuentes:
  - https://support.microsoft.com/es-es/office/insertar-un-encabezado-o-pie-de-p%C3%A1gina-b87ee4df-abc1-41f8-995b-b39f6d99c7ed
madurez: T0
