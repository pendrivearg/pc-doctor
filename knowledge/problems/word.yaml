id: WRD-006
area: programas
titulo:
  sencillo: "Los renglones en Word quedan muy separados (o muy pegados)"
  tecnico: "Interlineado y espacio entre párrafos en Word"
explicacion:
  sencillo: "El interlineado es el espacio entre un renglón y otro. Aparte, Word deja un espacio extra entre párrafos. Las dos cosas se pueden cambiar, en todo el documento o solo en una parte."
  tecnico: "Inicio > Espaciado entre líneas y párrafos > Opciones de interlineado (Interlineado, Antes/Después); Diseño > Espaciado entre párrafos > Sin espacio entre párrafos."
frases: ["los renglones quedan muy separados en word", "me piden interlineado doble", "cómo pongo interlineado 1,5", "hay mucho espacio entre un párrafo y otro"]
pasos:
  - texto: "Seleccioná el texto que querés cambiar (Ctrl + A si es todo). En la pestaña «Inicio», tocá el botón de espaciado entre líneas y párrafos y elegí «Opciones de interlineado»."
    abrir: "https://support.microsoft.com/es-es/word/change-the-line-spacing-in-word"
  - texto: "En «Interlineado» elegí la medida que te pidan (sencillo, 1,5, doble). En los cuadros de espacio antes y después cambiás la separación entre párrafos. Tocá «Aceptar»."
  - texto: "Para sacar el espacio entre párrafos en todo el documento: en la pestaña de diseño, tocá «Espaciado entre párrafos» y elegí «Sin espacio entre párrafos»."
fuentes:
  - https://support.microsoft.com/es-es/word/change-the-line-spacing-in-word
madurez: T0
