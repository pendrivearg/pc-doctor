id: WRD-024
area: archivos
titulo:
  sencillo: "Me mandaron un PDF y lo quiero cambiar en Word"
  tecnico: "Abrir y editar un PDF en Word (conversión)"
explicacion:
  sencillo: "Word puede abrir un PDF y pasarlo a un documento que se puede cambiar. Hace una copia: el PDF original no se toca. Funciona mejor con PDF que son casi todo texto; el diseño puede quedar un poco distinto."
  tecnico: "Archivo > Abrir > PDF: Word convierte una copia (el original no se modifica); Guardar como Word o PDF. Mejor con contenido de texto; puede no coincidir página por página."
frases: ["pasar un pdf a word", "quiero editar un pdf que me mandaron", "convertir un pdf para poder escribir", "cambiar algo de un pdf sin programas raros"]
pasos:
  - texto: "Abrí Word y andá a «Archivo» > «Abrir». Buscá el PDF (si no aparece, usá «Examinar»)."
    abrir: "https://support.microsoft.com/es-es/word/training/edit-a-pdf"
  - texto: "Word avisa que va a hacer una copia y convertirla. Aceptá: el PDF original no se cambia."
  - texto: "Hacé los cambios. Revisá que no se haya corrido nada: los renglones o las hojas pueden cortarse en otro lugar."
  - texto: "Guardalo con «Guardar como», como documento de Word o de nuevo como PDF."
derivar: "Si lo que querés es pasar un Word a PDF, escribile a PC Doctor «guardar un documento como PDF»."
fuentes:
  - https://support.microsoft.com/es-es/word/training/edit-a-pdf
madurez: T0
