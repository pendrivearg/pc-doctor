# Word paso a paso: tablas, índice, encabezado y pie, columnas, interlineado, sangría, listas, saltos y hojas en blanco, estilos, letra predeterminada, brocha, comentarios, reemplazar, contar palabras, sobres, etiquetas, combinar correspondencia, dictado, imágenes, marca de agua, bordes, PDF a Word y dónde guardar. Guiadas con fuente oficial.
id: WRD-001
area: programas
titulo:
  sencillo: "Quiero hacer una tabla en Word"
  tecnico: "Insertar una tabla en Word"
explicacion:
  sencillo: "Una tabla son casilleros en filas y columnas, como una grilla. Sirve para listas de precios, horarios o planillas chicas. Elegís cuántas filas y columnas querés y Word la dibuja sola."
  tecnico: "Insertar > Tabla: cuadrícula o Insertar tabla (columnas y filas); también Convertir texto en tabla. Edición en Diseño de tabla / Disposición."
frases: ["cómo hago una tabla en word", "hacer un cuadro con casilleros en el documento", "armar una grilla con filas y columnas en word", "quiero hacer una lista de precios en cuadritos"]
pasos:
  - texto: "Hacé clic donde querés la tabla. En la pestaña «Insertar», tocá «Tabla»."
    abrir: "https://support.microsoft.com/es-es/office/insertar-una-tabla-a138f745-73ef-4879-b99a-2f3d38be612a"
  - texto: "Pasá el mouse por la cuadrícula hasta marcar la cantidad de columnas y filas que necesitás, y hacé clic. La tabla aparece en el documento."
  - texto: "Si la querés más grande, en el mismo menú elegí «Insertar tabla» y escribí el número de columnas y de filas."
  - texto: "Para escribir, hacé clic en cada casillero. Las opciones para cambiarle el aspecto aparecen arriba cuando estás dentro de la tabla."
fuentes:
  - https://support.microsoft.com/es-es/office/insertar-una-tabla-a138f745-73ef-4879-b99a-2f3d38be612a
madurez: T0
---
id: WRD-002
area: programas
titulo:
  sencillo: "Me faltan (o me sobran) filas en una tabla de Word"
  tecnico: "Insertar o eliminar filas y columnas de una tabla en Word"
explicacion:
  sencillo: "A una tabla ya hecha se le pueden agregar renglones o columnas en el lugar que quieras, y también sacar los que sobran, sin tener que hacerla de nuevo."
  tecnico: "Diseño de tabla (Disposición) > Filas y columnas > Insertar encima/debajo/a la izquierda/a la derecha; clic derecho > Eliminar > Eliminar filas/columnas."
frases: ["agregar un renglón a la tabla de word", "me quedé sin filas en la tabla", "sumar una columna más al cuadro", "borrar una fila que sobra en la tabla"]
pasos:
  - texto: "Hacé clic en un casillero que esté al lado de donde querés la fila o la columna nueva."
    abrir: "https://support.microsoft.com/es-es/word/add-a-cell-row-or-column-to-a-table-in-word"
  - texto: "Arriba, en la pestaña de la tabla que aparece (de disposición o diseño de tabla), buscá el grupo «Filas y columnas» y elegí «Insertar encima» o «Insertar debajo» para una fila, o «Insertar a la izquierda» o «Insertar a la derecha» para una columna."
  - texto: "Si necesitás varias filas de una vez, primero seleccioná esa misma cantidad de filas y después tocá insertar."
  - texto: "Para sacar una fila o columna: clic derecho en un casillero de ella, tocá «Eliminar» y elegí «Eliminar filas» o «Eliminar columnas»."
    abrir: "https://support.microsoft.com/es-es/word/delete-a-row-column-or-cell-from-a-table"
fuentes:
  - https://support.microsoft.com/es-es/word/add-a-cell-row-or-column-to-a-table-in-word
  - https://support.microsoft.com/es-es/word/delete-a-row-column-or-cell-from-a-table
madurez: T0
