id: WRD-016
area: programas
titulo:
  sencillo: "¿Cuántas palabras tiene mi texto de Word?"
  tecnico: "Ver el recuento de palabras en Word"
explicacion:
  sencillo: "Word cuenta las palabras solo mientras escribís y lo muestra abajo de todo, en la barrita de la ventana. También puede contar solo una parte o decirte cuántos caracteres hay."
  tecnico: "Barra de estado: recuento de palabras (de la selección y del total); clic para ver caracteres, líneas y párrafos. En Word para la web, en la vista de edición."
frases: ["cuántas palabras tiene mi trabajo", "me piden máximo 500 palabras", "contar los caracteres de un texto en word", "dónde veo el número de palabras"]
pasos:
  - texto: "Mirá la barrita de abajo de la ventana de Word: ahí dice cuántas palabras tiene el documento."
    abrir: "https://support.microsoft.com/es-es/word/training/show-word-count"
  - texto: "Para contar solo una parte, seleccioná ese texto: abajo aparecen las palabras de lo seleccionado y las del total."
  - texto: "Si necesitás la cantidad de caracteres, los renglones o los párrafos, hacé clic sobre ese número de palabras de abajo."
fuentes:
  - https://support.microsoft.com/es-es/word/training/show-word-count
madurez: T0
