id: WRD-005
area: programas
titulo:
  sencillo: "Quiero escribir en dos columnas, como en el diario"
  tecnico: "Columnas de estilo periodístico en Word"
explicacion:
  sencillo: "Word puede repartir el texto en dos o tres columnas, como un diario o un folleto. Se puede hacer en todo el documento o solo en una parte."
  tecnico: "Disposición > Columnas (todo el documento o párrafos seleccionados); Más columnas para formato personalizado."
frases: ["escribir en dos columnas en word", "armar un folleto con columnas", "que el texto quede como en el diario", "dividir la hoja en dos columnas de texto"]
pasos:
  - texto: "Para todo el documento: en la pestaña de disposición de la página (según la versión se llama «Disposición» o «Diseño»), tocá «Columnas» y elegí cuántas querés."
    abrir: "https://support.microsoft.com/es-es/office/create-newsletter-columns-3a00e688-253d-456e-9481-661fdd5b724b"
  - texto: "Para una sola parte: primero seleccioná esos párrafos y después usá el mismo botón «Columnas»."
  - texto: "Si querés otro ancho o más columnas, en esa misma lista elegí «Más columnas» y armá el formato a tu gusto."
fuentes:
  - https://support.microsoft.com/es-es/office/create-newsletter-columns-3a00e688-253d-456e-9481-661fdd5b724b
madurez: T0
