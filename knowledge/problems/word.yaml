id: WRD-020
area: programas
titulo:
  sencillo: "Quiero dictarle a Word en vez de escribir"
  tecnico: "Dictado en Word (Microsoft 365)"
explicacion:
  sencillo: "Word tiene un botón de micrófono para dictar: hablás y el texto aparece en el documento. Los signos se dicen («punto», «coma»). Solo viene con la suscripción de Microsoft 365 y necesita Internet y micrófono."
  tecnico: "Inicio > Dictado (requiere Microsoft 365); comandos «punto», «coma», «nuevo párrafo», «Detener dictado»; engranaje > Lenguaje hablado: Español."
frases: ["dónde está el micrófono para dictar en word", "word no escribe lo que digo en español", "dictar una carta directamente en word", "word me escribe en inglés cuando dicto"]
pasos:
  - texto: "Abrí el documento y en la pestaña «Inicio» tocá «Dictado». Si te pide permiso para usar el micrófono, aceptá."
    abrir: "https://support.microsoft.com/es-es/word/dictate-your-documents-in-word"
  - texto: "Cuando el botón se active, hablá con normalidad. Para los signos decí «punto», «coma» o «nuevo párrafo»."
  - texto: "Si escribe en otro idioma, tocá el engranaje del dictado y en «Lenguaje hablado» elegí español."
  - texto: "Para terminar, decí «Detener dictado». Si no ves el botón, tu Word puede no tener Microsoft 365: ahí podés usar el dictado de Windows (escribile a PC Doctor «quiero escribir hablando»)."
fuentes:
  - https://support.microsoft.com/es-es/word/dictate-your-documents-in-word
madurez: T0
