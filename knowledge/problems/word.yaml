id: WRD-018
area: programas
titulo:
  sencillo: "Quiero imprimir etiquetas autoadhesivas con Word"
  tecnico: "Crear e imprimir una hoja de etiquetas en Word"
explicacion:
  sencillo: "Word sabe las medidas de muchas hojas de etiquetas que venden en librerías. Elegís la marca y el modelo que figura en el paquete, escribís el texto y llena la hoja."
  tecnico: "Correspondencia > Etiquetas > Opciones (proveedor y número de producto); Dirección; Página completa de la misma etiqueta; Imprimir o Nuevo documento."
frases: ["imprimir etiquetas en word", "tengo una hoja de etiquetas y no sé cómo imprimirla", "hacer etiquetas con mi dirección", "que entren las etiquetas justo en cada cuadradito"]
pasos:
  - texto: "En la pestaña «Correspondencia», tocá «Etiquetas»."
    abrir: "https://support.microsoft.com/es-es/office/create-and-print-labels-82086c07-2afa-4982-9d7d-9c9141d5035b"
  - texto: "Tocá «Opciones» y elegí el proveedor (la marca) y el número de producto que dice el paquete de etiquetas. Aceptá."
  - texto: "Escribí el texto en el cuadro «Dirección» y elegí «Página completa de la misma etiqueta»."
  - texto: "Tocá «Imprimir», o «Nuevo documento» si antes querés revisarla o cambiarle algo. Conviene probar primero en una hoja común."
fuentes:
  - https://support.microsoft.com/es-es/office/create-and-print-labels-82086c07-2afa-4982-9d7d-9c9141d5035b
madurez: T0
