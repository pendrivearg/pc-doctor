id: WRD-023
area: programas
titulo:
  sencillo: "Quiero ponerle un marco o borde a la hoja en Word"
  tecnico: "Bordes de página en Word"
explicacion:
  sencillo: "Word puede dibujar un marco alrededor de toda la hoja: una línea simple, de colores o con dibujitos. Queda lindo en carátulas, diplomas o carteles."
  tecnico: "Diseño > Bordes de página: estilo, color, ancho o arte; Opciones (distancia al borde); Aplicar a; Ninguno para quitar."
frases: ["ponerle un marco a la hoja de word", "borde alrededor de la carátula", "hacer un diploma con borde", "sacar el recuadro que tiene la hoja"]
pasos:
  - texto: "En la pestaña de diseño, tocá «Bordes de página»."
    abrir: "https://support.microsoft.com/es-es/word/training/add-a-border-to-a-page"
  - texto: "Elegí cómo lo querés: estilo de línea, color, ancho o un borde con dibujitos (arte). Tocá «Aceptar»."
  - texto: "Si querés separarlo más o menos del borde del papel, entrá en «Opciones», cambiá la distancia y aceptá."
  - texto: "Para sacarlo, volvé a «Bordes de página» y elegí «Ninguno»."
fuentes:
  - https://support.microsoft.com/es-es/word/training/add-a-border-to-a-page
madurez: T0
