id: WRD-025
area: archivos
titulo:
  sencillo: "Word me quiere guardar todo en OneDrive y yo lo quiero en la compu"
  tecnico: "Guardar en el equipo de forma predeterminada en Office"
explicacion:
  sencillo: "Word muchas veces propone guardar en OneDrive (la nube). Si preferís que guarde en la compu, se puede elegir cada vez con «Guardar como» o dejarlo así de fábrica en las opciones."
  tecnico: "Archivo > Opciones > Guardar > Guardar en el equipo de forma predeterminada; Ubicación de archivo local predeterminada (Examinar); Guardar como para un archivo puntual."
frases: ["word me guarda todo en la nube", "quiero guardar el documento en mi compu y no en onedrive", "cada vez que guardo me manda a onedrive", "que word guarde en documentos de la compu"]
pasos:
  - texto: "Para un documento puntual, usá «Guardar como» y elegí una carpeta de la compu en vez de OneDrive."
    abrir: "https://support.microsoft.com/es-es/office/customize-the-save-experience-in-office-786200a7-f5f2-4d26-a3ae-b78c60dd5d3b"
  - texto: "Para que sea siempre así: en Word, andá a «Archivo» > «Opciones» > «Guardar»."
  - texto: "Marcá «Guardar en el equipo de forma predeterminada» y en «Ubicación de archivo local predeterminada» elegí la carpeta con «Examinar». Aceptá."
derivar: "Si lo que pasa es que tus carpetas de la compu están dentro de OneDrive, escribile a PC Doctor «mis cosas del Escritorio ahora están en OneDrive»."
fuentes:
  - https://support.microsoft.com/es-es/office/customize-the-save-experience-in-office-786200a7-f5f2-4d26-a3ae-b78c60dd5d3b
madurez: T0
