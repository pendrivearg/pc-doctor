id: WRD-010
area: programas
titulo:
  sencillo: "Me queda una hoja en blanco en Word y no se borra"
  tecnico: "Eliminar una página en blanco en Word"
explicacion:
  sencillo: "Las hojas en blanco suelen venir de renglones vacíos, de un salto de página o, si está al final, de una marca de párrafo que Word no deja borrar. Mostrando las marcas se ve qué la causa."
  tecnico: "Ctrl + Mayús + 8 para ver marcas; borrar párrafos vacíos o saltos; al final, párrafo final a 1 pt; saltos de sección «Página siguiente»."
frases: ["no puedo borrar la última hoja en blanco", "me sale una página vacía al final del word", "se imprime una hoja en blanco de más", "hay una hoja vacía en el medio del documento"]
pasos:
  - texto: "Apretá Ctrl + Mayús + 8 para ver las marcas de párrafo (¶). Así ves si en esa hoja hay renglones vacíos o un salto de página."
    abrir: "https://support.microsoft.com/es-es/word/delete-a-blank-page"
  - texto: "Seleccioná esas marcas vacías o el salto de página que sobra y apretá Suprimir."
  - texto: "Si la hoja en blanco está al final y queda una sola marca ¶ que no se borra: seleccionala, en el cuadro de tamaño de letra escribí 01 y apretá Entrar. Así entra en la hoja anterior."
  - texto: "Si todavía no entra, achicá un poco el margen de abajo. Después volvé a apretar Ctrl + Mayús + 8 para ocultar las marcas."
fuentes:
  - https://support.microsoft.com/es-es/word/delete-a-blank-page
madurez: T0
---
id: WRD-011
area: programas
titulo:
  sencillo: "Quiero que los títulos de mi documento tengan el formato de título de Word"
  tecnico: "Aplicar y modificar estilos de título (Título 1, Título 2)"
explicacion:
  sencillo: "Word trae «estilos» ya armados para los títulos. Usarlos en vez de solo agrandar la letra hace que todos los títulos queden iguales y que después puedas armar el índice automático."
  tecnico: "Inicio > galería de Estilos (Título 1, Título 2; botón Más); clic derecho > Actualizar título para que coincida con la selección."
frases: ["todos los títulos me quedan distintos en word", "dónde están los estilos de título", "poner título 1 y título 2", "cambiar la letra de todos los títulos de una vez"]
pasos:
  - texto: "Seleccioná el texto del título. En la pestaña «Inicio», en la galería de estilos, tocá «Título 1» (o «Título 2» para un subtítulo). Si no lo ves, abrí la flechita «Más» de la galería."
    abrir: "https://support.microsoft.com/es-es/word/add-a-heading-in-a-word-document"
  - texto: "Repetí con cada título. Así quedan todos iguales."
  - texto: "Para cambiarles el aspecto a todos juntos: cambiale la letra o el color a uno, hacé clic derecho en ese estilo de la galería y elegí «Actualizar título para que coincida con la selección»."
fuentes:
  - https://support.microsoft.com/es-es/word/add-a-heading-in-a-word-document
madurez: T0
---
id: WRD-012
area: programas
titulo:
  sencillo: "Cada vez que abro Word tengo que cambiar la letra"
  tecnico: "Cambiar la fuente y el tamaño predeterminados en Word"
explicacion:
  sencillo: "Word arranca siempre con la misma letra y tamaño. Si siempre usás otra (por ejemplo, Arial 12), la podés dejar como predeterminada para que todos los documentos nuevos empiecen así."
  tecnico: "Inicio > iniciador del cuadro Fuente (Ctrl + D) > Establecer como predeterminado > Todos los documentos basados en la plantilla Normal. Si no se conserva: permisos de Normal.dotm o complementos."
frases: ["que word arranque siempre con arial 12", "cambiar la letra que viene por defecto en word", "todos los documentos nuevos empiezan con calibri", "dejar fijo el tamaño de letra en word"]
pasos:
  - texto: "En Word, apretá Ctrl + D (o en la pestaña «Inicio», tocá la flechita chica en la esquina del grupo «Fuente»)."
    abrir: "https://support.microsoft.com/es-es/word/change-the-default-font-in-word"
  - texto: "Elegí la letra y el tamaño que querés, y tocá «Establecer como predeterminado»."
  - texto: "Elegí «Todos los documentos basados en la plantilla Normal» y tocá «Aceptar» dos veces."
  - texto: "Si al volver a abrir Word no se guardó, Microsoft explica qué revisar (puede ser un complemento o un permiso del archivo de la plantilla). Si es la compu del trabajo, consultá con quien la administra."
fuentes:
  - https://support.microsoft.com/es-es/word/change-the-default-font-in-word
madurez: T0
---
id: WRD-013
area: programas
titulo:
  sencillo: "Quiero que un texto quede con el mismo formato que otro (la brocha)"
  tecnico: "Copiar formato (Format Painter) en Word"
explicacion:
  sencillo: "La brocha copia cómo se ve un texto (letra, tamaño, color, negrita) y lo pasa a otro texto, sin tener que cambiar cada cosa a mano."
  tecnico: "Inicio > Portapapeles > Copiar formato; doble clic para varias veces; Esc para terminar; Alt + Ctrl + C / Alt + Ctrl + V."
frases: ["para qué sirve la brocha de word", "copiar el formato de un texto a otro", "que este párrafo quede igual que el de arriba", "pasar la misma letra y color a otra parte"]
pasos:
  - texto: "Seleccioná el texto que ya tiene el formato que te gusta."
    abrir: "https://support.microsoft.com/es-es/word/use-the-format-painter"
  - texto: "En la pestaña «Inicio», en el grupo «Portapapeles», tocá el botón de la brocha. El cursor se convierte en una brocha."
  - texto: "Pasá la brocha arrastrando sobre el texto que querés cambiar: queda con el mismo formato. Funciona una sola vez."
  - texto: "Si lo querés aplicar en varios lugares, hacé doble clic en la brocha en vez de un clic. Cuando termines, apretá Esc."
fuentes:
  - https://support.microsoft.com/es-es/word/use-the-format-painter
madurez: T0
---
id: WRD-014
area: programas
titulo:
  sencillo: "Quiero dejar una notita al costado del texto en Word (o borrar las que hay)"
  tecnico: "Insertar, responder y eliminar comentarios en Word"
explicacion:
  sencillo: "Los comentarios son notitas que aparecen al costado de la hoja, sin cambiar el texto. Sirven para corregir un trabajo o dejar una duda. Si te mandaron un documento con comentarios, se pueden borrar de a uno o todos juntos."
  tecnico: "Revisar > Nuevo comentario; responder desde el globo; Revisar > Comentarios > Eliminar > Eliminar todos los comentarios del documento."
frases: ["dejar un comentario al costado en word", "cómo borro los globitos del costado del documento", "sacar todos los comentarios del word", "agregar una nota al margen del texto"]
pasos:
  - texto: "Seleccioná el texto sobre el que querés comentar. En la pestaña «Revisar», tocá «Nuevo comentario» y escribí tu nota. Aparece al costado de la hoja."
    abrir: "https://support.microsoft.com/es-es/word/insert-delete-or-change-a-comment"
  - texto: "Para contestar un comentario, usá el botón de responder del propio comentario y escribí."
  - texto: "Para borrar uno: en «Revisar», en el grupo «Comentarios», andá con «Siguiente» hasta ese comentario y tocá «Eliminar»."
  - texto: "Para borrar todos juntos: tocá la flechita de «Eliminar» y elegí «Eliminar todos los comentarios del documento»."
derivar: "Si lo que ves son tachones y textos de colores, escribile a PC Doctor «Word me tacha lo que borro»."
fuentes:
  - https://support.microsoft.com/es-es/word/insert-delete-or-change-a-comment
madurez: T0
---
id: WRD-015
area: programas
titulo:
  sencillo: "Quiero cambiar una palabra por otra en todo el documento de una vez"
  tecnico: "Buscar y reemplazar texto en Word"
explicacion:
  sencillo: "Si escribiste mal un nombre muchas veces, Word lo puede cambiar en todo el documento de un saque, o de a uno para que vayas revisando."
  tecnico: "Inicio > Reemplazar (Ctrl + H): Buscar / Reemplazar por; Buscar siguiente, Reemplazar, Reemplazar todos."
frases: ["cambiar un nombre en todo el documento", "escribí mal una palabra en todo el word", "reemplazar una palabra por otra en word", "corregir el mismo error en todas las hojas de una vez"]
pasos:
  - texto: "Apretá Ctrl + H (o en la pestaña «Inicio», tocá «Reemplazar», a la derecha)."
    abrir: "https://support.microsoft.com/es-es/word/training/find-and-replace-text-in-word"
  - texto: "En el primer cuadro escribí la palabra que querés cambiar y en «Reemplazar por» la palabra nueva."
  - texto: "Lo más seguro es ir de a uno: tocá «Buscar siguiente» y, si corresponde, «Reemplazar». Si estás seguro, «Reemplazar todos» los cambia todos juntos."
fuentes:
  - https://support.microsoft.com/es-es/word/training/find-and-replace-text-in-word
madurez: T0
