id: WRD-019
area: programas
titulo:
  sencillo: "Quiero hacer la misma carta para muchas personas con el nombre de cada una"
  tecnico: "Combinar correspondencia con una planilla de Excel"
explicacion:
  sencillo: "La «combinación de correspondencia» junta una carta de Word con una lista de Excel: Word arma una carta por persona y pone en cada una el nombre, la dirección o lo que tenga la lista."
  tecnico: "Origen de datos en Excel (encabezados de columna, primera hoja); Correspondencia > Editar lista de destinatarios > Insertar campo de combinación > Vista previa de resultados > Finalizar y combinar."
frases: ["hacer cartas con el nombre de cada uno", "combinar correspondencia con excel", "mandar la misma invitación a muchos con su nombre", "poner los nombres de una lista de excel en una carta"]
pasos:
  - texto: "Prepará la lista en Excel: en la primera fila, el título de cada columna (por ejemplo «Nombre», «Dirección»), y todos los datos en la primera hoja de la planilla."
    abrir: "https://support.microsoft.com/es-es/word/mail-merge-using-an-excel-spreadsheet"
  - texto: "En Word, escribí la carta. En la pestaña «Correspondencia», elegí los destinatarios buscando esa planilla. Con «Editar lista de destinatarios» podés destildar a quien no quieras."
  - texto: "Poné el cursor donde va el nombre y usá «Insertar campo de combinación» para elegir la columna. Repetí con lo que necesites."
  - texto: "Revisá cómo queda cada carta con la vista previa de resultados. Al final, usá «Finalizar y combinar» para imprimir."
fuentes:
  - https://support.microsoft.com/es-es/word/mail-merge-using-an-excel-spreadsheet
madurez: T0
