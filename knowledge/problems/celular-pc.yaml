pasos:
  - texto: "Instalá la app Dispositivos Apple desde Microsoft Store. Conectá el iPhone con el cable y desbloquealo."
  - texto: "Cuando el iPhone pregunte si confiás en esta computadora, tocá «Confiar» (o «Permitir»)."
