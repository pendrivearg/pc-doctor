id: CEL-008
area: programas
titulo:
  sencillo: "No me llegan a la compu los avisos del celular"
  tecnico: "Notificaciones que no aparecen en Vínculo Móvil"
explicacion:
  sencillo: "Si los avisos del celular dejaron de aparecer en la compu, suele ser el modo de concentración de Windows, el ahorro de batería o un permiso del celular que se desactivó."
  tecnico: "Asistente de concentración/No molestar, ahorro de batería en la PC, acceso a notificaciones de Enlace a Windows (Android), «Compartir notificaciones del sistema» y alcance Bluetooth (iPhone). Android 15 oculta notificaciones sensibles."
frases: ["no me aparecen las notificaciones del celular en la compu", "dejaron de llegar los avisos del teléfono a la pc", "vínculo móvil no muestra notificaciones"]
pasos:
  - texto: "En la compu, revisá que no esté activado «No molestar» o la concentración, y que la batería no esté baja o con ahorro de batería."
    abrir: "ms-settings:notifications"
  - texto: "En Android, buscá en la configuración «Acceso a notificaciones» (o parecido), apagá y prendé Enlace a Windows y tocá «Permitir»."
  - texto: "En iPhone, dejá el Bluetooth prendido y el iPhone cerca, y revisá que esté activada la opción para compartir las notificaciones del sistema en Configuración > Bluetooth."
  - texto: "Abrí la sección de notificaciones de Vínculo Móvil y esperá que se actualice. Algunos avisos con códigos se ven solo en el celular. Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-US/Windows/Apps/PhoneLink/troubleshooting-notifications-in-the-phone-link"
fuentes:
  - https://support.microsoft.com/en-US/Windows/Apps/PhoneLink/troubleshooting-notifications-in-the-phone-link
madurez: T0
