id: CEL-010
area: programas
titulo:
  sencillo: "Vínculo Móvil no se conecta con mi celular"
  tecnico: "Solución de problemas de conexión de Vínculo Móvil (Android)"
explicacion:
  sencillo: "Para que se conecten, el celular y la compu tienen que estar en el mismo Wi-Fi de tu casa, con la misma cuenta de Microsoft y sin ahorro de batería que corte la aplicación."
  tecnico: "Misma red Wi-Fi de confianza (no redes públicas; AP Isolation del router), ahorro/optimización de batería, misma cuenta de Microsoft (account.microsoft.com/devices), apps en segundo plano, reinicio o volver a vincular."
frases: ["vínculo móvil no encuentra el celular", "el teléfono no se conecta con la compu", "dice que no se puede conectar al celular", "vínculo móvil se desconecta todo el tiempo"]
pasos:
  - texto: "Conectá el celular y la compu al mismo Wi-Fi de tu casa. En redes públicas (bares, hoteles) puede no funcionar."
  - texto: "Apagá el ahorro de batería en la compu y en el celular. En Android, en la información de la aplicación Enlace a Windows > Batería, elegí que no la optimice."
  - texto: "Fijate que en la compu y en Enlace a Windows uses la misma cuenta de Microsoft."
  - texto: "Reiniciá el celular y cerrá y volvé a abrir Vínculo Móvil. Si sigue igual, desvinculalo y vinculalo de nuevo. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/apps/phonelink/troubleshooting-the-phone-link"
fuentes:
  - https://support.microsoft.com/windows/apps/phonelink/troubleshooting-the-phone-link
madurez: T0
