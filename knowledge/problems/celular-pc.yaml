id: CEL-003
area: programas
titulo:
  sencillo: "Quiero leer y mandar los mensajes de texto del celular desde la compu"
  tecnico: "Mensajes SMS/MMS en Vínculo Móvil"
explicacion:
  sencillo: "Con el celular vinculado, Vínculo Móvil muestra los mensajes de texto (SMS) de los últimos 30 días y te deja contestarlos con el teclado de la compu. Es para los SMS del celular, no para WhatsApp."
  tecnico: "Android: SMS/MMS de los últimos 30 días, con imágenes; RCS solo en algunos Samsung. iPhone: solo los mensajes enviados o recibidos con la conexión Bluetooth activa; sin imágenes ni grupos."
frases: ["contestar los mensajes de texto desde la compu", "ver los sms del celular en la computadora", "mandar un mensaje de texto desde la pc", "escribir mensajes del teléfono con el teclado de la compu"]
pasos:
  - texto: "Primero vinculá el celular con Vínculo Móvil. Si todavía no lo hiciste, escribile a PC Doctor «quiero conectar mi celular con la computadora»."
  - texto: "En Vínculo Móvil, entrá a la sección de mensajes. Para uno nuevo, tocá el botón de mensaje nuevo, escribí el nombre o el número y elegí el contacto."
  - texto: "Escribí el texto abajo y mandalo. En Android podés sumar una foto con el botón de imagen; en iPhone no se pueden mandar fotos ni mensajes de grupo desde la compu."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/apps/phonelink/send-and-receive-text-messages-from-your-pc"
fuentes:
  - https://support.microsoft.com/windows/apps/phonelink/send-and-receive-text-messages-from-your-pc
madurez: T0
