id: CEL-025
area: archivos
titulo:
  sencillo: "El celular se quedó sin espacio y quiero liberar lugar con Google Fotos"
  tecnico: "«Libera espacio en este dispositivo» en Google Fotos"
explicacion:
  sencillo: "Google Fotos puede borrar del celular las fotos que ya tienen copia en tu cuenta. Siguen viéndose en la aplicación y en la compu, pero ya no ocupan lugar en el teléfono."
  tecnico: "Google Fotos > foto de perfil > «Libera espacio en este dispositivo»; borra solo copias locales ya respaldadas (las de menos de 30 días pueden quedar). Sin conexión no se ven en la galería."
frases: ["el celular dice almacenamiento lleno por las fotos", "liberar espacio del teléfono sin perder las fotos", "borrar fotos del celular que ya están en google fotos", "no me entran más fotos en el celular"]
pasos:
  - texto: "Antes que nada, fijate que la copia de seguridad de Google Fotos esté activada y al día. Podés ver tus fotos en la compu en photos.google.com."
    abrir: "https://support.google.com/photos/answer/6193313?hl=es-419&co=GENIE.Platform%3DAndroid"
  - texto: "En el celular, abrí Google Fotos, tocá tu foto de perfil y elegí «Libera espacio en este dispositivo»."
  - texto: "Te dice cuánto lugar vas a recuperar. Tocá el botón para liberar: solo se borran del teléfono las que ya tienen copia."
  - texto: "Después no las vas a ver en la galería del celular sin Internet, pero sí en Google Fotos. Google lo explica."
    abrir: "https://support.google.com/photos/answer/6128843?hl=es-419&co=GENIE.Platform%3DAndroid"
fuentes:
  - https://support.google.com/photos/answer/6128843?hl=es-419&co=GENIE.Platform%3DAndroid
