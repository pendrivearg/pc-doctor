id: CEL-004
area: programas
titulo:
  sencillo: "En la compu no aparecen todos los mensajes del celular"
  tecnico: "Mensajes faltantes en Vínculo Móvil"
explicacion:
  sencillo: "Vínculo Móvil no muestra todo: en Android solo los SMS de los últimos 30 días y en iPhone solo los que llegaron mientras estaba conectado. Los mensajes de otras aplicaciones de chat tampoco aparecen."
  tecnico: "Causas: app de mensajería de terceros como predeterminada, red lenta, límites de RCS (solo Samsung Messages), en iPhone historial limitado a la sesión Bluetooth y sin soporte de grupos."
frases: ["no me aparecen los mensajes en vínculo móvil", "faltan mensajes del celular en la compu", "los mensajes viejos no se ven en la pc", "los mensajes de grupo del iphone no llegan a la compu"]
pasos:
  - texto: "Actualizá Vínculo Móvil desde Microsoft Store (buscá actualizaciones en la sección de biblioteca o descargas)."
  - texto: "En Android, si usás otra aplicación de mensajes como principal, puede que algunos no se vean; los SMS comunes sí deberían aparecer. Con red lenta pueden tardar."
  - texto: "En iPhone, dejá el iPhone cerca y con Bluetooth prendido: solo se ven los mensajes de mientras estuvo conectado, y los de grupo no se pueden mandar desde la compu."
  - texto: "Microsoft lista las causas."
    abrir: "https://support.microsoft.com/en-us/windows/apps/phonelink/troubleshooting-for-messages-in-the-phone-link"
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/phonelink/troubleshooting-for-messages-in-the-phone-link
  - https://support.microsoft.com/windows/apps/phonelink/send-and-receive-text-messages-from-your-pc
madurez: T0
