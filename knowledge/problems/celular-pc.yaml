  sencillo: "La app Dispositivos Apple guarda en la compu una copia de todo el iPhone, por si lo perdés o se rompe. Después se puede devolver al mismo iPhone o a uno nuevo."
  tecnico: "Dispositivos Apple > General > «Respalda todos los datos de tu iPhone en este equipo» > «Respaldar ahora»; opción «Encriptar respaldo local»; restaurar con «Restablecer respaldo»."
