id: CEL-013
area: perifericos
titulo:
  sencillo: "Quiero usar el celular como cámara para las videollamadas de la compu"
  tecnico: "Usar el Android como cámara conectada en Windows 11"
explicacion:
  sencillo: "Si la compu no tiene cámara o es mala, Windows 11 puede usar la cámara de tu Android vinculado como si fuera una cámara web."
  tecnico: "Windows 11, Android 10+ y Enlace a Windows 1.24022+. Configuración > Bluetooth y dispositivos > Dispositivos móviles > activar el uso como cámara conectada (Use as connected camera); se elige en cada aplicación."
frases: ["usar el celular como cámara web", "mi compu no tiene cámara y quiero usar la del teléfono", "la cámara del celular para el zoom de la compu", "poner el teléfono como webcam"]
pasos:
  - texto: "Abrí Dispositivos móviles. Si el celular no está, usá la opción para agregar un dispositivo y vincularlo."
    abrir: "ms-settings:mobile-devices"
  - texto: "Elegí tu celular y activá la opción para usarlo como cámara conectada."
  - texto: "En la aplicación de videollamadas (Zoom, Teams, etc.), entrá a su configuración y elegí el celular como cámara. También aparece en la configuración de cámaras de Windows."
    abrir: "ms-settings:camera"
  - texto: "Si el celular no pide permiso, dale permiso de cámara a Enlace a Windows en la configuración de aplicaciones del celular. Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/windows/apps/phonelink/use-your-mobile-device-s-camera"
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/phonelink/use-your-mobile-device-s-camera
  - https://support.microsoft.com/en-us/windows/apps/phonelink/manage-mobile-devices-in-windows
madurez: T0
