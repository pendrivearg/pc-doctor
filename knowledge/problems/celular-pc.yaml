id: CEL-005
area: programas
titulo:
  sencillo: "Quiero hacer y atender llamadas del celular desde la compu"
  tecnico: "Llamadas en Vínculo Móvil (Bluetooth)"
explicacion:
  sencillo: "Con Vínculo Móvil podés llamar y atender usando los parlantes y el micrófono de la compu, sin agarrar el celular. Hace falta Bluetooth en los dos. No reemplaza al teléfono para emergencias."
  tecnico: "Requiere Bluetooth en PC y teléfono (Android 10+ o iOS 15+). Configurar en Vínculo Móvil > Llamadas > Comenzar; marcador, búsqueda de contactos e historial (90 días en Android, 100 llamadas en iPhone)."
frases: ["atender el celular desde la computadora", "llamar por teléfono desde la compu", "hablar por el celular con los parlantes de la pc", "cómo hago llamadas con vínculo móvil"]
pasos:
  - texto: "Prendé el Bluetooth de la compu y del celular, que ya tiene que estar vinculado con Vínculo Móvil."
    abrir: "ms-settings:bluetooth"
  - texto: "En Vínculo Móvil, entrá a la sección de llamadas y tocá el botón para empezar. Seguí las instrucciones: puede pedirte permisos y que confirmes que el PIN es el mismo en los dos aparatos. En el celular, tocá «Permitir»."
    abrir: "https://support.microsoft.com/windows/apps/phonelink/setting-up-calls-in-the-phone-link"
  - texto: "Para llamar: buscá el contacto por nombre o número, o marcá en el teclado numérico, y tocá el botón de marcar. Cuando te llamen, podés atender desde la compu."
    abrir: "https://support.microsoft.com/windows/apps/make-and-receive-phone-calls-from-your-pc"
  - texto: "Para emergencias usá directamente el celular: Microsoft aclara que Vínculo Móvil no reemplaza tu servicio de teléfono."
fuentes:
  - https://support.microsoft.com/windows/apps/phonelink/setting-up-calls-in-the-phone-link
  - https://support.microsoft.com/windows/apps/make-and-receive-phone-calls-from-your-pc
madurez: T0
