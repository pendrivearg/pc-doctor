id: CEL-014
area: archivos
titulo:
  sencillo: "Quiero mandar o recibir un archivo del celular por Bluetooth"
  tecnico: "Transferencia de archivos por Bluetooth en Windows"
explicacion:
  sencillo: "Si el celular y la compu están emparejados por Bluetooth, Windows tiene una ventanita para mandarle archivos al celular o recibir los que te manda. Sirve para cosas chicas, como una foto o un documento."
  tecnico: "Configuración > Bluetooth y dispositivos > Dispositivos > Configuración relacionada > enviar o recibir archivos por Bluetooth (asistente de transferencia de archivos Bluetooth)."
frases: ["mandar una foto al celular por bluetooth", "pasar un archivo por bluetooth de la compu al teléfono", "recibir en la compu algo que mando por bluetooth del celular", "cómo uso el bluetooth para pasar archivos"]
pasos:
  - texto: "Emparejá el celular con la compu por Bluetooth y dejalo prendido y cerca."
    abrir: "ms-settings:bluetooth"
