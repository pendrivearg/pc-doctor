  tecnico: "Alerta «¿Confiar en esta computadora?» e importación desde iPhone"
explicacion:
  sencillo: "La primera vez que enchufás el iPhone, el celular pregunta si confiás en la compu. Si no tocás «Confiar», la compu no puede ver las fotos."
