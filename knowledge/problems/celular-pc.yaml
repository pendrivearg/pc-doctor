id: CEL-007
area: programas
titulo:
  sencillo: "Quiero ver los avisos del celular en la pantalla de la compu"
  tecnico: "Notificaciones del teléfono en Vínculo Móvil"
explicacion:
  sencillo: "Vínculo Móvil puede mostrar en la compu los avisos que te llegan al celular, así no tenés que estar mirando el teléfono mientras trabajás."
  tecnico: "Notificaciones > Comenzar; Android: acceso a notificaciones para Enlace a Windows; iPhone: «Compartir notificaciones del sistema» en Bluetooth. Ajuste en Vínculo Móvil > Configuración > Características."
frases: ["ver las notificaciones del celular en la compu", "que me avise la compu cuando me llega algo al teléfono", "los avisos del celular en la pantalla de la pc"]
pasos:
  - texto: "En Vínculo Móvil, entrá a la sección de notificaciones y tocá el botón para empezar."
  - texto: "En Android: cuando te pida permisos, dejá que abra la configuración del celular, buscá Enlace a Windows en la lista y tocá «Permitir»."
  - texto: "En iPhone: en Configuración > Bluetooth, tocá tu compu y activá la opción para compartir las notificaciones del sistema."
  - texto: "Para apagarlas o ajustarlas, entrá a la configuración de Vínculo Móvil, en la parte de funciones. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/apps/phonelink/setting-up-notifications-in-the-phone-link"
fuentes:
  - https://support.microsoft.com/windows/apps/phonelink/setting-up-notifications-in-the-phone-link
madurez: T0
