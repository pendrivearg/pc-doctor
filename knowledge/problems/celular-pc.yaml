id: CEL-011
area: programas
titulo:
  sencillo: "Quiero desconectar mi celular de la compu para siempre"
  tecnico: "Quitar el teléfono de Vínculo Móvil, de Configuración y de Enlace a Windows"
explicacion:
  sencillo: "Si cambiaste de celular, vendés la compu o no querés que se vean más tus mensajes ahí, hay que quitar el celular en tres lugares: Vínculo Móvil, la Configuración de Windows y la aplicación del celular."
  tecnico: "Vínculo Móvil > Configuración > Dispositivos > Quitar; Configuración > Bluetooth y dispositivos > Dispositivos móviles > administrar dispositivos > Quitar; cerrar sesión en Enlace a Windows y desemparejar Bluetooth."
frases: ["desvincular el celular de la compu", "cambié de celular y quiero sacar el viejo de vínculo móvil", "que no se vean más mis mensajes en la computadora", "quitar el teléfono de la pc"]
pasos:
  - texto: "En Vínculo Móvil, entrá a la configuración, a la parte de dispositivos. En los tres puntitos del celular elegí quitar y confirmá."
  - texto: "En Configuración de Windows, abrí Dispositivos móviles, entrá a la opción para administrar dispositivos y, si figura el celular, quitalo."
    abrir: "ms-settings:mobile-devices"
  - texto: "En el celular, abrí Enlace a Windows, entrá a su configuración o cuenta y cerrá sesión."
  - texto: "Si estaban emparejados por Bluetooth, quitá el celular de la lista de Bluetooth de la compu y la compu de la del celular («Olvidar este dispositivo» en iPhone). Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/windows/apps/phonelink/remove-your-mobile-device-from-phone-link-link-to-windows-and-windows-settings"
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/phonelink/remove-your-mobile-device-from-phone-link-link-to-windows-and-windows-settings
madurez: T0
