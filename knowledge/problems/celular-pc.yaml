id: CEL-002
area: programas
titulo:
  sencillo: "Quiero conectar mi iPhone con la computadora"
  tecnico: "Vincular iPhone con Vínculo Móvil (Phone Link) por Bluetooth"
explicacion:
  sencillo: "El iPhone también se puede vincular con Vínculo Móvil, pero por Bluetooth. Así ves los mensajes, las llamadas y las notificaciones del iPhone en la compu."
  tecnico: "Requisitos: Windows 10 (mayo 2019+) u 11 con Bluetooth de baja energía (BLE) e iOS 16 o posterior. Emparejado con QR y la cámara del iPhone; luego permisos en Configuración > Bluetooth del iPhone."
frases: ["vincular el iphone con la compu", "ver los mensajes del iphone en la computadora", "vínculo móvil funciona con iphone", "conectar el iphone a windows por bluetooth"]
pasos:
  - texto: "Poné el iPhone cerca de la compu y prendé el Bluetooth en los dos."
    abrir: "ms-settings:bluetooth"
  - texto: "En la compu abrí Vínculo Móvil y, donde te pide elegir el teléfono, tocá iPhone."
    abrir: "ms-settings:mobile-devices-addphone-direct"
  - texto: "Escaneá el código QR de la pantalla con la cámara del iPhone y seguí los pasos para emparejarlos por Bluetooth."
  - texto: "En el iPhone, en Configuración > Bluetooth, tocá el nombre de tu compu y activá las opciones para compartir las notificaciones del sistema, mostrar notificaciones y sincronizar contactos: sin eso no llegan mensajes ni llamadas."
  - texto: "Microsoft lo explica (pestaña de iPhone)."
    abrir: "https://support.microsoft.com/windows/apps/phonelink/phone-link-requirements-and-setup"
fuentes:
  - https://support.microsoft.com/windows/apps/phonelink/phone-link-requirements-and-setup
madurez: T0
