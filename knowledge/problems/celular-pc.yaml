id: CEL-006
area: programas
titulo:
  sencillo: "Las llamadas del celular no funcionan en la compu"
  tecnico: "Solución de problemas de llamadas en Vínculo Móvil"
explicacion:
  sencillo: "Si las llamadas no suenan en la compu o no se puede llamar, casi siempre es el Bluetooth o el modo «No molestar». Vínculo Móvil no pasa el audio a auriculares Bluetooth: usá los de cable o los parlantes."
  tecnico: "No molestar silencia alertas; reconectar Bluetooth; desemparejar y volver a configurar Llamadas; optimización de batería de Enlace a Windows; apps en conflicto (Intel Unison, Virtoo); sin audio a auriculares Bluetooth."
frases: ["no suenan las llamadas en la compu", "vínculo móvil no me deja llamar", "atiendo en la pc y no se escucha", "las llamadas se cortan en la computadora"]
pasos:
  - texto: "Fijate que «No molestar» esté apagado en la compu, porque silencia los avisos de llamadas. Después cerrá y volvé a abrir Vínculo Móvil."
    abrir: "ms-settings:notifications"
  - texto: "En el celular, apagá y prendé el Bluetooth. Si sigue igual, quitá el celular de la lista de Bluetooth de la compu (y la compu de la del celular) y volvé a configurar las llamadas desde Vínculo Móvil."
    abrir: "ms-settings:bluetooth"
  - texto: "En Android, en la información de la aplicación Enlace a Windows > Batería, elegí que no optimice la batería (el nombre cambia según la marca)."
  - texto: "Si se escucha mal, desconectá otros aparatos Bluetooth (como el mouse); si hay eco, usá auriculares con cable. Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/windows/apps/phonelink/troubleshooting-calls-in-the-phone-link"
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/phonelink/troubleshooting-calls-in-the-phone-link
madurez: T0
