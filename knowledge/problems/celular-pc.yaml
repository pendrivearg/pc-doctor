id: CEL-012
area: archivos
titulo:
  sencillo: "Quiero pasar un archivo de la compu al celular (o al revés) sin cable"
  tecnico: "Compartir archivos con Vínculo Móvil (Android)"
explicacion:
  sencillo: "Con un Android vinculado, podés mandar un documento o una foto de la compu al celular con «Compartir», y del celular a la compu con «Compartir» > Enlace a Windows."
  tecnico: "PC → Android: clic derecho > Compartir > Vínculo Móvil (llega a Descargas > «Sent from your PC»). Android → PC: Compartir > Enlace a Windows – Enviar a PC (llega a Descargas, subcarpeta de Vínculo Móvil). Requiere Windows 11."
frases: ["mandar un pdf de la compu al celular", "pasar un archivo del teléfono a la pc sin cable", "enviar un documento al celular desde la computadora", "compartir archivos con vínculo móvil"]
pasos:
  - texto: "Necesitás el Android vinculado con Vínculo Móvil y Windows 11."
  - texto: "De la compu al celular: hacé clic derecho sobre el archivo, elegí «Compartir» y, entre las aplicaciones, Vínculo Móvil. En el celular queda en Descargas."
  - texto: "Del celular a la compu: en el celular elegí el archivo, tocá «Compartir», elegí Enlace a Windows (enviar a la PC) y tocá tu compu. Esperá a que diga que se envió. En la compu queda en Descargas, en una carpeta de Vínculo Móvil."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/windows/apps/phonelink/seamlessly-transfer-content-between-your-devices"
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/phonelink/seamlessly-transfer-content-between-your-devices
madurez: T0
