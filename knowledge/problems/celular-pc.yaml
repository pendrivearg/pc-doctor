# Celular y PC: Vínculo Móvil (Android e iPhone), cable USB, Bluetooth, Quick Share, iPhone con Dispositivos Apple e iCloud, y Google Fotos. Guiadas con fuente oficial.
id: CEL-001
area: programas
titulo:
  sencillo: "Quiero conectar mi celular Android con la computadora"
  tecnico: "Vincular Android con Vínculo Móvil (Phone Link) y Enlace a Windows"
explicacion:
  sencillo: "Con la aplicación Vínculo Móvil de Windows y la aplicación Enlace a Windows en el celular, podés ver mensajes, llamadas, notificaciones y fotos del Android en la compu. Los dos tienen que estar en el mismo Wi-Fi."
  tecnico: "Requisitos: Windows 10 (oct. 2022+) u 11, Android 10+, misma red Wi-Fi y la misma cuenta de Microsoft en ambos. Emparejado por código QR; no admite cuentas profesionales o educativas."
frases: ["quiero vincular el celular con la compu", "cómo conecto mi android a la computadora sin cable", "para qué sirve vínculo móvil", "enlazar el teléfono con windows"]
pasos:
  - texto: "En la compu, abrí Vínculo Móvil (buscalo en la barra de tareas) y entrá con tu cuenta de Microsoft. Elegí Android."
    abrir: "ms-settings:mobile-devices-addphone-direct"
  - texto: "En el celular, instalá o abrí la aplicación Enlace a Windows (Link to Windows) y entrá con la misma cuenta de Microsoft que usás en la compu."
  - texto: "En la compu marcá que ya tenés la aplicación lista y elegí emparejar con código QR. En el celular, tocá la opción para vincular el teléfono con la PC y escaneá el código que aparece en la pantalla de la compu."
  - texto: "Aceptá los permisos que te pida el celular. Fijate que el celular y la compu estén conectados al mismo Wi-Fi."
  - texto: "Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/windows/apps/phonelink/phone-link-requirements-and-setup"
fuentes:
  - https://support.microsoft.com/windows/apps/phonelink/phone-link-requirements-and-setup
madurez: T0
