id: CEL-009
area: archivos
titulo:
  sencillo: "Quiero ver las fotos del celular en la compu sin enchufarlo"
  tecnico: "Fotos y archivos del Android en el Explorador de archivos (Vínculo Móvil)"
explicacion:
  sencillo: "Con un Android vinculado y Windows 11, el celular aparece en el Explorador de archivos y podés ver sus fotos sin cable. Ojo: si borrás una foto ahí, se borra también del celular."
  tecnico: "Configuración > Bluetooth y dispositivos > Dispositivos móviles > administrar dispositivos > mostrar el dispositivo móvil en el Explorador de archivos (Show mobile device in File Explorer). Reemplaza a la pestaña Fotos de Vínculo Móvil."
frases: ["ver las fotos del celular en la compu sin cable", "el celular no aparece en el explorador de archivos", "abrir la galería del teléfono desde la pc", "quiero ver las fotos del android en la computadora"]
pasos:
  - texto: "Vinculá primero el Android con Vínculo Móvil. Después abrí Dispositivos móviles, entrá a la opción para administrar dispositivos y activá la opción para mostrar el dispositivo móvil en el Explorador de archivos."
    abrir: "ms-settings:mobile-devices"
  - texto: "Abrí el Explorador de archivos (Windows + E), tocá el celular en el panel de la izquierda y entrá a la carpeta de la cámara."
  - texto: "Para quedarte con una foto en la compu, copiala o arrastrala a una carpeta tuya. No la borres desde ahí si la querés conservar: se borra también del celular."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/apps/phonelink/setting-up-photos-in-the-phone-link"
fuentes:
  - https://support.microsoft.com/windows/apps/phonelink/setting-up-photos-in-the-phone-link
  - https://support.microsoft.com/en-us/windows/apps/phonelink/manage-mobile-devices-in-windows
madurez: T0
