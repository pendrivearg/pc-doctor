id: ACX-007
area: basico
titulo:
  sencillo: "Quiero que el Narrador me diga qué hay en una foto"
  tecnico: "Descripción de imágenes y vínculos con el Narrador (Narrador + Ctrl + D)"
explicacion:
  sencillo: "Cuando el Narrador llega a una foto que no tiene texto, te puede leer una descripción de lo que muestra. En un enlace, te puede decir adónde lleva. Para hacerlo, normalmente manda la imagen a Microsoft."
  tecnico: "Narrador + Ctrl + D describe la imagen o el destino del vínculo con el foco; la imagen se envía a Microsoft (en Copilot+ PC con Snapdragon, descripción en el dispositivo con modelos de IA). Se desactiva en la configuración del Narrador, en la administración de datos y servicios."
frases: ["el narrador dice imagen y no me dice qué es", "que la compu me describa una foto", "soy ciego y quiero saber qué hay en una imagen", "a dónde lleva este enlace, que me lo diga el narrador"]
pasos:
  - texto: "Con el Narrador prendido, llegá hasta la imagen (con Tab o las flechas) y apretá la tecla del Narrador (Bloq Mayús o Insert) + Ctrl + D. Te lee una descripción de la imagen; si estás sobre un enlace, te dice adónde lleva."
  - texto: "Tené en cuenta que, para describirla, la imagen se manda a Microsoft. En algunas Copilot+ PC (con procesador Snapdragon) la descripción se hace en la propia compu y es más detallada."
  - texto: "Si no querés que se manden imágenes, abrí la configuración del Narrador (Windows + Ctrl + N) y apagá ese servicio en la parte de administración de datos y servicios."
    abrir: "ms-settings:easeofaccess-narrator"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/narrator/chapter-2-narrator-basics"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-2-narrator-basics
madurez: T0
