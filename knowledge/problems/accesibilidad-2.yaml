id: ACX-002
area: basico
titulo:
  sencillo: "La voz del Narrador no me gusta o suena muy robótica"
  tecnico: "Cambiar la voz del Narrador y agregar voces naturales"
explicacion:
  sencillo: "El Narrador puede hablar con distintas voces. Además de las que vienen, se pueden agregar «voces naturales», que suenan más parecidas a una persona."
  tecnico: "Configuración del Narrador (Windows + Ctrl + N) > «Elige una voz»; «Agregar» para voces naturales (vista previa e instalación). Narrador + Alt + Más/Menos cambia de voz."
frases: ["la voz del narrador suena como un robot", "cambiar la voz que lee la pantalla", "quiero una voz más natural para el narrador", "el narrador habla con una voz que no entiendo bien"]
pasos:
  - texto: "Apretá Windows + Ctrl + N para abrir la configuración del Narrador."
    abrir: "ms-settings:easeofaccess-narrator"
  - texto: "En «Elige una voz», elegí otra de la lista y escuchá cómo suena."
  - texto: "Para una voz más natural, tocá «Agregar», elegí una voz, escuchala con la vista previa e instalala. Puede tardar un poco en descargarse."
  - texto: "Con el Narrador prendido también podés pasar de una voz a otra con la tecla del Narrador + Alt + Más (+) o Menos (−). La tecla del Narrador es Bloq Mayús o Insert."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/narrator/chapter-7-customizing-narrator"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-7-customizing-narrator
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-2-narrator-basics
madurez: T0
