id: ACX-009
area: basico
titulo:
  sencillo: "Con el acceso por voz quiero abrir, cambiar y cerrar programas"
  tecnico: "Acceso por voz: órdenes para ventanas y aplicaciones"
explicacion:
  sencillo: "Una vez que el acceso por voz está andando, podés abrir un programa, pasar a otro, agrandar o achicar la ventana y cerrarla solo diciéndolo. Las órdenes dependen del idioma que elegiste para el acceso por voz."
  tecnico: "Voice access (Windows 11 22H2+): Open/Close/Switch to [programa], Minimize/Maximize window, Go to desktop, Scroll [dirección]. En español la página oficial las muestra como «Abrir», «Cerrar», «Ir a», «Minimizar ventana», «Maximizar ventana», «Ir al escritorio»."
frases: ["abrir el word diciéndolo en voz alta", "cambiar de programa hablando", "cerrar una ventana con la voz", "bajar en la página sin tocar el mouse, hablando"]
pasos:
  - texto: "Con el acceso por voz escuchando, decí «Abrir» y el nombre del programa (por ejemplo, «Abrir Calculadora»). Si no lo encuentra, abre la búsqueda de Windows con resultados numerados: decí el número, o «Cancelar»."
  - texto: "Para pasar a otro programa decí «Ir a» y su nombre; para cerrarlo, «Cerrar» y su nombre. «Minimizar ventana» y «Maximizar ventana» achican o agrandan la que estás usando, e «Ir al escritorio» te lleva al escritorio."
  - texto: "Para bajar o subir en una página, dejá la flechita del mouse sobre lo que querés mover y pedile que se desplace hacia abajo o hacia arriba. Si lo tenés configurado en inglés, las órdenes son «Open», «Switch to», «Close», «Scroll down»."
  - texto: "Microsoft lo explica, con todas las órdenes."
    abrir: "https://support.microsoft.com/accessibility/windows/voice-access/use-voice-to-work-with-windows-and-apps"
derivar: "Si todavía no activaste el acceso por voz, escribile a PC Doctor «manejar la compu con la voz»."
fuentes:
  - https://support.microsoft.com/accessibility/windows/voice-access/use-voice-to-work-with-windows-and-apps
madurez: T0
