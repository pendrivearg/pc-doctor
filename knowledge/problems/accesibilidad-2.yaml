id: ACX-024
area: basico
titulo:
  sencillo: "Puse alto contraste pero quiero elegir yo los colores"
  tecnico: "Personalizar un tema de contraste"
explicacion:
  sencillo: "Los temas de contraste vienen con colores fijos, pero se pueden cambiar: por ejemplo, fondo negro con letras amarillas y enlaces celestes. Se guarda con un nombre para usarlo siempre."
  tecnico: "Configuración > Accesibilidad > Temas de contraste > elegir tema > «Editar»: Fondo, Texto, Hipervínculos, Texto inactivo, Texto seleccionado, Texto de botón (paleta + brillo, «Listo») > «Guardar como» > «Guardar y aplicar»."
frases: ["cambiar los colores del alto contraste", "quiero fondo negro y letras amarillas en toda la compu", "armar mis propios colores de contraste", "en alto contraste no distingo los enlaces"]
pasos:
  - texto: "Abrí Temas de contraste y elegí en la lista el tema que más se acerque a lo que querés."
    abrir: "ms-settings:easeofaccess-highcontrast"
  - texto: "Tocá «Editar», debajo de la lista. Para «Fondo», «Texto», «Hipervínculos», «Texto inactivo», «Texto seleccionado» y «Texto de botón», elegí un color de la paleta, ajustá el brillo con la barrita y tocá «Listo»."
  - texto: "Al terminar, tocá «Guardar como», ponele un nombre y elegí «Guardar y aplicar»."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/change-color-contrast-in-windows"
derivar: "Si querés poner o sacar el alto contraste, escribile a PC Doctor «quiero más contraste en la pantalla»."
fuentes:
  - https://support.microsoft.com/accessibility/windows/change-color-contrast-in-windows
madurez: T0
