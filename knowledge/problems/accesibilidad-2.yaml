id: ACX-008
area: perifericos
titulo:
  sencillo: "Quiero usar mi línea braille con la computadora"
  tecnico: "Pantalla braille con el Narrador"
explicacion:
  sencillo: "El Narrador puede mostrar el texto en una pantalla (línea) braille y recibir lo que escribís en ella. Hay que descargar una vez el complemento de braille y agregar tu pantalla."
  tecnico: "Configuración del Narrador > «Usar una pantalla braille con el Narrador» > «Descargar e instalar Braille» (requiere reiniciar) > «Activar braille» > «Agregar una pantalla braille» (fabricante y conexión USB o puerto serie; Bluetooth no compatible)."
frases: ["conectar mi pantalla braille a la compu", "uso línea braille y quiero que funcione con windows", "el narrador no muestra nada en mi braille", "configurar braille en windows"]
pasos:
  - texto: "Apretá Windows + Ctrl + N y elegí «Usar una pantalla braille con el Narrador»."
    abrir: "ms-settings:easeofaccess-narrator"
  - texto: "Tocá «Descargar e instalar Braille» y esperá: puede tardar. Cuando termine, reiniciá la compu (sin reiniciar no funciona) y volvé a esa misma parte de la configuración."
  - texto: "Activá «Activar braille», tocá «Agregar una pantalla braille» y elegí la marca y la conexión. Solo funciona por USB o puerto serie, no por Bluetooth."
  - texto: "Ahí mismo podés elegir el idioma y el tipo de braille (grado 1, grado 2 o de 8 puntos). Si además usás JAWS o NVDA, puede hacer falta elegir otro controlador de la pantalla."
  - texto: "Microsoft lo explica, con la lista de pantallas compatibles."
    abrir: "https://support.microsoft.com/accessibility/windows/narrator/chapter-8-using-narrator-with-braille"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-8-using-narrator-with-braille
madurez: T0
