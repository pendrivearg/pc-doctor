id: ACX-005
area: basico
titulo:
  sencillo: "Uso el Narrador y quiero que me lea una página de Internet"
  tecnico: "Narrador en páginas web: resumen, modo de examen y lectura continua"
explicacion:
  sencillo: "En una página web, el Narrador te puede decir de un vistazo qué tiene, saltar de título en título o de enlace en enlace, y leerte el texto seguido sin que tengas que ir línea por línea."
  tecnico: "Narrador + S: resumen de la página (dos veces: enlaces populares). Modo de examen (Narrador + Barra espaciadora): H títulos, K vínculos, P párrafos (con Mayús, hacia atrás). Narrador + R lee desde la posición actual; Ctrl detiene."
frases: ["el narrador no me lee la página entera", "quiero escuchar una nota del diario con el narrador", "saltar de título en título con el lector de pantalla", "cómo hago que el narrador lea una página web"]
pasos:
  - texto: "Abrí la página. Apretá la tecla del Narrador (Bloq Mayús o Insert) + S: te dice cuántos enlaces, zonas y títulos tiene. Si lo apretás dos veces rápido, te muestra una lista de los enlaces más usados."
  - texto: "Fijate que esté activo el «modo de examen» (Narrador + Barra espaciadora lo prende o lo apaga). Con él, H salta al título siguiente, K al enlace siguiente y P lee el párrafo siguiente; con Mayús van hacia atrás."
  - texto: "Para que lea de corrido desde donde estás, apretá Narrador + R. Para que se calle, Ctrl."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/narrator/chapter-3-using-scan-mode"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-3-using-scan-mode
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-4-reading-text
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-2-narrator-basics
madurez: T0
