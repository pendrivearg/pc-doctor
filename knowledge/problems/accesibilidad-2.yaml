id: ACX-013
area: basico
titulo:
  sencillo: "La lupa me agranda toda la pantalla y me pierdo"
  tecnico: "Vistas de la Lupa: pantalla completa, lente y acoplada"
explicacion:
  sencillo: "La Lupa no tiene por qué agrandar toda la pantalla. Puede funcionar como una lupa de mano que sigue al mouse, o mostrar lo agrandado en una franja fija y dejar el resto normal. También puede invertir los colores para cansar menos la vista."
  tecnico: "Con la Lupa activa: Ctrl + Alt + F pantalla completa, Ctrl + Alt + L lente, Ctrl + Alt + D acoplada, Ctrl + Alt + M alterna vistas, Ctrl + Alt + I invierte colores. Windows + Más/Menos zoom, Windows + Esc cierra."
frases: ["la lupa agranda todo y no sé dónde estoy", "quiero que la lupa agrande solo un pedacito", "usar la lupa como una lupa de verdad", "poner la lupa con fondo negro y letras blancas"]
pasos:
  - texto: "Prendé la Lupa con Windows + Más (+)."
  - texto: "Apretá Ctrl + Alt + L para la vista de lente: agranda solo un recuadro alrededor del mouse, como una lupa de mano que vas moviendo."
  - texto: "Apretá Ctrl + Alt + D para la vista acoplada: lo agrandado se ve en una franja fija en un borde y el resto de la pantalla queda normal. Ctrl + Alt + F vuelve a pantalla completa, y Ctrl + Alt + M pasa de una vista a otra."
  - texto: "Si el fondo blanco te encandila, Ctrl + Alt + I invierte los colores; el mismo atajo los vuelve a la normalidad. Para cerrar la Lupa, Windows + Esc."
  - texto: "Microsoft lista todos los atajos de la Lupa."
    abrir: "https://support.microsoft.com/en-us/accessibility/windows/magnifier/keyboard-shortcuts-for-magnifier"
fuentes:
  - https://support.microsoft.com/en-us/accessibility/windows/magnifier/keyboard-shortcuts-for-magnifier
madurez: T0
