id: ACX-016
area: basico
titulo:
  sencillo: "Las barras para bajar en las ventanas desaparecen y no las encuentro"
  tecnico: "Mostrar siempre las barras de desplazamiento"
explicacion:
  sencillo: "Windows 11 esconde las barras de desplazamiento (las que sirven para bajar o subir) hasta que acercás el mouse. Si te cuesta encontrarlas, podés hacer que se vean siempre."
  tecnico: "Configuración > Accesibilidad > Efectos visuales > «Mostrar siempre las barras de desplazamiento»."
frases: ["no veo la barra para bajar en la ventana", "la barrita del costado aparece y desaparece", "quiero que la barra de desplazamiento quede siempre a la vista", "no encuentro cómo bajar en una lista sin la ruedita"]
pasos:
  - texto: "Abrí Accesibilidad > «Efectos visuales»."
    abrir: "ms-settings:easeofaccess-visualeffects"
  - texto: "Activá «Mostrar siempre las barras de desplazamiento». Desde ahora quedan a la vista en las ventanas, aunque no acerques el mouse."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-it-easier-to-focus-on-tasks"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-it-easier-to-focus-on-tasks
