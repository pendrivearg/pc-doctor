id: ACX-020
area: basico
titulo:
  sencillo: "Necesito la lupa o el Narrador desde la pantalla donde pongo la clave"
  tecnico: "Accesibilidad antes de iniciar sesión (Lupa y Narrador para todos los usuarios)"
explicacion:
  sencillo: "Si no ves bien, la pantalla para entrar a Windows también puede ser difícil. Se puede usar el botón de accesibilidad de esa pantalla, o dejar configurado que la Lupa o el Narrador arranquen solos antes de iniciar sesión."
  tecnico: "Pantalla de inicio de sesión: ícono de Accesibilidad (abajo a la derecha) con interruptor del Narrador. Lupa (Windows + Ctrl + M): iniciar antes del inicio de sesión. Narrador (Windows + Ctrl + N) > «Mostrar toda la configuración» > «Iniciar el Narrador antes de iniciar sesión para todos los usuarios»."
frases: ["no veo nada en la pantalla donde pongo la clave", "que la lupa ya esté prendida antes de entrar a windows", "el narrador no habla en la pantalla de inicio", "necesito ayuda para ver al prender la compu, antes de entrar"]
pasos:
  - texto: "En la pantalla para entrar, abajo a la derecha, tocá el ícono de accesibilidad: ahí podés prender el Narrador en ese momento. Se apaga solo cuando salís de esa pantalla."
  - texto: "Para que la Lupa ya esté prendida antes de entrar: apretá Windows + Ctrl + M, desplegá la opción de la Lupa y marcá la de iniciarla antes de iniciar sesión. Vale para todos los que usan la compu."
    abrir: "ms-settings:easeofaccess-magnifier"
  - texto: "Para el Narrador: Windows + Ctrl + N > «Mostrar toda la configuración» y marcá «Iniciar el Narrador antes de iniciar sesión para todos los usuarios»."
    abrir: "ms-settings:easeofaccess-narrator"
  - texto: "Microsoft lo explica para la Lupa y para el Narrador."
    abrir: "https://support.microsoft.com/accessibility/windows/magnifier/chapter-1-introducing-magnifier"
derivar: "Si lo que no anda es el teclado para poner la clave, escribile a PC Doctor «no tengo teclado para poner la clave»."
fuentes:
  - https://support.microsoft.com/accessibility/windows/magnifier/chapter-1-introducing-magnifier
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-1-introducing-narrator
madurez: T0
