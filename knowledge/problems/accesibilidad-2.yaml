id: ACX-015
area: perifericos
titulo:
  sencillo: "Quiero manejar la computadora con la mirada"
  tecnico: "Control ocular (Eye control) de Windows"
explicacion:
  sencillo: "Con un aparato especial que sigue los ojos (un «rastreador ocular»), Windows se puede manejar mirando: hacer clic, escribir con un teclado en pantalla y hasta hacer que la compu diga una frase. Sin ese aparato no funciona."
  tecnico: "Requiere eye tracker compatible (Tobii, EyeTech TM5 Mini). Configuración > Accesibilidad > Control ocular. Launchpad: clic, desplazamiento, mouse preciso, teclado (solo distribución EN-US), texto a voz; selección fijando la mirada (tiempo de permanencia)."
frases: ["manejar la compu con los ojos", "mi papá no puede mover las manos y quiere usar la compu", "usar la computadora mirando la pantalla", "tengo un tobii y quiero que windows lo use"]
pasos:
  - texto: "Necesitás un rastreador ocular compatible (por ejemplo, de Tobii o el EyeTech TM5 Mini). Instalá el programa del fabricante, ponelo debajo de la pantalla y hacé la calibración: mirá cada punto hasta que explote y guardá un perfil para cada persona."
  - texto: "Abrí Accesibilidad > «Control ocular» y activalo. Aparece el «launchpad», una barra con botones que se eligen fijando la mirada un momento."
    abrir: "ms-settings:easeofaccess-eyecontrol"
  - texto: "Para hacer clic: fijá la mirada en el botón de clic izquierdo y después mirá el lugar donde querés hacer clic. Para cancelar, mirá fuera de la pantalla. También tiene botones para desplazarte, escribir y hacer que la compu lea en voz alta lo que escribiste."
  - texto: "Si se activan cosas solas (por ejemplo, mirando una película), pausá el control ocular desde el launchpad. Ojo: su teclado solo viene con la distribución en inglés de EE. UU."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/eye-control/eye-control-basics-in-windows"
fuentes:
  - https://support.microsoft.com/accessibility/windows/eye-control/get-started-with-eye-control-in-windows
  - https://support.microsoft.com/accessibility/windows/eye-control/eye-control-basics-in-windows
madurez: T0
