id: ACX-021
area: basico
titulo:
  sencillo: "Quiero que Word me lea el documento y verlo más cómodo para leer"
  tecnico: "Lector inmersivo y Lectura en voz alta en Word"
explicacion:
  sencillo: "El «Lector inmersivo» de Word muestra el documento a pantalla completa, con renglones más cortos, más espacio entre letras y el color de fondo que prefieras. Además te lo puede leer en voz alta, marcando cada palabra mientras la dice."
  tecnico: "Word de escritorio: Vista > Lector inmersivo (Ancho de columna, Color de página, Foco de línea, Espaciado de texto, Sílabas, Lectura en voz alta). Lectura en voz alta: Ctrl + Alt + Barra espaciadora inicia o sale, Ctrl + Barra espaciadora pausa, Alt + flecha derecha/izquierda velocidad."
frases: ["que word me lea el documento en voz alta", "me cuesta leer las cartas largas en word", "poner la hoja de word con otro color de fondo para leer", "leer en word renglón por renglón"]
pasos:
  - texto: "Abrí el documento y en la pestaña «Vista» elegí «Lector inmersivo». Se abre a pantalla completa."
  - texto: "Arriba podés cambiar el «Ancho de columna», el «Color de página», el «Espaciado de texto» y el «Foco de línea» (muestra de a 1, 3 o 5 renglones)."
  - texto: "Tocá «Lectura en voz alta» para que lo lea marcando cada palabra. Con el engranaje cambiás la voz y la velocidad. Atajos: Ctrl + Barra espaciadora pausa o sigue; Alt + flecha derecha o izquierda la hace más rápida o más lenta."
  - texto: "Para salir: «Cerrar Lector inmersivo». Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/word/use-immersive-reader-in-word"
fuentes:
  - https://support.microsoft.com/accessibility/word/use-immersive-reader-in-word
madurez: T0
