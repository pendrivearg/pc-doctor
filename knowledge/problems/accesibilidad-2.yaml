id: ACX-010
area: basico
titulo:
  sencillo: "Con el acceso por voz no puedo hacer clic en un botón que no tiene nombre"
  tecnico: "Acceso por voz: superposición de números"
explicacion:
  sencillo: "Si un botón o un ícono no tiene un nombre que puedas decir, el acceso por voz le pone un número a cada cosa que se puede tocar: decís el número y hace clic ahí."
  tecnico: "Voice access: «Hacer clic en [elemento]»; «Mostrar números» (Show numbers) etiqueta los elementos; «[número]» o «Hacer clic en [número]»; «Ocultar números» o «Cancelar». Para lo que no recibe número, superposición de cuadrícula."
frases: ["el acceso por voz no encuentra el botón que quiero", "hacer clic diciendo un número", "aparecen numeritos en la pantalla cuando hablo", "cómo toco un ícono con la voz"]
pasos:
  - texto: "Si el botón tiene un nombre visible, decí «Hacer clic en» y ese nombre. No hace falta decirlo entero: alcanza con una parte."
  - texto: "Si no tiene nombre, decí «Mostrar números»: aparece un número sobre cada cosa que se puede tocar. Decí el número (o «Hacer clic en» y el número) y hace clic ahí. En inglés es «Show numbers»."
  - texto: "Para sacar los números sin elegir nada, decí «Ocultar números» o «Cancelar»."
  - texto: "Si lo que querés tocar no recibe número, se puede usar la cuadrícula para llevar la flechita a cualquier lugar de la pantalla. Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/voice-access/use-voice-to-interact-with-items-on-the-screen"
fuentes:
  - https://support.microsoft.com/accessibility/windows/voice-access/use-voice-to-interact-with-items-on-the-screen
madurez: T0
