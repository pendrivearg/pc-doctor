id: ACX-011
area: basico
titulo:
  sencillo: "Los subtítulos en vivo escriben en otro idioma (o quiero que traduzcan)"
  tecnico: "Subtítulos en vivo: cambiar el idioma y traducción en Copilot+ PC"
explicacion:
  sencillo: "Los subtítulos en vivo de Windows escriben en un idioma por vez. Si escriben en inglés lo que se dice en castellano, hay que cambiarles el idioma. Algunas compus nuevas (Copilot+ PC) además pueden traducir, pero solo al inglés o al chino."
  tecnico: "Engranaje de la ventana de subtítulos > «Cambiar idioma» > «Continuar» > «Descargar». En 23H2 o anterior: «Idioma de subtítulos» > «Agregar un idioma» (Idioma y región, reconocimiento de voz mejorado). Traducción: Copilot+ PC con 24H2 o posterior; destino inglés (más de 40 idiomas) o chino simplificado (27)."
frases: ["los subtítulos de la compu salen en inglés", "los subtítulos en vivo no entienden castellano", "cambiar el idioma de los subtítulos de windows", "que la compu traduzca lo que dicen en un video en otro idioma"]
pasos:
  - texto: "Abrí los subtítulos en vivo (Windows + Ctrl + L). En su ventanita tocá el engranaje > «Cambiar idioma», elegí el idioma (por ejemplo, español), tocá «Continuar» y, si te lo pide, «Descargar». Te avisa cuando está listo."
  - texto: "Si tu Windows 11 es 23H2 o anterior: engranaje > «Idioma de subtítulos» > «Agregar un idioma». Se abre Idioma y región para agregar un idioma que tenga reconocimiento de voz; después elegilo en «Idioma de subtítulos»."
    abrir: "ms-settings:regionlanguage"
  - texto: "Traducir: solo en una Copilot+ PC con Windows 11 24H2 o más nuevo, y la página de Microsoft solo menciona traducción al inglés o al chino simplificado. Aparece sola cuando el idioma de salida de los subtítulos es uno de esos."
  - texto: "Microsoft lo explica, con la lista de idiomas."
    abrir: "https://support.microsoft.com/accessibility/windows/use-live-captions-to-better-understand-audio"
derivar: "Si todavía no usaste los subtítulos en vivo, escribile a PC Doctor «quiero subtítulos en todo lo que se escucha»."
fuentes:
  - https://support.microsoft.com/accessibility/windows/use-live-captions-to-better-understand-audio
madurez: T0
---
id: ACX-012
area: basico
titulo:
  sencillo: "La voz que me lee los textos habla en otro idioma o con acento raro"
  tecnico: "Idioma y voces de texto a voz (Hora e idioma > Voz)"
explicacion:
  sencillo: "Las funciones que leen en voz alta (el Lector inmersivo, la lectura en voz alta de Word o de Edge) usan las voces instaladas en Windows. Si no hay una voz en español, leen con una voz de otro idioma. Se agrega el idioma con su voz y listo."
  tecnico: "Hora e idioma > Idioma y región > Agregar un idioma (marcar texto a voz); Hora e idioma > Voz: idioma de voz, opción de reconocer acentos no nativos, voz predeterminada y velocidad."
frases: ["la voz que lee los textos habla en inglés", "la compu lee el español con acento gringo", "agregar una voz en español a la compu", "el leer en voz alta pronuncia todo mal"]
pasos:
  - texto: "Abrí Hora e idioma > Idioma y región y fijate que «Español» esté en la lista. Si no está, tocá «Agregar un idioma», elegí la variante de español que quieras y, al instalarla, dejá marcada la opción de texto a voz."
    abrir: "ms-settings:regionlanguage"
  - texto: "Después abrí Hora e idioma > Voz: en el idioma de voz elegí español, y más abajo, en las voces, elegí una en español y la velocidad que te resulte cómoda."
    abrir: "ms-settings:speech"
  - texto: "Si hablás con un acento distinto del idioma elegido, ahí mismo podés activar que reconozca acentos no nativos."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/education/learning-accelerators/download-languages-and-voices-for-immersive-reader-read-mode-and-read-aloud"
fuentes:
  - https://support.microsoft.com/en-us/education/learning-accelerators/download-languages-and-voices-for-immersive-reader-read-mode-and-read-aloud
madurez: T0
