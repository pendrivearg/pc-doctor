id: ACX-023
area: basico
titulo:
  sencillo: "Quiero que Edge me lea una página o me la muestre limpia y con letra grande"
  tecnico: "Modo de lectura y Leer en voz alta en Microsoft Edge"
explicacion:
  sencillo: "Microsoft Edge tiene un modo de lectura que deja solo el texto de la nota, sin publicidad ni menús, con la letra y el fondo que quieras. Desde ahí también te la puede leer en voz alta."
  tecnico: "Edge: F9 o ícono del modo de lectura en la barra de direcciones (se habilita en Configuración > Apariencia > Barra de herramientas). Leer en voz alta en la barra del modo de lectura (o Más herramientas): reproducir, párrafo anterior/siguiente, opciones de voz. Preferencias de texto: fuente, tamaño, ancho de columna y tema."
frases: ["que edge me lea la nota en voz alta", "ver una página de edge sin tanta cosa alrededor", "agrandar la letra de una nota en edge para leerla", "en edge quiero escuchar una página en vez de leerla"]
pasos:
  - texto: "En Microsoft Edge, abrí la página y apretá F9 (o tocá el ícono del modo de lectura en la barra de direcciones). Si el ícono no está, se activa desde el menú de los tres puntos > Configuración > Apariencia, en la barra de herramientas."
  - texto: "Para que te la lea, tocá «Leer en voz alta» en la barra de arriba. Aparecen botones para reproducir, saltar de párrafo y las opciones de voz, donde elegís la voz y la velocidad. Para parar, pausa o la X."
  - texto: "Para leer más cómodo, tocá el ícono de configuración de esa barra y, en la apariencia, cambiá el tipo de letra, el tamaño (mové la barrita a la derecha para agrandarla), el ancho de la columna y el color de fondo."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/edge/use-immersive-reader-in-microsoft-edge"
fuentes:
  - https://support.microsoft.com/edge/use-immersive-reader-in-microsoft-edge
  - https://support.microsoft.com/accessibility/windows/make-it-easier-to-focus-on-tasks
madurez: T0
