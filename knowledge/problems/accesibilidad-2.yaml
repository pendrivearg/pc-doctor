id: ACX-004
area: basico
titulo:
  sencillo: "Uso el Narrador y no sé cómo moverme ni hacer que se calle"
  tecnico: "Comandos básicos del Narrador"
explicacion:
  sencillo: "Con el Narrador la compu se maneja con el teclado: unas pocas teclas alcanzan para moverte, abrir cosas, repetir lo último y hacer que deje de hablar."
  tecnico: "Tab/flechas para moverse, Enter para activar, Ctrl para callar, Narrador + X repite, Narrador + T lee el título, Narrador + W lee la ventana, Narrador + 1 aprendizaje de entrada."
frases: ["cómo hago callar al narrador un momento", "no sé qué teclas usar con el narrador", "quiero que el narrador repita lo que dijo", "moverme por la pantalla con el lector de pantalla"]
pasos:
  - texto: "Para que se calle en el momento, apretá Ctrl. La «tecla del Narrador» es Bloq Mayús o Insert."
  - texto: "Para moverte usá Tab o las flechas; para abrir o activar lo que te leyó, Enter. Con Alt + Tab pasás de un programa a otro y te dice el nombre de cada uno."
  - texto: "Narrador + X repite lo último que dijo; Narrador + T lee el título de la ventana y Narrador + W la ventana entera; Narrador + F12 dice la hora y la fecha."
  - texto: "Para practicar sin miedo, Narrador + 1 hace que te diga qué hace cada tecla que tocás; volvé a apretarlo para salir."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/narrator/chapter-2-narrator-basics"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-2-narrator-basics
madurez: T0
