id: ACX-025
area: basico
titulo:
  sencillo: "No puedo hacer clic, pero quiero escribir con el teclado de la pantalla"
  tecnico: "Teclado en pantalla: mantener el puntero sobre las teclas o escanearlas"
explicacion:
  sencillo: "El teclado en pantalla se puede usar sin hacer clic: dejás la flechita quieta sobre una tecla y se escribe sola. Si usás un pulsador (switch), el teclado va recorriendo las teclas y vos lo apretás cuando llega a la que querés."
  tecnico: "Teclado en pantalla > «Opciones»: «Mantener el puntero sobre las teclas» (duración), escanear las teclas (velocidad de escaneo; con dispositivo de conmutación o clic simulado), «Usar predicción de texto», «Activar teclado numérico», «Usar sonido de clic»."
frases: ["no puedo hacer clic y quiero escribir", "escribir dejando el mouse quieto sobre las letras", "uso un pulsador para manejar la compu y quiero escribir", "que el teclado de la pantalla escriba sin apretar el botón"]
pasos:
  - texto: "Abrí Accesibilidad > Teclado y activá «Teclado en pantalla»."
    abrir: "ms-settings:easeofaccess-keyboard"
  - texto: "En el teclado que aparece, tocá la tecla «Opciones»."
  - texto: "Elegí «Mantener el puntero sobre las teclas» y mové la barrita de la duración: la tecla se escribe cuando dejás la flechita encima ese tiempo, sin hacer clic. Sirve con mouse o con joystick."
  - texto: "Si usás un pulsador, elegí la opción de escanear las teclas y ajustá la velocidad. Ahí también podés activar la predicción de texto, así escribís menos letras."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/use-the-on-screen-keyboard-osk-to-type"
fuentes:
  - https://support.microsoft.com/accessibility/windows/use-the-on-screen-keyboard-osk-to-type
madurez: T0
