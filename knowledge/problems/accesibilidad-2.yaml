id: ACX-019
area: basico
titulo:
  sencillo: "Quiero prender la lupa o el Narrador rápido, sin buscar en Configuración"
  tecnico: "Menú de Accesibilidad en la configuración rápida (Windows + A)"
explicacion:
  sencillo: "En el panel que se abre abajo a la derecha (donde están el Wi-Fi y el volumen) hay un botón de Accesibilidad con las ayudas más usadas. Con un toque las prendés o apagás, sin entrar a Configuración."
  tecnico: "Windows + A abre la configuración rápida; el botón Accesibilidad despliega seis opciones con interruptor (Lupa, Filtros de color, Narrador, Audio mono, Subtítulos en vivo, Teclas especiales) y un acceso a más configuración, donde se elige qué mostrar."
frases: ["un atajo para prender la lupa rápido", "dónde está el botón de accesibilidad de abajo", "prender y apagar el narrador sin entrar a configuración", "tener a mano las opciones de accesibilidad"]
pasos:
  - texto: "Apretá Windows + A para abrir la configuración rápida y elegí el botón de «Accesibilidad»."
  - texto: "Aparecen interruptores para la Lupa, los filtros de color, el Narrador, el audio mono, los subtítulos en vivo y las teclas especiales. Tocá el que quieras para prenderlo o apagarlo."
  - texto: "Abajo de esa lista hay un botón para ir a más opciones de accesibilidad; desde ahí también podés cambiar qué ayudas aparecen en el menú."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/accessibility/windows/use-a-screen-reader-and-keyboard-to-navigate-the-windows-accessibility-flyout"
fuentes:
  - https://support.microsoft.com/en-us/accessibility/windows/use-a-screen-reader-and-keyboard-to-navigate-the-windows-accessibility-flyout
madurez: T0
