id: ACX-003
area: basico
titulo:
  sencillo: "El Narrador habla muy rápido (o muy lento, o muy fuerte)"
  tecnico: "Velocidad, tono y volumen del Narrador"
explicacion:
  sencillo: "Se puede hacer que el Narrador hable más despacio, más rápido, más fuerte o más bajo, con el teclado o desde su configuración. Esto no cambia el volumen del resto de la compu."
  tecnico: "Narrador + Más/Menos: velocidad. Narrador + Ctrl + Más/Menos: volumen. En configuración: «Velocidad», «Tono» y «Volumen». Tecla del Narrador: Bloq Mayús o Insert."
frases: ["el narrador habla demasiado rápido y no le entiendo", "hacer que la voz de la compu lea más despacio", "el narrador habla muy bajito", "bajarle el volumen a la voz que lee"]
pasos:
  - texto: "Con el Narrador prendido, la «tecla del Narrador» es Bloq Mayús o Insert (la que prefieras)."
  - texto: "Más rápido: tecla del Narrador + Más (+). Más lento: tecla del Narrador + Menos (−)."
  - texto: "Más fuerte: tecla del Narrador + Ctrl + Más (+). Más bajo: tecla del Narrador + Ctrl + Menos (−)."
  - texto: "También podés elegirlo con calma en la configuración del Narrador (Windows + Ctrl + N): debajo de la voz, en «Velocidad», «Tono» y «Volumen»."
    abrir: "ms-settings:easeofaccess-narrator"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/narrator/chapter-2-narrator-basics"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-2-narrator-basics
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-7-customizing-narrator
madurez: T0
