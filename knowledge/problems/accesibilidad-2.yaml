id: ACX-006
area: basico
titulo:
  sencillo: "El Narrador repite cada letra que escribo y me marea"
  tecnico: "Eco de teclado y nivel de detalle del Narrador"
explicacion:
  sencillo: "Se puede elegir qué dice el Narrador mientras escribís (cada letra, cada palabra o nada) y cuántos detalles agrega al leer, para que hable solo lo que te sirve."
  tecnico: "Configuración del Narrador: «Hacer que Narrador anuncie cuando escribo» (letras, palabras, teclas de función, de navegación, de alternancia, modificadoras); «Nivel de detalle» de 1 (solo texto) a 5. Narrador + 2 alterna el eco de caracteres."
frases: ["el narrador dice cada letra que toco", "que el narrador no lea lo que escribo", "el narrador habla de más y dice demasiados detalles", "quiero que el narrador lea las palabras enteras al escribir"]
pasos:
  - texto: "Apretá Windows + Ctrl + N para abrir la configuración del Narrador."
    abrir: "ms-settings:easeofaccess-narrator"
  - texto: "Buscá «Hacer que Narrador anuncie cuando escribo», desplegá todas sus opciones y marcá o desmarcá lo que quieras escuchar: «Letras, números y signos de puntuación», «Palabras», las teclas de función, las de navegación, Bloq Mayús y las teclas como Mayús o Alt."
  - texto: "Atajo rápido: tecla del Narrador (Bloq Mayús o Insert) + 2 activa o apaga que diga cada letra."
  - texto: "Si te parece que habla de más al leer, en «Nivel de detalle» elegí un número más bajo (1 es «Solo texto»)."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/narrator/chapter-7-customizing-narrator"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-7-customizing-narrator
madurez: T0
