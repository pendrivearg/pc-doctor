# Accesibilidad a fondo: Narrador (encenderlo, voz, velocidad, comandos, leer páginas, describir imágenes, braille), acceso por voz, subtítulos en otro idioma, voces de lectura, Lupa (vistas y lectura), control ocular, efectos visuales, menú de accesibilidad, ayudas antes de iniciar sesión, Lector inmersivo (Word, OneNote, Edge), contraste personalizado y teclado en pantalla sin clic. Guiadas con fuente oficial.
id: ACX-001
area: basico
titulo:
  sencillo: "Quiero que la compu me lea la pantalla en voz alta (y que arranque sola)"
  tecnico: "Activar el Narrador e iniciarlo automáticamente"
explicacion:
  sencillo: "El Narrador es el lector de pantalla de Windows: dice en voz alta lo que hay en la pantalla y lo que vas tocando. Sirve si no ves bien o no ves. Se prende con el teclado y se puede dejar para que arranque solo cada vez que entrás."
  tecnico: "Windows + Ctrl + Enter activa o desactiva el Narrador; Windows + Ctrl + N abre su configuración («Usar Narrador»). En «Mostrar toda la configuración»: iniciar después del inicio de sesión (usuario) o antes del inicio de sesión (todos)."
frases: ["quiero que la compu me lea lo que hay en la pantalla", "veo muy poco y necesito que la compu me hable", "prender el lector de pantalla de windows", "que el narrador arranque solo cuando prendo la compu"]
pasos:
  - texto: "Apretá a la vez Windows + Ctrl + Enter: el Narrador empieza a hablar. El mismo atajo lo apaga."
  - texto: "La primera vez se abre «Inicio del Narrador». Ahí está «Inicio rápido», un tutorial corto para aprender lo básico (se puede volver a abrir cuando quieras)."
  - texto: "Para que arranque solo: apretá Windows + Ctrl + N, desplegá «Mostrar toda la configuración» al lado de «Usar Narrador» y marcá la opción de iniciar el Narrador después de iniciar sesión."
    abrir: "ms-settings:easeofaccess-narrator"
  - texto: "Microsoft lo explica en su guía del Narrador."
    abrir: "https://support.microsoft.com/accessibility/windows/narrator/chapter-1-introducing-narrator"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-1-introducing-narrator
madurez: T0
