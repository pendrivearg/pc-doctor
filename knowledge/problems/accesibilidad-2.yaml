id: ACX-017
area: basico
titulo:
  sencillo: "Las ventanas que se deslizan y aparecen de a poco me marean"
  tecnico: "Desactivar los efectos de animación (Accesibilidad)"
explicacion:
  sencillo: "Windows hace que las ventanas y los menús se deslicen o aparezcan despacito. A algunas personas eso les molesta o las distrae. Se puede apagar y todo aparece de una."
  tecnico: "Configuración > Accesibilidad > Efectos visuales > «Efectos de animación» desactivado: ventanas y menús sin deslizamiento ni fundido."
frases: ["las animaciones de windows me marean", "que las ventanas aparezcan de golpe sin efecto", "me distrae cuando los menús se deslizan", "sacar el movimiento de las ventanas por la vista"]
pasos:
  - texto: "Abrí Accesibilidad > «Efectos visuales»."
    abrir: "ms-settings:easeofaccess-visualeffects"
  - texto: "Apagá «Efectos de animación». Las ventanas y los menús dejan de deslizarse y de aparecer de a poco."
  - texto: "Si lo que buscás es que la compu ande más rápido, escribile a PC Doctor «sacar las animaciones para que ande más rápido»."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-it-easier-to-focus-on-tasks"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-it-easier-to-focus-on-tasks
