id: ACX-014
area: basico
titulo:
  sencillo: "Quiero que la Lupa, además de agrandar, me lea el texto en voz alta"
  tecnico: "Lectura con la Lupa (Magnifier reading)"
explicacion:
  sencillo: "La Lupa de Windows puede leer en voz alta el texto, sin tener que prender el Narrador. Sirve si ves algo pero te cansa leer."
  tecnico: "Con la Lupa activa: Ctrl + Alt + Enter inicia, pausa y reanuda; Ctrl + Alt + clic lee desde ese punto; Ctrl + Alt + K / H oración siguiente / anterior; cualquier tecla detiene. Tecla modificadora en Configuración > Accesibilidad > Lupa > Lectura."
frases: ["que la lupa me lea lo que estoy viendo", "la lupa puede leer en voz alta", "agrandar y escuchar el texto a la vez", "me canso de leer aunque use la lupa"]
pasos:
  - texto: "Prendé la Lupa con Windows + Más (+)."
  - texto: "Apretá Ctrl + Alt + Enter: empieza a leer desde donde está el cursor. El mismo atajo pausa y sigue. Para que lea desde un lugar, mantené apretadas Ctrl + Alt y hacé clic ahí."
  - texto: "Ctrl + Alt + K lee la oración siguiente y Ctrl + Alt + H la anterior. Para que deje de leer, apretá cualquier tecla."
  - texto: "Si usás también el Narrador, conviene cambiar la tecla de la lectura en Accesibilidad > Lupa, en la parte «Lectura»."
    abrir: "ms-settings:easeofaccess-magnifier"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/magnifier/how-to-use-magnifier-reading"
fuentes:
  - https://support.microsoft.com/accessibility/windows/magnifier/how-to-use-magnifier-reading
madurez: T0
