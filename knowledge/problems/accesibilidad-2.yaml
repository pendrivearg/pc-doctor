id: ACX-018
area: basico
titulo:
  sencillo: "El menú Inicio y la barra de abajo se ven transparentes y me cuesta leerlos"
  tecnico: "Desactivar los efectos de transparencia"
explicacion:
  sencillo: "Windows pone algunos fondos medio transparentes, y lo que hay detrás se mezcla con las letras. Si se apaga la transparencia, los fondos quedan lisos y se lee mejor."
  tecnico: "Configuración > Accesibilidad > Efectos visuales > «Efectos de transparencia» desactivado: fondos de ventanas más opacos."
frases: ["el menú inicio es transparente y no leo bien", "se ve el fondo de pantalla a través de las ventanas", "quiero los fondos de las ventanas lisos", "sacar la transparencia de windows para leer mejor"]
pasos:
  - texto: "Abrí Accesibilidad > «Efectos visuales»."
    abrir: "ms-settings:easeofaccess-visualeffects"
  - texto: "Apagá «Efectos de transparencia». Los fondos de las ventanas quedan más sólidos y se distinguen mejor las letras."
  - texto: "Si además necesitás colores más marcados, escribile a PC Doctor «quiero más contraste en la pantalla»."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-it-easier-to-focus-on-tasks"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-it-easier-to-focus-on-tasks
