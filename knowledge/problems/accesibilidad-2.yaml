id: ACX-022
area: basico
titulo:
  sencillo: "Quiero que OneNote me lea mis notas en voz alta"
  tecnico: "Lector inmersivo en OneNote"
explicacion:
  sencillo: "OneNote tiene un «Lector inmersivo» que lee la página en voz alta y deja agrandar la letra, separar más las letras y cambiar el color de fondo. Hasta puede traducir el texto a otro idioma."
  tecnico: "OneNote (Microsoft 365, 2024, 2021, 2016 y web): Vista > Lector inmersivo; Reproducir; clic en una palabra para empezar desde ahí; opciones de voz (velocidad y voz), opciones de texto, foco de línea, traducir."
frases: ["que onenote me lea lo que anoté", "escuchar mis notas de onenote", "agrandar la letra para leer en onenote", "onenote lector inmersivo cómo se usa"]
pasos:
  - texto: "En OneNote, abrí la página y elegí «Vista» > «Lector inmersivo»."
  - texto: "Tocá el botón de reproducir para que lea los párrafos en voz alta. Para empezar desde otro lugar, hacé clic en la palabra donde querés que arranque."
  - texto: "En las opciones de voz podés elegir la voz y la velocidad; en las de texto, el tamaño de la letra, el espacio entre letras, el tipo de letra y el color de fondo."
  - texto: "Microsoft lo explica (OneNote para Windows 10 ya no tiene soporte desde octubre de 2025)."
    abrir: "https://support.microsoft.com/en-us/topic/use-immersive-reader-for-onenote-10712138-b4ed-4513-958d-d9a1b3038170"
fuentes:
  - https://support.microsoft.com/en-us/topic/use-immersive-reader-for-onenote-10712138-b4ed-4513-958d-d9a1b3038170
madurez: T0
