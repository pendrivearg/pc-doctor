id: DAY-PDF-002
area: programas
titulo:
  sencillo: "Quiero guardar un documento como PDF"
  tecnico: "Exportar o imprimir a PDF"
explicacion:
  sencillo: "Desde Word, Excel y casi cualquier programa se puede guardar como PDF, eligiendo «Microsoft Print to PDF» como impresora."
  tecnico: "Guardar como PDF en Office o impresora virtual Microsoft Print to PDF."
frases: ["cómo guardo un documento en pdf", "convertir el word a pdf", "pasar un archivo a pdf", "imprimir como pdf"]
pasos:
  - texto: "En Word o Excel: Archivo > Guardar como, y en «Tipo» elegí PDF."
  - texto: "En cualquier programa: Imprimir, y como impresora elegí «Microsoft Print to PDF». Te va a pedir dónde guardar el archivo."
  - texto: "Microsoft lo explica para cada programa de Office."
    abrir: "https://support.microsoft.com/office/collab-files/save-or-convert-to-pdf-or-xps-in-office-desktop-apps"
fuentes:
  - https://support.microsoft.com/office/collab-files/save-or-convert-to-pdf-or-xps-in-office-desktop-apps
madurez: T0
