id: DAY-SHR-001
area: archivos
titulo:
  sencillo: "Quiero pasar un archivo a otra computadora que está cerca"
  tecnico: "Uso compartido con dispositivos cercanos"
explicacion:
  sencillo: "Windows puede mandar archivos a otra PC cercana por Bluetooth o Wi-Fi, sin pendrive. Hay que activarlo en las dos."
  tecnico: "Nearby sharing (Bluetooth/Wi-Fi), activado en ambos equipos."
frases: ["pasar un archivo a otra computadora sin pendrive", "mandar fotos a la otra compu", "compartir archivos con la notebook de al lado"]
pasos:
  - texto: "En las dos PCs, activá «Uso compartido con dispositivos cercanos» (Configuración > Sistema)."
  - texto: "En el Explorador, clic derecho sobre el archivo > Compartir > elegí la otra PC. En la otra, aceptá."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/share-things-with-nearby-devices-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/share-things-with-nearby-devices-in-windows
madurez: T0
