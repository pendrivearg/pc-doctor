id: NET-PWD-001
area: red
titulo:
  sencillo: "No sé la clave del Wi-Fi"
  tecnico: "Contraseña de la red Wi-Fi"
explicacion:
  sencillo: >-
    La clave original suele estar en una etiqueta pegada al router. Si una computadora tuya ya está conectada,
    Windows te la puede mostrar. PC Doctor no lee ni guarda contraseñas: te indica dónde verla vos.
  tecnico: "Etiqueta del router; en una PC ya conectada: Red e Internet > Propiedades > Mostrar contraseña de la red."
frases: ["no sé la clave del wifi", "me olvidé la contraseña del wifi", "cuál es la clave de internet", "quiero conectar el celular y no sé la clave"]
pasos:
  - texto: "Mirá la etiqueta del router o módem: la clave suele figurar como «WPA Key», «Clave» o «Password»."
  - texto: "En una PC tuya que ya esté conectada: Redes conocidas > tu red > «Mostrar» junto a la contraseña."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/windows/find-your-wi-fi-network-password-in-windows-2ec74b2e-d9ec-ade1-cc9b-bef1429cb678"
derivar: "Si nadie la sabe y nada está conectado, la empresa de Internet te puede ayudar a cambiarla."
fuentes:
  - https://support.microsoft.com/windows/find-your-wi-fi-network-password-in-windows-2ec74b2e-d9ec-ade1-cc9b-bef1429cb678
madurez: T0
