id: APP-OFF-004
area: programas
titulo:
  sencillo: "Un archivo de Word o Excel no abre o dice que está dañado"
  tecnico: "Documento o libro dañado"
explicacion:
  sencillo: "Office tiene una opción «Abrir y reparar» que muchas veces lo recupera. También se puede volver a una versión anterior si estaba en OneDrive."
  tecnico: "Abrir y reparar / Extraer datos; historial de versiones."
frases: ["el excel dice que el archivo está dañado", "no abre un documento de word", "el archivo está corrupto", "se dañó la planilla"]
pasos:
  - texto: "Hacé una copia del archivo antes de tocarlo."
  - texto: "Abrí Word o Excel, Archivo > Abrir > Examinar, elegí el archivo, tocá la flechita junto a «Abrir» > «Abrir y reparar»."
    abrir: "https://support.microsoft.com/office/open-a-document-after-a-file-corruption-error-47df9d48-2165-4411-a699-1786ac734bc3"
  - texto: "Si el archivo estaba en OneDrive, clic derecho > Historial de versiones para recuperar una versión anterior."
    abrir: "https://support.microsoft.com/excel/repair-a-corrupted-workbook"
fuentes:
  - https://support.microsoft.com/office/open-a-document-after-a-file-corruption-error-47df9d48-2165-4411-a699-1786ac734bc3
  - https://support.microsoft.com/excel/repair-a-corrupted-workbook
madurez: T0
