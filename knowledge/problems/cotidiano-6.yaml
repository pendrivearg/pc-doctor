id: WIN-RST-001
area: windows
titulo:
  sencillo: "Quiero volver la computadora a como estaba hace unos días"
  tecnico: "Restaurar sistema (punto de restauración)"
explicacion:
  sencillo: >-
    «Restaurar sistema» deshace cambios de programas, controladores y configuraciones hasta una fecha anterior,
    sin borrar tus documentos ni fotos. Solo funciona si la protección del sistema estaba activada.
  tecnico: "rstrui.exe: revierte archivos de sistema, registro y programas a un punto de restauración; no toca archivos personales."
frases: ["volver la compu a una fecha anterior", "restaurar a como estaba antes", "punto de restauración", "desde que instalé un programa anda mal"]
pasos:
  - texto: "Apretá Windows + R, escribí  rstrui  y Enter. Elegí un punto de restauración de antes de que empezara el problema."
  - texto: "Si no hay puntos de restauración, esta opción no está disponible en esta PC (no estaba activada)."
  - texto: "Microsoft lo explica, incluido cómo hacerlo si Windows no arranca."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/system-restore"
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/system-restore
madurez: T0
