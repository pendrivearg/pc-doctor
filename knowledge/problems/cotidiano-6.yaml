# Arranque y recuperación (pantalla negra, modo seguro, restaurar), Wi-Fi, documentos y navegador. Guiadas con fuente oficial.
id: BOOT-BLK-001
area: windows
titulo:
  sencillo: "La pantalla queda negra"
  tecnico: "Pantalla negra o en blanco"
explicacion:
  sencillo: "Si la PC está prendida pero la pantalla queda negra, muchas veces se arregla con un atajo que reinicia el video. Si pasa al iniciar sesión o después de una actualización, hay más pasos."
  tecnico: "Reinicio del controlador gráfico, modos de proyección, reinicio del Explorador, controlador de video, modo seguro."
frases: ["la pantalla queda negra", "prendo la compu y la pantalla está negra", "después de poner la clave queda todo negro", "se ve solo el puntero en una pantalla negra"]
sondas: [gpu, eventos]
pasos:
  - texto: "Revisá que el monitor esté prendido y el cable bien conectado en los dos extremos."
  - texto: "Apretá Windows + Ctrl + Mayús + B (reinicia el video: se escucha un pitido o parpadea). Después probá Windows + P y elegí «Solo pantalla de PC» o «Duplicar»."
  - texto: "Si ves el puntero: apretá Ctrl + Alt + Supr > Administrador de tareas > buscá «Explorador de Windows» > Reiniciar."
  - texto: "Microsoft tiene la guía completa (incluye modo seguro y volver atrás el controlador)."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/troubleshooting-blank-screens-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/troubleshooting-blank-screens-in-windows
madurez: T0
