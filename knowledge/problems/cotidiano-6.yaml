id: SEC-POP-001
area: seguridad
titulo:
  sencillo: "Se abren ventanas de propaganda en el navegador"
  tecnico: "Ventanas emergentes y redirecciones"
explicacion:
  sencillo: "El navegador trae un bloqueador de ventanas emergentes. Si igual aparecen muchas, puede ser una extensión instalada sin querer."
  tecnico: "Bloqueador de elementos emergentes, extensiones sospechosas y bloqueador de scareware de Edge."
frases: ["se abren ventanas de propaganda", "me aparecen ventanas emergentes todo el tiempo", "se abren pestañas solas en el navegador", "me salen popups"]
sondas: [seguridad, red]
pasos:
  - texto: "En el navegador, revisá que el bloqueador de ventanas emergentes esté activado (en Edge: Configuración > Permisos del sitio > Elementos emergentes y redireccionamientos)."
    abrir: "https://support.microsoft.com/microsoft-edge/block-pop-ups-in-microsoft-edge-1d8ba4f8-f385-9a0b-e944-aa47339b6bb5"
  - texto: "Revisá las extensiones del navegador y quitá las que no reconozcas."
  - texto: "Si siguen apareciendo, hacé un examen completo con Microsoft Defender."
    abrir: "ms-settings:windowsdefender"
fuentes:
  - https://support.microsoft.com/microsoft-edge/block-pop-ups-in-microsoft-edge-1d8ba4f8-f385-9a0b-e944-aa47339b6bb5
madurez: T0
