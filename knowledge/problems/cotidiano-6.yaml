id: BOOT-SAFE-001
area: windows
titulo:
  sencillo: "Necesito iniciar Windows en modo seguro"
  tecnico: "Modo seguro (inicio con controladores mínimos)"
explicacion:
  sencillo: "El modo seguro arranca Windows con lo mínimo. Sirve para desinstalar un programa o controlador que no deja usar la PC. Para salir, alcanza con reiniciar."
  tecnico: "Entorno de recuperación > Solucionar problemas > Opciones avanzadas > Configuración de inicio > F4/F5."
frases: ["cómo entro en modo seguro", "iniciar en modo a prueba de fallos", "arrancar windows en modo seguro"]
pasos:
  - texto: "IMPORTANTE: si el disco tiene BitLocker, vas a necesitar la clave de recuperación."
    abrir: "https://account.microsoft.com/devices/recoverykey"
  - texto: "Mantené apretada la tecla Mayúscula y elegí Inicio > Encendido > Reiniciar. Después: Solucionar problemas > Opciones avanzadas > Configuración de inicio > Reiniciar, y apretá 5 (modo seguro con red)."
  - texto: "Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/windows/start-your-pc-in-safe-mode-in-windows-92c27cff-db89-8644-1ce4-b3e5e56fe234"
fuentes:
  - https://support.microsoft.com/windows/start-your-pc-in-safe-mode-in-windows-92c27cff-db89-8644-1ce4-b3e5e56fe234
madurez: T0
