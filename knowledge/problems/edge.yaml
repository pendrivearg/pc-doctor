id: EDG-003
area: programas
titulo:
  sencillo: "Quiero borrar un perfil de Edge que ya no se usa"
  tecnico: "Microsoft Edge: quitar un perfil"
explicacion:
  sencillo: "Se puede quitar un perfil de Edge que sobra. Ojo: lo que ese perfil tenía guardado en esta compu (favoritos, historial, extensiones) se va con él, así que antes asegurate de que nadie lo necesite."
  tecnico: "Ícono de perfil > Configuración de perfil > Más perfiles > botón de eliminar junto al perfil > Quitar perfil."
frases: ["sacar un perfil viejo de edge", "eliminar el perfil de alguien en edge", "edge tiene perfiles de más y quiero quitar uno", "borrar el usuario de mi hijo en edge"]
pasos:
  - texto: "Antes de borrar: fijate bien que no sea tu perfil y preguntale a la otra persona si necesita algo de ahí (por ejemplo sus favoritos)."
  - texto: "Tocá el ícono de perfil arriba a la derecha y entrá a la configuración de perfiles."
  - texto: "En «Más perfiles», tocá el botón de eliminar al lado del perfil que querés sacar y confirmá «Quitar perfil»."
    abrir: "https://support.microsoft.com/edge/sign-in-and-create-multiple-profiles-in-microsoft-edge"
fuentes:
  - https://support.microsoft.com/edge/sign-in-and-create-multiple-profiles-in-microsoft-edge
madurez: T0
