# Microsoft Edge: perfiles, colecciones, pestañas verticales, lectura, espacios de trabajo, pantalla dividida, capturas, barra lateral, Copilot, pestañas dormidas, modo IE, predeterminado, inicio, historial, celular, seguimiento, SmartScreen y más. Guiadas con fuente oficial.
id: EDG-001
area: programas
titulo:
  sencillo: "Quiero que cada uno en casa tenga su propio Edge"
  tecnico: "Microsoft Edge: crear un perfil nuevo"
explicacion:
  sencillo: "Si varios usan la misma compu, Edge puede tener un «perfil» para cada uno: cada perfil guarda sus propios favoritos, historial y extensiones, y se abre en su propia ventana."
  tecnico: "Ícono de perfil > Configurar un nuevo perfil (personal o trabajo/escuela); cada perfil tiene datos separados y abre en ventana propia."
frases: ["quiero un edge para mí y otro para mi señora", "crear otro perfil en edge", "que mi nieto tenga su propio edge con sus favoritos", "separar lo del trabajo de lo personal en edge"]
pasos:
  - texto: "Arriba a la derecha de Edge, tocá el ícono de tu perfil (la carita o tu foto)."
  - texto: "Elegí la opción para configurar un perfil nuevo y después si es personal o de trabajo/escuela."
  - texto: "Podés entrar con una cuenta de Microsoft para sincronizar sus cosas o empezar sin datos. Al confirmar, el perfil nuevo se abre en otra ventana de Edge."
    abrir: "https://support.microsoft.com/edge/sign-in-and-create-multiple-profiles-in-microsoft-edge"
fuentes:
  - https://support.microsoft.com/edge/sign-in-and-create-multiple-profiles-in-microsoft-edge
madurez: T0
---
id: EDG-002
area: programas
titulo:
  sencillo: "Abro Edge y no están mis favoritos: capaz estoy en otro perfil"
  tecnico: "Microsoft Edge: cambiar de perfil"
explicacion:
  sencillo: "Si en la compu hay más de un perfil de Edge, cada uno tiene sus propios favoritos e historial. Si abriste el de otra persona, tus cosas no aparecen, pero siguen estando en tu perfil."
  tecnico: "Ícono de perfil > elegir el perfil; Edge lo abre en una ventana nueva. Ctrl + Mayús + M abre el selector de perfiles."
frases: ["en edge me aparecen los favoritos de mi hijo", "cómo paso a mi perfil en edge", "edge me abrió con la cuenta de otro", "cambiar de usuario en el navegador edge"]
pasos:
  - texto: "Mirá el ícono de perfil arriba a la derecha: muestra la foto o la inicial de quién está usando esa ventana."
  - texto: "Tocalo y elegí tu perfil de la lista. Edge lo abre en una ventana nueva, con tus favoritos y tu historial."
    abrir: "https://support.microsoft.com/edge/sign-in-and-create-multiple-profiles-in-microsoft-edge"
  - texto: "Atajo: Ctrl + Mayús + M abre directamente el cambio de perfil."
    abrir: "https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad"
fuentes:
  - https://support.microsoft.com/edge/sign-in-and-create-multiple-profiles-in-microsoft-edge
  - https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad
madurez: T0
