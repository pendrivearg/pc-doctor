id: EDG-012
area: programas
titulo:
  sencillo: "Me apareció una barra a la derecha en Edge"
  tecnico: "Microsoft Edge: barra lateral (mostrar, ocultar automáticamente, personalizar)"
explicacion:
  sencillo: "La barra lateral de Edge es una columna con accesos (Copilot, herramientas, páginas que fijaste). Se puede dejar siempre visible o que se esconda sola y aparezca solo cuando la llamás."
  tecnico: "Configuración y más > Configuración > Barra lateral > Visibilidad: «Siempre activada» u «Oculta automáticamente»; Personalizar (+) para fijar sitios y apps."
frases: ["en edge hay una columna de íconos a la derecha", "sacar la barra del costado de edge", "achicar la barra lateral del navegador", "agregar una página a la barra lateral de edge"]
pasos:
  - texto: "Tocá los tres puntitos arriba a la derecha > «Configuración» > «Barra lateral»."
    abrir: "https://www.microsoft.com/en-us/edge/learning-center/unleash-power-of-edge-sidebar"
  - texto: "En la visibilidad de la barra lateral, elegí que esté siempre o que se oculte automáticamente. Si se oculta, la abrís desde el ícono de Copilot."
  - texto: "Para fijar una página o herramienta en la barra, tocá el botón «+» (Personalizar) y buscala."
fuentes:
  - https://www.microsoft.com/en-us/edge/learning-center/unleash-power-of-edge-sidebar
madurez: T0
