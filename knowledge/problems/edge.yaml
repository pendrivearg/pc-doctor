id: EDG-018
area: programas
titulo:
  sencillo: "Quiero ver qué páginas visité ayer en Edge (o borrar lo último)"
  tecnico: "Microsoft Edge: ver el historial y borrar un período"
explicacion:
  sencillo: "Edge anota las páginas que visitás: con Ctrl + H ves la lista y podés volver a una página que no te acordás. Si querés borrar solo lo último (por ejemplo la última hora), se elige el período. Ojo: si Edge está sincronizado, se borra también en tus otros dispositivos."
  tecnico: "Historial: Ctrl + H. Borrar: Configuración > Privacidad, búsqueda y servicios > Borrar datos de exploración > Elegir qué borrar > Intervalo de tiempo > Borrar ahora (los datos sincronizados se borran en todos los dispositivos)."
frases: ["ver las páginas que visité ayer", "no me acuerdo qué página entré y quiero encontrarla", "borrar solo lo que vi en la última hora", "dónde está el historial de edge"]
pasos:
  - texto: "Para ver el historial, apretá Ctrl + H. Aparece la lista de páginas que visitaste, ordenadas por fecha; tocá una para volver a abrirla."
    abrir: "https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad"
  - texto: "Antes de borrar: lo que borres no se puede recuperar, y si tenés Edge sincronizado con tu cuenta se borra también en el celular y en otras compus."
  - texto: "Para borrar, entrá a Configuración > «Privacidad, búsqueda y servicios» > borrar datos de exploración > elegir qué borrar. En el intervalo de tiempo elegí, por ejemplo, la última hora, marcá «Historial de exploración» y tocá borrar ahora."
    abrir: "https://support.microsoft.com/microsoft-edge/view-and-delete-browser-history-in-microsoft-edge-00cf7943-a9e1-975a-a33d-ac10ce454ca4"
fuentes:
  - https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad
  - https://support.microsoft.com/microsoft-edge/view-and-delete-browser-history-in-microsoft-edge-00cf7943-a9e1-975a-a33d-ac10ce454ca4
madurez: T0
