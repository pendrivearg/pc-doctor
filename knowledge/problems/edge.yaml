id: EDG-010
area: programas
titulo:
  sencillo: "Quiero ver dos páginas a la vez en la misma ventana de Edge"
  tecnico: "Microsoft Edge: pantalla dividida"
explicacion:
  sencillo: "La «pantalla dividida» de Edge muestra dos páginas una al lado de la otra dentro de la misma pestaña, por ejemplo el home banking y la factura. Así no tenés que andar saltando de pestaña."
  tecnico: "Pantalla dividida: Configuración y más (Alt + F) > Pantalla dividida; dos sitios por pestaña; cerrar con la X o separar en dos pestañas desde Más opciones."
frases: ["poner dos páginas una al lado de la otra en edge", "partir la pestaña de edge en dos", "ver la factura y el banco al mismo tiempo en el navegador", "cómo saco la pantalla partida de edge"]
pasos:
  - texto: "Apretá Alt + F (o tocá los tres puntitos arriba a la derecha) y elegí «Pantalla dividida». La pestaña se parte en dos y en la otra mitad abrís la segunda página."
  - texto: "Para cerrar una de las dos mitades, tocá la X arriba a la derecha de esa mitad. Si preferís quedarte con las dos páginas en pestañas separadas, tocá los tres puntitos de esa mitad y elegí la opción para separarlas."
  - texto: "Solo se pueden poner dos páginas por pestaña, y en el celular no está. Si en tu Edge no aparece, puede que tu versión todavía no lo tenga."
fuentes:
  - https://explore.microsoft.com/edge/features/split-screen
madurez: T0
---
id: EDG-011
area: programas
titulo:
  sencillo: "Quiero sacarle una foto a una página entera con Edge"
  tecnico: "Microsoft Edge: Captura de pantalla (antes «Captura web»)"
explicacion:
  sencillo: "Edge trae su propia herramienta para capturar la página: podés sacar solo un pedazo o la página entera, incluso lo que no entra en la pantalla. Después la copiás o la guardás como imagen."
  tecnico: "Captura de pantalla de Edge: Ctrl + Mayús + S, clic derecho > Captura de pantalla o menú Configuración y más; capturar área o página completa; copiar, guardar o marcar."
frases: ["sacar foto de toda la página en edge", "capturar una página larga entera", "guardar como imagen lo que veo en edge", "la captura web de edge"]
pasos:
  - texto: "En la página, apretá Ctrl + Mayús + S, o hacé clic derecho en un lugar vacío y elegí la opción de captura de pantalla."
  - texto: "Elegí si querés marcar un área con el mouse o capturar la página completa (incluye lo que está más abajo)."
  - texto: "Cuando aparece la captura, podés dibujar encima y después copiarla (para pegarla en un correo o en Word) o guardarla en la compu."
fuentes:
  - https://explore.microsoft.com/edge/features/screenshot
madurez: T0
