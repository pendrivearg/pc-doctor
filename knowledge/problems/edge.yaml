id: EDG-006
area: programas
titulo:
  sencillo: "Quiero leer una página de Edge sin publicidad y con letra grande"
  tecnico: "Microsoft Edge: Lector inmersivo (modo de lectura)"
explicacion:
  sencillo: "El Lector inmersivo de Edge muestra solo el texto de una nota o artículo, sin propaganda ni cosas que distraigan. Ahí podés agrandar la letra y cambiar el color del fondo para leer más cómodo."
  tecnico: "Lector inmersivo / modo de lectura: ícono en la barra de direcciones o F9; Preferencias de texto (tamaño, temas de página); clic derecho > Abrir en Lector inmersivo."
frases: ["leer la nota del diario sin tanta propaganda", "agrandar solo el texto de un artículo en edge", "poner la página como un libro para leer tranquilo", "el modo lectura de edge"]
pasos:
  - texto: "Abrí la nota que querés leer y apretá F9, o tocá el ícono del Lector inmersivo en la barra de direcciones. No aparece en todas las páginas: solo en las que tienen un texto para leer."
  - texto: "Si no ves el ícono, seleccioná el texto con el mouse, hacé clic derecho y elegí abrirlo en el Lector inmersivo."
  - texto: "En la barra de arriba del Lector, entrá a las preferencias de texto: ahí agrandás la letra y elegís otro color de página. Para salir, apretá F9 de nuevo."
    abrir: "https://support.microsoft.com/education/use-immersive-reader-in-microsoft-edge-1"
fuentes:
  - https://support.microsoft.com/education/use-immersive-reader-in-microsoft-edge-1
  - https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad
madurez: T0
---
id: EDG-007
area: programas
titulo:
  sencillo: "Quiero que Edge me lea en voz alta lo que dice la página"
  tecnico: "Microsoft Edge: Leer en voz alta"
explicacion:
  sencillo: "Edge puede leerte en voz alta el texto de una página: vos escuchás y ves resaltado lo que va leyendo. Podés elegir otra voz y hacer que lea más lento o más rápido."
  tecnico: "Leer en voz alta: Ctrl + Mayús + U, o Configuración y más > Más herramientas > Leer en voz alta; opciones de voz (voz y velocidad)."
frases: ["que la compu me lea la página", "edge que hable lo que está escrito", "me cuesta leer y quiero escuchar la nota", "cómo hago que lea más despacio la voz de edge"]
pasos:
  - texto: "Abrí la página y apretá Ctrl + Mayús + U. También está en el menú de los tres puntitos, dentro de «Más herramientas»."
    abrir: "https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad"
  - texto: "Arriba aparece una barrita para pausar, seguir o saltar párrafos. En las opciones de voz elegís otra voz y la velocidad."
    abrir: "https://support.microsoft.com/education/use-immersive-reader-in-microsoft-edge-1"
  - texto: "Para que deje de leer, tocá pausa o la X de esa barrita, o volvé a apretar Ctrl + Mayús + U."
fuentes:
  - https://support.microsoft.com/education/use-immersive-reader-in-microsoft-edge-1
  - https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad
madurez: T0
