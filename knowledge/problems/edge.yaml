id: EDG-025
area: programas
titulo:
  sencillo: "Una pestaña de Edge hace ruido y no sé cuál es"
  tecnico: "Microsoft Edge: silenciar una pestaña"
explicacion:
  sencillo: "Cuando una pestaña reproduce sonido, Edge le pone un parlantito al lado del nombre. Tocándolo la silenciás sin cerrar la página ni bajar el volumen de toda la compu."
  tecnico: "Ícono de altavoz en la pestaña que reproduce audio: clic para silenciar o reactivar; Ctrl + M en la pestaña activa."
frases: ["una página empezó a sonar y no sé cuál", "silenciar una pestaña del navegador", "callar un video que arrancó solo en edge", "suena música en edge y no encuentro de dónde"]
pasos:
  - texto: "Mirá las pestañas de arriba: la que hace ruido tiene un parlantito al lado del nombre."
  - texto: "Tocá ese parlantito: la pestaña queda en silencio. Tocalo de nuevo para que vuelva a sonar."
    abrir: "https://www.microsoft.com/en-us/edge/learning-center/how-to-mute-tabs"
  - texto: "Con el teclado: entrá a esa pestaña y apretá Ctrl + M."
fuentes:
  - https://www.microsoft.com/en-us/edge/learning-center/how-to-mute-tabs
  - https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad
madurez: T0
