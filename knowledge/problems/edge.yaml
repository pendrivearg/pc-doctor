id: EDG-015
area: programas
titulo:
  sencillo: "Una página vieja dice que solo funciona con Internet Explorer"
  tecnico: "Microsoft Edge: modo Internet Explorer (modo IE)"
explicacion:
  sencillo: "Internet Explorer ya no existe, pero Edge tiene un «modo Internet Explorer» para abrir esas páginas viejas (algunos sistemas de obras sociales, municipios o empresas). Se activa una sola vez y después se agrega la página a una lista."
  tecnico: "edge://settings/defaultBrowser > Compatibilidad con Internet Explorer: permitir que los sitios se vuelvan a cargar en modo IE; reiniciar; Páginas del modo Internet Explorer > Agregar una página. Salir con «Salir» en la barra de información."
frases: ["la página me pide internet explorer", "cómo abro internet explorer en windows 11", "un sistema viejo no anda en edge", "activar el modo explorer en edge"]
pasos:
  - texto: "En Edge, tocá los tres puntitos > «Configuración» > la sección del navegador predeterminado."
    abrir: "https://support.microsoft.com/edge/internet-explorer-mode-in-microsoft-edge"
  - texto: "En la parte de compatibilidad con Internet Explorer, en la opción de permitir que los sitios se recarguen en modo Internet Explorer, elegí «Permitir». Reiniciá Edge."
  - texto: "Volvé a la misma sección y, en «Páginas del modo Internet Explorer», agregá la dirección de esa página. Al recargarla se abre en modo IE."
  - texto: "Para volver al modo normal, tocá el botón para salir en la barra de aviso de arriba, o cerrá esa pestaña. En compus de empresa, a veces solo lo puede activar el área de sistemas."
fuentes:
  - https://support.microsoft.com/edge/internet-explorer-mode-in-microsoft-edge
madurez: T0
