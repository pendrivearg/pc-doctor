id: EDG-014
area: rendimiento
titulo:
  sencillo: "Vuelvo a una pestaña de Edge y se recarga, y pierdo lo que estaba haciendo"
  tecnico: "Microsoft Edge: pestañas en suspensión y lista «Mantener siempre activos estos sitios»"
explicacion:
  sencillo: "Para ahorrar memoria, Edge «duerme» las pestañas que no usás hace un rato (se ven más claritas). Al tocarlas se despiertan. Si una página que te importa (el correo, una radio, un trámite) no tiene que dormirse nunca, la podés anotar en una lista de excepciones."
  tecnico: "Configuración > Sistema y rendimiento > Rendimiento: «Suspender automáticamente las pestañas», tiempo de inactividad (2 h por defecto) y lista «Mantener siempre activos estos sitios» (Agregar sitio)."
frases: ["edge me duerme las pestañas", "la pestaña del correo se pone gris y se recarga", "que edge no suspenda la página de la radio", "las pestañas de edge se ven apagadas"]
pasos:
  - texto: "Tocá los tres puntitos > «Configuración» > «Sistema y rendimiento» > «Rendimiento»."
    abrir: "https://support.microsoft.com/edge/learn-about-performance-features-in-microsoft-edge"
  - texto: "Buscá la lista de sitios que se mantienen siempre activos, tocá agregar sitio, escribí la dirección completa de la página (por ejemplo la del correo) y confirmá."
  - texto: "Ahí mismo podés elegir después de cuánto tiempo sin usarlas se duermen las pestañas, o apagar la suspensión. Ojo: si la apagás y tenés muchas pestañas, la compu puede andar más lenta."
fuentes:
  - https://support.microsoft.com/edge/learn-about-performance-features-in-microsoft-edge
madurez: T0
