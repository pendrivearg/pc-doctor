id: EDG-022
area: seguridad
titulo:
  sencillo: "Edge me puso una pantalla roja diciendo que el sitio no es seguro"
  tecnico: "Microsoft Defender SmartScreen en Edge: página notificada como no segura"
explicacion:
  sencillo: "Esa pantalla la pone SmartScreen, la protección de Edge, cuando la página fue denunciada por robar datos (phishing) o por repartir virus. Es un aviso para cuidarte: lo más seguro es no entrar, sobre todo si llegaste por un correo o un mensaje."
  tecnico: "Microsoft Defender SmartScreen: compara con listas dinámicas de sitios de phishing y malware y muestra una página de advertencia; permite informar el sitio como seguro o no seguro. Activado por defecto (edge://settings/privacy > Servicios)."
frases: ["edge dice que la página fue notificada como no segura", "me salió una pantalla roja al entrar a un link", "edge no me deja entrar a una página porque es peligrosa", "aviso de sitio de phishing en el navegador"]
pasos:
  - texto: "No sigas adelante ni pongas datos ni claves en esa página. Cerrá la pestaña o volvé atrás."
    abrir: "https://learn.microsoft.com/deployedge/microsoft-edge-security-smartscreen"
  - texto: "Si llegaste por un enlace de un correo o mensaje que «parece» de tu banco u otra empresa, no lo uses: entrá escribiendo vos la dirección oficial."
  - texto: "Si estás seguro de que la página es de confianza y el aviso es un error, desde ese mismo aviso podés informar que el sitio es seguro. Dejá SmartScreen siempre activado."
fuentes:
  - https://learn.microsoft.com/deployedge/microsoft-edge-security-smartscreen
madurez: T0
