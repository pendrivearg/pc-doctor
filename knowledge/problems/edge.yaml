id: EDG-017
area: programas
titulo:
  sencillo: "Quiero que Edge abra las pestañas que tenía la última vez"
  tecnico: "Microsoft Edge: qué se abre al iniciar («Cuando se inicia Edge»)"
explicacion:
  sencillo: "Edge puede abrir al arrancar una pestaña nueva vacía, las mismas pestañas que tenías cuando lo cerraste, o páginas que vos elijas (por ejemplo el diario y el correo). Se elige en la configuración."
  tecnico: "Configuración > Inicio, página principal y nuevas pestañas > Cuando se inicia Edge: abrir la página de nueva pestaña / continuar donde lo dejaste / abrir estas páginas."
frases: ["que edge se abra con las páginas de ayer", "cada vez que abro edge pierdo las pestañas", "que edge arranque siempre en el diario", "edge me abre páginas viejas cuando lo abro y no quiero"]
pasos:
  - texto: "Tocá los tres puntitos arriba a la derecha > «Configuración» y entrá a la sección de inicio, página principal y nuevas pestañas."
    abrir: "https://www.microsoft.com/en-us/edge/learning-center/how-to-manage-edge-startup-settings"
  - texto: "En la parte de cuando se inicia Edge, elegí: abrir una pestaña nueva, continuar donde lo dejaste (vuelven las pestañas de la última vez) o abrir páginas que vos elijas."
  - texto: "Si elegís páginas propias, agregá cada dirección, o usá la opción para usar todas las pestañas que tenés abiertas ahora."
  - texto: "Si Edge se abre solo al prender la compu (sin que lo toques), escribile a PC Doctor «el navegador se abre solo»."
fuentes:
  - https://www.microsoft.com/en-us/edge/learning-center/how-to-manage-edge-startup-settings
madurez: T0
