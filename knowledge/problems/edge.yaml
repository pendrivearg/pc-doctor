id: EDG-004
area: programas
titulo:
  sencillo: "Desaparecieron mis Colecciones de Edge"
  tecnico: "Retiro de Colecciones en Microsoft Edge (pasar a Favoritos)"
explicacion:
  sencillo: "Microsoft sacó las «Colecciones» de Edge: desde la versión 145 ya no se pueden agregar páginas y desde la 149 la función ya no está. Edge ofrece pasar las páginas guardadas a Favoritos: cada colección queda como una carpeta. Las notas y las imágenes no se pasan, solo las páginas."
  tecnico: "Colecciones retiradas (Edge 145: sin altas; Edge 149: no disponible). Aviso con «Mover a Favoritos»: cada colección pasa a una carpeta en la raíz de Favoritos; solo URL. Cuentas personales: bing.com/saves."
frases: ["no encuentro las colecciones de edge", "edge me borró las colecciones", "dónde quedaron las páginas que guardé en colecciones", "ya no puedo agregar cosas a una colección"]
pasos:
  - texto: "Si Edge te muestra el aviso de las Colecciones, elegí la opción de mover todo a Favoritos. Cada colección queda como una carpeta en tus Favoritos."
    abrir: "https://support.microsoft.com/edge/organize-your-ideas-with-collections-in-microsoft-edge"
  - texto: "Abrí tus Favoritos (Ctrl + Mayús + O) y buscá las carpetas con el nombre de tus colecciones."
    abrir: "https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad"
  - texto: "Ojo: las notas y las imágenes que tenías en una colección no se pasan, solo las direcciones de las páginas. Si usás cuenta personal de Microsoft, Microsoft indica que lo guardado también se puede ver en Bing, en «bing.com/saves»."
fuentes:
  - https://support.microsoft.com/edge/organize-your-ideas-with-collections-in-microsoft-edge
  - https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad
madurez: T0
