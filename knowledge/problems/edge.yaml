id: EDG-008
area: programas
titulo:
  sencillo: "Quiero separar en Edge las pestañas de cada tema (trámites, viaje, trabajo)"
  tecnico: "Microsoft Edge: espacios de trabajo (Workspaces)"
explicacion:
  sencillo: "Los «espacios de trabajo» de Edge te dejan guardar juntas las pestañas de un mismo tema, con nombre y color. Por ejemplo, un espacio «Trámites» con la AFIP, el banco y la obra social, que abrís cuando lo necesitás. Hace falta haber entrado a Edge con una cuenta de Microsoft."
  tecnico: "Espacios de trabajo (Edge 144 o posterior, sesión con cuenta Microsoft o Entra): ícono de buscar pestañas > Administrar espacios de trabajo > Nuevo; editar o eliminar desde Más opciones (…). Sincronización: «Espacios de trabajo y grupos de pestañas»."
frases: ["agrupar en edge las páginas de los trámites", "tener las pestañas del trabajo aparte en edge", "guardar un grupo de pestañas para abrirlo otro día", "los espacios de trabajo de edge"]
pasos:
  - texto: "Arriba a la izquierda de Edge, tocá el ícono de buscar pestañas y elegí administrar los espacios de trabajo."
    abrir: "https://support.microsoft.com/edge/getting-started-with-microsoft-edge-workspaces"
  - texto: "Creá uno nuevo: podés empezar con las pestañas que ya tenés abiertas o con uno vacío. Ponele un nombre, elegí un color y confirmá."
  - texto: "Para pasar de un espacio a otro, tocá el botón de espacios de trabajo arriba a la izquierda (muestra el nombre del que estás usando) y elegí otro."
  - texto: "Para cambiarle el nombre o borrarlo, tocá los tres puntitos al lado del espacio. Ojo: si lo borrás, se pierde ese grupo de pestañas guardado."
fuentes:
  - https://support.microsoft.com/edge/getting-started-with-microsoft-edge-workspaces
madurez: T0
