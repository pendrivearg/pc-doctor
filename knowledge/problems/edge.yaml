id: EDG-023
area: programas
titulo:
  sencillo: "Quiero tener una página (como el correo) como si fuera un programa con su ícono"
  tecnico: "Microsoft Edge: instalar un sitio como aplicación"
explicacion:
  sencillo: "Edge puede «instalar» una página que usás mucho como si fuera un programa: se abre en su propia ventana, sin pestañas, y la podés anclar a la barra de tareas o al Inicio. Si después no la querés, se desinstala desde Edge."
  tecnico: "Configuración y más > Más herramientas > Aplicaciones > Instalar este sitio como una aplicación; administración en edge://apps (Detalles > Anclar a la barra de tareas / Anclar a Inicio / Crear acceso directo en el escritorio / Desinstalar)."
frases: ["poner el correo como programa aparte", "tener un ícono de una página en la barra de abajo", "abrir una página en su propia ventana sin pestañas", "instalar una página como aplicación en edge"]
pasos:
  - texto: "Abrí la página en Edge. Tocá los tres puntitos > «Más herramientas» > «Aplicaciones» > instalar este sitio como una aplicación. Algunas páginas ya te ofrecen instalarse solas."
    abrir: "https://support.microsoft.com/edge/install-manage-or-uninstall-apps-in-microsoft-edge"
  - texto: "Para tenerla a mano: escribí «edge://apps» en la barra de direcciones, tocá «Detalles» en la tarjeta de esa aplicación y elegí anclarla a la barra de tareas, al Inicio o crear un acceso en el escritorio."
  - texto: "Para sacarla: en esa misma pantalla, «Detalles» > «Desinstalar». Te pregunta si también querés borrar el historial y los datos de esa aplicación; si dudás, no lo marques."
fuentes:
  - https://support.microsoft.com/edge/install-manage-or-uninstall-apps-in-microsoft-edge
madurez: T0
