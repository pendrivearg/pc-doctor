id: EDG-021
area: seguridad
titulo:
  sencillo: "Quiero que las páginas no me sigan por todos lados con publicidad"
  tecnico: "Microsoft Edge: prevención de seguimiento (Básica, Equilibrada, Estricta)"
explicacion:
  sencillo: "Muchas páginas tienen «rastreadores» que anotan qué mirás para mostrarte publicidad. Edge los frena con la «prevención de seguimiento», que tiene tres niveles: Básica, Equilibrada (la que viene puesta) y Estricta. La Estricta frena más, pero alguna página puede andar mal."
  tecnico: "edge://settings/privacy > Prevención de seguimiento: Básica / Equilibrada (predeterminada) / Estricta; excepciones por sitio; el ícono de información del sitio muestra los rastreadores bloqueados."
frases: ["me persigue la publicidad de lo que busqué", "que no me rastreen las páginas en edge", "bloquear rastreadores en el navegador", "poner edge en modo estricto de privacidad"]
pasos:
  - texto: "En Edge, tocá los tres puntitos > «Configuración» y entrá a la parte de privacidad. Ahí está la prevención de seguimiento."
    abrir: "https://learn.microsoft.com/microsoft-edge/web-platform/tracking-prevention"
  - texto: "Elegí el nivel: «Equilibrada» es la que viene puesta y anda bien en casi todas las páginas. «Estricta» bloquea más rastreadores, pero alguna página puede no funcionar bien."
  - texto: "Si con «Estricta» una página de confianza anda mal, agregala como excepción o volvé a «Equilibrada». Tocando el ícono a la izquierda de la dirección ves qué rastreadores frenó en esa página."
fuentes:
  - https://learn.microsoft.com/microsoft-edge/web-platform/tracking-prevention
madurez: T0
