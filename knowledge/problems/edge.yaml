id: EDG-013
area: programas
titulo:
  sencillo: "Quiero que Copilot me resuma la página que estoy viendo en Edge"
  tecnico: "Copilot en Microsoft Edge (panel lateral)"
explicacion:
  sencillo: "En Edge, Copilot se abre en un costado de la ventana y te puede resumir la página que estás mirando, contestarte preguntas sobre ella o resumir un video de YouTube, sin salir de la página. Lo que contesta puede tener errores: si es algo importante, chequealo."
  tecnico: "Ícono de Copilot arriba a la derecha abre el panel lateral; resume, compara pestañas y responde sobre la página o videos de YouTube. Funciones opcionales que se activan o desactivan desde la configuración."
frases: ["que copilot me resuma esta página", "preguntarle a copilot sobre lo que estoy leyendo en edge", "para qué sirve el botón de copilot en edge", "que me resuma un video de youtube en edge"]
pasos:
  - texto: "Con la página abierta, tocá el ícono de Copilot arriba a la derecha de Edge. Se abre un panel a un costado."
  - texto: "Escribile lo que querés, por ejemplo: «Resumime esta página» o «¿Qué dice sobre los horarios?». También sirve con un video de YouTube abierto."
  - texto: "Para cerrarlo, tocá de nuevo el ícono de Copilot. Si lo que querés es sacar Copilot de la compu, escribile a PC Doctor «no uso Copilot y lo quiero sacar»."
fuentes:
  - https://explore.microsoft.com/en-us/edge/features/copilot
madurez: T0
