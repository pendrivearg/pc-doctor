id: EDG-005
area: programas
titulo:
  sencillo: "Las pestañas de Edge se pusieron al costado (o las quiero al costado)"
  tecnico: "Microsoft Edge: pestañas verticales"
explicacion:
  sencillo: "Edge puede mostrar las pestañas en una columna a la izquierda en vez de arriba. Con muchas pestañas abiertas se leen mejor los nombres. Se pone y se saca con un clic o con un atajo, así que si apareció sin querer, se vuelve atrás enseguida."
  tecnico: "Pestañas verticales: botón Buscar pestañas (arriba a la izquierda) > activar/desactivar pestañas verticales, o Ctrl + Mayús + , (coma)."
frases: ["las pestañas de edge se fueron a la izquierda", "poner las pestañas al costado en edge", "edge me muestra las pestañas en una columna", "volver a poner las pestañas arriba en edge"]
pasos:
  - texto: "Arriba a la izquierda de la ventana de Edge hay un botón con una flechita (el de buscar pestañas). Tocalo y elegí activar o desactivar las pestañas verticales."
  - texto: "Atajo para pasar de un modo al otro: Ctrl + Mayús + , (coma). Si las pestañas se fueron al costado sin querer, puede que se haya apretado este atajo."
fuentes:
  - https://explore.microsoft.com/edge/features/vertical-tabs
madurez: T0
