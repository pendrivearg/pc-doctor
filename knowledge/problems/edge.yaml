id: EDG-024
area: programas
titulo:
  sencillo: "Quiero Edge con fondo oscuro"
  tecnico: "Microsoft Edge: tema oscuro (Apariencia > Apariencia general)"
explicacion:
  sencillo: "Edge tiene su propio ajuste de colores: lo podés poner oscuro para que encandile menos, sin tocar nada más de la compu."
  tecnico: "Configuración y más > Configuración > Apariencia > Apariencia general > Oscuro."
frases: ["poner edge en negro", "el blanco de edge me encandila de noche", "edge en modo oscuro", "cambiar el color de edge a oscuro"]
pasos:
  - texto: "Tocá los tres puntitos arriba a la derecha > «Configuración» > «Apariencia»."
    abrir: "https://support.microsoft.com/en-us/article/9b74617b-f542-77ed-033b-1a5cfb17a2df"
  - texto: "En «Apariencia general», elegí «Oscuro». Para volver como estaba, elegí la opción clara."
  - texto: "Si querés todo Windows oscuro (no solo Edge), escribile a PC Doctor «quiero poner la pantalla en modo oscuro»."
fuentes:
  - https://support.microsoft.com/en-us/article/9b74617b-f542-77ed-033b-1a5cfb17a2df
madurez: T0
