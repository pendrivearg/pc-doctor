id: EDG-016
area: programas
titulo:
  sencillo: "Edge me pregunta si lo quiero como navegador predeterminado"
  tecnico: "Navegador predeterminado en Windows (Aplicaciones predeterminadas)"
explicacion:
  sencillo: "El navegador «predeterminado» es el que se abre cuando tocás un enlace en un correo o en un documento. Edge a veces te pregunta si querés que sea él. No es obligatorio: elegí el que más uses. Se puede cambiar cuando quieras desde la Configuración de Windows."
  tecnico: "Configuración > Aplicaciones > Aplicaciones predeterminadas > elegir el navegador > Establecer como predeterminado (para Edge: «Hacer que Microsoft Edge sea tu navegador predeterminado»)."
frases: ["edge me pide ser el navegador principal", "me sale que edge no es el predeterminado", "si toco que sí a edge pierdo el chrome", "volver a poner edge como navegador de siempre"]
pasos:
  - texto: "Si usás Edge para todo, podés aceptar. Si usás otro navegador (por ejemplo Chrome), podés decir que no: no se rompe nada."
  - texto: "Para elegirlo con calma: abrí Configuración > Aplicaciones > «Aplicaciones predeterminadas» y tocá el navegador que querés usar."
    abrir: "ms-settings:defaultapps"
  - texto: "Al lado de la opción de hacerlo tu navegador predeterminado, tocá el botón para establecerlo como predeterminado. Desde ahí los enlaces se abren con ese navegador."
    abrir: "https://support.microsoft.com/windows/apps/change-default-apps-in-windows"
fuentes:
  - https://support.microsoft.com/windows/apps/change-default-apps-in-windows
madurez: T0
