id: EDG-019
area: seguridad
titulo:
  sencillo: "Quiero que Edge borre todo solo cada vez que lo cierro"
  tecnico: "Microsoft Edge: elegir qué borrar cada vez que se cierra el navegador"
explicacion:
  sencillo: "Si la compu la usan varios, Edge puede borrar solo el historial, las cookies u otras cosas cada vez que lo cerrás. Ojo: si borra las cookies, cada vez vas a tener que volver a entrar con tu usuario en las páginas."
  tecnico: "Configuración > Privacidad, búsqueda y servicios > Borrar datos de exploración > Elegir qué borrar cada vez que se cierre el explorador; activar los tipos de datos."
frases: ["que edge se olvide de todo al cerrarlo", "borrar el historial automáticamente al salir de edge", "que no quede nada guardado cuando cierro el navegador", "la compu es compartida y no quiero que vean lo que miro en edge"]
pasos:
  - texto: "Tocá los tres puntitos > «Configuración» > «Privacidad, búsqueda y servicios» y buscá la parte de borrar datos de exploración."
    abrir: "https://support.microsoft.com/windows/microsoft-edge-browsing-data-and-privacy-bb8174ba-9d73-dcf2-9b4a-c582b4e640dd"
  - texto: "Entrá a la opción para elegir qué borrar cada vez que se cierra el navegador."
  - texto: "Activá solo lo que quieras borrar, por ejemplo el historial. Pensalo dos veces antes de activar las cookies: vas a tener que volver a entrar con tu usuario en todas las páginas."
fuentes:
  - https://support.microsoft.com/windows/microsoft-edge-browsing-data-and-privacy-bb8174ba-9d73-dcf2-9b4a-c582b4e640dd
madurez: T0
