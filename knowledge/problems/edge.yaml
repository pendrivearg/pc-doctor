id: EDG-020
area: programas
titulo:
  sencillo: "Quiero ver en el celular las pestañas que dejé abiertas en la compu"
  tecnico: "Microsoft Edge en el celular: iniciar sesión y sincronizar (incluye pestañas abiertas)"
explicacion:
  sencillo: "Si instalás Edge en el celular y entrás con la misma cuenta de Microsoft que usás en la compu, se pasan los favoritos, el historial, las contraseñas y también las pestañas abiertas. Así seguís en el celular lo que estabas mirando en la compu."
  tecnico: "Edge móvil: menú (…) > Configuración > Cuentas > Agregar cuenta, con la misma cuenta Microsoft; en el escritorio, Sincronizar activado. Sincroniza contraseñas, historial, favoritos, pestañas abiertas y direcciones."
frases: ["bajé edge en el celular y no veo mis cosas", "seguir en el celular la página que tenía en la compu", "pasar las pestañas de la compu al teléfono", "entrar con mi cuenta en el edge del celular"]
pasos:
  - texto: "Instalá Microsoft Edge en el celular desde la tienda de aplicaciones y abrilo."
  - texto: "Tocá los tres puntitos del medio de abajo > «Configuración» > «Cuentas» > agregar cuenta, y entrá con la misma cuenta de Microsoft que usás en el Edge de la compu."
    abrir: "https://www.microsoft.com/en-us/edge/learning-center/sync-your-browser-across-devices"
  - texto: "En la compu, revisá que Edge tenga la sincronización activada (en tu perfil, la parte de sincronizar). Esperá unos minutos: van a aparecer tus cosas, incluidas las pestañas abiertas."
fuentes:
  - https://www.microsoft.com/en-us/edge/learning-center/sync-your-browser-across-devices
madurez: T0
