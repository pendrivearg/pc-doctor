id: EDG-009
area: seguridad
titulo:
  sencillo: "Quiero que Edge me invente una contraseña segura al registrarme en una página"
  tecnico: "Microsoft Edge: Generador de contraseñas («Sugerir contraseñas seguras»)"
explicacion:
  sencillo: "Cuando te registrás en una página nueva o cambiás una clave, Edge te puede proponer una contraseña difícil de adivinar y guardarla por vos, así no tenés que acordártela. PC Doctor nunca te va a pedir ni mirar tus claves."
  tecnico: "Generador de contraseñas: al seleccionar el campo de contraseña en un registro o cambio de clave aparece la sugerencia; clic derecho > Sugerir contraseña segura. Configuración > Contraseñas y autorrelleno > Microsoft Password Manager > Más configuraciones."
frases: ["que edge me invente una clave", "no se me ocurre una contraseña difícil para registrarme", "edge me sugiere una contraseña rara", "dónde se activa la contraseña sugerida en edge"]
pasos:
  - texto: "En la página donde te estás registrando (o cambiando la clave), tocá el casillero de la contraseña. Edge muestra debajo una contraseña sugerida."
  - texto: "Si te sirve, elegila: Edge la completa y la guarda, y la próxima vez la pone solo. Si no aparece, hacé clic derecho en el casillero y elegí la opción de sugerir una contraseña segura."
    abrir: "https://support.microsoft.com/edge/use-password-generator-to-create-more-secure-passwords-in-microsoft-edge"
  - texto: "Si no aparece nunca, revisá en Configuración > «Contraseñas y autorrelleno» > Microsoft Password Manager > más configuraciones, que esté activado preguntar si guardar las contraseñas y sugerir contraseñas seguras."
fuentes:
  - https://support.microsoft.com/edge/use-password-generator-to-create-more-secure-passwords-in-microsoft-edge
madurez: T0
