id: RED-006
area: red
titulo:
  sencillo: "Internet por cable no anda"
  tecnico: "Conexión Ethernet no detectada o sin acceso"
explicacion:
  sencillo: "Con el cable de red enchufado, la compu no tiene Internet o dice que el cable está desconectado. Muchas veces es el cable, el agujerito del router donde está enchufado o el router mismo."
  tecnico: "Ethernet sin enlace o sin conectividad: cable, puerto, router, controlador del adaptador o configuración de red."
frases: ["no me anda internet por cable", "dice cable de red desconectado", "enchufé el cable y no hay internet", "la compu no reconoce el cable del router"]
pasos:
  - texto: "Revisá que el cable esté bien enchufado en la compu y en el router. En el router usá una de las bocas comunes, no la de «Internet» que va al módem. Si tenés otro cable, probá con ese."
  - texto: "Reiniciá el módem y el router: desenchufalos, esperá al menos 30 segundos y volvé a enchufarlos."
  - texto: "Fijate qué dice la sección Ethernet en Configuración: debería decir que está conectado."
    abrir: "ms-settings:network-ethernet"
  - texto: "Si el router tiene Wi-Fi, probá conectarte por Wi-Fi para saber si el problema es el cable. Microsoft explica los pasos siguientes (controlador, restablecer la red)."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/fix-ethernet-connection-problems-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/fix-ethernet-connection-problems-in-windows
madurez: T0
