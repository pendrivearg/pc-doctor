id: RED-013
area: red
titulo:
  sencillo: "No veo las otras computadoras de la casa en «Red»"
  tecnico: "Detección de redes desactivada"
explicacion:
  sencillo: "Para que las compus de la casa se vean entre sí, Windows tiene que tener encendida la «detección de redes», y la red tiene que estar como privada."
  tecnico: "Detección de redes y uso compartido desactivados, perfil Público o servicios de detección (Function Discovery, SSDP, UPnP) detenidos."
frases: ["no veo la otra compu en la red", "mi compu no aparece en la red de casa", "en red no sale ninguna computadora", "dice que la detección de redes está desactivada"]
pasos:
  - texto: "Fijate que todas las compus estén conectadas al mismo Wi-Fi o router, y que tu red esté como «Red privada»."
    abrir: "ms-settings:network-wifi"
  - texto: "En el Explorador de archivos entrá a «Red». Si arriba aparece un aviso de que la detección de redes está desactivada, tocalo y elegí activar la detección de redes y el uso compartido de archivos."
  - texto: "Si sigue sin verse, Microsoft explica cómo revisar la configuración avanzada de uso compartido y los servicios necesarios."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/file-sharing-over-a-network-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/file-sharing-over-a-network-in-windows
  - https://support.microsoft.com/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows
