id: RED-010
area: red
titulo:
  sencillo: "Quiero borrar una red Wi-Fi guardada y conectarme de nuevo"
  tecnico: "Olvidar una red conocida y volver a conectar"
explicacion:
  sencillo: "Windows recuerda cada Wi-Fi al que te conectaste. «Olvidar» una red borra lo que tenía guardado (como la clave vieja) y te deja conectarte de cero."
  tecnico: "Red e Internet > Wi-Fi > Administrar redes conocidas > Olvidar; elimina el perfil inalámbrico guardado."
frases: ["olvidar una red wifi", "borrar un wifi guardado", "sacar una red vieja de la lista de la compu", "quiero que la compu se olvide de un wifi"]
pasos:
  - texto: "Tené a mano la clave del Wi-Fi: después de olvidarla la vas a tener que escribir de nuevo."
  - texto: "Abrí «Administrar redes conocidas», elegí la red y tocá «Olvidar»."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Volvé a la lista de redes, elegí la tuya, tocá «Conectar» y escribí la clave."
    abrir: "ms-settings:network-wifi"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
  - https://support.microsoft.com/windows/experience/connectivity-networking/connect-to-a-wi-fi-network-in-windows
