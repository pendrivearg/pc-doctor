titulo:
  sencillo: "Me pidieron configurar una VPN en la computadora"
  tecnico: "Agregar una conexión VPN integrada de Windows"
explicacion:
  sencillo: "Windows trae para cargar una VPN (por ejemplo, la del trabajo). Necesitás los datos que te den en tu trabajo o el servicio: la dirección del servidor y el tipo de VPN."
  tecnico: "Red e Internet > VPN > Agregar VPN: Proveedor de VPN Windows (integrado), servidor, tipo de VPN y tipo de información de inicio de sesión."
frases: ["configurar la vpn del trabajo", "cómo agrego una vpn en windows", "me pasaron datos para poner una vpn", "instalar una vpn en la compu"]
pasos:
  - texto: "Entrá a VPN y tocá «Agregar VPN». En «Proveedor de VPN» elegí «Windows (integrado)»."
    abrir: "ms-settings:network-vpn"
  - texto: "Completá un nombre que reconozcas y los datos que te pasaron (servidor, tipo de VPN, forma de inicio de sesión) y tocá «Guardar». La clave la escribís vos en la pantalla de Windows; PC Doctor no la pide ni la guarda."
  - texto: "Para conectarte, elegila en la lista y tocá «Conectar». Si el servicio tiene su propia aplicación, conviene usar esa. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/connect-to-a-vpn-in-windows"
fuentes:
