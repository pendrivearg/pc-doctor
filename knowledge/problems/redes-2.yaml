id: RED-020
area: red
titulo:
  sencillo: "Mi Wi-Fi tiene dos redes (2,4 y 5 GHz): ¿a cuál me conecto?"
  tecnico: "Bandas de 2,4 GHz y 5 GHz"
explicacion:
  sencillo: "Muchos routers tienen dos redes. La de 5 GHz es más rápida pero llega menos lejos y atraviesa peor las paredes. La de 2,4 GHz llega más lejos pero es más lenta y tiene más interferencias (microondas, teléfonos inalámbricos, Bluetooth)."
  tecnico: "2,4 GHz: mayor alcance, menor velocidad, más congestión. 5 GHz: mayor velocidad, menos congestión, menor alcance. El adaptador debe admitir la banda."
frases: ["cuál wifi elijo el 5g o el normal", "diferencia entre 2.4 y 5 ghz", "tengo dos redes wifi con el mismo nombre", "la red de 5 ghz no me aparece"]
pasos:
  - texto: "Si estás cerca del router, conectate a la de 5 GHz. Si estás lejos o con paredes en el medio, usá la de 2,4 GHz."
    abrir: "ms-settings:network-wifi"
  - texto: "Si la de 5 GHz no aparece en tu compu, puede que tu adaptador no la admita. Microsoft explica dónde revisarlo («No se encuentra ninguna red Wi-Fi»)."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
  - texto: "Microsoft compara las dos bandas y da consejos para ubicar el router."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/wi-fi-and-your-home-layout"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/wi-fi-and-your-home-layout
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
