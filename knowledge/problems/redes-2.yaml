id: RED-022
area: red
titulo:
  sencillo: "Después de actualizar Windows se fue Internet"
  tecnico: "Pérdida de conectividad tras una actualización (controlador de red)"
explicacion:
  sencillo: "A veces una actualización cambia el controlador de la plaquita de red y deja de andar bien. Se puede volver al controlador anterior o reinstalarlo."
  tecnico: "Regresión del controlador del adaptador tras Windows Update: revertir controlador, reinstalarlo o restablecer la red."
frases: ["se actualizó windows y no tengo internet", "después de la actualización no anda el wifi", "desde que actualicé no conecta a internet", "windows update me rompió el internet"]
pasos:
  - texto: "Reiniciá la compu y el router: a veces alcanza."
  - texto: "Abrí el Administrador de dispositivos (clic derecho en Inicio), desplegá «Adaptadores de red», clic derecho en tu adaptador > «Propiedades» y, en la pestaña «Controlador», usá la opción para volver al controlador anterior. Hace falta entrar con un usuario administrador."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Si no se puede, Microsoft explica cómo desinstalar el adaptador para que Windows lo reinstale al reiniciar (conviene bajar antes el controlador de la página del fabricante)."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
  - texto: "Si nada funciona, escribile a PC Doctor «después de una actualización algo anda mal»."
fuentes:
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
