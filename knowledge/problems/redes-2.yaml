# Redes e Internet en Windows (2): mensajes de Wi-Fi, cable, IP, restablecer la red, perfiles, compartir en casa, VPN, uso medido, bandas y adaptadores. Guiadas con fuente oficial.
id: RED-001
area: red
titulo:
  sencillo: "El Wi-Fi dice «Sin Internet, protegida»"
  tecnico: "Conectado a la red Wi-Fi sin acceso a Internet"
explicacion:
  sencillo: "La compu sí está conectada a tu Wi-Fi, pero por ese Wi-Fi no está llegando Internet. Puede ser el router, el proveedor o un ajuste de la compu."
  tecnico: "Conectividad limitada: asociación correcta al punto de acceso sin salida a Internet (DHCP, DNS, proxy o enlace del proveedor)."
frases: ["dice sin internet protegida", "me aparece sin internet, protegida", "el wifi figura protegida pero no navega", "en el wifi dice sin internet aunque está conectado"]
pasos:
  - texto: "Fijate si otro aparato (el celular, por ejemplo) navega con el mismo Wi-Fi. Si tampoco anda, el problema es del router o del proveedor, no de la compu."
  - texto: "Apagá el router (y el módem si son dos aparatos), esperá unos 30 segundos, volvé a prenderlos y esperá a que las luces se estabilicen."
  - texto: "En la compu, apagá el Wi-Fi y volvé a prenderlo."
    abrir: "ms-settings:network-wifi"
  - texto: "Si sigue igual, revisá que no haya un proxy puesto a mano (escribile a PC Doctor «hay un proxy configurado»). Microsoft explica los demás pasos en «Conectado pero sin Internet»."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
derivar: "Si ningún aparato de la casa tiene Internet, llamá a tu proveedor: la computadora está bien."
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
madurez: T0
---
id: RED-002
area: red
titulo:
  sencillo: "Me dice «No se puede conectar a esta red»"
  tecnico: "Error de conexión o de autenticación a una red Wi-Fi"
explicacion:
  sencillo: "Windows no logra entrar a ese Wi-Fi. Lo más común es que la clave guardada ya no sea la correcta (por ejemplo, la cambiaron en el router) o que el router esté colgado."
  tecnico: "Falla de asociación o autenticación (clave o seguridad que no coincide con el router), perfil guardado desactualizado o problema del adaptador."
frases: ["no se puede conectar a esta red", "me sale que no se puede conectar al wifi", "pongo la clave del wifi y no conecta", "cambiaron la clave del wifi y ahora no entra"]
pasos:
  - texto: "Olvidá la red y volvé a conectarte: en «Administrar redes conocidas» elegí tu red, tocá «Olvidar» y después conectate de nuevo escribiendo la clave del Wi-Fi con cuidado (mayúsculas y minúsculas cuentan)."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Reiniciá el router y el módem: apagalos, esperá unos 30 segundos y prendelos de nuevo."
  - texto: "Si con la clave correcta sigue sin conectar, Microsoft sugiere revisar el router (reiniciarlo, actualizarlo) y el controlador del Wi-Fi de la compu."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
derivar: "Si no sabés la clave, escribile a PC Doctor «no sé la clave del Wi-Fi»."
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
madurez: T0
