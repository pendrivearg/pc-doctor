id: RED-016
area: red
titulo:
  sencillo: "Uso Internet con datos limitados y quiero gastar menos"
  tecnico: "Conexión de uso medido"
explicacion:
  sencillo: "Si te conectás con el celular o con un plan de pocos datos, podés avisarle a Windows que esa conexión es «de uso medido»: así deja para después las descargas grandes."
  tecnico: "Conexión de uso medido: Windows Update solo descarga lo prioritario, se pueden pausar descargas de Microsoft Store y la sincronización de archivos sin conexión."
frases: ["la compu me gasta todos los datos", "uso internet del celular y se me consumen los datos", "que windows no descargue cosas con mi plan", "conexión de uso medido"]
pasos:
  - texto: "Conectate a esa red, entrá en Wi-Fi (o Ethernet), elegí la red y activá «Conexión de uso medido»."
    abrir: "ms-settings:network-wifi"
  - texto: "Tené en cuenta que, en esa red, Windows va a bajar solo las actualizaciones importantes y algunas descargas pueden quedar en pausa."
  - texto: "Si la opción aparece gris, quitá el límite de datos de esa red o revisá que tu usuario sea administrador. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/metered-connections-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/metered-connections-in-windows
