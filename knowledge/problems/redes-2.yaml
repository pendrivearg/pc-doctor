id: RED-007
area: red
titulo:
  sencillo: "Windows avisa que hay un conflicto de dirección IP"
  tecnico: "Dirección IP duplicada en la red local"
explicacion:
  sencillo: "Cada aparato conectado al router tiene un «número de dirección». Windows avisa cuando cree que otro aparato está usando el mismo número que tu compu. Lo más fácil es dejar que el router reparta los números solo."
  tecnico: "Detección de direcciones duplicadas (ARP) durante la configuración IP; suele resolverse con asignación automática (DHCP) y renovando la concesión."
frases: ["me sale conflicto de dirección ip", "dice que otro equipo tiene la misma ip", "windows detectó un conflicto de ip", "aviso de ip duplicada en la red"]
pasos:
  - texto: "Reiniciá el router y el módem: apagalos, esperá unos 30 segundos y prendelos de nuevo."
  - texto: "En la configuración de tu red (Wi-Fi > «Administrar redes conocidas» > tu red, o Ethernet), buscá «Asignación de IP», tocá «Editar» y elegí «Automático (DHCP)», que es lo que recomienda Microsoft."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Microsoft explica cómo cambiar esa configuración."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows"
  - texto: "Si sigue, los comandos «ipconfig /release» y después «ipconfig /renew» (Símbolo del sistema como administrador) le piden al router una dirección nueva. Están en la guía de Microsoft."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
derivar: "En redes de oficina, avisale al encargado de sistemas: puede ser un ajuste del router o del switch."
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/event-4199-windows-client-cannot-get-ip-address-dhcp-server
madurez: T0
