id: RED-008
area: red
titulo:
  sencillo: "Dice «Wi-Fi no tiene una configuración de IP válida»"
  tecnico: "Sin dirección IP válida (169.254.x.x): DHCP sin respuesta"
explicacion:
  sencillo: "La compu se conecta al Wi-Fi, pero el router no le dio la «dirección» que necesita para navegar. Casi siempre se arregla reiniciando el router o pidiéndole una dirección nueva."
  tecnico: "IPv4 autoconfigurada 169.254.x.x: el cliente no obtuvo concesión DHCP. Renovar IP, restablecer Winsock/TCP-IP y verificar DHCP en el router."
frases: ["wifi no tiene una configuración de ip válida", "el solucionador dice que la ip no es válida", "me sale error de configuración ip en el wifi", "no tiene una configuración ip válida"]
pasos:
  - texto: "Reiniciá el router y el módem (30 segundos apagados) y esperá a que las luces se estabilicen."
  - texto: "Revisá que tu red tenga «Asignación de IP» en «Automático (DHCP)» (Wi-Fi > «Administrar redes conocidas» > tu red)."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Si sigue, buscá «símbolo del sistema», abrilo con «Ejecutar como administrador» y escribí, de a uno y apretando Enter: netsh winsock reset, netsh int ip reset, ipconfig /release, ipconfig /renew, ipconfig /flushdns. Después reiniciá la compu."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
derivar: "Si otros aparatos tampoco se conectan, el router no está repartiendo direcciones: llamá a tu proveedor."
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
  - https://support.microsoft.com/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows
madurez: T0
