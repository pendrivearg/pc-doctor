id: RED-017
area: red
titulo:
  sencillo: "Quiero saber cuánto Internet gasta la computadora"
  tecnico: "Uso de datos y límite de datos por red"
explicacion:
  sencillo: "Windows lleva la cuenta de cuántos datos usó cada red y te puede avisar cuando te acercás a un límite que vos elijas."
  tecnico: "Configuración de red avanzada > Uso de datos; límite de datos por conexión con avisos al acercarse y al superarlo."
frases: ["cuántos datos gastó la compu", "ver el consumo de internet de la computadora", "poner un límite de datos en windows", "que me avise si gasto muchos megas"]
pasos:
  - texto: "Abrí «Configuración de red avanzada» y entrá a «Uso de datos». Elegí la conexión para ver cuánto usó."
    abrir: "ms-settings:network-advancedsettings"
  - texto: "Para poner un límite: en Wi-Fi elegí tu red, tocá la opción para establecer un límite de datos, «Introducir límite», completá y guardá. Windows te avisa cerca del límite."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows"
  - texto: "Si además querés que Windows gaste menos, escribile a PC Doctor «conexión de uso medido»."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/metered-connections-in-windows"
