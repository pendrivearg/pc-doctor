  tecnico: "Sin conexión durante la configuración inicial de Windows"
explicacion:
  sencillo: "Para terminar de configurar una compu con Windows Home o Pro hace falta Internet. Si el Wi-Fi no conecta en ese momento, hay varias alternativas."
  tecnico: "La configuración inicial (OOBE) de Windows Home/Pro requiere conexión: Wi-Fi, Ethernet, red móvil o hotspot del teléfono."
frases: ["la compu nueva no se conecta al wifi para configurarla", "me pide internet al instalar windows", "no puedo terminar de configurar la notebook nueva sin internet", "en la configuración inicial no aparece el wifi"]
pasos:
  - texto: "Reiniciá el módem y el router, acercate y revisá bien la clave del Wi-Fi. Si ves dos redes (2,4 y 5 GHz), probá con la otra."
  - texto: "Si la compu tiene entrada de cable de red, enchufá un cable al router (o usá un adaptador USB a cable de red)."
  - texto: "Otra opción: compartí Internet desde el celular (zona Wi-Fi o punto de acceso) y conectá la compu a esa red. Microsoft explica todas las opciones."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/get-connected-when-setting-up-your-windows-device"
fuentes:
