id: RED-011
area: red
titulo:
  sencillo: "¿Pongo mi red como pública o privada?"
  tecnico: "Tipo de perfil de red: público o privado"
explicacion:
  sencillo: "En una red «pública» (bar, hotel, aeropuerto) tu compu queda escondida de los demás: es lo más seguro y lo que viene por defecto. En una red «privada» (tu casa, si confiás en todos los conectados) la compu se puede ver y compartir archivos e impresoras."
  tecnico: "Tipo de perfil de red: Público (predeterminado, más restrictivo en el Firewall) o Privado (detectable, uso compartido de archivos e impresoras)."
frases: ["red pública o privada cuál pongo", "cambiar la red a privada", "mi wifi figura como red pública", "qué significa red pública en la compu"]
pasos:
  - texto: "Afuera de tu casa (bar, hotel, plaza), dejala siempre como «Red pública (recomendado)»."
  - texto: "Para tu casa: entrá en Wi-Fi (o Ethernet), elegí tu red y en «Tipo de perfil de red» elegí «Red privada» solo si confiás en todos los que se conectan a ese Wi-Fi."
    abrir: "ms-settings:network-wifi"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/essential-network-settings-and-tasks-in-windows
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/
madurez: T0
---
id: RED-012
area: red
titulo:
  sencillo: "Quiero compartir una carpeta con otra compu de mi casa"
  tecnico: "Uso compartido de archivos en la red local"
explicacion:
  sencillo: "Si las dos compus están en el mismo Wi-Fi de tu casa, podés compartir una carpeta para abrirla desde la otra, sin pendrive."
  tecnico: "Conceder acceso a > Personas específicas; requiere perfil Privado, detección de redes y uso compartido de archivos e impresoras."
frases: ["compartir una carpeta entre dos compus", "pasar archivos por la red de mi casa", "quiero ver los archivos de la otra compu", "compartir documentos por el wifi de casa"]
pasos:
  - texto: "Fijate que las dos compus estén en el mismo Wi-Fi y que la red esté como «Red privada»."
    abrir: "ms-settings:network-wifi"
  - texto: "Hacé clic derecho en la carpeta > «Mostrar más opciones» (en Windows 11) > «Conceder acceso a» > «Personas específicas» y elegí con quién compartirla."
  - texto: "Si no funciona, en Configuración buscá «configuración avanzada de uso compartido» y, en «Redes privadas», activá la detección de redes y el uso compartido de archivos e impresoras. Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/file-sharing-over-a-network-in-windows"
  - texto: "Para dejar de compartir: clic derecho > «Conceder acceso a» > «Quitar acceso»."
derivar: "Si es solo para pasar algo rápido a una compu cercana, escribile a PC Doctor «quiero pasar un archivo a otra computadora que está cerca»."
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/file-sharing-over-a-network-in-windows
madurez: T0
