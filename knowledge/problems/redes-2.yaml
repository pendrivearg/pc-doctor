id: RED-021
area: red
titulo:
  sencillo: "Enchufé un adaptador de Wi-Fi USB y no funciona"
  tecnico: "Adaptador de red USB no reconocido o sin controlador"
explicacion:
  sencillo: "Los adaptadores USB (de Wi-Fi o de cable de red) a veces necesitan su controlador para funcionar. Si Windows no lo trae, se baja de la página del fabricante del adaptador."
  tecnico: "Adaptador WLAN o Ethernet USB sin controlador, deshabilitado o con error en el Administrador de dispositivos."
frases: ["el adaptador wifi usb no anda", "compré una antena wifi usb y no funciona", "enchufé el wifi usb y no aparecen redes", "el adaptador usb de red no lo reconoce"]
pasos:
  - texto: "Con el adaptador enchufado, reiniciá la compu."
  - texto: "Abrí el Administrador de dispositivos (clic derecho en Inicio) y desplegá «Adaptadores de red». Si el adaptador aparece desactivado, clic derecho > «Habilitar dispositivo»."
  - texto: "Si no aparece en la lista, instalá el controlador desde la página del fabricante del adaptador. Microsoft lo explica en «No se detectan ni habilitan adaptadores de red»."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
  - texto: "Buscá también actualizaciones en Windows Update."
    abrir: "ms-settings:windowsupdate"
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
  - https://support.microsoft.com/windows/experience/connectivity-networking/get-connected-when-setting-up-your-windows-device
