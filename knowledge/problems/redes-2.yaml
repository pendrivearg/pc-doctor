id: RED-014
area: red
titulo:
  sencillo: "La VPN no se conecta"
  tecnico: "Error al conectar una conexión VPN"
explicacion:
  sencillo: "Una VPN es una conexión especial (por ejemplo, para entrar a la red del trabajo). Si no conecta, casi siempre es algún dato mal cargado o que el servicio pide su propia aplicación."
  tecnico: "Perfil VPN con servidor, tipo o método de inicio de sesión incorrectos, o servicio que requiere el cliente del proveedor."
frases: ["la vpn no conecta", "no puedo entrar a la vpn del trabajo", "la vpn da error al conectar", "se cayó la vpn y no vuelve"]
pasos:
  - texto: "Primero fijate que tengas Internet común (que abran las páginas). Sin Internet la VPN no puede conectar."
  - texto: "Entrá a VPN, elegí la conexión y revisá en «Opciones avanzadas» que el servidor y el tipo de VPN sean los que te dieron. Después tocá «Conectar»."
    abrir: "ms-settings:network-vpn"
  - texto: "Si la VPN es del trabajo, pedile los datos correctos al área de sistemas. Si es un servicio que pagás, fijate si tiene su propia aplicación en Microsoft Store o en su página. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/connect-to-a-vpn-in-windows"
  - texto: "Si hace poco restableciste la red, puede que tengas que reinstalar el programa de la VPN."
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/connect-to-a-vpn-in-windows
  - https://support.microsoft.com/windows/experience/connectivity-networking/fix-ethernet-connection-problems-in-windows
