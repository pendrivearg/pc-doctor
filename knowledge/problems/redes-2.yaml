id: RED-005
area: red
titulo:
  sencillo: "El Wi-Fi anda muy lento"
  tecnico: "Conexión inalámbrica con bajo rendimiento"
explicacion:
  sencillo: "Hay Internet, pero todo tarda. Suele deberse a la distancia o las paredes entre la compu y el router, a interferencias, o a que algún programa está descargando mucho."
  tecnico: "Señal débil, obstáculos, congestión de la banda de 2,4 GHz o procesos que consumen ancho de banda."
frases: ["el wifi anda lentísimo", "internet tarda una eternidad en cargar", "el wifi va a paso de tortuga", "las páginas cargan muy despacio con el wifi"]
pasos:
  - texto: "Acercate al router y fijate que no haya paredes u objetos grandes de metal en el medio. Probá si con otro aparato también anda lento."
  - texto: "Abrí el Administrador de tareas y cerrá los programas que estén descargando mucho y no estés usando."
  - texto: "Si el router tiene una red de 5 GHz y estás cerca, probá conectarte a esa: suele ser más rápida."
    abrir: "ms-settings:network-wifi"
  - texto: "Microsoft da consejos sobre dónde poner el router (en el medio de la casa y alto, no en un rincón ni debajo de un escritorio)."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/wi-fi-and-your-home-layout"
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
  - https://support.microsoft.com/windows/experience/connectivity-networking/wi-fi-and-your-home-layout
