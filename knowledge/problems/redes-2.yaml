  sencillo: "El avioncito significa que está prendido el «modo avión», que apaga el Wi-Fi y el Bluetooth de golpe. Se apaga con un toque."
  tecnico: "Modo avión: desactiva las radios inalámbricas; al salir, Windows restaura el último estado de Wi-Fi y Bluetooth."
