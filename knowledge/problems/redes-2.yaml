id: RED-004
area: red
titulo:
  sencillo: "Desapareció la opción de Wi-Fi de la computadora"
  tecnico: "Adaptador inalámbrico deshabilitado, sin controlador o no detectado"
explicacion:
  sencillo: "Si en la compu ya no aparece el botón de Wi-Fi, Windows no está «viendo» la plaquita de Wi-Fi: puede estar apagada con un botón, desactivada o sin su controlador."
  tecnico: "Adaptador WLAN deshabilitado, apagado por interruptor físico, servicio WLAN AutoConfig detenido o controlador ausente."
frases: ["desapareció el wifi de la compu", "no tengo el botón de wifi", "se fue el símbolo del wifi y no lo encuentro", "la notebook ya no tiene la opción de wifi"]
pasos:
  - texto: "Si es una notebook, fijate si tiene un botón o una tecla para prender el Wi-Fi y que esté encendido. Revisá también que el modo avión esté apagado."
    abrir: "ms-settings:network-airplanemode"
  - texto: "Reiniciá la compu."
  - texto: "Abrí el Administrador de dispositivos (clic derecho en Inicio), desplegá «Adaptadores de red», hacé clic derecho en el adaptador de Wi-Fi y, si lo ofrece, elegí «Habilitar dispositivo»."
  - texto: "Si el adaptador ni siquiera aparece, hay que instalar su controlador desde la página del fabricante de la compu. Microsoft lo explica en «Falta la opción Wi-Fi» y «No se detectan ni habilitan adaptadores de red»."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
derivar: "Si nada de esto lo trae de vuelta, la plaquita de Wi-Fi puede estar fallando: llevala a un técnico o usá un adaptador de Wi-Fi USB."
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
madurez: T0
