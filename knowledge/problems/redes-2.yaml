id: RED-009
area: red
titulo:
  sencillo: "Quiero restablecer la red de la computadora"
  tecnico: "Restablecimiento de red (reinstalar adaptadores de red)"
explicacion:
  sencillo: "Es el último recurso cuando nada arregla Internet: Windows borra y vuelve a instalar las plaquitas de red con su configuración de fábrica. Ojo: después vas a tener que volver a poner la clave del Wi-Fi y, si usás una VPN, reinstalarla."
  tecnico: "Configuración de red avanzada > Restablecimiento de red: quita adaptadores y su configuración, los reinstala con valores predeterminados tras reiniciar; puede requerir reinstalar VPN o conmutadores de Hyper-V y deja las redes como públicas."
frases: ["resetear la red de la compu", "restablecer la configuración de internet", "volver la red a como venía de fábrica", "dejar el wifi como nuevo en la compu"]
pasos:
  - texto: "Antes, probá lo simple: reiniciar el router y la compu. Restablecer la red es el último paso."
  - texto: "Tené a mano la clave del Wi-Fi: el restablecimiento borra las redes y configuraciones guardadas, y quizá tengas que reinstalar programas de VPN."
  - texto: "Abrí «Configuración de red avanzada» > «Restablecimiento de red» > «Restablecer ahora» y confirmá con «Sí». La compu se reinicia."
    abrir: "ms-settings:network-advancedsettings"
  - texto: "Después, conectate de nuevo a tu Wi-Fi y, si es la red de tu casa, fijate que esté como «Red privada» si la necesitás para compartir. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/fix-ethernet-connection-problems-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/fix-ethernet-connection-problems-in-windows
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
madurez: T0
