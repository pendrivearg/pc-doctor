id: RED-018
area: red
titulo:
  sencillo: "La compu no se conecta sola al Wi-Fi cuando la prendo"
  tecnico: "La red conocida no se conecta automáticamente"
explicacion:
  sencillo: "Windows puede conectarse solo a tu Wi-Fi cada vez que lo encuentra, pero eso se elige al conectarte. Si no lo hace, conviene volver a guardar la red con esa opción marcada."
  tecnico: "Perfil de red sin conexión automática, perfil dañado o adaptador apagado por administración de energía."
frases: ["cada vez que prendo la compu tengo que conectar el wifi", "el wifi no se conecta solo", "tengo que elegir la red cada vez", "la notebook no se reconecta sola a internet"]
pasos:
  - texto: "Olvidá la red en «Administrar redes conocidas» (tené a mano la clave)."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Volvé a conectarte desde la lista de redes y, antes de tocar «Conectar», marcá la opción para conectarte automáticamente cuando la red esté cerca."
    abrir: "ms-settings:network-wifi"
  - texto: "Si se desconecta al despertar la compu, Microsoft sugiere desmarcar «Permitir que el equipo apague este dispositivo para ahorrar energía» en las propiedades del adaptador de Wi-Fi (Administrador de dispositivos)."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/connect-to-a-wi-fi-network-in-windows
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
