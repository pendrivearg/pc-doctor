id: RED-003
area: red
titulo:
  sencillo: "Mi red Wi-Fi no aparece en la lista"
  tecnico: "La red (SSID) no figura entre las redes disponibles"
explicacion:
  sencillo: "La compu ve otras redes (las de los vecinos) pero no la tuya. Puede ser que estés lejos del router, que el router no esté anunciando su nombre o que tu compu no sea compatible con esa banda (por ejemplo, 5 GHz)."
  tecnico: "SSID no visible: alcance, router sin difusión del SSID o adaptador sin soporte para la banda (2,4/5 GHz)."
frases: ["no me aparece mi red en la lista", "veo las redes de los vecinos pero no la mía", "mi wifi no figura entre las redes", "el nombre de mi wifi no sale en la compu"]
pasos:
  - texto: "Tocá los íconos de red, volumen o batería abajo a la derecha, abrí la lista de redes Wi-Fi y usá el botón para actualizar la lista (abajo a la derecha de esa lista). Acercate al router y probá de nuevo."
  - texto: "Si tu router tiene dos redes (una de 2,4 GHz y otra de 5 GHz), probá conectarte a la otra: algunas compus no ven la de 5 GHz."
  - texto: "Reiniciá el router y el módem, y fijate que el router esté configurado para mostrar el nombre de la red."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/get-connected-when-setting-up-your-windows-device"
  - texto: "Microsoft explica qué revisar en la compu en «No se encuentra ninguna red Wi-Fi»."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
  - https://support.microsoft.com/windows/experience/connectivity-networking/connect-to-a-wi-fi-network-in-windows
  - https://support.microsoft.com/windows/experience/connectivity-networking/get-connected-when-setting-up-your-windows-device
madurez: T0
