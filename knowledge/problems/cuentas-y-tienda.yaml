id: CTA-007
area: basico
titulo:
  sencillo: "Quiero que un familiar tenga su propio usuario en la compu"
  tecnico: "Agregar un miembro del grupo familiar de Microsoft como usuario de Windows"
explicacion:
  sencillo: "Con el grupo familiar de Microsoft, cada integrante (un hijo, un nieto, tu pareja) entra con su propia cuenta. A los chicos conviene darles el papel de «Miembro» y a los adultos el de «Organizador»."
  tecnico: "Grupo familiar de Microsoft: Agregar un miembro de la familia (rol Miembro u Organizador) desde la web o la app Family Safety; el invitado acepta por correo y los menores piden consentimiento de un adulto. En Windows: Cuentas > Familia y Otros usuarios."
frases: ["crear una cuenta para mi nieto en la compu", "agregar a mi hijo como usuario de la familia", "que cada uno de la familia tenga su usuario", "invitar a un familiar a la cuenta de microsoft"]
pasos:
  - texto: "Tu grupo familiar se ve en Configuración > Cuentas > Familia. Para sumar a alguien, entrá con tu cuenta de Microsoft (tenés que ser «Organizador») a la página de familia o a la app Microsoft Family Safety y tocá «Agregar un miembro de la familia». Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/help/12417"
  - texto: "Escribí el correo o el teléfono de esa persona y elegí su papel: «Miembro» (lo mejor para un chico) u «Organizador» (lo mejor para un adulto)."
  - texto: "A la persona le llega un correo con la invitación y la tiene que aceptar entrando con su cuenta. Si es menor, va a tener que pedir permiso a un adulto."
  - texto: "Para que entre en esta compu con su cuenta, agregala como usuario: en «Otros usuarios», tocá «Agregar cuenta» y escribí su correo. Para poner horarios o filtros a los chicos, escribile a PC Doctor «control parental»."
    abrir: "ms-settings:otherusers"
fuentes:
  - https://support.microsoft.com/help/12417
  - https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32
madurez: T0
