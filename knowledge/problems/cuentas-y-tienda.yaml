id: CTA-010
area: seguridad
titulo:
  sencillo: "Quiero sacar la contraseña para entrar a la compu"
  tecnico: "Entrar sin contraseña: Windows Hello en lugar de una cuenta sin clave"
explicacion:
  sencillo: "Dejar la compu sin ninguna clave es peligroso: cualquiera que la prenda entra a tus correos, fotos y cuentas, sobre todo si es una notebook que sale de tu casa. Lo que Microsoft propone para no escribir más la contraseña es usar un PIN, la huella o la cara."
  tecnico: "Microsoft advierte que una cuenta local sin contraseña permite iniciar sesión a cualquiera con acceso físico. Alternativa: Windows Hello y la opción «solo permitir el inicio de sesión de Windows Hello para cuentas Microsoft»."
frases: ["quiero sacarle la contraseña a la compu", "que la computadora no tenga clave", "estoy cansado de escribir la contraseña al entrar", "cómo hago para no poner más la clave en windows"]
pasos:
  - texto: "Primero configurá un PIN (o la huella o la cara si tu compu lo permite) en Opciones de inicio de sesión: es corto, rápido y sirve solo en esta compu."
    abrir: "ms-settings:signinoptions"
  - texto: "Si entrás con una cuenta de Microsoft, en esa misma pantalla, en «Configuración adicional», podés activar la opción que permite solo Windows Hello para cuentas Microsoft. Desde la próxima vez ya no aparece la contraseña: entrás con el PIN, la huella o la cara."
    abrir: "https://support.microsoft.com/en-us/topic/585a71d7-2295-4878-aeac-a014984df856"
  - texto: "Atención: dejar el usuario sin ninguna clave no es lo mismo. Microsoft avisa que así cualquiera que tenga la compu en la mano puede entrar, y que es todavía más riesgoso en una notebook."
    abrir: "https://learn.microsoft.com/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/accounts-limit-local-account-use-of-blank-passwords-to-console-logon-only"
derivar: "PC Doctor no recomienda dejar la compu sin clave. Si igual lo querés en una compu de escritorio que no usa nadie más, consultalo antes con alguien de confianza."
fuentes:
  - https://support.microsoft.com/en-us/topic/585a71d7-2295-4878-aeac-a014984df856
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/accounts-limit-local-account-use-of-blank-passwords-to-console-logon-only
madurez: T0
