id: CTA-019
area: programas
titulo:
  sencillo: "La Store dice «Vuelve a intentarlo» o el error 0x80131500"
  tecnico: "Error 0x80131500 en Microsoft Store"
explicacion:
  sencillo: "Es un error de la tienda de Windows que no deja cargar las páginas. Microsoft propone algunos arreglos que se hacen en pocos minutos."
  tecnico: "Error 0x80131500: restablecer la Store (wsreset), actualizar Windows y la Store, revisar fecha, hora y ubicación, y habilitar TLS 1.2/1.3 en Opciones de Internet."
frases: ["la store me da el error 0x80131500", "la microsoft store dice vuelve a intentarlo", "la tienda dice que algo pasó y no carga", "la store no carga las páginas"]
pasos:
  - texto: "Apretá Windows + R, escribí wsreset.exe y tocá «Aceptar». Esperá a que la Store se abra sola."
  - texto: "Instalá las actualizaciones de Windows y reiniciá. Revisá también que la fecha, la hora y la región estén bien."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si sigue igual, Microsoft explica cómo revisar una opción de seguridad de Internet llamada TLS (en «Opciones de Internet», pestaña «Opciones avanzadas»). Seguí sus pasos al pie de la letra."
    abrir: "https://support.microsoft.com/accounts-billing/error-0x80131500-in-microsoft-store"
fuentes:
  - https://support.microsoft.com/accounts-billing/error-0x80131500-in-microsoft-store
madurez: T0
