id: CTA-013
area: seguridad
titulo:
  sencillo: "Al prender, aparece una pantalla de BitLocker que pide una clave de recuperación"
  tecnico: "Pantalla de recuperación de BitLocker al arrancar"
explicacion:
  sencillo: "Tu disco está protegido con BitLocker y Windows notó un cambio (un pendrive conectado, una actualización de la BIOS, un cambio de configuración). Por seguridad pide una clave larga de 48 números para dejarte entrar."
  tecnico: "BitLocker entra en recuperación ante cambios en el arranque, el TPM, el Arranque seguro o el firmware; pide la contraseña de recuperación de 48 dígitos e indica el Id. de clave."
frases: ["prendo la compu y me sale una pantalla de recuperación de bitlocker", "la notebook arranca pidiendo una clave larga de números", "después de actualizar la bios me pide una clave de recuperación", "me aparece escribir la clave de recuperación para esta unidad"]
pasos:
  - texto: "No apagues de golpe ni pruebes números al azar. Si hay un pendrive, un disco o un DVD conectado, sacalo y reiniciá: Microsoft indica que a veces con eso alcanza."
    abrir: "https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/preboot-recovery-screen"
  - texto: "Si vuelve a aparecer, anotá los primeros 8 caracteres del «Id. de clave» que se ve en la pantalla: sirven para elegir la clave correcta."
  - texto: "Desde el celular u otra computadora, buscá la clave en tu cuenta de Microsoft (la pantalla puede mostrar una pista de qué cuenta es). Microsoft explica todos los lugares donde puede estar."
    abrir: "https://support.microsoft.com/en-us/windows/find-your-bitlocker-recovery-key-6b71ad27-0b89-ea08-f143-056f5ab347d6"
  - texto: "Escribí la clave con el teclado y la compu sigue arrancando. Si la compu es del trabajo, pedísela al área de sistemas."
derivar: "Microsoft no puede darte ni recrear la clave. Si no la encontrás en ningún lado, la única salida es restablecer la compu, y eso borra todos los archivos: antes de llegar a eso, consultá a un técnico."
fuentes:
  - https://support.microsoft.com/en-us/windows/find-your-bitlocker-recovery-key-6b71ad27-0b89-ea08-f143-056f5ab347d6
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/preboot-recovery-screen
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview
madurez: T0
