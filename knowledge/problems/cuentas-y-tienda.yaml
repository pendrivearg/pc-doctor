id: CTA-008
area: basico
titulo:
  sencillo: "Quiero cambiar el nombre que aparece al entrar a la compu"
  tecnico: "Cambiar el nombre de la cuenta de usuario (cuenta Microsoft o local)"
explicacion:
  sencillo: "El nombre que ves al prender la compu sale de tu cuenta. Si entrás con un correo de Microsoft, se cambia en la página de tu cuenta; si es una cuenta local, desde el Panel de control."
  tecnico: "Cuenta Microsoft: Tu información > Editar nombre (puede tardar hasta 24 h). Cuenta local: Panel de control > Cuentas de usuario > Cambiar el nombre de cuenta."
frases: ["cambiar el nombre que sale al prender la compu", "en la pantalla de inicio aparece otro nombre", "quiero poner mi nombre en el usuario de windows", "me figura el nombre del dueño anterior al entrar"]
pasos:
  - texto: "Si entrás con un correo de Microsoft (Hotmail, Outlook): Microsoft explica cómo entrar a tu información y tocar la opción para editar el nombre. El cambio puede tardar hasta 24 horas en verse."
    abrir: "https://support.microsoft.com/en-us/accounts-billing/manage/how-to-change-your-user-account-name"
  - texto: "Si es una cuenta local: tocá Inicio, escribí «Panel de control» y abrilo. Entrá a «Cuentas de usuario» y tocá «Cambiar el nombre de cuenta»."
  - texto: "Usá letras comunes: Microsoft avisa que los símbolos de fuentes raras pueden impedir que entres."
fuentes:
  - https://support.microsoft.com/en-us/accounts-billing/manage/how-to-change-your-user-account-name
madurez: T0
