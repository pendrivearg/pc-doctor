id: CTA-006
area: windows
titulo:
  sencillo: "Quiero agregar otro usuario para que otra persona use la compu"
  tecnico: "Agregar otra cuenta de usuario (Microsoft o local)"
explicacion:
  sencillo: "Cada persona puede tener su propio usuario, con su escritorio, sus archivos y su clave. Así nadie toca las cosas del otro."
  tecnico: "Configuración > Cuentas > Otros usuarios > Agregar cuenta; con correo Microsoft o como usuario sin cuenta Microsoft (cuenta local)."
frases: ["quiero crear otro usuario en la compu", "agregar un usuario para mi señora", "que otra persona tenga su propia sesión en la computadora", "crear una cuenta nueva en windows para otro"]
pasos:
  - texto: "Abrí la parte de otros usuarios en Configuración y, en «Agregar otro usuario», tocá «Agregar cuenta»."
    abrir: "ms-settings:otherusers"
  - texto: "Si la persona tiene correo de Microsoft (Hotmail, Outlook), escribilo. Si no tiene, elegí la opción de que no tenés sus datos de inicio de sesión y después la de agregar un usuario sin cuenta Microsoft."
  - texto: "Terminá los pasos que aparecen en pantalla. La clave la elige y la escribe la otra persona. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32"
fuentes:
  - https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32
madurez: T0
