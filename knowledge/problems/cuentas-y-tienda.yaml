id: CTA-004
area: windows
titulo:
  sencillo: "Quiero entrar a la compu sin la cuenta de Microsoft (cuenta local)"
  tecnico: "Cambiar de cuenta Microsoft a cuenta local"
explicacion:
  sencillo: "Se puede usar la computadora con un usuario que exista solo en esa máquina, sin estar atado al correo de Microsoft. Tus archivos quedan donde están. Ojo: si después te olvidás esa clave, no se recupera por Internet."
  tecnico: "Configuración > Cuentas > Tu información > iniciar sesión con una cuenta local; requiere nombre de usuario único, contraseña y pista; se cierra la sesión para terminar."
frases: ["quiero sacar la cuenta de microsoft de la compu", "entrar a windows sin el correo de hotmail", "pasar mi usuario a cuenta local", "no quiero que la compu me pida la cuenta de outlook"]
pasos:
  - texto: "Guardá lo que estés haciendo: al final hay que cerrar la sesión. Después abrí «Tu información»."
    abrir: "ms-settings:yourinfo"
  - texto: "Tocá la opción para iniciar sesión con una cuenta local en su lugar (solo aparece si hoy entrás con una cuenta de Microsoft)."
  - texto: "Escribí un nombre de usuario, una contraseña y una pista que te ayude a recordarla. Tocá «Siguiente» y después la opción para cerrar sesión y finalizar. Volvé a entrar con el usuario nuevo."
  - texto: "Anotá la contraseña en un lugar seguro: Microsoft avisa que en una cuenta local, si te la olvidás, no se puede recuperar sin un disco para restablecerla. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/windows/switch-your-windows-10-device-to-a-local-account-eb7e78a9-88ee-9bc3-8f06-831b56e339fd"
fuentes:
  - https://support.microsoft.com/windows/switch-your-windows-10-device-to-a-local-account-eb7e78a9-88ee-9bc3-8f06-831b56e339fd
madurez: T0
