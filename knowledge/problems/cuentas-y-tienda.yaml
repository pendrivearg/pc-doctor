id: CTA-015
area: seguridad
titulo:
  sencillo: "No me aparece la opción de entrar con la cara o con la huella"
  tecnico: "Windows Hello facial o de huella no disponible (hardware compatible)"
explicacion:
  sencillo: "Para entrar con la cara hace falta una cámara especial (infrarroja) compatible con Windows Hello; la camarita común de muchas notebooks no sirve. Para la huella hace falta un lector. Si la compu no los tiene, la opción no se puede usar."
  tecnico: "Reconocimiento facial: cámara infrarroja compatible con Hello (integrada o externa). Huella: lector integrado o lector USB. Se configuran en Cuentas > Opciones de inicio de sesión."
frases: ["no me aparece windows hello con la cara", "no tengo la opción de huella para entrar", "la opción de reconocimiento facial no está disponible", "quiero entrar con la cara pero no me deja configurarlo"]
pasos:
  - texto: "Abrí Opciones de inicio de sesión y fijate qué aparece en «Formas de iniciar sesión»: si figura reconocimiento facial o de huella, tocalo y después «Configurar»."
    abrir: "ms-settings:signinoptions"
  - texto: "Si dice que no está disponible, lo más común es que la compu no tenga el aparato necesario: la cara necesita una cámara infrarroja compatible con Windows Hello y la huella, un lector. Microsoft aclara que existen lectores de huella USB y cámaras infrarrojas externas."
    abrir: "https://support.microsoft.com/en-us/windows/security/configure-windows-hello"
  - texto: "Mientras tanto, el PIN funciona en cualquier compu y es igual de rápido: se configura en esa misma pantalla."
fuentes:
  - https://support.microsoft.com/en-us/windows/security/configure-windows-hello
madurez: T0
