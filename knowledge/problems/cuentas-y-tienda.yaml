id: CTA-016
area: windows
titulo:
  sencillo: "No puedo entrar con mi cuenta de Microsoft: dice «Algo salió mal»"
  tecnico: "Problemas al iniciar sesión en Windows con cuenta Microsoft"
explicacion:
  sencillo: "A veces Windows no logra comprobar tu cuenta de Microsoft al entrar, por ejemplo si no hay Internet o hay un problema pasajero. Hay pasos simples para probar antes de preocuparse."
  tecnico: "Errores genéricos de inicio de sesión: verificar conexión desde la pantalla de bloqueo, reiniciar (Actualizar y reiniciar), probar otra cuenta o el modo seguro con contraseña, y usar el asistente de inicio de sesión de cuentas Microsoft."
frases: ["al entrar a windows dice algo salió mal", "no me deja iniciar sesión con mi cuenta de microsoft", "la compu dice que no puede verificar mi cuenta", "no puedo entrar a la compu con mi correo de hotmail"]
pasos:
  - texto: "En la pantalla de inicio de sesión, tocá el ícono de red y fijate que estés conectado a Internet. Si el Wi-Fi anda flojo, probá con cable al router."
  - texto: "Reiniciá la compu. Si aparece «Actualizar y reiniciar», elegí esa opción."
  - texto: "Si en la compu hay otro usuario, probá entrar con ese (abajo a la izquierda). Si el problema es la clave de tu cuenta de Microsoft, Microsoft tiene un asistente de inicio de sesión."
    abrir: "https://support.microsoft.com/en-us/windows/troubleshoot-problems-signing-in-298cfd5f-df1f-c66b-36ad-f2a61a73baad"
  - texto: "Si nada anda, Microsoft explica cómo entrar en modo seguro (ahí se entra solo con la contraseña, no con el PIN ni la huella)."
    abrir: "https://support.microsoft.com/en-us/windows/troubleshoot-problems-signing-in-298cfd5f-df1f-c66b-36ad-f2a61a73baad"
derivar: "Si te olvidaste la contraseña, escribile a PC Doctor «me olvidé la contraseña de la computadora». Nunca le des tu clave a nadie que te llame ofreciendo ayuda."
fuentes:
  - https://support.microsoft.com/en-us/windows/troubleshoot-problems-signing-in-298cfd5f-df1f-c66b-36ad-f2a61a73baad
madurez: T0
