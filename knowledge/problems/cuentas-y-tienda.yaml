id: CTA-005
area: windows
titulo:
  sencillo: "Quiero entrar a la compu con mi cuenta de Microsoft (Hotmail, Outlook)"
  tecnico: "Cambiar de cuenta local a cuenta Microsoft"
explicacion:
  sencillo: "Si entrás con tu correo de Microsoft, la compu se conecta con OneDrive, la Store y tus otros aparatos, y si te olvidás la clave se puede recuperar por Internet."
  tecnico: "Configuración > Cuentas > Tu información > iniciar sesión con una cuenta Microsoft; puede pedir la contraseña local actual; reiniciar para completar."
frases: ["quiero entrar a la compu con mi hotmail", "pasar mi usuario a cuenta de microsoft", "vincular la compu con mi cuenta de outlook", "usar mi correo de microsoft para entrar a windows"]
pasos:
  - texto: "Abrí «Tu información»."
    abrir: "ms-settings:yourinfo"
  - texto: "Tocá la opción para iniciar sesión con una cuenta Microsoft en su lugar (solo aparece si hoy entrás con una cuenta local) y escribí tu correo de Microsoft. Si te pide la contraseña actual de la compu, ponela vos y tocá «Siguiente»."
  - texto: "Reiniciá la computadora: la próxima vez vas a entrar con tu cuenta de Microsoft. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/windows/switch-to-a-microsoft-account-8458c7fc-ef27-4166-a75d-b561da4fc428"
fuentes:
  - https://support.microsoft.com/windows/switch-to-a-microsoft-account-8458c7fc-ef27-4166-a75d-b561da4fc428
  - https://support.microsoft.com/windows/switch-your-windows-10-device-to-a-local-account-eb7e78a9-88ee-9bc3-8f06-831b56e339fd
