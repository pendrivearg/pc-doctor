id: CTA-021
area: programas
titulo:
  sencillo: "Quiero restablecer la Microsoft Store"
  tecnico: "Restablecer la Store: wsreset y Reparar/Restablecer en Aplicaciones instaladas"
explicacion:
  sencillo: "Si la tienda anda mal, se puede «limpiar» o dejar como recién instalada. Las aplicaciones que ya tenés siguen instaladas."
  tecnico: "wsreset.exe restablece la caché de la Store; en Aplicaciones > Aplicaciones instaladas > Microsoft Store > Opciones avanzadas están Reparar (conserva datos) y Restablecer (borra datos y ajustes de la app)."
frases: ["cómo reseteo la microsoft store", "limpiar la tienda de windows", "dejar la store como nueva", "reparar la microsoft store"]
pasos:
  - texto: "Primero lo más simple: apretá Windows + R, escribí wsreset.exe y tocá «Aceptar». La ventana negra se cierra sola y se abre la Store."
    abrir: "https://support.microsoft.com/help/4027338"
  - texto: "Si no alcanza: abrí Configuración > Aplicaciones > Aplicaciones instaladas, buscá «Microsoft Store», tocá los tres puntitos y «Opciones avanzadas»."
    abrir: "ms-settings:appsfeatures"
  - texto: "Tocá «Reparar» (no borra nada). Si no aparece o no sirve, tocá «Restablecer»: la Store queda como nueva y se borran sus ajustes, así que puede pedirte que vuelvas a iniciar sesión."
    abrir: "https://support.microsoft.com/help/4028054"
fuentes:
  - https://support.microsoft.com/help/4027338
  - https://support.microsoft.com/help/4028054
  - https://learn.microsoft.com/windows/msix/desktop/managing-your-msix-reset-and-repair
madurez: T0
