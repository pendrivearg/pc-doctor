id: CTA-012
area: seguridad
titulo:
  sencillo: "Quiero que un usuario sea administrador (o que deje de serlo)"
  tecnico: "Cambiar el tipo de cuenta: administrador o usuario estándar"
explicacion:
  sencillo: "El administrador puede instalar programas y cambiar todo; el usuario estándar usa la compu pero no puede tocar lo importante. Para el día a día conviene ser estándar, sobre todo los chicos."
  tecnico: "Configuración > Cuentas > Otros usuarios > Opciones de cuenta > Cambiar tipo de cuenta (Administrador / Usuario estándar). Microsoft recomienda limitar las cuentas de administrador."
frases: ["hacer administrador a otro usuario", "me dice que necesito permiso de administrador", "sacarle los permisos de administrador a mi hijo", "cambiar mi cuenta a administrador"]
pasos:
  - texto: "Entrá con un usuario que ya sea administrador y abrí la parte de otros usuarios en Configuración."
    abrir: "ms-settings:otherusers"
  - texto: "Tocá el usuario que querés cambiar y, junto a «Opciones de cuenta», elegí «Cambiar tipo de cuenta». Elegí «Administrador» o «Usuario estándar» y tocá «Aceptar»."
  - texto: "Microsoft recomienda tener pocos administradores: con muchos, es más fácil que entre un virus o que alguien cambie algo sin querer."
    abrir: "https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32"
fuentes:
  - https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32
madurez: T0
