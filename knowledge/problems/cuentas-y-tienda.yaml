id: CTA-024
area: archivos
titulo:
  sencillo: "OneDrive me pide iniciar sesión a cada rato"
  tecnico: "OneDrive sin sesión iniciada: iniciar sesión o desvincular y volver a vincular"
explicacion:
  sencillo: "OneDrive es la nube de Microsoft donde se guardan copias de tus archivos. Si no tiene la sesión iniciada, no guarda nada en la nube. Volver a conectarlo no borra tus archivos."
  tecnico: "Verificar que OneDrive esté en ejecución e iniciar sesión; si persiste, Configuración de OneDrive > Cuenta > Desvincular este equipo y volver a iniciar sesión."
frases: ["onedrive me pide que inicie sesión", "me sale que onedrive no tiene la sesión iniciada", "la nube de onedrive se desconectó", "cada vez que prendo la compu onedrive pide mi cuenta"]
pasos:
  - texto: "Fijate si en el área de notificación, junto al reloj, está la nubecita de OneDrive. Si no está, tocá Inicio, escribí «OneDrive» y abrilo."
  - texto: "Cuando te lo pida, escribí tu correo de Microsoft y seguí con «Iniciar sesión». La contraseña la escribís vos en la ventana de Microsoft."
    abrir: "https://support.microsoft.com/en-US/onedrive/fix-onedrive-personal-sync-problems"
  - texto: "Si te lo vuelve a pedir: en la configuración de OneDrive, pestaña «Cuenta», tocá «Desvincular este equipo» y después volvé a iniciar sesión. Microsoft aclara que así no se pierden archivos."
    abrir: "https://support.microsoft.com/en-US/onedrive/fix-onedrive-personal-sync-problems"
derivar: "Si tampoco podés entrar a tu cuenta desde la página de OneDrive, el problema es la cuenta: escribile a PC Doctor «mi cuenta de Microsoft está bloqueada» o «me olvidé la contraseña»."
fuentes:
  - https://support.microsoft.com/en-US/onedrive/fix-onedrive-personal-sync-problems
madurez: T0
