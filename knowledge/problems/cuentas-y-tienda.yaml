# Cuentas de usuario de Windows, inicio de sesión, BitLocker y Microsoft Store: perfil temporal, cuentas locales y de Microsoft, otros usuarios, Store que no abre o no descarga. Guiadas con fuente oficial.
id: CTA-001
area: windows
titulo:
  sencillo: "Al entrar dice «No podemos iniciar sesión en tu cuenta»"
  tecnico: "Error «No podemos iniciar sesión en tu cuenta» (perfil de usuario que no carga)"
explicacion:
  sencillo: "Windows no pudo abrir tu usuario de siempre y te dejó entrar con uno provisorio. Tus cosas en general siguen en la computadora; muchas veces se arregla reiniciando."
  tecnico: "El perfil de usuario no se carga y Windows inicia sesión con un perfil temporal; suele deberse a un bloqueo del perfil al iniciar (por ejemplo, antivirus) o a un perfil dañado."
frases: ["me dice no podemos iniciar sesión en tu cuenta", "entro a la compu y sale un cartel que no puede iniciar sesión en mi cuenta", "dice que no se puede iniciar sesión y que cierre sesión", "error al entrar a mi usuario de windows"]
pasos:
  - texto: "Antes de nada: no guardes cosas nuevas mientras esté ese cartel. Lo que crees o cambies ahora se pierde al cerrar la sesión; si hiciste algo importante, copialo a un pendrive."
  - texto: "Reiniciá la computadora normalmente y volvé a entrar con tu usuario. A veces hace falta reiniciar más de una vez."
  - texto: "Si sigue igual, Microsoft recomienda probar entrando en modo seguro y apagar por un rato el antivirus que no sea el de Windows. Seguí sus pasos."
    abrir: "https://support.microsoft.com/windows/security/identity-signin/we-can-t-sign-in-to-your-account-error-message"
derivar: "Si nada funciona, la salida es crear otro usuario administrador y pasar tus archivos al usuario nuevo: si no te animás, pedí ayuda a alguien de confianza."
fuentes:
  - https://support.microsoft.com/windows/security/identity-signin/we-can-t-sign-in-to-your-account-error-message
madurez: T0
---
id: CTA-002
area: windows
titulo:
  sencillo: "Desaparecieron mis archivos y mi escritorio: dice «perfil temporal»"
  tecnico: "«Iniciaste sesión con un perfil temporal»"
explicacion:
  sencillo: "Cuando aparece ese aviso, la computadora te muestra un escritorio vacío y provisorio. Tus fotos y documentos no se borraron: están en tu usuario de siempre, que esta vez no cargó."
  tecnico: "Perfil temporal: Windows no pudo cargar el perfil local; los cambios hechos en el perfil temporal se eliminan al cerrar sesión."
frases: ["iniciaste sesión con un perfil temporal", "se me borró todo el escritorio y dice perfil temporal", "prendí la compu y no están mis archivos", "me aparece la compu como nueva sin mis cosas"]
pasos:
  - texto: "No te asustes y no guardes nada en este escritorio provisorio: Microsoft avisa que lo que crees o cambies ahí se pierde al cerrar la sesión. Si ya guardaste algo, copialo a un pendrive."
  - texto: "Reiniciá la computadora (puede hacer falta más de una vez) y fijate si al entrar vuelven tu fondo y tus archivos."
  - texto: "Si no vuelven, seguí los pasos de Microsoft: probar en modo seguro, apagar un rato otro antivirus y, como último recurso, crear un usuario administrador nuevo y pasar tus archivos."
    abrir: "https://support.microsoft.com/windows/security/identity-signin/we-can-t-sign-in-to-your-account-error-message"
derivar: "Si hay que pasar archivos de un usuario a otro y no te sentís seguro, pedí ayuda: es fácil equivocarse de carpeta."
fuentes:
  - https://support.microsoft.com/windows/security/identity-signin/we-can-t-sign-in-to-your-account-error-message
madurez: T0
