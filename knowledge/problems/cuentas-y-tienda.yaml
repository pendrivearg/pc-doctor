id: CTA-023
area: programas
titulo:
  sencillo: "Quiero volver a bajar las aplicaciones que ya tenía o compré en la Store"
  tecnico: "Reinstalar aplicaciones desde la Biblioteca de Microsoft Store"
explicacion:
  sencillo: "Las aplicaciones que bajaste o compraste en la Store quedan asociadas a tu cuenta de Microsoft. En una compu nueva o después de reinstalar Windows, se vuelven a instalar desde la «Biblioteca» de la Store."
  tecnico: "Microsoft Store > Biblioteca: aplicaciones adquiridas con la cuenta Microsoft; Instalar para reinstalar. Requiere iniciar sesión con la misma cuenta."
frases: ["cómo vuelvo a bajar una app que compré en la store", "cambié de compu y quiero mis aplicaciones de la tienda", "reinstalar las aplicaciones de la microsoft store", "dónde están las apps que pagué en la store"]
pasos:
  - texto: "Abrí la Microsoft Store y fijate que hayas entrado con la misma cuenta de Microsoft con la que compraste o bajaste las apps."
    abrir: "https://support.microsoft.com/help/13765"
  - texto: "Entrá a «Biblioteca» dentro de la Store. Buscá la aplicación en la lista y tocá «Instalar»."
    abrir: "https://support.microsoft.com/help/4027498"
  - texto: "Si no aparece, puede que la app ya no esté en la Store o no sea compatible con esta compu: Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/help/13765"
fuentes:
  - https://support.microsoft.com/help/4027498
  - https://support.microsoft.com/help/13765
madurez: T0
