id: CTA-018
area: programas
titulo:
  sencillo: "No encuentro o no puedo instalar una aplicación de la Store"
  tecnico: "No se puede encontrar ni instalar una aplicación desde Microsoft Store"
explicacion:
  sencillo: "Pasa si no entraste con tu cuenta de Microsoft, si Windows se actualizó y falta reiniciar, si la app no está en Argentina, si hay control parental o si la app no anda en tu compu."
  tecnico: "Causas: sin sesión de cuenta Microsoft, reinicio pendiente tras actualizaciones, disponibilidad por región, configuración familiar, app retirada o incompatible con el dispositivo; caché de la Store (wsreset)."
frases: ["la store no me deja descargar una aplicación", "no aparece la aplicación en la microsoft store", "no me sale el botón para instalar en la store", "la tienda de windows no me baja nada"]
pasos:
  - texto: "Fijate que en la Store hayas iniciado sesión con tu cuenta de Microsoft: sin eso no deja instalar."
  - texto: "Si Windows se actualizó hace poco, reiniciá la computadora antes de volver a intentarlo."
  - texto: "Apretá Windows + R, escribí wsreset.exe y tocá «Aceptar». Cuando la Store se abra sola, buscá la aplicación de nuevo."
    abrir: "https://support.microsoft.com/help/13765"
  - texto: "Si sigue sin aparecer, puede que la app no esté disponible en tu país, que la tape el control parental o que no sea compatible con tu compu: Microsoft lo explica en la misma página."
    abrir: "https://support.microsoft.com/help/13765"
fuentes:
  - https://support.microsoft.com/help/13765
madurez: T0
