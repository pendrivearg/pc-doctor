id: CTA-014
area: seguridad
titulo:
  sencillo: "¿Dónde encuentro la clave de recuperación de BitLocker?"
  tecnico: "Ubicar la clave de recuperación de BitLocker (cuenta Microsoft, impresión, USB)"
explicacion:
  sencillo: "La clave de 48 números se guarda cuando se activa BitLocker. Casi siempre está en la cuenta de Microsoft de quien configuró la compu; otras veces en un papel impreso o en un pendrive."
  tecnico: "Ubicaciones: cuenta Microsoft (aka.ms/myrecoverykey), cuenta profesional o educativa (aka.ms/aadrecoverykey), impresión, archivo de texto o unidad USB. Se identifica por el Id. de clave."
frases: ["dónde está mi clave de bitlocker", "no encuentro la clave de recuperación", "cómo saco la clave de bitlocker de mi cuenta de microsoft", "quién tiene la clave de bitlocker de mi compu"]
pasos:
  - texto: "Desde el celular u otra compu, entrá con tu cuenta de Microsoft a la dirección que Microsoft indica (aka.ms/myrecoverykey) y buscá la clave cuyo «Id. de clave» coincida con el de tu pantalla. Si la compu la configuró otra persona (un hijo, un técnico), puede estar en la cuenta de esa persona."
    abrir: "https://support.microsoft.com/en-us/windows/find-your-bitlocker-recovery-key-6b71ad27-0b89-ea08-f143-056f5ab347d6"
  - texto: "Buscá entre tus papeles importantes una hoja impresa con la clave, o un pendrive donde se haya guardado: enchufalo y seguí lo que dice la pantalla."
  - texto: "Si la compu es de una empresa o escuela, la clave la tiene el área de sistemas."
  - texto: "Si ahora sí podés entrar a Windows, guardate una copia: tocá Inicio, escribí «BitLocker», abrí «Administrar BitLocker» y elegí la opción para hacer una copia de seguridad de la clave de recuperación."
    abrir: "https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/operations-guide"
derivar: "Nunca le pases la clave a alguien que te la pida por teléfono o por mensaje. Microsoft no puede recuperarla por vos."
fuentes:
  - https://support.microsoft.com/en-us/windows/find-your-bitlocker-recovery-key-6b71ad27-0b89-ea08-f143-056f5ab347d6
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/operations-guide
madurez: T0
