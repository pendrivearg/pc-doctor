id: CTA-009
area: basico
titulo:
  sencillo: "Quiero cambiar la foto que aparece en mi usuario"
  tecnico: "Cambiar la imagen de la cuenta"
explicacion:
  sencillo: "La foto redondita que aparece al entrar y en el menú Inicio se puede cambiar por cualquier imagen de la compu o por una foto sacada con la cámara."
  tecnico: "Configuración > Cuentas > Tu información > Ajustar la foto: elegir un archivo o abrir la cámara; Windows guarda las últimas tres imágenes."
frases: ["cambiar la foto de mi usuario", "poner una foto en la cuenta de la compu", "sacar la foto que aparece al entrar a windows", "cambiar la imagen de perfil de windows"]
pasos:
  - texto: "Abrí «Tu información»."
    abrir: "ms-settings:yourinfo"
  - texto: "En la parte de ajustar la foto, tocá «Examinar archivos» y elegí la imagen. Si la compu tiene cámara, también podés tocar «Abrir cámara» y sacarte una foto."
  - texto: "Windows recuerda las últimas tres fotos que usaste: para volver a una, tocala en esa misma pantalla. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/windows/change-your-account-picture-in-windows-3645cdc7-acab-49d2-76a9-4ce7e5e10939"
fuentes:
  - https://support.microsoft.com/windows/change-your-account-picture-in-windows-3645cdc7-acab-49d2-76a9-4ce7e5e10939
madurez: T0
