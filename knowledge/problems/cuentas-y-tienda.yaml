id: CTA-011
area: seguridad
titulo:
  sencillo: "Quiero que la compu entre sola, sin pedirme nada"
  tecnico: "Inicio de sesión automático (AutoAdminLogon): riesgos"
explicacion:
  sencillo: "Se puede, pero no conviene: cualquiera que prenda la computadora entra a todas tus cosas (correo, fotos, cuentas abiertas). Lo más cómodo y seguro es entrar con un PIN corto o con la huella."
  tecnico: "El inicio automático se configura editando el registro; Microsoft advierte que la contraseña queda guardada en texto plano y que cualquiera con acceso físico accede a todo el contenido."
frases: ["que la compu arranque sin pedir la clave", "quiero que windows entre solo sin contraseña", "iniciar sesión automáticamente al prender", "que no me pida usuario al prender la compu"]
pasos:
  - texto: "Antes de hacerlo, pensá en la alternativa segura: un PIN de pocos números o la huella se ponen en Opciones de inicio de sesión y son mucho más rápidos que la contraseña."
    abrir: "ms-settings:signinoptions"
  - texto: "Atención: Microsoft explica que el inicio automático deja la contraseña guardada sin protección y que cualquiera que tenga la compu en la mano entra a todo. Solo tiene sentido en una compu que nunca sale de tu casa y que no usa nadie más."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/user-profiles-and-logon/turn-on-automatic-logon"
derivar: "El método oficial implica tocar el registro de Windows, donde un error puede dañar el sistema. Si igual lo querés, pedile a un técnico de confianza que lo haga con vos. En una notebook que sacás de tu casa, no lo hagas."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/user-profiles-and-logon/turn-on-automatic-logon
  - https://support.microsoft.com/en-us/windows/security/configure-windows-hello
madurez: T0
