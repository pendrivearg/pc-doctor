id: CTA-025
area: windows
titulo:
  sencillo: "Quiero borrar un usuario que ya no se usa"
  tecnico: "Quitar una cuenta de usuario de Windows"
explicacion:
  sencillo: "Si alguien ya no usa la compu, se puede quitar su usuario. Cuidado: se borran también sus archivos guardados en esta compu (documentos, fotos, escritorio)."
  tecnico: "Configuración > Cuentas > Otros usuarios > Cuenta y datos > Quitar; elimina el inicio de sesión y los datos del dispositivo, pero no la cuenta Microsoft."
frases: ["borrar un usuario de la compu", "eliminar la cuenta de alguien que ya no usa la computadora", "sacar un usuario viejo de windows", "quitar la cuenta de mi hijo de la compu"]
pasos:
  - texto: "Antes de borrar, entrá a ese usuario (o pedile a la persona) y copiá a un pendrive las fotos y documentos que quieran conservar."
  - texto: "Entrá con un usuario administrador y abrí la parte de otros usuarios. Tocá el usuario y, junto a «Cuenta y datos», tocá «Quitar»."
    abrir: "ms-settings:otherusers"
  - texto: "Confirmá solo si ya guardaste lo importante. La cuenta de Microsoft de esa persona (su correo) sigue existiendo: solo se saca de esta compu. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32"
fuentes:
  - https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32
madurez: T0
