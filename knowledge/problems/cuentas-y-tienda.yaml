id: CTA-020
area: programas
titulo:
  sencillo: "Al instalar una app de la Store sale un código de error"
  tecnico: "Errores de instalación en Microsoft Store (por ejemplo 0x80073D02, 0x803F8001)"
explicacion:
  sencillo: "La Store a veces corta la instalación y muestra un número raro que empieza con 0x. Microsoft no tiene una explicación para cada número, pero hay pasos generales que suelen destrabarlo."
  tecnico: "Microsoft no publica una guía por código para estos errores; pasos generales: cerrar la app, actualizar Windows y la Store (Biblioteca > Obtener actualizaciones), reiniciar, wsreset y reinstalar desde la Biblioteca."
frases: ["la store me da error 0x80073d02", "me sale el error 0x803f8001 al instalar", "no se instala la aplicación y sale un código de error", "la descarga de la store falla con un número raro"]
pasos:
  - texto: "Si la aplicación que querés instalar o actualizar está abierta, cerrala del todo. Después reiniciá la computadora."
  - texto: "Instalá las actualizaciones pendientes de Windows."
    abrir: "ms-settings:windowsupdate"
  - texto: "Abrí la Store, entrá a «Biblioteca» y tocá «Obtener actualizaciones». Después volvé a instalar la app desde ahí."
    abrir: "https://support.microsoft.com/help/4027498"
  - texto: "Si sigue fallando, apretá Windows + R, escribí wsreset.exe y tocá «Aceptar» para limpiar la Store, y probá de nuevo."
    abrir: "https://support.microsoft.com/help/13765"
derivar: "Si el error vuelve siempre con la misma app, anotá el código y consultá con el soporte de Microsoft desde su página de ayuda."
fuentes:
  - https://support.microsoft.com/help/4027498
  - https://support.microsoft.com/help/13765
madurez: T0
