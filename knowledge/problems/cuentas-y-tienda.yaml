id: CTA-003
area: windows
titulo:
  sencillo: "En mi compu aparece la cuenta del trabajo o del colegio y la quiero sacar"
  tecnico: "Desconectar una cuenta profesional o educativa (Obtener acceso a trabajo o escuela)"
explicacion:
  sencillo: "Si alguna vez entraste con el correo del trabajo o del colegio, esa cuenta puede quedar conectada a la compu. Se puede desconectar; la cuenta en sí no se borra."
  tecnico: "Configuración > Cuentas > Obtener acceso a trabajo o escuela > Desconectar; quita la información de inicio de sesión y los datos de esa cuenta del dispositivo."
frases: ["sacar la cuenta del trabajo de mi compu", "me quedó conectado el correo del colegio en windows", "desconectar la cuenta de la empresa de la computadora", "en mi compu figura la cuenta de mi ex trabajo"]
pasos:
  - texto: "Antes, guardá en otro lado los archivos del trabajo o del colegio que necesites: al desconectar, se borran de esta compu los datos de esa cuenta."
  - texto: "Abrí la parte de trabajo o escuela en Configuración. Tocá la cuenta, elegí «Desconectar» y confirmá con «Sí»."
    abrir: "ms-settings:workplace"
  - texto: "Microsoft lo explica acá. Si la compu es de la empresa o del colegio, no la desconectes sin preguntar: puede que la necesiten administrar."
    abrir: "https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32"
fuentes:
  - https://support.microsoft.com/windows/manage-user-accounts-in-windows-104dc19f-6430-4b49-6a2b-e4dbd1dcdf32
madurez: T0
