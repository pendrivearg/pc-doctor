id: CTA-017
area: programas
titulo:
  sencillo: "La Microsoft Store no abre"
  tecnico: "Microsoft Store no se inicia: restablecer la caché (wsreset)"
explicacion:
  sencillo: "A veces la tienda de aplicaciones de Windows se traba y no abre o se cierra enseguida. Casi siempre se arregla limpiando su memoria interna, sin perder nada."
  tecnico: "wsreset.exe borra la caché de Microsoft Store; además, actualizar Windows y revisar fecha, hora y región."
frases: ["no me abre la microsoft store", "la tienda de windows no abre", "toco la store y se cierra sola", "no puedo entrar a la tienda de aplicaciones"]
pasos:
  - texto: "Apretá Windows + R, escribí wsreset.exe y tocá «Aceptar». Se abre una ventana negra vacía unos diez segundos, se cierra sola y después se abre la Store."
    abrir: "https://support.microsoft.com/help/4027338"
  - texto: "Si no anduvo, instalá las actualizaciones pendientes de Windows y reiniciá."
    abrir: "ms-settings:windowsupdate"
  - texto: "Revisá que la fecha, la hora y la región de la compu estén bien."
    abrir: "ms-settings:dateandtime"
  - texto: "Si en Inicio no aparece «Microsoft Store», Microsoft explica cómo volver a obtenerla desde su página."
    abrir: "https://support.microsoft.com/help/4027338"
fuentes:
  - https://support.microsoft.com/help/4027338
madurez: T0
