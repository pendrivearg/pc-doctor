id: CTA-022
area: programas
titulo:
  sencillo: "Una aplicación que bajé de la Store no abre"
  tecnico: "Aplicación de Microsoft Store que no se inicia o falla"
explicacion:
  sencillo: "Si una app de la tienda (por ejemplo una de juegos, fotos o música) no abre o se cierra sola, se puede actualizar, reparar o reinstalar."
  tecnico: "Cerrar y reabrir, actualizar Windows y la Store, Reparar/Restablecer la app desde Aplicaciones instaladas > Opciones avanzadas, o reinstalar desde Biblioteca."
frases: ["una aplicación de la store no abre", "abro la app y se cierra enseguida", "la aplicación que bajé de la tienda no funciona", "la app de windows se queda en la pantalla de inicio"]
pasos:
  - texto: "Cerrala con la X de arriba a la derecha y volvé a abrirla. Instalá también las actualizaciones de Windows."
    abrir: "ms-settings:windowsupdate"
  - texto: "Actualizá tus apps: en la Store, entrá a «Biblioteca» y tocá «Obtener actualizaciones»."
    abrir: "https://support.microsoft.com/help/4027498"
  - texto: "Si sigue igual: en Aplicaciones instaladas, tocá los tres puntitos de esa app > «Opciones avanzadas» > «Reparar» (conserva tus datos). Si no alcanza, «Restablecer»: ojo, borra los ajustes y datos guardados dentro de la app y puede pedirte iniciar sesión de nuevo."
    abrir: "ms-settings:appsfeatures"
  - texto: "Como último paso, desinstalala y volvé a instalarla desde «Biblioteca» en la Store."
    abrir: "https://support.microsoft.com/help/4027498"
fuentes:
  - https://support.microsoft.com/help/4027498
  - https://support.microsoft.com/help/4028054
  - https://learn.microsoft.com/windows/msix/desktop/managing-your-msix-reset-and-repair
madurez: T0
