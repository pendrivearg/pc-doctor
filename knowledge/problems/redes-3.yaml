# Redes (3): seguridad del Wi-Fi (WPA3, red no segura), Wi-Fi 6/7, QR, direcciones aleatorias, DNS y DNS cifrado, IPv6, datos móviles y eSIM, proxy automático, Escritorio remoto, Asistencia rápida, Wake on LAN, red de invitados y comandos ping/tracert/nslookup. Guiadas con fuente oficial.
id: NETX-001
area: red
titulo:
  sencillo: "Windows dice que mi Wi-Fi no es seguro porque usa un estándar de seguridad antiguo"
  tecnico: "Aviso de red Wi-Fi no segura (WEP o TKIP)"
explicacion:
  sencillo: "Ese aviso aparece cuando el Wi-Fi usa una protección vieja (WEP o TKIP) que tiene fallas conocidas. Por ahora Windows te deja conectarte igual, pero Microsoft avisa que más adelante lo va a dejar de permitir, así que conviene arreglarlo en el router."
  tecnico: "La red usa WEP o TKIP, con vulnerabilidades conocidas. Solución: configurar el router en WPA3 (o un modo más nuevo) o reemplazarlo; Windows dejará de admitir esos estándares."
frases: ["me sale que la red wifi no es segura", "dice que mi wifi usa un estándar de seguridad antiguo", "aviso de red no segura en windows", "el wifi de mi casa figura como no seguro"]
pasos:
  - texto: "Si hay otra red Wi-Fi cerca en la que confíes, desconectate de esta y conectate a esa."
    abrir: "ms-settings:network-wifi"
  - texto: "Si es el Wi-Fi de tu casa, hay que entrar a la configuración del router y cambiar la seguridad a una más nueva, como WPA3. Si no sabés hacerlo, pedíselo a quien te instaló Internet."
  - texto: "Si el router es muy viejo y no tiene esa opción, lo mejor es cambiarlo por uno más nuevo. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/wi-fi-network-not-secure-in-windows"
derivar: "La empresa que te da Internet suele poder cambiar la seguridad del router o darte uno más nuevo."
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/wi-fi-network-not-secure-in-windows
madurez: T0
