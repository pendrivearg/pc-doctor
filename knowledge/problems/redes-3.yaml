id: NETX-007
area: red
titulo:
  sencillo: "Me dijeron que cambie el DNS de la computadora"
  tecnico: "Configurar servidores DNS manualmente (IPv4)"
explicacion:
  sencillo: "El DNS es como la «guía telefónica» que traduce el nombre de una página a su dirección. Normalmente lo da el router solo. Se puede poner otro a mano, por ejemplo si un técnico te lo indicó."
  tecnico: "Red e Internet > Wi-Fi > Administrar redes conocidas > red (o Ethernet) > Editar asignación > Manual > IPv4 > DNS preferido y alternativo > Guardar."
frases: ["cómo cambio el dns en windows", "me dijeron que ponga otro dns", "quiero poner el dns de google en la compu", "dónde se cambia el servidor dns"]
pasos:
  - texto: "Anotá cómo está antes de tocar nada. Si usás Wi-Fi, entrá en «Administrar redes conocidas» y elegí tu red; si usás cable, entrá en Ethernet."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Junto a la asignación de IP (o de servidor DNS), tocá «Editar», elegí «Manual» y activá IPv4."
  - texto: "Escribí el DNS preferido y el alternativo que te indicaron y tocá «Guardar». Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/essential-network-settings-and-tasks-in-windows-f21a9bbc-c582-55cd-35e0-73431160a1b9"
derivar: "Si después de cambiarlo no abren las páginas, volvé a dejarlo en automático: escribile a PC Doctor «volver el DNS a automático»."
fuentes:
  - https://support.microsoft.com/windows/essential-network-settings-and-tasks-in-windows-f21a9bbc-c582-55cd-35e0-73431160a1b9
madurez: T0
---
id: NETX-008
area: red
titulo:
  sencillo: "Toqué la configuración de IP o DNS y ahora no anda Internet"
  tecnico: "Restaurar la asignación automática (DHCP)"
explicacion:
  sencillo: "Si alguien puso a mano la dirección o el DNS y quedó mal, la compu se queda sin Internet. Lo recomendado para una casa es dejar que el router lo configure solo («automático»)."
  tecnico: "Editar asignación de IP/DNS > Automático (DHCP) > Guardar. Microsoft recomienda DHCP."
frases: ["cambié el dns y se fue internet", "volver la ip a automático", "puse una ip a mano y ahora no tengo internet", "cómo dejo el dns como estaba"]
pasos:
  - texto: "Si usás Wi-Fi, entrá en «Administrar redes conocidas» y elegí tu red. Si usás cable, entrá en Ethernet."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Junto a la asignación de IP (y también la de DNS, si aparece aparte), tocá «Editar» y elegí «Automático (DHCP)»."
  - texto: "Tocá «Guardar» y probá abrir una página. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/essential-network-settings-and-tasks-in-windows-f21a9bbc-c582-55cd-35e0-73431160a1b9"
fuentes:
  - https://support.microsoft.com/windows/essential-network-settings-and-tasks-in-windows-f21a9bbc-c582-55cd-35e0-73431160a1b9
madurez: T0
