id: NETX-018
area: seguridad
titulo:
  sencillo: "¿Qué es el Escritorio remoto y es peligroso activarlo?"
  tecnico: "Escritorio remoto (RDP): riesgos y buenas prácticas"
explicacion:
  sencillo: "El Escritorio remoto permite manejar tu compu desde otro aparato, como si estuvieras sentado adelante. Si no lo necesitás, no lo actives: abre una «puerta» en tu compu. Solo activalo en redes de confianza (tu casa) y con contraseñas fuertes. Windows Home no puede recibir conexiones de Escritorio remoto."
  tecnico: "Habilitar RDP abre un puerto accesible en la red local. Activar solo en redes de confianza, con autenticación a nivel de red (NLA) y cuentas con contraseñas fuertes. Solo ediciones Pro/Enterprise/Education actúan como host."
frases: ["qué es el escritorio remoto", "es peligroso activar el escritorio remoto", "desactivar escritorio remoto en windows", "alguien me dijo que active el escritorio remoto"]
pasos:
  - texto: "Si no lo usás, dejalo apagado. Para revisarlo, entrá en Sistema > Escritorio remoto."
    abrir: "ms-settings:remotedesktop"
  - texto: "Activalo solo si vos lo necesitás (por ejemplo, para entrar desde otra compu tuya) y nunca porque te lo pidió alguien por teléfono o mensaje."
  - texto: "Si lo usás, dejá activada la autenticación a nivel de red y fijate que todas las cuentas con acceso tengan contraseñas fuertes. Microsoft lo explica."
    abrir: "https://learn.microsoft.com/windows-server/remote/remote-desktop-services/remotepc/remote-desktop-allow-access"
derivar: "Si alguien desconocido te pidió activarlo o instalar un programa para manejar tu compu, cortá y escribile a PC Doctor «me llamaron de Microsoft»."
fuentes:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/remotepc/remote-desktop-allow-access
madurez: T0
