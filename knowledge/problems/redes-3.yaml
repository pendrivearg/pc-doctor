id: NETX-023
area: red
titulo:
  sencillo: "Me pidieron que haga un «ping»: ¿qué es y cómo se hace?"
  tecnico: "Comando ping para comprobar conectividad"
explicacion:
  sencillo: "El ping manda unos «golpecitos» a otra compu o página y mide cuánto tardan en volver. Sirve para saber si hay conexión. Si responde por número pero no por nombre, el problema suele ser el DNS."
  tecnico: "ping envía solicitudes de eco ICMP (4 por defecto) y muestra respuestas y tiempos. /t repite hasta Ctrl + C. Si responde por IP y no por nombre, falla la resolución de nombres."
frases: ["cómo hago un ping", "el técnico me pidió que haga ping", "qué significa el ping en internet", "hacer ping a una página desde la compu"]
pasos:
  - texto: "Buscá «cmd» en Inicio y abrí el Símbolo del sistema."
  - texto: "Escribí ping, un espacio y el nombre o la dirección que te pidieron, y apretá Enter."
  - texto: "Si aparecen líneas de respuesta con un tiempo en milisegundos (ms), hay conexión. Si dice que se agotó el tiempo de espera, no llegó respuesta."
  - texto: "Si lo pusiste con /t sigue sin parar: cortalo con Ctrl + C. Microsoft lo explica."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/ping"
fuentes:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/ping
madurez: T0
