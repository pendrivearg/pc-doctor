id: NETX-009
area: red
titulo:
  sencillo: "Quiero que las consultas de DNS vayan cifradas (DNS sobre HTTPS)"
  tecnico: "DNS over HTTPS (DoH) en el cliente DNS de Windows 11"
explicacion:
  sencillo: "Cada vez que entrás a una página, la compu pregunta su dirección. Normalmente esa pregunta viaja «a la vista». Con DNS sobre HTTPS viaja cifrada, así es más difícil espiarla. En Windows 11 se activa solo con servidores DNS que Windows reconoce (como los de Cloudflare, Google o Quad9). Windows 10 no lo tiene."
  tecnico: "Edición manual de DNS > DNS over HTTPS: «On (automatic template)»/«On (manual template)» o «Encrypted only», según la versión. Requiere un servidor de la lista de DoH conocidos (Cloudflare 1.1.1.1, Google 8.8.8.8, Quad9 9.9.9.9). Respaldo a texto sin formato opcional."
frases: ["activar dns sobre https en windows 11", "quiero el dns cifrado", "qué es dns over https", "cómo pongo doh en la compu"]
pasos:
  - texto: "Entrá en tu red (Wi-Fi en «Administrar redes conocidas», o Ethernet), tocá «Editar» junto a la asignación de IP o DNS y elegí «Manual» con IPv4 activado."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Escribí en DNS preferido y alternativo direcciones de un servicio compatible (por ejemplo 1.1.1.1 y 1.0.0.1 de Cloudflare, o 8.8.8.8 y 8.8.4.4 de Google)."
  - texto: "En «DNS sobre HTTPS», elegí la opción que lo activa (según tu versión, la de plantilla automática o la de solo cifrado). Si dejás apagado el respaldo sin cifrar, cuando falle el cifrado no se resuelven las páginas. Tocá «Guardar»."
    abrir: "https://support.microsoft.com/windows/essential-network-settings-and-tasks-in-windows-f21a9bbc-c582-55cd-35e0-73431160a1b9"
  - texto: "Microsoft lista los servidores que Windows reconoce para el DNS cifrado."
    abrir: "https://learn.microsoft.com/windows-server/networking/dns/doh-client-support"
derivar: "Si después no abren las páginas, volvé la asignación a «Automático (DHCP)»."
fuentes:
  - https://support.microsoft.com/windows/essential-network-settings-and-tasks-in-windows-f21a9bbc-c582-55cd-35e0-73431160a1b9
  - https://learn.microsoft.com/windows-server/networking/dns/doh-client-support
madurez: T0
