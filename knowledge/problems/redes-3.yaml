id: NETX-002
area: red
titulo:
  sencillo: "¿Qué es WPA3 y cómo sé si mi compu lo puede usar?"
  tecnico: "Compatibilidad del adaptador con WPA3-Personal/Enterprise"
explicacion:
  sencillo: "WPA3 es la protección más nueva para el Wi-Fi: hace más difícil que alguien adivine la clave o espíe la conexión. Para usarla, tanto el router como el Wi-Fi de la compu tienen que ser compatibles. Si el router tiene WPA2 y WPA3, Windows prueba primero con WPA3."
  tecnico: "netsh wlan show drivers > «Authentication and cipher supported in infrastructure mode»: buscar WPA3 Personal / WPA3 Enterprise. Indica lo que soporta el adaptador, no lo que usa la conexión actual."
frases: ["qué es wpa3", "mi compu es compatible con wpa3", "diferencia entre wpa2 y wpa3", "cómo sé si mi placa de wifi soporta wpa3"]
pasos:
  - texto: "Buscá «cmd» en Inicio y abrí el Símbolo del sistema."
  - texto: "Escribí exactamente netsh wlan show drivers y apretá Enter."
  - texto: "En la parte de autenticación y cifrado admitidos, fijate si aparece «WPA3 Personal». Si aparece, tu compu lo puede usar; después depende de que el router también lo tenga."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/faster-and-more-secure-wi-fi-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/faster-and-more-secure-wi-fi-in-windows
madurez: T0
