id: NETX-017
area: red
titulo:
  sencillo: "En el trabajo me dieron una dirección de «script» para configurar el proxy"
  tecnico: "Configuración automática del proxy (detección automática o script de configuración)"
explicacion:
  sencillo: "Algunas empresas hacen pasar Internet por una computadora intermedia (proxy). En vez de cargar todo a mano, te dan una dirección de configuración que Windows usa sola. Solo usá datos que te haya dado el área de sistemas de tu trabajo."
  tecnico: "Proxy > Automatic proxy setup: «Automatically detect settings» o «Use setup script» > Set up > dirección del script > Save. Si hay VPN, su proxy se configura aparte."
frases: ["me pasaron una dirección de script para el proxy", "configurar proxy automático en windows", "el trabajo me pide usar un script de configuración", "dónde pongo la dirección del pac"]
pasos:
  - texto: "Entrá en Red e Internet > Proxy."
    abrir: "ms-settings:network-proxy"
  - texto: "Si te dijeron que se configura solo, activá la detección automática. Si te dieron una dirección, junto a usar script de configuración tocá «Configurar», activalo, escribí la dirección exacta y tocá «Guardar»."
  - texto: "No pongas direcciones de proxy que te hayan mandado desconocidos: todo lo que navegues pasaría por ahí. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/use-a-proxy-server-in-windows-03096c53-0554-4ffe-b6ab-8b1deee8dae1"
derivar: "Si no sabés qué poner, consultá al área de sistemas de tu trabajo."
fuentes:
  - https://support.microsoft.com/windows/use-a-proxy-server-in-windows-03096c53-0554-4ffe-b6ab-8b1deee8dae1
madurez: T0
