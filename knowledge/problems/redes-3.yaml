id: NETX-022
area: red
titulo:
  sencillo: "¿Qué es una red Wi-Fi para invitados y me conviene?"
  tecnico: "Red Wi-Fi de invitados (concepto y ejemplo en Google Nest Wifi)"
explicacion:
  sencillo: "Muchos routers pueden crear una segunda red Wi-Fi, separada, solo para las visitas. Así no tenés que darles la clave de tu red principal. Tiene que tener su propia clave, distinta de la de tu Wi-Fi."
  tecnico: "Red separada para invitados con su propio nombre y contraseña; se eligen qué dispositivos compartir. La opción depende del router (ej.: Google Home > Wifi > Configuración de red > Red para invitados)."
frases: ["qué es la red de invitados del wifi", "crear un wifi para las visitas", "no quiero darle la clave de mi wifi a todos", "wifi aparte para invitados"]
pasos:
  - texto: "Fijate si tu router tiene la opción de red para invitados (está en su configuración o en la aplicación del router)."
  - texto: "Si tenés Google Nest Wifi o Google Wifi: en la aplicación Google Home entrá en Wifi > Configuración de red > Red para invitados, activala, poné un nombre y una clave distintos de tu red principal y tocá «Guardar»."
    abrir: "https://support.google.com/googlenest/answer/6327302?hl=es-419"
  - texto: "Elegí con cuidado qué aparatos compartís con los invitados (por ejemplo, solo la tele o un parlante)."
derivar: "Si tu router es de la empresa de Internet, ellos te pueden decir si tiene red de invitados y cómo activarla."
fuentes:
  - https://support.google.com/googlenest/answer/6327302?hl=es-419
madurez: T0
