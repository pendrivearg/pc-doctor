id: NETX-024
area: red
titulo:
  sencillo: "Quiero ver por dónde pasa mi conexión hasta una página (tracert)"
  tecnico: "Comandos tracert y pathping"
explicacion:
  sencillo: "tracert muestra los «saltos» (routers) por los que pasa tu conexión hasta llegar a una página, y cuánto tarda cada uno. Sirve para ver si el problema está en tu casa o más lejos. Los asteriscos (*) significan que ese salto no contestó, y no siempre es una falla."
  tecnico: "tracert envía ecos ICMP con TTL creciente (máx. 30 saltos); «*» = salto que no responde. pathping agrega estadísticas de pérdida por salto (tarda unos minutos)."
frases: ["cómo hago un tracert", "ver por dónde pasa mi internet", "el técnico me pidió un tracert", "para qué sirve el pathping"]
pasos:
  - texto: "Buscá «cmd» en Inicio y abrí el Símbolo del sistema."
  - texto: "Escribí exactamente tracert www.microsoft.com y apretá Enter. Esperá a que diga que terminó."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/tracert"
  - texto: "El primer salto suele ser tu router. Si ya ahí tarda mucho o no responde, el problema está en tu casa."
  - texto: "Si te piden «pathping», funciona parecido pero mide durante unos minutos cuántos paquetes se pierden en cada salto. Microsoft lo explica."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/pathping"
fuentes:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/tracert
  - https://learn.microsoft.com/windows-server/administration/windows-commands/pathping
madurez: T0
