id: NETX-020
area: seguridad
titulo:
  sencillo: "Quiero que un familiar me ayude con la compu a distancia"
  tecnico: "Asistencia rápida (Quick Assist): compartir pantalla con alguien de confianza"
explicacion:
  sencillo: "Asistencia rápida es un programa de Windows para que alguien de confianza vea tu pantalla y te ayude desde su casa. Él te pasa un código, vos lo escribís y das permiso. Usalo solo con gente que vos llamaste: Microsoft nunca te llama por su cuenta para entrar a tu compu."
  tecnico: "Asistencia rápida (Ctrl + Windows + Q). El ayudante genera un código de seguridad temporal; el que comparte lo ingresa y acepta «Permitir»; el control total requiere otra aprobación."
frases: ["quiero que mi hijo me ayude con la compu desde su casa", "cómo uso asistencia rápida", "compartir la pantalla para que me ayuden a distancia", "mi nieto me pasó un código para ver mi compu"]
pasos:
  - texto: "Solo hacelo si VOS llamaste a esa persona y la conocés. Nunca con alguien que te llamó diciendo que es de soporte técnico o del banco."
  - texto: "Apretá Ctrl + Windows + Q (o buscá «Asistencia rápida» en Inicio). Tu familiar elige ayudar a alguien y te dicta un código."
  - texto: "Escribí el código en la parte para recibir ayuda, tocá enviar y después «Permitir». Si te pide controlar tu compu, decidí vos si aceptás."
  - texto: "Podés cortar en cualquier momento cerrando la ventana. No le pases contraseñas. Microsoft lo explica."
    abrir: "https://learn.microsoft.com/windows/client-management/client-tools/quick-assist"
derivar: "Si alguien que no conocés te pidió conectarse a tu compu, cortá y escribile a PC Doctor «me llamaron de Microsoft»."
fuentes:
  - https://learn.microsoft.com/windows/client-management/client-tools/quick-assist
madurez: T0
