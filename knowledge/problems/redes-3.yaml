id: NETX-013
area: red
titulo:
  sencillo: "Me voy de viaje al exterior y no quiero que la notebook gaste roaming"
  tecnico: "Opciones de itinerancia de datos (roaming) en la conexión celular"
explicacion:
  sencillo: "Fuera del país, usar datos móviles puede salir muy caro. Windows tiene una opción para que la notebook no use datos cuando está en roaming."
  tecnico: "Celular > opciones de itinerancia de datos (roaming) > «Don't roam»."
frases: ["no quiero gastar roaming con la notebook", "desactivar roaming en windows", "viajo afuera y tengo chip en la notebook", "la notebook me puede cobrar roaming"]
pasos:
  - texto: "Antes de viajar, entrá en Red e Internet > Celular."
    abrir: "ms-settings:network-cellular"
  - texto: "En las opciones de itinerancia (roaming) de datos, elegí la que dice que no use itinerancia."
  - texto: "Si en el viaje usás otro plan o eSIM, podés elegirlo ahí mismo. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7"
fuentes:
  - https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7
