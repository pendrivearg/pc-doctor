id: NETX-011
area: red
titulo:
  sencillo: "Mi notebook tiene lugar para chip: quiero usar Internet del celular sin Wi-Fi"
  tecnico: "Conexión de datos móviles (celular) en Windows"
explicacion:
  sencillo: "Algunas notebooks traen lugar para un chip (SIM) o una eSIM, como un celular. Con un plan de datos se conectan a Internet en cualquier lado. Windows trata esa conexión como «de uso medido» para gastar menos."
  tecnico: "Configuración > Red e Internet > Celular. La opción «Let Windows keep me connected» conecta por datos cuando no hay otra red. Conexión de uso medido por defecto."
frases: ["mi notebook tiene ranura para chip", "usar datos móviles en la notebook", "puse un chip en la notebook y quiero conectarme", "notebook con sim cómo me conecto"]
pasos:
  - texto: "Entrá en Red e Internet > Celular. Si esa sección no aparece, la compu no tiene datos móviles."
    abrir: "ms-settings:network-cellular"
  - texto: "Activá la opción para que Windows mantenga la conexión: así usa los datos cuando no estás en otra red."
  - texto: "Ojo con el consumo: los datos se cobran según tu plan. Microsoft explica todas las opciones."
    abrir: "https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7"
fuentes:
  - https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7
madurez: T0
---
id: NETX-012
area: red
titulo:
  sencillo: "Quiero que la notebook use los datos del chip cuando el Wi-Fi anda mal"
  tecnico: "Usar datos móviles cuando la señal Wi-Fi es mala"
explicacion:
  sencillo: "Si la notebook tiene chip, Windows puede pasarse solo a los datos móviles cuando el Wi-Fi está flojo. Es cómodo, pero puede gastar datos de tu plan."
  tecnico: "Celular > «Use cellular whenever Wi-Fi is poor» (Windows 11); en Windows 10, «When Wi-Fi is poor» o «Always»."
frases: ["que use el chip cuando el wifi está flojo", "pasar a datos móviles si se cae el wifi", "la notebook gasta datos del chip estando en wifi", "usar datos en vez de wifi en la notebook"]
pasos:
  - texto: "Entrá en Red e Internet > Celular."
    abrir: "ms-settings:network-cellular"
  - texto: "Activá (o desactivá, si no querés gastar datos) la opción de usar datos móviles cuando el Wi-Fi sea deficiente."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7"
fuentes:
  - https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7
madurez: T0
