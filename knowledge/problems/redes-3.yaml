id: NETX-014
area: red
titulo:
  sencillo: "La notebook me pide el PIN del chip"
  tecnico: "PIN de la SIM en Windows (usar, cambiar, quitar, desbloquear)"
explicacion:
  sencillo: "El chip puede tener un PIN, igual que en el celular, para que nadie use tus datos si te roban la notebook. Si lo ponés mal tres veces, el chip se bloquea y hace falta un código de la empresa de telefonía."
  tecnico: "Celular > Mobile operator settings > Security: Use SIM PIN, Change SIM PIN, Remove SIM PIN. Tras 3 intentos fallidos aparece «Unblock SIM PIN» (código del operador)."
frases: ["la notebook me pide el pin del chip", "bloqueé el chip de la notebook", "sacar el pin de la sim en windows", "puse mal el pin de la sim tres veces"]
pasos:
  - texto: "Escribí el PIN del chip vos mismo cuando Windows lo pida (suele venir en la tarjeta donde vino el chip). No se lo pases a nadie."
  - texto: "Para cambiarlo o quitarlo: entrá en Celular > configuración del operador móvil y buscá la sección de seguridad del PIN de la SIM."
    abrir: "ms-settings:network-cellular"
  - texto: "Si se bloqueó por poner mal el PIN tres veces, aparece la opción de desbloquearlo: necesitás el código que te da la empresa de telefonía. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7"
derivar: "Para el código de desbloqueo, llamá a tu empresa de telefonía."
fuentes:
  - https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7
madurez: T0
