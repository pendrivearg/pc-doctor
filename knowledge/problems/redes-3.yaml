id: NETX-025
area: red
titulo:
  sencillo: "Me pidieron que haga un «nslookup»: ¿qué es?"
  tecnico: "Comando nslookup para consultar el DNS"
explicacion:
  sencillo: "nslookup le pregunta al DNS la dirección de una página. Sirve para saber si la «guía telefónica» de Internet está respondiendo. Si contesta «Nonexistent domain», ese nombre no existe o está mal escrito."
  tecnico: "Modo no interactivo: nslookup <nombre> [servidor DNS]; sin segundo argumento usa el DNS predeterminado. Errores: timed out, No response from server, Nonexistent domain."
frases: ["cómo uso nslookup", "qué es nslookup", "el técnico me pidió un nslookup", "probar si el dns responde desde la compu"]
pasos:
  - texto: "Buscá «cmd» en Inicio y abrí el Símbolo del sistema."
  - texto: "Escribí nslookup, un espacio y el nombre de la página (por ejemplo, el de una página conocida), y apretá Enter. Usa el DNS que tiene configurado tu compu."
  - texto: "Si aparece una dirección, el DNS responde. Si dice «timed out» o «No response from server», el servidor DNS no contestó."
  - texto: "Microsoft explica todas las opciones."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/nslookup"
derivar: "Si el DNS no responde, escribile a PC Doctor «hay Internet pero las páginas no abren»."
fuentes:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/nslookup
madurez: T0
