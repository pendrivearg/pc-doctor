id: NETX-003
area: red
titulo:
  sencillo: "¿Mi compu tiene Wi-Fi 6 o Wi-Fi 7?"
  tecnico: "Ver tipos de radio admitidos (802.11ax/802.11be) y banda de la conexión"
explicacion:
  sencillo: "Wi-Fi 6, 6E y 7 son las versiones más nuevas del Wi-Fi: más rápidas y mejores cuando hay muchos aparatos conectados. Para aprovecharlas, la compu y el router tienen que ser compatibles. Windows te deja ver qué admite tu compu."
  tecnico: "netsh wlan show drivers > «Radio types supported»: 802.11ax (Wi-Fi 6/6E), 802.11be (Wi-Fi 7). En las propiedades de la red Wi-Fi, «Network band (channel)» muestra la banda en uso."
frases: ["mi compu tiene wifi 6", "cómo sé si mi notebook tiene wifi 7", "compré un router wifi 6 y no sé si la compu lo aprovecha", "qué versión de wifi tiene mi compu"]
pasos:
  - texto: "Buscá «cmd» en Inicio, abrí el Símbolo del sistema, escribí exactamente netsh wlan show drivers y apretá Enter."
  - texto: "En los tipos de radio admitidos: si dice 802.11ax tu compu tiene Wi-Fi 6 o 6E; si dice 802.11be, tiene Wi-Fi 7."
  - texto: "Para ver en qué banda estás conectado ahora, entrá en Wi-Fi, abrí las propiedades de tu red y mirá la banda de red (canal)."
    abrir: "ms-settings:network-wifi"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/faster-and-more-secure-wi-fi-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/faster-and-more-secure-wi-fi-in-windows
madurez: T0
