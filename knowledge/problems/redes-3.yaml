id: NETX-016
area: red
titulo:
  sencillo: "Quiero usar una eSIM en la notebook"
  tecnico: "Agregar, usar y eliminar perfiles eSIM en Windows"
explicacion:
  sencillo: "La eSIM es un chip «virtual» que viene adentro de algunas notebooks: en vez de poner una tarjeta, cargás un perfil con un código o QR que te da la empresa de telefonía. Si borrás un perfil, puede que tengas que pedirle a la empresa que te lo vuelva a dar."
  tecnico: "Cellular > eSIM profiles > Add profile > código de activación o QR del operador > Download; luego elegir el perfil y «Use». Eliminar puede requerir que el operador vuelva a emitirlo."
frases: ["agregar una esim en la notebook", "mi notebook tiene esim cómo la uso", "la empresa me dio un qr para la esim de la compu", "cómo sé si mi notebook tiene esim"]
pasos:
  - texto: "Para saber si tu notebook tiene eSIM: entrá en Red e Internet > Celular y abrí la lista para elegir qué SIM usar para datos; si aparece «eSIM» o algo parecido, la tiene."
    abrir: "ms-settings:network-cellular"
  - texto: "Para agregarla: en Celular > Perfiles eSIM, tocá «Agregar perfil», elegí la opción de escribir el código de activación de tu operador y escaneá el QR con la cámara o escribí el código. Seguí los pasos y tocá «Descargar»."
  - texto: "Para usarla: en Perfiles eSIM elegí el perfil y tocá «Usar». Windows avisa que el uso de datos puede tener costo."
  - texto: "No borres un perfil si lo vas a seguir usando: volver a cargarlo puede requerir llamar a la empresa. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/use-an-esim-to-get-a-cellular-data-connection-on-your-windows-pc-0e255714-f8be-b9ef-9e84-f75b05ed98a3"
fuentes:
  - https://support.microsoft.com/windows/use-an-esim-to-get-a-cellular-data-connection-on-your-windows-pc-0e255714-f8be-b9ef-9e84-f75b05ed98a3
  - https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7
madurez: T0
