id: NETX-015
area: red
titulo:
  sencillo: "Puse el chip en la notebook pero no navega: me dicen que configure el APN"
  tecnico: "Agregar un APN de Internet en la conexión celular"
explicacion:
  sencillo: "El APN es un dato de la empresa de telefonía que le dice a la notebook cómo conectarse a sus datos. Casi siempre se pone solo, pero a veces hay que cargarlo a mano con lo que te indique la empresa."
  tecnico: "Celular > Mobile operator settings > Add APN (Windows 11); en Windows 10, Advanced options > Add an APN. Datos provistos por el operador."
frases: ["configurar el apn en la notebook", "el chip no navega en la notebook", "me piden poner el apn en windows", "datos móviles no funcionan en la notebook"]
pasos:
  - texto: "Pedile a tu empresa de telefonía los datos del APN para computadoras (nombre del APN y los demás datos que correspondan)."
  - texto: "Entrá en Celular > configuración del operador móvil y tocá la opción para agregar un APN. Copiá los datos tal cual te los dieron y guardá."
    abrir: "ms-settings:network-cellular"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7"
derivar: "Si con el APN correcto sigue sin navegar, consultá a tu empresa de telefonía si el plan incluye datos."
fuentes:
  - https://support.microsoft.com/windows/cellular-settings-in-windows-905568ff-7f31-3013-efc7-3f396ac92cd7
