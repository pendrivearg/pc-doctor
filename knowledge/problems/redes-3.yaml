id: NETX-010
area: red
titulo:
  sencillo: "Me dijeron que desactive el IPv6 para que ande Internet"
  tecnico: "No deshabilitar IPv6; preferir IPv4 si hace falta"
explicacion:
  sencillo: "IPv6 es una parte de Windows que maneja las conexiones modernas. Microsoft recomienda NO desactivarlo, porque hay partes de Windows que pueden dejar de funcionar. Si Internet anda raro, la causa casi nunca es esa."
  tecnico: "IPv6 es parte obligatoria de Windows desde Vista. Microsoft no recomienda deshabilitarlo ni desvincularlo del adaptador; si se necesita, usar «Preferir IPv4 sobre IPv6» en las directivas de prefijos."
frases: ["me dijeron que saque el ipv6", "desactivar ipv6 en windows sirve", "destildar protocolo de internet versión 6", "el técnico me dijo que apague el ipv6"]
pasos:
  - texto: "No desactives IPv6 ni lo destildes en las propiedades del adaptador: Microsoft avisa que algunos componentes de Windows pueden dejar de funcionar."
  - texto: "Si ya lo destildaste y no notaste mejora, volvé a marcar «Protocolo de Internet versión 6 (TCP/IPv6)» en las propiedades del adaptador."
  - texto: "Si un técnico necesita que la compu use IPv4 primero, Microsoft explica la alternativa recomendada (preferir IPv4 sobre IPv6) en lugar de desactivarlo."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/networking/configure-ipv6-in-windows"
derivar: "Si Internet sigue fallando, pasá el diagnóstico de PC Doctor para buscar la causa real."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/configure-ipv6-in-windows
madurez: T0
