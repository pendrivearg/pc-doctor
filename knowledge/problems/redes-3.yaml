id: NETX-004
area: red
titulo:
  sencillo: "Quiero conectarme a un Wi-Fi escaneando un código QR"
  tecnico: "Conexión Wi-Fi mediante código QR con la app Cámara (Windows 11)"
explicacion:
  sencillo: "En bares o consultorios a veces hay un cartel con un código QR para conectarse al Wi-Fi. En Windows 11, si la compu tiene cámara, la podés usar para leerlo y conectarte sin escribir la clave."
  tecnico: "App Cámara > modo código de barras; el enlace del QR abre Configuración para agregar y conectar la red (Windows 11)."
frases: ["conectarme al wifi con el código qr", "escanear el qr del wifi con la compu", "en el bar hay un qr para el wifi y quiero usarlo en la notebook", "leer un código qr de wifi con la cámara de la notebook"]
pasos:
  - texto: "Abrí la aplicación Cámara y cambiá al modo de código de barras (el ícono del código)."
  - texto: "Apuntá la cámara al código QR del Wi-Fi hasta que aparezca un enlace, y tocalo: se abre Configuración."
  - texto: "Confirmá que querés agregar y conectarte a esa red. Podés elegir si querés que se conecte sola cuando esté cerca."
  - texto: "Si es una red de un lugar público, dejala como red pública. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/connect-to-a-wi-fi-network-in-windows-1f881677-b569-0cd5-010d-e3cd3579d263"
fuentes:
  - https://support.microsoft.com/windows/connect-to-a-wi-fi-network-in-windows-1f881677-b569-0cd5-010d-e3cd3579d263
madurez: T0
