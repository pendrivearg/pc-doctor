id: NETX-021
area: red
titulo:
  sencillo: "Quiero prender la compu a distancia por la red (Wake on LAN)"
  tecnico: "Wake on LAN: comportamiento en Windows 10/11"
explicacion:
  sencillo: "Wake on LAN es una función para «despertar» una compu enviándole una señal por el cable de red. En Windows 10 y 11 funciona cuando la compu está suspendida o hibernada, pero no después de un apagado normal (por el inicio rápido), salvo que la placa de la compu lo permita por su cuenta."
  tecnico: "WOL soportado desde S3 (suspensión) o hibernación explícita; no desde apagado híbrido (inicio rápido, S4) ni S5, donde Windows no arma el adaptador. Algunos firmware lo permiten igual. Microsoft no recomienda desactivar el inicio rápido."
frases: ["prender la compu a distancia", "wake on lan no funciona con la compu apagada", "despertar la pc por la red", "qué es wake on lan"]
pasos:
  - texto: "Para que funcione, dejá la compu suspendida o hibernada, no apagada del todo, y conectada por cable de red."
  - texto: "Si necesitás que despierte desde apagada, depende de la placa de la compu: revisá el manual del fabricante."
  - texto: "Microsoft explica el comportamiento de cada versión de Windows."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/wake-on-lan-feature"
derivar: "Es una función avanzada: si la necesitás para el trabajo, consultá a un técnico."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/wake-on-lan-feature
madurez: T0
