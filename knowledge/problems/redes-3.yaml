id: NETX-006
area: red
titulo:
  sencillo: "No quiero que me sigan el rastro cuando uso el Wi-Fi de bares o shoppings"
  tecnico: "Direcciones de hardware aleatorias (MAC aleatoria)"
explicacion:
  sencillo: "Cada compu tiene un «número de serie» de red (la dirección MAC) que se ve cuando busca Wi-Fi. En lugares públicos lo pueden usar para saber por dónde andás. Windows puede usar números al azar para que sea más difícil seguirte."
  tecnico: "Wi-Fi > «Direcciones de hardware aleatorias» (para todas las redes) o, por red, en Administrar redes conocidas. Se aplica en la próxima conexión."
frases: ["que no me rastreen por el wifi", "qué es la dirección de hardware aleatoria", "activar mac aleatoria en windows", "privacidad en el wifi del shopping"]
pasos:
  - texto: "Para todas las redes: entrá en Wi-Fi y activá la opción de direcciones de hardware aleatorias."
    abrir: "ms-settings:network-wifi"
  - texto: "Para una sola red: entrá en «Administrar redes conocidas», elegí la red y activá ahí la misma opción. Se aplica la próxima vez que te conectes."
    abrir: "ms-settings:network-wifisettings"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/connect-to-a-wi-fi-network-in-windows-1f881677-b569-0cd5-010d-e3cd3579d263"
fuentes:
  - https://support.microsoft.com/windows/connect-to-a-wi-fi-network-in-windows-1f881677-b569-0cd5-010d-e3cd3579d263
madurez: T0
