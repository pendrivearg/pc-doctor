id: NETX-005
area: red
titulo:
  sencillo: "Quiero pasarle el Wi-Fi a una visita sin dictarle la clave letra por letra"
  tecnico: "Compartir la red Wi-Fi desde las propiedades de la red (QR o contraseña)"
explicacion:
  sencillo: "Desde una compu que ya está conectada a tu Wi-Fi podés mostrar la clave para que otro aparato se conecte. Si el otro aparato lo permite, se puede conectar escaneando un código QR."
  tecnico: "Windows 11: Red e Internet > Propiedades > «Mostrar» junto a la contraseña de la red; el otro dispositivo escanea el código QR si lo admite o ingresa la contraseña."
frases: ["quiero pasarle el wifi a una visita", "compartir el wifi con un qr desde la compu", "mi nieto quiere conectarse al wifi y no le quiero dictar la clave", "cómo comparto mi wifi con alguien que vino a casa"]
pasos:
  - texto: "En la compu que ya está conectada, entrá en Red e Internet, abrí las propiedades de tu Wi-Fi y tocá «Mostrar» junto a la contraseña de la red."
    abrir: "ms-settings:network-wifi"
  - texto: "Si aparece un código QR, la otra persona lo puede escanear con la cámara del celular, si su aparato lo permite. Si no, que escriba la clave cuando se la pida."
  - texto: "Cerrá esa ventana cuando termine, para que la clave no quede a la vista. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/connect-to-a-wi-fi-network-in-windows-1f881677-b569-0cd5-010d-e3cd3579d263"
derivar: "Si te visitan seguido, una red de invitados evita compartir la clave de tu Wi-Fi principal: escribile a PC Doctor «red de invitados»."
fuentes:
  - https://support.microsoft.com/windows/connect-to-a-wi-fi-network-in-windows-1f881677-b569-0cd5-010d-e3cd3579d263
madurez: T0
