id: NETX-019
area: red
titulo:
  sencillo: "Quiero entrar desde la notebook a la compu de escritorio de mi casa"
  tecnico: "Conectarse a otra PC con Conexión a Escritorio remoto"
explicacion:
  sencillo: "Con el Escritorio remoto podés usar desde la notebook los programas y archivos de la compu de escritorio. La compu a la que entrás tiene que estar prendida, conectada a la red y tener Windows Pro (Windows Home no puede recibir conexiones)."
  tecnico: "Host: Sistema > Escritorio remoto > activar (requiere administrador; Pro/Enterprise/Education). Cliente: «Conexión a Escritorio remoto» o Windows App > nombre del equipo o IP > Conectar > credenciales."
frases: ["entrar a la compu de escritorio desde la notebook", "conectarme a otra compu de mi casa a distancia", "usar escritorio remoto entre dos compus", "conexión a escritorio remoto cómo se usa"]
pasos:
  - texto: "En la compu a la que querés entrar: Sistema > Escritorio remoto, activalo y confirmá. Solo aparece en Windows Pro o superior."
    abrir: "ms-settings:remotedesktop"
  - texto: "Anotá el nombre de esa compu (figura en la misma pantalla) y dejala prendida y conectada."
  - texto: "En la notebook, buscá «Conexión a Escritorio remoto» en Inicio, escribí el nombre de la otra compu y tocá «Conectar». Poné vos el usuario y la contraseña de esa compu."
  - texto: "Activalo solo en la red de tu casa y apagalo cuando no lo uses. Microsoft lo explica."
    abrir: "https://learn.microsoft.com/windows-server/remote/remote-desktop-services/remotepc/remote-desktop-allow-access"
fuentes:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/remotepc/remote-desktop-allow-access
madurez: T0
