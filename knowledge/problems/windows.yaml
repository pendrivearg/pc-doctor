id: WIN-PWR-010
area: windows
titulo:
  sencillo: "La PC se apagó o reinició sin avisar"
  tecnico: "Kernel-Power 41 (apagado no limpio)"
explicacion:
  sencillo: >-
    Windows registró apagados inesperados. Puede ser un corte de luz, mantener apretado el botón de encendido,
    una pantalla azul o un problema de temperatura o de energía. PC Doctor no puede medir la fuente de alimentación:
    si pasa jugando o con mucha carga, hace falta revisarla físicamente.
  tecnico: "Evento 41 de Microsoft-Windows-Kernel-Power: el sistema se reinició sin un apagado limpio."
frases: ["se me apaga sola la compu", "se reinicia sola", "se apaga cuando juego", "se corta y se prende de nuevo"]
sondas: [eventos]
deteccion:
  - si: "eventos.apagados_inesperados_30d >= 3"
    estado: problema
    mensaje: "Hubo {eventos.apagados_inesperados_30d} apagados o reinicios inesperados en los últimos 30 días."
  - si: "eventos.apagados_inesperados_30d >= 1"
    estado: advertencia
    mensaje: "Hubo {eventos.apagados_inesperados_30d} apagado(s) inesperado(s) en los últimos 30 días."
pasos:
  - texto: "Recordá si coincidieron con cortes de luz o con haber apagado con el botón. Si no, fijate si pasa siempre con el mismo programa o juego."
  - texto: "Revisá que las salidas de aire no estén tapadas y que no haya mucho polvo."
derivar: "Si se apaga bajo carga (juegos, edición) sin pantalla azul ni sobrecalentamiento, la fuente o la refrigeración necesitan revisión física."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/event-id-41-restart
madurez: T1
---
id: WIN-DEV-001
area: windows
titulo:
  sencillo: "Hay dispositivos que no funcionan bien"
  tecnico: "Dispositivos con código de error en el Administrador de dispositivos"
explicacion:
  sencillo: "Windows detecta piezas o accesorios que no pueden funcionar, casi siempre por falta de un controlador (el programa que los hace andar)."
  tecnico: "Win32_PnPEntity.ConfigManagerErrorCode distinto de 0 (excluye deshabilitados por el usuario y desconectados)."
frases: ["algo no tiene controlador", "dispositivo desconocido", "falta un driver"]
sondas: [dispositivos]
deteccion:
  - si: "dispositivos.con_error >= 1"
    estado: problema
    mensaje: "Dispositivos con problemas: {dispositivos.lista}."
pasos:
  - texto: "Abrí Actualizaciones opcionales de Windows Update e instalá los controladores que aparezcan."
    abrir: "ms-settings:windowsupdate-optionalupdates"
  - texto: "Si no aparecen, descargá el controlador solo desde la página oficial del fabricante de la PC o de la pieza."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-manager-error-messages
madurez: T1
---
id: WIN-APP-001
area: programas
titulo:
  sencillo: "Un programa se cierra solo seguido"
  tecnico: "Fallas repetidas de una aplicación (Application Error 1000)"
explicacion:
  sencillo: "Windows registró que un programa se cerró con error muchas veces. Suele arreglarse actualizándolo o reparándolo."
  tecnico: "Agrupación de eventos 1000 de Application Error por nombre de ejecutable en 30 días."
frases: ["un programa se cierra solo", "se me cierra el programa", "el programa deja de funcionar", "se cierra de golpe"]
sondas: [eventos]
deteccion:
  - si: "eventos.programa_mas_fallado_veces >= 5"
    estado: advertencia
    mensaje: "{eventos.programa_mas_fallado} se cerró con error {eventos.programa_mas_fallado_veces} veces en los últimos 30 días."
pasos:
  - texto: "Actualizá ese programa a su última versión desde su menú de ayuda o desde su página oficial."
  - texto: "Si sigue fallando, buscalo en Aplicaciones instaladas y probá «Modificar» o «Reparar» si la opción existe."
    abrir: "ms-settings:appsfeatures"
fuentes:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting
madurez: T1
