id: WIN-SB-001
area: windows
titulo:
  sencillo: "El Arranque seguro (Secure Boot) está desactivado"
  tecnico: "UEFI Secure Boot deshabilitado"
explicacion:
  sencillo: >-
    El Arranque seguro impide que programas maliciosos se carguen antes que Windows. Lo exigen Windows 11 y
    varios juegos online con anti-trampas. Se activa desde la configuración de la BIOS/UEFI.
  tecnico: "UEFISecureBootEnabled = 0 con firmware UEFI."
frases: ["el juego me pide secure boot", "arranque seguro desactivado", "secure boot apagado"]
sondas: [plataforma]
deteccion:
  - si: "plataforma.uefi and not plataforma.secure_boot"
    estado: advertencia
    mensaje: "La PC arranca en modo UEFI pero con el Arranque seguro desactivado."
pasos:
  - texto: "IMPORTANTE: si el disco está cifrado con BitLocker, antes de tocar la BIOS tené a mano la clave de recuperación."
    abrir: "https://account.microsoft.com/devices/recoverykey"
  - texto: "Reiniciá y entrá a la BIOS/UEFI (suele ser F2, Supr, F10 o Esc al encender). Buscá «Secure Boot», activalo y guardá los cambios."
derivar: "Si no encontrás la opción o la PC deja de arrancar, volvé a dejarla como estaba y consultá a un técnico."
fuentes:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/oem-secure-boot
madurez: T1
---
id: WIN-LEG-001
area: windows
titulo:
  sencillo: "La PC arranca en modo antiguo (Legacy/BIOS)"
  tecnico: "Firmware en modo BIOS heredado (CSM)"
explicacion:
  sencillo: "El modo antiguo impide usar el Arranque seguro y pasar a Windows 11. Cambiarlo requiere convertir el disco y es una tarea delicada."
  tecnico: "GetFirmwareType = FirmwareTypeBios. Pasar a UEFI requiere disco GPT (MBR2GPT) y cambiar el modo en el firmware."
frases: ["mi pc está en legacy", "modo bios antiguo", "no puedo activar uefi"]
sondas: [plataforma]
deteccion:
  - si: "not plataforma.uefi"
    estado: advertencia
    mensaje: "Windows arrancó en modo BIOS heredado (Legacy), no en UEFI."
derivar: "La conversión a UEFI (MBR2GPT) modifica el disco: hacela solo con una copia de seguridad completa y, si no tenés experiencia, con un técnico."
fuentes:
  - https://learn.microsoft.com/windows/deployment/mbr-to-gpt
madurez: T1
---
id: BOOT-BL-002
area: windows
tipo: sugerencia
titulo:
  sencillo: "Tu disco está cifrado: guardá la clave de recuperación"
  tecnico: "BitLocker activo en el volumen del sistema"
explicacion:
  sencillo: >-
    BitLocker protege tus archivos si te roban la PC. Pero si cambiás algo en la BIOS, la actualizás o arrancás
    desde un pendrive, Windows puede pedir una clave de recuperación de 48 números. Sin esa clave, los archivos no se recuperan.
  tecnico: "System.Volume.BitLockerProtection indica protección activa en el volumen del sistema."
frases: ["me pide clave de bitlocker", "clave de recuperación bitlocker", "pantalla azul pide clave de 48 números"]
sondas: [plataforma]
deteccion:
  - si: "plataforma.bitlocker_sistema"
    estado: advertencia
    mensaje: "El disco del sistema está cifrado con BitLocker. Antes de tocar la BIOS o arrancar desde un pendrive, asegurate de tener la clave de recuperación."
pasos:
  - texto: "Iniciá sesión en tu cuenta Microsoft y anotá o imprimí la clave de recuperación de esta PC. Guardala fuera de la computadora."
    abrir: "https://account.microsoft.com/devices/recoverykey"
fuentes:
  - https://support.microsoft.com/windows/find-your-bitlocker-recovery-key-6b71ad27-0b89-ea08-f143-056f5ab347d6
madurez: T1
---
id: WIN-UPD-001
area: windows
titulo:
  sencillo: "Windows no se actualiza"
  tecnico: "Fallas de Windows Update"
explicacion:
  sencillo: "Cuando Windows no se puede actualizar, suele ser por falta de espacio, una actualización trabada o un reinicio pendiente."
  tecnico: "Guía inicial; la reparación automática de componentes de Windows Update llega en la próxima versión."
frases: ["windows no se actualiza", "error al actualizar windows", "windows update no funciona", "se traba la actualización", "no puedo actualizar windows"]
sondas: [sistema, disco, servicios]
acciones: [wu.service.repair, win.dism.scan, win.dism.restore]
pasos:
  - texto: "Reiniciá la PC (no la apagues: reiniciala) y volvé a probar."
  - texto: "Comprobá que haya al menos 20 GB libres en el disco del sistema (PC Doctor lo revisa en este análisis)."
  - texto: "Abrí Windows Update y tocá «Buscar actualizaciones». Si muestra un código de error, anotalo."
    abrir: "ms-settings:windowsupdate"
  - texto: "En Windows 11 podés usar Sistema > Recuperación > «Corregir problemas con Windows Update», que reinstala la versión actual sin borrar tus archivos."
    abrir: "ms-settings:recovery"
fuentes:
  - https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c
madurez: T0
