# Manejo básico: sacar el pendrive, programa congelado, dos ventanas a la vez, bloquear la PC, adjuntar al correo, carpetas y nombres, cambiar la clave y deshacer. Guiadas con fuente oficial.
id: USB-EJ-001
area: archivos
titulo:
  sencillo: "¿Cómo saco el pendrive sin que se dañen los archivos?"
  tecnico: "Quitar hardware de forma segura"
explicacion:
  sencillo: "Antes de desenchufar un pendrive o un disco externo conviene «expulsarlo»: así Windows termina de guardar todo y no se pierde nada."
  tecnico: "Quitar hardware de forma segura y expulsar el medio (área de notificación) antes de desconectar."
frases: ["cómo saco el pendrive", "expulsar el pendrive", "quitar el disco externo con seguridad", "se puede sacar el pendrive así nomás"]
pasos:
  - texto: "Cerrá los archivos que tengas abiertos del pendrive."
  - texto: "Abajo a la derecha, tocá la flechita «^» y después el ícono del pendrive («Quitar hardware de forma segura y expulsar el medio»). Elegí «Expulsar» y tu pendrive."
  - texto: "Esperá el aviso «Es seguro quitar el hardware» y recién ahí desenchufalo."
    abrir: "https://support.microsoft.com/windows/hardware/safely-remove-hardware-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/safely-remove-hardware-in-windows
madurez: T0
---
id: APP-HUNG-001
area: programas
titulo:
  sencillo: "Un programa se congeló y no se puede cerrar"
  tecnico: "Aplicación que no responde: finalizar tarea"
explicacion:
  sencillo: "Si un programa dice «No responde» y no se cierra, Windows lo puede cerrar a la fuerza desde el Administrador de tareas. Lo que no hayas guardado en ese programa se pierde."
  tecnico: "Administrador de tareas (Ctrl + Mayús + Esc) > Procesos > Aplicaciones > Finalizar tarea."
frases: ["un programa se congeló y no se cierra", "la ventana no responde", "dice que el programa no responde", "no puedo cerrar un programa que quedó colgado"]
pasos:
  - texto: "Esperá un minuto: a veces el programa se recupera solo."
  - texto: "Apretá Ctrl + Mayús + Esc para abrir el Administrador de tareas. En «Procesos», buscá el programa en «Aplicaciones», hacé clic derecho > «Finalizar tarea»."
    abrir: "https://support.microsoft.com/microsoft-edge/how-to-close-a-pop-up-window-if-microsoft-edge-isn-t-responding-a239b1d0-7830-2c64-0eca-522f06522b94"
  - texto: "Volvé a abrir el programa. Si se congela seguido, escribile a PC Doctor «un programa se cierra solo» o pasá el diagnóstico."
fuentes:
  - https://support.microsoft.com/microsoft-edge/how-to-close-a-pop-up-window-if-microsoft-edge-isn-t-responding-a239b1d0-7830-2c64-0eca-522f06522b94
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
