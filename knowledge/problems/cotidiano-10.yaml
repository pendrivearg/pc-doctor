id: MAIL-ATT-001
area: programas
titulo:
  sencillo: "Quiero mandar una foto o un archivo por correo"
  tecnico: "Adjuntar archivos a un correo (Outlook, Gmail)"
explicacion:
  sencillo: "En cualquier correo, el botón con forma de clip sirve para adjuntar fotos o documentos de la computadora."
  tecnico: "Adjuntar archivo en Outlook (Insertar/Incluir > Adjuntar archivo) o Gmail (ícono de adjuntar); límite de 25 MB en Gmail personal."
frases: ["mandar una foto por mail", "adjuntar un archivo al correo", "cómo envío un documento por email", "poner una foto en el correo"]
pasos:
  - texto: "Escribí el correo nuevo y tocá el clip («Adjuntar»). Elegí «Examinar este equipo» (Outlook) o buscá el archivo en la ventana que se abre (Gmail), y tocá «Abrir»."
  - texto: "Esperá a que el archivo aparezca debajo del asunto antes de tocar «Enviar»."
  - texto: "Outlook lo explica."
    abrir: "https://support.microsoft.com/outlook/mail/add-pictures-or-attach-files-to-emails-in-outlook"
  - texto: "Gmail lo explica (los archivos de más de 25 MB se mandan como enlace de Google Drive)."
    abrir: "https://support.google.com/mail/answer/6584?hl=es-419"
fuentes:
  - https://support.microsoft.com/outlook/mail/add-pictures-or-attach-files-to-emails-in-outlook
  - https://support.google.com/mail/answer/6584?hl=es-419
madurez: T0
