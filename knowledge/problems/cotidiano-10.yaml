id: BAS-SNAP-001
area: basico
titulo:
  sencillo: "Quiero ver dos ventanas una al lado de la otra"
  tecnico: "Acoplar ventanas (Snap)"
explicacion:
  sencillo: "Windows puede dividir la pantalla en dos: por ejemplo, un documento a la izquierda y el navegador a la derecha."
  tecnico: "Acoplar: arrastrar al borde o Windows + flechas; Asistente de acoplamiento; Sistema > Multitarea."
frases: ["poner dos ventanas una al lado de la otra", "ver dos programas a la vez en la pantalla", "dividir la pantalla en dos"]
pasos:
  - texto: "Arrastrá la ventana desde su barra de arriba hasta el borde izquierdo de la pantalla y soltala: ocupa la mitad."
  - texto: "Del otro lado aparecen las demás ventanas abiertas: tocá la que quieras para que ocupe la otra mitad."
  - texto: "Con el teclado: Windows + flecha izquierda o derecha. Si no funciona, revisá que «Acoplar ventanas» esté activado."
    abrir: "ms-settings:multitasking"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/snap-your-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/snap-your-windows
madurez: T0
