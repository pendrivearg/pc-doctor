id: BAS-LOCK-001
area: basico
titulo:
  sencillo: "Quiero bloquear la compu cuando me levanto"
  tecnico: "Bloquear la sesión (Windows + L)"
explicacion:
  sencillo: "Bloquear deja todo abierto como estaba, pero para volver a usarla hay que poner la clave o el PIN. Es útil en la oficina o si hay chicos cerca."
  tecnico: "Windows + L bloquea la sesión sin cerrar las aplicaciones."
frases: ["bloquear la compu cuando me voy", "dejar la compu bloqueada mientras no estoy", "que pida la clave sin apagar la compu"]
pasos:
  - texto: "Apretá Windows + L. La pantalla se bloquea y todo queda abierto como estaba."
  - texto: "Para volver, tocá cualquier tecla y poné tu clave o PIN."
  - texto: "Microsoft lo lista entre los atajos de teclado de Windows."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
fuentes:
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
