id: FIL-ORG-001
area: archivos
titulo:
  sencillo: "Quiero crear una carpeta o cambiarle el nombre a un archivo"
  tecnico: "Crear carpetas y renombrar archivos en el Explorador"
explicacion:
  sencillo: "Las carpetas sirven para ordenar fotos y documentos, y a cualquier archivo se le puede cambiar el nombre para encontrarlo más fácil."
  tecnico: "Explorador de archivos: Nuevo > Carpeta; Cambiar nombre o F2."
frases: ["crear una carpeta nueva", "cambiar el nombre de un archivo", "ordenar mis fotos en carpetas", "renombrar un documento"]
pasos:
  - texto: "Abrí el Explorador de archivos (Windows + E) y entrá donde quieras la carpeta (por ejemplo, Documentos). Tocá «Nuevo» > «Carpeta», escribí el nombre y Enter."
    abrir: "https://support.microsoft.com/office/create-a-new-folder-cbbfb6f5-59dd-4e5d-95f6-a12577952e17"
  - texto: "Para cambiar el nombre: seleccioná el archivo, apretá F2 (o «Cambiar nombre»), escribí el nombre nuevo y Enter."
    abrir: "https://support.microsoft.com/office/collab-files/rename-a-file"
fuentes:
  - https://support.microsoft.com/office/create-a-new-folder-cbbfb6f5-59dd-4e5d-95f6-a12577952e17
  - https://support.microsoft.com/office/collab-files/rename-a-file
madurez: T0
