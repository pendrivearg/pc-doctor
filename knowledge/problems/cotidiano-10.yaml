id: ACC-CHG-001
area: basico
titulo:
  sencillo: "Quiero cambiar la contraseña de la computadora"
  tecnico: "Cambiar la contraseña de Windows (cuenta local o de Microsoft)"
explicacion:
  sencillo: "Si sabés la clave actual, se cambia en un minuto desde Configuración. PC Doctor no ve ni guarda tu clave: la escribís vos en la pantalla de Windows."
  tecnico: "Cuentas > Opciones de inicio de sesión > Contraseña > Cambiar; en cuentas de Microsoft se cambia la contraseña de la cuenta."
frases: ["quiero cambiar la contraseña de la compu", "cambiar la clave de windows", "poner otra clave para entrar a la compu"]
pasos:
  - texto: "Abrí Opciones de inicio de sesión > «Contraseña» > «Cambiar». Escribí la actual y después la nueva dos veces."
    abrir: "ms-settings:signinoptions"
  - texto: "Si entrás con una cuenta de Microsoft (tu correo de Hotmail u Outlook), Microsoft explica cómo cambiarla."
    abrir: "https://support.microsoft.com/accounts-billing/security/change-or-reset-your-microsoft-account-password-in-windows"
  - texto: "Anotá la clave nueva en un lugar seguro. Si te la olvidás, escribile a PC Doctor «me olvidé la contraseña de la computadora»."
    abrir: "https://support.microsoft.com/windows/security/change-or-reset-your-local-account-password-in-windows"
fuentes:
  - https://support.microsoft.com/windows/security/change-or-reset-your-local-account-password-in-windows
  - https://support.microsoft.com/accounts-billing/security/change-or-reset-your-microsoft-account-password-in-windows
madurez: T0
