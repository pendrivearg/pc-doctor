id: BAS-UNDO-001
area: basico
titulo:
  sencillo: "Hice algo sin querer y quiero volver atrás"
  tecnico: "Deshacer (Ctrl + Z)"
explicacion:
  sencillo: "Casi todos los programas permiten deshacer lo último que hiciste: un texto borrado, un archivo movido o un cambio en un documento."
  tecnico: "Ctrl + Z deshace la acción anterior (Explorador, Office, navegador y la mayoría de las aplicaciones)."
frases: ["deshacer lo que hice", "me equivoqué y quiero deshacer", "volver atrás un cambio en el documento", "moví un archivo sin querer"]
pasos:
  - texto: "Apretá Ctrl + Z enseguida, sin hacer otra cosa antes. Cada vez que lo apretás deshace un paso más."
  - texto: "Si borraste un archivo entero, buscalo en la Papelera: escribile a PC Doctor «borré un archivo sin querer»."
  - texto: "Microsoft lo lista entre los atajos de teclado de Windows."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
fuentes:
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
