id: XLS-025
area: programas
titulo:
  sencillo: "Cambio un número y Excel no actualiza los resultados"
  tecnico: "Opciones de cálculo en Manual: volver a Automático (F9 recalcula)"
explicacion:
  sencillo: "Excel puede estar puesto para calcular «a mano»: cambiás un dato y el total queda igual hasta que se lo pedís. Se vuelve a poner en automático en un minuto."
  tecnico: "Con Cálculo del libro en Manual, las fórmulas solo se recalculan con F9. Fórmulas > Opciones de cálculo > Automático, o Archivo > Opciones > Fórmulas."
frases: ["excel no se actualiza solo", "cambio un número y el total queda igual", "tengo que apretar f9 para que calcule", "las fórmulas no recalculan"]
pasos:
  - texto: "Para que calcule ya mismo, apretá F9."
  - texto: "Para que vuelva a calcular solo: en la pestaña «Fórmulas», tocá «Opciones de cálculo» y elegí «Automático»."
  - texto: "Si no lo encontrás ahí: «Archivo» > «Opciones» > «Fórmulas», y en «Cálculo del libro» marcá «Automático». Tocá «Aceptar»."
    abrir: "https://support.microsoft.com/es-es/excel/change-formula-recalculation-iteration-or-precision-in-excel"
fuentes:
  - https://support.microsoft.com/es-es/excel/change-formula-recalculation-iteration-or-precision-in-excel
madurez: T0
