id: XLS-010
area: programas
titulo:
  sencillo: "Hay un triangulito verde en las celdas y los números no suman"
  tecnico: "Números almacenados como texto: Convertir en número"
explicacion:
  sencillo: "Cuando un número quedó guardado como si fuera texto (pasa mucho al copiar de una página o de otro programa), Excel le pone un triangulito verde en la esquina y no lo trata como número. Se convierte con un par de clics."
  tecnico: "Indicador de comprobación de errores «Número almacenado como texto»: botón de error > Convertir en número; alternativa: =VALOR() y pegar valores."
frases: ["me aparece un triangulito verde en la celda", "excel no me suma los números que pegué", "dice número almacenado como texto", "pasé números de otro programa y excel no los toma"]
pasos:
  - texto: "Seleccioná las celdas que tienen el triangulito verde arriba a la izquierda."
  - texto: "Al lado aparece un botoncito con un signo de advertencia: tocalo y elegí «Convertir en número»."
  - texto: "Si no aparece esa opción, en una columna nueva escribí =VALOR(A2) (con tu celda), arrastrá la fórmula hacia abajo y después copiá y pegá solo los valores en la columna original."
    abrir: "https://support.microsoft.com/es-es/excel/convert-numbers-stored-as-text-to-numbers-in-excel"
fuentes:
  - https://support.microsoft.com/es-es/excel/convert-numbers-stored-as-text-to-numbers-in-excel
madurez: T0
