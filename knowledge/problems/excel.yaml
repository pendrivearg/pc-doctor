id: XLS-020
area: programas
titulo:
  sencillo: "En Excel me aparece #¡DIV/0! en una celda"
  tecnico: "Error #¡DIV/0!: división por cero o por celda vacía"
explicacion:
  sencillo: "Ese cartel quiere decir que la fórmula está dividiendo por cero o por una celda que está vacía. Pasa mucho en planillas que todavía no tienen todos los datos cargados."
  tecnico: "#¡DIV/0! aparece cuando el divisor es 0 o una celda en blanco. Se evita con =SI(A3;A2/A3;0) o se controla con SI.ERROR, que oculta cualquier error."
frases: ["me sale div/0 en excel", "aparece #¡DIV/0! en la planilla", "error de división por cero en excel", "el promedio me da div 0"]
pasos:
  - texto: "Hacé clic en la celda con el error y mirá la fórmula arriba. Fijate por qué celda divide (lo que está después de la barra /)."
  - texto: "Si esa celda está vacía o tiene un 0, cargale el dato que falta, o cambiá la fórmula para que divida por la celda correcta."
  - texto: "Si es normal que a veces esté vacía, podés hacer que muestre 0 en vez del error: por ejemplo, en lugar de =A2/A3 escribí =SI(A3;A2/A3;0)."
    abrir: "https://support.microsoft.com/es-es/office/how-to-correct-a-div-0-error-3a5a18a9-8d80-4ebb-a908-39e759a009a5"
  - texto: "También existe SI.ERROR, pero tapa cualquier error, no solo este: usalo recién cuando sepas que la fórmula está bien."
fuentes:
  - https://support.microsoft.com/es-es/office/how-to-correct-a-div-0-error-3a5a18a9-8d80-4ebb-a908-39e759a009a5
madurez: T0
