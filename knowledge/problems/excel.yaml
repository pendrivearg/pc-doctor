id: XLS-012
area: programas
titulo:
  sencillo: "Escribo una fecha en Excel y aparece un número raro (como 45123)"
  tecnico: "Fechas como número de serie: aplicar formato de Fecha"
explicacion:
  sencillo: "Excel guarda las fechas como un número (cuenta los días desde el 1 de enero de 1900) para poder hacer cuentas con ellas. Si la celda no tiene formato de fecha, te muestra ese número. La fecha no se perdió: solo hay que decirle que la muestre como fecha."
  tecnico: "Las fechas son números de serie secuenciales (1/1/1900 = 1). Ctrl + 1 > Formato de celdas > Número > Categoría Fecha > Tipo."
frases: ["pongo una fecha y aparece un número", "las fechas se convirtieron en números", "en vez de la fecha sale 45000 y pico", "cómo hago que excel muestre la fecha bien"]
pasos:
  - texto: "Seleccioná las celdas donde aparecen los números en lugar de las fechas."
  - texto: "Apretá Ctrl + 1. Se abre «Formato de celdas»: en la pestaña «Número», elegí «Fecha» en la lista «Categoría»."
  - texto: "En «Tipo», elegí cómo querés verla. En «Muestra», ves cómo va a quedar. Tocá «Aceptar»."
    abrir: "https://support.microsoft.com/es-es/office/format-a-date-the-way-you-want-8e10019e-d5d8-47a1-ba95-db95123d273e"
fuentes:
  - https://support.microsoft.com/es-es/office/format-a-date-the-way-you-want-8e10019e-d5d8-47a1-ba95-db95123d273e
  - https://support.microsoft.com/es-es/office/datevalue-function-df8b07d4-7761-4a93-bc33-b7471bbff252
madurez: T0
