id: XLS-017
area: programas
titulo:
  sencillo: "Quiero que los títulos de las columnas salgan en todas las hojas impresas"
  tecnico: "Diseño de página > Imprimir títulos (Repetir filas en extremo superior)"
explicacion:
  sencillo: "Cuando una planilla larga se imprime en varias hojas, los títulos de arriba solo salen en la primera. Excel puede repetir esa fila de títulos en cada hoja para que se entienda qué es cada columna."
  tecnico: "Diseño de página > Configurar página > Imprimir títulos > pestaña Hoja > Repetir filas en extremo superior (p. ej. $1:$1)."
frases: ["que los títulos salgan en todas las hojas al imprimir", "repetir la primera fila en cada página", "en la segunda hoja impresa no se sabe qué es cada columna", "imprimir el encabezado de la planilla en cada hoja"]
pasos:
  - texto: "Abrí la hoja que vas a imprimir. En la pestaña «Diseño de página», tocá «Imprimir títulos»."
  - texto: "En la pestaña «Hoja», hacé clic en el cuadro «Repetir filas en extremo superior» y después tocá en la planilla el número de la fila de títulos (por ejemplo, la 1). Queda escrito algo como $1:$1."
  - texto: "Tocá «Aceptar» e imprimí. Si «Imprimir títulos» aparece gris, apretá Esc (puede que estés escribiendo en una celda) o hacé clic fuera del gráfico."
    abrir: "https://support.microsoft.com/es-es/excel/print-rows-with-column-headers-on-top-of-every-page"
fuentes:
  - https://support.microsoft.com/es-es/excel/print-rows-with-column-headers-on-top-of-every-page
madurez: T0
