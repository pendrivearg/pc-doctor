id: XLS-008
area: programas
titulo:
  sencillo: "Quiero cambiar una palabra o un número en toda la planilla de una vez"
  tecnico: "Buscar y reemplazar en una hoja o libro"
explicacion:
  sencillo: "Excel puede encontrar una palabra o un número en toda la planilla y cambiarlo por otro de un saque, sin ir celda por celda."
  tecnico: "Inicio > Edición > Buscar y seleccionar > Reemplazar; Opciones: Dentro de Hoja/Libro, coincidir mayúsculas o todo el contenido de la celda."
frases: ["cambiar una palabra en toda la planilla", "buscar un nombre en excel", "reemplazar todos los datos iguales de una vez", "corregir el mismo error en muchas celdas"]
pasos:
  - texto: "Para solo encontrar algo: en la pestaña «Inicio», tocá «Buscar y seleccionar» > «Buscar», escribí lo que buscás y tocá «Buscar todos»."
  - texto: "Para cambiarlo: «Inicio» > «Buscar y seleccionar» > «Reemplazar». Arriba poné lo que está mal y en «Reemplazar por» lo nuevo."
  - texto: "Antes de tocar «Reemplazar todo», usá «Buscar todos» para ver qué celdas va a cambiar: cambia todas las que coinciden, aunque sea dentro de otra palabra. En «Opciones» podés marcar «Coincidir con todo el contenido de la celda»."
    abrir: "https://support.microsoft.com/es-es/office/find-or-replace-text-and-numbers-on-a-worksheet-0e304ca5-ecef-4808-b90f-fdb42f892e90"
  - texto: "Si te equivocaste, apretá enseguida Ctrl + Z para deshacer."
fuentes:
  - https://support.microsoft.com/es-es/office/find-or-replace-text-and-numbers-on-a-worksheet-0e304ca5-ecef-4808-b90f-fdb42f892e90
madurez: T0
