id: XLS-006
area: programas
titulo:
  sencillo: "Quiero ver solo algunas filas de la planilla (filtrar)"
  tecnico: "Filtrar datos de un rango o tabla (Autofiltro)"
explicacion:
  sencillo: "El filtro esconde por un rato las filas que no te interesan y deja ver solo las que elegís, por ejemplo las de un mes o un cliente. No borra nada: al quitar el filtro vuelven todas."
  tecnico: "Datos > Filtro agrega flechas en los encabezados; desmarcar (Seleccionar todo) y elegir valores. Las filas filtradas quedan ocultas, no se eliminan."
frases: ["ver solo las filas de un mes en excel", "poner filtro en la planilla", "aparecieron flechitas en los títulos de excel", "me desaparecieron filas de la planilla"]
pasos:
  - texto: "Hacé clic en una celda de la lista y, en la pestaña «Datos», tocá «Filtro». Aparecen flechitas en los títulos de cada columna."
  - texto: "Tocá la flechita de la columna que querés filtrar, sacá la marca de «(Seleccionar todo)», marcá solo lo que querés ver y tocá «Aceptar»."
  - texto: "Para que vuelvan a verse todas las filas, tocá de nuevo «Datos» > «Filtro». Si te faltan filas y no sabés por qué, puede haber un filtro puesto."
    abrir: "https://support.microsoft.com/es-es/office/filter-data-in-a-range-or-table-01832226-31b5-4568-8806-38c37dcc180e"
fuentes:
  - https://support.microsoft.com/es-es/office/filter-data-in-a-range-or-table-01832226-31b5-4568-8806-38c37dcc180e
madurez: T0
