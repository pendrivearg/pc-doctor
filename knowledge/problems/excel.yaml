id: XLS-021
area: programas
titulo:
  sencillo: "En Excel me aparece #N/A (sobre todo con BUSCARV)"
  tecnico: "Error #N/A: valor buscado no encontrado"
explicacion:
  sencillo: "#N/A quiere decir que la fórmula buscó algo y no lo encontró. Con BUSCARV casi siempre es porque ese dato no está en la lista, o está escrito distinto (con un espacio de más, o como texto en vez de número)."
  tecnico: "#N/A en BUSCARV/BUSCARX/COINCIDIR: valor inexistente, número frente a texto, espacios sobrantes (ESPACIOS) o coincidencia aproximada (usar FALSO). SI.ERROR solo lo oculta."
frases: ["me sale #N/A en excel", "el buscarv me tira n/a", "excel no encuentra el dato y pone n/a", "aparece n/a en vez del precio"]
pasos:
  - texto: "Fijate si lo que buscás está de verdad en la lista donde busca la fórmula. Si no está, el #N/A es correcto: falta cargar ese dato."
  - texto: "Si está pero no lo encuentra, puede que en un lado sea número y en el otro texto: seleccioná las dos columnas, apretá Ctrl + 1 y dejales el mismo formato."
  - texto: "Los espacios de más al principio o al final también lo traban. Y en BUSCARV, el último dato tiene que ser FALSO para que busque exacto."
    abrir: "https://support.microsoft.com/es-es/office/how-to-correct-a-n-a-error-a9708411-f82e-4e1b-8a7e-28c28311b993"
  - texto: "Si es normal que algunos no estén, podés usar SI.ERROR para mostrar un 0 o dejarlo vacío. Ojo: así parece un dato válido, así que primero confirmá por qué no lo encuentra."
fuentes:
  - https://support.microsoft.com/es-es/office/how-to-correct-a-n-a-error-a9708411-f82e-4e1b-8a7e-28c28311b993
madurez: T0
