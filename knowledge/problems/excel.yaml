id: XLS-022
area: programas
titulo:
  sencillo: "En Excel me aparece #¡VALOR! al hacer una cuenta"
  tecnico: "Error #¡VALOR!: texto o espacios en celdas usadas en operaciones"
explicacion:
  sencillo: "Ese error aparece cuando la cuenta se encuentra con algo que no es un número: una palabra, una fecha escrita como texto o un espacio escondido en una celda que parece vacía."
  tecnico: "#¡VALOR! con operadores + o * sobre celdas con texto o espacios. Usar funciones (SUMA, PRODUCTO) que ignoran el texto, limpiar espacios o revisar con Fórmulas > Evaluar fórmula."
frases: ["me sale #¡VALOR! en la planilla", "excel tira error valor al sumar", "la cuenta me da error de valor", "una celda que parece vacía me arruina la fórmula"]
pasos:
  - texto: "Si la fórmula suma con signos +, como =A2+B2+C2, cambiala por =SUMA(A2:C2): SUMA no se traba con el texto."
  - texto: "Si alguna celda parece vacía pero tiene un espacio: seleccioná solo esas celdas de números, andá a «Inicio» > «Buscar y seleccionar» > «Reemplazar», escribí un espacio en «Buscar», dejá vacío «Reemplazar por» y tocá «Reemplazar todo»."
  - texto: "Para ver en qué parte falla: hacé clic en la celda con el error y andá a «Fórmulas» > «Evaluar fórmula»."
    abrir: "https://support.microsoft.com/es-es/excel/how-to-correct-a-value-error"
fuentes:
  - https://support.microsoft.com/es-es/excel/how-to-correct-a-value-error
madurez: T0
