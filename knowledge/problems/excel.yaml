id: XLS-014
area: programas
titulo:
  sencillo: "Quiero hacer un gráfico con los datos de la planilla"
  tecnico: "Insertar > Gráficos recomendados"
explicacion:
  sencillo: "Con los números de la planilla Excel arma un gráfico de barras, de torta o de líneas. Te muestra cuáles le quedan bien a tus datos para que elijas."
  tecnico: "Seleccionar los datos con sus títulos > Insertar > Gráficos recomendados (o Todos los gráficos) > Aceptar."
frases: ["hacer un gráfico en excel", "armar un gráfico de torta con la planilla", "pasar los números a un gráfico de barras", "cómo se hace un gráfico con los gastos"]
pasos:
  - texto: "Seleccioná con el mouse los datos que querés mostrar, incluyendo los títulos de las columnas."
  - texto: "En la pestaña «Insertar», tocá «Gráficos recomendados»."
  - texto: "Tocá cada opción para ver cómo queda. Si no te convence ninguna, mirá en «Todos los gráficos». Elegí uno y tocá «Aceptar»."
    abrir: "https://support.microsoft.com/es-es/office/create-a-chart-from-start-to-finish-0baf399e-dd61-4e18-8a73-b3fd5d5680c2"
fuentes:
  - https://support.microsoft.com/es-es/office/create-a-chart-from-start-to-finish-0baf399e-dd61-4e18-8a73-b3fd5d5680c2
madurez: T0
