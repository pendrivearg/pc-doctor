id: XLS-013
area: programas
titulo:
  sencillo: "Quiero agregar o borrar una fila o una columna en Excel"
  tecnico: "Insertar o eliminar filas y columnas de hoja"
explicacion:
  sencillo: "Podés meter una fila nueva en el medio de la planilla (por ejemplo, para un dato que te faltó) o sacar una que sobra. Al borrar una fila se va todo lo que tenía escrito."
  tecnico: "Clic derecho en el encabezado de fila o columna > Insertar o Eliminar; o Inicio > Insertar / Eliminar > filas o columnas de hoja."
frases: ["agregar una fila en el medio de la planilla", "meter una columna nueva en excel", "borrar una fila entera", "me faltó un renglón en la lista de excel"]
pasos:
  - texto: "Para agregar una fila: hacé clic derecho sobre el número de la fila (a la izquierda de todo) y elegí «Insertar». Para una columna, lo mismo sobre la letra de arriba."
  - texto: "Para borrar: clic derecho sobre el número de la fila (o la letra de la columna) y «Eliminar». Ojo: se borra todo lo que había en esa fila. Si te equivocaste, apretá Ctrl + Z."
  - texto: "También está en la pestaña «Inicio»: «Insertar» > «Insertar filas de hoja» o «Eliminar» > «Eliminar filas de hoja»."
    abrir: "https://support.microsoft.com/es-es/office/insert-or-delete-rows-and-columns-6f40e6e4-85af-45e0-b39d-65dd504a3246"
fuentes:
  - https://support.microsoft.com/es-es/office/insert-or-delete-rows-and-columns-6f40e6e4-85af-45e0-b39d-65dd504a3246
madurez: T0
