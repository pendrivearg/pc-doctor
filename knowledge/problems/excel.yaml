id: XLS-016
area: programas
titulo:
  sencillo: "Quiero que nadie me cambie la planilla (proteger la hoja)"
  tecnico: "Revisar > Proteger hoja"
explicacion:
  sencillo: "Podés trabar una hoja de Excel para que otros la vean pero no borren ni cambien las fórmulas. Si querés, dejás algunas celdas libres para que sí puedan escribir."
  tecnico: "Formato de celdas > Protección > desmarcar Bloqueada en las editables; Revisar > Proteger hoja con permisos y contraseña opcional; Desproteger hoja."
frases: ["que no me borren las fórmulas de la planilla", "bloquear una hoja de excel", "proteger la planilla para que no la modifiquen", "dejar que solo puedan escribir en algunas celdas"]
pasos:
  - texto: "Si querés que puedan escribir en algunas celdas: seleccionalas, apretá Ctrl + 1, andá a la pestaña «Protección» y sacale la marca a «Bloqueada». Tocá «Aceptar»."
  - texto: "En la pestaña «Revisar», tocá «Proteger hoja» y marcá lo que sí van a poder hacer los demás."
  - texto: "La clave es opcional. Si le ponés una, anotala en un lugar seguro: si te la olvidás, Microsoft no la puede recuperar."
  - texto: "Para destrabarla: «Revisar» > «Desproteger hoja»."
    abrir: "https://support.microsoft.com/es-es/excel/protect-a-worksheet"
fuentes:
  - https://support.microsoft.com/es-es/excel/protect-a-worksheet
madurez: T0
