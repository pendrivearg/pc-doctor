# Excel paso a paso: sumar, promediar, contar, porcentajes, ordenar, filtrar, duplicados, buscar y reemplazar, formatos, fórmulas y errores comunes. Guiadas con fuente oficial de Microsoft.
id: XLS-001
area: programas
titulo:
  sencillo: "Quiero sumar una columna de números en Excel"
  tecnico: "Autosuma (función SUMA)"
explicacion:
  sencillo: "Excel suma una columna entera con un solo botón, «Autosuma». No hace falta hacer la cuenta a mano ni escribir la fórmula."
  tecnico: "Inicio > Autosuma inserta =SUMA() con el rango contiguo detectado; Entrar confirma."
frases: ["cómo sumo una columna en excel", "quiero el total de la columna", "sumar todos los números de la planilla", "dónde está el botón de autosuma"]
pasos:
  - texto: "Hacé clic en la celda vacía que está justo debajo del último número de la columna (o a la derecha, si querés sumar una fila)."
  - texto: "En la pestaña «Inicio», tocá «Autosuma». Excel marca con un recuadro las celdas que va a sumar: fijate que estén todas."
  - texto: "Apretá Entrar y aparece el total. En la celda queda la fórmula SUMA."
    abrir: "https://support.microsoft.com/es-es/office/use-autosum-to-sum-numbers-543941e7-e783-44ef-8317-7d1bb85fe706"
fuentes:
  - https://support.microsoft.com/es-es/office/use-autosum-to-sum-numbers-543941e7-e783-44ef-8317-7d1bb85fe706
madurez: T0
---
id: XLS-002
area: programas
titulo:
  sencillo: "Quiero sacar el promedio de unos números en Excel"
  tecnico: "Función PROMEDIO"
explicacion:
  sencillo: "La fórmula PROMEDIO suma los números y los divide por la cantidad, sola. Las celdas vacías o con texto no las cuenta, pero los ceros sí."
  tecnico: "=PROMEDIO(número1; [número2]; ...): ignora celdas vacías, texto y valores lógicos de los rangos; incluye los ceros."
frases: ["cómo saco el promedio en excel", "sacar el promedio de las notas", "promediar una columna", "excel me da mal el promedio"]
pasos:
  - texto: "Hacé clic en la celda vacía donde querés ver el promedio."
  - texto: "Escribí =PROMEDIO( , marcá con el mouse las celdas con los números y cerrá el paréntesis. Por ejemplo: =PROMEDIO(A2:A6). Apretá Entrar."
  - texto: "Si el promedio te parece raro, revisá: un 0 cuenta como nota, pero una celda vacía no."
    abrir: "https://support.microsoft.com/es-es/office/average-function-047bac88-d466-426c-a32b-8f33eb960cf6"
fuentes:
  - https://support.microsoft.com/es-es/office/average-function-047bac88-d466-426c-a32b-8f33eb960cf6
madurez: T0
---
id: XLS-003
area: programas
titulo:
  sencillo: "Quiero contar cuántos datos hay en una columna de Excel"
  tecnico: "Funciones CONTAR, CONTARA y CONTAR.SI"
explicacion:
  sencillo: "Excel puede contar por vos: cuántos números hay, cuántas celdas tienen algo escrito, o cuántas cumplen una condición (por ejemplo, cuántos dicen «pagado»)."
  tecnico: "CONTAR cuenta solo celdas con números; CONTARA cuenta las no vacías (texto incluido); CONTAR.SI cuenta según un criterio."
frases: ["cuántas filas tengo en la planilla", "contar cuántos nombres hay en excel", "excel cuántas celdas tienen algo escrito", "contar cuántos dicen pagado"]
pasos:
  - texto: "Para contar celdas con números: en una celda vacía escribí =CONTAR( , marcá la columna, cerrá el paréntesis y apretá Entrar."
  - texto: "Si en la columna hay nombres o texto, CONTAR no los cuenta: usá =CONTARA( ) de la misma forma, que cuenta todas las celdas que no están vacías."
  - texto: "Para contar solo las que cumplen algo (por ejemplo, las que dicen «pagado»), la fórmula es CONTAR.SI."
    abrir: "https://support.microsoft.com/es-es/office/count-function-a59cd7fc-b623-4d93-87a4-d23bf411294c"
fuentes:
  - https://support.microsoft.com/es-es/office/count-function-a59cd7fc-b623-4d93-87a4-d23bf411294c
madurez: T0
---
id: XLS-004
area: programas
titulo:
  sencillo: "Quiero calcular un porcentaje en Excel"
  tecnico: "Calcular porcentajes y aplicar Estilo porcentual"
explicacion:
  sencillo: "Para saber qué porcentaje es un número de otro, se divide uno por el otro y después se le pone el formato de «%». Para sumar o restar un porcentaje (un aumento o un descuento) también hay una cuenta sencilla."
  tecnico: "Parte/total + Inicio > Estilo porcentual. Aumento: =valor*(1+0,25); descuento: =valor*(1-0,25)."
frases: ["cómo saco el porcentaje en excel", "calcular el 25 por ciento de un precio", "aplicar un descuento en la planilla", "poner el signo de porcentaje en excel"]
pasos:
  - texto: "Qué porcentaje es un número de otro: en una celda vacía escribí la división, por ejemplo =42/50, y apretá Entrar. Da 0,84."
  - texto: "Con esa celda elegida, en la pestaña «Inicio» tocá el botón de porcentaje (%): ahora se ve 84 %. Con los botones de aumentar o disminuir decimales elegís cuántos decimales mostrar."
  - texto: "Para aumentar un número un 25 %: =113*(1+0,25). Para descontarle un 25 %: =113*(1-0,25). Cambiá 113 por tu celda o tu precio."
    abrir: "https://support.microsoft.com/es-es/excel/calculate-percentages"
fuentes:
  - https://support.microsoft.com/es-es/excel/calculate-percentages
madurez: T0
---
id: XLS-005
area: programas
titulo:
  sencillo: "Quiero ordenar la lista de Excel de la A a la Z"
  tecnico: "Ordenar datos de un rango o tabla"
explicacion:
  sencillo: "Excel ordena una lista alfabéticamente o de menor a mayor con un botón. Conviene que toda la lista se ordene junta, así cada nombre sigue con sus datos."
  tecnico: "Datos > Ordenar y filtrar > Ordenar de A a Z / de menor a mayor; Datos > Ordenar para varios niveles. Evitar ordenar una parte del rango."
frases: ["ordenar por orden alfabético en excel", "ordenar los nombres de la a a la z", "ordenar de menor a mayor la planilla", "al ordenar se me mezclaron los datos"]
pasos:
  - texto: "Hacé clic en una sola celda de la columna por la que querés ordenar (no marques la columna sola)."
  - texto: "En la pestaña «Datos», tocá «Ordenar de la A a la Z» (para números aparece como «de menor a mayor»)."
  - texto: "Si Excel te pregunta, elegí «Ampliar la selección»: así cada fila se mueve entera y no se mezclan los datos."
  - texto: "Para ordenar por más de una columna (por ejemplo, apellido y después nombre), usá «Datos» > «Ordenar» > «Agregar nivel»."
    abrir: "https://support.microsoft.com/es-es/office/sort-data-in-a-range-or-table-62d0b95d-2a90-4610-a6ae-2e545c4a4654"
fuentes:
  - https://support.microsoft.com/es-es/office/sort-data-in-a-range-or-table-62d0b95d-2a90-4610-a6ae-2e545c4a4654
madurez: T0
