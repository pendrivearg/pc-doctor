id: XLS-015
area: programas
titulo:
  sencillo: "Quiero que Excel pinte de color las celdas según el valor"
  tecnico: "Formato condicional: Resaltar reglas de celdas"
explicacion:
  sencillo: "Excel puede pintar solo las celdas que cumplen algo, por ejemplo en rojo las deudas mayores a cierto monto. Si el número cambia, el color se acomoda solo."
  tecnico: "Inicio > Estilos > Formato condicional > Resaltar reglas de celdas (Mayor que, Entre, Igual a...); también barras de datos y escalas de color. Borrar reglas para quitarlo."
frases: ["que se pinten solas las celdas en rojo", "que se marquen las celdas mayores a un monto", "formato condicional en excel", "resaltar con color los que deben plata"]
pasos:
  - texto: "Seleccioná las celdas que querés controlar."
  - texto: "En la pestaña «Inicio», tocá «Formato condicional» > «Resaltar reglas de celdas» y elegí la condición (por ejemplo «Mayor que» o «Entre»)."
  - texto: "Escribí el número, elegí el color y tocá «Aceptar»."
  - texto: "Para sacarlo: «Inicio» > «Formato condicional» > «Borrar reglas»."
    abrir: "https://support.microsoft.com/es-es/excel/use-conditional-formatting-to-highlight-information-in-excel"
fuentes:
  - https://support.microsoft.com/es-es/excel/use-conditional-formatting-to-highlight-information-in-excel
madurez: T0
