id: XLS-007
area: programas
titulo:
  sencillo: "Tengo nombres o datos repetidos en la planilla y quiero sacarlos"
  tecnico: "Datos > Quitar duplicados (y resaltarlos antes con formato condicional)"
explicacion:
  sencillo: "Excel puede encontrar las filas repetidas y dejar una sola de cada una. Ojo: las repetidas se borran de verdad, así que conviene hacer una copia antes o marcarlas primero con color para revisarlas."
  tecnico: "Datos > Herramientas de datos > Quitar duplicados, eligiendo columnas; elimina en forma permanente. Para revisar antes: Inicio > Formato condicional > Resaltar reglas de celdas > Duplicar valores."
frases: ["sacar los repetidos de la lista de excel", "tengo clientes duplicados en la planilla", "borrar las filas repetidas", "marcar los datos que están dos veces"]
pasos:
  - texto: "Antes que nada: copiá la planilla a otra hoja o guardá una copia del archivo. Quitar duplicados borra las filas repetidas en forma permanente."
  - texto: "Si primero querés verlos: seleccioná la columna y andá a «Inicio» > «Formato condicional» > «Resaltar reglas de celdas» > «Duplicar valores». Se pintan de color y no se borra nada."
    abrir: "https://support.microsoft.com/es-es/office/find-and-remove-duplicates-00e35bea-b46a-4d5d-b28e-66a552dc138d"
  - texto: "Para borrarlos: hacé clic dentro de la lista, andá a la pestaña «Datos» y tocá «Quitar duplicados». Marcá las columnas que tienen que coincidir para que una fila cuente como repetida y tocá «Aceptar»."
  - texto: "Excel te dice cuántos sacó. Si no era lo que querías, apretá enseguida Ctrl + Z para deshacer."
    abrir: "https://support.microsoft.com/es-es/office/filter-for-unique-values-or-remove-duplicate-values-ccf664b0-81d6-449b-bbe1-8daaec1e83c2"
fuentes:
  - https://support.microsoft.com/es-es/office/filter-for-unique-values-or-remove-duplicate-values-ccf664b0-81d6-449b-bbe1-8daaec1e83c2
  - https://support.microsoft.com/es-es/office/find-and-remove-duplicates-00e35bea-b46a-4d5d-b28e-66a552dc138d
madurez: T0
