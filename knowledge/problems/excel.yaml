id: XLS-011
area: programas
titulo:
  sencillo: "El texto se sale de la celda o no entra en la columna"
  tecnico: "Ajustar texto, salto de línea y ancho de columna (Autoajustar)"
explicacion:
  sencillo: "Si escribís algo largo, Excel lo muestra pasando por encima de las celdas de al lado o lo corta. Podés ensanchar la columna o, con «Ajustar texto», hacer que se acomode en varios renglones dentro de la misma celda."
  tecnico: "Doble clic en el borde del encabezado de columna (autoajustar) o Inicio > Formato > Ancho de columna; Inicio > Alineación > Ajustar texto; salto manual con Alt + Entrar; Autoajustar alto de fila."
frases: ["el texto se sale de la celda", "escribir en dos renglones dentro de una celda", "la columna es muy angosta y no se lee", "cómo hago un enter dentro de la celda", "agrandar una columna en excel"]
pasos:
  - texto: "Para ensanchar la columna: arriba de todo, donde están las letras, hacé doble clic en la rayita que está a la derecha de la letra. La columna toma el ancho justo para lo que tiene escrito. También podés arrastrar esa rayita."
    abrir: "https://support.microsoft.com/es-es/office/change-the-column-width-and-row-height-72f5e3cc-994d-43e8-ae58-9774a0905f46"
  - texto: "Para que el texto baje de renglón dentro de la celda: seleccioná las celdas y, en la pestaña «Inicio», tocá «Ajustar texto»."
  - texto: "Para cortar el renglón donde vos quieras: hacé doble clic en la celda, poné el cursor en ese lugar y apretá Alt + Entrar."
  - texto: "Si igual no se ve todo, la fila tiene un alto fijo: en «Inicio» > «Formato», elegí «Autoajustar alto de fila»."
    abrir: "https://support.microsoft.com/es-es/office/wrap-text-in-a-cell-2a18cff5-ccc1-4bce-95e4-f0d4f3ff4e84"
fuentes:
  - https://support.microsoft.com/es-es/office/wrap-text-in-a-cell-2a18cff5-ccc1-4bce-95e4-f0d4f3ff4e84
  - https://support.microsoft.com/es-es/office/change-the-column-width-and-row-height-72f5e3cc-994d-43e8-ae58-9774a0905f46
madurez: T0
