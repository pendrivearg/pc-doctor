id: XLS-009
area: programas
titulo:
  sencillo: "Quiero que los números se vean como plata, con el signo $"
  tecnico: "Formato de número Moneda o Contabilidad"
explicacion:
  sencillo: "Excel puede mostrar los importes con el signo de pesos y los decimales que quieras. Es una forma de mostrarlos: no hace falta escribir el signo a mano en cada celda."
  tecnico: "Inicio > grupo Número: Moneda o Contabilidad; Ctrl + 1 > Formato de celdas para elegir Símbolo, Posiciones decimales y Números negativos."
frases: ["poner el signo pesos en excel", "que los números aparezcan como plata", "formato moneda en la planilla", "mostrar los precios con dos decimales en excel"]
pasos:
  - texto: "Seleccioná las celdas con los importes."
  - texto: "En la pestaña «Inicio», en la parte «Número», desplegá la lista de formatos y elegí «Moneda» (o el botón con el símbolo de moneda, que es «Contabilidad» y alinea los signos en la columna)."
  - texto: "Para elegir el símbolo o los decimales: apretá Ctrl + 1, en «Categoría» elegí «Moneda», y cambiá «Símbolo» y «Posiciones decimales». Tocá «Aceptar»."
    abrir: "https://support.microsoft.com/es-es/excel/format-numbers-as-currency-in-excel"
fuentes:
  - https://support.microsoft.com/es-es/excel/format-numbers-as-currency-in-excel
madurez: T0
