id: XLS-023
area: programas
titulo:
  sencillo: "En Excel me aparece #¿NOMBRE? en la fórmula"
  tecnico: "Error #¿NOMBRE?: función o nombre mal escrito"
explicacion:
  sencillo: "#¿NOMBRE? casi siempre es un error de tipeo: el nombre de la fórmula está mal escrito, falta poner comillas a una palabra o faltan los dos puntos entre dos celdas (A1:A10)."
  tecnico: "#¿NOMBRE?: nombre de función mal escrito, texto sin comillas dobles, rango sin dos puntos, nombre definido inexistente o complemento no habilitado. Usar autocompletar o Fórmulas > Insertar función."
frases: ["me sale #¿NOMBRE? en excel", "excel dice nombre con signo de pregunta", "escribí la fórmula y aparece error de nombre", "la fórmula no la reconoce excel"]
pasos:
  - texto: "Hacé clic en la celda y revisá la fórmula de arriba letra por letra: el nombre de la función tiene que estar bien escrito (por ejemplo SUMA, no SUMMA)."
  - texto: "Si la fórmula usa una palabra, tiene que ir entre comillas dobles. Y los rangos van con dos puntos: B2:B12."
  - texto: "Para no equivocarte: empezá a escribir =SU y elegí la función de la lista que aparece, o andá a la pestaña «Fórmulas» > «Insertar función», que te guía paso a paso."
    abrir: "https://support.microsoft.com/es-es/excel/how-to-correct-a-name-error"
fuentes:
  - https://support.microsoft.com/es-es/excel/how-to-correct-a-name-error
madurez: T0
