id: XLS-019
area: programas
titulo:
  sencillo: "Quiero que Excel me traiga un dato de otra lista (BUSCARV)"
  tecnico: "Funciones BUSCARV y BUSCARX: búsqueda exacta"
explicacion:
  sencillo: "BUSCARV busca algo (un código, un nombre) en una lista y te trae el dato que está en la misma fila, por ejemplo el precio. Así no tenés que buscarlo a ojo."
  tecnico: "=BUSCARV(valor_buscado; matriz_buscar_en; indicador_columnas; FALSO). El valor buscado debe estar en la primera columna del rango. BUSCARX es la versión nueva: busca en cualquier dirección y es exacta por defecto."
frases: ["cómo uso el buscarv", "traer el precio de otra lista con el código", "buscar un dato en otra tabla de excel", "cruzar dos listas en excel"]
pasos:
  - texto: "Fijate que lo que vas a buscar (por ejemplo, el código) esté en la primera columna de la lista donde buscás."
  - texto: "En la celda donde querés el resultado escribí, por ejemplo: =BUSCARV(H2;B2:E7;2;FALSO). Quiere decir: buscá lo que está escrito en H2 dentro de la primera columna de B2:E7 y traeme lo que está en la 2.ª columna de ese rango, en la misma fila."
  - texto: "El último dato, FALSO, es para que busque exactamente eso. Si no lo ponés, puede traer un resultado aproximado equivocado."
    abrir: "https://support.microsoft.com/es-es/office/vlookup-function-0bbc8083-26fe-4963-8ab8-93a18ad188a1"
  - texto: "Si tu Excel es nuevo, existe BUSCARX, que es más fácil: busca para cualquier lado y ya es exacta sola."
fuentes:
  - https://support.microsoft.com/es-es/office/vlookup-function-0bbc8083-26fe-4963-8ab8-93a18ad188a1
madurez: T0
