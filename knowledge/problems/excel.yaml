id: XLS-018
area: archivos
titulo:
  sencillo: "Abro un archivo CSV en Excel y los acentos y las eñes salen con símbolos raros"
  tecnico: "Importar CSV UTF-8 con Datos > Desde el texto/CSV (Origen del archivo)"
explicacion:
  sencillo: "Muchos archivos .csv que se bajan de sistemas o páginas vienen en una codificación llamada UTF-8. Si Excel no se da cuenta, las letras con acento y la ñ aparecen como símbolos raros. Importándolo desde la pestaña «Datos» le podés decir cómo leerlo."
  tecnico: "Sin BOM, Excel no infiere UTF-8 al abrir el CSV. Datos > Obtener y transformar datos > Desde texto o CSV; en la vista previa, lista Origen del archivo: UTF-8; Cargar."
frases: ["el csv sale con letras raras", "los acentos se ven mal en el archivo csv", "en vez de la ñ aparecen símbolos en excel", "abro el archivo del banco y salen caracteres extraños"]
pasos:
  - texto: "No abras el CSV con doble clic. Abrí Excel con un libro en blanco y, en la pestaña «Datos», tocá «Desde texto o CSV» (en algunas versiones está en «Obtener datos» > «De un archivo»)."
    abrir: "https://support.microsoft.com/es-es/office/abrir-archivos-csv-utf-8-correctamente-en-excel-8a935af5-3416-4edd-ba7e-3dfd2bc4a032"
  - texto: "Buscá el archivo, hacé doble clic y tocá «Importar». Aparece una vista previa."
  - texto: "Arriba, en la lista «Origen del archivo», elegí la opción que dice UTF-8. Fijate en la vista previa que los acentos ya se vean bien. Si las columnas salen todas juntas, cambiá el «Delimitador» (por ejemplo, a punto y coma)."
    abrir: "https://learn.microsoft.com/es-es/power-query/connectors/text-csv"
  - texto: "Tocá «Cargar» y los datos quedan en una hoja nueva."
    abrir: "https://support.microsoft.com/es-es/office/import-or-export-text-txt-or-csv-files-5250ac4c-663c-47ce-937b-339e391393ba"
fuentes:
  - https://support.microsoft.com/es-es/office/abrir-archivos-csv-utf-8-correctamente-en-excel-8a935af5-3416-4edd-ba7e-3dfd2bc4a032
  - https://support.microsoft.com/es-es/office/import-or-export-text-txt-or-csv-files-5250ac4c-663c-47ce-937b-339e391393ba
  - https://learn.microsoft.com/es-es/power-query/connectors/text-csv
madurez: T0
