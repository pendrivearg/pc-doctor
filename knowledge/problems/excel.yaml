id: XLS-024
area: programas
titulo:
  sencillo: "Excel me avisa de una «referencia circular»"
  tecnico: "Referencia circular: buscar y corregir (Fórmulas > Comprobación de errores)"
explicacion:
  sencillo: "Pasa cuando una fórmula se usa a sí misma en la cuenta, por ejemplo un total que se suma a sí mismo. Excel no puede terminar la cuenta y avisa, o muestra 0."
  tecnico: "Fórmula que depende de su propia celda, directa o indirectamente. Fórmulas > Comprobación de errores > Referencias circulares lista las celdas; el cálculo iterativo debe quedar desactivado salvo modelos específicos."
frases: ["excel dice referencia circular", "me sale un cartel de referencia circular al abrir la planilla", "el total me da cero y avisa algo circular", "cómo saco la referencia circular"]
pasos:
  - texto: "Andá a la pestaña «Fórmulas» > flechita de «Comprobación de errores» > «Referencias circulares». Ahí aparece la celda que tiene el problema: tocala para ir."
  - texto: "Mirá la fórmula de esa celda: seguro incluye su propia celda. Por ejemplo, si en D3 dice =D1+D2+D3, cambiala por =D1+D2. Pasa mucho con una SUMA que abarca también la celda del total."
  - texto: "Repetí hasta que abajo, en la barra de estado, deje de decir «Referencias circulares». Si sigue, puede haber otra en otra hoja."
    abrir: "https://support.microsoft.com/es-es/excel/remove-or-allow-a-circular-reference-in-excel"
  - texto: "No actives el «cálculo iterativo» para sacar el aviso: Microsoft recomienda dejarlo apagado en las planillas comunes."
fuentes:
  - https://support.microsoft.com/es-es/excel/remove-or-allow-a-circular-reference-in-excel
madurez: T0
