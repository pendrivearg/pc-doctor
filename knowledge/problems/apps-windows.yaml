id: APW-006
area: programas
titulo:
  sencillo: "Quiero achicar una imagen o cortarle un pedazo con Paint"
  tecnico: "Paint: Cambiar tamaño (píxeles o porcentaje) y Recortar una selección"
explicacion:
  sencillo: "Con Paint podés hacer más chica una imagen (por ejemplo, para mandarla o subirla a una página) y quedarte solo con la parte que te interesa."
  tecnico: "Paint > Cambiar tamaño: por porcentaje o píxeles. Recortar: herramienta Seleccionar sobre la zona a conservar > Recortar."
frases: ["achicar una imagen", "la foto es muy grande para subirla", "cambiar el tamaño de una imagen con paint", "cortar un pedazo de una imagen en paint"]
pasos:
  - texto: "Abrí Paint (buscalo en Inicio) y abrí la imagen."
  - texto: "Para achicarla: tocá «Cambiar tamaño» y poné el tamaño nuevo en porcentaje (por ejemplo, 50 para la mitad) o en píxeles."
  - texto: "Para quedarte con una parte: elegí «Seleccionar», marcá con el mouse lo que querés conservar y tocá «Recortar»."
  - texto: "Guardá con «Guardar como» y elegí el formato. Microsoft lo explica en las preguntas frecuentes de Paint."
    abrir: "https://www.microsoft.com/windows/paint"
