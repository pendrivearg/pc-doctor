titulo:
  sencillo: "No encuentro WordPad en la compu"
  tecnico: "WordPad eliminado desde Windows 11 24H2"
explicacion:
  sencillo: "Microsoft sacó WordPad de Windows 11 en las versiones nuevas. Para textos simples se usa el Bloc de notas, y para documentos con formato (.doc o .rtf), Word."
