id: APW-007
area: programas
titulo:
  sencillo: "El Bloc de notas me abre todo en pestañas"
  tecnico: "Pestañas en el Bloc de notas de Windows 11"
explicacion:
  sencillo: "El Bloc de notas nuevo funciona como el navegador: cada archivo se abre en una pestaña arriba, dentro de la misma ventana. Si preferís ventanas separadas, se puede cambiar."
  tecnico: "Bloc de notas con pestañas: varios archivos en una ventana, arrastrar una pestaña la saca a otra ventana; la configuración de la app define si los archivos abren en pestaña nueva o ventana nueva. Indicador de cambios sin guardar."
frases: ["el bloc de notas tiene pestañas", "se me abren todos los txt en la misma ventana", "quiero el bloc de notas en ventanas separadas", "cómo uso las pestañas del bloc de notas"]
pasos:
  - texto: "Cada archivo abierto aparece como una pestaña arriba. Tocá una pestaña para pasar de un archivo a otro."
  - texto: "Para ver un archivo en su propia ventana, arrastrá su pestaña hacia afuera de la ventana."
  - texto: "Si querés que cada archivo se abra siempre en una ventana nueva, entrá a la configuración del Bloc de notas y cambiá la opción de cómo se abren los archivos."
  - texto: "Las pestañas con cambios sin guardar tienen una marca. Al cerrarlas, el Bloc de notas te pregunta si querés guardar."
fuentes:
  - https://blogs.windows.com/windows-insider/2023/01/19/tabs-in-notepad-begins-rolling-out-to-windows-insiders/
  - https://blogs.windows.com/windows-insider/2023/08/31/new-updates-for-snipping-tool-and-notepad-for-windows-insiders/
