id: APW-018
area: programas
titulo:
  sencillo: "No quiero que Microsoft 365 se renueve solo (o cancelar la prueba gratis)"
  tecnico: "Desactivar la facturación periódica de Microsoft 365 / cancelar la prueba gratuita"
explicacion:
  sencillo: "Si apagás la renovación automática, no te vuelven a cobrar y seguís usando Microsoft 365 hasta la fecha de vencimiento. Con la prueba gratis pasa lo mismo: si la cancelás dentro de los 30 días, no te cobran."
  tecnico: "Servicios y suscripciones > Administrar > desactivar facturación periódica; acceso hasta la fecha de vencimiento (también para quienes comparten Familia). Prueba: enlace Cancelar dentro de los 30 días; si figura «Pagado con: Ninguno», vence sin cobro."
frases: ["que no me cobren más el office", "sacar la renovación automática de microsoft 365", "cancelar la prueba gratis de microsoft 365", "no quiero que se renueve el office solo"]
pasos:
  - texto: "Entrá a «Servicios y suscripciones» con la cuenta de Microsoft que tiene la suscripción. Buscala y tocá «Administrar»."
    abrir: "https://account.microsoft.com/services"
  - texto: "Elegí la opción para desactivar la facturación periódica y seguí los pasos hasta confirmar. Si esa opción no está, ya vence sola en la fecha que figura."
    abrir: "https://support.microsoft.com/office/turn-recurring-billing-on-or-off-for-microsoft-365-for-home-c7c0bc32-9744-4acf-9818-815d5c96cc59"
  - texto: "Si es la prueba gratis y ves «Cancelar», tocalo: dentro de los 30 días no te cobran."
    abrir: "https://support.microsoft.com/office/cancel-your-free-trial-of-microsoft-365-family-6334375a-a4ac-4047-9d6c-26c278a79a4e"
  - texto: "Vas a poder seguir usándolo hasta la fecha de vencimiento (y tu familia también, si era el plan Familia)."
fuentes:
  - https://support.microsoft.com/office/turn-recurring-billing-on-or-off-for-microsoft-365-for-home-c7c0bc32-9744-4acf-9818-815d5c96cc59
  - https://support.microsoft.com/office/cancel-your-free-trial-of-microsoft-365-family-6334375a-a4ac-4047-9d6c-26c278a79a4e
