id: APW-009
area: programas
titulo:
  sencillo: "Las aplicaciones Correo y Calendario de Windows dejaron de funcionar"
  tecnico: "Fin de soporte de Correo, Calendario y Contactos (31/12/2024): migrar al nuevo Outlook para Windows"
explicacion:
  sencillo: "Desde el 31 de diciembre de 2024, las aplicaciones Correo y Calendario de Windows ya no mandan ni reciben nada. Las reemplaza el nuevo Outlook, que es gratis y muestra juntos tus correos de Hotmail, Gmail o Yahoo."
  tecnico: "Windows Mail, Calendar y People sin soporte desde el 31/12/2024. Reemplazo: Outlook para Windows (nuevo Outlook) desde la Microsoft Store o con «Abrir Outlook» en Correo. Correos, eventos y contactos locales se pueden exportar."
frases: ["la aplicación correo de windows no anda más", "el calendario de windows no sincroniza", "no me llegan los mails a la app correo", "me dice que pase al nuevo outlook"]
pasos:
  - texto: "Abrí la aplicación Correo: en el aviso que aparece, tocá «Abrir Outlook». También podés bajar «Outlook» desde la Microsoft Store."
  - texto: "Seguí los pasos de la pantalla para agregar tu cuenta (Hotmail, Gmail, Yahoo): en Outlook ves todos tus correos en un solo lugar."
  - texto: "Si tenías correos o contactos guardados solo en la compu, Microsoft explica cómo exportarlos desde Correo e importarlos en el nuevo Outlook."
    abrir: "https://support.microsoft.com/office/outlook-for-windows-the-future-of-mail-calendar-and-people-on-windows-11-715fc27c-e0f4-4652-9174-47faa751b199"
fuentes:
  - https://support.microsoft.com/office/outlook-for-windows-the-future-of-mail-calendar-and-people-on-windows-11-715fc27c-e0f4-4652-9174-47faa751b199
