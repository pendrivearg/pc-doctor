id: APW-008
area: archivos
titulo:
  sencillo: "Cerré el Bloc de notas sin guardar: ¿perdí lo que escribí?"
  tecnico: "Bloc de notas: restauración automática de la sesión (pestañas y contenido sin guardar)"
explicacion:
  sencillo: "El Bloc de notas de Windows 11 recuerda lo que tenías abierto: al volver a abrirlo, te muestra las mismas pestañas con el texto que no habías guardado. Igual conviene guardarlo como archivo apenas lo recuperes."
  tecnico: "Desde Bloc de notas 11.2307.22.0 se guarda el estado de la sesión: restaura pestañas abiertas y contenido sin guardar. No modifica archivos; se puede desactivar en la configuración de la app."
frases: ["cerré el bloc de notas sin guardar", "perdí lo que escribí en el bloc de notas", "recuperar un texto del bloc de notas", "se apagó la compu y tenía algo escrito en el bloc de notas"]
pasos:
  - texto: "Volvé a abrir el Bloc de notas: si la función está activada, aparecen las pestañas que tenías, con el texto sin guardar."
  - texto: "Apenas lo veas, guardalo con «Guardar como»: la copia que recuerda el Bloc de notas no es un archivo guardado."
  - texto: "Si no aparece nada, revisá en la configuración del Bloc de notas que esté activada la opción de abrir el contenido de la sesión anterior. Desde ahí en adelante, lo que escribas se recupera."
fuentes:
  - https://blogs.windows.com/windows-insider/2023/08/31/new-updates-for-snipping-tool-and-notepad-for-windows-insiders/
madurez: T0
