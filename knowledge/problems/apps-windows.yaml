id: APW-024
area: programas
titulo:
  sencillo: "Se me venció Microsoft 365: ¿pierdo mis documentos?"
  tecnico: "Qué pasa al vencer Microsoft 365: modo de funcionalidad reducida, OneDrive a 5 GB, buzón de Outlook.com"
explicacion:
  sencillo: "Tus documentos no se borran: Word y Excel los siguen abriendo e imprimiendo, pero no te dejan editar ni crear nuevos hasta que renueves. Lo delicado es OneDrive: si tenías más de 5 GB, queda en solo lectura y, con el tiempo, Microsoft puede congelar la cuenta y borrar archivos."
  tecnico: "Apps en modo de funcionalidad reducida (ver e imprimir). OneDrive vuelve a 5 GB: sobre el límite, solo lectura; a los 3 meses se congela; a los 6, los archivos pueden eliminarse. Outlook.com sobre la cuota: no envía ni recibe. Miembros de Familia pierden los beneficios."
frases: ["se me venció el office y no puedo editar", "word me deja ver pero no escribir", "venció mi microsoft 365 y tengo miedo de perder todo", "onedrive quedó en solo lectura"]
pasos:
  - texto: "Fijate la fecha de vencimiento en «Servicios y suscripciones»."
    abrir: "https://account.microsoft.com/services"
  - texto: "Si lo querés seguir usando, renovalo (escribile a PC Doctor «quiero renovar Microsoft 365»). Mientras tanto, podés usar Office gratis en el navegador."
  - texto: "Si no vas a renovar y tenés más de 5 GB en OneDrive, bajate a la compu o a un disco externo lo que quieras conservar antes de que pasen los 6 meses. Microsoft lo explica."
    abrir: "https://support.microsoft.com/help/2eb89f06-bd1c-4f57-9269-f1cbab894341"
fuentes:
  - https://support.microsoft.com/help/2eb89f06-bd1c-4f57-9269-f1cbab894341
madurez: T0
