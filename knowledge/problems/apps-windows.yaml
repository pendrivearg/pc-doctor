id: APW-002
area: programas
titulo:
  sencillo: "Pagué Microsoft 365 y quiero que me devuelvan la plata"
  tecnico: "Reembolso de Microsoft 365 Basic, Personal o Familia: cancelar primero en Servicios y suscripciones"
explicacion:
  sencillo: "Si te cobraron Microsoft 365 y no lo querías, primero hay que cancelar la suscripción: recién ahí Microsoft te dice si te corresponde la devolución. Si lo pagaste por Google Play o la App Store, la devolución la maneja esa tienda."
  tecnico: "Para evaluar el reembolso de Microsoft 365 Basic/Personal/Familia hay que cancelar desde Servicios y suscripciones > Administrar > Cancelar. Compras vía Google Play o App Store: soporte de esa tienda. Al cancelar, OneDrive vuelve a 5 GB."
frases: ["quiero que microsoft me devuelva la plata", "me cobraron office 365 y no lo quiero", "pedir reembolso de microsoft 365", "me arrepentí de pagar microsoft 365"]
pasos:
  - texto: "Entrá a «Servicios y suscripciones» con la cuenta de Microsoft con la que pagaste. Buscá Microsoft 365 y tocá «Administrar»."
    abrir: "https://account.microsoft.com/services"
  - texto: "Elegí la opción para cancelar y seguí los pasos: ahí te muestra si te corresponde la devolución. Si en cambio ves la opción para activar la facturación periódica, ya no se renueva y no hace falta cancelar."
  - texto: "Ojo: al cancelar, tu espacio en OneDrive baja a 5 GB (y en el plan Familia, también el de las personas con las que lo compartías)."
  - texto: "Si lo pagaste desde el celular con Google Play o la App Store, pedí la devolución en esa tienda. Microsoft lo explica."
    abrir: "https://support.microsoft.com/accounts-billing/request-a-return-exchange-or-refund-for-microsoft-products"
fuentes:
  - https://support.microsoft.com/accounts-billing/request-a-return-exchange-or-refund-for-microsoft-products
