  - texto: "Entrá a «Servicios y suscripciones» con tu cuenta y abrí el uso compartido de Microsoft 365 Familia. Tocá «Compartir» (si no aparece, puede que no seas el titular)."
    abrir: "https://account.microsoft.com/services"
  - texto: "Invitá por correo (poné su dirección) o creá un vínculo, copialo y mandáselo por mail o mensaje."
  - texto: "La otra persona tiene que aceptar dentro de las 48 horas, con su cuenta de Microsoft (o creando una). Después puede instalar las aplicaciones."
    abrir: "https://support.microsoft.com/help/b389b9ce-3ae3-4a82-9017-39d79972fcba"
  - texto: "No compartas tu clave de producto: usá siempre la invitación."
fuentes:
