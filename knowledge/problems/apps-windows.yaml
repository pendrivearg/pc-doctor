id: APW-003
area: programas
titulo:
  sencillo: "Un familiar me invitó a usar su Microsoft 365 Familia"
  tecnico: "Aceptar una invitación para compartir Microsoft 365 Familia"
explicacion:
  sencillo: "Quien paga Microsoft 365 Familia puede compartirlo con otras personas. Si te llegó la invitación por correo, la aceptás con tu cuenta de Microsoft y después instalás Word, Excel y los demás sin pagar nada."
  tecnico: "Correo de invitación > Aceptar > Unirse ahora al grupo familiar > iniciar sesión (o crear cuenta Microsoft) > instalar las apps de Microsoft 365. Si ya estás en otro grupo familiar, hay que salir de él primero."
frases: ["me invitaron a microsoft 365 familia", "mi hijo me compartió el office", "cómo acepto la invitación de microsoft 365", "me llegó un mail para unirme a la familia de microsoft"]
pasos:
  - texto: "Abrí el correo de invitación y tocá el botón para aceptar. Después tocá el botón para unirte al grupo familiar."
  - texto: "Entrá con tu cuenta de Microsoft (Hotmail, Outlook). Si no tenés, te pide crear una."
  - texto: "Tocá el botón para empezar a usar las aplicaciones de Microsoft 365, elegí instalar y seguí los pasos."
    abrir: "https://support.microsoft.com/office/someone-invited-you-to-share-their-microsoft-365-subscription-6a6c098e-1934-4436-9a94-69c92590da5b"
  - texto: "Si te dice que ya estás en otro grupo familiar de Microsoft, primero tenés que salir de ese para poder unirte."
fuentes:
  - https://support.microsoft.com/office/someone-invited-you-to-share-their-microsoft-365-subscription-6a6c098e-1934-4436-9a94-69c92590da5b
