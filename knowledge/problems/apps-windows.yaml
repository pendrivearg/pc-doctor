titulo:
  sencillo: "Quiero cambiar la tarjeta con la que pago Microsoft 365"
  tecnico: "Cambiar el método de pago de una suscripción (Administrar > Cambiar forma de pago)"
explicacion:
  sencillo: "Si se te venció la tarjeta o querés pagar con otra, se cambia vos mismo en la página oficial de tu cuenta de Microsoft. Los datos de la tarjeta cargalos solo ahí; PC Doctor nunca te los pide."
  tecnico: "Servicios y suscripciones > Administrar > Cambiar forma de pago; elegir o agregar un método. Requiere facturación periódica activa. Suscripciones prepagas: no se puede cambiar; al vencer se compra una nueva."
