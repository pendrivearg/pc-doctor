id: APW-015
area: windows
titulo:
  sencillo: "Quiero una revisión rápida de cómo está mi compu (app PC Health Check)"
  tecnico: "PC Health Check: Windows Update, almacenamiento, tiempo de inicio, batería y requisitos de Windows 11"
explicacion:
  sencillo: "PC Health Check es una aplicación gratis de Microsoft que te muestra en una sola pantalla si Windows está al día, cuánto lugar queda en el disco, cuánto tarda en arrancar y cómo está la batería de la notebook."
  tecnico: "PC Health Check: elegibilidad para Windows 11, copia y sincronización con cuenta Microsoft, estado de Windows Update, capacidad de batería (equipos de más de 3 años), almacenamiento, tiempo de inicio y especificaciones del equipo."
frases: ["quiero revisar el estado de mi compu", "para qué sirve pc health check", "chequeo general de la computadora", "cómo está la salud de mi notebook"]
pasos:
  - texto: "Buscá «PC Health Check» en la barra de abajo y abrila. Si no la tenés, Microsoft explica cómo instalarla."
    abrir: "https://support.microsoft.com/windows/experience/compatibility/how-to-use-the-pc-health-check-app"
  - texto: "Mirá cada sección: si Windows está actualizado, cuánto lugar libre queda en el disco, cuánto tarda en arrancar y, en notebooks de más de 3 años, cuánta capacidad le queda a la batería."
  - texto: "Cada sección tiene un botón que te lleva a donde se corrige (por ejemplo, abrir Windows Update o administrar los programas que arrancan con la compu)."
  - texto: "Si algo te aparece marcado y no sabés qué hacer, contale a PC Doctor lo que dice."
fuentes:
