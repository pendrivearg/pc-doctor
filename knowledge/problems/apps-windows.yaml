id: APW-025
area: programas
titulo:
  sencillo: "Tengo Microsoft 365 (u Office) pagado y lo quiero instalar en otra compu"
  tecnico: "Instalar o reinstalar Microsoft 365 u Office 2024 desde m365.cloud.microsoft/apps"
explicacion:
  sencillo: "Lo que pagaste queda guardado en tu cuenta de Microsoft: para instalarlo en otra compu, entrás con esa cuenta y lo bajás. Con Microsoft 365 podés usarlo en todos tus aparatos; Office 2024 de pago único va en una sola compu (se puede pasar a una nueva)."
  tecnico: "m365.cloud.microsoft/apps > Iniciar sesión > Instalar aplicaciones > Instalar. Canjear antes la clave si vino con el producto. Suscripción: todos los dispositivos, 5 sesiones a la vez. Pago único: un equipo, transferible por falla o equipo nuevo."
frases: ["instalar el office en la compu nueva", "pasar mi office a otra computadora", "cómo bajo el office que ya pagué", "reinstalar office después de formatear"]
pasos:
  - texto: "Si tu Office vino con una clave y nunca la cargaste, canjeala primero con la misma cuenta de Microsoft que vas a usar."
  - texto: "En la compu nueva, entrá a m365.cloud.microsoft/apps, iniciá sesión con tu cuenta de Microsoft y tocá la opción para instalar las aplicaciones."
    abrir: "https://support.microsoft.com/office/download-install-or-reinstall-microsoft-365-or-office-2024-on-a-pc-or-mac-4414eaaf-0478-48be-9c42-23adc4716658"
  - texto: "Abrí el instalador que se descarga y, si Windows pregunta si permitís cambios, tocá «Sí». Esperá el mensaje de que Office quedó instalado."
  - texto: "Office 2024 de pago único se usa en una sola compu: si cambiaste de computadora, lo podés pasar a la nueva."
fuentes:
  - https://support.microsoft.com/office/download-install-or-reinstall-microsoft-365-or-office-2024-on-a-pc-or-mac-4414eaaf-0478-48be-9c42-23adc4716658
