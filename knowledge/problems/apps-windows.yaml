id: APW-005
area: programas
titulo:
  sencillo: "Quiero sacarle el fondo a una foto"
  tecnico: "Paint: quitar el fondo (eliminación de fondo con IA)"
explicacion:
  sencillo: "El Paint de Windows 11 actualizado puede borrar el fondo de una foto con un solo clic: deja solo a la persona o el objeto principal."
  tecnico: "Botón de quitar fondo en la barra de Paint; detección automática del sujeto, en toda la imagen o en una selección rectangular. Disponible en versiones recientes de Paint (desde 11.2306.30.0)."
frases: ["sacarle el fondo a una foto", "borrar el fondo de una imagen", "dejar solo la persona en la foto", "quitar el fondo con paint"]
pasos:
  - texto: "Abrí la foto en Paint."
  - texto: "Tocá el botón para quitar el fondo en la barra de arriba: Paint detecta solo a la persona u objeto y borra lo de atrás."
  - texto: "Si querés sacar el fondo solo de una parte, primero marcá esa zona con la selección rectangular y después tocá el mismo botón."
  - texto: "Guardá con «Guardar como» (podés elegir PNG, JPEG y otros formatos). Si no ves el botón, actualizá Windows y Paint: viene en las versiones nuevas."
    abrir: "https://www.microsoft.com/windows/paint"
fuentes:
  - https://www.microsoft.com/windows/paint
  - https://blogs.windows.com/windows-insider/2023/09/07/background-removal-in-paint-begins-rolling-out-to-windows-insiders/
