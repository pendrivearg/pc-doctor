id: APW-020
area: seguridad
titulo:
  sencillo: "Me apareció un cobro de Microsoft en la tarjeta y no sé qué es"
  tecnico: "Investigar un cargo de Microsoft desconocido"
explicacion:
  sencillo: "Muchas veces es una suscripción que se renueva sola, una compra de alguien de la familia o un cobro rechazado que se volvió a pasar. Revisalo en la página oficial de tu cuenta; si no lo reconocés, llamá a tu banco."
  tecnico: "Causas: suscripción con facturación periódica, compras de familiares con la misma tarjeta, cargo rechazado reprocesado, preventa o pedido dividido, compras dentro de apps o juegos. Si no es autorizado: avisar al banco que la tarjeta puede estar comprometida."
frases: ["me cobró microsoft y no compré nada", "cargo de microsoft en el resumen de la tarjeta", "me aparece msbill en la tarjeta", "un débito de microsoft que no reconozco"]
pasos:
  - texto: "Entrá a tu historial de pedidos con tu cuenta de Microsoft y fijate si el cobro coincide con alguna compra."
    abrir: "https://account.microsoft.com/billing/orders"
  - texto: "Mirá también tus suscripciones: lo más común es una que se renueva sola. Si no la querés, escribile a PC Doctor «no quiero que Microsoft 365 se renueve solo»."
    abrir: "https://account.microsoft.com/services"
  - texto: "Preguntá en tu casa si alguien compró algo (un juego, algo dentro de una app) con tu tarjeta."
  - texto: "Si no lo reconocés, llamá a tu banco al número que figura en tu tarjeta y avisá que puede estar comprometida: reclamar el cobro solo no frena cobros futuros. Microsoft lo explica."
    abrir: "https://support.microsoft.com/help/10623"
fuentes:
  - https://support.microsoft.com/help/10623
