id: APW-013
area: basico
titulo:
  sencillo: "Quiero que alguien de Microsoft me ayude (app Obtener ayuda)"
  tecnico: "Obtener ayuda: búsqueda, solucionadores y contacto con soporte (chat o devolución de llamada)"
explicacion:
  sencillo: "Windows trae la aplicación «Obtener ayuda»: le contás el problema, te muestra soluciones y, si no alcanza, te deja chatear con alguien de Microsoft o pedir que te llamen."
  tecnico: "Obtener ayuda (cuenta Microsoft personal): búsqueda, solucionadores, Contactar con soporte > producto > Confirmar > chat en el navegador, devolución de llamada con número de solicitud o pedido de reparación. Opciones según horario, producto y suscripción."
frases: ["quiero hablar con microsoft", "cómo contacto al soporte de windows", "chatear con alguien de microsoft", "que me llame alguien de microsoft para ayudarme"]
pasos:
  - texto: "Abrí la aplicación «Obtener ayuda» (buscala en Inicio). Conviene haber entrado a Windows con tu cuenta de Microsoft."
  - texto: "Escribí tu problema en el cuadro de búsqueda. Probá primero las soluciones y los solucionadores que te muestra."
  - texto: "Si sigue igual, tocá el botón para contactar al soporte, elegí el producto (por ejemplo, Windows) y confirmá."
  - texto: "Elegí cómo: chat en el navegador o que te llamen (te dan un número de solicitud). Las opciones cambian según el horario y el producto."
    abrir: "https://support.microsoft.com/windows/get-help-for-microsoft-personal-account-users-aaf7f74b-026e-489b-a102-0570dfbfb192"
fuentes:
  - https://support.microsoft.com/windows/get-help-for-microsoft-personal-account-users-aaf7f74b-026e-489b-a102-0570dfbfb192
