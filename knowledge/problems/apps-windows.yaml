pasos:
  - texto: "Entrá a «Servicios y suscripciones» con la cuenta que tiene la suscripción, buscala y tocá «Administrar»."
    abrir: "https://account.microsoft.com/services"
  - texto: "Elegí la opción para cambiar la forma de pago. Tocá un medio de pago de la lista o la opción para agregar uno nuevo, y seguí los pasos."
    abrir: "https://support.microsoft.com/account-billing/change-your-microsoft-subscription-payment-method-and-options-39ab4bc1-01f9-fc28-c3a5-49e87b6e7611"
  - texto: "Si no aparece la opción, puede ser que la facturación periódica esté apagada. Si es una suscripción prepaga, no se cambia: cuando venza, comprás una nueva."
  - texto: "Si te da error al cargar la tarjeta, consultá con tu banco."
fuentes:
