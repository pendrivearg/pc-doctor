id: APW-014
area: windows
titulo:
  sencillo: "Windows me muestra consejos y sugerencias que no quiero"
  tecnico: "Desactivar «consejos y sugerencias» y la experiencia de bienvenida (Sistema > Notificaciones > Configuración adicional)"
explicacion:
  sencillo: "Windows a veces muestra avisos con consejos, sugerencias o una pantalla de bienvenida después de actualizar. Se pueden apagar, y también los avisos de cualquier aplicación que te moleste."
  tecnico: "Configuración > Sistema > Notificaciones > Configuración adicional: casillas de la experiencia de bienvenida tras actualizaciones y de consejos y sugerencias. Notificaciones por app en la misma página. La app Sugerencias (Tips) está obsoleta."
frases: ["me aparecen consejos de windows todo el tiempo", "sacar las sugerencias de windows", "no quiero la pantalla de bienvenida después de actualizar", "windows me recomienda cosas que no pedí"]
pasos:
  - texto: "Abrí Configuración > Sistema > Notificaciones."
    abrir: "ms-settings:notifications"
  - texto: "Abajo, abrí «Configuración adicional» y destildá la casilla de consejos y sugerencias, y la de la experiencia de bienvenida después de las actualizaciones."
  - texto: "Si una aplicación en particular te llena de avisos, en la misma página, en la lista de aplicaciones, apagá sus notificaciones. Microsoft lo explica."
    abrir: "https://support.microsoft.com/help/4014934"
fuentes:
  - https://support.microsoft.com/help/4014934
  - https://learn.microsoft.com/windows/whats-new/deprecated-features
