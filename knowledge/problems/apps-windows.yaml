id: APW-004
area: programas
titulo:
  sencillo: "Quiero escribir un texto encima de una foto con Paint"
  tecnico: "Paint: herramienta Texto"
explicacion:
  sencillo: "Paint viene con Windows y sirve para escribirle algo a una imagen, por ejemplo un saludo o una flecha con una aclaración."
  tecnico: "Paint > herramienta Texto: clic en el lienzo crea un cuadro de texto; fuente, tamaño y color en la barra. Guardar como PNG, JPEG, BMP o GIF."
frases: ["poner letras en una foto", "escribir sobre una imagen en paint", "agregar un texto a una foto", "cómo pongo un cartel en una foto con paint"]
pasos:
  - texto: "Abrí Paint (buscalo en Inicio) y abrí la foto que querés usar."
  - texto: "Arriba, elegí la herramienta «Texto». Hacé clic en la foto donde quieras escribir: aparece un recuadro."
  - texto: "Escribí tu texto y, en la barra de arriba, elegí la letra, el tamaño y el color."
  - texto: "Guardá con «Guardar como» y elegí el formato (por ejemplo, JPEG o PNG). Microsoft lo explica en las preguntas frecuentes de Paint."
    abrir: "https://www.microsoft.com/windows/paint"
fuentes:
  - https://www.microsoft.com/windows/paint
