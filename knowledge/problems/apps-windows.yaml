id: APW-010
area: programas
titulo:
  sencillo: "Quiero hacer una lista de cosas para hacer (o de compras) en la compu"
  tecnico: "Microsoft To Do: listas, recordatorios, Mi día y listas compartidas"
explicacion:
  sencillo: "Microsoft To Do es una app de listas: anotás lo que tenés que hacer, le ponés un recordatorio y la podés compartir con tu familia. Si entrás con tu cuenta de Microsoft, las mismas tareas se ven en Outlook."
  tecnico: "To Do: Nueva lista, tareas con recordatorio («Recordarme»), Mi día, compartir con vínculo de invitación. Tareas guardadas en Exchange Online, sincronizadas con Outlook con la misma cuenta."
frases: ["hacer una lista de tareas en la compu", "anotar lo que tengo que hacer", "lista del súper en la computadora", "compartir una lista de compras con mi familia"]
pasos:
  - texto: "Abrí Microsoft To Do y entrá con tu cuenta de Microsoft (la misma de tu correo)."
  - texto: "En el menú de listas, tocá «Nueva lista» y ponele un nombre (por ejemplo, «Supermercado»). Escribí cada cosa como una tarea."
    abrir: "https://support.microsoft.com/todo/create-and-share-lists"
  - texto: "Para que te avise: tocá una tarea y elegí la opción de recordatorio (el ícono de la campanita)."
    abrir: "https://support.microsoft.com/outlook/create-and-manage-task-lists-with-my-day-in-outlook"
  - texto: "Para compartir la lista: tocá el ícono de compartir arriba a la derecha, creá el vínculo de invitación, copialo y mandáselo por correo o mensaje."
fuentes:
  - https://support.microsoft.com/todo/create-and-share-lists
  - https://support.microsoft.com/todo/plan-and-connect-with-microsoft-to-do
  - https://support.microsoft.com/outlook/create-and-manage-task-lists-with-my-day-in-outlook
