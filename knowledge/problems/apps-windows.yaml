# Aplicaciones que vienen con Windows 11 (Copilot, Paint, Bloc de notas, nuevo Outlook, To Do, Obtener ayuda, PC Health Check) y suscripciones de Microsoft 365: plan, renovación, cobros, compartir y Office de pago único. Guiadas con fuente oficial.
id: APW-001
area: programas
titulo:
  sencillo: "¿Qué es Copilot y cómo lo abro?"
  tecnico: "Microsoft Copilot en Windows: abrir desde la barra de tareas, la tecla Copilot o Windows + C"
explicacion:
  sencillo: "Copilot es el asistente con inteligencia artificial de Microsoft: le escribís (o le hablás) una pregunta y te contesta, te ayuda a redactar un texto o te guía en la configuración de Windows. Las compus nuevas con Windows 11 ya lo traen; si no está, se baja de la Microsoft Store."
  tecnico: "App Microsoft Copilot (Microsoft Store). Acceso: barra de tareas o Inicio, tecla Copilot o Windows + C. Con cuenta Microsoft personal suma historial de chats, creación de imágenes y voz."
frases: ["qué es copilot", "cómo abro copilot", "para qué sirve el copilot de windows", "quiero usar la inteligencia artificial de microsoft", "dónde está copilot en mi compu"]
pasos:
  - texto: "Buscá el ícono de Copilot en la barra de abajo o en Inicio y tocalo. También podés apretar la tecla Copilot del teclado (si tu compu la tiene) o Windows + C."
  - texto: "Si no aparece, buscá «Microsoft Copilot» en la Microsoft Store e instalalo."
  - texto: "Entrá con tu cuenta de Microsoft (la del Hotmail u Outlook) cuando te lo pida: así guarda tus conversaciones. Escribí tu pregunta abajo y apretá Enter. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/welcome-to-copilot-on-windows-675708af-8c16-4675-afeb-85a5a476ccb0"
  - texto: "Si no lo usás y te molesta, escribile a PC Doctor «no uso Copilot y lo quiero sacar»."
fuentes:
  - https://support.microsoft.com/windows/welcome-to-copilot-on-windows-675708af-8c16-4675-afeb-85a5a476ccb0
  - https://learn.microsoft.com/windows/client-management/manage-windows-copilot
madurez: T0
