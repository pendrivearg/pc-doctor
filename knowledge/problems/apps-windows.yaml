id: APW-017
area: programas
titulo:
  sencillo: "Quiero renovar Microsoft 365"
  tecnico: "Renovar Microsoft 365: clave de producto en microsoft365.com/setup o facturación periódica"
explicacion:
  sencillo: "Microsoft 365 se renueva de dos formas: cargando la clave de una tarjeta que compraste en un comercio, o dejando que se cobre solo con tu medio de pago en la página de tu cuenta."
  tecnico: "Clave de 25 caracteres en microsoft365.com/setup con la misma cuenta Microsoft (extiende el tiempo, hasta 5 años en total; no suma instalaciones ni almacenamiento). O activar la facturación periódica en Servicios y suscripciones > Administrar."
frases: ["se me vence el office y lo quiero renovar", "compré una tarjeta de office 365 en el negocio", "cómo renuevo microsoft 365", "cargar la clave para renovar office"]
pasos:
  - texto: "Si compraste una tarjeta o caja en un comercio: buscá la clave de 25 caracteres (en la tarjeta, debajo de la parte para raspar, o en el correo de la compra)."
  - texto: "Entrá a microsoft365.com/setup con la MISMA cuenta de Microsoft de tu suscripción, elegí tu país y cargá la clave. Al terminar te muestra la nueva fecha de vencimiento. Microsoft lo explica."
    abrir: "https://support.microsoft.com/topic/58f3d0f8-15c4-4ad8-8c5f-16d682e8b545"
  - texto: "Si preferís que se cobre solo: en «Servicios y suscripciones», tocá «Administrar» y activá la facturación periódica (si ves «Renovar», tocalo). Seguí los pasos para el pago."
    abrir: "https://account.microsoft.com/services"
fuentes:
  - https://support.microsoft.com/topic/58f3d0f8-15c4-4ad8-8c5f-16d682e8b545
  - https://support.microsoft.com/office/turn-recurring-billing-on-or-off-for-microsoft-365-for-home-c7c0bc32-9744-4acf-9818-815d5c96cc59
