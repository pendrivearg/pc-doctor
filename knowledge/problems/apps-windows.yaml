id: APW-021
area: programas
titulo:
  sencillo: "Quiero compartir mi Microsoft 365 Familia con mi familia"
  tecnico: "Compartir Microsoft 365 Familia: invitación por correo o vínculo (hasta 5 personas)"
explicacion:
  sencillo: "Si pagás Microsoft 365 Familia, podés invitar hasta 5 personas para que tengan Word, Excel y su propio espacio en OneDrive. Se comparte con una invitación, nunca pasando la clave."
  tecnico: "Página de uso compartido de la suscripción > Compartir > invitación por correo o vínculo copiado. Aceptación dentro de 48 horas (pendiente mientras tanto). No se comparten almacenamiento extendido ni funciones de IA del titular."
