id: PNS-014
area: windows
titulo:
  sencillo: "Aprieto Windows + K y no aparece la tele (o no se conecta)"
  tecnico: "Fallas al proyectar a una pantalla inalámbrica (Miracast)"
explicacion:
  sencillo: "Para mandar la imagen sin cables, la compu y la tele (o el adaptador) tienen que ser compatibles con «Miracast» y la compu tiene que tener el Wi-Fi prendido. Si no aparece o se corta, hay algunas cosas para revisar."
  tecnico: "Compatibilidad Miracast (Win + K), Wi-Fi activo, adaptador Miracast HDMI, controladores y firmware, reinicio, quitar y volver a agregar en «Pantallas inalámbricas y bases»."
frases: ["no me aparece la tele para conectar sin cable", "la pantalla inalámbrica no se conecta", "dice que conecte una pantalla con cable", "se corta la imagen en la tele sin cables"]
pasos:
  - texto: "Apretá Windows + K. Si aparece un aviso de que hay que conectar la pantalla con cable, tu compu no admite Miracast: vas a necesitar un cable HDMI."
  - texto: "Fijate que el Wi-Fi de la compu esté prendido (abajo a la derecha, en el ícono de red) y que la tele esté prendida y admita Miracast. Si la tele no lo admite, existe un adaptador Miracast que se enchufa en su entrada HDMI."
  - texto: "Reiniciá la compu y la tele, y probá de nuevo."
  - texto: "Si antes funcionaba, quitala de la lista: en Bluetooth y dispositivos > Dispositivos, en la parte de pantallas inalámbricas, elegila, quitá el dispositivo y volvé a conectarla con Windows + K."
    abrir: "ms-settings:connecteddevices"
  - texto: "Si sigue sin andar, buscá actualizaciones de la tele o del adaptador en la página del fabricante. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/fix-connections-to-wireless-displays-or-docks-in-windows"
derivar: "Si querés saber cómo pasar la imagen a la tele con cable, escribile a PC Doctor «quiero ver la compu en la tele»."
fuentes:
