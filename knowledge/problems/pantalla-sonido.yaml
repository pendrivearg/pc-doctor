id: PNS-022
area: audio
titulo:
  sencillo: "En las videollamadas se escucha todo el ruido de mi casa"
  tecnico: "Ruido de fondo en el micrófono: supresión de ruido (Teams) y Enfoque de voz (Windows Studio Effects)"
explicacion:
  sencillo: "El micrófono capta también la tele, el perro o la calle. Muchos programas de videollamada tienen una opción para «suprimir el ruido», y algunas compus nuevas traen además un filtro de Windows que deja pasar solo tu voz."
  tecnico: "Teams: Configuración > Dispositivos > Supresión de ruido (también desde Más acciones > Configuración de audio en la reunión). Windows Studio Effects: Enfoque de voz, requiere NPU; se activa desde el icono Studio Effects de la configuración rápida."
frases: ["en zoom se escucha el ruido de la casa", "el micrófono agarra el ruido de la calle", "me dicen que se escucha la tele de fondo", "sacar el ruido de fondo del micrófono"]
pasos:
  - texto: "En Teams: tocá los tres puntitos («Configuración y más») > «Configuración» > «Dispositivos» y activá «Supresión de ruido». Durante una reunión también está en «Más acciones» > «Configuración» > «Configuración de audio»."
    abrir: "https://support.microsoft.com/office/reduce-background-noise-in-microsoft-teams-meetings-1a9c6819-137d-4b3b-a1c8-4ab20b234c0d"
  - texto: "Si usás otro programa (Zoom, Meet, WhatsApp), buscá en su configuración de audio una opción parecida para reducir el ruido de fondo."
  - texto: "Si tu compu es de las nuevas con procesador para IA, tocá el ícono de red o de volumen (abajo a la derecha) y fijate si aparece «Studio Effects»: ahí está el enfoque de voz («Voice focus»), que deja pasar tu voz y baja el ruido. Si no aparece, tu compu no lo tiene."
    abrir: "https://support.microsoft.com/windows/ai/ai-features/windows-studio-effects"
derivar: "Si lo que pasa es que no te escuchan o te escuchan bajito, escribile a PC Doctor «en las videollamadas me escuchan muy bajito»."
fuentes:
  - https://support.microsoft.com/office/reduce-background-noise-in-microsoft-teams-meetings-1a9c6819-137d-4b3b-a1c8-4ab20b234c0d
  - https://support.microsoft.com/windows/ai/ai-features/windows-studio-effects
madurez: T0
