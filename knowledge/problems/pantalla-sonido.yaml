id: PNS-019
area: audio
titulo:
  sencillo: "Quiero sonido envolvente en los auriculares para películas y juegos"
  tecnico: "Sonido espacial (Windows Sonic para auriculares)"
explicacion:
  sencillo: "El «sonido espacial» hace que en los auriculares parezca que el sonido viene de distintos lados, como en el cine. Windows trae uno gratis y en la Microsoft Store hay otros."
  tecnico: "Sistema > Sonido > Salida > (dispositivo) > Sonido espacial: Windows Sonic para auriculares; alternativas Dolby Access o DTS Sound Unbound."
frases: ["poner sonido envolvente en los auriculares", "activar sonido 3d en la compu", "quiero que el juego suene como en el cine", "qué es windows sonic"]
pasos:
  - texto: "Abrí Sonido y, en «Salida», tocá tus auriculares para entrar en sus propiedades."
    abrir: "ms-settings:sound"
  - texto: "En «Sonido espacial», elegí «Windows Sonic para auriculares». Si aparece «Aplicar», tocalo, y probá con una película o un juego."
  - texto: "Si querés otras opciones, en la Microsoft Store están Dolby Access y DTS Sound Unbound. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/drivers/how-to-turn-on-spatial-sound-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/drivers/how-to-turn-on-spatial-sound-in-windows
