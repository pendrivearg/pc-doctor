id: PNS-008
area: windows
titulo:
  sencillo: "Con dos monitores, en uno se ve todo enorme y en el otro chiquito"
  tecnico: "Escala por pantalla (Sistema > Pantalla > Escala y diseño > Escala)"
explicacion:
  sencillo: "Cada monitor tiene su propio tamaño de letras e íconos (la «escala»). Si conectaste una pantalla nueva o la notebook a un monitor grande, puede que uno quede con todo gigante y el otro con todo diminuto. Se ajusta cada uno por separado."
  tecnico: "Sistema > Pantalla: seleccionar la pantalla en el esquema y ajustar Escala (preferentemente la «Recomendada») en Escala y diseño."
frases: ["en un monitor todo se ve grande y en el otro chico", "la notebook y el monitor muestran distinto tamaño", "cambiar el tamaño de las letras en un solo monitor", "al conectar el monitor nuevo todo quedó gigante"]
pasos:
  - texto: "Abrí Pantalla (Configuración > Sistema > Pantalla). Arriba aparecen los monitores como rectángulos con números: tocá el que querés cambiar."
    abrir: "ms-settings:display"
  - texto: "Bajá hasta «Escala y diseño» y, en «Escala», elegí otro tamaño. Conviene empezar por el que dice «(Recomendado)»."
  - texto: "Repetí con el otro monitor hasta que los dos se vean cómodos. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/change-your-screen-resolution-and-layout-in-windows"
derivar: "Si la imagen se ve estirada o con bordes negros, escribile a PC Doctor «la pantalla se ve estirada o con bordes negros»."
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/change-your-screen-resolution-and-layout-in-windows
madurez: T0
---
id: PNS-009
area: windows
titulo:
  sencillo: "Algunos programas se ven borrosos desde que conecté otro monitor"
  tecnico: "Aplicaciones borrosas al cambiar de pantalla o de escala"
explicacion:
  sencillo: "Cuando conectás o desconectás un monitor, o cambiás el tamaño de las letras, algunos programas viejos quedan borrosos porque se «estiran». Casi siempre se arregla cerrando sesión y volviendo a entrar."
  tecnico: "Apps que no son per-monitor DPI aware se escalan con la configuración de la pantalla principal; cerrar sesión, igualar la escala entre monitores y reiniciar la app."
frases: ["algunos programas se ven borrosos", "las letras de word se ven desenfocadas en el monitor", "desde que enchufé el monitor un programa se ve borroso", "un programa se ve como estirado y borroso"]
pasos:
  - texto: "Cerrá el programa que se ve borroso y volvé a abrirlo."
  - texto: "Si sigue igual, guardá lo que estés haciendo, cerrá sesión en Windows y volvé a entrar."
  - texto: "Si te pasa seguido, poné la misma escala en todos los monitores (por ejemplo, 125 % en los dos) en Pantalla > «Escala y diseño», y volvé a cerrar sesión."
    abrir: "ms-settings:display"
  - texto: "Microsoft lo explica para Office."
    abrir: "https://support.microsoft.com/office/office-apps-appear-the-wrong-size-or-blurry-on-external-monitors-bc9f7279-4e42-4b15-a949-46ab8bcfe44f"
fuentes:
  - https://support.microsoft.com/office/office-apps-appear-the-wrong-size-or-blurry-on-external-monitors-bc9f7279-4e42-4b15-a949-46ab8bcfe44f
  - https://support.microsoft.com/windows/hardware/display-graphics/change-your-screen-resolution-and-layout-in-windows
madurez: T0
