id: PNS-007
area: basico
titulo:
  sencillo: "Bajé un tipo de letra y quiero usarlo en Word"
  tecnico: "Instalar una fuente (.ttf u .otf) o desde Microsoft Store"
explicacion:
  sencillo: "Para usar una letra nueva hay que instalarla en Windows. Una vez instalada, aparece en Word y en los demás programas que la admiten. Conviene bajarlas solo de lugares de confianza."
  tecnico: "Archivo TrueType (.ttf) u OpenType (.otf): extraer si viene en .zip, clic derecho > Instalar o Instalar para todos los usuarios. También desde Fuentes > Microsoft Store."
frases: ["instalar una fuente nueva", "bajé una letra linda y no aparece en word", "cómo agrego una tipografía", "quiero una letra que no tengo en la compu"]
pasos:
  - texto: "Si la letra vino en un archivo .zip, hacé clic derecho sobre él y elegí «Extraer todo». Adentro tiene que haber un archivo que termine en .ttf u .otf."
  - texto: "Hacé clic derecho en ese archivo y elegí «Instalar» (o «Instalar para todos los usuarios» si la compu la usan varias personas). Si Windows te pregunta si permitís cambios, decí que sí solo si confiás en dónde la bajaste."
  - texto: "Cerrá y volvé a abrir Word: la letra tendría que aparecer en la lista. Si no aparece, fijate en Fuentes si quedó instalada; no todos los programas aceptan todas las letras."
    abrir: "ms-settings:fonts"
  - texto: "También podés conseguir letras desde Fuentes, con la opción para obtener más fuentes en Microsoft Store. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/personalization/manage-fonts-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/personalization/manage-fonts-in-windows
madurez: T0
