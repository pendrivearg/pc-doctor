id: PNS-010
area: windows
titulo:
  sencillo: "El brillo de la pantalla cambia solo"
  tecnico: "Brillo automático por iluminación y brillo según el contenido"
explicacion:
  sencillo: "Algunas notebooks suben o bajan el brillo solas, según la luz del lugar o lo que se ve en la pantalla (por ejemplo, para ahorrar batería). Si te molesta, se apaga."
  tecnico: "Sistema > Pantalla > Brillo: «Cambiar el brillo automáticamente cuando cambie la iluminación» y «Cambiar el brillo según el contenido» (Desactivado / Siempre / Solo con batería)."
frases: ["el brillo cambia solo", "la pantalla se oscurece y se aclara sola", "la notebook baja el brillo sola cuando abro algo oscuro", "quiero que el brillo quede fijo"]
pasos:
  - texto: "Abrí Pantalla (Configuración > Sistema > Pantalla) y desplegá «Brillo»."
    abrir: "ms-settings:display"
  - texto: "Apagá la opción que cambia el brillo automáticamente cuando cambia la iluminación."
  - texto: "Si ahí aparece la opción de cambiar el brillo según el contenido, ponela en «Desactivado» (o «Solo con batería» si querés ahorrar cuando está desenchufada)."
  - texto: "Si estas opciones no aparecen, tu pantalla no las tiene. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/change-display-brightness-and-color-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/change-display-brightness-and-color-in-windows
madurez: T0
---
id: PNS-011
area: windows
titulo:
  sencillo: "Los colores de la pantalla no se ven bien y quiero ajustarlos"
  tecnico: "Calibrar la pantalla (Perfil de color > Calibrar pantalla)"
explicacion:
  sencillo: "Windows trae un asistente que te guía paso a paso para ajustar los colores de la pantalla mirando unas imágenes de prueba. Al terminar, guarda esos ajustes."
  tecnico: "Sistema > Pantalla > Perfil de color > Calibrar pantalla: crea un perfil de color nuevo; en monitores externos con HDR deriva a la app Calibración HDR de Windows."
frases: ["calibrar los colores del monitor", "los colores de la pantalla se ven raros", "las fotos se ven con otros colores en la compu", "ajustar el color de la pantalla"]
pasos:
  - texto: "Abrí Pantalla. Si tenés más de un monitor, elegí arriba el que querés ajustar."
    abrir: "ms-settings:display"
  - texto: "Entrá en «Perfil de color» y tocá «Calibrar pantalla». Seguí los pasos de la pantalla mirando las imágenes de prueba."
  - texto: "Al terminar, Windows crea un perfil de color nuevo para esa pantalla. Si el monitor tiene HDR, te va a mandar a la app de calibración HDR de Windows."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/change-display-brightness-and-color-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/change-display-brightness-and-color-in-windows
madurez: T0
---
id: PNS-012
area: windows
titulo:
  sencillo: "La pantalla tiene un tono raro aunque la luz nocturna está apagada"
  tecnico: "Perfil de color incorrecto o administración automática del color"
explicacion:
  sencillo: "Si la pantalla se ve amarillenta, rosada o lavada y la luz nocturna no está prendida, puede ser que esté cargado un «perfil de color» equivocado. Se puede volver al que corresponde."
  tecnico: "Sistema > Pantalla > Perfil de color: establecer el perfil adecuado, quitar perfiles agregados y probar «Administrar automáticamente el color de las aplicaciones»."
frases: ["la pantalla tiene un color raro", "todo se ve amarillento y no es la luz nocturna", "la pantalla quedó rosada", "después de calibrar los colores quedaron mal"]
pasos:
  - texto: "Primero fijate que la luz nocturna esté apagada y no tenga horario programado."
    abrir: "ms-settings:nightlight"
  - texto: "Abrí Pantalla, elegí el monitor que se ve raro y entrá en «Perfil de color». Elegí otro perfil de la lista y usá la opción para establecerlo. Si agregaste uno a mano o al calibrar, desplegalo y quitalo."
    abrir: "ms-settings:display"
  - texto: "Si tu pantalla lo permite, probá activar la opción de administrar automáticamente el color de las aplicaciones."
  - texto: "En un monitor de escritorio, revisá también los botones del propio monitor (su menú de color). Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/change-display-brightness-and-color-in-windows"
derivar: "Si la pantalla se ve amarilla solo de noche, escribile a PC Doctor «la pantalla se ve amarillenta de noche»."
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/change-display-brightness-and-color-in-windows
madurez: T0
---
id: PNS-013
area: windows
titulo:
  sencillo: "La pantalla se puso en blanco y negro (o con colores raros) de golpe"
  tecnico: "Filtro de color activado con Windows + Ctrl + C"
explicacion:
  sencillo: "Si la pantalla quedó de repente sin colores o con los colores cambiados, casi seguro se activó un «filtro de color», a veces apretando sin querer Windows + Ctrl + C. No es que se rompió el monitor: se apaga en un momento."
  tecnico: "Accesibilidad > Filtros de color; el atajo Windows + Ctrl + C los activa o desactiva si el atajo está habilitado en Configuración."
frases: ["la pantalla se puso en blanco y negro", "se fueron los colores de la pantalla", "la pantalla quedó gris de repente", "apreté unas teclas y la pantalla cambió de color"]
pasos:
  - texto: "Probá apretar Windows + Ctrl + C: si fue el atajo, los colores vuelven enseguida."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "Si no vuelven, abrí Filtros de color (Configuración > Accesibilidad > Filtros de color) y apagá el interruptor «Filtros de color»."
    abrir: "ms-settings:easeofaccess-colorfilter"
  - texto: "Para que no vuelva a pasar sin querer, en esa misma página apagá el atajo de teclado de los filtros de color. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/use-color-filters-in-windows-43893e44-b8b3-2e27-1a29-b0c15ef0e5ce"
derivar: "Si lo que ves es la pantalla amarillenta, escribile a PC Doctor «la pantalla se ve amarillenta»."
fuentes:
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
  - https://support.microsoft.com/windows/use-color-filters-in-windows-43893e44-b8b3-2e27-1a29-b0c15ef0e5ce
madurez: T0
