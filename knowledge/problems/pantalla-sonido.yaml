id: PNS-005
area: basico
titulo:
  sencillo: "Quiero cambiar el dibujo de la flechita del mouse"
  tecnico: "Esquema de punteros (Propiedades del mouse > Punteros)"
explicacion:
  sencillo: "Además del tamaño y el color, Windows trae varios «esquemas»: juegos de flechitas con otro estilo (por ejemplo, en negro o más gruesas). También se puede cambiar una sola, como el relojito de espera."
  tecnico: "Bluetooth y dispositivos > Mouse > Configuración adicional del mouse > Propiedades del mouse > Punteros: Esquema o Personalizar > Examinar."
frases: ["cambiar el estilo de la flecha del mouse", "poner otro dibujo al cursor", "cambiar el relojito de espera del mouse", "quiero la flechita negra en vez de blanca"]
pasos:
  - texto: "Abrí Mouse (Configuración > Bluetooth y dispositivos > Mouse) y, en configuraciones relacionadas, tocá «Configuración adicional del mouse»."
    abrir: "ms-settings:mousetouchpad"
  - texto: "En la ventana «Propiedades del mouse», andá a la pestaña «Punteros» y elegí otro estilo en la lista «Esquema». Vas a ver cómo queda cada flechita."
  - texto: "Para cambiar una sola, elegila en la lista de abajo («Personalizar»), tocá «Examinar», elegí el dibujo y «Abrir». Al final tocá «Aceptar». Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings"
derivar: "Si lo que necesitás es una flechita más grande o de otro color para verla mejor, escribile a PC Doctor «no veo bien la flechita del mouse»."
fuentes:
  - https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings
madurez: T0
