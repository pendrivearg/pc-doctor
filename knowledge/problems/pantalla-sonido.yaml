id: PNS-024
area: audio
titulo:
  sencillo: "Los parlantes o el micrófono desaparecieron de la lista de sonido"
  tecnico: "Dispositivo de audio deshabilitado (Uso del dispositivo: habilitar)"
explicacion:
  sencillo: "Si alguien deshabilitó los parlantes o el micrófono, Windows deja de usarlos y a veces ni los muestra. Se pueden volver a habilitar desde la ventana clásica de Sonido."
  tecnico: "Sonido > Más opciones de configuración de sonido > Reproducción o Grabación > Propiedades > Uso del dispositivo: «Usar este dispositivo (habilitar)»."
frases: ["desaparecieron los parlantes de la lista", "el micrófono no aparece en sonido", "deshabilité el sonido sin querer", "habilitar los parlantes otra vez"]
pasos:
  - texto: "Abrí Sonido y, abajo de todo, entrá a la configuración de sonido adicional. Se abre una ventana chica."
    abrir: "ms-settings:sound"
  - texto: "En la pestaña «Reproducción» (parlantes) o «Grabación» (micrófono), elegí el aparato y tocá «Propiedades»."
  - texto: "Abajo, en «Uso del dispositivo», elegí la opción para usar este dispositivo (habilitar) y tocá «Aceptar». Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/audio/fix-sound-or-audio-problems-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/audio/fix-sound-or-audio-problems-in-windows
