id: PNS-017
area: audio
titulo:
  sencillo: "Quiero que un programa suene por los auriculares y el resto por los parlantes"
  tecnico: "Dispositivo de salida por aplicación (Mezclador de volumen)"
explicacion:
  sencillo: "Windows deja elegir por dónde suena cada programa. Por ejemplo, la videollamada por los auriculares y la música por los parlantes. También pasa al revés: un programa puede quedar mandando el sonido a un aparato que ya no usás."
  tecnico: "Mezclador de volumen > Aplicaciones > Dispositivo de salida por aplicación; puede diferir del predeterminado del sistema."
frases: ["que zoom suene por los auriculares y la música por los parlantes", "un programa suena por otro lado", "todo suena menos un programa", "elegir por dónde sale el sonido de cada programa"]
pasos:
  - texto: "Con los dos aparatos conectados, abrí el programa y dejalo sonando."
  - texto: "Abrí el Mezclador de volumen y, en «Aplicaciones», desplegá el programa. En «Dispositivo de salida» elegí por dónde querés que suene."
    abrir: "ms-settings:apps-volume"
  - texto: "Si un programa no suena y los demás sí, revisá ahí mismo que no esté silenciado ni mandando el sonido a otro aparato. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/audio/fix-app-audio-not-working-while-system-sounds-work-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/audio/fix-app-audio-not-working-while-system-sounds-work-in-windows
madurez: T0
