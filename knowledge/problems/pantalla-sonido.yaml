id: PNS-006
area: basico
titulo:
  sencillo: "Quiero ver qué tipos de letra tengo en la compu (o borrar uno que no uso)"
  tecnico: "Fuentes instaladas: ver, buscar y desinstalar (Personalización > Fuentes)"
explicacion:
  sencillo: "Las «fuentes» son los tipos de letra que podés usar en Word y en otros programas. Windows tiene una lista donde ves todas, cómo se ven y las buscás por nombre. Las que instalaste y no usás se pueden desinstalar."
  tecnico: "Configuración > Personalización > Fuentes > Fuentes disponibles: búsqueda, vista previa por tamaño y estilo; Opciones > Desinstalar."
frases: ["qué letras tengo instaladas", "ver las tipografías de la compu", "cómo sé si tengo una letra instalada", "desinstalar una tipografía que bajé", "tengo demasiadas letras en la lista de word"]
pasos:
  - texto: "Abrí Fuentes (Configuración > Personalización > Fuentes)."
    abrir: "ms-settings:fonts"
  - texto: "En «Fuentes disponibles» está la lista. Escribí el nombre en el buscador para encontrar una y tocala para ver cómo se ve, en distintos tamaños y estilos."
  - texto: "Para borrar una que instalaste y no usás, entrá en esa fuente, tocá las opciones y elegí «Desinstalar». Si no sabés de dónde salió una letra, mejor no la toques."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/personalization/manage-fonts-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/personalization/manage-fonts-in-windows
madurez: T0
