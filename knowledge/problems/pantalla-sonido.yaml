id: PNS-004
area: basico
titulo:
  sencillo: "Quiero poner o cambiar el protector de pantalla"
  tecnico: "Configuración del protector de pantalla"
explicacion:
  sencillo: "El protector de pantalla es una animación o fotos que aparecen cuando no tocás la compu por un rato. Se elige cuál, cuántos minutos espera y si al volver te pide la clave."
  tecnico: "Personalización > Pantalla de bloqueo > Protector de pantalla: lista de protectores, «Esperar» (minutos) y pedir inicio de sesión al reanudar."
frases: ["poner el protector de pantalla", "quiero que aparezcan fotos cuando no uso la compu", "cambiar la animación que sale cuando dejo la compu quieta", "que pida la clave cuando vuelvo del protector"]
pasos:
  - texto: "Abrí Pantalla de bloqueo y, más abajo, en la parte de configuraciones relacionadas, tocá «Protector de pantalla»."
    abrir: "ms-settings:lockscreen"
  - texto: "En la ventana que se abre, elegí un protector de la lista (por ejemplo, «Fotos») y en «Esperar» poné cuántos minutos tiene que pasar sin usar la compu."
  - texto: "Si elegiste «Fotos», tocá «Configuración...» para elegir las fotos. Si querés que al volver te pida la clave, marcá la casilla de mostrar la pantalla de inicio de sesión al reanudar. Tocá «Aceptar»."
  - texto: "Microsoft lo explica (y recomienda usar la suspensión si lo que buscás es ahorrar energía)."
    abrir: "https://support.microsoft.com/windows/experience/configure-a-screen-saver-in-windows"
derivar: "Si lo que te pasa es que la pantalla se apaga muy rápido, escribile a PC Doctor «la pantalla se apaga muy rápido»."
fuentes:
  - https://support.microsoft.com/windows/experience/configure-a-screen-saver-in-windows
madurez: T0
