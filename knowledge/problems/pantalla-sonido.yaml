id: PNS-021
area: audio
titulo:
  sencillo: "Los auriculares Bluetooth se conectan pero el sonido se corta"
  tecnico: "Audio Bluetooth entrecortado: alcance, interferencia USB 3.0, solucionador y controlador"
explicacion:
  sencillo: "Si los auriculares o el parlante Bluetooth andan pero el sonido se entrecorta, suele ser la distancia, algo que interfiere (como un pendrive o disco cerca) o el controlador del Bluetooth de la compu."
  tecnico: "Alcance e interferencias (dispositivos USB 3.0 sin blindaje), solucionador de Bluetooth (Obtener ayuda), actualizar o reinstalar el controlador del adaptador."
frases: ["el sonido bluetooth se entrecorta", "los auriculares inalámbricos se cortan a cada rato", "el parlante bluetooth hace saltos", "la música se corta en los auriculares"]
pasos:
  - texto: "Acercá los auriculares a la compu y alejalos de pendrives o discos USB enchufados cerca (algunos aparatos USB interfieren con el Bluetooth)."
  - texto: "Apagá los auriculares, esperá unos segundos y prendelos de nuevo."
  - texto: "Si sigue igual, en Configuración > Sistema > Solucionar problemas > Otros solucionadores, ejecutá el de Bluetooth."
    abrir: "ms-settings:troubleshoot"
  - texto: "Si no mejora, actualizá el controlador del Bluetooth desde el Administrador de dispositivos o buscalo en la página del fabricante de la compu. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/fix-bluetooth-problems-in-windows-723e092f-03fa-858b-5c80-131ec3fba75c"
derivar: "Si no se conectan para nada, escribile a PC Doctor «los auriculares Bluetooth no se conectan»."
fuentes:
  - https://support.microsoft.com/windows/fix-bluetooth-problems-in-windows-723e092f-03fa-858b-5c80-131ec3fba75c
madurez: T0
