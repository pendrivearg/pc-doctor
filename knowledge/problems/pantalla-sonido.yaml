id: PNS-020
area: audio
titulo:
  sencillo: "Cuando hago una videollamada, se baja solo el volumen de todo lo demás"
  tecnico: "Atenuación automática en comunicaciones (Sonido > pestaña Comunicaciones)"
explicacion:
  sencillo: "Windows, cuando detecta una llamada, baja o silencia los demás sonidos (la música, un video). Viene así de fábrica, pero se puede cambiar para que no toque nada."
  tecnico: "Panel de control > Sonido > pestaña Comunicaciones: silenciar, reducir (80 % por defecto) o no hacer nada; el volumen se restaura al cerrar la comunicación."
frases: ["cuando entro a zoom se baja la música", "en las llamadas se baja el volumen de todo", "el volumen baja solo cuando hablo por la compu", "la música queda bajita durante la videollamada"]
pasos:
  - texto: "Abrí Sonido y, abajo de todo, entrá a la configuración de sonido adicional (en inglés, «More sound settings»). Se abre una ventana chica."
    abrir: "ms-settings:sound"
  - texto: "En esa ventana, andá a la pestaña «Comunicaciones». Ahí elegís qué hace Windows cuando hay una llamada: marcá la opción que no hace nada con el volumen y tocá «Aceptar»."
  - texto: "Si después de cortar el volumen no volvió, subilo en el Mezclador de volumen."
    abrir: "ms-settings:apps-volume"
  - texto: "Microsoft lo describe (en inglés)."
    abrir: "https://learn.microsoft.com/windows/win32/coreaudio/stream-attenuation"
fuentes:
  - https://learn.microsoft.com/windows/win32/coreaudio/stream-attenuation
  - https://support.microsoft.com/windows/hardware/audio/fix-sound-or-audio-problems-in-windows
madurez: T0
