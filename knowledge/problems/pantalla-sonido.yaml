id: PNS-016
area: audio
titulo:
  sencillo: "Quiero bajar el volumen de un solo programa sin tocar los demás"
  tecnico: "Mezclador de volumen por aplicación"
explicacion:
  sencillo: "Cada programa tiene su propio volumen. Así podés, por ejemplo, bajar la música y dejar fuerte la videollamada, o silenciar el navegador sin silenciar todo."
  tecnico: "Sistema > Sonido > Mezclador de volumen > Aplicaciones: volumen y silencio por aplicación."
frases: ["bajar el volumen de un solo programa", "la música tapa la videollamada", "silenciar solo el navegador", "el juego suena más fuerte que la música"]
pasos:
  - texto: "Abrí el programa que querés ajustar (por ejemplo, el navegador con la música) y dejalo sonando."
  - texto: "Abrí el Mezclador de volumen (Configuración > Sistema > Sonido > Mezclador de volumen). En «Aplicaciones» aparece cada programa con su barrita: subila o bajala, o tocá el parlantito para silenciarlo."
    abrir: "ms-settings:apps-volume"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/audio/fix-app-audio-not-working-while-system-sounds-work-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/audio/fix-app-audio-not-working-while-system-sounds-work-in-windows
madurez: T0
