id: PNS-003
area: basico
titulo:
  sencillo: "La foto del escritorio cambia sola todos los días"
  tecnico: "Windows destacado (Windows spotlight) como fondo de escritorio"
explicacion:
  sencillo: "Después de algunas actualizaciones, Windows puede poner «Windows destacado»: una foto distinta cada día, elegida por Microsoft, a veces con sugerencias. Si preferís una foto fija, se cambia en un minuto."
  tecnico: "Windows destacado cambia la imagen a diario en el fondo y la pantalla de bloqueo; desde KB5046633 (Windows 11) puede quedar como fondo predeterminado. Se cambia en Personalización > Fondo."
frases: ["el fondo de pantalla cambia solo", "cada día aparece una foto distinta en el escritorio", "me cambiaron la foto del escritorio sin que yo hiciera nada", "quiero que el fondo quede fijo"]
pasos:
  - texto: "Abrí Fondo (Configuración > Personalización > Fondo)."
    abrir: "ms-settings:personalization-background"
  - texto: "En «Personalizar el fondo», cambiá «Windows destacado» por «Imagen» y elegí la foto que quieras."
  - texto: "Si también cambia sola la foto de la pantalla de bloqueo, hacé lo mismo en Pantalla de bloqueo."
    abrir: "ms-settings:lockscreen"
  - texto: "Al revés: si te gusta que cambie, elegí «Windows destacado» en esas mismas listas. Microsoft lo explica."
    abrir: "https://learn.microsoft.com/windows/configuration/windows-spotlight/"
fuentes:
  - https://learn.microsoft.com/windows/configuration/windows-spotlight/
  - https://support.microsoft.com/windows/experience/personalization/customize-the-lock-screen-in-windows
madurez: T0
