id: PNS-025
area: archivos
titulo:
  sencillo: "Cada vez que enchufo el pendrive o el celular se abre una ventana sola"
  tecnico: "Reproducción automática (AutoPlay)"
explicacion:
  sencillo: "La «Reproducción automática» es la ventanita que pregunta qué hacer cuando conectás un pendrive, una tarjeta o el celular. La podés apagar o elegir que haga siempre lo mismo."
  tecnico: "Bluetooth y dispositivos > Reproducción automática: interruptor general y acción predeterminada para unidades extraíbles y tarjetas de memoria."
frases: ["se abre una ventana sola al enchufar el pendrive", "no quiero que me pregunte qué hacer con el celular", "que el pendrive abra la carpeta solo", "desactivar la reproducción automática"]
pasos:
  - texto: "Abrí Reproducción automática (Configuración > Bluetooth y dispositivos > Reproducción automática)."
    abrir: "ms-settings:autoplay"
  - texto: "Si no querés que aparezca nada, apagá el interruptor de Reproducción automática."
  - texto: "Si preferís que haga siempre lo mismo, dejala prendida y elegí qué hacer para «Unidad extraíble» (pendrive) y «Tarjeta de memoria», por ejemplo abrir la carpeta para ver los archivos. Microsoft lo menciona."
    abrir: "https://support.microsoft.com/windows/apps/how-to-install-programs-from-a-disc"
fuentes:
  - https://support.microsoft.com/windows/apps/how-to-install-programs-from-a-disc
madurez: T0
