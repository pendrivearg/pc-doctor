# Pantalla, sonido y personalización: pantalla de bloqueo, protector, Windows destacado, puntero, fuentes, escala, brillo y color, proyección, mezclador, salida rápida, sonido espacial, Bluetooth, micrófono y reproducción automática. Guiadas con fuente oficial.
id: PNS-001
area: basico
titulo:
  sencillo: "Quiero cambiar la foto que aparece cuando la compu está bloqueada"
  tecnico: "Fondo de la pantalla de bloqueo (Imagen, Presentación o Windows destacado)"
explicacion:
  sencillo: "La pantalla de bloqueo es la que ves antes de poner la clave. Le podés poner una foto tuya, varias fotos que vayan pasando o las imágenes que manda Microsoft."
  tecnico: "Configuración > Personalización > Pantalla de bloqueo > Personalizar la pantalla de bloqueo: Windows destacado, Imagen o Presentación (carpetas)."
frases: ["cambiar la foto de la pantalla de bloqueo", "quiero poner una foto de mis nietos cuando prendo la compu", "la imagen que aparece antes de poner la clave", "poner varias fotos en la pantalla de inicio"]
pasos:
  - texto: "Abrí Pantalla de bloqueo (Configuración > Personalización > Pantalla de bloqueo)."
    abrir: "ms-settings:lockscreen"
  - texto: "Donde dice «Personalizar la pantalla de bloqueo», elegí «Imagen» para una sola foto o «Presentación» para que vayan pasando las fotos de una carpeta. Después tocá la foto o agregá la carpeta."
  - texto: "Si querés que la misma foto se vea también donde ponés la clave, dejá activada la opción para mostrar la imagen de la pantalla de bloqueo en la pantalla de inicio de sesión."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/personalization/customize-the-lock-screen-in-windows"
derivar: "Si lo que querés cambiar es la foto del escritorio (la de atrás de los íconos), escribile a PC Doctor «quiero cambiar la foto de fondo de la pantalla»."
fuentes:
  - https://support.microsoft.com/windows/experience/personalization/customize-the-lock-screen-in-windows
madurez: T0
---
id: PNS-002
area: basico
titulo:
  sencillo: "En la pantalla de bloqueo aparecen datos curiosos, noticias o el clima y no los quiero"
  tecnico: "Datos curiosos, sugerencias y widgets de la pantalla de bloqueo"
explicacion:
  sencillo: "Windows puede mostrar en la pantalla de bloqueo frases, datos curiosos y cuadritos con el clima u otras cosas. Si te molestan, se pueden sacar y dejar solo la foto."
  tecnico: "Personalización > Pantalla de bloqueo: desmarcar «datos curiosos, sugerencias, trucos y más» (con Imagen o Presentación) y apagar o quitar Widgets."
frases: ["sacar las noticias de la pantalla de bloqueo", "aparecen frases y datos curiosos cuando bloqueo la compu", "quiero que la pantalla de bloqueo muestre solo la foto", "sacar el clima de la pantalla de bloqueo"]
pasos:
  - texto: "Abrí Pantalla de bloqueo."
    abrir: "ms-settings:lockscreen"
  - texto: "Si tenés puesta «Imagen» o «Presentación», desmarcá la casilla de datos curiosos, sugerencias y trucos que aparece debajo."
  - texto: "Más abajo, en «Widgets», apagá el interruptor para que no aparezca ningún cuadrito. Si querés dejar alguno, tocá los tres puntitos del que no querés y quitalo."
  - texto: "Con «Windows destacado» siempre pueden aparecer sugerencias: si no las querés, cambiá a «Imagen». Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/personalization/customize-the-lock-screen-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/personalization/customize-the-lock-screen-in-windows
  - https://learn.microsoft.com/windows/configuration/windows-spotlight/
madurez: T0
