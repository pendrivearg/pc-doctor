id: PNS-018
area: audio
titulo:
  sencillo: "Quiero pasar el sonido de los parlantes a los auriculares rápido"
  tecnico: "Elegir la salida de sonido desde la configuración rápida de la barra de tareas"
explicacion:
  sencillo: "No hace falta entrar a Configuración cada vez: desde el ícono del parlante, abajo a la derecha, podés elegir en dos toques por dónde sale el sonido."
  tecnico: "Configuración rápida > flecha a la derecha del control de volumen («Seleccionar una salida de sonido»); el elegido queda como predeterminado."
frases: ["cambiar rápido de parlantes a auriculares", "elegir por dónde sale el sonido desde la barra", "pasar el sonido a la tele sin entrar a configuración", "tengo que cambiar la salida de sonido a cada rato"]
pasos:
  - texto: "Abajo a la derecha, tocá el ícono del parlante (el del volumen)."
  - texto: "A la derecha de la barrita del volumen hay una flechita («Seleccionar una salida de sonido»). Tocala y elegí de la lista el aparato por el que querés escuchar."
  - texto: "Con el teclado es más rápido todavía: Windows + Ctrl + V abre directo esa lista de salidas de sonido."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "Si el aparato no aparece en la lista, fijate en Sonido que esté conectado y elegilo en «Salida». Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/audio/fix-sound-or-audio-problems-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/audio/fix-sound-or-audio-problems-in-windows
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
