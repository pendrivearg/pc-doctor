id: PNS-023
area: audio
titulo:
  sencillo: "En las videollamadas me escuchan muy bajito"
  tecnico: "Volumen de entrada del micrófono"
explicacion:
  sencillo: "El micrófono tiene su propio volumen. Si está bajo, los demás te escuchan despacio aunque vos hables fuerte. Se puede probar y subir."
  tecnico: "Sistema > Sonido > Entrada > (micrófono) > Propiedades: Iniciar prueba y control «Volumen de entrada»."
frases: ["me escuchan bajito", "en zoom no me oyen bien", "el micrófono capta muy despacio", "subir el volumen del micrófono"]
pasos:
  - texto: "Abrí Sonido y, en «Entrada», tocá la flechita al lado de tu micrófono para entrar en sus propiedades."
    abrir: "ms-settings:sound"
  - texto: "Subí el «Volumen de entrada»."
  - texto: "Tocá «Iniciar prueba», hablá normal, después «Detener prueba» y escuchá la grabación para ver si mejoró. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/drivers/how-to-set-up-and-test-microphones-in-windows"
derivar: "Si no te escuchan para nada, escribile a PC Doctor «no funciona el micrófono»."
fuentes:
  - https://support.microsoft.com/windows/hardware/drivers/how-to-set-up-and-test-microphones-in-windows
