id: PNS-015
area: windows
titulo:
  sencillo: "Quiero ver en mi compu la pantalla de otra computadora, sin cables"
  tecnico: "Proyectar en este PC (característica opcional Pantalla inalámbrica)"
explicacion:
  sencillo: "Tu compu puede funcionar como una «tele inalámbrica»: otra compu le manda la imagen por Miracast. Para eso hay que agregarle a Windows una función que se llama «Pantalla inalámbrica»."
  tecnico: "Instalar la característica opcional Pantalla inalámbrica, abrir la app y configurar Sistema > Proyectar en este PC como detectable; el otro equipo se conecta con Windows + K."
frases: ["usar mi notebook como pantalla de la otra compu", "proyectar en esta pc", "pasar la imagen de una compu a otra sin cable", "quiero que la otra compu se vea en la mía"]
pasos:
  - texto: "En la compu que va a recibir la imagen, abrí Proyectar en este PC (Configuración > Sistema). Tocá «Características opcionales», después el botón para ver características, buscá «pantalla inalámbrica», marcala y seguí los pasos para instalarla."
    abrir: "ms-settings:project"
  - texto: "Cuando termine, volvé a Proyectar en este PC, elegí cómo querés que se pueda encontrar la compu, y abrí la app «Pantalla inalámbrica» buscándola en la barra de tareas. Tiene que quedar abierta."
  - texto: "Las dos compus tienen que tener el Wi-Fi prendido. En la otra compu, apretá Windows + K y elegí esta. Microsoft lo explica (hace falta Windows 11 22H2 o posterior)."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/screen-mirroring-and-projecting-to-your-pc-or-wireless-display"
derivar: "Si no aparece al apretar Windows + K, escribile a PC Doctor «no aparece la pantalla inalámbrica»."
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/screen-mirroring-and-projecting-to-your-pc-or-wireless-display
  - https://support.microsoft.com/windows/hardware/display-graphics/fix-connections-to-wireless-displays-or-docks-in-windows
madurez: T0
