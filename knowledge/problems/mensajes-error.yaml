id: MSG-011
area: programas
titulo:
  sencillo: "Al instalar un programa sale «Error 1603: error grave durante la instalación»"
  tecnico: "ERROR_INSTALL_FAILURE (1603) de Windows Installer"
explicacion:
  sencillo: "Es un error general del instalador: algo impidió terminar y Windows deshizo la instalación. Una causa común es que el programa ya está instalado (aunque no veas su ícono); otras son instalarlo en una carpeta cifrada o un problema de permisos en el disco."
  tecnico: "Causas (KB 834484): producto ya instalado, carpeta de destino cifrada, unidad sustituta (subst) o cuenta SYSTEM sin Control total sobre la carpeta."
frases: ["error 1603 al instalar", "se produjo un error grave durante la instalación", "el instalador da 1603 y se deshace todo", "fatal error 1603 instalando un programa"]
pasos:
  - texto: "Fijate si el programa ya está instalado: buscalo por su nombre en Aplicaciones instaladas. Si aparece, desinstalalo y después volvé a instalarlo."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si estaba instalado y solo perdiste el ícono, no hace falta reinstalar: apretá la tecla Windows, escribí el nombre, hacé clic derecho sobre el programa y elegí «Anclar a Inicio»."
  - texto: "Si elegiste instalarlo en una carpeta cifrada, elegí otra que no lo esté."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/application-management/msi-installation-error-1603"
derivar: "Si sigue, puede ser un problema de permisos del disco. Microsoft explica la corrección, pero conviene que la haga un técnico."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/application-management/msi-installation-error-1603
  - https://learn.microsoft.com/windows/win32/msi/error-codes
madurez: T0
