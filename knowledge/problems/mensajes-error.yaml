id: MSG-017
area: programas
titulo:
  sencillo: "Dice «No se pudo tener acceso al servicio Windows Installer» (error 1719 o 1601)"
  tecnico: "ERROR_INSTALL_SERVICE_FAILURE (1601) / 1719; 1652 en modo seguro"
explicacion:
  sencillo: "Los instaladores usan un servicio de Windows llamado «Windows Installer», y no lo pudieron usar. También pasa si la compu está en «modo seguro», donde ese servicio no está disponible."
  tecnico: "1601/1719: servicio no accesible o mal registrado. 1652: Windows Installer no está disponible en modo seguro."
frases: ["no se pudo tener acceso al servicio windows installer", "error 1719 al instalar", "no puedo instalar programas en modo seguro", "error 1601 del servicio de instalación"]
pasos:
  - texto: "Si en las esquinas de la pantalla dice «Modo seguro», reiniciá la compu para que arranque normal y probá de nuevo."
    abrir: "https://learn.microsoft.com/windows/win32/msi/error-codes"
  - texto: "Si no estabas en modo seguro, reiniciá igual y volvé a probar."
    abrir: "https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d"
  - texto: "Si sigue, repará los archivos de Windows: «Símbolo del sistema» como administrador, DISM.exe /Online /Cleanup-image /Restorehealth y después sfc /scannow."
    abrir: "https://support.microsoft.com/topic/use-the-system-file-checker-tool-to-repair-missing-or-corrupted-system-files-79aa86cb-ca52-166a-92a3-966e85d4094e"
derivar: "Si no se arregla, consultá con un técnico: Microsoft indica revisar que el servicio esté bien registrado."
fuentes:
  - https://learn.microsoft.com/windows/win32/msi/error-codes
  - https://learn.microsoft.com/windows/win32/msi/windows-installer-error-messages
  - https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d
  - https://support.microsoft.com/topic/use-the-system-file-checker-tool-to-repair-missing-or-corrupted-system-files-79aa86cb-ca52-166a-92a3-966e85d4094e
madurez: T0
