id: MSG-018
area: programas
titulo:
  sencillo: "Dice que no tengo «privilegios suficientes» para instalar para todos los usuarios (error 1925)"
  tecnico: "Error 1925 de Windows Installer: hace falta un administrador"
explicacion:
  sencillo: "El programa se quiere instalar para todos los usuarios de la compu, y eso solo lo puede hacer un usuario administrador."
  tecnico: "«You do not have sufficient privileges to complete this installation for all users of the machine. Log on as administrator and then retry this installation.»"
frases: ["no tiene privilegios suficientes para completar esta instalación", "error 1925 al instalar", "inicie sesión como administrador y vuelva a intentar la instalación", "me dice que necesito privilegios para instalar para todos los usuarios"]
pasos:
  - texto: "Cerrá el instalador. Hacé clic derecho sobre el archivo de instalación, elegí «Ejecutar como administrador» y aceptá el cartel de Windows."
    abrir: "https://learn.microsoft.com/windows/win32/msi/windows-installer-error-messages"
  - texto: "Si el cartel te pide una clave, tu usuario es estándar: pedile a quien administra la compu que la escriba, o que entre con su usuario e instale el programa."
    abrir: "https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/how-it-works"
  - texto: "Si sos el dueño de la compu y querés que tu usuario sea administrador, escribile a PC Doctor «hacer administrador a otro usuario»."
fuentes:
  - https://learn.microsoft.com/windows/win32/msi/windows-installer-error-messages
  - https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/how-it-works
madurez: T0
