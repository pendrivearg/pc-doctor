# Mensajes de error al abrir o instalar programas en Windows: códigos 0xc000007b/0xc0000142/0xc0000005, DLL, Control de cuentas de usuario, Windows Installer (1603, 1618, 2503, 1638...), compatibilidad, .NET, Arm, 16 bits y ventanas perdidas. Guiadas con fuente oficial.
id: MSG-001
area: programas
titulo:
  sencillo: "Al abrir un programa sale «La aplicación no se pudo iniciar correctamente (0xc000007b)»"
  tecnico: "STATUS_INVALID_IMAGE_FORMAT (0xC000007B): archivo inválido o mezcla de 32 y 64 bits"
explicacion:
  sencillo: "Ese código quiere decir que Windows encontró una pieza del programa que no le sirve: puede estar dañada o ser de otro tipo (por ejemplo, una parte hecha para 32 bits mezclada con otra de 64 bits). Microsoft indica volver a instalar el programa desde su instalador original o consultar al fabricante."
  tecnico: "0xC000007B = STATUS_INVALID_IMAGE_FORMAT: el ejecutable o una DLL no es válida para Windows o está dañada. Un proceso de 32 bits no puede cargar DLL de 64 bits ni al revés (WOW64)."
frases: ["me sale 0xc000007b al abrir un juego", "la aplicación no se pudo iniciar correctamente 0xc000007b", "error 0xc000007b haga clic en aceptar para cerrar la aplicación", "no abre el programa y tira el código 0xc000007b"]
pasos:
  - texto: "Primero probá repararlo: en Aplicaciones instaladas, tocá los tres puntos del programa y, si aparece «Modificar» u «Opciones avanzadas», elegí «Reparar». En Panel de control > «Programas y características» también podés hacer clic derecho > «Reparar» o «Cambiar»."
    abrir: "https://support.microsoft.com/windows/repair-apps-and-programs-in-windows-e90eefe4-d0a2-7c1b-dd59-949a9030f317"
  - texto: "Si sigue, desinstalalo (tres puntos > «Desinstalar») y volvé a instalarlo con su instalador original o bajándolo de la página oficial del fabricante."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si la página del programa ofrece versión de 32 bits y de 64 bits, bajá la que corresponde a tu Windows. Para saber cuál tenés, mirá en «Especificaciones del dispositivo» si tu Windows es de 32 o de 64 bits."
    abrir: "ms-settings:about"
  - texto: "Si el programa pide piezas de Microsoft (como «Visual C++»), preguntale al fabricante cuál necesita: Microsoft aconseja seguir sus instrucciones."
derivar: "Si el error aparece con muchos programas distintos, pasá el diagnóstico de PC Doctor."
fuentes:
  - https://learn.microsoft.com/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
  - https://learn.microsoft.com/windows/win32/winprog64/running-32-bit-applications
  - https://support.microsoft.com/windows/repair-apps-and-programs-in-windows-e90eefe4-d0a2-7c1b-dd59-949a9030f317
  - https://support.microsoft.com/windows/which-version-of-windows-operating-system-am-i-running-628bec99-476a-2c13-5296-9dd081cdd808
  - https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist
madurez: T0
