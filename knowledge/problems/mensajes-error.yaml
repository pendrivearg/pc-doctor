id: MSG-019
area: programas
titulo:
  sencillo: "Al desinstalar dice «El origen de instalación de este producto no está disponible»"
  tecnico: "ERROR_INSTALL_SOURCE_ABSENT (1612): falta el instalador original"
explicacion:
  sencillo: "Algunos programas, para desinstalarse o repararse, necesitan el instalador original (el CD, el pendrive o el archivo que usaste para instalarlo). Si ya no está, el desinstalador no puede seguir."
  tecnico: "1612: el origen de instalación del producto no está disponible; verificar que exista y sea accesible."
frases: ["el origen de instalación de este producto no está disponible", "error 1612 al desinstalar", "para desinstalar me pide el cd del programa", "el desinstalador busca un archivo msi que no está"]
pasos:
  - texto: "Si lo instalaste desde un CD, pendrive o disco externo, conectalo y volvé a probar."
    abrir: "https://learn.microsoft.com/windows/win32/msi/error-codes"
  - texto: "Si lo bajaste de Internet, bajá de nuevo el instalador de la página oficial y, cuando Windows te pida el archivo, indicá dónde lo guardaste."
  - texto: "Reiniciá y probá desinstalar desde Aplicaciones instaladas. Si tu compu tiene Windows 10, la guía de Microsoft incluye un solucionador para programas que no se pueden quitar."
    abrir: "https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d"
  - texto: "Si nada sirve, contactá al soporte del fabricante del programa."
fuentes:
  - https://learn.microsoft.com/windows/win32/msi/error-codes
  - https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d
