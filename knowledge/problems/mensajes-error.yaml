id: MSG-023
area: programas
titulo:
  sencillo: "Un programa muy viejo (de 16 bits) no arranca en Windows de 64 bits"
  tecnico: "Aplicaciones de 16 bits no compatibles con Windows de 64 bits"
explicacion:
  sencillo: "Los programas de 16 bits, hechos para versiones muy antiguas de Windows, no pueden funcionar en Windows de 64 bits, y Windows 11 necesita un procesador de 64 bits. No hay ajuste que lo arregle: hace falta una versión más nueva del programa o uno que lo reemplace."
  tecnico: "Windows de 64 bits no ejecuta aplicaciones de 16 bits (ERROR_BAD_EXE_FORMAT). Windows 11 requiere procesador de 64 bits."
frases: ["aplicación de 16 bits no compatible", "programa de 16 bits no anda en windows de 64 bits", "tengo un programa viejísimo de disquete que no abre", "no puedo usar un programa de windows 3.1"]
pasos:
  - texto: "Fijate si tu Windows es de 64 bits: en Información, en «Especificaciones del dispositivo»."
    abrir: "ms-settings:about"
  - texto: "Buscá una versión nueva del programa en la página del fabricante, o un programa actual que haga lo mismo."
    abrir: "https://support.microsoft.com/windows/make-older-apps-or-programs-compatible-with-the-latest-version-of-windows-783d6dd7-b439-bdb0-0490-54eea0f45938"
derivar: "Si necesitás sí o sí ese programa (por ejemplo, para un trabajo o un aparato viejo), consultá con un técnico."
fuentes:
  - https://learn.microsoft.com/windows/win32/winprog64/running-32-bit-applications
  - https://learn.microsoft.com/windows/whats-new/windows-11-requirements
  - https://support.microsoft.com/windows/which-version-of-windows-operating-system-am-i-running-628bec99-476a-2c13-5296-9dd081cdd808
  - https://support.microsoft.com/windows/make-older-apps-or-programs-compatible-with-the-latest-version-of-windows-783d6dd7-b439-bdb0-0490-54eea0f45938
madurez: T0
