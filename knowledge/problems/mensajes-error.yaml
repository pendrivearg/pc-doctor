id: MSG-016
area: programas
titulo:
  sencillo: "Dice «No se pudo abrir este paquete de instalación» (error 1619 o 1620)"
  tecnico: "ERROR_INSTALL_PACKAGE_OPEN_FAILED (1619) / ERROR_INSTALL_PACKAGE_INVALID (1620)"
explicacion:
  sencillo: "Windows no pudo leer el archivo de instalación (.msi): puede que se haya bajado incompleto, que esté en un lugar al que ya no se llega (un pendrive que sacaste) o que no sea un instalador válido."
  tecnico: "Verificar que el paquete exista y sea accesible; si no, consultar al proveedor si es un paquete de Windows Installer válido."
frases: ["no se pudo abrir este paquete de instalación", "error 1619 al abrir un msi", "compruebe que el paquete existe y que puede tener acceso a él", "el archivo msi no abre y dice paquete no válido"]
pasos:
  - texto: "Si el instalador está en un pendrive o disco externo, fijate que siga conectado, o copialo a la compu (por ejemplo, a Descargas) y abrilo desde ahí."
    abrir: "https://learn.microsoft.com/windows/win32/msi/error-codes"
  - texto: "Volvé a bajar el instalador desde la página oficial del programa: puede haberse bajado incompleto."
  - texto: "Si el archivo te lo mandaron por correo o salió de una página que no es la oficial, no insistas: borralo y conseguí el instalador del fabricante."
  - texto: "Si sigue, consultá al soporte del fabricante del programa."
fuentes:
  - https://learn.microsoft.com/windows/win32/msi/error-codes
  - https://learn.microsoft.com/cpp/windows/troubleshoot-vc-redistributable-installation-issues
madurez: T0
