id: MSG-020
area: programas
titulo:
  sencillo: "Quiero que Windows pruebe solo cómo hacer andar un programa viejo"
  tecnico: "Solucionador de problemas de compatibilidad de programas"
explicacion:
  sencillo: "Además de tocar a mano las opciones de compatibilidad, Windows trae un solucionador que prueba ajustes para que un programa viejo funcione. Antes conviene fijarse si hay una versión nueva del programa."
  tecnico: "Configuración > Sistema > Solucionar problemas > Otros solucionadores de problemas > Solucionador de problemas de compatibilidad de programas > Ejecutar."
frases: ["solucionador de compatibilidad de programas", "que windows arregle solo un programa antiguo", "un programa de la época de windows xp no funciona", "asistente de compatibilidad para programas viejos"]
pasos:
  - texto: "Primero fijate si hay una versión más nueva del programa en la página del fabricante o en Microsoft Store."
    abrir: "https://support.microsoft.com/windows/make-older-apps-or-programs-compatible-with-the-latest-version-of-windows-783d6dd7-b439-bdb0-0490-54eea0f45938"
  - texto: "Abrí Solucionar problemas > «Otros solucionadores de problemas», buscá el de compatibilidad de programas y tocá «Ejecutar». Seguí las instrucciones de la pantalla."
    abrir: "ms-settings:troubleshoot"
  - texto: "Si el programa usa un aparato (por ejemplo, una impresora o un escáner), buscá controladores nuevos en Windows Update."
    abrir: "ms-settings:windowsupdate"
derivar: "Para ajustar a mano el modo de compatibilidad, escribile a PC Doctor «esta aplicación no se puede ejecutar en el equipo»."
fuentes:
  - https://support.microsoft.com/windows/make-older-apps-or-programs-compatible-with-the-latest-version-of-windows-783d6dd7-b439-bdb0-0490-54eea0f45938
madurez: T0
