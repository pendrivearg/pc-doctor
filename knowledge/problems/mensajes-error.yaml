id: MSG-010
area: seguridad
titulo:
  sencillo: "Aparece el aviso «No se puede cargar un controlador en este dispositivo»"
  tecnico: "Integridad de memoria bloquea un controlador incompatible"
explicacion:
  sencillo: "La protección «Integridad de memoria» de Windows no dejó arrancar un controlador (driver) de algún aparato o programa porque tiene una falla de seguridad. Lo más probable es que no sea un virus, pero lo que usa ese controlador puede dejar de andar hasta que el fabricante saque una versión corregida."
  tecnico: "Aislamiento del núcleo > Integridad de memoria impide cargar un controlador vulnerable. El nombre del controlador y de la empresa que figuran en la notificación son los únicos datos confiables."
frases: ["me salió no se puede cargar un controlador en este dispositivo", "aviso de que un driver no se pudo cargar por la integridad de memoria", "un controlador quedó bloqueado por seguridad de windows", "desde ese aviso del controlador dejó de andar un aparato"]
pasos:
  - texto: "Anotá el nombre del controlador y de la empresa que muestra el aviso: Microsoft dice que son los únicos datos confiables."
  - texto: "Buscá una versión nueva y compatible de ese controlador en Windows Update o en la página del fabricante."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si no hay versión nueva, escribile al fabricante para preguntarle si va a sacar una corrección."
    abrir: "https://support.microsoft.com/windows/hardware/drivers/a-driver-can-t-load-on-this-device"
derivar: "Microsoft explica que también se puede apagar la integridad de memoria, pero la compu queda menos protegida: no lo hagas por tu cuenta, consultalo con un técnico."
fuentes:
  - https://support.microsoft.com/windows/hardware/drivers/a-driver-can-t-load-on-this-device
madurez: T0
