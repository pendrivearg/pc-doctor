id: MSG-004
area: programas
titulo:
  sencillo: "Dice que falta un archivo «.dll» y el programa no arranca"
  tecnico: "STATUS_DLL_NOT_FOUND (0xC0000135): falta una DLL que el programa necesita"
explicacion:
  sencillo: "Los programas usan piezas llamadas «DLL». Si falta una, Windows muestra su nombre y no abre el programa. El propio mensaje dice cómo se arregla: reinstalando el programa desde su origen oficial. Nunca bajes la DLL suelta de páginas de «descargar DLL»: pueden traer virus."
  tecnico: "0xC0000135 / «This application has failed to start because X.dll was not found. Reinstalling the application might fix this problem». Para componentes de Microsoft, solo instaladores descargados de Microsoft y firmados por Microsoft."
frases: ["falta un archivo dll y no abre el programa", "el programa no puede iniciarse porque falta un .dll en el equipo", "no se encontró el dll reinstalar el programa puede solucionar el problema", "dónde bajo un dll que me falta"]
pasos:
  - texto: "Anotá el nombre exacto del archivo que dice que falta (termina en «.dll»)."
  - texto: "Reinstalá el programa: desinstalalo desde Aplicaciones instaladas y volvé a bajarlo de la página oficial del fabricante."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si el nombre empieza con MSVCP o VCRUNTIME, es una pieza de Microsoft: escribile a PC Doctor «falta msvcp140.dll». Si dice «hostfxr.dll», el programa necesita .NET: escribile «el programa pide instalar .net desktop runtime»."
    abrir: "https://learn.microsoft.com/dotnet/core/install/windows"
  - texto: "No bajes el .dll de otras páginas ni lo copies de otra compu. Microsoft pide instalar sus componentes solo desde sus sitios y firmados por Microsoft."
    abrir: "https://learn.microsoft.com/cpp/windows/troubleshoot-vc-redistributable-installation-issues"
fuentes:
  - https://learn.microsoft.com/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
  - https://learn.microsoft.com/cpp/build/troubleshooting-c-cpp-isolated-applications-and-side-by-side-assemblies
  - https://learn.microsoft.com/cpp/windows/troubleshoot-vc-redistributable-installation-issues
  - https://learn.microsoft.com/dotnet/core/install/windows
madurez: T0
