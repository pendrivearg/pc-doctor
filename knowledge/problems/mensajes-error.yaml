id: MSG-002
area: programas
titulo:
  sencillo: "Word, Excel u otro programa no abre y dice «(0xc0000142)»"
  tecnico: "STATUS_DLL_INIT_FAILED (0xC0000142): falla al inicializar una DLL"
explicacion:
  sencillo: "El programa arranca, pero una de sus piezas internas (una «DLL») no logra ponerse en marcha y Windows lo cierra. Con Office pasa bastante y Microsoft tiene pasos específicos: actualizar, reparar y, si no alcanza, reinstalar."
  tecnico: "0xC0000142 = STATUS_DLL_INIT_FAILED. En Office: actualizar, Reparación en línea, Windows Update, servicio Office Software Protection Platform y, por último, desinstalar con el solucionador y reinstalar."
frases: ["error 0xc0000142 al abrir excel", "word no abre y dice 0xc0000142", "la aplicación no se pudo iniciar correctamente 0xc0000142", "me tira 0xc0000142 cuando abro un programa"]
pasos:
  - texto: "Instalá las actualizaciones pendientes de Windows y reiniciá la compu."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si es Word, Excel, Outlook u otro de Office: hacé clic derecho en Inicio > «Aplicaciones instaladas», buscá Microsoft 365 u Office, tocá los tres puntos > «Modificar» y elegí «Reparación en línea» > «Reparar». Repara todo Office junto."
    abrir: "https://support.microsoft.com/office/error-0xc0000142-when-you-start-an-office-application-64b3a500-ee74-4b66-b370-9d607ef92b6c"
  - texto: "Si es otro programa, probá repararlo desde Aplicaciones instaladas o reinstalalo desde su página oficial."
    abrir: "https://support.microsoft.com/windows/repair-apps-and-programs-in-windows-e90eefe4-d0a2-7c1b-dd59-949a9030f317"
  - texto: "Si Office sigue igual, la misma guía de Microsoft explica cómo desinstalarlo con su herramienta oficial y volver a instalarlo."
derivar: "Si es una compu del trabajo, avisale al área de sistemas: puede que ellos manejen las actualizaciones de Office."
fuentes:
  - https://support.microsoft.com/office/error-0xc0000142-when-you-start-an-office-application-64b3a500-ee74-4b66-b370-9d607ef92b6c
  - https://learn.microsoft.com/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
  - https://support.microsoft.com/windows/repair-apps-and-programs-in-windows-e90eefe4-d0a2-7c1b-dd59-949a9030f317
madurez: T0
