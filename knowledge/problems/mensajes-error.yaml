id: MSG-003
area: programas
titulo:
  sencillo: "Un programa se cierra con «0xc0000005» o «La memoria no se puede read»"
  tecnico: "STATUS_ACCESS_VIOLATION (0xC0000005): infracción de acceso a memoria"
explicacion:
  sencillo: "El programa intentó usar una parte de la memoria que no le correspondía y Windows lo frenó. Casi siempre es una falla del propio programa, que se arregla reparándolo o reinstalándolo. Si les pasa a muchos programas, conviene revisar los archivos de Windows."
  tecnico: "0xC0000005 = STATUS_ACCESS_VIOLATION («La instrucción en 0x… hace referencia a la memoria en 0x…. La memoria no se puede read/written»)."
frases: ["error 0xc0000005 al abrir un programa", "dice la memoria no se puede read", "la instrucción en 0x hace referencia a la memoria y no se puede written", "excepción de infracción de acceso 0xc0000005"]
pasos:
  - texto: "Cerrá el programa y buscá si tiene una versión más nueva en la página del fabricante (o en Microsoft Store, si lo bajaste de ahí)."
    abrir: "https://support.microsoft.com/windows/make-older-apps-or-programs-compatible-with-the-latest-version-of-windows-783d6dd7-b439-bdb0-0490-54eea0f45938"
  - texto: "Probá repararlo desde Aplicaciones instaladas (tres puntos > «Modificar» u «Opciones avanzadas» > «Reparar»). Si no hay opción de reparar, desinstalalo y volvé a instalarlo."
    abrir: "https://support.microsoft.com/windows/repair-apps-and-programs-in-windows-e90eefe4-d0a2-7c1b-dd59-949a9030f317"
  - texto: "Si les pasa a varios programas, repará los archivos de Windows: buscá «cmd», hacé clic derecho en «Símbolo del sistema» > «Ejecutar como administrador», escribí DISM.exe /Online /Cleanup-image /Restorehealth y Enter; cuando termine, escribí sfc /scannow y Enter. No cierres la ventana hasta que llegue al 100 %."
    abrir: "https://support.microsoft.com/topic/use-the-system-file-checker-tool-to-repair-missing-or-corrupted-system-files-79aa86cb-ca52-166a-92a3-966e85d4094e"
derivar: "Si sigue pasando con muchos programas o la compu se cuelga entera, pasá el diagnóstico de PC Doctor."
fuentes:
  - https://learn.microsoft.com/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
  - https://support.microsoft.com/windows/repair-apps-and-programs-in-windows-e90eefe4-d0a2-7c1b-dd59-949a9030f317
  - https://support.microsoft.com/topic/use-the-system-file-checker-tool-to-repair-missing-or-corrupted-system-files-79aa86cb-ca52-166a-92a3-966e85d4094e
  - https://support.microsoft.com/windows/make-older-apps-or-programs-compatible-with-the-latest-version-of-windows-783d6dd7-b439-bdb0-0490-54eea0f45938
