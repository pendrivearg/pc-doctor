id: MSG-015
area: programas
titulo:
  sencillo: "Dice «La directiva del sistema prohíbe esta instalación» (error 1625)"
  tecnico: "ERROR_INSTALL_PACKAGE_REJECTED (1625): instalación bloqueada por directiva"
explicacion:
  sencillo: "La compu tiene una regla puesta por quien la administra (la empresa, la escuela o un técnico) que no deja instalar ese programa. No es una falla: hay que pedirle permiso a quien administra la compu."
  tecnico: "Instalación prohibida por directiva del sistema; contactar al administrador del sistema."
frases: ["la directiva del sistema prohíbe esta instalación", "error 1625 al instalar", "en la compu del trabajo no me deja instalar nada", "póngase en contacto con el administrador del sistema para instalar"]
pasos:
  - texto: "Si es una compu del trabajo o de la escuela, pedile al área de sistemas que te instale el programa o te dé permiso. No intentes saltear el bloqueo."
    abrir: "https://learn.microsoft.com/windows/win32/msi/error-codes"
  - texto: "Si es tu compu personal, consultá con quien te la configuró (por ejemplo, el técnico que la preparó)."
fuentes:
  - https://learn.microsoft.com/windows/win32/msi/error-codes
madurez: T0
