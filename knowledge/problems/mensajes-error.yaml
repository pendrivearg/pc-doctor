id: MSG-022
area: programas
titulo:
  sencillo: "Mi compu tiene procesador Arm (Snapdragon) y un programa o aparato no anda"
  tecnico: "Compatibilidad en Windows en Arm: emulación x86/x64 y controladores Arm64"
explicacion:
  sencillo: "Algunas compus nuevas usan procesadores «Arm» (por ejemplo, Snapdragon). Windows 11 hace andar la mayoría de los programas comunes imitando a una compu tradicional, pero esa imitación no sirve para los controladores (drivers): impresoras y otros aparatos necesitan un controlador hecho para Arm64."
  tecnico: "Windows 11 en Arm emula apps x86 y x64 (Prism desde 24H2). La emulación solo cubre modo usuario: los controladores de modo kernel y de impresión deben ser Arm64 nativos, y un instalador x86/x64 no puede instalar un controlador Arm64."
frases: ["tengo una notebook snapdragon y un programa no anda", "compu con procesador arm no instala el driver de la impresora", "programa incompatible con windows en arm", "en mi compu arm no funciona un aparato"]
pasos:
  - texto: "Fijate qué procesador tenés: en Información, en «Especificaciones del dispositivo», mirá el nombre del procesador (por ejemplo, Snapdragon)."
    abrir: "ms-settings:about"
  - texto: "Buscá en la página del fabricante del programa o del aparato si hay una versión «Arm64» o «para Windows en Arm», y usá esa."
    abrir: "https://learn.microsoft.com/windows/arm/apps-on-arm-x86-emulation"
  - texto: "Para impresoras y otros aparatos, el controlador tiene que ser para Arm64: si el fabricante no lo tiene, ese aparato puede no andar en esta compu."
    abrir: "https://learn.microsoft.com/windows/arm/faq"
  - texto: "Si es un programa común que no usa controladores y no anda, actualizalo o consultale al fabricante."
fuentes:
  - https://learn.microsoft.com/windows/arm/apps-on-arm-x86-emulation
  - https://learn.microsoft.com/windows/arm/faq
  - https://support.microsoft.com/windows/which-version-of-windows-operating-system-am-i-running-628bec99-476a-2c13-5296-9dd081cdd808
madurez: T0
