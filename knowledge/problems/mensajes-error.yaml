id: MSG-005
area: programas
titulo:
  sencillo: "Dice «No se encontró el punto de entrada del procedimiento» en una DLL"
  tecnico: "STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139)"
explicacion:
  sencillo: "El programa buscó una función adentro de una pieza «DLL» y no la encontró. Suele indicar que el programa y esa pieza no son de la misma versión, por ejemplo después de una actualización que quedó a medias."
  tecnico: "0xC0000139 = STATUS_ENTRYPOINT_NOT_FOUND: «The procedure entry point X could not be located in the dynamic link library Y»."
frases: ["no se encontró el punto de entrada del procedimiento", "punto de entrada no encontrado en la biblioteca de vínculos dinámicos", "error de punto de entrada al abrir un programa", "entry point not found en un dll"]
pasos:
  - texto: "Actualizá el programa a su última versión desde la página oficial del fabricante."
  - texto: "Si no alcanza, repáralo o desinstalalo y volvé a instalarlo desde Aplicaciones instaladas."
    abrir: "https://support.microsoft.com/windows/repair-apps-and-programs-in-windows-e90eefe4-d0a2-7c1b-dd59-949a9030f317"
  - texto: "Si el mensaje aparece con varios programas, repará los archivos de Windows: «Símbolo del sistema» como administrador, DISM.exe /Online /Cleanup-image /Restorehealth y después sfc /scannow."
    abrir: "https://support.microsoft.com/topic/use-the-system-file-checker-tool-to-repair-missing-or-corrupted-system-files-79aa86cb-ca52-166a-92a3-966e85d4094e"
derivar: "Si sigue, contactá al soporte del fabricante del programa y pasale el texto exacto del mensaje."
fuentes:
  - https://learn.microsoft.com/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
  - https://support.microsoft.com/windows/repair-apps-and-programs-in-windows-e90eefe4-d0a2-7c1b-dd59-949a9030f317
  - https://support.microsoft.com/topic/use-the-system-file-checker-tool-to-repair-missing-or-corrupted-system-files-79aa86cb-ca52-166a-92a3-966e85d4094e
