id: MSG-006
area: programas
titulo:
  sencillo: "Dice que «su configuración en paralelo es incorrecta» y el programa no abre"
  tecnico: "Error de ensamblados side-by-side (SxS): configuración de la aplicación incorrecta"
explicacion:
  sencillo: "El programa necesita unas piezas compartidas en una versión exacta y Windows no las encuentra. Microsoft dice que reinstalar el programa puede arreglarlo, y es lo primero que hay que probar."
  tecnico: "Falta un ensamblado side-by-side declarado en el manifiesto (WinSxS o privado). Mensajes relacionados: «la configuración de la aplicación es incorrecta», «El sistema no puede ejecutar el programa especificado»."
frases: ["la aplicación no se pudo iniciar porque su configuración en paralelo es incorrecta", "error de configuración en paralelo al abrir un programa", "la configuración de la aplicación es incorrecta reinstalar la aplicación", "me aparece un error que nombra sxstrace.exe"]
pasos:
  - texto: "Desinstalá el programa desde Aplicaciones instaladas y volvé a instalarlo con el instalador de la página oficial."
    abrir: "ms-settings:appsfeatures"
  - texto: "Bajá la versión que corresponde a tu Windows (32 o 64 bits): las piezas de 64 bits no sirven para programas de 32 y al revés."
    abrir: "ms-settings:about"
  - texto: "Muchas veces la pieza que falta es el «Visual C++» de Microsoft: preguntale al fabricante cuál necesita el programa, o escribile a PC Doctor «error de visual c++ al abrir un programa»."
    abrir: "https://learn.microsoft.com/cpp/build/troubleshooting-c-cpp-isolated-applications-and-side-by-side-assemblies"
derivar: "Si no se arregla, contactá al soporte del fabricante del programa."
fuentes:
  - https://learn.microsoft.com/cpp/build/troubleshooting-c-cpp-isolated-applications-and-side-by-side-assemblies
  - https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist
