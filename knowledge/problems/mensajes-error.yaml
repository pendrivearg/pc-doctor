id: MSG-014
area: programas
titulo:
  sencillo: "El instalador dice «Ya está instalada otra versión de este producto» (error 1638)"
  tecnico: "ERROR_PRODUCT_VERSION (1638)"
explicacion:
  sencillo: "Ya tenés instalada otra versión del mismo programa y el instalador no puede poner la otra encima. Hay que quitar la que está y después instalar la que querés."
  tecnico: "Para configurar o quitar la versión existente se usa Agregar o quitar programas (hoy, Aplicaciones instaladas o Programas y características)."
frases: ["ya está instalada otra versión de este producto", "error 1638 al instalar", "no puedo instalar la versión nueva porque está la vieja", "dice que hay otra versión instalada y no sigue"]
pasos:
  - texto: "Abrí Aplicaciones instaladas y buscá el programa por su nombre para ver qué versión tenés."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si querés la otra versión, desinstalá la actual (tres puntos > «Desinstalar») y después abrí de nuevo el instalador."
    abrir: "https://learn.microsoft.com/windows/win32/msi/error-codes"
  - texto: "Si la desinstalación da error, escribile a PC Doctor «no puedo desinstalar un programa»."
fuentes:
  - https://learn.microsoft.com/windows/win32/msi/error-codes
madurez: T0
