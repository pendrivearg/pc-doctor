id: MSG-012
area: programas
titulo:
  sencillo: "El instalador dice «Otra instalación está en curso» (error 1618 o 1500)"
  tecnico: "ERROR_INSTALL_ALREADY_RUNNING (1618) / error 1500 de Windows Installer"
explicacion:
  sencillo: "Windows Installer instala de a un programa por vez. Si hay otra instalación andando, el instalador nuevo no puede arrancar hasta que esa termine."
  tecnico: "Otra instalación tiene tomado el mutex _MSIExecute; hay que completarla antes de seguir."
frases: ["otra instalación está en curso y no me deja instalar", "error 1618 al instalar un programa", "debe completar esa instalación antes de continuar con esta", "error 1500 otra instalación en progreso"]
pasos:
  - texto: "Fijate en la barra de tareas si tenés otro instalador abierto y dejalo terminar."
    abrir: "https://learn.microsoft.com/windows/win32/msi/error-codes"
  - texto: "Si no ves ninguno, esperá unos minutos y volvé a probar."
  - texto: "Si sigue diciendo lo mismo, reiniciá la compu y probá otra vez la instalación antes de abrir otros programas."
    abrir: "https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d"
fuentes:
  - https://learn.microsoft.com/windows/win32/msi/error-codes
  - https://learn.microsoft.com/windows/win32/msi/windows-installer-error-messages
  - https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d
madurez: T0
