id: MSG-013
area: programas
titulo:
  sencillo: "Al instalar o desinstalar sale el error 2503 o 2502"
  tecnico: "Errores internos 2502/2503 de Windows Installer"
explicacion:
  sencillo: "Son errores internos del instalador: Windows Installer se trabó en el medio del proceso. El código no dice qué falló, así que se prueba lo básico: reiniciar, reparar o desinstalar desde Configuración y, si no, consultar al fabricante."
  tecnico: "2502: «Called InstallFinalize when no install in progress». 2503: «Called RunScript when not marked in progress»."
frases: ["el instalador tiró el error 2503", "error interno 2502 al desinstalar", "windows installer error 2503 no me deja instalar", "me aparece el error 2502 y después el 2503"]
pasos:
  - texto: "Reiniciá la compu y probá de nuevo la instalación o la desinstalación."
    abrir: "https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d"
  - texto: "Si estabas desinstalando, hacelo desde Aplicaciones instaladas: tres puntos del programa > «Desinstalar». Si falla, probá antes «Reparar» (en «Modificar» u «Opciones avanzadas», si aparece)."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si tu compu tiene Windows 10, en la guía de Microsoft está el solucionador de problemas de instalación y desinstalación de programas."
  - texto: "Si sigue, contactá al soporte del fabricante del programa."
fuentes:
  - https://learn.microsoft.com/windows/win32/msi/windows-installer-error-messages
  - https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d
  - https://learn.microsoft.com/windows/win32/msi/error-codes
