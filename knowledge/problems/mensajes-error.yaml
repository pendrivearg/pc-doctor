id: MSG-021
area: programas
titulo:
  sencillo: "Un programa pide instalar «.NET» para poder abrir"
  tecnico: ".NET Desktop Runtime (.NET 8, 9 o 10) faltante"
explicacion:
  sencillo: "Algunos programas nuevos están hechos con «.NET» (no es lo mismo que el viejo «.NET Framework» que trae Windows). Si falta, el programa avisa y no abre. Se instala gratis desde la página oficial de Microsoft; para programas de escritorio, la pieza que hace falta es «.NET Desktop Runtime»."
  tecnico: ".NET Desktop Runtime incluye el .NET Runtime; elegir la versión pedida y la arquitectura (x64, x86 o Arm64). Instalación para todo el sistema con permisos de administrador. Error típico: falta hostfxr.dll."
frases: ["el programa pide instalar .net desktop runtime", "to run this application you must install .net", "para ejecutar esta aplicación debe instalar .net", "falta hostfxr.dll"]
pasos:
  - texto: "Anotá qué versión pide el mensaje (por ejemplo «8.0») y si menciona x64, x86 o Arm64."
  - texto: "Entrá a la página oficial de descargas de .NET de Microsoft (está enlazada en esta guía), elegí esa versión y bajá «.NET Desktop Runtime» para Windows. Si no sabés cuál, Microsoft sugiere x64, que es la más común."
    abrir: "https://learn.microsoft.com/dotnet/core/install/windows"
  - texto: "Abrí el archivo bajado (en Descargas), tocá «Instalar» y aceptá el cartel de Windows. Después volvé a abrir el programa."
  - texto: "Si el programa es viejo y pide «.NET Framework 3.5», es otra cosa: escribile a PC Doctor «dice que falta .net framework 3.5»."
fuentes:
  - https://learn.microsoft.com/dotnet/core/install/windows
madurez: T0
