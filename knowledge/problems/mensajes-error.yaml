id: MSG-024
area: programas
titulo:
  sencillo: "Instalé un programa pero no aparece en el menú Inicio"
  tecnico: "Programa instalado sin acceso directo visible: buscar, anclar o verificar la instalación"
explicacion:
  sencillo: "A veces el programa se instaló bien pero no dejó el ícono a la vista, o el ícono se perdió. Se lo puede buscar por su nombre y anclar a Inicio. Si no aparece en ningún lado, puede que la instalación no haya terminado."
  tecnico: "Buscar la app (tecla Windows o Buscar), lista alfabética de Inicio, Anclar a Inicio; verificar en Aplicaciones instaladas."
frases: ["instalé un programa y no lo encuentro en inicio", "no me aparece el ícono del programa que instalé", "se instaló pero no tiene acceso directo", "el programa no figura en la lista de aplicaciones"]
pasos:
  - texto: "Apretá la tecla Windows y escribí el nombre del programa. Si aparece, hacé clic derecho y elegí «Anclar a Inicio»."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/find-your-files-and-apps-in-windows"
  - texto: "También podés mirar la lista de todas las aplicaciones de Inicio, ordenada por letra."
  - texto: "Si no aparece, fijate en Aplicaciones instaladas. Si tampoco está ahí, la instalación no terminó: volvé a abrir el instalador."
    abrir: "ms-settings:appsfeatures"
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/find-your-files-and-apps-in-windows
  - https://learn.microsoft.com/troubleshoot/windows-server/application-management/msi-installation-error-1603
madurez: T0
