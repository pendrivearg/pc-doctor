id: MSG-025
area: programas
titulo:
  sencillo: "Un programa se abre en el otro monitor o fuera de la pantalla"
  tecnico: "Mover la ventana activa entre monitores (Windows + Mayús + flecha)"
explicacion:
  sencillo: "Pasa sobre todo si usaste un segundo monitor o un televisor: el programa está abierto (se ve en la barra de tareas), pero la ventana queda en el otro lado. Con el teclado se la trae de vuelta."
  tecnico: "Windows + Mayús + flecha izquierda/derecha mueve la ventana activa al monitor contiguo; Windows + flecha arriba maximiza; Alt + barra espaciadora abre el menú de la ventana."
frases: ["el programa se abre en el otro monitor", "la ventana se abre fuera de la pantalla y no la veo", "el programa está abierto en la barra pero no se ve la ventana", "cómo paso una ventana al otro monitor"]
pasos:
  - texto: "Tocá el ícono del programa en la barra de tareas para que su ventana quede seleccionada."
  - texto: "Apretá Windows + Mayús + flecha izquierda (o derecha): la ventana pasa al otro monitor. Repetilo hasta que aparezca."
    abrir: "https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"
  - texto: "Cuando la veas, apretá Windows + flecha arriba para agrandarla."
  - texto: "Si tenés un solo monitor y la ventana sigue sin verse, apretá Alt + barra espaciadora: se abre el menú de la ventana, donde podés elegir «Maximizar»."
fuentes:
  - https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec
madurez: T0

