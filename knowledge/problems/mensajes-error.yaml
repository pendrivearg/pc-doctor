id: MSG-009
area: programas
titulo:
  sencillo: "¿Qué es «Ejecutar como administrador» y cuándo lo uso?"
  tecnico: "Elevación manual con UAC; ERROR_ELEVATION_REQUIRED (740)"
explicacion:
  sencillo: "Aunque tu usuario sea administrador, Windows abre los programas con permisos comunes para protegerte. «Ejecutar como administrador» abre ese programa con permisos completos, después de que aceptás el cartel de Windows. Se usa solo cuando hace falta: cuando una guía lo pide o cuando un programa dice «La operación solicitada requiere elevación»."
  tecnico: "Por defecto los procesos usan el token de usuario estándar; usar el token de administrador requiere consentimiento o credenciales. Error 740 = ERROR_ELEVATION_REQUIRED."
frases: ["qué significa ejecutar como administrador", "la operación solicitada requiere elevación", "error 740 al abrir un programa", "cuándo tengo que abrir un programa como administrador"]
pasos:
  - texto: "Hacé clic derecho sobre el programa (en Inicio o en su ícono) y elegí «Ejecutar como administrador». Aparece el cartel del Control de cuentas de usuario: tocá «Sí» si es el programa que querías."
  - texto: "Usalo solo con programas de confianza y solo cuando hace falta: con permisos completos, un programa puede cambiar cosas importantes de Windows."
    abrir: "https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/how-it-works"
  - texto: "Si el cartel te pide una clave en vez de «Sí», tu usuario es estándar: escribile a PC Doctor «para instalar me pide la contraseña del administrador»."
fuentes:
  - https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/how-it-works
  - https://learn.microsoft.com/windows/win32/debug/system-error-codes--500-999-
  - https://support.microsoft.com/topic/use-the-system-file-checker-tool-to-repair-missing-or-corrupted-system-files-79aa86cb-ca52-166a-92a3-966e85d4094e
madurez: T0
