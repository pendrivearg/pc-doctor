id: PPT-023
area: programas
titulo:
  sencillo: "Quiero guardar a alguien en mis contactos de Outlook"
  tecnico: "Agregar un contacto en Outlook (Personas)"
explicacion:
  sencillo: "En Outlook podés guardar el nombre, el teléfono y el correo de una persona para no tener que acordarte la dirección. También podés guardar directamente a alguien que te mandó un correo."
  tecnico: "Nuevo Outlook: Personas > Inicio > Nuevo contacto > Guardar; desde un correo: tarjeta de perfil > Más opciones > Agregar a contactos. Clásico: Personas > Nuevo contacto > Guardar y cerrar."
frases: ["agregar un contacto en outlook", "guardar el correo de alguien en outlook", "agendar a una persona que me mandó un mail en outlook", "dónde están los contactos en outlook"]
pasos:
  - texto: "Abrí «Personas» en la barra del costado de Outlook y tocá «Nuevo contacto»."
  - texto: "Completá lo que tengas: nombre, apellido, teléfono, correo. Tocá «Guardar» (en el Outlook clásico, «Guardar y cerrar»)."
  - texto: "Para guardar a alguien que te escribió: abrí su correo, tocá su nombre, en la tarjeta que aparece tocá el botón de más opciones y elegí agregar a contactos. Completá y guardá."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/people/add-find-edit-or-delete-a-contact-in-outlook"
fuentes:
  - https://support.microsoft.com/en-us/outlook/people/add-find-edit-or-delete-a-contact-in-outlook
madurez: T0
