id: PPT-005
area: programas
titulo:
  sencillo: "Quiero poner un video de YouTube en una diapositiva"
  tecnico: "Insertar un video en línea (YouTube) en PowerPoint"
explicacion:
  sencillo: "Podés meter un video de YouTube dentro de la presentación copiando su dirección. Ojo: el video no queda guardado en el archivo, se ve desde internet, así que al presentar hace falta conexión."
  tecnico: "Insert > Video > Online Video, pegando la URL (Microsoft 365, 2024, 2021, 2019). Se reproduce desde el sitio; sujeto a los Términos de uso del proveedor; no todos los videos permiten insertarse."
frases: ["poner un video de youtube en el powerpoint", "meter un video de internet en la presentación", "cómo pego un link de youtube en una diapositiva", "el video de youtube no me deja ponerlo en power point"]
pasos:
  - texto: "En el navegador, abrí el video de YouTube y copiá la dirección de arriba (la barra de direcciones)."
  - texto: "En PowerPoint, elegí la diapositiva y andá a «Insertar», tocá el botón de video y elegí la opción de video en línea. Pegá la dirección y tocá «Insertar»."
  - texto: "Para que se vea al presentar, la compu tiene que tener internet. Algunos videos no permiten que se los ponga en otro lado: si no deja, es por eso."
  - texto: "El uso del video queda sujeto a las condiciones de YouTube: usá videos que tengas permiso de mostrar. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/powerpoint/training/insert-a-video-from-youtube-or-another-site"
derivar: "Si el video ya está puesto pero no se reproduce, escribile a PC Doctor «el video o la música de PowerPoint no se reproduce»."
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/training/insert-a-video-from-youtube-or-another-site
madurez: T0
