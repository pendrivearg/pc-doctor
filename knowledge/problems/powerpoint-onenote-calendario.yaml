id: PPT-004
area: programas
titulo:
  sencillo: "Quiero poner música de fondo en mi presentación de PowerPoint"
  tecnico: "Audio que se reproduce en segundo plano en varias diapositivas"
explicacion:
  sencillo: "Podés poner una canción que tengas guardada en la compu para que suene sola durante la presentación, aunque vayas pasando de diapositiva."
  tecnico: "Insertar > Audio > Audio en mi PC; pestaña Reproducción > Reproducir en segundo plano. Detener tras N diapositivas: Panel de animación > Efectos > Detener la reproducción > Después de."
frases: ["poner una canción de fondo en el powerpoint", "que la música siga cuando paso de diapositiva", "la música se corta al cambiar de diapositiva", "agregar música a la presentación de fotos"]
pasos:
  - texto: "La canción tiene que estar guardada en la compu (si es de internet, primero hay que bajarla). En la primera diapositiva, andá a «Insertar» > «Audio» > «Audio en mi PC», buscá la canción y tocá «Insertar»."
  - texto: "Tocá el parlantito que apareció en la diapositiva, andá a la pestaña «Reproducción» y elegí «Reproducir en segundo plano». Así arranca sola y sigue sonando al pasar de diapositiva."
  - texto: "Si querés que se corte después de algunas diapositivas: en «Animaciones» abrí el «Panel de animación», hacé doble clic en el audio y, en la pestaña de efectos, en la parte de detener la reproducción, elegí «Después de» y poné cuántas diapositivas."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/office/play-music-across-multiple-slides-in-your-slide-show-in-powerpoint-b01ded6a-28c8-473a-971a-6dfa92cc9367"
derivar: "Si la música no se escucha al presentar, escribile a PC Doctor «el video o la música de PowerPoint no se reproduce»."
fuentes:
  - https://support.microsoft.com/en-us/office/play-music-across-multiple-slides-in-your-slide-show-in-powerpoint-b01ded6a-28c8-473a-971a-6dfa92cc9367
madurez: T0
