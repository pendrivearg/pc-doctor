id: PPT-002
area: programas
titulo:
  sencillo: "Quiero que las diapositivas pasen con un efecto"
  tecnico: "Transiciones entre diapositivas"
explicacion:
  sencillo: "Una «transición» es el efecto que se ve cuando pasás de una diapositiva a la siguiente: que se desvanezca, que se deslice, etc. Se puede poner en una o en todas."
  tecnico: "Pestaña Transiciones: galería de efectos, Opciones de efectos, Duración (grupo Intervalos), Aplicar a todo; «Ninguna» la quita. Una transición por diapositiva."
frases: ["que las diapositivas pasen con efecto", "poner transiciones en power point", "sacar el efecto entre diapositivas", "que todas las diapositivas pasen igual"]
pasos:
  - texto: "Tocá la diapositiva (en la lista de la izquierda) y andá a la pestaña «Transiciones». Elegí un efecto: se ve una muestra al instante."
  - texto: "Con «Opciones de efectos» elegís hacia dónde se mueve. En «Duración» ponés cuántos segundos dura (más número, más lento)."
  - texto: "Si querés el mismo efecto en todas, tocá «Aplicar a todo». Para sacarlo, elegí «Ninguna» en la galería."
  - texto: "Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/en-us/powerpoint/training/add-change-or-remove-transitions-between-slides"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/training/add-change-or-remove-transitions-between-slides
madurez: T0
