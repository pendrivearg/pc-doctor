id: PPT-007
area: programas
titulo:
  sencillo: "Quiero imprimir las diapositivas con mis notas abajo"
  tecnico: "Imprimir páginas de notas en PowerPoint"
explicacion:
  sencillo: "Lo que escribís en el espacio de notas de cada diapositiva se puede imprimir: sale una diapositiva por hoja con tus notas debajo, ideal para tenerlas en la mano al hablar."
  tecnico: "Archivo > Imprimir > Configuración: segundo desplegable (Diseño de impresión) > Páginas de notas."
frases: ["imprimir el powerpoint con las notas", "que salgan mis notas debajo de cada diapositiva", "imprimir lo que escribí abajo de las diapositivas", "cómo imprimo el guion de la presentación"]
pasos:
  - texto: "Andá a «Archivo» > «Imprimir» y elegí tu impresora."
  - texto: "En «Configuración», abrí la segunda lista (la que dice cómo se imprime cada hoja; normalmente muestra «Diapositivas de página completa») y elegí «Páginas de notas»."
  - texto: "Poné cuántas copias querés y tocá «Imprimir». Sale una diapositiva por hoja con sus notas abajo."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/powerpoint/print-your-handouts-notes-or-slides"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/print-your-handouts-notes-or-slides
madurez: T0
