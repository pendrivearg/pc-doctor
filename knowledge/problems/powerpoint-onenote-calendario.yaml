id: PPT-024
area: programas
titulo:
  sencillo: "Tengo mis contactos en un archivo y los quiero pasar a Outlook"
  tecnico: "Importar contactos a Outlook desde un archivo .csv"
explicacion:
  sencillo: "Si tenés tus contactos guardados en un archivo (por ejemplo, uno que bajaste de otro correo o una planilla guardada como .csv), Outlook los puede cargar todos juntos en vez de escribirlos de a uno."
  tecnico: "Nuevo Outlook: Personas > Importar contactos > Examinar > Importar. Outlook.com: Personas > Administrar contactos > Importar contactos. Clásico: Archivo > Abrir y exportar > Importar o exportar > Valores separados por comas. Usar CSV con codificación UTF-8."
frases: ["pasar mis contactos de un archivo a outlook", "importar contactos a outlook", "cargar un archivo csv de contactos", "tengo los contactos en una planilla y los quiero en outlook"]
pasos:
  - texto: "Nuevo Outlook: abrí «Personas» y, arriba, tocá «Importar contactos». En Outlook.com está dentro de «Administrar contactos»."
  - texto: "Tocá «Examinar», buscá el archivo .csv, tocá «Abrir» y después «Importar»."
  - texto: "Outlook clásico: «Archivo» > «Abrir y exportar» > «Importar o exportar», elegí importar desde otro programa o archivo y después la opción de valores separados por comas. Elegí qué hacer con los repetidos, la carpeta «Contactos» y terminá."
  - texto: "Si los nombres salen con letras raras (acentos o eñes mal), cancelá: el archivo tiene que estar guardado con codificación UTF-8. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/people/import-or-export-contacts-in-outlook-using-a-csv-file"
fuentes:
  - https://support.microsoft.com/en-us/outlook/people/import-or-export-contacts-in-outlook-using-a-csv-file
madurez: T0
