id: PPT-021
area: programas
titulo:
  sencillo: "Quiero que mi familia vea mi calendario de Outlook"
  tecnico: "Compartir el calendario en Outlook.com"
explicacion:
  sencillo: "Podés compartir tu calendario de Outlook con otra persona para que vea tus citas, o incluso para que pueda anotar cosas. Y si te arrepentís, se lo podés sacar cuando quieras."
  tecnico: "Outlook.com: Calendar > Share calendar > elegir calendario > correo > permiso Can view all details o Can edit > Share. Quitar: clic derecho en el calendario > Sharing and permissions."
frases: ["compartir mi calendario de outlook con mi esposa", "que otra persona vea mis citas de outlook", "dejar de compartir el calendario", "dar permiso para que anoten en mi calendario"]
pasos:
  - texto: "Abrí el Calendario desde el panel del costado y, arriba, tocá «Compartir calendario». Elegí cuál calendario compartir."
  - texto: "Escribí el nombre o el correo de la persona y elegí el permiso: que pueda ver todos los detalles, o que también pueda editar. Tocá «Compartir»."
  - texto: "Para dejar de compartirlo: en la lista de la izquierda, hacé clic derecho en el calendario, entrá a la opción de uso compartido y permisos, elegí a la persona y tocá el ícono para quitarla."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/share-your-calendar-in-outlook-com"
fuentes:
  - https://support.microsoft.com/en-us/outlook/share-your-calendar-in-outlook-com
madurez: T0
