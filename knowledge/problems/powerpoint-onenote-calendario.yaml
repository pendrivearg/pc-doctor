id: PPT-003
area: programas
titulo:
  sencillo: "Quiero que un texto o una foto aparezca con movimiento en PowerPoint"
  tecnico: "Animaciones de texto u objetos"
explicacion:
  sencillo: "Las «animaciones» hacen que un título, una foto o una lista aparezca, se mueva o desaparezca dentro de la misma diapositiva, por ejemplo cuando hacés clic."
  tecnico: "Pestaña Animaciones: efecto, Opciones de efectos, Inicio (Al hacer clic / Con la anterior / Después de la anterior), Duración, Retraso y Panel de animación."
frases: ["que el texto aparezca de a poco en powerpoint", "animar una foto en la presentación", "que las cosas entren con un clic", "cambiar el orden de las animaciones"]
pasos:
  - texto: "Tocá el texto o la foto que querés animar, andá a la pestaña «Animaciones» y elegí un efecto. Con «Opciones de efectos» elegís la variante."
  - texto: "En «Inicio» elegí cuándo arranca: al hacer clic, junto con la anterior o después de la anterior. «Duración» y «Retraso» cambian la velocidad y la espera."
  - texto: "Para ver todas las animaciones y cambiarlas de orden, tocá «Panel de animación» y arrastralas hacia arriba o hacia abajo."
  - texto: "Microsoft lo explica con ejemplos."
    abrir: "https://support.microsoft.com/en-us/powerpoint/training/animate-text-or-objects"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/training/animate-text-or-objects
madurez: T0
