id: PPT-018
area: programas
titulo:
  sencillo: "Quiero que un evento se repita todas las semanas en el calendario de Outlook"
  tecnico: "Eventos y reuniones periódicas en Outlook"
explicacion:
  sencillo: "Si algo pasa siempre (la clase de los martes, la pastilla de cada mes, un cumpleaños), no hace falta anotarlo una y otra vez: se marca como «repetido» y Outlook lo pone solo en todas las fechas."
  tecnico: "Nuevo Outlook / Outlook.com: Nuevo evento > Periódico (Recurring) > ventana Repetir > Guardar > Guardar/Enviar. Outlook clásico: opción Periodicidad del grupo Opciones."
frases: ["que el evento se repita todas las semanas en outlook", "anotar algo que pasa todos los meses en el calendario", "poner un cumpleaños que se repita cada año en outlook", "reunión de todos los lunes en outlook"]
pasos:
  - texto: "En el calendario tocá «Nuevo evento», poné el título, la fecha y la hora (y los invitados, si hay)."
  - texto: "Tocá la opción para que se repita. En la ventana que aparece elegí cada cuánto (por ejemplo, cada semana o cada mes) y tocá «Guardar»."
  - texto: "Terminá tocando «Enviar» (o el botón de guardar, si no invitaste a nadie). En el Outlook clásico, la misma opción está en la parte de opciones de la cita, con el nombre de periodicidad."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/calendar/schedule-a-meeting-or-event-in-outlook"
fuentes:
  - https://support.microsoft.com/en-us/outlook/calendar/schedule-a-meeting-or-event-in-outlook
  - https://support.microsoft.com/en-us/outlook/create-or-schedule-an-appointment
madurez: T0
