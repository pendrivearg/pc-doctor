id: PPT-006
area: programas
titulo:
  sencillo: "Quiero convertir mi presentación de PowerPoint en un video"
  tecnico: "Exportar una presentación como video (MP4)"
explicacion:
  sencillo: "PowerPoint puede convertir la presentación en un video común (MP4) que se puede ver en otras compus o compartir, sin necesidad de tener PowerPoint."
  tecnico: "File > Export > Create a Video: calidad (4K a 480p), segundos por diapositiva (5 por defecto) o intervalos grabados; tipo MPEG-4 (.mp4) o Windows Media (.wmv). Puede tardar horas."
frases: ["pasar el powerpoint a video", "guardar la presentación como mp4", "hacer un video con las diapositivas para mandar por whatsapp", "convertir las fotos del power point en un video"]
pasos:
  - texto: "Guardá primero la presentación. Después andá a «Archivo» > «Exportar» y elegí la opción para crear un video."
  - texto: "En la primera lista elegí la calidad (Full HD 1080p sirve para casi todo; las más bajas ocupan menos lugar). En la segunda, cuántos segundos se ve cada diapositiva: vienen 5."
  - texto: "Tocá el botón para crear el video, elegí la carpeta y el nombre, y en el tipo de archivo dejá «MPEG-4» (MP4). Tocá «Guardar»."
  - texto: "Abajo, en la barra de estado, ves el avance. Puede tardar bastante (hasta horas si es larga): mientras tanto podés seguir usando PowerPoint. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/powerpoint/turn-your-presentation-into-a-video"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/turn-your-presentation-into-a-video
madurez: T0
