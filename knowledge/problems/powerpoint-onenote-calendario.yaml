id: PPT-019
area: programas
titulo:
  sencillo: "Me llegó una invitación a una reunión por correo y no sé cómo aceptarla"
  tecnico: "Responder a una convocatoria de reunión (RSVP) en Outlook.com / Outlook en la web"
explicacion:
  sencillo: "Cuando alguien te invita a una reunión desde Outlook, te llega un correo especial. Desde ahí avisás si vas, si no vas o si tal vez vas, sin tener que escribir un correo aparte."
  tecnico: "Lista de mensajes > RSVP > Aceptar / Rechazar; Más opciones: Provisional, Responder con nota, Responder sin correo, Proponer nueva hora."
frases: ["cómo acepto una invitación de reunión en outlook", "me invitaron a una reunión por mail y no sé qué apretar", "decir que no voy a una reunión de outlook", "proponer otro horario para la reunión"]
pasos:
  - texto: "En la lista de correos, buscá la invitación y tocá «RSVP» (no hace falta abrirla). Fijate dónde cae en tu calendario."
  - texto: "Tocá «Aceptar» si vas o «Rechazar» si no vas."
  - texto: "Si no estás seguro o querés otro horario, entrá a «Más opciones»: ahí podés responder «Provisional», mandar una nota o proponer una nueva hora."
  - texto: "Microsoft lo explica acá (Outlook.com y Outlook en la web)."
    abrir: "https://support.microsoft.com/en-au/outlook/rsvp-instantly-in-outlook-on-the-web"
fuentes:
  - https://support.microsoft.com/en-au/outlook/rsvp-instantly-in-outlook-on-the-web
madurez: T0
