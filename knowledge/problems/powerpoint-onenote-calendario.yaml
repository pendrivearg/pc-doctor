id: PPT-020
area: programas
titulo:
  sencillo: "Las citas de Outlook aparecen con la hora corrida"
  tecnico: "Zona horaria del calendario de Outlook mal configurada"
explicacion:
  sencillo: "Si todas las reuniones te aparecen una o varias horas antes o después, puede ser que el calendario de Outlook esté en otra zona horaria. Outlook muestra cada reunión en la hora de la zona que tenga configurada, así que hay que elegir la de Argentina (Buenos Aires)."
  tecnico: "Elementos guardados en UTC y mostrados en la zona configurada. Nuevo Outlook: Configuración > Calendario > Vista > Zonas horarias. Clásico: Archivo > Opciones > Calendario > Zonas horarias."
frases: ["las reuniones de outlook aparecen con otra hora", "el calendario de outlook tiene la hora mal", "las citas me salen tres horas corridas", "cambiar la zona horaria del calendario de outlook"]
pasos:
  - texto: "Nuevo Outlook: tocá la ruedita de «Configuración» > «Calendario» > «Vista». En la parte de zonas horarias, abrí la lista para mostrar el calendario en una zona horaria y elegí la de Buenos Aires. Tocá «Guardar»."
  - texto: "Outlook clásico: andá a «Archivo» > «Opciones» > «Calendario». En «Zonas horarias», elegí la de Buenos Aires en la lista de zona horaria."
  - texto: "Volvé al calendario y fijate si las citas ya muestran la hora correcta. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/getstarted/manage-time-zone-settings-in-outlook"
derivar: "Si también la hora del reloj de Windows está mal, escribile a PC Doctor «la hora de la computadora está mal»."
fuentes:
  - https://support.microsoft.com/en-us/outlook/getstarted/manage-time-zone-settings-in-outlook
madurez: T0
