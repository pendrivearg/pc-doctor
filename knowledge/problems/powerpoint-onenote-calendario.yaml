id: PPT-014
area: programas
titulo:
  sencillo: "Anoté algo en OneNote y no lo encuentro"
  tecnico: "Buscar en las notas de OneNote"
explicacion:
  sencillo: "OneNote tiene un buscador que revisa todos tus blocs a la vez: escribís una palabra que te acuerdes y te muestra las páginas donde aparece."
  tecnico: "Cuadro de búsqueda (lupa) a la derecha de las pestañas de sección; Ctrl + E busca en todos los blocs, Ctrl + F solo en la página actual; el alcance se cambia con la flecha junto a la lupa."
frases: ["no encuentro una nota en onenote", "buscar una palabra en todas mis notas", "dónde está el buscador de onenote", "anoté un teléfono en onenote y no sé en qué página"]
pasos:
  - texto: "Apretá Ctrl + E (o tocá la lupa que está a la derecha de las pestañas de las secciones) y escribí una palabra que te acuerdes de la nota."
  - texto: "Te aparecen las páginas donde está esa palabra: tocá una para abrirla. Cuando termines, apretá Esc."
  - texto: "Si no aparece, tocá la flechita al lado de la lupa y elegí la opción de buscar en todos los blocs. Para buscar solo en la página que tenés abierta, usá Ctrl + F."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/search-notes-in-onenote"
fuentes:
  - https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/search-notes-in-onenote
madurez: T0
