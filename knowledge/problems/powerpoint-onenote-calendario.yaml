id: PPT-009
area: programas
titulo:
  sencillo: "Quiero cambiar las diapositivas a formato ancho (16:9) o cuadrado (4:3)"
  tecnico: "Cambiar el tamaño de diapositiva (Estándar 4:3 / Panorámica 16:9)"
explicacion:
  sencillo: "Las diapositivas pueden ser más cuadradas (4:3, como las teles viejas) o más anchas (16:9, como las pantallas de ahora). Se cambia para toda la presentación de una vez."
  tecnico: "Diseño > Personalizar > Tamaño de diapositiva: Estándar (4:3), Panorámica (16:9) o personalizado; al escalar ofrece Maximizar o Asegurar ajuste (Ensure Fit). Aplica a toda la presentación."
frases: ["cambiar las diapositivas a 16:9", "la presentación se ve cuadrada con bordes negros", "pasar el powerpoint a formato ancho", "cambiar el tamaño de las diapositivas"]
pasos:
  - texto: "Andá a la pestaña «Diseño». Bien a la derecha está el botón «Tamaño de diapositiva»."
  - texto: "Elegí «Estándar (4:3)» o «Panorámica (16:9)». Si querés otra medida, usá la opción de tamaño personalizado."
  - texto: "Si PowerPoint te pregunta qué hacer con lo que ya está puesto: «Maximizar» lo agranda (puede quedar algo cortado) y la opción de asegurar el ajuste lo achica para que entre todo. Revisá las diapositivas después."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/powerpoint/change-the-size-of-your-powerpoint-slides"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/change-the-size-of-your-powerpoint-slides
madurez: T0
