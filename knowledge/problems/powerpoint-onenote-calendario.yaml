id: PPT-022
area: programas
titulo:
  sencillo: "Quiero que aparezcan los feriados de Argentina en el calendario de Outlook"
  tecnico: "Agregar los días festivos de un país al calendario de Outlook"
explicacion:
  sencillo: "Outlook puede cargar solo los feriados de tu país en el calendario, así no te agendás nada un día que no se trabaja."
  tecnico: "Nuevo Outlook / Outlook.com: Agregar calendario > Días festivos > país. Clásico: Archivo > Opciones > Calendario > Agregar días festivos (datos 2016-2026 en Microsoft 365/2019/2016); repetirlo duplica los eventos."
frases: ["poner los feriados en el calendario de outlook", "que outlook muestre los feriados de argentina", "agregar los días feriados al calendario", "outlook no tiene los feriados"]
pasos:
  - texto: "Nuevo Outlook u Outlook.com: en el calendario, en el panel que está debajo de la grilla del calendario, tocá «Agregar calendario» y después la opción de feriados (días festivos). Elegí tu país (Argentina)."
  - texto: "Outlook clásico: andá a «Archivo» > «Opciones» > «Calendario» y tocá el botón para agregar días festivos. Marcá tu país y tocá «Aceptar». No lo hagas dos veces, porque se duplican."
  - texto: "En el Outlook clásico, los feriados que trae llegan hasta 2026. Para quitarlos en el nuevo Outlook: clic derecho sobre el calendario de feriados > «Quitar». Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/calendar/add-holidays-to-your-calendar-in-outlook"
fuentes:
  - https://support.microsoft.com/en-us/outlook/calendar/add-holidays-to-your-calendar-in-outlook
madurez: T0
