id: PPT-008
area: programas
titulo:
  sencillo: "Quiero imprimir varias diapositivas en una misma hoja"
  tecnico: "Imprimir documentos (varias diapositivas por página) en PowerPoint"
explicacion:
  sencillo: "Para no gastar tanto papel, PowerPoint puede poner varias diapositivas chiquitas en cada hoja. Hay un modelo de 3 por hoja que trae renglones al costado para que la gente anote."
  tecnico: "Archivo > Imprimir > Configuración > Diseño de impresión > Documentos (p. ej. 3 diapositivas, con líneas para notas); color, escala de grises o blanco y negro puro en el último desplegable."
frases: ["imprimir varias diapositivas por hoja", "poner 6 diapositivas en una hoja", "imprimir el powerpoint para repartir", "imprimir las diapositivas en blanco y negro para ahorrar tinta"]
pasos:
  - texto: "Andá a «Archivo» > «Imprimir» y elegí tu impresora."
  - texto: "En «Configuración», abrí la segunda lista (la que normalmente dice «Diapositivas de página completa») y, en la parte de documentos, elegí cuántas diapositivas por hoja querés. La de 3 trae renglones para anotar."
  - texto: "Para ahorrar tinta, en la última lista de «Configuración» elegí «Escala de grises» en vez de «Color». Después tocá «Imprimir»."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/powerpoint/print-your-handouts-notes-or-slides"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/print-your-handouts-notes-or-slides
madurez: T0
