id: PPT-010
area: programas
titulo:
  sencillo: "Quiero usar una plantilla con diseño ya hecho en PowerPoint"
  tecnico: "Crear una presentación desde una plantilla y aplicarla a diapositivas existentes"
explicacion:
  sencillo: "Una plantilla es una presentación con colores, letras y fondos ya armados. Podés empezar desde una, o pasarle sus diapositivas viejas para que tomen ese diseño."
  tecnico: "Archivo > Nuevo: buscar o elegir plantilla > Crear. Para aplicarla a una presentación existente: copiar las diapositivas y pegarlas en la nueva con Use Destination Theme (opciones de pegado)."
frases: ["usar una plantilla en powerpoint", "dónde consigo diseños para la presentación", "quiero que mi presentación tenga un diseño lindo de fondo", "pasar mis diapositivas a otra plantilla"]
pasos:
  - texto: "Andá a «Archivo» > «Nuevo». Elegí una de las plantillas que aparecen o escribí en el buscador lo que querés (por ejemplo «cumpleaños» o «escuela»)."
  - texto: "Tocá la plantilla para verla y después «Crear». Se abre una presentación nueva con ese diseño."
  - texto: "Si ya tenías diapositivas hechas: abrí tu presentación vieja, seleccioná las diapositivas de la izquierda (Ctrl + A para todas) y copialas con Ctrl + C."
  - texto: "Volvé a la presentación nueva, hacé clic derecho en la columna de la izquierda y, en las opciones de pegado, elegí la de usar el tema de destino: tus diapositivas toman el diseño de la plantilla. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/powerpoint/apply-a-template-to-an-existing-presentation"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/apply-a-template-to-an-existing-presentation
madurez: T0
---
id: PPT-011
area: programas
titulo:
  sencillo: "Quiero pasar el PowerPoint a PDF, con varias diapositivas por hoja o más liviano"
  tecnico: "Exportar a PDF desde PowerPoint con opciones (intervalo, documentos, tamaño mínimo)"
explicacion:
  sencillo: "Además de guardar la presentación como PDF, PowerPoint te deja elegir qué diapositivas van, poner varias por hoja o achicar el archivo para mandarlo por correo."
  tecnico: "Archivo > Exportar > Crear documento PDF/XPS > Publicar. Optimizar para: Estándar o Tamaño mínimo. Opciones: intervalo de diapositivas, Publicar qué (diapositivas, documentos, esquema), diapositivas por página."
frases: ["pasar el powerpoint a pdf con varias diapositivas por hoja", "el pdf de la presentación pesa mucho para mandarlo", "guardar solo algunas diapositivas en pdf", "convertir la presentación a pdf para el profesor"]
pasos:
  - texto: "Andá a «Archivo» > «Exportar» y elegí la opción de crear un documento PDF/XPS. Tocá el botón de crear."
  - texto: "Elegí la carpeta y el nombre. Si lo vas a mandar por correo, marcá la opción de tamaño mínimo; si lo vas a imprimir, dejá la estándar."
  - texto: "Tocá «Opciones...» si querés: elegir solo algunas diapositivas (desde/hasta), cambiar lo que se publica a documentos para poner varias diapositivas por hoja, o incluir las ocultas. Tocá «Aceptar»."
  - texto: "Tocá «Publicar». Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/powerpoint/training/save-powerpoint-presentations-as-pdf-files"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/training/save-powerpoint-presentations-as-pdf-files
madurez: T0
