id: PPT-012
area: programas
titulo:
  sencillo: "Quiero empezar un cuaderno nuevo en OneNote"
  tecnico: "Crear un bloc de notas nuevo en OneNote"
explicacion:
  sencillo: "En OneNote cada «bloc de notas» es como un cuaderno aparte: uno para recetas, otro para la facultad, otro para trámites. Si lo creás en OneDrive lo podés abrir desde cualquier compu o celular con internet, y nadie más lo ve salvo que lo compartas."
  tecnico: "OneNote para Windows: Archivo > Nuevo, elegir ubicación (OneDrive o Este PC). Se crea con una sección y una página en blanco."
frases: ["crear un cuaderno nuevo en onenote", "armar otro bloc de notas en onenote", "quiero separar mis notas en cuadernos distintos", "dónde se guarda el bloc nuevo de onenote"]
pasos:
  - texto: "En OneNote, andá a «Archivo» > «Nuevo»."
  - texto: "Elegí dónde guardarlo. Conviene OneDrive: así lo ves también en el celular o en otra compu. Ponele un nombre y seguí los pasos que aparecen."
  - texto: "El bloc nuevo aparece en tu lista de blocs y ya trae una sección con una página en blanco para empezar a escribir."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/create-a-new-notebook"
fuentes:
  - https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/create-a-new-notebook
madurez: T0
---
id: PPT-013
area: programas
titulo:
  sencillo: "No entiendo las secciones y páginas de OneNote: quiero agregar una"
  tecnico: "Agregar secciones y páginas en OneNote"
explicacion:
  sencillo: "OneNote se ordena como una carpeta escolar: el bloc es el cuaderno, las «secciones» son las pestañas de colores (por tema) y adentro de cada sección van las «páginas», que son las hojas donde escribís."
  tecnico: "Nueva sección: clic derecho en la lista de secciones o botón al pie de la lista. Agregar página: botón en la lista de páginas; el título se escribe en el encabezado de la página. Las páginas se reordenan arrastrando."
frases: ["agregar una pestaña nueva en onenote", "cómo hago una hoja nueva en onenote", "para qué sirven las secciones de onenote", "ordenar las páginas de onenote"]
pasos:
  - texto: "Para una sección nueva (un tema nuevo): hacé clic derecho en la lista de secciones y elegí «Nueva sección», o usá el botón al pie de esa lista. Escribí el nombre y apretá Enter. Ya trae una página en blanco."
  - texto: "Para una página nueva dentro de la sección: tocá «Agregar página». Arriba de la página, en la línea del título, escribí el nombre y apretá Enter."
  - texto: "Para cambiar el orden, arrastrá la página en la lista hasta donde la quieras."
  - texto: "Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-US/OneNote/onenote-help-and-learning/basic-tasks-in-onenote-on-windows"
fuentes:
  - https://support.microsoft.com/en-US/OneNote/onenote-help-and-learning/basic-tasks-in-onenote-on-windows
madurez: T0
