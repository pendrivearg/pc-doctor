id: PPT-016
area: programas
titulo:
  sencillo: "Quiero anotar un turno o una cita en el calendario de Outlook"
  tecnico: "Crear una cita en el calendario de Outlook (clásico)"
explicacion:
  sencillo: "Una «cita» es algo que anotás solo para vos en el calendario, como el turno del médico. Outlook te avisa un rato antes (de entrada, 15 minutos)."
  tecnico: "Outlook clásico: Calendario > Nueva cita (Ctrl + N; Ctrl + Mayús + A desde otra carpeta): Asunto, Ubicación, inicio y fin; Aviso en el grupo Opciones; Guardar y cerrar. Agregar asistentes la convierte en reunión."
frases: ["anotar un turno en el calendario de outlook", "agendar el médico en outlook", "cómo pongo una cita en outlook", "que outlook me avise antes del turno"]
pasos:
  - texto: "En Outlook, andá al Calendario y tocá «Nueva cita» (o apretá Ctrl + N). Desde el correo también podés apretar Ctrl + Mayús + A."
  - texto: "Escribí de qué se trata (el asunto), el lugar, y la hora de inicio y de fin. Si necesitás una hora exacta, hacé clic en el horario y escribila."
  - texto: "Outlook te avisa 15 minutos antes. Para cambiarlo, usá la lista del aviso (recordatorio) en la parte de opciones; «Ninguno» lo apaga. Después tocá «Guardar y cerrar»."
  - texto: "Si en vez de algo tuyo querés invitar a otras personas, eso es una reunión. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/create-or-schedule-an-appointment"
fuentes:
  - https://support.microsoft.com/en-us/outlook/create-or-schedule-an-appointment
madurez: T0
