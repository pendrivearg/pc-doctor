id: PPT-017
area: programas
titulo:
  sencillo: "Quiero invitar a otras personas a una reunión desde el calendario de Outlook"
  tecnico: "Programar una reunión con asistentes en el nuevo Outlook u Outlook.com"
explicacion:
  sencillo: "Desde el calendario de Outlook podés armar una reunión y mandarle la invitación por correo a cada persona. A ellos les llega y la pueden aceptar; si querés, se le agrega un enlace de Teams para hacerla por videollamada."
  tecnico: "Nuevo Outlook / Outlook.com: Calendario > Nuevo evento > título > Invitar asistentes (Asistente para programación) > fecha y hora > ubicación > interruptor de reunión de Teams > Enviar."
frases: ["mandar una invitación de reunión por outlook", "invitar gente a una reunión en el calendario", "armar una reunión en outlook con varias personas", "agendar una reunión y que les llegue a todos"]
pasos:
  - texto: "En el calendario de Outlook tocá «Nuevo evento» y escribí un título."
  - texto: "En la parte de invitar asistentes, escribí el nombre o el correo de cada persona y elegila de las sugerencias."
  - texto: "Elegí la fecha y la hora de inicio y de fin, y poné el lugar. Si va a ser por videollamada, dejá prendido el interruptor de reunión de Teams; si es en persona, apagalo."
  - texto: "Tocá «Enviar»: a cada invitado le llega la invitación por correo. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/calendar/schedule-a-meeting-or-event-in-outlook"
derivar: "Si la reunión es por Teams y no sabés cómo entrar, escribile a PC Doctor «me mandaron una reunión de Teams y no sé cómo entrar»."
fuentes:
  - https://support.microsoft.com/en-us/outlook/calendar/schedule-a-meeting-or-event-in-outlook
madurez: T0
