# PowerPoint (Diseñador, transiciones, animaciones, música, video, exportar, imprimir, tamaño, plantillas), OneNote (blocs, secciones, búsqueda, compartir), calendario y contactos de Outlook. Guiadas con fuente oficial.
id: PPT-001
area: programas
titulo:
  sencillo: "Quiero que PowerPoint me sugiera un diseño lindo para la diapositiva"
  tecnico: "Diseñador de PowerPoint (Sugerencias de diseño)"
explicacion:
  sencillo: "PowerPoint tiene un ayudante, el «Diseñador», que mira lo que pusiste en la diapositiva (título, fotos) y te propone varias formas prolijas de acomodarlo. Elegís la que te guste y listo."
  tecnico: "Designer / Design Suggestions (pestaña Diseño): requiere Microsoft 365, conexión a internet, experiencias conectadas opcionales activadas y un tema integrado."
frases: ["que powerpoint me arme el diseño de la diapositiva", "dónde está el diseñador de powerpoint", "ideas de diseño para mi presentación", "no me aparecen las sugerencias de diseño en powerpoint"]
pasos:
  - texto: "Abrí la presentación, andá a la pestaña «Diseño» y tocá el botón de sugerencias de diseño («Diseñador»). La primera vez puede pedirte permiso: aceptalo."
  - texto: "A la derecha aparece un panel con ideas. Tocá la que te guste y la diapositiva cambia. Si no te convence, apretá Ctrl + Z para deshacer."
  - texto: "Si no aparecen ideas: revisá que tengas internet, usá uno de los temas que trae PowerPoint, y no pongas más de cuatro fotos ni cuadros de texto de más en esa diapositiva. Además, es una función de Microsoft 365 (suscripción)."
  - texto: "Si sigue sin ideas, en «Archivo» > «Cuenta», en la parte de privacidad de la cuenta, entrá a administrar la configuración y activá las experiencias conectadas opcionales. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/powerpoint/create-professional-slide-layouts-with-designer"
fuentes:
  - https://support.microsoft.com/en-us/powerpoint/create-professional-slide-layouts-with-designer
madurez: T0
