id: PPT-015
area: programas
titulo:
  sencillo: "Quiero compartir mi bloc de OneNote con otra persona"
  tecnico: "Compartir un bloc de notas de OneNote (invitar o enlace)"
explicacion:
  sencillo: "Podés invitar a alguien a ver o a escribir en tu bloc de OneNote, por ejemplo para armar la lista del viaje en familia. Para eso el bloc tiene que estar guardado en OneDrive."
  tecnico: "Requiere bloc en OneDrive o SharePoint. Share > Share Entire Notebook: invitar por correo con permiso de edición o de lectura; o copiar un vínculo (cualquiera que lo tenga ve todo el bloc)."
frases: ["compartir el onenote con mi familia", "que otra persona pueda escribir en mi bloc de notas", "mandar el link del bloc de onenote", "onenote dice que suba el bloc para compartirlo"]
pasos:
  - texto: "El bloc tiene que estar en OneDrive. Si te aparece un aviso pidiendo subir el bloc para compartirlo, elegí la cuenta y seguí los pasos."
  - texto: "Arriba a la derecha tocá «Compartir» y elegí compartir todo el bloc. Escribí el correo de la persona."
  - texto: "Al lado del nombre elegí si puede editar o solo ver. Si querés, agregá un mensaje y tocá «Enviar»: le llega un correo con la invitación."
  - texto: "También podés copiar un vínculo, pero ojo: cualquiera que lo reciba (aunque se lo reenvíen) puede ver todo el bloc. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/how-to-share-a-onenote-notebook"
fuentes:
  - https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/how-to-share-a-onenote-notebook
madurez: T0
