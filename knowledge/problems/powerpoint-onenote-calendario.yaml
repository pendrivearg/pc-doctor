id: PPT-025
area: programas
titulo:
  sencillo: "Quiero armar un grupo de contactos en Outlook para escribirles a todos juntos"
  tecnico: "Crear una lista de contactos (grupo de contactos) en Outlook"
explicacion:
  sencillo: "Una «lista de contactos» junta varias direcciones bajo un solo nombre, por ejemplo «Familia» o «Consorcio». Así, para mandarles un correo a todos, ponés solo ese nombre en vez de escribir cada dirección."
  tecnico: "Nuevo Outlook / Outlook.com: Personas > flecha junto a Nuevo contacto > Nueva lista de contactos > nombre y destinatarios > Crear. Clásico: Personas > Nuevo grupo de contactos > Agregar miembros > Guardar y cerrar."
frases: ["armar un grupo de contactos en outlook", "crear una lista para mandar el mismo mail a varios", "lista de distribución en outlook", "agregar a alguien al grupo de contactos de outlook"]
pasos:
  - texto: "Nuevo Outlook u Outlook.com: abrí «Personas», tocá la flechita al lado de «Nuevo contacto» y elegí la opción de nueva lista de contactos."
  - texto: "Ponele un nombre a la lista y agregá las personas escribiendo su nombre o su correo. Tocá «Crear»."
  - texto: "Outlook clásico: en «Personas», tocá «Nuevo grupo de contactos», poné el nombre, usá el botón para agregar miembros y al final «Guardar y cerrar»."
  - texto: "Para sumar a alguien después, en las listas de contactos pasá el mouse sobre la lista, tocá el lapicito para editar, agregá la persona y guardá. Microsoft lo explica acá."
    abrir: "https://support.microsoft.com/en-us/outlook/people/create-edit-or-delete-a-contact-list-or-contact-group-in-outlook"
fuentes:
  - https://support.microsoft.com/en-us/outlook/people/create-edit-or-delete-a-contact-list-or-contact-group-in-outlook
madurez: T0
