id: WUE-004
area: windows
titulo:
  sencillo: "Windows Update da el error 0x8024402f"
  tecnico: "0x8024402F (WU_E_PT_ECP_SUCCEEDED_WITH_ERRORS)"
explicacion:
  sencillo: "Windows no pudo procesar bien lo que descargó para actualizarse. Microsoft señala como causa típica un programa que filtra páginas web y que se mete en el medio de las descargas de Windows Update."
  tecnico: "El procesamiento del archivo .cab externo terminó con errores. Microsoft lo asocia a software de filtrado web (por ejemplo Lightspeed Rocket): agregar el equipo a la lista de excepciones del filtro."
frases: ["windows update error 0x8024402f", "me sale 0x8024402f cuando busco actualizaciones", "no puedo actualizar windows 0x8024402f", "código de error 0x8024402f"]
pasos:
  - texto: "Comprobá que tengas Internet abriendo cualquier página."
    abrir: "ms-settings:network-status"
  - texto: "Si en esta computadora hay un programa que filtra o bloquea páginas web, pedile a quien lo administra que agregue esta computadora a sus excepciones. Después volvé a buscar actualizaciones."
    abrir: "ms-settings:windowsupdate"
  - texto: "Usá el solucionador de Windows Update (Windows 11: Configuración > Sistema > Solucionar problemas > «Otros solucionadores de problemas» > Windows Update; Windows 10: Configuración > Actualización y seguridad > Solucionar problemas)."
    abrir: "https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c"
  - texto: "Microsoft explica este código en su lista de errores comunes (en inglés, para técnicos)."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/installing-updates-features-roles/common-windows-update-errors"
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/installing-updates-features-roles/common-windows-update-errors
  - https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c
