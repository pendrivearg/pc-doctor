    abrir: "ms-settings:network-vpn"
  - texto: "Liberá espacio en el disco de Windows: al menos 20 GB libres en Windows de 64 bits (16 GB en 32 bits)."
    abrir: "ms-settings:storagesense"
  - texto: "Volvé a buscar actualizaciones."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si sigue, Microsoft explica que puede faltar lugar en la partición «Reservada para el sistema». Agrandarla requiere programas especiales y se puede perder información si sale mal: conviene que lo haga un técnico."
    abrir: "https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a"
fuentes:
