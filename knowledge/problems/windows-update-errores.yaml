    abrir: "ms-settings:windowsupdate"
  - texto: "Microsoft recomienda no forzar la instalación a mano mientras dure esa espera: así protege a tu equipo de un problema conocido. Cuando se libera, Windows Update la ofrece solo."
    abrir: "https://learn.microsoft.com/windows/deployment/update/safeguard-holds"
  - texto: "Seguí instalando las actualizaciones mensuales mientras tanto."
    abrir: "ms-settings:windowsupdate"
  - texto: "Los problemas conocidos de cada versión están publicados en la página de estado de Windows de Microsoft (en inglés)."
    abrir: "https://learn.microsoft.com/windows/release-health/"
fuentes:
