  tecnico: "Requisitos mínimos de Windows 11 no cumplidos (TPM 2.0, Arranque seguro, procesador); 0xC1900200 - 0x20008"
explicacion:
  sencillo: "Windows 11 pide un mínimo de equipo: procesador compatible de 64 bits, 4 GB de memoria, 64 GB de disco, un chip de seguridad llamado TPM 2.0 y el «Arranque seguro». Si falta algo, no se puede instalar. A veces el equipo lo tiene y solo hay que activarlo."
  tecnico: "Requisitos: CPU de 64 bits compatible de 1 GHz y 2 núcleos, 4 GB de RAM, 64 GB, UEFI con Arranque seguro, TPM 2.0, DirectX 12 con WDDM 2.0, pantalla 720p de más de 9 pulgadas. Desde Windows 10 2004 o posterior. Verificación con PC Health Check."
frases: ["esta pc no puede ejecutar windows 11", "mi compu no es compatible con windows 11", "no me deja pasar a windows 11", "error 0xc1900200 al instalar windows 11", "dice que mi procesador no sirve para windows 11"]
pasos:
