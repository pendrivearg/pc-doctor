id: WUE-011
area: windows
titulo:
  sencillo: "La actualización falla con 0x80070070: falta espacio"
  tecnico: "0x80070070 (- 0x50011, 0x50012, 0x60000): espacio en disco insuficiente"
explicacion:
  sencillo: "El disco no tiene lugar suficiente para instalar la actualización. Hay que liberar espacio y volver a intentar."
  tecnico: "Espacio libre insuficiente para la instalación: se requieren 16 GB (32 bits) o 20 GB (64 bits). Alternativa: unidad USB externa de al menos 8 GB (se recomiendan 16 GB) formateada en NTFS."
frases: ["windows update error 0x80070070", "0x80070070 sin espacio", "dice que no hay espacio suficiente para la actualización", "0x80070070 0x50011 no se actualiza"]
pasos:
  - texto: "Mirá cuánto lugar te queda: abrí el Explorador de archivos (Windows + E) > «Este equipo». El disco de Windows es el que tiene el logo de Windows."
  - texto: "Liberá espacio desde Almacenamiento (archivos temporales, Papelera, descargas viejas) hasta tener al menos 20 GB libres (16 GB si tu Windows es de 32 bits)."
