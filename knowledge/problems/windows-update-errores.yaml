  tecnico: "«No se pudieron completar las actualizaciones. Deshaciendo cambios»"
explicacion:
  sencillo: "Windows intentó instalar la actualización, falló y la sacó para dejar todo como estaba. Ese mensaje no dice por qué: el motivo está en el código de error que queda guardado en el historial de actualizaciones."
  tecnico: "Mensaje genérico para cualquier actualización fallida («We couldn't complete the updates. Undoing changes» / «Failure configuring Windows Updates. Reverting changes»). El código específico figura en el Historial de actualizaciones."
