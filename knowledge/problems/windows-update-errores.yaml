  - texto: "Microsoft explica este mensaje junto con los demás errores de instalación."
    abrir: "https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a"
