area: windows
titulo:
  sencillo: "No me aparece la versión nueva de Windows"
  tecnico: "Actualización de características no ofrecida: retención de protección (safeguard hold)"
explicacion:
  sencillo: "Microsoft entrega la versión nueva de a poco y a veces la frena a propósito en algunas computadoras porque detectó un problema con un programa o una pieza de ese equipo. En Windows Update aparece un aviso de que la actualización está en camino. Cuando el problema se arregla, aparece sola."
  tecnico: "Safeguard hold: Windows Update no ofrece la nueva versión a dispositivos con un problema conocido hasta validar la corrección. Distribución gradual (intelligent rollout). Problemas conocidos en Windows release health."
frases: ["no me aparece la actualización de windows 11 25h2", "la actualización de características no aparece", "windows update dice que la actualización está en camino", "a mis conocidos les llegó la versión nueva y a mí no"]
