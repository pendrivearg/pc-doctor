    abrir: "https://www.microsoft.com/windows/windows-11-specifications"
  - texto: "Compará tu equipo con la lista oficial de requisitos."
    abrir: "https://learn.microsoft.com/windows/whats-new/windows-11-requirements"
  - texto: "Si lo que falta es el TPM 2.0 o el Arranque seguro, muchas computadoras los tienen y solo hay que activarlos. Escribile a PC Doctor «el arranque seguro está desactivado» o consultá al fabricante."
  - texto: "Si el procesador no es compatible, Microsoft sugiere considerar una computadora nueva. Si seguís con Windows 10, escribile a PC Doctor «windows 10 ya no recibe actualizaciones»."
    abrir: "https://www.microsoft.com/windows/windows-11-specifications"
fuentes:
