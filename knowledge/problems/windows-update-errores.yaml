    abrir: "ms-settings:windowsupdate"
  - texto: "Si quedó en 0 % o en 100 %, reiniciá la computadora para que ningún programa la bloquee."
  - texto: "Revisá la conexión y volvé a conectar el Wi-Fi o el cable si hace falta."
    abrir: "ms-settings:network-status"
  - texto: "Fijate que haya lugar: al menos 20 GB libres en Windows de 64 bits (16 GB en 32 bits)."
    abrir: "ms-settings:storagesense"
  - texto: "Si sigue igual, usá el solucionador de Windows Update (Windows 11: Configuración > Sistema > Solucionar problemas > «Otros solucionadores de problemas» > Windows Update)."
    abrir: "https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c"
fuentes:
