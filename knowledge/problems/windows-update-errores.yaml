  - texto: "Escribile ese código a PC Doctor (por ejemplo «windows update error 0x800f0922»): hay una guía para los más comunes."
  - texto: "Mientras tanto, probá lo básico que recomienda Microsoft: reiniciar, usar el solucionador de Windows Update y tener al menos 20 GB libres."
