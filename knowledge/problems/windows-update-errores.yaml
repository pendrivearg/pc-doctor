id: WUE-010
area: windows
titulo:
  sencillo: "El paso a la versión nueva de Windows falla con 0xC1900101"
  tecnico: "0xC1900101: reversión genérica, casi siempre por un controlador incompatible"
explicacion:
  sencillo: "Windows intentó pasar a una versión nueva, algo falló y volvió a la anterior. Ese código casi siempre apunta a un controlador (el programita que maneja una pieza, como la placa de video o la de red) que no es compatible."
  tecnico: "Código de reversión genérico que suele indicar un controlador incompatible (variantes 0x2000c, 0x20017, 0x30018, 0x3000D, 0x4000D, 0x40017). Quitar periféricos, actualizar o desinstalar controladores, quitar antivirus de terceros, arranque limpio."
frases: ["error 0xc1900101 al actualizar windows", "la actualización de windows 11 falla con 0xc1900101", "0xc1900101 0x4000d", "no puedo pasar a la versión nueva da 0xc1900101", "0xc1900101 y se vuelve atrás la actualización"]
pasos:
  - texto: "Desenchufá todo lo que no haga falta: impresoras, pendrives, discos externos, auriculares, parlantes. Dejá solo mouse, teclado y pantalla. Si la notebook está en una base (dock), sacala."
    abrir: "https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a"
  - texto: "Dejá lugar libre: al menos 20 GB en Windows de 64 bits (16 GB en 32 bits)."
    abrir: "ms-settings:storagesense"
  - texto: "Hacé clic derecho en Inicio > «Administrador de dispositivos» y buscá aparatos con un signo de exclamación amarillo: actualizá o desinstalá ese controlador. Los de video y de red bajalos de la página del fabricante."
  - texto: "Si tenés un antivirus de otra marca, desinstalalo mientras dura la actualización (Windows queda protegido con su propio antivirus). Tené a mano la clave para reinstalarlo después."
  - texto: "Si sigue, Microsoft recomienda un «arranque limpio» (Windows con lo mínimo) antes de volver a intentar. Si no te animás, pedí ayuda a un técnico."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/windows-10-upgrade-resolution-procedures"
fuentes:
  - https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a
  - https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/windows-10-upgrade-resolution-procedures
  - https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c
