id: WUE-002
area: windows
titulo:
  sencillo: "Windows Update da el error 0x800f081f"
  tecnico: "0x800F081F (CBS_E_SOURCE_MISSING): almacén de componentes dañado"
explicacion:
  sencillo: "Windows guarda una «reserva» de sus propias piezas para poder instalar actualizaciones. Este error dice que a esa reserva le falta algo. Windows trae dos herramientas oficiales que la revisan y la reparan."
  tecnico: "CBS_E_SOURCE_MISSING: no se encontró el origen del paquete o archivo (corrupción del almacén de componentes). DISM /RestoreHealth y sfc /scannow; si persiste, actualización en el lugar con la imagen de Windows."
frases: ["error 0x800f081f windows update", "me tira 0x800f081f al instalar la actualización", "la actualización falla con 0x800f081f", "código 0x800f081f y no se actualiza windows"]
pasos:
  - texto: "Primero usá el solucionador de Windows Update. En Windows 11: Configuración > Sistema > Solucionar problemas > «Otros solucionadores de problemas» > Windows Update > «Ejecutar». En Windows 10: Configuración > Actualización y seguridad > Solucionar problemas > «Solucionadores de problemas adicionales» > Windows Update."
    abrir: "https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c"
  - texto: "Si sigue, abrí la terminal como administrador: escribí «cmd» en el buscador de Inicio, hacé clic derecho en «Símbolo del sistema» > «Ejecutar como administrador» y aceptá. Escribí DISM.exe /Online /Cleanup-image /Restorehealth y apretá Enter (tarda varios minutos y necesita Internet). Cuando termine, escribí sfc /scannow y Enter."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/installing-updates-features-roles/fix-windows-update-errors"
  - texto: "Reiniciá la computadora y volvé a buscar actualizaciones."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si todavía falla, Microsoft sugiere reinstalar Windows encima con su herramienta oficial de descarga. Antes, hacé una copia de seguridad de tus archivos por las dudas."
    abrir: "https://www.microsoft.com/software-download/windows11"
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/installing-updates-features-roles/common-windows-update-errors
  - https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c
  - https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a
  - https://learn.microsoft.com/troubleshoot/windows-server/installing-updates-features-roles/fix-windows-update-errors
  - https://www.microsoft.com/software-download/windows11
