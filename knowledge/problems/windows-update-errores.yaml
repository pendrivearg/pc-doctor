id: WUE-006
area: windows
titulo:
  sencillo: "Windows Update da el error 0x80070422"
  tecnico: "0x80070422 (ERROR_SERVICE_DISABLED)"
explicacion:
  sencillo: "El servicio de Windows Update está apagado o deshabilitado, así que Windows no puede buscar ni instalar nada. Se vuelve a prender desde la lista de Servicios."
  tecnico: "El servicio Windows Update está detenido o deshabilitado. Microsoft indica poner el Tipo de inicio en Automático e iniciarlo desde services.msc."
