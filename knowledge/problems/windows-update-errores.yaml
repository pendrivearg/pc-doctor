id: WUE-003
area: windows
titulo:
  sencillo: "Windows Update da el error 0x80073712"
  tecnico: "0x80073712 (ERROR_SXS_COMPONENT_STORE_CORRUPT)"
explicacion:
  sencillo: "Significa que un archivo que Windows Update necesita está dañado o falta. La reparación oficial se hace con la herramienta DISM, que baja de Microsoft las piezas sanas para reemplazar las rotas."
  tecnico: "El almacén de componentes está en un estado incoherente. DISM.exe /Online /Cleanup-image /Restorehealth (usa Windows Update como origen de reparación) y luego sfc /scannow."
frases: ["windows update error 0x80073712", "0x80073712 no me deja actualizar", "me aparece el código 0x80073712", "falla la actualización con 0x80073712"]
pasos:
  - texto: "Conectá la computadora a Internet: DISM descarga de Windows Update los archivos que usa para reparar."
    abrir: "ms-settings:network-status"
  - texto: "Abrí la terminal como administrador: escribí «cmd» en el buscador de Inicio, hacé clic derecho en «Símbolo del sistema» > «Ejecutar como administrador» y aceptá. Escribí DISM.exe /Online /Cleanup-image /Restorehealth y apretá Enter. Puede tardar varios minutos."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/installing-updates-features-roles/fix-windows-update-errors"
  - texto: "Cuando termine, en la misma ventana escribí sfc /scannow y Enter. Al final cerrá la ventana, reiniciá y volvé a buscar actualizaciones."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si el error vuelve, usá el solucionador de Windows Update (Windows 11: Configuración > Sistema > Solucionar problemas > «Otros solucionadores de problemas» > Windows Update)."
    abrir: "https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c"
fuentes:
  - https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a
  - https://learn.microsoft.com/troubleshoot/windows-server/installing-updates-features-roles/fix-windows-update-errors
  - https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c
