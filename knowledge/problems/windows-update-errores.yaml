id: WUE-009
area: windows
titulo:
  sencillo: "Windows Update da el error 0x8007000d"
  tecnico: "0x8007000D (ERROR_INVALID_DATA)"
explicacion:
  sencillo: "Lo que se descargó de la actualización llegó dañado. La solución es borrar lo descargado para que Windows lo vuelva a bajar sano."
  tecnico: "Datos descargados no válidos o corruptos. Solucionador, vaciar la caché de Windows Update (SoftwareDistribution) y volver a descargar; si persiste, DISM y sfc."
frases: ["windows update error 0x8007000d", "me sale 0x8007000d al actualizar", "0x8007000d actualización dañada", "no se instala la actualización por 0x8007000d"]
pasos:
  - texto: "Usá el solucionador de Windows Update (Windows 11: Configuración > Sistema > Solucionar problemas > «Otros solucionadores de problemas» > Windows Update; Windows 10: Configuración > Actualización y seguridad > Solucionar problemas)."
    abrir: "https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c"
  - texto: "Borrá la caché de Windows Update: apretá Windows + R, escribí services.msc y Enter; clic derecho en «Windows Update» > «Detener». Abrí la carpeta C:\\Windows\\SoftwareDistribution y borrá todo lo que hay adentro (son actualizaciones descargadas, no tus documentos). Volvé a Servicios: clic derecho en «Windows Update» > «Iniciar»."
  - texto: "Volvé a buscar actualizaciones: Windows las descarga de nuevo."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si sigue, abrí la terminal como administrador (escribí «cmd» en Inicio, clic derecho en «Símbolo del sistema» > «Ejecutar como administrador»), escribí DISM.exe /Online /Cleanup-image /Restorehealth y Enter; al terminar, sfc /scannow y Enter."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/installing-updates-features-roles/fix-windows-update-errors"
fuentes:
