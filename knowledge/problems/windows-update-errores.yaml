  - texto: "Si sigue, abrí la terminal como administrador (escribí «cmd» en Inicio, clic derecho en «Símbolo del sistema» > «Ejecutar como administrador»), escribí DISM /Online /Cleanup-Image /RestoreHealth y Enter. Reiniciá, volvé a abrirla y escribí sfc /scannow."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/installing-updates-features-roles/troubleshoot-windows-update-error-0x80070005"
  - texto: "Reiniciá y volvé a buscar actualizaciones."
