pasos:
  - texto: "Apretá Windows + R, escribí services.msc y apretá Enter. En la lista buscá «Windows Update» y hacé doble clic."
  - texto: "En «Tipo de inicio» elegí «Automático». Si el servicio figura detenido, tocá «Iniciar». Después tocá «Aplicar» y «Aceptar»."
    abrir: "https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c"
  - texto: "Reiniciá la computadora y volvé a buscar actualizaciones."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si se vuelve a apagar solo, escribile a PC Doctor «windows update desactivado»."
fuentes:
