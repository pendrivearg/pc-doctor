  tecnico: "0xc1900223: problema al descargar o instalar; Windows Update reintenta luego, sin acción necesaria. 0x8024402d (WU_E_PT_LOAD_SHEDDING): servidor con carga alta, transitorio; el reintento posterior debería funcionar."
