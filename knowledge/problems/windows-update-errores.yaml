# Errores de Windows Update y de instalación de actualizaciones, uno por código o situación (0x80070002, 0x800f081f, 0xC1900101, «Deshaciendo cambios», trabada en %, «Esta PC no puede ejecutar Windows 11», etc.). Guiadas con fuente oficial de Microsoft.
id: WUE-001
area: windows
titulo:
  sencillo: "Windows Update da el error 0x80070002"
  tecnico: "0x80070002 (ERROR_FILE_NOT_FOUND) al instalar actualizaciones"
explicacion:
  sencillo: "Ese código quiere decir que Windows no encontró un archivo que necesitaba para terminar la actualización. Casi siempre se arregla reiniciando, usando el solucionador de Windows Update y dejando lugar libre en el disco."
  tecnico: "ERROR_FILE_NOT_FOUND. Microsoft indica reiniciar, ejecutar el solucionador de Windows Update y verificar el espacio libre (igual para 0x80070003 y 0x80070057). En actualizaciones de versión, 0x80070002 - 0x20009 indica discos que no son el destino conectados."
frases: ["windows update me da error 0x80070002", "error 0x80070002 al actualizar", "me sale 0x80070002 y no se instala la actualización", "no se instala la actualización código 0x80070002"]
pasos:
  - texto: "Reiniciá la computadora (Inicio > Encendido > «Reiniciar») y después volvé a tocar «Buscar actualizaciones»."
    abrir: "ms-settings:windowsupdate"
  - texto: "Usá el solucionador de Windows Update. En Windows 11: Configuración > Sistema > Solucionar problemas > «Otros solucionadores de problemas» > Windows Update > «Ejecutar». En Windows 10: Configuración > Actualización y seguridad > Solucionar problemas > «Solucionadores de problemas adicionales» > Windows Update."
    abrir: "https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c"
  - texto: "Fijate que haya lugar en el disco de Windows: Microsoft pide al menos 20 GB libres en Windows de 64 bits (16 GB en 32 bits). Si falta, liberá espacio desde Almacenamiento."
    abrir: "ms-settings:storagesense"
  - texto: "Si el error apareció al pasar a una versión nueva de Windows (por ejemplo «0x80070002 - 0x20009»), desenchufá los discos y pendrives que no sean el disco donde está Windows y volvé a probar."
    abrir: "https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a"
fuentes:
  - https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c
  - https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a
  - https://learn.microsoft.com/troubleshoot/windows-server/installing-updates-features-roles/fix-windows-update-errors
madurez: T0
