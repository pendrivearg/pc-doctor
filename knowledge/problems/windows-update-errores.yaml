id: WUE-013
area: windows
titulo:
  sencillo: "La actualización quedó trabada en un porcentaje"
  tecnico: "Descarga o instalación detenida en 0 %, 100 % o entre 51 % y 99 %"
explicacion:
  sencillo: "Que tarde no siempre es una falla: depende del tamaño de la actualización y de la velocidad de Internet. Si queda en 0 % o en 100 % mucho rato, suele ser que otro programa la frena, que se cortó Internet o que falta espacio."
  tecnico: "0 %/100 %: reiniciar, verificar conexión y espacio libre (16/20 GB). 51-99 %: el tiempo depende de la conexión, la configuración de red y el tamaño; si no avanza, volver a buscar o ejecutar el solucionador."
frases: ["la actualización está trabada en 0%", "windows update quedó clavado en 100%", "la actualización no pasa del 75 por ciento", "hace horas que la actualización está en el mismo porcentaje"]
pasos:
