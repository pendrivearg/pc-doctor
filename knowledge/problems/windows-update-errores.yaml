id: WUE-005
area: windows
titulo:
  sencillo: "Windows Update no logra conectarse (0x80072ee2, 0x80072efd o 0x80244022)"
  tecnico: "Tiempo de espera o servicio no disponible al contactar Windows Update"
explicacion:
  sencillo: "Windows no pudo comunicarse con los servidores de Microsoft: la conexión se cortó, tardó demasiado o el servicio estaba saturado. Suele ser la conexión a Internet, un firewall o un proxy que bloquea."
  tecnico: "0x80072EE2 / 0x80072EFD: tiempo de espera agotado (WININET). 0x80244022: HTTP 503, servicio temporalmente sobrecargado. Verificar conectividad y que firewall o proxy no bloqueen las direcciones de descarga de Microsoft."
frases: ["windows update error 0x80072ee2", "me sale 0x80072efd al buscar actualizaciones", "error 0x80244022 windows update", "windows update no se conecta al servidor"]
pasos:
  - texto: "Comprobá que tengas Internet abriendo una página cualquiera. Si no anda, reconectá el Wi-Fi o el cable."
    abrir: "ms-settings:network-status"
  - texto: "Revisá si hay un proxy activado. Si no sabés por qué está, puede estar bloqueando las descargas de Microsoft: escribile a PC Doctor «hay un proxy configurado»."
    abrir: "ms-settings:network-proxy"
  - texto: "Si tenés un firewall o antivirus de otra marca, fijate que no esté bloqueando a Windows Update."
  - texto: "Con 0x80244022 el servicio estaba saturado: esperá un rato y volvé a intentar. Si sigue, usá el solucionador de Windows Update (Windows 11: Configuración > Sistema > Solucionar problemas > «Otros solucionadores de problemas» > Windows Update)."
    abrir: "https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a"
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/installing-updates-features-roles/common-windows-update-errors
  - https://support.microsoft.com/windows/get-help-with-windows-upgrade-and-installation-errors-ea144c24-513d-a60e-40df-31ff78b3158a
  - https://support.microsoft.com/windows/troubleshoot-problems-updating-windows-188c2b0f-10a7-d72f-65b8-32d177eb136c
