id: WUE-025
area: windows
titulo:
  sencillo: "Windows Update da el error 0x80070570"
  tecnico: "0x80070570 (ERROR_FILE_OR_DIRECTORY_CORRUPTED)"
explicacion:
  sencillo: "Windows no puede leer archivos que necesita para la actualización. Pueden estar dañados en la descarga, en la reserva interna de Windows o en el propio disco."
  tecnico: "Caché de descargas corrupta, almacén de componentes dañado, errores del volumen del sistema, interferencia del antivirus o descarga interrumpida. Vaciar SoftwareDistribution\\Download, DISM, sfc y chkdsk."
frases: ["windows update error 0x80070570", "0x80070570 archivo dañado al actualizar", "me sale 0x80070570 en la actualización", "el archivo o directorio está dañado y no se puede leer en windows update"]
pasos:
  - texto: "Antes de empezar, Microsoft recomienda hacer una copia de seguridad: si el disco tiene fallas, podrías perder archivos."
  - texto: "Abrí la terminal como administrador (escribí «cmd» en Inicio, clic derecho en «Símbolo del sistema» > «Ejecutar como administrador») y escribí estos comandos uno por uno, con Enter después de cada uno: «net stop wuauserv», «net stop bits», «rd /s /q %windir%\\SoftwareDistribution\\Download», «net start bits», «net start wuauserv». Reiniciá y probá la actualización."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/installing-updates-features-roles/troubleshoot-windows-update-error-0x80070570"
  - texto: "Si sigue, en la terminal como administrador escribí DISM /Online /Cleanup-Image /RestoreHealth y Enter. Reiniciá y volvé a probar."
  - texto: "Si todavía falla, escribí sfc /scannow y Enter. Al terminar, reiniciá y probá otra vez."
  - texto: "Por último, revisá el disco: escribí chkdsk C: /f /r y Enter, aceptá que se revise en el próximo reinicio y reiniciá. Si aparecen errores de disco, escribile a PC Doctor «un disco informa que está fallando»."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/installing-updates-features-roles/troubleshoot-windows-update-error-0x80070570
madurez: T0
