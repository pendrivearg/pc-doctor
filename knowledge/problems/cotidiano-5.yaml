id: BAS-KB-003
area: basico
titulo:
  sencillo: "El teclado hace ruidos o las teclas responden raro"
  tecnico: "Teclas especiales o teclas filtro activadas"
explicacion:
  sencillo: "Si apretás Mayúscula cinco veces seguidas se activan las «teclas especiales», y el teclado empieza a sonar o a comportarse distinto. Se apagan en un minuto."
  tecnico: "Sticky Keys (Mayús ×5) y Filter Keys (Mayús derecha 8 s)."
frases: ["el teclado hace un pitido", "se activaron las teclas especiales", "las teclas tardan en responder", "el teclado suena al apretar shift"]
pasos:
  - texto: "En Teclado (Accesibilidad), apagá «Teclas especiales» y «Teclas de filtro», y desactivá sus atajos si no los usás."
    abrir: "ms-settings:easeofaccess-keyboard"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use
madurez: T0
