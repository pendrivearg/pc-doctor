id: PRN-005
area: perifericos
titulo:
  sencillo: "Imprime en otra impresora"
  tecnico: "Impresora predeterminada"
explicacion:
  sencillo: "Windows puede elegir solo la impresora predeterminada (la última que usaste). Se puede fijar siempre la misma."
  tecnico: "«Permitir que Windows administre la impresora predeterminada»."
frases: ["imprime en otra impresora", "manda a imprimir a la impresora equivocada", "cambiar la impresora predeterminada", "aparece otra impresora por defecto"]
pasos:
  - texto: "En Impresoras y escáneres, desactivá «Permitir que Windows administre mi impresora predeterminada», elegí tu impresora y tocá «Establecer como predeterminada»."
    abrir: "ms-settings:printers"
fuentes:
  - https://support.microsoft.com/windows/hardware/printer/set-a-default-printer-in-windows
madurez: T0
