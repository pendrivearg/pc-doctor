id: ACC-HELLO-001
area: basico
titulo:
  sencillo: "No me reconoce la huella o la cara para entrar"
  tecnico: "Windows Hello (huella / reconocimiento facial)"
explicacion:
  sencillo: "Pasa con el lector sucio, con anteojos o con mucha o poca luz. Se puede volver a registrar la huella o la cara. Mientras tanto, entrá con el PIN."
  tecnico: "Mejorar reconocimiento, volver a registrar, limpiar el sensor, controlador del lector."
frases: ["no me reconoce la huella", "no me reconoce la cara para entrar", "el lector de huellas no anda", "windows hello no funciona"]
pasos:
  - texto: "Entrá con el PIN o la contraseña. Limpiá y secá el lector de huellas."
  - texto: "En Opciones de inicio de sesión, usá «Mejorar el reconocimiento» o agregá otro dedo."
    abrir: "ms-settings:signinoptions"
  - texto: "Microsoft tiene más soluciones."
    abrir: "https://support.microsoft.com/windows/security/windows-hello-common-issues-and-troubleshooting-tips"
fuentes:
  - https://support.microsoft.com/windows/security/windows-hello-common-issues-and-troubleshooting-tips
madurez: T0
