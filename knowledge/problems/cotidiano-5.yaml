id: FIL-ODR-002
area: archivos
titulo:
  sencillo: "OneDrive dice que está lleno"
  tecnico: "Cuota de OneDrive excedida"
explicacion:
  sencillo: "La cuenta gratuita trae 5 GB. Cuando se llena, OneDrive deja de guardar cosas nuevas (lo que ya está no se pierde)."
  tecnico: "Cuota excedida: archivos en solo lectura, sin sincronizar; la papelera de OneDrive también cuenta."
frases: ["onedrive está lleno", "me dice que no tengo más espacio en onedrive", "se llenó la nube de microsoft", "onedrive no guarda más fotos"]
pasos:
  - texto: "Entrá a OneDrive en el navegador, vaciá su papelera (vaciar la papelera de la PC no alcanza) y borrá videos o archivos grandes que no necesites."
  - texto: "Antes de borrar algo de OneDrive, pasalo a un disco externo si lo querés conservar."
  - texto: "Microsoft explica las opciones, incluida la de pagar más espacio (es opcional)."
    abrir: "https://support.microsoft.com/onedrive/my-onedrive-says-it-s-full"
fuentes:
  - https://support.microsoft.com/onedrive/my-onedrive-says-it-s-full
madurez: T0
