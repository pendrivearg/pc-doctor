# Energía, seguridad, OneDrive, inicio de sesión, accesibilidad, idioma, impresión y escritorio. Guiadas con fuente oficial.
id: PWR-001
area: windows
titulo:
  sencillo: "La computadora se prende o se despierta sola"
  tecnico: "Reactivación inesperada desde suspensión"
explicacion:
  sencillo: "Casi siempre la despierta el mouse, el teclado o una tarea programada de Windows (como el mantenimiento automático)."
  tecnico: "Dispositivos con permiso de reactivación, temporizadores de reactivación y mantenimiento automático."
frases: ["la compu se prende sola de noche", "se despierta sola", "la pc sale de la suspensión sola", "se enciende sola a cualquier hora"]
pasos:
  - texto: "Si el mouse está sobre una mesa que vibra, moverlo puede despertarla: probá apagándolo o desenchufándolo de noche."
  - texto: "En Energía, revisá cuándo se suspende y usá «Apagar» en vez de «Suspender» si no la vas a usar por muchas horas."
    abrir: "ms-settings:powersleep"
  - texto: "Microsoft explica la diferencia entre apagar, suspender e hibernar."
    abrir: "https://support.microsoft.com/topic/troubleshoot-problems-waking-computer-from-sleep-mode-6cf5b22f-5111-92c3-4a28-eec6e6ff908e"
fuentes:
  - https://support.microsoft.com/topic/troubleshoot-problems-waking-computer-from-sleep-mode-6cf5b22f-5111-92c3-4a28-eec6e6ff908e
madurez: T0
