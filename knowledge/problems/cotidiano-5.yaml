id: BAS-TASK-001
area: basico
titulo:
  sencillo: "Desapareció la barra de abajo (barra de tareas)"
  tecnico: "Barra de tareas oculta automáticamente"
explicacion:
  sencillo: "Puede estar configurada para esconderse sola: aparece al llevar el mouse hasta abajo de todo."
  tecnico: "Ocultar automáticamente la barra de tareas."
frases: ["desapareció la barra de abajo", "no veo la barra de tareas", "se esconde la barra de inicio", "no aparece el botón de inicio abajo"]
pasos:
  - texto: "Llevá el mouse hasta el borde de abajo de la pantalla: si aparece, está en modo «ocultar automáticamente»."
  - texto: "En Barra de tareas > Comportamientos, desactivá «Ocultar automáticamente la barra de tareas»."
    abrir: "ms-settings:taskbar"
  - texto: "Si no aparece de ninguna forma, reiniciá la PC."
fuentes:
  - https://support.microsoft.com/windows/fix-problems-with-the-start-menu-604171c1-2c65-40a6-8774-473810765950
madurez: T0
