id: BAS-PTR-001
area: basico
titulo:
  sencillo: "No veo bien la flechita del mouse"
  tecnico: "Tamaño y color del puntero"
explicacion:
  sencillo: "Se puede agrandar la flechita del mouse y ponerle un color que se vea mejor."
  tecnico: "Accesibilidad > Puntero del mouse y entrada táctil."
frases: ["no veo la flechita del mouse", "el puntero es muy chico", "pierdo el cursor en la pantalla", "agrandar la flecha del mouse"]
pasos:
  - texto: "En Puntero del mouse, mové el tamaño y elegí un color que contraste (por ejemplo, negro o amarillo)."
    abrir: "ms-settings:easeofaccess-mousepointer"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use
madurez: T0
