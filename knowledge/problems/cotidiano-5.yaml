id: BAS-CLIP-001
area: basico
titulo:
  sencillo: "Quiero pegar algo que copié antes"
  tecnico: "Historial del portapapeles"
explicacion:
  sencillo: "Windows puede recordar las últimas 25 cosas que copiaste. Se abre con Windows + V."
  tecnico: "Historial del portapapeles (Win+V), elementos anclados, se borra al reiniciar."
frases: ["cómo pego algo que copié antes", "perdí lo que había copiado", "ver las cosas que copié", "copiar y pegar varias cosas"]
pasos:
  - texto: "Apretá Windows + V. La primera vez, tocá «Activar». Después vas a ver lo último que copiaste y podés elegir qué pegar."
  - texto: "Se puede activar o desactivar en Configuración."
    abrir: "ms-settings:clipboard"
fuentes:
  - https://support.microsoft.com/windows/apps/using-the-clipboard
madurez: T0
