id: BAS-LANG-001
area: basico
titulo:
  sencillo: "Windows está en otro idioma"
  tecnico: "Idioma de presentación de Windows"
explicacion:
  sencillo: "Se puede agregar el español y ponerlo como idioma de Windows. Hace falta cerrar sesión para que cambie."
  tecnico: "Agregar paquete de idioma y establecerlo como idioma de presentación."
frases: ["windows está en inglés", "la compu está en otro idioma", "cambiar el idioma de windows a español", "los menús aparecen en inglés"]
pasos:
  - texto: "En Idioma y región, tocá «Agregar un idioma», elegí Español (Argentina o el que prefieras) e indicá que sea el idioma de Windows. Después cerrá sesión."
    abrir: "ms-settings:regionlanguage"
fuentes:
  - https://support.microsoft.com/windows/manage-the-input-and-display-language-settings-in-windows-12a10cb4-8626-9b77-0ccb-5013e0c7c7a2
madurez: T0
