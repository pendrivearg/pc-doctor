id: SEC-PHI-001
area: seguridad
titulo:
  sencillo: "Me llegó un correo o mensaje sospechoso"
  tecnico: "Phishing (suplantación para robar datos)"
explicacion:
  sencillo: >-
    Los estafadores mandan correos que parecen del banco, de un correo argentino, de Microsoft o de una tienda
    para que toques un enlace y escribas tus claves. Ningún banco ni Microsoft te pide la contraseña por correo.
  tecnico: "Remitente falsificado, enlaces que no coinciden con el sitio real, urgencia y pedido de datos."
frases: ["me llegó un mail raro del banco", "un correo me pide la clave", "recibí un mensaje sospechoso", "me dicen que mi cuenta se va a bloquear si no toco el enlace"]
pasos:
  - texto: "No toques enlaces ni abras archivos adjuntos. Si dudás, entrá a la página del banco o servicio escribiendo vos la dirección, no desde el correo."
  - texto: "Si ya escribiste una clave, cambiala desde la página oficial y avisá a tu banco."
  - texto: "Microsoft explica cómo reconocer estos engaños."
    abrir: "https://support.microsoft.com/security/protect-yourself-from-phishing"
fuentes:
  - https://support.microsoft.com/security/protect-yourself-from-phishing
madurez: T0
