id: FIL-ZIP-001
area: archivos
titulo:
  sencillo: "No puedo abrir un archivo comprimido (ZIP, RAR, 7z)"
  tecnico: "Extracción de archivos comprimidos"
explicacion:
  sencillo: "Windows abre los ZIP, y desde Windows 11 24H2 también RAR y 7z. Los comprimidos con contraseña necesitan otro programa."
  tecnico: "Extracción nativa (Explorador) de ZIP; RAR/7z/TAR en Windows 11 24H2+; cifrados requieren 7-Zip u otro."
frases: ["no puedo abrir un archivo rar", "cómo descomprimo un zip", "me mandaron un archivo 7z y no lo abro", "descomprimir archivos"]
pasos:
  - texto: "Clic derecho sobre el archivo > «Extraer todo…» y elegí dónde dejar lo que tiene adentro."
  - texto: "Si tiene contraseña o es un formato que Windows no abre, usá un programa gratuito y oficial como 7-Zip (descargalo solo de su página oficial)."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/zip-and-unzip-files"
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/zip-and-unzip-files
madurez: T0
