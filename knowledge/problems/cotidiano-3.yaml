id: NET-WIFI-001
area: red
titulo:
  sencillo: "El Wi-Fi se corta a cada rato"
  tecnico: "Desconexiones intermitentes de Wi-Fi"
explicacion:
  sencillo: "Puede ser la distancia al router, interferencias o que Windows apague el Wi-Fi para ahorrar batería."
  tecnico: "Señal, banda (2,4/5 GHz), ahorro de energía del adaptador y controlador."
frases: ["el wifi se corta a cada rato", "se desconecta el internet cada tanto", "el wifi anda y deja de andar", "se cae la conexión todo el tiempo"]
sondas: [red]
pasos:
  - texto: "Acercate al router o probá con cable para ver si es la señal."
  - texto: "Olvidá la red Wi-Fi y volvé a conectarte (vas a necesitar la clave del Wi-Fi)."
    abrir: "ms-settings:network-wifi"
  - texto: "Microsoft tiene más pasos, como actualizar el controlador del adaptador."
    abrir: "https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c"
fuentes:
  - https://support.microsoft.com/windows/fix-wi-fi-connection-issues-in-windows-9424a1f7-6a3b-65a6-4d78-7f07eee84d2c
madurez: T0
