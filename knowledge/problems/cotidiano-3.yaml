id: GAM-002
area: juegos
titulo:
  sencillo: "El juego dice que falta un archivo de DirectX (d3dx9, xinput…)"
  tecnico: "Componentes heredados de DirectX ausentes"
explicacion:
  sencillo: "Muchos juegos usan partes viejas de DirectX que Windows no trae. Se instalan gratis desde Microsoft y no cambian nada más."
  tecnico: "DirectX End-User Runtime (d3dx9_xx.dll, xinput1_3.dll, etc.); no reemplaza la versión de DirectX instalada."
frases: ["falta d3dx9_43.dll", "el juego dice que falta un dll de directx", "error de directx al abrir el juego", "falta xinput1_3.dll"]
pasos:
  - texto: "Instalá el «DirectX End-User Runtime» siguiendo la página oficial de Microsoft. No descargues archivos .dll sueltos de otras páginas: suelen traer virus."
    abrir: "https://support.microsoft.com/topic/how-to-install-the-latest-version-of-directx-d1f5ffa5-dae2-246c-91b1-ee1e973ed8c2"
  - texto: "En Steam también podés verificar los archivos del juego (clic derecho > Propiedades > Archivos instalados)."
fuentes:
  - https://support.microsoft.com/topic/how-to-install-the-latest-version-of-directx-d1f5ffa5-dae2-246c-91b1-ee1e973ed8c2
madurez: T0
