# Programas, archivos, cuentas, seguridad y juegos (módulos B, C, F, H, I, M). Fichas guiadas con fuente oficial.
id: APP-OFF-002
area: programas
titulo:
  sencillo: "Office dice «Producto sin licencia» o pide activar"
  tecnico: "Errores de activación de Microsoft 365 / Office"
explicacion:
  sencillo: "Pasa cuando Office no reconoce tu licencia: otra cuenta, suscripción vencida o dos Office instalados a la vez. Se arregla con la licencia legítima; PC Doctor nunca activa Office por vías no oficiales."
  tecnico: "Cuenta incorrecta, suscripción expirada, instalaciones duplicadas o fecha/hora incorrecta."
frases: ["el word dice producto sin licencia", "office me pide activar", "excel dice que no tiene licencia", "se venció el office"]
pasos:
  - texto: "Abrí Word, tocá tu nombre arriba a la derecha y fijate que sea la cuenta con la que compraste Office."
  - texto: "Si tenés dos Office instalados, desinstalá el que no usás desde Aplicaciones instaladas."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si la suscripción de Microsoft 365 venció, hay que renovarla. Microsoft explica cada error en su página oficial."
    abrir: "https://support.microsoft.com/microsoft-365-activation-licensing/office-install/unlicensed-product-and-activation-errors-in-office"
fuentes:
  - https://support.microsoft.com/microsoft-365-activation-licensing/office-install/unlicensed-product-and-activation-errors-in-office
madurez: T0
---
id: APP-OUT-001
area: programas
titulo:
  sencillo: "Outlook no abre o se cuelga"
  tecnico: "Outlook no inicia (complementos, perfil o archivo de datos)"
explicacion:
  sencillo: "Muchas veces lo traba un complemento. Abrir Outlook en «modo seguro» permite saberlo."
  tecnico: "Diagnóstico con outlook /safe; luego complementos COM, reparación de Office o nuevo perfil."
frases: ["no me abre el outlook", "el outlook se queda colgado", "outlook no puede abrir la ventana", "no puedo entrar al correo de outlook"]
sondas: [eventos]
pasos:
  - texto: "Apretá Windows + R, escribí  outlook /safe  y Enter. Si abre así, el problema es un complemento: desactivalo en Archivo > Opciones > Complementos."
  - texto: "Si tampoco abre en modo seguro, repará Office desde Aplicaciones instaladas > Microsoft 365 > Modificar."
    abrir: "ms-settings:appsfeatures"
  - texto: "Microsoft tiene una guía con los demás pasos (reparar el archivo de datos, crear un perfil nuevo)."
    abrir: "https://support.microsoft.com/office/i-can-t-start-microsoft-outlook-or-receive-the-error-cannot-start-microsoft-outlook-cannot-open-the-outlook-window-d1f69da6-b333-4650-97bf-4d77bd7abb85"
fuentes:
  - https://support.microsoft.com/office/i-can-t-start-microsoft-outlook-or-receive-the-error-cannot-start-microsoft-outlook-cannot-open-the-outlook-window-d1f69da6-b333-4650-97bf-4d77bd7abb85
madurez: T0
