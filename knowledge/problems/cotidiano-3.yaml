id: DAY-SCR-001
area: basico
titulo:
  sencillo: "Sacar una foto de la pantalla o grabarla"
  tecnico: "Capturas y grabación de pantalla (Recortes)"
explicacion:
  sencillo: "Windows trae una herramienta para sacar una foto de la pantalla o de una parte, y en Windows 11 también para grabar video."
  tecnico: "Win+Shift+S (captura), Win+Shift+R (grabación en Recortes, Windows 11), Impr Pant."
frases: ["cómo saco una captura de pantalla", "quiero sacarle una foto a la pantalla", "cómo grabo la pantalla", "guardar lo que se ve en la pantalla"]
pasos:
  - texto: "Para una foto: apretá Windows + Mayús + S, elegí la parte de la pantalla y pegala donde quieras (queda también en la carpeta Imágenes > Capturas de pantalla)."
  - texto: "Para grabar video (Windows 11): Windows + Mayús + R, elegí la zona y tocá Iniciar."
  - texto: "Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/windows/apps/use-snipping-tool-to-capture-screenshots"
fuentes:
  - https://support.microsoft.com/windows/apps/use-snipping-tool-to-capture-screenshots
madurez: T0
