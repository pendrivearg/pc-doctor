id: ACC-MSA-001
area: basico
titulo:
  sencillo: "Mi cuenta de Microsoft (Hotmail, Outlook) está bloqueada"
  tecnico: "Cuenta Microsoft bloqueada o suspendida"
explicacion:
  sencillo: "Microsoft bloquea cuentas cuando ve movimientos raros, para protegerlas. Se desbloquea con un código que te mandan al celular."
  tecnico: "Desbloqueo con código de seguridad por SMS; si no hay acceso, asistente de inicio de sesión. El soporte no restablece contraseñas."
frases: ["me bloquearon la cuenta de hotmail", "mi cuenta de microsoft está bloqueada", "no puedo entrar a mi correo outlook dice bloqueada"]
pasos:
  - texto: "Entrá a tu cuenta de Microsoft desde el navegador y pedí el código de seguridad por mensaje de texto. Vence a los 10 minutos."
    abrir: "https://account.microsoft.com/"
  - texto: "Microsoft explica qué hacer si no te llega el código."
    abrir: "https://support.microsoft.com/accounts-billing/manage/microsoft-account-has-been-locked"
derivar: "Desconfiá de cualquiera que te ofrezca desbloquearla por teléfono o por mensaje: Microsoft no lo hace así."
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/microsoft-account-has-been-locked
madurez: T0
