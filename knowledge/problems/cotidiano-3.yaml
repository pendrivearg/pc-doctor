id: FIL-BAK-001
area: archivos
titulo:
  sencillo: "Quiero hacer una copia de seguridad de mis cosas"
  tecnico: "Copia de seguridad (Windows Backup / disco externo)"
explicacion:
  sencillo: "Tener una copia de tus fotos y documentos en otro lugar es lo que más te protege ante un disco roto, un virus o un robo."
  tecnico: "Windows Backup con OneDrive (cuenta Microsoft personal) o copia manual a un disco externo."
frases: ["quiero hacer una copia de seguridad", "cómo guardo mis fotos por si se rompe la compu", "hacer un backup de mis archivos", "resguardar mis documentos"]
pasos:
  - texto: "Opción simple: conectá un disco externo o pendrive y copiá las carpetas Documentos, Escritorio, Imágenes y Descargas."
  - texto: "Opción automática: Windows Backup guarda tus carpetas y configuraciones en OneDrive (necesita una cuenta Microsoft personal)."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/back-up-and-restore-with-windows-backup"
  - texto: "Lo ideal es tener la copia fuera de la computadora y revisarla de vez en cuando."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/back-up-and-restore-with-windows-backup
madurez: T0
