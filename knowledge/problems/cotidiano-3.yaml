id: FIL-DEL-001
area: archivos
titulo:
  sencillo: "Borré un archivo sin querer"
  tecnico: "Recuperación de archivos eliminados"
explicacion:
  sencillo: >-
    Casi siempre se puede recuperar si se actúa rápido. IMPORTANTE: hasta recuperarlo, no guardes ni descargues
    cosas nuevas en ese disco, porque pueden ocupar el lugar del archivo borrado.
  tecnico: "Papelera, Historial de archivos/versiones anteriores, papelera de OneDrive y Windows File Recovery (sin escribir en el disco afectado)."
frases: ["borré un archivo sin querer", "se me borraron las fotos", "eliminé una carpeta importante", "vacié la papelera y necesito un archivo"]
pasos:
  - texto: "Abrí la Papelera de reciclaje (en el escritorio), buscá el archivo, clic derecho > «Restaurar»."
  - texto: "Si estaba en OneDrive, entrá a la papelera de OneDrive en internet: guarda lo borrado 30 días."
    abrir: "https://support.microsoft.com/onedrive/restore-your-onedrive-files"
  - texto: "Si tenías Historial de archivos, clic derecho sobre la carpeta > «Restaurar versiones anteriores»."
  - texto: "Si nada de eso funciona, Microsoft tiene una herramienta gratuita (Windows File Recovery)."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/windows-file-recovery"
derivar: "Si son fotos o documentos muy valiosos y no aparecen, apagá la PC y consultá a un técnico en recuperación de datos antes de seguir usándola."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/windows-file-recovery
  - https://support.microsoft.com/onedrive/restore-your-onedrive-files
madurez: T0
