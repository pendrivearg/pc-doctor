id: FIL-ODR-001
area: archivos
titulo:
  sencillo: "OneDrive no sincroniza"
  tecnico: "Fallas de sincronización de OneDrive"
explicacion:
  sencillo: "OneDrive dejó de subir o bajar archivos. Reiniciarlo suele arreglarlo y no se pierde nada."
  tecnico: "Restablecimiento de OneDrive (no borra archivos; hay que volver a elegir carpetas)."
frases: ["onedrive no sincroniza", "la nube no sube mis archivos", "onedrive tiene una cruz roja", "onedrive dice sincronización pendiente"]
pasos:
  - texto: "Fijate que haya Internet y que la cuenta de OneDrive tenga espacio libre (la gratuita trae 5 GB)."
  - texto: "Si sigue igual, restablecé OneDrive como explica Microsoft: no se pierden archivos."
    abrir: "https://support.microsoft.com/onedrive/reset-onedrive"
fuentes:
  - https://support.microsoft.com/onedrive/reset-onedrive
madurez: T0
