id: SEC-RAN-001
area: seguridad
titulo:
  sencillo: "Mis archivos no abren y me piden plata para devolverlos"
  tecnico: "Ransomware (cifrado de archivos con pedido de rescate)"
explicacion:
  sencillo: >-
    Es un virus que bloquea tus archivos y pide un pago. No pagues: no garantiza nada. Desconectá la PC de Internet
    y de los discos externos para que no se extienda. Algunas variantes tienen solución gratuita.
  tecnico: "Contención (aislar red y unidades), limpieza con Defender sin conexión, búsqueda de descifrador en No More Ransom, restauración desde copias."
frases: ["me secuestraron los archivos", "mis archivos tienen otra extensión y no abren", "me piden plata para devolverme los archivos", "apareció una nota que pide un rescate en bitcoin"]
sondas: [seguridad]
pasos:
  - texto: "Desconectá el cable de red o el Wi-Fi y quitá pendrives y discos externos. No apagues ni borres nada."
  - texto: "Hacé un examen de Microsoft Defender sin conexión (Seguridad de Windows > Protección antivirus > Opciones de examen)."
    abrir: "ms-settings:windowsdefender"
  - texto: "En No More Ransom (proyecto oficial de la policía europea y empresas de seguridad) podés ver si hay un descifrador gratuito."
    abrir: "https://www.nomoreransom.org/"
  - texto: "Para el futuro: Microsoft explica cómo proteger tus carpetas y tener copias."
    abrir: "https://support.microsoft.com/security/protect-your-pc-from-ransomware"
derivar: "Denunciá el hecho y, si los archivos son importantes, consultá a un técnico en seguridad antes de hacer cualquier otra cosa."
fuentes:
  - https://support.microsoft.com/security/protect-your-pc-from-ransomware
  - https://www.nomoreransom.org/
madurez: T0
