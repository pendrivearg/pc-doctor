id: GAM-003
area: juegos
titulo:
  sencillo: "El juego pide TPM 2.0 o Arranque seguro (Secure Boot)"
  tecnico: "Requisitos de anti-trampas: TPM 2.0 y UEFI Secure Boot"
explicacion:
  sencillo: "Algunos juegos online (como Valorant o Battlefield) exigen dos protecciones que se activan en la BIOS. PC Doctor revisa cómo están en tu PC."
  tecnico: "Anti-cheat a nivel kernel que requiere TPM 2.0 habilitado y Secure Boot activo en modo UEFI."
frases: ["el juego me pide tpm 2.0", "valorant dice que necesito secure boot", "el antitrampas dice que active el tpm", "battlefield pide arranque seguro"]
sondas: [plataforma]
pasos:
  - texto: "Mirá abajo cómo está el Arranque seguro en esta PC. Si tenés BitLocker, guardá antes la clave de recuperación."
    abrir: "https://account.microsoft.com/devices/recoverykey"
  - texto: "Para activar TPM 2.0 (puede figurar como Intel PTT o AMD fTPM) en la BIOS, seguí la guía oficial."
    abrir: "https://support.microsoft.com/windows/security/devicesecurity/enable-tpm-2-0-on-your-pc"
fuentes:
  - https://support.microsoft.com/windows/security/devicesecurity/enable-tpm-2-0-on-your-pc
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/oem-secure-boot
madurez: T0
