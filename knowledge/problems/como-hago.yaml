id: HOW-022
area: basico
titulo:
  sencillo: "Quiero agregar un teclado de otro idioma y cambiar entre ellos"
  tecnico: "Agregar distribuciones de teclado y alternar con Windows + Barra espaciadora"
explicacion:
  sencillo: "Si escribís en otro idioma (por ejemplo en inglés o portugués), podés agregar ese teclado y pasar de uno a otro cuando quieras, sin cambiar el idioma de los menús de Windows."
  tecnico: "Hora e idioma > Idioma y región > … > Opciones de idioma > Teclados > Agregar un teclado; Windows + Barra espaciadora o el indicador de idioma de la bandeja del sistema para alternar; … > Quitar."
frases: ["agregar el teclado en inglés", "cambiar el idioma del teclado", "tener dos teclados en la compu", "pasar del teclado español al de otro idioma"]
pasos:
  - texto: "Abrí Configuración > Hora e idioma > «Idioma y región». Tocá los tres puntitos (…) al lado de tu idioma y elegí «Opciones de idioma»."
    abrir: "ms-settings:regionlanguage"
  - texto: "En «Teclados», fijate si ya está el que querés. Si no, tocá «Agregar un teclado» y elegilo de la lista."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/input-devices/manage-the-language-and-keyboard-input-layout-settings-in-windows"
  - texto: "Para cambiar de teclado: mantené apretada la tecla Windows y tocá la barra espaciadora, o tocá el indicador de idioma de la barra de tareas, abajo a la derecha, y elegí el teclado."
  - texto: "Para sacar uno que no usás: en «Teclados», tocá los tres puntitos al lado de ese teclado > «Quitar»."
derivar: "Si las teclas escriben otra cosa (no sale la @ o la ñ), escribile a PC Doctor «no me sale la arroba»."
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/input-devices/manage-the-language-and-keyboard-input-layout-settings-in-windows
