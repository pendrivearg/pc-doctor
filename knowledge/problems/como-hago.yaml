id: HOW-009
area: basico
titulo:
  sencillo: "Quiero copiar el texto que aparece en una imagen"
  tecnico: "Recortes: Acciones de texto (reconocimiento de texto, OCR)"
explicacion:
  sencillo: "La herramienta Recortes de Windows puede «leer» las letras de lo que ves en la pantalla (una foto, un documento escaneado) y dejarte copiarlas, sin tener que escribirlas de nuevo. Todo se hace en tu propia compu."
  tecnico: "Herramienta Recortes: tras capturar, Acciones de texto activa el OCR local; permite seleccionar y copiar o Copiar todo el texto, y Redacción rápida."
frases: ["copiar el texto de una foto", "pasar a texto lo que dice una imagen", "sacar las letras de una captura", "copiar un texto que no se deja seleccionar"]
pasos:
  - texto: "Dejá a la vista la imagen que tiene el texto. Apretá Windows + Mayús + S y marcá con el mouse la parte donde están las letras."
    abrir: "https://support.microsoft.com/windows/use-snipping-tool-to-capture-screenshots-00246869-1843-655f-f220-97299b865f6b"
  - texto: "Abrí ese recorte en la herramienta Recortes y tocá el botón «Acciones de texto»."
  - texto: "Seleccioná con el mouse el texto que quieras y copialo, o tocá «Copiar todo el texto». Después pegalo donde lo necesites con Ctrl + V."
fuentes:
  - https://support.microsoft.com/windows/use-snipping-tool-to-capture-screenshots-00246869-1843-655f-f220-97299b865f6b
madurez: T0
---
id: HOW-010
area: basico
titulo:
  sencillo: "Quiero poner caritas (emojis) cuando escribo"
  tecnico: "Panel de emojis (Windows + punto)"
explicacion:
  sencillo: "Windows tiene un panel con caritas, corazones y dibujitos que podés poner en cualquier lugar donde escribís: un correo, un documento o un chat."
  tecnico: "Windows + punto (.) o Windows + punto y coma (;) abre el panel de emojis en el campo de texto activo."
frases: ["cómo pongo una carita en la compu", "poner emojis en el correo", "dónde están los emoticones en windows", "quiero mandar un corazoncito desde la computadora"]
pasos:
  - texto: "Hacé clic en el lugar donde estás escribiendo, para que quede el cursor titilando."
  - texto: "Apretá a la vez la tecla Windows y el punto (.). También funciona Windows + punto y coma (;)."
    abrir: "https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"
  - texto: "En el panel que aparece, tocá la carita que quieras: queda escrita donde estaba el cursor."
fuentes:
  - https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec
madurez: T0
