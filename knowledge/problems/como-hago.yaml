id: HOW-021
area: audio
titulo:
  sencillo: "Quiero cambiar o silenciar los sonidos de los avisos"
  tecnico: "Sonido de las notificaciones por aplicación y sonidos de eventos (Panel de control > Sonido)"
explicacion:
  sencillo: "Cada programa puede hacer un ruidito cuando te manda un aviso. Podés apagar ese sonido para los programas que te molestan, y también elegir otro sonido para algunos avisos de Windows."
  tecnico: "Sistema > Notificaciones > (aplicación) > Reproducir un sonido; Panel de control > Sonido > pestaña Sonidos > Eventos de programa > Examinar (.wav)."
frases: ["sacar el ruidito de las notificaciones", "cambiar el sonido de los avisos", "la compu hace un sonido cada vez que llega algo", "poner otro sonido cuando me llega un correo"]
pasos:
  - texto: "Abrí Configuración > Sistema > «Notificaciones». En la lista de aplicaciones, tocá la que hace ruido y apagá «Reproducir un sonido»."
    abrir: "ms-settings:notifications"
  - texto: "Para cambiar el sonido de un aviso: abrí el Panel de control y buscá «Sonido». En la pestaña «Sonidos», elegí el aviso en la lista de eventos (por ejemplo, la notificación de correo nuevo), tocá «Examinar», elegí un archivo .wav y «Aceptar»."
    abrir: "https://support.microsoft.com/en-us/outlook/change-the-sound-played-when-an-email-message-arrives"
  - texto: "Microsoft explica las notificaciones."
    abrir: "https://support.microsoft.com/en-us/windows/experience/notifications-and-do-not-disturb-in-windows"
derivar: "Si querés que la compu no te interrumpa para nada, escribile a PC Doctor «quiero que deje de interrumpirme con notificaciones»."
fuentes:
  - https://support.microsoft.com/en-us/windows/experience/notifications-and-do-not-disturb-in-windows
  - https://support.microsoft.com/en-us/outlook/change-the-sound-played-when-an-email-message-arrives
