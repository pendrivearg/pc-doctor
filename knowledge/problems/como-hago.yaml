# Cómo hago… en Windows 11: escritorios, widgets, anclar programas, Explorador, ZIP, Recortes, emojis, modo oscuro, apps de Windows (Calculadora, Reloj, Notas rápidas, Grabadora, Cámara) y datos de la PC. Guiadas con fuente oficial.
id: HOW-001
area: basico
titulo:
  sencillo: "Quiero tener varios escritorios para separar lo que hago"
  tecnico: "Escritorios virtuales (Vista de tareas)"
explicacion:
  sencillo: "Windows te deja tener más de un escritorio, como si tuvieras varias mesas: en una las cosas del trabajo y en otra las de la casa. Cada escritorio tiene sus propias ventanas."
  tecnico: "Vista de tareas (Windows + Tab) > Nuevo escritorio; Windows + Ctrl + D crea, Windows + Ctrl + flechas cambia y Windows + Ctrl + F4 cierra el escritorio actual."
frases: ["cómo hago para tener otro escritorio", "separar las ventanas del trabajo y las de la casa", "escritorios virtuales en windows 11", "pasar de un escritorio a otro"]
pasos:
  - texto: "Apretá Windows + Tab (o tocá el ícono de «Vista de tareas» en la barra de abajo) y elegí «Nuevo escritorio». Si querés, tocá su nombre y poné uno propio, por ejemplo «Trabajo»."
    abrir: "https://support.microsoft.com/windows/configure-multiple-desktops-in-windows-36f52e38-5b4a-557b-2ff9-e1a60c976434"
  - texto: "Para crear uno directo con el teclado: Windows + Ctrl + D. Para pasar de un escritorio a otro: Windows + Ctrl + flecha izquierda o derecha."
  - texto: "Para cerrar el escritorio en el que estás: Windows + Ctrl + F4. Microsoft lo lista entre los atajos de teclado de Windows."
    abrir: "https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"
fuentes:
  - https://support.microsoft.com/windows/configure-multiple-desktops-in-windows-36f52e38-5b4a-557b-2ff9-e1a60c976434
  - https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec
madurez: T0
---
id: HOW-002
area: basico
titulo:
  sencillo: "Quiero sacar (o usar) el panel de widgets"
  tecnico: "Widgets: abrir con Windows + W u ocultar el botón de la barra de tareas"
explicacion:
  sencillo: "Los widgets son un panel con información rápida (clima, noticias y otras cosas) que se abre desde la barra de abajo. Si no lo usás, podés sacar el botón de la barra; si te gusta, lo abrís con dos teclas."
  tecnico: "Windows + W abre el panel; Configuración > Personalización > Barra de tareas > Elementos de la barra de tareas > Widgets (activado/desactivado). Ocultarlo no deshabilita el panel."
frases: ["cómo saco los widgets de la barra", "quiero quitar el clima y las noticias de abajo", "para qué sirven los widgets", "se me abre un panel de noticias"]
pasos:
  - texto: "Para abrir el panel: apretá Windows + W, o tocá la zona de widgets en la barra de tareas."
    abrir: "https://support.microsoft.com/windows/stay-up-to-date-with-widgets-7ba79aaa-dac6-4687-b460-ad16a06be6e4"
  - texto: "Para sacar el botón: hacé clic derecho en la barra de tareas > «Configuración de la barra de tareas». En «Elementos de la barra de tareas», apagá «Widgets»."
    abrir: "ms-settings:taskbar"
  - texto: "Aunque saques el botón, el panel sigue estando: lo podés abrir cuando quieras con Windows + W. Para volver a poner el botón, prendé de nuevo «Widgets»."
fuentes:
  - https://support.microsoft.com/windows/stay-up-to-date-with-widgets-7ba79aaa-dac6-4687-b460-ad16a06be6e4
madurez: T0
---
id: HOW-003
area: basico
titulo:
  sencillo: "Quiero tener un programa a mano en la barra de abajo"
  tecnico: "Anclar y desanclar aplicaciones en la barra de tareas"
explicacion:
  sencillo: "Si «anclás» un programa a la barra de tareas (la barra de abajo), su ícono queda siempre ahí y lo abrís con un solo clic, sin tener que buscarlo."
  tecnico: "Búsqueda > clic derecho en la aplicación > Anclar a la barra de tareas; o clic derecho en el ícono de una app abierta; Desanclar de la barra de tareas para quitarlo; se reordena arrastrando."
frases: ["poner el word en la barra de abajo", "dejar fijo un programa en la barra de tareas", "anclar una aplicación abajo", "sacar un ícono de la barra de abajo"]
pasos:
  - texto: "Tocá la búsqueda de la barra de tareas y escribí el nombre del programa. Hacé clic derecho sobre él y elegí «Anclar a la barra de tareas»."
    abrir: "https://support.microsoft.com/windows/experience/personalization/customize-the-taskbar-in-windows"
  - texto: "Si el programa ya está abierto, también podés hacer clic derecho en su ícono de la barra y elegir «Anclar a la barra de tareas»."
  - texto: "Para sacarlo: clic derecho en el ícono > «Desanclar de la barra de tareas». Para cambiarlo de lugar, arrastralo con el mouse."
fuentes:
  - https://support.microsoft.com/windows/experience/personalization/customize-the-taskbar-in-windows
madurez: T0
---
id: HOW-004
area: basico
titulo:
  sencillo: "Quiero que un programa aparezca apenas abro Inicio"
  tecnico: "Anclar y desanclar aplicaciones en el menú Inicio"
explicacion:
  sencillo: "En el menú Inicio hay una parte de programas «anclados» que se ven apenas lo abrís. Podés agregar ahí los que más usás y sacar los que no te sirven."
  tecnico: "Búsqueda > clic derecho > Anclar a Inicio; clic derecho en un elemento anclado > Desanclar de Inicio; reordenar arrastrando."
frases: ["agregar un programa al menú inicio", "anclar una aplicación a inicio", "sacar programas que no uso del inicio", "ordenar los íconos del menú inicio"]
pasos:
  - texto: "Tocá la búsqueda de la barra de tareas (o abrí Inicio) y escribí el nombre del programa. Hacé clic derecho sobre él y elegí «Anclar a Inicio»."
    abrir: "https://support.microsoft.com/windows/experience/personalization/customize-the-windows-start-menu"
  - texto: "Para sacar uno que no usás: abrí Inicio, hacé clic derecho sobre el programa anclado y elegí «Desanclar de Inicio». El programa no se borra: solo deja de aparecer ahí."
  - texto: "Para ordenarlos, arrastrá cada ícono al lugar que quieras."
fuentes:
  - https://support.microsoft.com/windows/experience/personalization/customize-the-windows-start-menu
madurez: T0
