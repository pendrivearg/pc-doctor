id: HOW-005
area: archivos
titulo:
  sencillo: "Quiero ver la extensión de los archivos o los archivos ocultos"
  tecnico: "Explorador: Ver > Mostrar > Extensiones de nombre de archivo / Elementos ocultos"
explicacion:
  sencillo: "La extensión es el final del nombre de un archivo (por ejemplo «.pdf» o «.jpg») y dice qué tipo de archivo es. Windows la esconde, y también esconde algunos archivos. Las dos cosas se pueden mostrar desde el Explorador."
  tecnico: "Explorador de archivos > Ver > Mostrar > Extensiones de nombre de archivo y Elementos ocultos."
frases: ["cómo veo si un archivo es pdf o jpg", "mostrar la extensión de los archivos", "ver los archivos ocultos", "no me aparece el .pdf al final del nombre"]
pasos:
  - texto: "Abrí el Explorador de archivos desde la barra de tareas (el ícono de la carpeta). Arriba, tocá «Ver» > «Mostrar»."
    abrir: "https://support.microsoft.com/windows/view-hidden-files-and-folders-in-windows-97fbc472-c603-9d90-91d0-1166d1d9f4b5"
  - texto: "Marcá «Extensiones de nombre de archivo»: desde ahora vas a ver el final de cada nombre (.pdf, .docx, .jpg)."
  - texto: "Para ver los archivos ocultos, en el mismo menú marcá «Elementos ocultos». No borres ni muevas archivos ocultos que no conocés: muchos los usa Windows."
fuentes:
  - https://support.microsoft.com/windows/view-hidden-files-and-folders-in-windows-97fbc472-c603-9d90-91d0-1166d1d9f4b5
madurez: T0
