id: HOW-025
area: windows
titulo:
  sencillo: "Quiero cambiarle el nombre a la compu"
  tecnico: "Cambiar el nombre de este equipo (Sistema > Información)"
explicacion:
  sencillo: "Cada compu tiene un nombre. Ponerle uno claro (por ejemplo «Notebook-Abuela») ayuda a distinguirla de tus otros aparatos en tu cuenta de Microsoft. Hace falta reiniciar para que cambie."
  tecnico: "Sistema > Información > Cambiar el nombre de este equipo > Siguiente > Reiniciar ahora / más tarde."
frases: ["cambiar el nombre de la computadora", "renombrar la pc", "cómo se llama mi compu y cómo lo cambio", "ponerle otro nombre a la notebook"]
pasos:
  - texto: "Abrí Configuración > Sistema > «Información» y tocá «Cambiar el nombre de este equipo»."
    abrir: "ms-settings:about"
  - texto: "Escribí el nombre nuevo y tocá «Siguiente»."
    abrir: "https://support.microsoft.com/accounts-billing/manage/rename-your-windows-device"
  - texto: "Elegí «Reiniciar ahora» (guardá antes lo que tengas abierto) o reiniciá más tarde: el nombre nuevo aparece después de reiniciar."
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/rename-your-windows-device
madurez: T0
