id: HOW-020
area: windows
titulo:
  sencillo: "Quiero que la compu se apague sola dentro de un rato"
  tecnico: "Programar el apagado con shutdown /s /t"
explicacion:
  sencillo: "Si dejás la compu descargando algo o pasando música para dormirte, podés decirle que se apague sola en una hora o el tiempo que quieras. Ojo: cuando llega la hora cierra los programas sin preguntar."
  tecnico: "shutdown /s /t <segundos> (0 a 315360000); con /t mayor que 0 se fuerza el cierre de las aplicaciones (/f implícito). shutdown /a cancela un apagado pendiente."
frases: ["que la compu se apague sola", "programar el apagado de la pc", "apagar la computadora en una hora", "temporizador para apagar la compu"]
pasos:
  - texto: "Antes que nada, guardá todo lo que tengas abierto: cuando llegue la hora, Windows cierra los programas sin avisar y lo que no guardaste se pierde."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/shutdown"
  - texto: "Apretá Windows + R, escribí «shutdown /s /t 3600» y tocá «Aceptar». El número son segundos: 1800 es media hora, 3600 una hora y 7200 dos horas."
    abrir: "https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"
  - texto: "Si te arrepentís antes de que se cumpla el tiempo, apretá Windows + R otra vez, escribí «shutdown /a» y «Aceptar»: se cancela el apagado."
fuentes:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/shutdown
  - https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec
madurez: T0
