id: HOW-011
area: basico
titulo:
  sencillo: "Quiero poner la pantalla en modo oscuro"
  tecnico: "Modo oscuro (Personalización > Colores > Elegir el modo)"
explicacion:
  sencillo: "El modo oscuro pone fondos negros o grises en las ventanas y menús de Windows en vez de blancos. A muchos les resulta más cómodo para la vista."
  tecnico: "Configuración > Personalización > Colores > Elegir el modo: Oscuro. Afecta Inicio, barra de tareas y centro de actividades; algunas aplicaciones tienen su propio ajuste."
frases: ["poner windows en negro", "activar el modo oscuro", "quiero las ventanas oscuras en vez de blancas", "el fondo blanco de las ventanas me encandila"]
pasos:
  - texto: "Abrí Configuración > Personalización > «Colores»."
    abrir: "ms-settings:colors"
  - texto: "En la opción para elegir el modo, poné «Oscuro». Para volver como estaba, elegí «Claro»."
    abrir: "https://support.microsoft.com/windows/change-colors-in-windows-d26ef4d6-819a-581c-1581-493cfcc005fe"
  - texto: "Algunos programas tienen su propio ajuste de colores: si alguno sigue en blanco, buscá el modo oscuro dentro de ese programa. Si lo que te molesta es la luz azulada de noche, escribile a PC Doctor «la pantalla me cansa la vista de noche»."
fuentes:
  - https://support.microsoft.com/windows/change-colors-in-windows-d26ef4d6-819a-581c-1581-493cfcc005fe
madurez: T0
---
id: HOW-012
area: basico
titulo:
  sencillo: "Quiero los íconos del escritorio más grandes (o más chicos)"
  tecnico: "Tamaño de los iconos del escritorio (Ver > Iconos grandes/medianos/pequeños)"
explicacion:
  sencillo: "Los dibujitos del escritorio se pueden agrandar para verlos mejor, o achicar si ocupan demasiado lugar."
  tecnico: "Clic derecho en el escritorio > Ver > Iconos grandes, medianos o pequeños; o Ctrl + rueda del mouse sobre el escritorio."
frases: ["agrandar los íconos del escritorio", "los dibujitos del escritorio se ven muy chiquitos", "achicar los íconos de la pantalla", "los íconos están enormes"]
pasos:
  - texto: "Hacé clic derecho en un lugar vacío del escritorio, elegí «Ver» y después «Iconos grandes», «Iconos medianos» o «Iconos pequeños»."
    abrir: "https://support.microsoft.com/windows/experience/personalization/customize-the-desktop-icons-in-windows"
  - texto: "Otra forma: parado en el escritorio, mantené apretada la tecla Ctrl y mové la rueda del mouse para agrandarlos o achicarlos."
  - texto: "Si lo que se ve chico son las letras de todo Windows, escribile a PC Doctor «las letras se ven muy chicas»."
fuentes:
  - https://support.microsoft.com/windows/experience/personalization/customize-the-desktop-icons-in-windows
madurez: T0
