id: HOW-017
area: audio
titulo:
  sencillo: "Quiero grabar mi voz o un audio con la compu"
  tecnico: "Grabadora de sonido de Windows"
explicacion:
  sencillo: "Windows trae la Grabadora de sonido, que graba lo que entra por el micrófono: un mensaje, una canción o una charla."
  tecnico: "Grabadora de sonido: Ctrl + R inicia, Espacio pausa, Esc detiene y guarda; las grabaciones se guardan dentro de la app y se borran si se desinstala."
frases: ["grabar un audio en la computadora", "cómo grabo mi voz en la pc", "grabadora de voz de windows", "quiero grabar un mensaje con el micrófono"]
pasos:
  - texto: "Tocá Inicio, escribí «Grabadora de sonido» y abrila."
    abrir: "https://support.microsoft.com/en-us/windows/apps/sound-recorder-app-for-windows-faq"
  - texto: "Para empezar, tocá el botón de grabar o apretá Ctrl + R. Para hacer una pausa, la barra espaciadora; para terminar, el botón de detener o Esc. La grabación aparece en la lista de la app."
  - texto: "Si no graba nada, puede que la app no tenga permiso para usar el micrófono: revisá que esté permitido."
    abrir: "ms-settings:privacy-microphone"
  - texto: "Ojo: las grabaciones quedan guardadas dentro de la app. Si desinstalás la Grabadora de sonido, se borran."
derivar: "Si el micrófono no funciona en ningún programa, escribile a PC Doctor «no funciona el micrófono»."
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/sound-recorder-app-for-windows-faq
