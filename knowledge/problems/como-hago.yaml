id: HOW-014
area: basico
titulo:
  sencillo: "Quiero pasar dólares a pesos, metros a centímetros o grados"
  tecnico: "Calculadora de Windows: convertidores y modos"
explicacion:
  sencillo: "La Calculadora que viene con Windows no solo hace cuentas: también convierte monedas, medidas, volúmenes y temperaturas, y cuenta los días entre dos fechas."
  tecnico: "Calculadora > Abrir navegación (☰): modos Estándar, Científica, Graficadora, Programador y Cálculo de fecha; convertidores Moneda, Volumen, Longitud, Temperatura y otros."
frases: ["convertir dólares a pesos en la compu", "pasar de pulgadas a centímetros", "cuántos días faltan entre dos fechas", "dónde está la calculadora de windows"]
pasos:
  - texto: "Tocá Inicio, escribí «Calculadora» y abrila."
    abrir: "https://support.microsoft.com/en-us/windows/apps/use-the-calculator-in-windows"
  - texto: "Tocá el botón de las tres rayitas (☰, «Abrir navegación») y elegí el convertidor que necesitás: por ejemplo «Moneda», «Longitud», «Volumen» o «Temperatura»."
  - texto: "Escribí el número y elegí de qué unidad a cuál querés pasarlo."
  - texto: "En el mismo menú están los modos «Estándar», «Científica» y «Cálculo de fecha», que sirve para saber cuántos días hay entre dos fechas."
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/use-the-calculator-in-windows
madurez: T0
---
id: HOW-015
area: basico
titulo:
  sencillo: "Quiero poner una alarma o un temporizador en la compu"
  tecnico: "App Reloj: alarmas y temporizadores"
explicacion:
  sencillo: "La app Reloj de Windows tiene alarmas (para que te avise a una hora) y temporizadores (para que te avise cuando pasen unos minutos, por ejemplo para la comida)."
  tecnico: "Reloj > Alarma o Temporizador > +. Funcionan con la app cerrada o el equipo bloqueado; las notificaciones pueden requerir que el equipo esté despierto (Sistema > Energía y batería)."
frases: ["poner una alarma en la computadora", "que la compu me avise en 20 minutos", "temporizador para la comida en la pc", "despertador en windows"]
pasos:
  - texto: "Tocá Inicio, escribí «Reloj» y abrí la app."
    abrir: "https://support.microsoft.com/windows/apps/how-to-use-alarms-and-timers-in-the-clock-app-in-windows"
  - texto: "Elegí «Alarma» o «Temporizador». Para crear uno nuevo, tocá el «+» y poné la hora o los minutos que quieras."
  - texto: "Suena aunque cierres la app o bloquees la compu. Pero si la compu se duerme, puede que no avise: si te pasa, revisá cuándo se suspende."
    abrir: "ms-settings:powersleep"
  - texto: "Cuando suene, podés posponerla un rato o descartarla para que deje de sonar."
fuentes:
  - https://support.microsoft.com/windows/apps/how-to-use-alarms-and-timers-in-the-clock-app-in-windows
