id: HOW-016
area: basico
titulo:
  sencillo: "Quiero anotarme cosas en papelitos en la pantalla"
  tecnico: "Notas rápidas (Sticky Notes)"
explicacion:
  sencillo: "Notas rápidas es como tener papelitos autoadhesivos en la compu: anotás un teléfono, una lista de compras o un recordatorio, y cuando volvés a abrir la app tus notas siguen ahí."
  tecnico: "Notas rápidas: Ctrl + N o + crea una nota; anclable a la barra de tareas; inicio de sesión con cuenta de Microsoft opcional para sincronizar."
frases: ["anotar algo rápido en la compu", "papelitos para recordar en la pantalla", "dónde están las notas adhesivas de windows", "quiero dejarme un recordatorio escrito en la pc"]
pasos:
  - texto: "Tocá Inicio, escribí «Notas rápidas» y abrila. Se abre donde la dejaste la última vez."
    abrir: "https://support.microsoft.com/en-us/windows/apps/stickynotes/get-started-with-sticky-notes"
  - texto: "Para una nota nueva, apretá Ctrl + N o tocá el «+». Escribí lo que quieras."
  - texto: "Para tenerla siempre a mano, hacé clic derecho en su ícono de la barra de tareas y elegí «Anclar a la barra de tareas»."
  - texto: "Si querés ver tus notas en otra compu o en el celular, podés entrar con tu cuenta de Microsoft desde la configuración de la app. No es obligatorio."
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/stickynotes/get-started-with-sticky-notes
