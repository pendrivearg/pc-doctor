pasos:
  - texto: "Tocá Inicio, escribí «Cámara» y abrila."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/camera/how-to-use-the-windows-camera-app"
  - texto: "Fijate que esté elegido el modo de foto (el botón del costado derecho). Tocá el botón para tomar la foto."
  - texto: "La foto aparece chiquita abajo a la derecha: tocala para verla grande. Para saber en qué carpeta quedó, tocá los tres puntitos (…) de arriba a la derecha y elegí la opción para abrir la carpeta."
derivar: "Si la cámara no prende o se ve negra, escribile a PC Doctor «no funciona la cámara»."
