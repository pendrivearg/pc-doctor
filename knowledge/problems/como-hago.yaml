id: HOW-019
area: basico
titulo:
  sencillo: "No encuentro un programa: ¿cómo lo busco?"
  tecnico: "Buscar aplicaciones desde Inicio o la búsqueda de la barra de tareas"
explicacion:
  sencillo: "No hace falta recordar dónde está cada programa: apretás la tecla de Windows, escribís el nombre y aparece. También están todos en una lista ordenada por letra."
  tecnico: "Tecla Windows y escribir, o Windows + S / Buscar en la barra de tareas; lista alfabética de aplicaciones en Inicio."
frases: ["dónde está el word en la compu", "cómo abro un programa que no veo", "buscar una aplicación en windows", "no sé dónde quedó un programa"]
pasos:
  - texto: "Apretá la tecla Windows y empezá a escribir el nombre del programa (por ejemplo «Word» o «Calculadora»). Cuando aparezca, tocalo o apretá Enter."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/find-your-files-and-apps-in-windows"
  - texto: "También podés tocar la búsqueda de la barra de tareas, o apretar Windows + S, y escribir ahí."
  - texto: "Si preferís mirar la lista: abrí Inicio y buscá en la lista de todas las aplicaciones, que está ordenada por letra."
  - texto: "Si lo que buscás es un documento, escribile a PC Doctor «no encuentro un documento que guardé»."
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/find-your-files-and-apps-in-windows
  - https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec
