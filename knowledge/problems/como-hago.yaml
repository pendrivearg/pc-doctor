titulo:
  sencillo: "Quiero sacarme una foto con la cámara de la compu"
  tecnico: "Aplicación Cámara: tomar fotos"
explicacion:
  sencillo: "Si tu compu tiene cámara, la app Cámara de Windows sirve para sacar fotos o grabar videos."
  tecnico: "Cámara: modo Foto > Tomar foto; la foto aparece en la miniatura del carrete; … > Abrir carpeta muestra dónde se guardó."
