id: HOW-023
area: basico
titulo:
  sencillo: "Quiero saber qué hora es en otro país"
  tecnico: "Reloj mundial en la app Reloj (agregar ciudades y comparar horarios)"
explicacion:
  sencillo: "Si tenés familia o amigos en otro país, la app Reloj te muestra la hora de su ciudad al lado de la tuya, y te ayuda a ver qué hora va a ser allá cuando acá sea, por ejemplo, la noche."
  tecnico: "Reloj > Reloj mundial > Agregar una nueva ciudad; botón Comparar con control deslizante para ver horas equivalentes."
frases: ["qué hora es en españa ahora", "ver la hora de otro país en la compu", "poner el horario de otra ciudad", "saber la diferencia de hora con mi hijo que vive afuera"]
pasos:
  - texto: "Tocá Inicio, escribí «Reloj» y abrí la app. Entrá a «Reloj mundial» (si no ves el menú, tocá el botón de arriba a la izquierda)."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/clock/how-to-use-the-world-time-clock-in-the-clock-app-in-windows"
  - texto: "Abajo, tocá la opción para agregar una ciudad nueva, escribí las primeras letras (por ejemplo «Madrid») y elegila de la lista. Confirmá con «Agregar»."
  - texto: "Para ver qué hora va a ser allá en otro momento, tocá el botón de comparar (dos relojitos con una flecha) y mové la barra. Para salir, la flecha de atrás de arriba a la izquierda."
derivar: "Si la que está mal es la hora de tu propia compu, escribile a PC Doctor «la hora de la computadora está mal»."
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/clock/how-to-use-the-world-time-clock-in-the-clock-app-in-windows
