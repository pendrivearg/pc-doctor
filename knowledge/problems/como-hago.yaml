id: HOW-006
area: archivos
titulo:
  sencillo: "Quiero abrir varias carpetas en pestañas, como en el navegador"
  tecnico: "Pestañas en el Explorador de archivos (Ctrl + T / Ctrl + W)"
explicacion:
  sencillo: "En Windows 11 el Explorador de archivos tiene pestañas, igual que el navegador: podés tener Documentos, Descargas y el pendrive abiertos en una sola ventana y pasar de uno a otro."
  tecnico: "Explorador de archivos: Ctrl + T abre una pestaña nueva y cambia a ella; Ctrl + W cierra la pestaña activa (o la ventana si es la única)."
frases: ["abrir otra pestaña en el explorador", "tener dos carpetas abiertas en la misma ventana", "pestañas en las carpetas de windows 11", "cómo cierro una pestaña de carpeta"]
pasos:
  - texto: "Abrí el Explorador de archivos y apretá Ctrl + T: se abre una pestaña nueva arriba, como en el navegador. Ahí entrá a la carpeta que quieras."
    abrir: "https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"
  - texto: "Tocá cada pestaña de arriba para pasar de una carpeta a otra."
  - texto: "Para cerrar la pestaña en la que estás, apretá Ctrl + W. Si era la única, se cierra la ventana."
fuentes:
  - https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec
madurez: T0
