titulo:
  sencillo: "Quiero saber qué tiene mi compu: memoria, procesador y versión de Windows"
  tecnico: "Configuración > Sistema > Información: especificaciones del dispositivo y de Windows"
explicacion:
  sencillo: "A veces un programa, un juego o un técnico te pregunta cuánta memoria tiene la compu, qué procesador o qué Windows usa. Todo eso está en una sola pantalla de Configuración."
  tecnico: "Sistema > Información (Windows + Pausa): Especificaciones del dispositivo (procesador, RAM instalada, tipo de sistema 32/64 bits) y Especificaciones de Windows (edición y versión)."
frases: ["cuánta memoria tiene mi compu", "qué windows tengo", "ver las características de mi computadora", "qué procesador tiene la pc", "mi windows es de 32 o 64 bits"]
pasos:
  - texto: "Abrí Configuración > Sistema > «Información». Atajo: Windows + Pausa."
    abrir: "ms-settings:about"
  - texto: "En «Especificaciones del dispositivo» ves el procesador, la memoria RAM instalada y si Windows es de 32 o de 64 bits."
    abrir: "https://support.microsoft.com/windows/experience/find-information-about-your-windows-device"
  - texto: "Más abajo, en «Especificaciones de Windows», ves la edición (por ejemplo Home o Pro) y la versión de Windows."
    abrir: "https://support.microsoft.com/windows/which-version-of-windows-operating-system-am-i-running-628bec99-476a-2c13-5296-9dd081cdd808"
fuentes:
  - https://support.microsoft.com/windows/experience/find-information-about-your-windows-device
  - https://support.microsoft.com/windows/which-version-of-windows-operating-system-am-i-running-628bec99-476a-2c13-5296-9dd081cdd808
  - https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec
