id: HOW-007
area: archivos
titulo:
  sencillo: "Quiero comprimir archivos en un ZIP para mandarlos"
  tecnico: "Crear una carpeta comprimida (ZIP) desde el Explorador"
explicacion:
  sencillo: "Un ZIP es como una bolsa que junta varios archivos en uno solo. Sirve, por ejemplo, para mandar muchas fotos o documentos juntos por correo."
  tecnico: "Clic derecho > Mostrar más opciones > Enviar a > Carpeta comprimida (en zip); se crea en la misma ubicación con el mismo nombre."
frases: ["cómo hago un zip", "comprimir una carpeta para mandarla por mail", "juntar varios archivos en uno solo", "hacer un archivo comprimido"]
pasos:
  - texto: "Buscá en el Explorador de archivos el archivo o la carpeta que querés comprimir."
  - texto: "Hacé clic derecho sobre él y elegí «Mostrar más opciones» > «Enviar a» > «Carpeta comprimida (en zip)»."
    abrir: "https://support.microsoft.com/windows/zip-and-unzip-files-8d28fa72-f2f9-712f-67df-f80cf89fd4e5"
  - texto: "En el mismo lugar aparece una carpeta comprimida con el mismo nombre: ese es tu ZIP. Si querés otro nombre, clic derecho > «Cambiar nombre»."
derivar: "Si lo que necesitás es abrir un ZIP o un RAR que te mandaron, escribile a PC Doctor «no puedo abrir un archivo comprimido»."
fuentes:
  - https://support.microsoft.com/windows/zip-and-unzip-files-8d28fa72-f2f9-712f-67df-f80cf89fd4e5
madurez: T0
