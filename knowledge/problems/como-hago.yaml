id: HOW-013
area: archivos
titulo:
  sencillo: "Quiero vaciar la Papelera (o sacar algo de ahí antes)"
  tecnico: "Restaurar elementos y vaciar la Papelera de reciclaje"
explicacion:
  sencillo: "Lo que borrás va primero a la Papelera, que sigue ocupando lugar en el disco. Vaciarla libera espacio, pero lo que había adentro se borra para siempre: antes de vaciarla, fijate que no haya nada que quieras guardar."
  tecnico: "Papelera: seleccionar > clic derecho > Restaurar (vuelve a su carpeta original); clic derecho en la Papelera del escritorio > Vaciar Papelera de reciclaje (eliminación permanente). Sensor de almacenamiento puede vaciarla automáticamente."
frases: ["cómo vacío la papelera", "liberar espacio borrando la papelera", "sacar un archivo de la papelera", "quiero recuperar algo que tiré a la papelera"]
pasos:
  - texto: "Abrí la Papelera de reciclaje (el tachito del escritorio) y mirá lo que hay. Si algo te sirve, seleccionalo, clic derecho > «Restaurar»: vuelve a la carpeta donde estaba."
    abrir: "https://support.microsoft.com/en-us/office/delete-and-restore-files-bef769c1-0771-4a01-bcaa-2d72461672e5"
  - texto: "ATENCIÓN: lo que quede en la Papelera se va a borrar para siempre. Cuando estés seguro, cerrala, hacé clic derecho sobre la Papelera del escritorio y elegí «Vaciar Papelera de reciclaje»."
    abrir: "https://support.microsoft.com/en-us/onenote/delete-onenote-notebook-from-your-windows-computer"
  - texto: "Si no ves la Papelera en el escritorio: Temas > «Configuración de iconos del escritorio», marcá «Papelera de reciclaje» y Aceptar."
    abrir: "ms-settings:themes"
  - texto: "Windows también puede vaciarla solo cada tanto con el Sensor de almacenamiento."
    abrir: "ms-settings:storagesense"
derivar: "Si ya la vaciaste y necesitás algo que estaba ahí, escribile a PC Doctor «borré un archivo sin querer»."
fuentes:
  - https://support.microsoft.com/en-us/office/delete-and-restore-files-bef769c1-0771-4a01-bcaa-2d72461672e5
  - https://support.microsoft.com/en-us/onenote/delete-onenote-notebook-from-your-windows-computer
  - https://support.microsoft.com/windows/experience/storage-filemanagement/find-the-recycle-bin-in-windows
  - https://support.microsoft.com/en-us/windows/empty-the-recycle-bin-in-windows-10-d4c8f8ef-a12e-8250-b0cf-2311960a31f9
madurez: T0
