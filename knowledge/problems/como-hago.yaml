id: HOW-008
area: perifericos
titulo:
  sencillo: "Quiero imprimir de los dos lados de la hoja"
  tecnico: "Impresión a doble cara (dúplex) desde Word"
explicacion:
  sencillo: "Muchas impresoras imprimen solas de los dos lados. Si la tuya no puede, Word te ayuda a hacerlo a mano: imprime un lado, te avisa, das vuelta las hojas y sigue con el otro."
  tecnico: "Word: Archivo > Imprimir > Configuración: Imprimir a doble cara (automático) o Imprimir manualmente a doble cara; alternativa: solo páginas impares y luego pares."
frases: ["imprimir de los dos lados", "imprimir doble faz", "ahorrar hojas imprimiendo de ambos lados", "cómo imprimo del frente y del dorso"]
pasos:
  - texto: "En Word, tocá «Archivo» > «Imprimir». En «Configuración», abrí la opción que dice «Imprimir a una cara»: si aparece «Imprimir a doble cara», tu impresora lo hace sola. Elegila e imprimí."
    abrir: "https://support.microsoft.com/en-us/word/print-on-both-sides-of-the-paper-duplex-printing-in-word"
  - texto: "Si no aparece, elegí «Imprimir manualmente a doble cara». Word imprime un lado y te pide que des vuelta la pila de hojas y la vuelvas a poner en la impresora. Conviene probar primero con pocas hojas para ver para qué lado van."
  - texto: "Otra forma: en «Imprimir todas las páginas» elegí «Imprimir solo páginas impares», imprimí, da vuelta la pila y repetí con «Imprimir solo páginas pares»."
derivar: "Si la impresora no imprime nada, escribile a PC Doctor «la impresora no imprime»."
fuentes:
  - https://support.microsoft.com/en-us/word/print-on-both-sides-of-the-paper-duplex-printing-in-word
madurez: T0
