id: ARC-024
area: seguridad
titulo:
  sencillo: "Quiero ponerle contraseña a un pendrive"
  tecnico: "Cifrar una unidad extraíble con BitLocker To Go"
explicacion:
  sencillo: "Con BitLocker se le puede poner una clave a un pendrive: si lo perdés, nadie puede ver lo que tiene. Pero si te olvidás la clave y perdés la clave de recuperación, vos tampoco vas a poder abrirlo nunca más."
  tecnico: "BitLocker To Go cifra unidades USB, tarjetas SD y discos externos (NTFS, FAT16, FAT32, exFAT); se desbloquea con contraseña, tarjeta inteligente o clave de recuperación. Sin la información de recuperación los datos son irrecuperables."
frases: ["ponerle clave a un pendrive", "proteger el pendrive con contraseña", "cifrar una memoria usb", "que nadie pueda ver lo que hay en mi pendrive"]
pasos:
  - texto: "Conectá el pendrive, abrí el Explorador de archivos, hacé clic derecho sobre el pendrive y elegí «Activar BitLocker». Si no aparece, ese pendrive puede no ser compatible (por ejemplo, por su tamaño o su formato)."
    abrir: "https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/faq"
  - texto: "Elegí desbloquear con contraseña y escribila dos veces. Inventá una que recuerdes: PC Doctor nunca te la va a pedir."
  - texto: "MUY IMPORTANTE: guardá la clave de recuperación en tu cuenta de Microsoft, en un archivo en la compu o imprimila. Sin la contraseña ni esa clave, lo que haya en el pendrive se pierde para siempre."
  - texto: "El cifrado puede tardar según el tamaño del pendrive. Después, cada vez que lo conectes te va a pedir la contraseña; en otra compu con Windows también se abre con ella."
fuentes:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/faq
  - https://learn.microsoft.com/windows/security/book/operating-system-security-encryption-and-data-protection
madurez: T0
