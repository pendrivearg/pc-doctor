id: ARC-013
area: archivos
titulo:
  sencillo: "OneDrive no me deja entrar: error 0x8004de40"
  tecnico: "Error 0x8004de40 / 0x8004de88 al iniciar sesión en OneDrive"
explicacion:
  sencillo: "Ese error quiere decir que OneDrive no se puede conectar con la nube. Casi siempre es un problema de conexión a Internet, no de tu cuenta ni de tus archivos."
  tecnico: "0x8004de40/0x8004de88: OneDrive no logra conectar con el servicio. Revisar conectividad y TLS 1.2 (Opciones de Internet > Opciones avanzadas); como último paso, restablecer OneDrive."
frases: ["onedrive error 0x8004de40", "onedrive dice que no puede iniciar sesión", "el inicio de sesión se interrumpió en onedrive", "no puedo entrar a onedrive me da un código de error"]
pasos:
  - texto: "Fijate que tengas Internet: abrí una página cualquiera en el navegador. Si no anda, escribile a PC Doctor «no tengo Internet»."
    abrir: "https://learn.microsoft.com/troubleshoot/sharepoint/sync/error-0x8004de40-in-onedrive"
  - texto: "Apretá Windows + R, escribí inetcpl.cpl y Enter. En la pestaña «Opciones avanzadas», bajá hasta el final y fijate que «Usar TLS 1.2» esté marcado. Tocá «Aplicar» y «Aceptar»."
  - texto: "Reiniciá la compu y volvé a abrir OneDrive."
  - texto: "Si sigue igual, restablecé OneDrive como explica Microsoft: no se pierden archivos, pero vuelve a sincronizar todo."
    abrir: "https://support.microsoft.com/office/reset-onedrive-34701e00-bf7b-42db-b960-84905399050c"
fuentes:
  - https://learn.microsoft.com/troubleshoot/sharepoint/sync/error-0x8004de40-in-onedrive
