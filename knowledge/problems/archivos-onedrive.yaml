id: ARC-016
area: archivos
titulo:
  sencillo: "No quiero usar más OneDrive en esta compu"
  tecnico: "Desvincular OneDrive del equipo"
explicacion:
  sencillo: "Si no querés que OneDrive siga sincronizando en esta compu, lo más simple es «desvincularlo». Tus archivos siguen en la nube (en onedrive.com), pero los que estaban solo en la nube no van a quedar en la compu."
  tecnico: "Configuración de OneDrive > Cuenta > Desvincular este equipo > Desvincular cuenta. No borra archivos de la nube; los archivos solo en línea no quedan disponibles en el equipo."
frases: ["quiero sacar onedrive de la compu", "no quiero que onedrive sincronice más", "dejar de usar onedrive", "desactivar onedrive en esta computadora"]
pasos:
  - texto: "Antes, si querés tener todo en la compu, hacé clic derecho sobre la carpeta OneDrive y elegí «Mantener siempre en este dispositivo». Esperá a que todo tenga el círculo verde (necesitás lugar en el disco)."
    abrir: "https://support.microsoft.com/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e"
  - texto: "Si usás la copia de seguridad de carpetas (Escritorio, Documentos), primero escribile a PC Doctor «quiero sacar el escritorio de OneDrive sin perder nada»."
  - texto: "Tocá la nubecita de OneDrive > el engranaje > «Configuración» > pestaña «Cuenta» > «Desvincular este equipo» y confirmá. Microsoft aclara que no se pierden archivos: siguen en onedrive.com."
    abrir: "https://support.microsoft.com/onedrive/turn-off-disable-or-uninstall-onedrive"
  - texto: "Nunca borres los archivos desde onedrive.com pensando que así lo desactivás: eso sí los borra de la nube."
fuentes:
  - https://support.microsoft.com/onedrive/turn-off-disable-or-uninstall-onedrive
  - https://support.microsoft.com/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e
madurez: T0
