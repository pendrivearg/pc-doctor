id: ARC-006
area: archivos
titulo:
  sencillo: "Mis cosas del Escritorio y Documentos ahora están dentro de OneDrive"
  tecnico: "Copia de seguridad de carpetas de OneDrive (Escritorio, Documentos, Imágenes)"
explicacion:
  sencillo: "OneDrive tiene una función que guarda en la nube tu Escritorio, tus Documentos y tus Imágenes. Cuando está activada, esas carpetas pasan a estar dentro de OneDrive: tus archivos no se perdieron, están ahí y además tienen copia en la nube."
  tecnico: "Copia de seguridad de carpetas (Known Folder Move): Escritorio, Documentos e Imágenes se sincronizan con OneDrive. Se administra en Configuración de OneDrive > Sincronización y copia de seguridad > Administrar copia de seguridad."
frases: ["onedrive se llevó mi escritorio", "mis documentos ahora están en onedrive", "por qué mis carpetas dicen onedrive", "las cosas del escritorio se fueron a la nube"]
pasos:
  - texto: "Tranquilo: abrí el Explorador de archivos y entrá a OneDrive. Ahí vas a ver las carpetas Escritorio, Documentos e Imágenes con tus archivos."
    abrir: "https://support.microsoft.com/office/back-up-your-folders-with-onedrive-d61a7930-a6fb-4b95-b28a-6552e77c3057"
  - texto: "Para ver qué carpetas se están copiando: tocá la nubecita de OneDrive junto al reloj > el engranaje (Ayuda y configuración) > «Configuración». En la pestaña «Sincronización y copia de seguridad», tocá «Administrar copia de seguridad»."
  - texto: "Tené en cuenta que esas carpetas ocupan lugar en tu OneDrive (la cuenta gratuita trae 5 GB). Si querés dejar de copiar alguna, escribile a PC Doctor «quiero sacar el escritorio de OneDrive sin perder nada»."
fuentes:
  - https://support.microsoft.com/office/back-up-your-folders-with-onedrive-d61a7930-a6fb-4b95-b28a-6552e77c3057
  - https://support.microsoft.com/windows/experience/backup-recovery/back-up-and-restore-with-windows-backup
madurez: T0
