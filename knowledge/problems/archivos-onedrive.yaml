id: ARC-023
area: archivos
titulo:
  sencillo: "Quiero cambiarle la letra a un disco o pendrive"
  tecnico: "Cambiar la letra de unidad en Administración de discos"
explicacion:
  sencillo: "Windows le pone una letra a cada disco (C:, D:, E:). Se le puede cambiar la letra a un pendrive o a un disco externo, por ejemplo para que un programa lo encuentre siempre en la misma. No cambies la del disco donde está Windows."
  tecnico: "Administración de discos > clic derecho en el volumen > Cambiar la letra y rutas de acceso de unidad > Cambiar > Asignar la letra de unidad siguiente. No se recomienda en volúmenes con Windows o aplicaciones."
frases: ["cambiar la letra del pendrive", "el disco externo cambia de letra", "quiero que el disco sea la letra d", "cómo le cambio la letra a una unidad"]
pasos:
  - texto: "Hacé clic derecho en el botón Inicio y elegí «Administración de discos»."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows"
  - texto: "Clic derecho sobre el pendrive o disco externo > «Cambiar la letra y rutas de acceso de unidad...» > «Cambiar». Elegí la letra nueva de la lista, tocá «Aceptar» y confirmá con «Sí»."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/change-a-drive-letter"
  - texto: "No le cambies la letra al disco C: ni a uno donde tengas programas instalados: después pueden dejar de funcionar."
fuentes:
  - https://learn.microsoft.com/windows-server/storage/disk-management/change-a-drive-letter
  - https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows
madurez: T0
