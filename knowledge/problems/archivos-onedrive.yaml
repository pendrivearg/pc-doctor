id: ARC-010
area: archivos
titulo:
  sencillo: "Guardé encima de un documento de OneDrive y quiero la versión de antes"
  tecnico: "Restaurar una versión anterior de un archivo en OneDrive"
explicacion:
  sencillo: "OneDrive guarda las versiones anteriores de tus archivos durante 30 días. Si guardaste cambios que no querías, podés volver a como estaba antes."
  tecnico: "Clic derecho > Historial de versiones (Explorador u onedrive.com) > «...» > Restaurar. La versión restaurada pasa a ser la actual."
frases: ["guardé encima de un archivo y perdí lo de antes", "recuperar la versión anterior de un documento de onedrive", "borré parte del texto y ya guardé", "volver atrás un archivo de la nube"]
pasos:
  - texto: "En el Explorador de archivos, hacé clic derecho sobre el archivo (dentro de OneDrive) y elegí «Historial de versiones»."
    abrir: "https://support.microsoft.com/office/restore-a-previous-version-of-a-file-stored-in-onedrive-159cad6d-d76e-4981-88ef-de6e96c93893"
  - texto: "Buscá la versión por fecha y hora, tocá los tres puntitos «...» al lado y elegí «Restaurar». La versión que tenías ahora no se pierde: queda en la lista."
  - texto: "También lo podés hacer desde onedrive.com (clic derecho > «Historial de versiones»). Solo se guardan las versiones de los últimos 30 días."
fuentes:
  - https://support.microsoft.com/office/restore-a-previous-version-of-a-file-stored-in-onedrive-159cad6d-d76e-4981-88ef-de6e96c93893
madurez: T0
