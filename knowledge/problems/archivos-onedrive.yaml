id: ARC-014
area: archivos
titulo:
  sencillo: "OneDrive da el error 0x8007016A y no abre los archivos"
  tecnico: "Error 0x8007016A: el proveedor de archivos en la nube no se está ejecutando"
explicacion:
  sencillo: "Ese código aparece cuando la parte de Windows que baja los archivos de la nube no está funcionando bien. Suele arreglarse actualizando Windows y restableciendo OneDrive, sin perder archivos."
  tecnico: "0x8007016A: buscar actualizaciones de Windows, desactivar y volver a activar archivos a petición en la configuración de OneDrive y restablecer OneDrive."
frases: ["onedrive error 0x8007016a", "el proveedor de archivos en la nube no se está ejecutando", "no puedo abrir ni mover archivos de onedrive", "me sale un error al abrir un archivo de la nube"]
pasos:
  - texto: "Abrí Windows Update e instalá lo que haya pendiente. Reiniciá si te lo pide."
    abrir: "ms-settings:windowsupdate"
  - texto: "Restablecé OneDrive como explica Microsoft (Windows + R y el comando que indica). No se pierden archivos: OneDrive vuelve a sincronizar todo y, si habías elegido solo algunas carpetas, las tenés que volver a elegir."
    abrir: "https://support.microsoft.com/office/reset-onedrive-34701e00-bf7b-42db-b960-84905399050c"
  - texto: "Si sigue, Microsoft indica apagar y volver a prender la opción de archivos a petición en la configuración de OneDrive. Si no la encontrás, escribile a PC Doctor «OneDrive no sincroniza»."
    abrir: "https://support.microsoft.com/onedrive/what-do-the-onedrive-error-codes-mean"
fuentes:
  - https://support.microsoft.com/onedrive/what-do-the-onedrive-error-codes-mean
  - https://support.microsoft.com/office/reset-onedrive-34701e00-bf7b-42db-b960-84905399050c
