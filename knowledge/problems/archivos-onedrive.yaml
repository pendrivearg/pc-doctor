id: ARC-003
area: archivos
titulo:
  sencillo: "¿Qué significan los dibujitos de OneDrive al lado de mis archivos?"
  tecnico: "Íconos de estado de OneDrive en el Explorador y el área de notificación"
explicacion:
  sencillo: "OneDrive pone un dibujito al lado de cada archivo para contarte cómo está: si está solo en la nube, si ya está en la compu, si se está subiendo o si tiene un problema."
  tecnico: "Nube azul: solo en línea. Tilde verde: disponible localmente. Círculo verde lleno: siempre en el dispositivo. Flechas circulares: sincronizando. Círculo rojo con cruz: error de sincronización. Nube con persona: compartido."
frases: ["qué es la nubecita al lado de los archivos", "qué significa el tilde verde en mis documentos", "me aparecen unas flechitas en los archivos", "qué son los iconos de onedrive"]
pasos:
  - texto: "Nubecita azul: el archivo está solo en la nube y necesita Internet para abrir. Tilde verde sobre blanco: ya está en la compu. Círculo verde lleno con tilde blanco: lo marcaste para que quede siempre en la compu."
    abrir: "https://support.microsoft.com/office/what-do-the-onedrive-icons-mean-11143026-8000-44f8-aaa9-67c985aa49b3"
  - texto: "Dos flechas en círculo: el archivo se está subiendo o bajando; esperá a que termine antes de apagar. Una nube con una persona: ese archivo o carpeta está compartido con alguien."
  - texto: "Un círculo rojo con una cruz blanca quiere decir que ese archivo no se pudo sincronizar: escribile a PC Doctor «un archivo de OneDrive tiene una cruz roja»."
fuentes:
  - https://support.microsoft.com/office/what-do-the-onedrive-icons-mean-11143026-8000-44f8-aaa9-67c985aa49b3
madurez: T0
---
id: ARC-004
area: archivos
titulo:
  sencillo: "Un archivo de OneDrive tiene una cruz roja y no se sube"
  tecnico: "Error de sincronización de un elemento (círculo rojo con cruz blanca)"
explicacion:
  sencillo: "La cruz roja quiere decir que OneDrive no pudo subir ese archivo o carpeta a la nube. Muchas veces es por el nombre (tiene un signo que OneDrive no acepta) o porque el archivo es enorme."
  tecnico: "Causas frecuentes: caracteres no válidos (\" * : < > ? / \\ |), espacios al inicio o al final, nombres reservados (CON, PRN, AUX, NUL, desktop.ini, los que empiezan con ~$) o archivos de más de 250 GB."
frases: ["un archivo de onedrive tiene una cruz roja", "me sale un circulito rojo en un documento", "hay un archivo que onedrive no quiere subir", "la nube de onedrive dice que hay un problema con un archivo"]
pasos:
  - texto: "Tocá la nubecita de OneDrive al lado del reloj: arriba te dice qué archivo tiene el problema y, muchas veces, por qué."
    abrir: "https://support.microsoft.com/office/what-do-the-onedrive-icons-mean-11143026-8000-44f8-aaa9-67c985aa49b3"
  - texto: "Mirá el nombre del archivo: si tiene alguno de estos signos \" * : < > ? / \\ | o empieza o termina con un espacio, cambiale el nombre sacándolos (clic derecho > «Cambiar nombre»)."
    abrir: "https://support.microsoft.com/office/restrictions-and-limitations-in-onedrive-and-sharepoint-64883a5d-228e-48f5-b3d2-eb39e07630fa"
  - texto: "Si el archivo es gigante (más de 250 GB), OneDrive no lo puede subir: guardalo en un disco externo."
  - texto: "Si son muchos archivos o sigue igual, escribile a PC Doctor «OneDrive no sincroniza»."
fuentes:
  - https://support.microsoft.com/office/what-do-the-onedrive-icons-mean-11143026-8000-44f8-aaa9-67c985aa49b3
  - https://support.microsoft.com/office/restrictions-and-limitations-in-onedrive-and-sharepoint-64883a5d-228e-48f5-b3d2-eb39e07630fa
madurez: T0
