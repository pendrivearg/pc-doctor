# Archivos, OneDrive y copias de seguridad: archivos a petición, íconos y códigos de error de OneDrive, copia de carpetas, compartir, versiones, Papelera, Historial de archivos, Copia de seguridad de Windows, pendrives y unidades. Guiadas con fuente oficial.
id: ARC-001
area: archivos
titulo:
  sencillo: "Un archivo de OneDrive tiene una nubecita y no abre sin Internet"
  tecnico: "Archivos a petición de OneDrive: solo en línea frente a disponible siempre"
explicacion:
  sencillo: "OneDrive muestra todos tus archivos, pero algunos están guardados solo en la nube (tienen una nubecita azul) y para abrirlos hace falta Internet. Si querés tenerlos siempre en la compu, se puede marcar que se queden guardados en ella."
  tecnico: "Archivos a petición: nube azul = solo en línea; tilde verde = disponible localmente; círculo verde lleno = «Mantener siempre en este dispositivo» (ocupa espacio y funciona sin conexión)."
frases: ["el archivo tiene una nubecita y no me abre", "no puedo abrir mis archivos de onedrive sin internet", "quiero tener los archivos de onedrive en la compu", "me voy de viaje sin internet y necesito mis documentos"]
pasos:
  - texto: "Mirá el ícono en la columna «Estado» del Explorador: la nubecita azul quiere decir que el archivo está solo en la nube; el tilde verde, que ya está en la compu."
    abrir: "https://support.microsoft.com/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e"
  - texto: "Con Internet, hacé clic derecho sobre el archivo o la carpeta y elegí «Mantener siempre en este dispositivo». Esperá a que el ícono pase a un círculo verde con tilde blanco: desde ahí abre sin conexión."
  - texto: "Tené en cuenta que esos archivos ocupan lugar en el disco, y que lo que agregues después a esa carpeta también se va a bajar."
fuentes:
  - https://support.microsoft.com/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e
madurez: T0
---
id: ARC-002
area: archivos
titulo:
  sencillo: "Quiero que OneDrive ocupe menos lugar en la compu sin borrar nada"
  tecnico: "Liberar espacio con archivos a petición y Sensor de almacenamiento"
explicacion:
  sencillo: "Los archivos de OneDrive se pueden dejar solo en la nube: siguen apareciendo en la compu y no se borran, pero dejan de ocupar lugar en el disco. Para abrirlos después vas a necesitar Internet."
  tecnico: "Clic derecho > «Liberar espacio» (pasa a solo en línea). El Sensor de almacenamiento puede hacerlo solo con el contenido de la nube que no se abre hace un tiempo."
frases: ["onedrive me ocupa todo el disco", "liberar espacio de onedrive en la compu", "que los archivos de onedrive queden solo en la nube", "tengo el disco lleno por onedrive"]
pasos:
  - texto: "En el Explorador de archivos, hacé clic derecho sobre una carpeta grande de OneDrive (por ejemplo, videos viejos) y elegí «Liberar espacio». Los archivos quedan con la nubecita azul: siguen en OneDrive, pero ya no ocupan lugar en la compu."
    abrir: "https://support.microsoft.com/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e"
  - texto: "Ojo: no borres esos archivos pensando que así liberás espacio. Si borrás un archivo de OneDrive, se borra también de la nube y de tus otros aparatos."
  - texto: "Para que Windows lo haga solo, abrí el Sensor de almacenamiento, iniciá sesión en tu cuenta si te lo pide y elegí después de cuántos días sin abrir el contenido de la nube pasa a estar solo en línea. No borra archivos, y lo que marcaste como «Mantener siempre en este dispositivo» no se toca."
    abrir: "ms-settings:storagepolicies"
fuentes:
  - https://support.microsoft.com/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e
  - https://support.microsoft.com/windows/experience/storage-filemanagement/manage-drive-space-with-storage-sense
madurez: T0
