id: ARC-007
area: archivos
titulo:
  sencillo: "Quiero sacar el Escritorio (o Documentos) de OneDrive sin perder nada"
  tecnico: "Detener la copia de seguridad de una carpeta en OneDrive"
explicacion:
  sencillo: "Se puede dejar de copiar una carpeta a OneDrive, pero hay que elegir con cuidado dónde quedan los archivos: o solo en OneDrive, o solo en la compu. Si elegís mal, los archivos desaparecen de la compu (aunque sigan en la nube)."
  tecnico: "Al apagar la copia de una carpeta, Windows pregunta si conservar los archivos solo en OneDrive (se quitan del equipo) o solo en el equipo (se quitan de OneDrive). Los archivos solo en línea deben descargarse antes."
frases: ["quiero que el escritorio no esté más en onedrive", "dejar de hacer copia de seguridad de documentos en onedrive", "cómo saco mis carpetas de onedrive sin que se borren", "no quiero que onedrive guarde mi escritorio"]
pasos:
  - texto: "Antes que nada, con Internet, hacé clic derecho sobre la carpeta (por ejemplo, Escritorio dentro de OneDrive) y elegí «Mantener siempre en este dispositivo». Esperá a que todo tenga el círculo verde: si quedan archivos solo en la nube, Windows no los puede mover."
    abrir: "https://support.microsoft.com/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e"
  - texto: "Guardá y cerrá los documentos que tengas abiertos de esa carpeta."
  - texto: "Tocá la nubecita de OneDrive > el engranaje > «Configuración» > pestaña «Sincronización y copia de seguridad» > «Administrar copia de seguridad». Apagá el interruptor de la carpeta."
    abrir: "https://support.microsoft.com/office/back-up-your-folders-with-onedrive-d61a7930-a6fb-4b95-b28a-6552e77c3057"
  - texto: "Cuidado con la pregunta que aparece: si querés seguir viendo tus archivos en la compu, elegí mantener los archivos «solo en mi PC». La otra opción («solo en OneDrive») los deja en la nube y los saca de la compu. Si dudás, pará y escribile a PC Doctor."
fuentes:
  - https://support.microsoft.com/office/back-up-your-folders-with-onedrive-d61a7930-a6fb-4b95-b28a-6552e77c3057
  - https://support.microsoft.com/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e
madurez: T0
