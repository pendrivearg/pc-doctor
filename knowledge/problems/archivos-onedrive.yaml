id: ARC-017
area: archivos
titulo:
  sencillo: "Compré una compu nueva y quiero recuperar lo que tenía en la vieja"
  tecnico: "Restaurar con Copia de seguridad de Windows en un equipo nuevo"
explicacion:
  sencillo: "Si en la compu vieja usabas Copia de seguridad de Windows, al preparar la nueva con la misma cuenta de Microsoft te ofrece traer tus programas fijados y tus configuraciones. Los archivos se recuperan desde OneDrive."
  tecnico: "Windows Backup: en la configuración inicial, con la misma cuenta Microsoft personal, ofrece restaurar (Más opciones si hay varias copias). Los archivos vuelven vía OneDrive; no sirve con cuentas de trabajo o escuela."
frases: ["pasar mis cosas a la compu nueva", "recuperar la copia de seguridad en la computadora nueva", "cómo restauro el backup de windows", "quiero que la compu nueva quede como la vieja"]
pasos:
  - texto: "En la compu vieja, si todavía anda: tocá Inicio, escribí «copia de seguridad», abrí «Copia de seguridad de Windows», encendé las carpetas que quieras guardar y tocá para hacer la copia."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/back-up-and-restore-with-windows-backup"
  - texto: "Al preparar la compu nueva, entrá con la MISMA cuenta de Microsoft. Windows te va a preguntar si querés restaurar una copia; si tenés de varias compus, tocá «Más opciones» y elegí la correcta."
  - texto: "Los archivos aparecen al entrar a OneDrive con esa misma cuenta. Los programas de la Microsoft Store se instalan tocando su ícono; los demás te mandan a la página para bajarlos."
  - texto: "Necesitás una cuenta de Microsoft personal (las de trabajo o escuela no sirven) y lugar en OneDrive (la gratuita trae 5 GB)."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/back-up-and-restore-with-windows-backup
madurez: T0
