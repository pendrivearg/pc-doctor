id: ARC-011
area: archivos
titulo:
  sencillo: "Se me borraron o arruinaron muchos archivos de OneDrive de golpe"
  tecnico: "Restaurar OneDrive a una fecha anterior (Microsoft 365)"
explicacion:
  sencillo: "Si un virus, un error o alguien borró o cambió muchos archivos de OneDrive, y tenés Microsoft 365, podés volver todo OneDrive a como estaba un día de los últimos 30."
  tecnico: "onedrive.com > Configuración > Opciones > Restaurar OneDrive: requiere suscripción a Microsoft 365; deshace toda la actividad posterior a la fecha elegida."
frases: ["se me borraron un montón de archivos de onedrive", "un virus me cambió todos los archivos de la nube", "volver onedrive a como estaba ayer", "restaurar onedrive a una fecha"]
pasos:
  - texto: "Entrá a onedrive.com con tu cuenta. Tocá el engranaje (Configuración) > «Opciones» y, a la izquierda, «Restaurar OneDrive». Solo aparece si tenés Microsoft 365."
    abrir: "https://support.microsoft.com/office/restore-your-onedrive-fa231298-759d-41cf-bcd0-25ac53eb8a15"
  - texto: "Elegí la fecha (por ejemplo, «Ayer») o una fecha y hora a medida, y revisá en la lista de actividad qué cambios se van a deshacer."
  - texto: "Antes de tocar «Restaurar», tené en cuenta que se deshace TODO lo que pasó después de esa fecha, no solo los archivos que te preocupan. Lo creado después va a la Papelera de OneDrive. Si te arrepentís, se puede deshacer con otra restauración."
fuentes:
  - https://support.microsoft.com/office/restore-your-onedrive-fa231298-759d-41cf-bcd0-25ac53eb8a15
madurez: T0
---
id: ARC-012
area: archivos
titulo:
  sencillo: "Borré un archivo de OneDrive y no está en la Papelera de la compu"
  tecnico: "Recuperar elementos desde la Papelera de reciclaje de OneDrive (web)"
explicacion:
  sencillo: "OneDrive tiene su propia papelera en la página web. Lo que borraste de la nube (o lo que estaba solo en la nube) va ahí, y se puede recuperar durante 30 días."
  tecnico: "onedrive.com > Papelera de reciclaje > seleccionar > Restaurar. Retención: 30 días (cuentas personales), 93 días (trabajo o escuela). Lo eliminado de esa papelera no se recupera."
frases: ["borré un archivo de onedrive", "no encuentro en la papelera lo que borré de onedrive", "recuperar algo borrado de la nube", "dónde está la papelera de onedrive"]
pasos:
  - texto: "Primero mirá la Papelera de reciclaje del escritorio: si está, clic derecho > «Restaurar»."
    abrir: "https://support.microsoft.com/office/restore-deleted-files-or-folders-in-onedrive-949ada80-0026-4db3-a953-c99083e6a84f"
  - texto: "Si no está, entrá a onedrive.com con tu cuenta y, en el menú de la izquierda, tocá «Papelera de reciclaje»."
  - texto: "Marcá el circulito de cada archivo que quieras recuperar y tocá «Restaurar». Vuelve a su carpeta de OneDrive y, al rato, a la compu."
  - texto: "Hacelo pronto: pasados 30 días se borra para siempre, y lo que se vacíe de esa papelera ya no se puede recuperar."
fuentes:
  - https://support.microsoft.com/office/restore-deleted-files-or-folders-in-onedrive-949ada80-0026-4db3-a953-c99083e6a84f
madurez: T0
