id: ARC-008
area: archivos
titulo:
  sencillo: "Quiero mandarle a alguien un archivo grande que tengo en OneDrive"
  tecnico: "Compartir un archivo o carpeta de OneDrive con un vínculo"
explicacion:
  sencillo: "En vez de adjuntar un archivo pesado al correo, podés compartir un enlace de OneDrive: la otra persona lo abre o lo descarga desde ahí."
  tecnico: "Clic derecho > Compartir (copia un vínculo, por defecto con permiso de edición) o desde onedrive.com > Compartir, con opciones del vínculo (permitir edición, fecha de vencimiento)."
frases: ["compartir un archivo de onedrive", "mandar un link de un archivo grande", "pasarle unas fotos a mi hija por onedrive", "cómo comparto una carpeta de la nube"]
pasos:
  - texto: "Opción rápida: en el Explorador, hacé clic derecho sobre el archivo dentro de OneDrive y elegí compartir con un vínculo de OneDrive. El enlace queda copiado: pegalo (Ctrl + V) en un correo o en WhatsApp."
    abrir: "https://support.microsoft.com/office/share-onedrive-files-and-folders-9fcc2f7d-de0c-4cec-93b0-a82024800c07"
  - texto: "Ojo: ese vínculo rápido deja que la otra persona modifique el archivo. Si solo querés que lo vea, compartilo desde onedrive.com: marcá el archivo, tocá «Compartir», entrá a la configuración del vínculo y apagá «Permitir edición»."
  - texto: "Si movés el archivo a otra carpeta, el vínculo deja de andar. Compartí solo lo que tengas derecho a compartir."
fuentes:
  - https://support.microsoft.com/office/share-onedrive-files-and-folders-9fcc2f7d-de0c-4cec-93b0-a82024800c07
madurez: T0
---
id: ARC-009
area: archivos
titulo:
  sencillo: "Compartí algo por OneDrive y ya no quiero que lo vean"
  tecnico: "Dejar de compartir o quitar un vínculo de OneDrive"
explicacion:
  sencillo: "Si compartiste un archivo o una carpeta de OneDrive y te arrepentiste, podés borrar el enlace: a partir de ahí, quien lo tenga ya no puede entrar."
  tecnico: "onedrive.com > seleccionar el elemento > Información (detalles) > Administrar acceso > quitar el vínculo (X > Quitar vínculo)."
frases: ["dejar de compartir un archivo de onedrive", "compartí una carpeta sin querer", "sacarle el acceso a alguien en onedrive", "borrar el link que mandé"]
pasos:
  - texto: "Entrá a onedrive.com con tu cuenta y marcá el archivo o la carpeta compartida (de a uno)."
    abrir: "https://support.microsoft.com/office/share-onedrive-files-and-folders-9fcc2f7d-de0c-4cec-93b0-a82024800c07"
  - texto: "Arriba a la derecha, tocá el ícono de información para ver los detalles y, en la parte de quién tiene acceso, elegí «Administrar acceso»."
  - texto: "Tocá la X al lado del vínculo y confirmá que lo querés quitar. Si se lo habías compartido a una persona puntual, desde ahí también le podés sacar el permiso."
fuentes:
  - https://support.microsoft.com/office/share-onedrive-files-and-folders-9fcc2f7d-de0c-4cec-93b0-a82024800c07
madurez: T0
