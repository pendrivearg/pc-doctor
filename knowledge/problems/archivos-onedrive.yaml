id: ARC-020
area: archivos
titulo:
  sencillo: "Me dice que el nombre del archivo es demasiado largo"
  tecnico: "Ruta de archivo que supera el límite (MAX_PATH, 260 caracteres)"
explicacion:
  sencillo: "Windows cuenta como «nombre» todo el camino: el disco, cada carpeta y el archivo. Si hay muchas carpetas una adentro de otra con nombres largos, se pasa del límite y no deja copiar, mover o abrir."
  tecnico: "Muchas aplicaciones limitan la ruta completa a 260 caracteres (MAX_PATH). Las rutas largas solo funcionan en apps preparadas para ello, así que lo práctico es acortar la ruta."
frases: ["el nombre del archivo es demasiado largo", "no me deja copiar porque el nombre es muy largo", "la ruta de acceso es demasiado larga", "no puedo mover una carpeta con muchas subcarpetas"]
pasos:
  - texto: "Acortá los nombres de las carpetas de más arriba (clic derecho > «Cambiar nombre»): por ejemplo, «Fotos de las vacaciones en la costa 2023» puede quedar «Costa 2023»."
    abrir: "https://learn.microsoft.com/windows/win32/fileio/maximum-file-path-limitation"
  - texto: "Otra opción: mové la carpeta a un lugar más «arriba», por ejemplo directo en Documentos o en la raíz del disco externo, así el camino queda más corto."
  - texto: "Si pasa con OneDrive, también cuenta el largo del camino: aplicá lo mismo dentro de la carpeta OneDrive."
    abrir: "https://support.microsoft.com/office/back-up-your-folders-with-onedrive-d61a7930-a6fb-4b95-b28a-6552e77c3057"
fuentes:
  - https://learn.microsoft.com/windows/win32/fileio/maximum-file-path-limitation
  - https://support.microsoft.com/office/back-up-your-folders-with-onedrive-d61a7930-a6fb-4b95-b28a-6552e77c3057
madurez: T0
