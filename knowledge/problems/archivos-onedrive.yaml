id: ARC-005
area: archivos
titulo:
  sencillo: "OneDrive está en pausa y no guarda mis cambios en la nube"
  tecnico: "Sincronización de OneDrive en pausa"
explicacion:
  sencillo: "Si la nubecita de OneDrive tiene el dibujo de pausa (dos rayitas), OneDrive dejó de subir tus cambios a la nube por un rato. No se pierde nada: hay que reanudarlo."
  tecnico: "Ícono de pausa en el área de notificación: la sincronización está pausada; se reanuda desde el ícono con «Reanudar la sincronización»."
frases: ["onedrive dice que está en pausa", "la nubecita tiene dos rayitas", "onedrive pausado no sube nada", "cómo saco la pausa de onedrive"]
pasos:
  - texto: "Abajo a la derecha, junto al reloj, tocá la nubecita de OneDrive (si no la ves, tocá la flechita «^»)."
    abrir: "https://support.microsoft.com/office/what-do-the-onedrive-icons-mean-11143026-8000-44f8-aaa9-67c985aa49b3"
  - texto: "Elegí la opción para reanudar la sincronización. Vas a ver las flechitas en círculo mientras sube lo pendiente: dejá la compu prendida y con Internet hasta que termine."
  - texto: "Si después aparece otro aviso o una cruz roja, escribile a PC Doctor «OneDrive no sincroniza»."
fuentes:
  - https://support.microsoft.com/office/what-do-the-onedrive-icons-mean-11143026-8000-44f8-aaa9-67c985aa49b3
madurez: T0
