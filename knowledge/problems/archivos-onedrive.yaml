id: ARC-019
area: archivos
titulo:
  sencillo: "Quiero recuperar cómo estaba un archivo o una carpeta hace unos días"
  tecnico: "Restaurar versiones anteriores con el Historial de archivos"
explicacion:
  sencillo: "Si tenés activado el Historial de archivos, Windows guarda copias viejas de tus cosas en el disco externo. Desde ahí podés recuperar un archivo borrado o cómo estaba un documento antes."
  tecnico: "Explorador > clic derecho en la carpeta > Restaurar versiones anteriores > elegir versión > Restaurar o «Restaurar en...». Requiere copias previas del Historial de archivos."
frases: ["recuperar un archivo de hace unos días", "restaurar versiones anteriores de una carpeta", "quiero el documento como estaba la semana pasada", "recuperar algo del historial de archivos"]
pasos:
  - texto: "Conectá el disco externo donde se guardan las copias."
  - texto: "En el Explorador, andá a la carpeta donde estaba el archivo, hacé clic derecho sobre ella y elegí «Restaurar versiones anteriores». Elegí una fecha en la que el archivo todavía estaba bien."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/backup-and-restore-with-file-history"
  - texto: "Para no pisar lo que tenés ahora, desplegá «Restaurar» y elegí «Restaurar en...» para guardarlo en otro lugar. Si tocás «Restaurar» directo, reemplaza la versión actual y eso no se puede deshacer."
  - texto: "Si nunca activaste el Historial de archivos, no va a haber versiones: escribile a PC Doctor «borré un archivo sin querer»."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/backup-and-restore-with-file-history
madurez: T0
