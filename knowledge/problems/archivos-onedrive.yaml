id: ARC-021
area: archivos
titulo:
  sencillo: "No puedo borrar ni mover un archivo porque dice que está en uso"
  tecnico: "Archivo en uso o abierto en otro programa (incluido 0x8007018b de OneDrive)"
explicacion:
  sencillo: "Windows no deja borrar, mover o cambiar el nombre de un archivo mientras algún programa lo tiene abierto. A veces el que lo está usando es OneDrive, mientras lo sube a la nube."
  tecnico: "Bloqueo por identificador abierto. En OneDrive, 0x8007018b indica que el archivo está en uso por la sincronización: esperar a que termine, cerrar OneDrive y reintentar."
frases: ["no me deja borrar un archivo dice que está abierto", "el archivo está en uso por otro programa", "no puedo mover una carpeta porque está en uso", "onedrive error 0x8007018b"]
pasos:
  - texto: "Guardá y cerrá el programa donde tenías abierto ese archivo (Word, el visor de fotos, el reproductor). Probá de nuevo."
    abrir: "https://support.microsoft.com/office/back-up-your-folders-with-onedrive-d61a7930-a6fb-4b95-b28a-6552e77c3057"
  - texto: "Si el archivo está en OneDrive y ves las flechitas en círculo, esperá a que termine de sincronizar. Si sigue, cerrá OneDrive (tocá la nubecita y buscá la opción para salir), hacé lo que necesitabas y después volvé a abrirlo: Inicio, escribí «OneDrive» y abrilo."
    abrir: "https://support.microsoft.com/onedrive/what-do-the-onedrive-error-codes-mean"
  - texto: "Si no sabés qué programa lo tiene abierto, reiniciá la compu y probá apenas arranca."
fuentes:
  - https://support.microsoft.com/onedrive/what-do-the-onedrive-error-codes-mean
  - https://support.microsoft.com/office/back-up-your-folders-with-onedrive-d61a7930-a6fb-4b95-b28a-6552e77c3057
madurez: T0
