id: ARC-022
area: archivos
titulo:
  sencillo: "Quiero formatear un pendrive (borrarlo entero)"
  tecnico: "Formatear una unidad extraíble desde Administración de discos"
explicacion:
  sencillo: "Formatear deja el pendrive vacío, como nuevo. ATENCIÓN: borra todo lo que tiene adentro. Antes, copiá a la compu lo que quieras conservar y fijate bien de elegir el pendrive y no otro disco."
  tecnico: "Administración de discos > clic derecho en el volumen > Formatear. Formato rápido crea una tabla de archivos nueva; el formato completo sobrescribe. No se puede formatear el volumen de Windows."
frases: ["formatear un pendrive", "borrar todo el pendrive", "dejar el pendrive como nuevo", "cómo formateo una memoria usb"]
pasos:
  - texto: "ADVERTENCIA: formatear borra TODO el contenido del pendrive. Primero copiá a la compu lo que quieras guardar."
  - texto: "Hacé clic derecho en el botón Inicio y elegí «Administración de discos». Ubicá tu pendrive por el tamaño y la letra (el disco C: es Windows: no lo toques)."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows"
  - texto: "Clic derecho sobre el pendrive > «Formatear». Dejá las opciones como están, tocá «Aceptar» y confirmá."
  - texto: "Si el pendrive aparece como «RAW» o sin formato y tiene archivos que necesitás, no lo formatees: escribile a PC Doctor «el pendrive o el disco externo no aparece»."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management"
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows
  - https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management
madurez: T0
