id: ARC-018
area: archivos
titulo:
  sencillo: "Quiero que la compu guarde sola una copia de mis archivos en un disco externo"
  tecnico: "Activar el Historial de archivos"
explicacion:
  sencillo: "El Historial de archivos copia solo, cada tanto, tus documentos, fotos, música y videos a un disco externo. Si un día se rompe o se borra algo, lo recuperás desde ahí."
  tecnico: "Panel de control > Sistema y seguridad > Historial de archivos > Activar (y Seleccionar unidad). Respalda las bibliotecas en una unidad externa o ubicación de red."
frases: ["hacer copia automática en un disco externo", "activar el historial de archivos", "que se guarden solos mis documentos en el disco externo", "backup automático sin la nube"]
pasos:
  - texto: "Conectá el disco externo."
  - texto: "Abrí el Panel de control (tocá Inicio y escribí «Panel de control») > «Sistema y seguridad» > la opción de guardar copias de seguridad de tus archivos con el Historial de archivos."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/backup-and-restore-with-file-history"
  - texto: "Tocá «Activar». Si eligió otro disco, tocá «Seleccionar unidad», marcá el tuyo y «Aceptar»."
  - texto: "Dejá el disco conectado seguido para que pueda copiar. Para sumar otra carpeta, agregala a una biblioteca (clic derecho > «Mostrar más opciones» > «Incluir en biblioteca»)."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/backup-and-restore-with-file-history
madurez: T0
