id: ARC-015
area: archivos
titulo:
  sencillo: "OneDrive dice que no terminé de configurarlo (error 0x8004de90)"
  tecnico: "Error 0x8004de90: configuración de OneDrive incompleta"
explicacion:
  sencillo: "Ese aviso aparece cuando OneDrive se instaló pero nunca se terminó de conectar con tu cuenta. Se arregla completando la configuración."
  tecnico: "0x8004de90: la configuración inicial no finalizó. Abrir OneDrive desde Inicio e iniciar sesión con la cuenta de Microsoft."
frases: ["onedrive error 0x8004de90", "onedrive dice que no está configurado", "onedrive me pide terminar la configuración", "la nube de onedrive aparece tachada desde que compré la compu"]
pasos:
  - texto: "Tocá Inicio, escribí «OneDrive» y abrilo."
    abrir: "https://support.microsoft.com/onedrive/what-do-the-onedrive-error-codes-mean"
  - texto: "En la pantalla de configuración, escribí el correo de tu cuenta de Microsoft (Hotmail, Outlook) y seguí los pasos. La contraseña la escribís vos en la ventana de Microsoft."
  - texto: "Cuando termine, la nubecita junto al reloj deja de estar tachada. Si ves otro código de error, escribile a PC Doctor el número."
fuentes:
  - https://support.microsoft.com/onedrive/what-do-the-onedrive-error-codes-mean
  - https://support.microsoft.com/office/what-do-the-onedrive-icons-mean-11143026-8000-44f8-aaa9-67c985aa49b3
