id: ARC-025
area: archivos
titulo:
  sencillo: "Me llegó un archivo que no sé con qué programa abrir"
  tecnico: "Extensión de archivo desconocida: identificar el tipo y elegir aplicación"
explicacion:
  sencillo: "Lo que va después del punto en el nombre del archivo (.pdf, .docx, .mp3) dice qué tipo de archivo es y con qué programa se abre. Si la compu no sabe abrirlo, te pregunta con qué programa hacerlo."
  tecnico: "La extensión define el tipo de archivo. Abrir con > Elegir otra aplicación, o buscar en Microsoft Store. Cambiar la extensión no convierte el archivo."
frases: ["no sé con qué abrir este archivo", "me mandaron un archivo raro que no abre", "la compu pregunta cómo quiero abrir el archivo", "qué es un archivo que termina en punto algo"]
pasos:
  - texto: "Mirá cómo termina el nombre del archivo. Si no ves la terminación, en el Explorador tocá «Ver» > «Mostrar» > «Extensiones de nombre de archivo»."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/common-file-name-extensions-in-windows"
  - texto: "Clic derecho sobre el archivo > «Abrir con» > «Elegir otra aplicación» y probá con alguna de la lista. Si no hay ninguna que sirva, en ese mismo menú buscá en Microsoft Store un programa para ese tipo."
  - texto: "No le cambies la terminación al nombre para que abra: eso no transforma el archivo. Y si termina en .exe, .msi o .bat es un programa: no lo abras si no sabés de dónde vino; preguntale a PC Doctor."
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/common-file-name-extensions-in-windows
madurez: T0
