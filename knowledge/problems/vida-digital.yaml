id: VDG-020
area: programas
titulo:
  sencillo: "Compré algo en el App Store y quiero que me devuelvan la plata"
  tecnico: "Solicitar un reembolso de una compra de Apple (reportaproblem.apple.com)"
explicacion:
  sencillo: "Algunas compras de apps, suscripciones o contenido de Apple se pueden reclamar para que te devuelvan la plata. Se pide desde una página de Apple, desde la compu o el celular."
  tecnico: "reportaproblem.apple.com > Me gustaría > Solicitar un reembolso > motivo > Siguiente > elemento > Enviar; actualización en 24 a 48 horas."
frases: ["devolución de una app del iphone", "me cobraron una compra del app store por error", "reclamar un cobro de apple", "pedir un reembolso a apple"]
pasos:
  - texto: "Entrá a reportaproblem.apple.com con tu cuenta de Apple (lo explica la ayuda oficial)."
    abrir: "https://support.apple.com/es-lamr/118223"
  - texto: "Tocá «Me gustaría» y elegí «Solicitar un reembolso». Elegí el motivo y tocá «Siguiente»."
  - texto: "Elegí la app, la suscripción o lo que compraste y tocá «Enviar». Vas a tener una respuesta en 24 a 48 horas."
  - texto: "Si no encontrás el cobro, buscá en tu correo el recibo de Apple para ver con qué cuenta se hizo. Si todavía está pendiente, esperá a que te llegue el recibo y volvé a intentar."
  - texto: "Si nadie de tu familia hizo esa compra, no esperes: llamá a tu banco al número que figura en la tarjeta."
fuentes:
  - https://support.apple.com/es-lamr/118223
