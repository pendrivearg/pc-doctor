id: VDG-025
area: archivos
titulo:
  sencillo: "Quiero compartir un álbum de fotos con la familia en Google Fotos"
  tecnico: "Crear y compartir un álbum compartido en Google Fotos (web)"
explicacion:
  sencillo: "En vez de mandar las fotos una por una, armás un álbum y lo compartís: los que invites ven todas las fotos juntas y pueden sumar las suyas."
  tecnico: "photos.google.com > seleccionar fotos > Agregar a un álbum > Álbum compartido > Nuevo álbum compartido > título > Compartir > Enviar; Más > Opciones > Quitar persona."
frases: ["compartir las fotos del cumple con la familia", "hacer un álbum compartido en google fotos", "mandar muchas fotos juntas a mis hijos", "que la familia pueda subir fotos a un álbum"]
pasos:
  - texto: "Entrá a photos.google.com con tu cuenta. A la izquierda hacé clic en «Fotos», pasá el mouse sobre una foto y hacé clic en «Seleccionar»; marcá todas las que quieras."
    abrir: "https://support.google.com/photos/answer/6131416?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Arriba hacé clic en el botón para agregar a un álbum, elegí «Álbum compartido» > «Nuevo álbum compartido» y ponele un título."
  - texto: "Arriba a la derecha tocá «Compartir», elegí con quién y hacé clic en «Enviar»."
  - texto: "Ojo: quien tenga acceso al álbum puede ver las fotos y agregar más. Para sacar a alguien: abrí el álbum > «Más» > «Opciones», buscá a la persona > «Más» > «Quitar persona»."
fuentes:
  - https://support.google.com/photos/answer/6131416?hl=es-419&co=GENIE.Platform%3DDesktop
madurez: T0
