id: VDG-022
area: archivos
titulo:
  sencillo: "El iPhone me avisa que el almacenamiento de iCloud está lleno"
  tecnico: "Administrar y liberar el almacenamiento de iCloud"
explicacion:
  sencillo: "Cuando iCloud se llena, el iPhone deja de hacer copias de seguridad, las fotos nuevas no se suben y no te llegan correos de iCloud. Se puede liberar lugar o pasar a un plan pago (iCloud+)."
  tecnico: "Configuración > nombre > iCloud > Almacenamiento / Administrar almacenamiento de la cuenta; Recomendaciones para ti; borrar respaldos, adjuntos de Mensajes, archivos de iCloud Drive; icloud.com; iCloud+."
frases: ["icloud lleno", "me sale que no hay espacio en icloud", "el iphone no hace copia porque icloud está lleno", "liberar espacio de icloud"]
pasos:
  - texto: "En el iPhone: Configuración > tocá tu nombre > iCloud > «Almacenamiento» (o «Administrar almacenamiento de la cuenta») para ver qué ocupa más."
    abrir: "https://support.apple.com/es-lamr/108922"
  - texto: "Probá primero «Recomendaciones para ti», en la pantalla de iCloud, y seguí las indicaciones."
  - texto: "Podés borrar respaldos de aparatos que ya no usás, adjuntos grandes de Mensajes o archivos de iCloud Drive. Ojo: lo que borrás de Fotos se borra de todos tus aparatos; guardá antes una copia."
  - texto: "Desde la compu también podés borrar fotos, archivos y correos entrando a icloud.com."
  - texto: "Si igual no alcanza, podés pasar a iCloud+, que es el plan pago con más espacio."
fuentes:
  - https://support.apple.com/es-lamr/108922
madurez: T0
