id: VDG-003
area: seguridad
titulo:
  sencillo: "¿Cómo invento una contraseña segura que no me olvide?"
  tecnico: "Crear una contraseña segura (recomendaciones de Google)"
explicacion:
  sencillo: "Una buena clave es larga, mezcla letras, números y símbolos, y no tiene datos tuyos que otro pueda adivinar. Armarla a partir de una frase que solo vos conocés ayuda a recordarla."
  tecnico: "Al menos 12 caracteres, letras, números y símbolos ASCII; sin datos personales ni patrones (1234, qwerty); una distinta por cuenta importante; guardarla en un lugar seguro o en un administrador de contraseñas confiable."
frases: ["qué contraseña pongo para que no me la roben", "inventar una clave difícil", "mi contraseña es mi fecha de cumpleaños, está mal", "cómo hago una clave segura que me acuerde"]
pasos:
  - texto: "Que tenga 12 caracteres o más y mezcle letras, números y símbolos (en Google no se pueden usar letras con tilde)."
    abrir: "https://support.google.com/accounts/answer/32040?hl=es-419"
  - texto: "No uses nombres de hijos, nietos o mascotas, fechas importantes, tu dirección o tu teléfono, ni cosas como «1234», «contraseña» o «qwerty»."
  - texto: "Para recordarla, armala con una frase que signifique algo para vos; por ejemplo, con la primera letra de cada palabra de una oración."
  - texto: "Usá una clave distinta para cada cuenta importante (el correo, el banco). Si la anotás en papel, guardala bajo llave; también podés dejar que la guarde un administrador de contraseñas confiable."
  - texto: "No se la digas a nadie: PC Doctor nunca te la va a pedir."
fuentes:
  - https://support.google.com/accounts/answer/32040?hl=es-419
madurez: T0
