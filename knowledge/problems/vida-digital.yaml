id: VDG-021
area: archivos
titulo:
  sencillo: "¿Qué es Google One? ¿Tengo que pagar más espacio de Google?"
  tecnico: "Google One: almacenamiento pago de la Cuenta de Google"
explicacion:
  sencillo: "Tu cuenta de Google trae 15 GB gratis, compartidos entre Gmail, Drive y Google Fotos. Google One es el plan pago para tener más espacio; se renueva solo hasta que lo cancelás."
  tecnico: "one.google.com > Actualizar > plan > Siguiente > Suscribirse. Cancelar: Configuración > Cancelar membresía. Las suscripciones no vencen: se renuevan hasta cancelarlas."
frases: ["qué es google one", "google me ofrece pagar más almacenamiento", "dar de baja google one", "me cobran google one todos los meses"]
pasos:
  - texto: "Antes de pagar, fijate si podés liberar lugar: escribile a PC Doctor «Google Drive dice que no tengo espacio»."
  - texto: "Para comprar más: entrá a one.google.com con tu cuenta, a la izquierda hacé clic en «Actualizar», elegí el tamaño, revisá el precio y la fecha de pago, «Siguiente» y «Suscribirse»."
    abrir: "https://support.google.com/googleone/answer/2375123?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Para darlo de baja: en one.google.com, «Configuración» > «Cancelar membresía» > «Cancelar»."
  - texto: "Ojo: si cancelás y tenés guardado más de lo que entra en el plan gratis, Gmail, Fotos y Drive pueden dejar de funcionar bien hasta que liberes lugar."
fuentes:
  - https://support.google.com/googleone/answer/2375123?hl=es-419&co=GENIE.Platform%3DDesktop
