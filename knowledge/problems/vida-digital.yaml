id: VDG-016
area: programas
titulo:
  sencillo: "Compré algo en Google Play por error y quiero que me devuelvan la plata"
  tecnico: "Solicitar un reembolso de Google Play"
explicacion:
  sencillo: "Si compraste una app, un juego o algo dentro de una app por error (o lo compró un nieto con tu celular), podés pedir el reembolso desde la página de Google Play. Conviene hacerlo rápido."
  tecnico: "play.google.com > foto de perfil > Pagos y suscripciones > Historial de pedidos y presupuesto > Informar un problema. Compras dentro de apps con más de 48 h: contactar al desarrollador; cargos no autorizados: dentro de 120 días."
frases: ["mi nieto compró algo en un juego del celular", "me cobraron una compra dentro de una app", "devolución de una compra del play store", "compré una app sin querer"]
pasos:
  - texto: "En la compu entrá a play.google.com, tocá tu foto de perfil (arriba a la derecha) y elegí «Pagos y suscripciones» > «Historial de pedidos y presupuesto»."
    abrir: "https://support.google.com/googleplay/answer/15574897?hl=es-419"
  - texto: "En esa compra, hacé clic en «Informar un problema», elegí la opción que corresponde, aclará en el formulario que querés el reembolso y tocá «Enviar»."
  - texto: "La respuesta suele llegar en un día (puede tardar hasta cuatro). Mandar varias veces el mismo pedido no lo apura. Si no ves la compra, quizás se hizo con otra cuenta de Google."
  - texto: "Si es una compra dentro de una app y pasaron más de 48 horas, escribile a quien hizo la app. Si nadie de tu familia la hizo, denunciala dentro de los 120 días."
    abrir: "https://support.google.com/googleplay/answer/2479637?hl=es-419"
fuentes:
  - https://support.google.com/googleplay/answer/15574897?hl=es-419
  - https://support.google.com/googleplay/answer/2479637?hl=es-419
