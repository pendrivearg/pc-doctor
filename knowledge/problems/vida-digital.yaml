id: VDG-017
area: programas
titulo:
  sencillo: "Quiero dar de baja una suscripción que pago por Google Play"
  tecnico: "Cancelar una suscripción en Google Play"
explicacion:
  sencillo: "Muchas apps cobran todos los meses por Google Play. Borrar la app NO corta el cobro: hay que cancelar la suscripción. Igual la podés seguir usando hasta que termine el período que ya pagaste."
  tecnico: "Suscripciones de Google Play > Administrar > Cancelar suscripción > motivo > Continuar. Desinstalar la app no cancela; el acceso sigue hasta el fin del período pago."
frases: ["borré la app y me siguen cobrando", "cancelar una suscripción del play store", "darme de baja de una app que cobra todos los meses", "cómo dejo de pagar una app del celular"]
pasos:
  - texto: "En la compu, entrá a tus suscripciones de Google Play (play.google.com/store/account/subscriptions) con tu cuenta de Google."
    abrir: "https://support.google.com/googleplay/answer/7018481?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "En la suscripción que querés dar de baja, hacé clic en «Administrar» y después en «Cancelar suscripción»."
  - texto: "Elegí un motivo y tocá «Continuar». La seguís teniendo hasta que se termine lo que ya pagaste."
  - texto: "Desde el celular Android: en Google Play andá a tus suscripciones, elegí la suscripción y tocá «Cancelar suscripción»."
    abrir: "https://support.google.com/googleplay/answer/7018481?hl=es-419"
fuentes:
  - https://support.google.com/googleplay/answer/7018481?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.google.com/googleplay/answer/7018481?hl=es-419
