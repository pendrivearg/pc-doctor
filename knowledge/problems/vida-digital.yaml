id: VDG-010
area: archivos
titulo:
  sencillo: "Quiero firmar un documento desde el iPhone"
  tecnico: "Firmar un documento escaneado con Marcado en Notas (iPhone)"
explicacion:
  sencillo: "Si escaneaste un papel con Notas, lo podés firmar ahí mismo con el dedo, sin imprimir nada."
  tecnico: "Notas > documento escaneado > Marcado > Agregar > Firma (guardada o nueva) > ubicar y ajustar > Listo."
frases: ["firmar un papel con el iphone", "poner mi firma en un documento desde el celular de apple", "firmar con el dedo en el iphone", "agregar una firma en las notas del iphone"]
pasos:
  - texto: "Abrí Notas y tocá el documento escaneado que está dentro de la nota."
    abrir: "https://support.apple.com/es-lamr/108963"
  - texto: "Tocá «Marcado», después «Agregar» y «Firma». Usá una firma guardada o creá una nueva con el dedo."
  - texto: "Ajustá el tamaño del recuadro, ubicalo donde va la firma y tocá «Listo»."
  - texto: "Si preferís firmar a mano alzada: en «Marcado» elegí una herramienta y firmá con el dedo."
fuentes:
  - https://support.apple.com/es-lamr/108963
