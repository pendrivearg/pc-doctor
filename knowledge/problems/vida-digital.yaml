id: VDG-023
area: programas
titulo:
  sencillo: "Quiero anotar cosas o hacer la lista del súper en Google Keep"
  tecnico: "Crear notas y listas en Google Keep (keep.google.com)"
explicacion:
  sencillo: "Google Keep es un anotador gratis de Google: se usa desde el navegador entrando con tu cuenta de Google, y sirve para notas sueltas o listas con casillas para tildar."
  tecnico: "keep.google.com > Crear una nota > título y texto > Listo; Nueva lista > elementos > Cerrar."
frases: ["cómo se usa google keep", "anotar la lista del súper en la compu", "hacer una lista con casillas para tildar", "un anotador de google"]
pasos:
