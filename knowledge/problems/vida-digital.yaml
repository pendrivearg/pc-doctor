id: VDG-024
area: programas
titulo:
  sencillo: "Quiero mandarle a un familiar dónde estoy con Google Maps"
  tecnico: "Compartir la ubicación en tiempo real con Google Maps (Android)"
explicacion:
  sencillo: "Google Maps puede mostrarle a alguien de confianza dónde estás, durante el tiempo que elijas. Lo podés cortar cuando quieras."
  tecnico: "Maps > foto de perfil > Compartir ubicación > Compartir con alguien más > duración > contacto > Compartir; sin Gmail: vínculo de hasta 24 h; Detener."
frases: ["mandar mi ubicación a mi hija", "compartir dónde estoy en google maps", "que mi familia vea dónde ando", "mandar la ubicación en tiempo real"]
pasos:
  - texto: "En el celular, abrí Google Maps (con tu cuenta iniciada). Tocá tu foto o tu inicial > «Compartir ubicación» > «Compartir con alguien más»."
    abrir: "https://support.google.com/maps/answer/15437054?hl=es-419&co=GENIE.Platform%3DAndroid"
  - texto: "Elegí por cuánto tiempo, tocá a la persona (tiene que estar en tus contactos de Google con su Gmail) y tocá «Compartir»."
  - texto: "Si la persona no tiene Gmail, tocá «Copiar en el portapapeles» y mandale el vínculo: sirve hasta 24 horas."
  - texto: "Para cortar: tu foto o inicial > «Compartir ubicación» > tocá a la persona > «Detener». Compartí tu ubicación solo con gente de confianza."
fuentes:
  - https://support.google.com/maps/answer/15437054?hl=es-419&co=GENIE.Platform%3DAndroid
