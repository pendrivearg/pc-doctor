id: VDG-012
area: seguridad
titulo:
  sencillo: "Voy a comprar por Internet por primera vez: ¿qué tengo que cuidar?"
  tecnico: "Precauciones para compras y pagos en línea"
explicacion:
  sencillo: "Antes de pagar, fijate que la dirección empiece con «https» y que sea la página verdadera. No entres desde enlaces que te llegan por mensaje y evitá pagar desde una compu pública o un Wi-Fi público."
  tecnico: "HTTPS y candado o ícono de conexión segura; verificar el dominio; no usar enlaces de mensajes o ventanas emergentes; evitar equipos públicos y Wi-Fi público para datos sensibles."
frases: ["primera vez que compro por internet", "consejos para pagar online sin que me estafen", "puedo pagar con el wifi del bar", "me mandaron un link para pagar"]
pasos:
  - texto: "Entrá a la tienda escribiendo vos la dirección o desde tus favoritos, no desde un enlace que te llegó por mensaje o desde una ventanita que se abrió sola."
    abrir: "https://support.microsoft.com/security/protecting-yourself-from-identity-theft-online"
  - texto: "Antes de poner datos, fijate que la dirección empiece con «https», que el navegador la muestre como conexión segura y que sea la página verdadera, no una copia."
  - texto: "No pagues desde una compu pública ni conectado a un Wi-Fi público: su seguridad puede no ser confiable."
  - texto: "Si un mensaje o una oferta te apura, frená. Ante la duda, no pagues y llamá a tu banco al número que figura en la tarjeta."
  - texto: "Si ya pagaste y creés que la página era falsa, escribile a PC Doctor «compré en una página falsa»."
fuentes:
  - https://support.microsoft.com/security/protecting-yourself-from-identity-theft-online
madurez: T0
