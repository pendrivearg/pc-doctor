# Vida digital cotidiana: crear cuentas, contraseñas, PDF (firmar, completar, anotar), escanear con el celular, pagar seguro, QR, billeteras, compras y suscripciones de Google Play y Apple, Google One, iCloud, Keep, Maps y Fotos. Guiadas con fuente oficial de Microsoft, Google y Apple.
id: VDG-001
area: basico
titulo:
  sencillo: "Quiero crearle una cuenta de Google (Gmail) a mi mamá o a un abuelo"
  tecnico: "Crear una Cuenta de Google para uso personal"
explicacion:
  sencillo: "Con una cuenta de Google se usa Gmail, YouTube, Google Fotos y el Play Store del celular, y es gratis. Lo mejor es crearla con la persona al lado, con sus datos reales, y que la contraseña la elija ella."
  tecnico: "Acceso a la Cuenta de Google > Crear cuenta > Para uso personal; datos básicos, dirección de Gmail (o correo/teléfono existente), contraseña y luego información de recuperación."
frases: ["quiero hacerle un mail a mi vieja", "crear una cuenta de gmail para mi abuelo", "abrirle una cuenta de google a un familiar mayor", "cómo se saca una cuenta de gmail nueva"]
pasos:
  - texto: "Sentate con la persona: la cuenta es suya, así que el nombre y la fecha de nacimiento tienen que ser los de ella, reales."
  - texto: "Entrá a la página de acceso de Google, tocá «Crear cuenta» y en el menú que se despliega elegí «Para uso personal»."
    abrir: "https://support.google.com/accounts/answer/27441?hl=es-419"
  - texto: "Completá los datos. Elegí una de las direcciones de Gmail que te sugiere o escribí una propia, y después la contraseña: que la invente la persona (si querés ideas, escribile a PC Doctor «cómo invento una contraseña segura»)."
  - texto: "Agregá un teléfono o un correo de recuperación: si algún día se olvida la clave, es la forma de volver a entrar."
  - texto: "Anotá la dirección de Gmail que quedó. Si la contraseña se escribe en papel, guardala en un lugar privado, nunca pegada a la compu."
    abrir: "https://support.google.com/accounts/answer/32040?hl=es-419"
fuentes:
  - https://support.google.com/accounts/answer/27441?hl=es-419
  - https://support.google.com/accounts/answer/32040?hl=es-419
madurez: T0
