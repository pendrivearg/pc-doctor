id: VDG-002
area: basico
titulo:
  sencillo: "Quiero crear una cuenta de Microsoft (Outlook o Hotmail) nueva"
  tecnico: "Crear una cuenta de Microsoft gratuita"
explicacion:
  sencillo: "Con una cuenta de Microsoft entrás a Outlook, OneDrive y otros servicios de Microsoft con un solo usuario y contraseña. Se puede crear con un correo que ya tengas o sacando una dirección nueva de Outlook.com."
  tecnico: "Crear cuenta gratuita desde la página de soporte o desde outlook.com; una dirección ya usada en otra cuenta de Microsoft no se puede reutilizar."
frases: ["quiero hacerme un hotmail", "sacar una cuenta de outlook nueva", "crear cuenta de microsoft gratis", "abrir un correo de outlook para mi papá"]
pasos:
  - texto: "Abrí la página de Microsoft que explica cómo crear una cuenta y tocá el botón para crear una cuenta gratis."
    abrir: "https://support.microsoft.com/account-billing/how-to-create-a-new-microsoft-account-a84675c3-3e9e-17cf-2911-3d56b15c0aaf"
  - texto: "Podés usar un correo que ya tengas o sacar una dirección nueva de Outlook.com. Seguí los pasos con los datos reales de quien la va a usar."
  - texto: "Si no te deja crearla, probá con otro método (por ejemplo, con un correo en vez de un número de teléfono) o desde otro aparato."
  - texto: "Ojo: una dirección que ya se usó en otra cuenta de Microsoft no se puede volver a usar, aunque esa cuenta se haya cerrado hace mucho. Si es para un chico, un padre o tutor tiene que entrar para terminar la configuración."
fuentes:
  - https://support.microsoft.com/account-billing/how-to-create-a-new-microsoft-account-a84675c3-3e9e-17cf-2911-3d56b15c0aaf
madurez: T0
