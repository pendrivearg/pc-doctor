id: VDG-015
area: programas
titulo:
  sencillo: "¿Qué es Apple Pay y es seguro?"
  tecnico: "Apple Pay: requisitos y privacidad"
explicacion:
  sencillo: "Apple Pay permite pagar con el iPhone o el Apple Watch en negocios, apps y páginas. El comercio no recibe el número real de tu tarjeta: el teléfono usa un número propio y un código distinto en cada compra."
  tecnico: "Requiere dispositivo compatible actualizado, tarjeta de un emisor participante, cuenta de Apple y Face ID, Touch ID o código. Número de cuenta de dispositivo y código de seguridad dinámico; Apple no almacena el número original."
frases: ["qué es apple pay", "pagar con el iphone en el súper", "es seguro pagar con apple pay", "perdí el iphone y tenía apple pay"]
pasos:
  - texto: "Para usarlo necesitás un aparato de Apple actualizado, una tarjeta de un banco que lo acepte y el bloqueo con Face ID, Touch ID o código. La tarjeta se agrega desde la app Wallet."
    abrir: "https://support.apple.com/es-lamr/108398"
  - texto: "Cada pago se confirma con tu cara, tu huella o tu código, y Apple no guarda el número original de la tarjeta."
    abrir: "https://support.apple.com/es-lamr/101554"
  - texto: "Si perdés el iPhone, con «Encontrar» podés ponerlo en Modo perdido (suspende Apple Pay) o borrarlo. También podés llamar a tu banco para suspender la tarjeta."
  - texto: "PC Doctor nunca te va a pedir los datos de tu tarjeta ni tus códigos."
fuentes:
  - https://support.apple.com/es-lamr/108398
  - https://support.apple.com/es-lamr/101554
