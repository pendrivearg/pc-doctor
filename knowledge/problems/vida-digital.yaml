id: VDG-019
area: programas
titulo:
  sencillo: "Quiero ver y cancelar las suscripciones que pago con Apple"
  tecnico: "Ver o cancelar suscripciones de Apple (iPhone o PC con Windows)"
explicacion:
  sencillo: "Lo que pagás todos los meses con tu cuenta de Apple (Apple Music o apps, por ejemplo) se ve y se cancela en un solo lugar, desde el iPhone o desde la compu."
  tecnico: "iPhone: Configuración > nombre > Suscripciones. Windows: app Apple Music o Apple TV > nombre > Ver mi cuenta > Suscripciones > Administrar > Editar > Cancelar suscripción. También en account.apple.com."
frases: ["me cobra apple todos los meses y no sé qué es", "cancelar una suscripción del iphone", "dar de baja apple music", "ver qué suscripciones tengo en apple"]
pasos:
  - texto: "En el iPhone: Configuración > tocá tu nombre > «Suscripciones». Elegí la suscripción y tocá «Cancelar suscripción» (quizás tengas que bajar para verlo)."
    abrir: "https://support.apple.com/es-lamr/118428"
  - texto: "En la PC con Windows: abrí la app Apple Music o Apple TV, hacé clic en tu nombre abajo de la barra lateral y elegí «Ver mi cuenta». Junto a «Suscripciones» tocá «Administrar», buscá la suscripción, «Editar» y «Cancelar suscripción»."
  - texto: "Si no aparece el botón para cancelar, o ves en rojo la fecha en que vence, esa suscripción ya está cancelada."
  - texto: "Si es una prueba gratis, cancelala por lo menos 24 horas antes de que termine."
fuentes:
  - https://support.apple.com/es-lamr/118428
madurez: T0
