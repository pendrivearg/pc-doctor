id: VDG-005
area: archivos
titulo:
  sencillo: "Me mandaron un PDF para firmar y no tengo impresora"
  tecnico: "Firmar a mano alzada un PDF en Chrome o Edge"
explicacion:
  sencillo: "Chrome y Edge dejan dibujar sobre un PDF con el mouse, así ponés tu firma y guardás una copia firmada sin imprimir. Es una firma dibujada: si te piden una «firma digital» con certificado, eso es otra cosa."
  tecnico: "Visor PDF de Chrome: Dibujar > lápiz > firma > Listo > Descargar «Con tus cambios». Edge: entrada manuscrita (inking) en la barra de herramientas del PDF."
frases: ["firmar un pdf sin imprimirlo", "poner mi firma en un pdf en la compu", "me pidieron que firme un documento por mail", "cómo firmo un archivo pdf con el mouse"]
pasos:
  - texto: "Abrí el PDF con Chrome. Arriba elegí «Dibujar» y después el lápiz; podés elegir el tamaño y el color."
    abrir: "https://support.google.com/chrome/answer/16215622?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Acercá la página y dibujá tu firma con el mouse o el panel táctil. Si sale mal, usá la goma o «Deshacer». Al terminar, tocá «Listo»."
  - texto: "Para guardarlo, tocá «Descargar» y elegí «Con tus cambios». Ese archivo, ya firmado, es el que mandás."
  - texto: "En Edge también se puede: abrí el PDF y usá la herramienta de dibujo (entrada manuscrita) de la barra que aparece arriba del PDF."
    abrir: "https://learn.microsoft.com/deployedge/microsoft-edge-pdf"
fuentes:
  - https://support.google.com/chrome/answer/16215622?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://learn.microsoft.com/deployedge/microsoft-edge-pdf
madurez: T0
