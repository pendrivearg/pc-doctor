    abrir: "https://support.google.com/keep/answer/2888246?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Hacé clic en «Crear una nota», escribí un título y el texto, y tocá «Listo»."
  - texto: "Para una lista con casillas, arriba hacé clic en «Nueva lista», poné el título y los elementos, y tocá «Cerrar»."
  - texto: "Para corregir una nota, hacé clic en ella, cambiá lo que quieras y tocá «Listo»."
