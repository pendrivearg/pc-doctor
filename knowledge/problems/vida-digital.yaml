id: VDG-004
area: seguridad
titulo:
  sencillo: "Edge me sugiere una contraseña rara al registrarme: ¿la uso?"
  tecnico: "Generador de contraseñas de Microsoft Edge"
explicacion:
  sencillo: "Cuando te creás una cuenta en una página, Edge puede proponerte una contraseña larga y difícil. Si la aceptás, Edge la guarda y la completa sola la próxima vez, así no tenés que acordártela."
  tecnico: "Password Generator: sugerencia en el campo de contraseña de formularios de registro o de cambio de clave; se guarda en el administrador de contraseñas y se sincroniza; clic derecho > «Suggest strong password»."
frases: ["edge me propone una contraseña larguísima", "el navegador me inventa una clave", "aceptar la contraseña sugerida por edge", "me sale una contraseña sugerida al registrarme"]
pasos:
  - texto: "Cuando te registres o cambies la clave en una página, hacé clic en el casillero de la contraseña: Edge muestra debajo una contraseña sugerida."
    abrir: "https://support.microsoft.com/edge/use-password-generator-to-create-more-secure-passwords-in-microsoft-edge"
  - texto: "Si te sirve, elegila y terminá de enviar el formulario. Edge la guarda y la completa sola la próxima vez (y en tus otros aparatos, si tenés las contraseñas sincronizadas)."
  - texto: "Si no aparece la sugerencia, hacé clic derecho en el casillero de la contraseña y elegí la opción para sugerir una contraseña segura."
  - texto: "Si preferís inventarla vos, Edge te muestra mientras escribís qué tan fuerte es."
fuentes:
  - https://support.microsoft.com/edge/use-password-generator-to-create-more-secure-passwords-in-microsoft-edge
madurez: T0
