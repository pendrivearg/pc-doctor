id: VDG-011
area: seguridad
titulo:
  sencillo: "¿Cómo sé si una página es segura para pagar?"
  tecnico: "Indicador de conexión segura (HTTPS) en Chrome y Edge"
explicacion:
  sencillo: "Al lado de la dirección, el navegador muestra un ícono que dice si la conexión es segura. Pero «segura» solo quiere decir que los datos viajan protegidos: una página falsa también puede tenerlo. Por eso hay que mirar bien la dirección."
  tecnico: "HTTPS con certificado válido. Chrome: símbolo de estado a la izquierda de la URL (seguro, no seguro, peligroso). Edge: ícono de conexión (segura, no completamente segura, configuración obsoleta, sitio sospechoso)."
frases: ["cómo sé si una página es confiable para pagar", "qué significa el candadito al lado de la dirección", "la página dice no seguro", "es seguro poner la tarjeta en esta página"]
pasos:
  - texto: "Mirá a la izquierda de la dirección de la página: hacé clic en el ícono para ver si la conexión es segura."
    abrir: "https://support.google.com/chrome/answer/95617?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Si dice «No seguro», «Peligroso» o que la conexión no es completamente segura, no pongas datos personales ni de tarjeta."
    abrir: "https://support.microsoft.com/edge/securely-browse-the-web-in-microsoft-edge"
  - texto: "Aunque diga que es segura, leé con atención el nombre de la página: tiene que ser el sitio verdadero (por ejemplo, el de tu banco) y no uno parecido."
  - texto: "Ante la duda, no pagues: entrá escribiendo vos la dirección que conocés, o llamá a tu banco al número que figura en la tarjeta."
    abrir: "https://support.microsoft.com/security/protecting-yourself-from-identity-theft-online"
fuentes:
  - https://support.google.com/chrome/answer/95617?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.microsoft.com/edge/securely-browse-the-web-in-microsoft-edge
  - https://support.microsoft.com/security/protecting-yourself-from-identity-theft-online
madurez: T0
