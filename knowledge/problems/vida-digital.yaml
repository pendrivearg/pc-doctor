id: VDG-013
area: seguridad
titulo:
  sencillo: "Quiero leer un código QR con el celular sin caer en una trampa"
  tecnico: "Escanear códigos QR con la cámara del iPhone o Google Lens (Android)"
explicacion:
  sencillo: "Un código QR es un cuadradito que, cuando le apuntás con la cámara, te lleva a una página. Antes de abrirla, el celular te muestra el enlace: es el momento de mirar adónde te lleva."
  tecnico: "iPhone: app Cámara o Lector de códigos del Centro de control. Android: Chrome > Google Lens > Busca con la cámara. Verificar la URL y el estado de la conexión antes de ingresar datos."
frases: ["cómo leo un código qr", "escanear el qr del menú del restaurante", "el qr me pide datos de la tarjeta", "apuntar la cámara a un código qr"]
pasos:
  - texto: "En el iPhone: abrí la Cámara, apuntá al código hasta que aparezca en la pantalla y tocá el enlace que se muestra."
    abrir: "https://support.apple.com/es-lamr/102680"
  - texto: "En Android: abrí Chrome, una pestaña nueva, tocá el ícono de Google Lens en la barra de búsqueda y «Busca con la cámara». Poné el código dentro del cuadro y tocá el enlace."
    abrir: "https://support.google.com/chrome/answer/15086890?hl=es-419&co=GENIE.Platform%3DAndroid"
  - texto: "Antes de seguir, leé la dirección de la página que se abrió y el ícono de seguridad: si no es el sitio que esperabas, cerrala."
    abrir: "https://support.google.com/chrome/answer/95617?hl=es-419"
  - texto: "Si la página te pide claves, códigos o los datos de la tarjeta, no los pongas. Ante la duda, no pagues y llamá a tu banco al número que figura en la tarjeta."
fuentes:
  - https://support.apple.com/es-lamr/102680
  - https://support.google.com/chrome/answer/15086890?hl=es-419&co=GENIE.Platform%3DAndroid
  - https://support.google.com/chrome/answer/95617?hl=es-419
madurez: T0
