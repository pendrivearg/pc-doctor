id: VDG-018
area: programas
titulo:
  sencillo: "Quiero que no se pueda comprar nada en Google Play sin mi permiso"
  tecnico: "Verificación de compras en Google Play"
explicacion:
  sencillo: "Google Play puede pedir tu contraseña, tu huella o tu cara antes de cada compra. Así, si un nieto juega con tu celular, no puede comprar nada sin que vos lo autorices."
  tecnico: "Google Play > foto de perfil > Pagos y suscripciones > Verificación de compras > Frecuencia (o Requisito) de verificación: Siempre, Cada 30 minutos o Nunca; verificación biométrica opcional."
frases: ["que los chicos no compren en los jueguitos", "pedir contraseña para comprar en el play store", "evitar compras sin querer en el celular", "que el celular no compre solo en las apps"]
pasos:
  - texto: "Abrí la app Google Play, tocá tu foto de perfil arriba a la derecha y entrá a «Pagos y suscripciones» > «Verificación de compras»."
    abrir: "https://support.google.com/googleplay/answer/1626831?hl=es-419"
  - texto: "Entrá a «Frecuencia de verificación» (o «Requisito de verificación», según el país), elegí «Siempre» y confirmá el cambio. El celular te puede pedir tu contraseña de Google: escribila vos ahí."
  - texto: "Si preferís usar la huella o la cara, en esa misma sección activá la verificación biométrica."
  - texto: "Si ya se hizo una compra que no querías, escribile a PC Doctor «reembolso de Google Play»."
fuentes:
  - https://support.google.com/googleplay/answer/1626831?hl=es-419
madurez: T0
