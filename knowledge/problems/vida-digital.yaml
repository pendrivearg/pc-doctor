id: VDG-007
area: archivos
titulo:
  sencillo: "Quiero marcar con resaltador o dejar una nota en un PDF"
  tecnico: "Resaltado y notas de texto en el lector PDF de Edge"
explicacion:
  sencillo: "En Edge podés pintar con resaltador partes de un PDF y dejar comentarios, como harías con una birome en el papel. Además, Edge te lo puede leer en voz alta."
  tecnico: "Lector PDF de Edge: seleccionar texto > clic derecho > Resaltar (color) o Agregar comentario; Leer en voz alta; guardar desde la barra superior."
frases: ["resaltar un texto en un pdf", "pintar con color una parte del pdf", "dejar una nota en un pdf", "hacer anotaciones en un archivo pdf"]
pasos:
  - texto: "Abrí el PDF con Edge y seleccioná con el mouse el texto que querés marcar."
    abrir: "https://learn.microsoft.com/deployedge/microsoft-edge-pdf"
  - texto: "Hacé clic derecho sobre lo seleccionado, elegí la opción de resaltar y el color que quieras."
  - texto: "Para dejar una nota: seleccioná el texto, clic derecho > «Agregar comentario», escribí y tocá la tilde para guardarla."
  - texto: "Antes de cerrar, tocá «Guardar» en la barra de arriba del PDF para que las marcas queden en el archivo."
    abrir: "https://www.microsoft.com/en-us/edge/learning-center/how-to-use-pdf-reader-in-microsoft-edge"
fuentes:
  - https://learn.microsoft.com/deployedge/microsoft-edge-pdf
  - https://www.microsoft.com/en-us/edge/learning-center/how-to-use-pdf-reader-in-microsoft-edge
madurez: T0
