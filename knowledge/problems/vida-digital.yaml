id: VDG-006
area: archivos
titulo:
  sencillo: "Tengo que completar un formulario en PDF desde la compu"
  tecnico: "Completar los campos de un formulario PDF en Microsoft Edge"
explicacion:
  sencillo: "Muchos formularios en PDF (de un trámite, de la obra social) traen casilleros para escribir. Edge los deja completar y guardar sin imprimir. Algunos formularios de tipo viejo o especial no funcionan en el navegador."
  tecnico: "Edge: opción de edición (Edit) en la barra superior del PDF, completar campos, Guardar. Relleno básico de formularios; los formularios XFA y con JavaScript no son compatibles."
frases: ["llenar un pdf en la computadora", "escribir en los casilleros de un pdf", "rellenar la planilla pdf del trámite", "el pdf tiene campos para llenar y no sé cómo"]
pasos:
  - texto: "Abrí el PDF con Edge. En la barra de arriba del PDF elegí la opción para editar (si Edge está en inglés, dice «Edit»)."
    abrir: "https://www.microsoft.com/en-us/edge/learning-center/how-to-use-pdf-reader-in-microsoft-edge"
  - texto: "Hacé clic en cada casillero en blanco y escribí tus datos."
  - texto: "Al terminar, tocá «Guardar» en la barra de arriba, elegí la carpeta y el nombre, y guardá. Ese es el archivo que mandás."
  - texto: "Si no te deja escribir, puede ser un formulario de un tipo que Edge no admite (XFA o con programación JavaScript). Pedile a quien te lo mandó otra versión."
    abrir: "https://learn.microsoft.com/deployedge/microsoft-edge-pdf"
fuentes:
  - https://www.microsoft.com/en-us/edge/learning-center/how-to-use-pdf-reader-in-microsoft-edge
  - https://learn.microsoft.com/deployedge/microsoft-edge-pdf
madurez: T0
