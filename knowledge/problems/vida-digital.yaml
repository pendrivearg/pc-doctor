id: VDG-014
area: programas
titulo:
  sencillo: "¿Qué es la Billetera de Google (Google Wallet)?"
  tecnico: "Billetera de Google: qué es y qué necesita"
explicacion:
  sencillo: "Es una app del celular Android que guarda tarjetas, entradas, pases y otros carnets, para pagar acercando el teléfono en los negocios que aceptan pago sin contacto. La app Google Pay ahora se llama Billetera de Google."
  tecnico: "Requiere Cuenta de Google, Android 9 o posterior, bloqueo de pantalla y, para pagar sin contacto, NFC activado y Google Pay como app de pagos predeterminada."
frases: ["qué es google wallet", "pagar con el celular android en el negocio", "la app google pay ahora se llama billetera", "para qué sirve la billetera de google"]
pasos:
  - texto: "Leé qué es y qué se puede guardar en la ayuda oficial de Google."
    abrir: "https://support.google.com/wallet/answer/11951709?hl=es-419"
  - texto: "Para usarla hace falta un celular con Android 9 o más nuevo, una cuenta de Google, el bloqueo de pantalla configurado y, para pagar acercando el teléfono, el NFC activado."
    abrir: "https://support.google.com/wallet/answer/12059331?hl=es-419"
  - texto: "La tarjeta la cargás vos, con calma, en la app de tu celular. PC Doctor nunca te va a pedir los datos de tu tarjeta."
  - texto: "Google no te pide contraseñas, PIN ni datos bancarios: si alguien te llama o te escribe para «ayudarte a configurarla» y te pide eso, es una estafa. Cortá y llamá a tu banco al número de la tarjeta."
    abrir: "https://support.google.com/googlepay/answer/10223857?hl=es-419"
fuentes:
  - https://support.google.com/wallet/answer/11951709?hl=es-419
  - https://support.google.com/wallet/answer/12059331?hl=es-419
  - https://support.google.com/googlepay/answer/10223857?hl=es-419
