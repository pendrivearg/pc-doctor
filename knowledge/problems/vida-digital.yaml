id: VDG-008
area: archivos
titulo:
  sencillo: "Quiero escanear un papel con el celular Android (con Google Drive)"
  tecnico: "Escanear documentos a PDF con la app Google Drive (Android)"
explicacion:
  sencillo: "No hace falta escáner: la app Google Drive del celular le saca una foto al papel, la recorta y la guarda como PDF en tu Drive. Después la podés ver o bajar desde la compu."
  tecnico: "App Google Drive: botón Cámara > captura > recortar, girar, filtro, Agregar páginas > Listo > nombre, formato PDF o JPG, Ubicación > Guardar."
frases: ["escanear un documento con el celular", "pasar un papel a pdf con el teléfono", "no tengo escáner y necesito mandar un papel", "sacarle foto a una receta y mandarla en pdf"]
pasos:
  - texto: "Abrí la app Google Drive en el celular y tocá el botón «Cámara», abajo a la derecha."
    abrir: "https://support.google.com/drive/answer/3145835?hl=es-419&co=GENIE.Platform%3DAndroid"
  - texto: "Apuntá al papel (una línea azul marca lo que se va a recortar) y sacá la foto. Podés recortar, girar, cambiar el filtro y tocar «Agregar» para sumar otra hoja."
  - texto: "Tocá «Listo», poné un nombre, elegí el formato .pdf y tocá «Guardar». Con «Ubicación» elegís la carpeta donde queda."
  - texto: "Para tenerlo en la compu, entrá a Google Drive desde el navegador y descargalo (escribile a PC Doctor «bajar un archivo de Google Drive»)."
fuentes:
  - https://support.google.com/drive/answer/3145835?hl=es-419&co=GENIE.Platform%3DAndroid
madurez: T0
