id: VDG-009
area: archivos
titulo:
  sencillo: "Quiero escanear un papel con el iPhone"
  tecnico: "Escanear documentos con la app Notas (iPhone)"
explicacion:
  sencillo: "La app Notas del iPhone funciona como escáner: apuntás la cámara al papel, lo recorta solo y lo guarda dentro de una nota."
  tecnico: "Notas > nota > Archivo adjunto (clip) > Escanear documentos (o Más > Escanear); captura automática o manual; Conservar; Listo."
frases: ["escanear con el iphone", "pasar un documento a pdf con el iphone", "usar las notas del iphone como escáner", "sacar una copia de un papel con el iphone"]
pasos:
  - texto: "Abrí Notas y entrá a una nota (o creá una nueva). Tocá el botón de adjuntar (el clip) y elegí «Escanear documentos». En algunas versiones está en «Más» > «Escanear»."
    abrir: "https://support.apple.com/es-lamr/108963"
  - texto: "Apuntá la cámara al papel. Se escanea solo; si no, tocá el botón para sacar la foto o un botón de volumen. Ajustá las esquinas y tocá «Conservar»."
  - texto: "Agregá más hojas si hace falta y tocá «Listo». El documento queda guardado en la nota."
  - texto: "Si además lo tenés que firmar, escribile a PC Doctor «firmar un documento en el iPhone»."
fuentes:
  - https://support.apple.com/es-lamr/108963
madurez: T0
