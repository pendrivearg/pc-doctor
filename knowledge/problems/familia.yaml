id: FAMX-006
area: seguridad
titulo:
  sencillo: "Quiero que mi hijo no entre a páginas para adultos en internet"
  tecnico: "Family Safety: filtrar sitios web y búsquedas en Microsoft Edge"
explicacion:
  sencillo: "Family Safety puede bloquear páginas para adultos y filtrar las búsquedas de Bing cuando el chico navega con Microsoft Edge entrando con su cuenta."
  tecnico: "Family Safety > miembro > Edge > Filtrar sitios web y búsquedas inapropiados; funciona en Edge con sesión iniciada (Windows, Xbox, móvil)."
frases: ["bloquear páginas porno en la compu de mi hijo", "filtro de internet para los chicos en edge", "que mi nieto no pueda ver páginas de adultos", "activar el filtro web de microsoft family"]
pasos:
  - texto: "Entrá a tu cuenta de Microsoft, elegí «Family Safety» en el menú de la izquierda, buscá al chico y tocá «Ir a la información general»."
    abrir: "https://account.microsoft.com/family"
  - texto: "Elegí «Edge» como plataforma y activá «Filtrar sitios web y búsquedas inapropiados»."
    abrir: "https://support.microsoft.com/es-es/family-safety/filter-websites-and-searches-using-microsoft-family-safety"
  - texto: "El filtro funciona cuando el chico navega con Microsoft Edge entrando con su cuenta de Microsoft. Por eso, con el filtro activado, los otros navegadores quedan bloqueados para que no lo pueda esquivar."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/filter-websites-and-searches-using-microsoft-family-safety
madurez: T0
