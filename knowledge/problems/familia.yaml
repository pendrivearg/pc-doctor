id: FAMX-014
area: seguridad
titulo:
  sencillo: "Mi hijo no puede entrar al Minecraft u otro juego: dice que el padre bloqueó el acceso"
  tecnico: "Cuenta de menor sin consentimiento para aplicaciones de terceros"
explicacion:
  sencillo: "Si al chico le aparece que su padre bloqueó el acceso a juegos y aplicaciones que no son de Microsoft, es porque al dar el permiso para su cuenta no se marcó la opción de apps de otras empresas. El adulto que dio el permiso lo puede habilitar."
  tecnico: "Error «Tu padre ha bloqueado el acceso a los juegos y aplicaciones que no publica Microsoft»: account.live.com/mk > Administrar el acceso de este menor a aplicaciones de terceros > Habilitar acceso."
frases: ["mi hijo no puede entrar al minecraft con su cuenta", "dice que tu padre bloqueó el acceso a los juegos", "mi nieto no puede jugar porque falta un permiso", "el juego no deja entrar al nene con la cuenta de microsoft"]
pasos:
  - texto: "Lo tiene que hacer el adulto que dio el permiso original para la cuenta del chico (aunque haya otro organizador en la familia)."
    abrir: "https://support.microsoft.com/es-es/family-safety/my-child-is-not-able-to-access-3rd-party-apps"
  - texto: "Entrá con tu cuenta de Microsoft a la página de cuentas de menores que indica Microsoft (account.live.com/mk). Vas a ver la lista de chicos de los que sos responsable."
  - texto: "Junto al chico, elegí «Administrar el acceso de este menor a aplicaciones de terceros» y tocá «Habilitar acceso». Para volver a bloquearlo, «Deshabilitar acceso»."
  - texto: "Si no ves al chico en la lista, el permiso lo dio otro adulto u otra cuenta. Si no aparece «Habilitar acceso», el acceso ya está habilitado y el problema es otro."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/my-child-is-not-able-to-access-3rd-party-apps
madurez: T0
