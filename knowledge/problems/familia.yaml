id: FAMX-005
area: seguridad
titulo:
  sencillo: "Quiero que mi hijo no pueda abrir un juego o una aplicación"
  tecnico: "Family Safety: bloquear o desbloquear una aplicación"
explicacion:
  sencillo: "Si no querés que el chico use un programa o juego, lo podés bloquear desde tu cuenta. Cuando quieras, lo desbloqueás de la misma manera."
  tecnico: "Family Safety > miembro > plataforma > Aplicaciones, características y juegos > ⋮ > Bloquear aplicación / Desbloquear aplicación. Solo organizadores."
frases: ["bloquear un juego en la compu de mi nieto", "que mi hijo no pueda abrir una aplicación", "desbloquear un programa que bloqueé con family safety", "prohibir un jueguito en la computadora del nene"]
pasos:
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta de organizador y tocá la tarjeta del chico."
    abrir: "https://account.microsoft.com/family"
  - texto: "Elegí la pestaña del aparato («Windows», «Xbox» o el celular) y después «Aplicaciones, características y juegos»."
    abrir: "https://support.microsoft.com/es-es/family-safety/block-or-unblock-apps-with-microsoft-family-safety"
  - texto: "Al lado del juego o la app, tocá los tres puntitos y elegí «Bloquear aplicación». Para devolvérsela, los mismos tres puntitos > «Desbloquear aplicación»."
  - texto: "Hay que hacerlo con cada app, en cada aparato y para cada chico."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/block-or-unblock-apps-with-microsoft-family-safety
madurez: T0
