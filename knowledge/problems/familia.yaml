id: FAMX-003
area: seguridad
titulo:
  sencillo: "Mi nieto se pasa horas en la Xbox y quiero ponerle un límite"
  tecnico: "Family Safety: límites de tiempo en Xbox"
explicacion:
  sencillo: "Microsoft Family Safety también pone límites de tiempo en la consola Xbox, igual que en la compu. Ojo: el tiempo sigue corriendo mientras el chico tenga la sesión abierta en la consola."
  tecnico: "Family Safety > miembro > pestaña Xbox > límites por día; el tiempo cuenta mientras la sesión esté iniciada."
frases: ["mi nieto juega a la play de microsoft todo el día", "poner horario a la xbox de mi hijo", "limitar el tiempo de juego en la xbox", "la xbox no corta nunca"]
pasos:
  - texto: "El chico tiene que entrar a la Xbox con su cuenta de Microsoft, la misma que está en tu grupo familiar."
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta de organizador (o a la app Microsoft Family Safety), tocá al chico y elegí la pestaña «Xbox»."
    abrir: "https://account.microsoft.com/family"
  - texto: "Tocá un día y poné el horario y las horas permitidas. Si no aparecen límites, tocá «Activar límites»."
    abrir: "https://support.microsoft.com/es-es/family-safety/set-screen-time-limits-across-devices"
  - texto: "Pedile que cierre la sesión cuando deja de jugar: si queda abierta, el tiempo sigue contando."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/set-screen-time-limits-across-devices
madurez: T0
