id: FAMX-007
area: seguridad
titulo:
  sencillo: "Quiero bloquear (o permitir) una página puntual para mi hijo"
  tecnico: "Family Safety: sitios bloqueados, sitios permitidos y «solo sitios permitidos»"
explicacion:
  sencillo: "Además del filtro general, podés agregar páginas que querés bloquear siempre, o páginas que siempre van a estar permitidas. Para los más chicos, podés hacer que solo puedan entrar a las páginas que vos elegiste."
  tecnico: "Family Safety > miembro > Edge > Sitios bloqueados / Sitios permitidos; Usar solo sitios web permitidos."
frases: ["bloquear una página en especial para mi hijo", "que mi nieto solo pueda entrar a las páginas del colegio", "el filtro le bloquea una página de la escuela", "agregar una página permitida en family safety"]
pasos:
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta de organizador, tocá al chico y elegí «Edge»."
    abrir: "https://account.microsoft.com/family"
  - texto: "Escribí la dirección de la página en «Sitios bloqueados» (para que no entre nunca) o en «Sitios permitidos» (para que pueda entrar siempre)."
    abrir: "https://support.microsoft.com/es-es/family-safety/filter-websites-and-searches-using-microsoft-family-safety"
  - texto: "Para un chico chiquito, activá «Usar solo sitios web permitidos»: solo va a poder entrar a las páginas de tu lista."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/filter-websites-and-searches-using-microsoft-family-safety
madurez: T0
