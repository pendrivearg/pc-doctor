id: FAMX-024
area: seguridad
titulo:
  sencillo: "A mi hijo lo están molestando o burlando por internet"
  tecnico: "Ciberacoso: pruebas, bloqueo y denuncia"
explicacion:
  sencillo: "El ciberacoso son burlas, amenazas o humillaciones por chat, redes o videos. Al chico le hace mucho daño. Se puede bloquear a quien molesta, denunciarlo en la página y, si hay amenazas, hacer la denuncia ante las autoridades."
  tecnico: "Bloquear y denunciar al usuario en la plataforma; en YouTube, denunciar videos, canales o comentarios y moderar comentarios; contactar a las autoridades locales."
frases: ["le hacen bullying a mi nieto por internet", "le dejan comentarios feos a mi hija en sus videos", "se burlan de mi hijo en las redes", "mi hijo recibe amenazas por el chat"]
pasos:
  - texto: "Escuchá al chico sin retarlo ni sacarle el celular de castigo: lo importante es que siga contándote. Que no conteste las agresiones."
  - texto: "Guardá pruebas: capturas de pantalla con los mensajes, los nombres de usuario y las fechas."
  - texto: "Bloqueá a quien lo molesta y denuncialo en la página. En YouTube se pueden denunciar videos, canales y comentarios, y el chico puede borrar o revisar los comentarios de su canal antes de que se publiquen."
    abrir: "https://support.google.com/youtube/answer/2802272?hl=es-419"
  - texto: "Si hay amenazas o el acoso sigue, hacé la denuncia ante las autoridades. Google recomienda consultarlas enseguida."
    abrir: "https://support.google.com/families/answer/7182800?hl=es-419"
fuentes:
  - https://support.google.com/youtube/answer/2802272?hl=es-419
  - https://support.google.com/families/answer/7182800?hl=es-419
madurez: T0
