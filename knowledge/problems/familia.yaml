id: FAMX-009
area: seguridad
titulo:
  sencillo: "Quiero ver qué hace mi hijo en la compu y cuánto tiempo"
  tecnico: "Family Safety: informe de actividades"
explicacion:
  sencillo: "Family Safety te puede mostrar cuánto tiempo usó el chico la compu o la Xbox, qué juegos y programas abrió, qué páginas visitó y qué buscó en Bing. Sirve para charlar con él, no para espiarlo a escondidas."
  tecnico: "Family Safety > miembro > Informe de actividades (Windows, Xbox, Seguridad web, Móvil): apps y juegos, web y búsqueda, tiempo en pantalla. Solo organizadores."
frases: ["ver qué páginas visitó mi hijo", "saber cuánto tiempo estuvo mi nieto en la compu", "qué juegos usó el nene hoy", "ver lo que buscó mi hija en internet"]
pasos:
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta de organizador y tocá la tarjeta del chico."
    abrir: "https://account.microsoft.com/family"
  - texto: "Activá el «Informe de actividades» en cada plataforma que quieras ver: Windows, Xbox, Seguridad web o celular."
    abrir: "https://support.microsoft.com/es-es/family-safety/view-device-and-app-use-with-family-safety-activity-reporting"
  - texto: "Elegí la plataforma y mirá «Aplicaciones, características y juegos», las páginas y búsquedas, y el tiempo de pantalla de cada día y de la semana."
  - texto: "Las páginas solo se registran si el chico navega con un navegador compatible (Edge) entrando con su cuenta."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/view-device-and-app-use-with-family-safety-activity-reporting
madurez: T0
