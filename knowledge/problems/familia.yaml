id: FAMX-017
area: seguridad
titulo:
  sencillo: "Mi hijo ya tiene cuenta de Google y quiero supervisarla"
  tecnico: "Agregar supervisión de Family Link a una Cuenta de Google existente"
explicacion:
  sencillo: "Si el chico o adolescente ya tiene su cuenta de Google, podés sumarle la supervisión de Family Link. Él tiene que estar de acuerdo y tener el celular al lado tuyo mientras lo configuran."
  tecnico: "Configuración > Google > Todos los servicios > Controles parentales (Android) o Configuración > Cuentas > Controles parentales (Chromebook); requiere consentimiento del menor y mismo país."
frases: ["quiero supervisar la cuenta de google de mi hijo adolescente", "mi hija ya tiene gmail y quiero controlarlo", "agregar family link a una cuenta que ya existe", "cómo pongo control de padres en el celular de mi hijo"]
pasos:
  - texto: "Necesitás tu propia cuenta de Google y ser mayor de edad. Tu hijo tiene que vivir en el mismo país que vos, aceptar la supervisión y estar con su celular al lado tuyo."
    abrir: "https://support.google.com/families/answer/9055704?hl=es-419"
  - texto: "En el celular Android del chico: abrí «Configuración», tocá «Google» y después «Todos los servicios». En «Niños y familia», tocá «Controles parentales» y después «Comenzar»."
  - texto: "Elegí la cuenta del chico y seguí los pasos. Él va a tener que dar su consentimiento durante el proceso."
  - texto: "Después instalá la app Family Link en tu celular para manejar sus límites y permisos. Ojo: un menor de 18 no puede sacar la supervisión sin tu aprobación."
fuentes:
  - https://support.google.com/families/answer/9055704?hl=es-419
madurez: T0
