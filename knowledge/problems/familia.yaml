id: FAMX-022
area: seguridad
titulo:
  sencillo: "Quiero que mi hijo use YouTube común pero con una cuenta supervisada"
  tecnico: "Cuenta infantil supervisada en YouTube (families.youtube.com)"
explicacion:
  sencillo: "Para chicos que ya quieren dejar YouTube Kids, Google tiene cuentas supervisadas de YouTube: el padre elige un nivel de contenido y quedan apagados los comentarios, subir videos y las compras."
  tecnico: "Cuenta infantil supervisada de YouTube: parámetro de contenido «Niños mayores», «Adolescentes» o «Adolescentes mayores»; se configura en families.youtube.com o con Family Link."
frases: ["mi nieto ya es grande para youtube kids", "pasar a mi hijo de youtube kids a youtube normal", "youtube supervisado para un chico de 11 años", "elegir qué videos ve mi hijo en youtube común"]
pasos:
  - texto: "El chico tiene que tener su propia cuenta de Google (si no la tiene, escribile a PC Doctor «crear una cuenta de google para mi hijo»)."
    abrir: "https://support.google.com/youtube/answer/10314074?hl=es-419"
  - texto: "Desde la compu: entrá a families.youtube.com con tu cuenta de Google de padre o madre, elegí al chico de tu grupo familiar y seguí los pasos."
  - texto: "Elegí el nivel de contenido: «Niños mayores» (en general, desde 9 años), «Adolescentes» (desde 13) o «Adolescentes mayores» (desde 16). Lo podés cambiar cuando quieras."
    abrir: "https://support.google.com/youtube/answer/10315823?hl=es-419"
  - texto: "Con esta cuenta el chico no puede comentar, subir videos, hacer transmisiones ni comprar."
    abrir: "https://support.google.com/youtube/answer/10314940?hl=es-419"
fuentes:
  - https://support.google.com/youtube/answer/10314074?hl=es-419
  - https://support.google.com/youtube/answer/10315823?hl=es-419
  - https://support.google.com/youtube/answer/10314940?hl=es-419
