id: FAMX-012
area: seguridad
titulo:
  sencillo: "Soy adulto y la compu me pone límites como si fuera un chico"
  tecnico: "Configuración de Family Safety aplicada a un adulto"
explicacion:
  sencillo: "A veces a un adulto le aparecen límites de tiempo o páginas bloqueadas de Family Safety. Pasa si sos «Miembro» de un grupo familiar (el organizador maneja tus ajustes) o si la compu quedó con ajustes viejos de un grupo anterior."
  tecnico: "Miembro de grupo familiar: solo el organizador cambia los ajustes. Sin grupo u organizador con ajustes residuales: ejecutar la tarea FamilySafetyRefreshTask y reiniciar."
frases: ["me aparece control parental y soy grande", "la compu me bloquea páginas como si fuera un nene", "family safety me pone límite de tiempo a mí", "me sale que tengo que pedirle permiso a un adulto y soy adulto"]
pasos:
  - texto: "Fijate en qué grupo familiar estás y con qué papel: entrá a la página de familia de Microsoft con tu cuenta."
    abrir: "https://account.microsoft.com/family"
  - texto: "Si sos «Miembro», solo el organizador puede sacarte los filtros y los límites: pedile que los desactive en tu cuenta, o que te saque del grupo."
    abrir: "https://support.microsoft.com/es-es/family-safety/family-safety-settings-enforced-on-adults"
  - texto: "Si no estás en ningún grupo, o sos organizador y la compu igual te limita: apretá Windows + R, escribí cmd y aceptá. En la ventana negra escribí schtasks /run /tn Microsoft\\Windows\\Shell\\FamilySafetyRefreshTask, apretá Enter y reiniciá la compu."
  - texto: "Si te sigue pasando, escribile a PC Doctor «sacar a alguien de mi grupo familiar de Microsoft»."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/family-safety-settings-enforced-on-adults
madurez: T0
