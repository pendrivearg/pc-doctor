id: FAMX-013
area: seguridad
titulo:
  sencillo: "A mi nieto la cuenta de Microsoft le pide permiso de un adulto"
  tecnico: "Consentimiento parental para cuentas Microsoft de menores"
explicacion:
  sencillo: "Si la cuenta de Microsoft es de un menor de edad, Microsoft pide que un adulto dé su permiso por correo. Es una exigencia de las leyes de protección de chicos. Lo da un padre, madre o tutor desde su propia cuenta."
  tecnico: "Solicitud de consentimiento por correo al adulto; el adulto inicia sesión y aprueba; se gestiona en Administrar permisos. Se vuelve a pedir si se quita el consentimiento o lo exige la normativa."
frases: ["a mi nieto le pide el permiso de los padres para entrar", "la cuenta de microsoft de mi hijo dice que necesita un adulto", "me llegó un mail para dar permiso a la cuenta de mi hija", "qué es el consentimiento parental de microsoft"]
pasos:
  - texto: "Cuando el chico entra, le pide el correo de un adulto. Poné el de su padre, madre o tutor (por ejemplo, el tuyo)."
    abrir: "https://support.microsoft.com/es-es/family-safety/managing-parental-consent"
  - texto: "Al adulto le llega un correo: tocá el enlace, entrá con tu propia cuenta de Microsoft y aprobá el pedido. No le pases tu clave al chico: el permiso se da desde tu cuenta."
  - texto: "Si en realidad el chico no es menor y la fecha de nacimiento está mal, Microsoft tiene una herramienta para corregirla desde esa misma página."
  - texto: "Para revisar o quitar un permiso que diste, usá «Administrar permisos». Solo lo puede quitar el adulto que lo dio."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/managing-parental-consent
madurez: T0
