id: FAMX-008
area: seguridad
titulo:
  sencillo: "En la cuenta de mi hijo no abre Chrome (u otro navegador)"
  tecnico: "Family Safety bloquea navegadores no compatibles con el filtro web"
explicacion:
  sencillo: "Cuando activás el filtro de páginas de Family Safety, Windows bloquea los navegadores que no son Microsoft Edge, para que el chico no pueda saltearse el filtro. Si querés, un adulto puede desbloquear ese navegador."
  tecnico: "Con el filtrado web activo, los exploradores no compatibles se bloquean; se desbloquean desde los filtros de aplicaciones y juegos (Desbloquear aplicación)."
frases: ["a mi hijo no le abre el chrome", "en la cuenta del nene chrome está bloqueado", "dice que necesita permiso para usar google chrome", "family safety no deja usar otro navegador"]
pasos:
  - texto: "Es a propósito: el filtro de páginas solo funciona en Microsoft Edge, así que Family Safety bloquea los otros navegadores para que no se pueda esquivar."
    abrir: "https://support.microsoft.com/es-es/family-safety/filter-websites-and-searches-using-microsoft-family-safety"
  - texto: "Lo más seguro es que el chico use Microsoft Edge entrando con su cuenta."
  - texto: "Si igual querés permitir Chrome, entrá a la página de familia con tu cuenta de organizador, tocá al chico, pestaña «Windows» > «Aplicaciones, características y juegos», y en los tres puntitos al lado de Chrome elegí «Desbloquear aplicación». Ojo: en Chrome no va a tener el filtro de Microsoft."
    abrir: "https://support.microsoft.com/es-es/family-safety/block-or-unblock-apps-with-microsoft-family-safety"
fuentes:
  - https://support.microsoft.com/es-es/family-safety/filter-websites-and-searches-using-microsoft-family-safety
  - https://support.microsoft.com/es-es/family-safety/block-or-unblock-apps-with-microsoft-family-safety
madurez: T0
