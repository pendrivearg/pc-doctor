id: FAMX-015
area: seguridad
titulo:
  sencillo: "Puse límites con Family Safety pero en la compu del chico no funcionan"
  tecnico: "Family Safety: límites o filtros que no se aplican en Windows"
explicacion:
  sencillo: "Los límites solo funcionan si el chico entra a la compu con su cuenta, que esté en tu grupo familiar y que no sea administrador. Si su usuario es administrador, puede cambiar o romper los controles."
  tecnico: "Requisitos: cuenta del menor en el grupo, cuenta verificada (Cuentas > Comprobar) y tipo de cuenta Usuario estándar; probar quitar y volver a agregar los límites; zona horaria correcta."
frases: ["el control parental no le hace nada a mi hijo", "family safety no bloquea la compu del nene", "mi nieto sigue usando la compu después de la hora", "los límites de microsoft family no se aplican"]
pasos:
  - texto: "Fijate que el chico entre a la compu con su propia cuenta y que esa cuenta esté en tu grupo familiar."
    abrir: "ms-settings:family-group"
  - texto: "Su usuario tiene que ser estándar, no administrador. Entrando con tu cuenta de adulto, en la lista de otras cuentas elegí la del chico, tocá «Cambiar tipo de cuenta» y elegí usuario estándar (no administrador)."
    abrir: "ms-settings:otherusers"
  - texto: "Si su cuenta de Microsoft venció, que entre con ella en la compu y vaya a Configuración > Cuentas: si aparece «Comprobar», que lo toque y siga los pasos."
    abrir: "https://support.microsoft.com/es-es/family-safety/troubleshooting-microsoft-family-safety"
  - texto: "Probá sacar los límites de tiempo y volver a ponerlos desde la página de familia. Y asegurate de que solo los adultos conozcan las claves de sus cuentas."
    abrir: "https://account.microsoft.com/family"
fuentes:
  - https://support.microsoft.com/es-es/family-safety/troubleshooting-microsoft-family-safety
madurez: T0
