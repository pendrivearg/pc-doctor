id: FAMX-010
area: basico
titulo:
  sencillo: "Quiero sacar a alguien de mi grupo familiar de Microsoft"
  tecnico: "Quitar miembros o abandonar el grupo familiar de Microsoft"
explicacion:
  sencillo: "El organizador del grupo familiar puede sacar a una persona, o salir él mismo. Quien sale pierde lo que se compartía, como Microsoft 365 Familia y los controles de Family Safety."
  tecnico: "account.microsoft.com/family > ⋮ > Quitar del grupo familiar / Abandonar grupo familiar; en menores, antes Quitar consentimiento."
frases: ["sacar a alguien de mi familia de microsoft", "quitar a mi nieto del grupo familiar", "salir del grupo familiar de microsoft", "borrar el grupo de familia de microsoft"]
pasos:
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta. Solo un «Organizador» puede sacar a otros."
    abrir: "https://account.microsoft.com/family"
  - texto: "Tocá los tres puntitos al lado del nombre de la persona, elegí «Quitar del grupo familiar» y confirmá con «Quitar». Si es un menor y no aparece esa opción, primero elegí «Quitar consentimiento para la cuenta de este menor»."
    abrir: "https://support.microsoft.com/es-es/family-safety/how-to-leave-a-microsoft-family-group"
  - texto: "Para salir vos, tocá los tres puntitos al lado de tu nombre > «Abandonar grupo familiar» > «Quitar». Para borrar el grupo entero, primero sacá a todos los demás y después salí vos."
  - texto: "Ojo: quien sale pierde Microsoft 365 Familia compartido y los controles de Family Safety."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/how-to-leave-a-microsoft-family-group
madurez: T0
