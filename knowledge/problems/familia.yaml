id: FAMX-021
area: seguridad
titulo:
  sencillo: "Quiero que Google no le muestre cosas para adultos a mi nieto cuando busca"
  tecnico: "SafeSearch en la Búsqueda de Google"
explicacion:
  sencillo: "SafeSearch es un filtro de Google que esconde desnudos, violencia fuerte y otras cosas explícitas en los resultados de búsqueda. Funciona solo en la Búsqueda de Google, no en otros buscadores ni dentro de otras páginas."
  tecnico: "google.com/safesearch: Filtrar, Desenfocar o Desactivado; en cuentas de Family Link queda bloqueado en Filtrar y solo lo cambia el padre."
frases: ["activar el filtro de google para los chicos", "que en google no aparezcan fotos de desnudos", "qué es safesearch", "mi nieto busca en google y le salen cosas feas"]
pasos:
  - texto: "Entrá a la configuración de SafeSearch de Google (google.com/safesearch) en el navegador que usa el chico."
    abrir: "https://support.google.com/websearch/answer/510?hl=es-419"
  - texto: "Elegí «Filtrar»: bloquea los resultados explícitos. «Desenfocar» solo borronea las imágenes y «Desactivado» muestra todo."
  - texto: "Si el chico tiene una cuenta supervisada con Family Link, el filtro ya viene puesto y trabado: solo vos lo podés cambiar, en Family Link > «Controles» > «Búsqueda de Google»."
    abrir: "https://support.google.com/families/answer/7086922?hl=es-419"
  - texto: "Si ves un candadito arriba a la derecha, la opción está bloqueada por la cuenta, la escuela o la red."
fuentes:
  - https://support.google.com/websearch/answer/510?hl=es-419
  - https://support.google.com/families/answer/7086922?hl=es-419
madurez: T0
