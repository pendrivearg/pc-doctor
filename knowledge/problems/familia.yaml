# Familia, chicos y control parental: Microsoft Family Safety (tiempo de pantalla, horarios, apps, filtros web, actividad, compras, consentimiento, grupo familiar), Google Family Link, cuenta de Google para menores, YouTube supervisado, SafeSearch, ciberacoso y grooming. Guiadas con fuente oficial.
id: FAMX-001
area: seguridad
titulo:
  sencillo: "Quiero que mi hijo use la compu solo un rato por día"
  tecnico: "Family Safety: límites de tiempo de pantalla en Windows"
explicacion:
  sencillo: "Con Microsoft Family Safety elegís cuántas horas por día puede usar la compu el chico. Funciona si él entra a Windows con su propia cuenta de Microsoft y está en tu grupo familiar."
  tecnico: "account.microsoft.com/family > miembro > pestaña Windows > día > límite y franjas; Activar límites / Desactivar límites. Solo organizadores."
frases: ["que mi nieto use la compu dos horas por día nomás", "ponerle un máximo de horas a la computadora de mi hijo", "cómo hago que la compu se bloquee cuando se le acaba el tiempo al nene", "limitar las horas de pantalla en windows"]
pasos:
  - texto: "El chico tiene que entrar a la compu con su propia cuenta de Microsoft y estar en tu grupo familiar. Para armarlo, escribile a PC Doctor «quiero que un familiar tenga su propio usuario en la compu»."
    abrir: "ms-settings:family-group"
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta (tenés que ser «Organizador») y tocá la tarjeta del chico."
    abrir: "https://account.microsoft.com/family"
  - texto: "Elegí la pestaña «Windows». Si no ves límites, tocá «Activar límites». Tocá un día y poné cuántas horas puede usar la compu; con las casillas o «Todos los días» lo copiás a los demás días. Al terminar, tocá «Terminado»."
    abrir: "https://support.microsoft.com/es-es/family-safety/set-screen-time-limits-across-devices"
  - texto: "Lo mismo se hace desde la app Microsoft Family Safety en tu celular: tocá al chico y elegí «Windows»."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/set-screen-time-limits-across-devices
madurez: T0
---
id: FAMX-002
area: seguridad
titulo:
  sencillo: "Quiero que la compu de los chicos se pueda usar solo en ciertos horarios"
  tecnico: "Family Safety: franjas horarias por día en Windows"
explicacion:
  sencillo: "Además de las horas totales, podés elegir en qué horario se puede usar la compu, por ejemplo de 17 a 20, y que el fin de semana sea distinto."
  tecnico: "Programación de tiempo de pantalla por día (intervalos y total) en la pestaña Windows de Family Safety; programación distinta por día o igual toda la semana."
frases: ["que la compu no se pueda usar de noche", "que mi hijo use la computadora solo después del colegio", "poner un horario distinto el fin de semana para los chicos", "que no use la compu después de las diez"]
pasos:
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta de organizador y tocá la tarjeta del chico."
    abrir: "https://account.microsoft.com/family"
  - texto: "En la pestaña «Windows», tocá un día para agregar el horario permitido (desde qué hora y hasta qué hora) y el total de horas. Tocá «Terminado»."
    abrir: "https://support.microsoft.com/es-es/family-safety/set-screen-time-limits-across-devices"
  - texto: "Podés usar el mismo horario toda la semana o uno distinto cada día. Si un día querés darle más tiempo, cambialo desde ahí mismo."
  - texto: "Solo funciona en compus conectadas a tu grupo familiar y con el chico usando su propia cuenta."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/set-screen-time-limits-across-devices
madurez: T0
