id: FAMX-019
area: seguridad
titulo:
  sencillo: "Quiero que mi hijo me pida permiso antes de bajar apps o comprar en Google Play"
  tecnico: "Family Link: aprobación de compras y descargas en Google Play"
explicacion:
  sencillo: "Podés hacer que, cada vez que el chico quiera bajar una app o comprar algo en Google Play, te llegue un pedido para que vos lo apruebes o lo rechaces."
  tecnico: "Family Link > hijo > Controles > Google Play > Requerir aprobación para (Todo el contenido / Solo contenido pagado / Solo compras directas desde apps / Nunca)."
frases: ["que mi hijo no baje juegos sin preguntarme", "aprobar las aplicaciones que quiere mi nieto", "mi hija compró algo en el play store sin permiso", "me llegó un pedido de mi hijo para bajar una app"]
pasos:
  - texto: "Abrí Family Link, elegí a tu hijo y tocá «Controles» y después «Google Play»."
    abrir: "https://support.google.com/families/answer/7039872?hl=es-419"
  - texto: "En «Requerir aprobación para», elegí qué querés aprobar: «Todo el contenido» (lo más seguro), «Solo contenido pagado», «Solo compras directas desde apps» o «Nunca»."
  - texto: "Si el chico pide algo gratis con «Preguntar por mensaje», te llega un aviso al celular: abrilo y tocá «Aprobar solicitud» o «Rechazar». Si es algo pago, lo aprobás en el celular del chico, escribiendo vos mismo la clave de tu cuenta."
  - texto: "Desde ahí mismo también podés elegir la clasificación máxima de apps y juegos que puede bajar."
    abrir: "https://support.google.com/families/answer/7103028?hl=es-419"
fuentes:
  - https://support.google.com/families/answer/7039872?hl=es-419
  - https://support.google.com/families/answer/7103028?hl=es-419
