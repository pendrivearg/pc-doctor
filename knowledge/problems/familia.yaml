id: FAMX-016
area: seguridad
titulo:
  sencillo: "Quiero crearle una cuenta de Google a mi hijo o nieto menor de 13 años"
  tecnico: "Cuenta de Google para un menor administrada con Family Link"
explicacion:
  sencillo: "Un chico menor de 13 años (o la edad que corresponda en el país) no puede tener una cuenta de Google común: se la crea un padre o madre, que da su permiso y después la supervisa con la app Family Link."
  tecnico: "Creación de Cuenta de Google para menor con consentimiento parental (Android, app Family Link o accounts.google.com/signup); queda supervisada con Family Link."
frases: ["crearle un mail de google a mi nieto de 10 años", "mi hijo es chico y quiere un gmail", "cuenta de google para un nene menor de 13", "google no lo deja crear la cuenta porque es menor"]
pasos:
  - texto: "Hacelo vos, como padre o madre, y con tu propia cuenta de Google a mano: Google te va a pedir que entres con ella para dar tu permiso."
    abrir: "https://support.google.com/families/answer/7103338?hl=es-419"
  - texto: "Desde la app Family Link en tu celular: arriba a la izquierda tocá el perfil y elegí «Agregar hijo o hija». Seguí los pasos de la pantalla."
  - texto: "Desde la compu también se puede: en la página para crear una cuenta de Google, completá el nombre del chico, su fecha de nacimiento y el correo que quiera, y seguí las instrucciones."
  - texto: "Al final elegís cómo dar tu consentimiento. Si usás una tarjeta de crédito, Google no cobra nada, pero puede aparecer un cargo de verificación temporal que suele desaparecer en unas 48 horas."
fuentes:
  - https://support.google.com/families/answer/7103338?hl=es-419
  - https://support.google.com/families/answer/7101025?hl=es-419
madurez: T0
