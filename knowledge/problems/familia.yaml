id: FAMX-018
area: seguridad
titulo:
  sencillo: "Quiero limitar cuánto usa el celular mi hijo con Family Link"
  tecnico: "Family Link: límite diario, bloquear ahora y tiempo extra"
explicacion:
  sencillo: "Con Family Link podés decidir cuántas horas por día puede usar el chico su celular Android o su Chromebook, bloquearlo en el momento y regalarle un rato más si hace falta."
  tecnico: "Family Link > hijo > Tiempo de uso > Límites de tiempo > Límite diario / Programa semanal; Bloquear; Tiempo extra. Android 7+ y ChromeOS."
frases: ["mi nieto está todo el día con el celular", "poner horas de uso al celular del nene con family link", "bloquear el celular de mi hijo desde el mío", "darle un rato más de celular a mi hija"]
pasos:
  - texto: "Abrí Family Link, elegí a tu hijo arriba a la izquierda y tocá «Tiempo de uso» abajo a la izquierda."
    abrir: "https://support.google.com/families/answer/7103340?hl=es-419"
  - texto: "En «Límites de tiempo», activá «Límite diario» y tocá «Programa semanal»: elegí cada día y cuánto tiempo puede usarlo. Si querés lo mismo toda la semana, usá «Aplicar a todos los días de la semana»."
  - texto: "Para bloquearlo ya, en «Tiempo de uso», debajo del nombre del dispositivo, tocá «Bloquear» (y «Desbloquear» para devolvérselo)."
  - texto: "Para darle un rato más, tocá «Tiempo extra», elegí cuánto y tocá «Listo». Esto funciona en celulares Android y Chromebooks; no en la compu con Windows."
fuentes:
  - https://support.google.com/families/answer/7103340?hl=es-419
madurez: T0
