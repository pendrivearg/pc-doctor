id: FAMX-004
area: seguridad
titulo:
  sencillo: "Quiero limitar un juego o un programa en especial, no toda la compu"
  tecnico: "Family Safety: límites de aplicaciones y juegos"
explicacion:
  sencillo: "Podés dejar que el chico use la compu para la escuela todo lo que necesite, pero ponerle un tiempo máximo a un juego o a una aplicación en particular."
  tecnico: "Family Safety > miembro > plataforma > Aplicaciones, características y juegos > Límites de aplicaciones y juegos > app > tiempo diario y franja."
frases: ["que juegue al minecraft solo una hora", "limitar un solo juego en la compu de mi hijo", "poner tiempo a una aplicación nada más", "mi nieto se pasa el día en un jueguito de la compu"]
pasos:
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta de organizador, buscá al chico y elegí la plataforma (Windows, Xbox o celular)."
    abrir: "https://account.microsoft.com/family"
  - texto: "Andá a la pestaña «Aplicaciones, características y juegos» y activá «Límites de aplicaciones y juegos»."
    abrir: "https://support.microsoft.com/es-es/family-safety/set-app-and-game-limits"
  - texto: "Tocá el juego o la app y elegí cuánto tiempo por día y en qué horario la puede usar. Podés poner lo mismo todos los días o distinto según el día."
  - texto: "Si el juego aparece dos veces es porque está instalado en dos aparatos: poné el límite en cada uno."
fuentes:
  - https://support.microsoft.com/es-es/family-safety/set-app-and-game-limits
madurez: T0
