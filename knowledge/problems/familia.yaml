id: FAMX-020
area: seguridad
titulo:
  sencillo: "Puse Family Link pero en la compu con Windows mi hijo hace lo que quiere"
  tecnico: "Family Link no supervisa computadoras Windows ni Mac"
explicacion:
  sencillo: "Family Link solo controla celulares Android y Chromebooks. En una compu con Windows el chico puede entrar con su cuenta de Google, pero los límites de tiempo, el bloqueo de apps y los filtros de Chrome no se aplican. Para la compu se usa el control parental de Microsoft."
  tecnico: "Family Link no admite computadoras (excepto Chromebook) ni iPhone/iPad; en navegadores no se aplican límites de tiempo, ubicación, actividad, bloqueo de apps ni restricciones de Chrome."
frases: ["family link no funciona en la computadora", "mi hijo entra a su gmail en la compu y no tiene límites", "el control de google no anda en windows", "en la notebook no se aplica el family link"]
pasos:
  - texto: "Google aclara que las computadoras que no son Chromebook (Windows o Mac) no se pueden supervisar con Family Link."
    abrir: "https://support.google.com/families/answer/9116646?hl=es-419"
  - texto: "Si tu hijo entra a Google desde un navegador, no corren los límites de tiempo, el bloqueo de apps ni las restricciones de sitios de Chrome. Lo que sí podés decidir es si te tiene que pedir permiso para entrar: en Family Link, elegí al chico y tocá «Controles» > «Configuración de la cuenta» > «Controles para acceder»."
    abrir: "https://support.google.com/families/answer/9043123?hl=es-419"
  - texto: "Para poner horarios y filtros en la compu con Windows, usá Microsoft Family Safety con una cuenta de Microsoft para el chico. Escribile a PC Doctor «control parental»."
fuentes:
  - https://support.google.com/families/answer/9116646?hl=es-419
  - https://support.google.com/families/answer/9043123?hl=es-419
madurez: T0
