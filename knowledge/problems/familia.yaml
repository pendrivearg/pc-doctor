id: FAMX-023
area: seguridad
titulo:
  sencillo: "Un adulto desconocido le escribe a mi hijo o nieto y me preocupa"
  tecnico: "Sospecha de grooming o abuso en línea: denuncia"
explicacion:
  sencillo: "Si un adulto busca ganarse la confianza de un chico por internet, le pide fotos, que guarde secretos o que se vean, puede ser «grooming», un tipo de abuso. Lo primero es la seguridad del chico: no lo retes, guardá las pruebas y hacé la denuncia."
  tecnico: "Ante sospecha de abuso, explotación o grooming: denuncia policial inmediata; Google ofrece un formulario de denuncia de grooming para sus productos y opciones de denuncia por producto."
frases: ["un grande le escribe a mi nieta por internet", "a mi hijo le pidieron fotos por el chat", "creo que alguien está engañando a mi hija por internet", "qué hago si un desconocido acosa a mi nieto en un juego"]
pasos:
  - texto: "Hablá con el chico con calma y sin retarlo: que sepa que hizo bien en contarlo. Que no responda más ni mande nada a esa persona."
  - texto: "No borres nada: guardá capturas de pantalla de los mensajes, el nombre de usuario o perfil, y las fechas."
  - texto: "Si creés que el chico corre peligro, hacé la denuncia en la policía enseguida. Google lo indica así."
    abrir: "https://support.google.com/families/answer/7182800?hl=es-419"
  - texto: "Después, denunciá y bloqueá a esa persona en la aplicación donde pasó. Si fue en un servicio de Google (Gmail, Chat, Drive, YouTube), Google explica cómo denunciarlo en esa misma página."
fuentes:
  - https://support.google.com/families/answer/7182800?hl=es-419
madurez: T0
