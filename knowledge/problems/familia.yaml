id: FAMX-011
area: seguridad
titulo:
  sencillo: "Quiero que mi hijo me pida permiso antes de comprar en la Microsoft Store o la Xbox"
  tecnico: "Family Safety: aprobación de compras y límites de gasto"
explicacion:
  sencillo: "Podés hacer que cada compra del chico en la Microsoft Store o en la Xbox necesite tu aprobación, o darle una cantidad de plata en su cuenta para que no gaste más que eso."
  tecnico: "Family Safety > miembro > Gastos: Métodos de pago de menores, Requerir aprobación para cada compra, saldo de la cuenta Microsoft, notificaciones y actividad de gasto."
frases: ["mi hijo compró un juego en la xbox sin avisar", "que mi nieto no pueda comprar en la tienda de microsoft", "aprobar las compras de mi hijo en la microsoft store", "le cobraron a mi tarjeta una compra del nene en un juego"]
pasos:
  - texto: "Entrá a la página de familia de Microsoft con tu cuenta de organizador y abrí la página de «Gastos» del chico. En la app Microsoft Family Safety: tocá su nombre, bajá hasta el final y elegí «Administrar gastos»."
    abrir: "https://account.microsoft.com/family"
  - texto: "Activá «Requerir aprobación para cada compra». Así, cada vez que quiera comprar algo te llega un aviso al celular y a las notificaciones de Family Safety."
    abrir: "https://support.microsoft.com/es-es/account-billing/require-kids-to-ask-before-buying-from-the-microsoft-store-online-f30d6801-165d-9f86-3fe7-063245c0449b"
  - texto: "Otra opción, sin tarjeta: ponerle una cantidad de plata en su cuenta con «Agregar dinero». Solo puede gastar eso; la cuenta nunca queda en negativo."
  - texto: "Activá también los avisos de cada compra y revisá la «actividad de gasto» para ver en qué se fue la plata."
fuentes:
  - https://support.microsoft.com/es-es/account-billing/require-kids-to-ask-before-buying-from-the-microsoft-store-online-f30d6801-165d-9f86-3fe7-063245c0449b
madurez: T0
