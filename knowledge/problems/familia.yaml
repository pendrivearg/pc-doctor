id: FAMX-025
area: seguridad
titulo:
  sencillo: "Mi hijo cumplió 13 y quiere sacar el control de Family Link"
  tecnico: "Detener la supervisión de Family Link"
explicacion:
  sencillo: "La supervisión de Family Link se puede sacar cuando el chico cumple 13 años (o la edad que corresponda en el país). Si es menor de 18, necesita que vos lo apruebes, y a los dos les llega un aviso."
  tecnico: "Family Link > hijo > Controles > Configuración de la cuenta > Acerca de la supervisión > Detener supervisión."
frases: ["mi hijo cumplió 13 y quiere sacar el family link", "cómo dejo de supervisar la cuenta de mi hija", "sacar el control parental de google", "mi nieto dice que ya es grande para el family link"]
pasos:
  - texto: "Recién se puede sacar cuando el chico cumple 13 años (o la edad que fije el país). Si es menor de 18, siempre hace falta tu aprobación."
    abrir: "https://support.google.com/families/answer/9055704?hl=es-419"
  - texto: "En tu celular, abrí Family Link, elegí la cuenta del chico y tocá «Controles» > «Configuración de la cuenta» > «Acerca de la supervisión»."
  - texto: "Seguí las instrucciones y tocá «Detener supervisión». A los dos les va a llegar un aviso."
fuentes:
  - https://support.google.com/families/answer/9055704?hl=es-419
madurez: T0
