id: HWP-023
area: audio
titulo:
  sencillo: "El sonido es muy bajo aunque esté al máximo"
  tecnico: "Volumen bajo: mezclador, mejoras de audio, formato y controlador"
explicacion:
  sencillo: "A veces el volumen general está alto pero el programa que usás (el navegador, por ejemplo) está bajito en el mezclador, o alguna opción de Windows baja el sonido."
  tecnico: "Mezclador de volumen (sistema y aplicación), mejoras de audio, formato predeterminado y controlador."
frases: ["se escucha muy bajito", "el volumen está al máximo y apenas se oye", "los videos se escuchan bajo", "la compu suena muy despacio"]
pasos:
  - texto: "Abrí el Mezclador de volumen y subí tanto «Sistema» como el programa que estás usando. Fijate que ninguno esté silenciado."
    abrir: "ms-settings:apps-volume"
  - texto: "En Sonido, en «Salida», elegí tu aparato y apagá las «Mejoras de audio». Si no cambia, probá otro formato predeterminado en la configuración avanzada."
    abrir: "ms-settings:sound"
  - texto: "Si sigue bajo, actualizá el controlador de sonido y reiniciá. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/audio/fix-low-or-quiet-sound-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/audio/fix-low-or-quiet-sound-in-windows
madurez: T0
