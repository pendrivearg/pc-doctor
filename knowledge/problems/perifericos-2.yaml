id: HWP-016
area: perifericos
titulo:
  sencillo: "El clic izquierdo y el derecho del mouse están cambiados"
  tecnico: "Botón principal del mouse configurado a la derecha"
explicacion:
  sencillo: "Windows permite elegir cuál es el botón principal del mouse (pensado para zurdos). Si se cambió, el clic izquierdo hace lo que antes hacía el derecho."
  tecnico: "Bluetooth y dispositivos > Mouse > botón principal del mouse: Izquierdo / Derecho."
frases: ["el mouse tiene los botones al revés", "el clic izquierdo abre el menú", "se invirtieron los botones del mouse", "poner el mouse para zurdos"]
pasos:
  - texto: "Abrí la configuración del Mouse (mientras estén cambiados, usá el botón derecho para hacer clic)."
    abrir: "ms-settings:mousetouchpad"
  - texto: "En la opción del botón principal del mouse, elegí «Izquierdo» (o «Derecho» si sos zurdo y lo preferís así)."
    abrir: "https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings"
fuentes:
  - https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings
madurez: T0
