id: HWP-011
area: audio
titulo:
  sencillo: "Los auriculares con adaptador USB-C no suenan"
  tecnico: "Adaptador de audio USB-C analógico no admitido"
explicacion:
  sencillo: "Hay adaptadores USB-C para auriculares «simples» (analógicos) que Windows no puede usar. Hace falta uno «digital»."
  tecnico: "Notificación «Adaptador de audio USB-C no admitido»: reemplazar el adaptador analógico por uno digital."
frases: ["los auriculares con adaptador usb c no se escuchan", "dice adaptador de audio no compatible", "el adaptadorcito de auriculares a usb-c no anda", "enchufé los auriculares en el usb c y no suenan"]
pasos:
  - texto: "Si Windows avisa que el adaptador de audio no es compatible, cambialo por un adaptador USB-C de audio digital."
    abrir: "https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows"
  - texto: "Después, en Sonido > Salida, elegí los auriculares."
    abrir: "ms-settings:sound"
fuentes:
  - https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows
madurez: T0
