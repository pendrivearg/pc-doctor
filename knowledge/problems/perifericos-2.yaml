id: HWP-017
area: perifericos
titulo:
  sencillo: "El doble clic no me sale o el mouse queda arrastrando cosas"
  tecnico: "Velocidad de doble clic y Bloqueo de clic (ClickLock)"
explicacion:
  sencillo: "Si el doble clic tiene que ser muy rápido, cuesta abrir carpetas. Y si está activado el «Bloqueo de clic», el mouse sigue agarrando lo que tocaste aunque sueltes el botón."
  tecnico: "Propiedades del mouse > Botones: Velocidad de doble clic y Bloqueo de clic (ClickLock)."
frases: ["no me sale el doble clic", "tengo que hacer doble clic muy rápido", "el mouse queda arrastrando las cosas", "el mouse se queda agarrado sin apretar"]
pasos:
  - texto: "Abrí la configuración del Mouse y, abajo, en la configuración relacionada, tocá «Configuración adicional del mouse»."
    abrir: "ms-settings:mousetouchpad"
  - texto: "En la pestaña «Botones», mové la velocidad de doble clic hacia «Lenta» y tocá «Aceptar»."
  - texto: "En la misma pestaña, si está tildado el bloqueo de clic (ClickLock) y no lo usás, destildalo y tocá «Aceptar»."
    abrir: "https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings"
derivar: "Si el mouse sigue haciendo doble clic o soltando cosas por su cuenta, probá con otro mouse: puede ser el botón gastado."
fuentes:
  - https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings
madurez: T0
