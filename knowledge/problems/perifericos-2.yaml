id: HWP-025
area: perifericos
titulo:
  sencillo: "La compu no toma el micrófono de los auriculares"
  tecnico: "Micrófono de auriculares (headset) no seleccionado o sin probar"
explicacion:
  sencillo: "Cuando enchufás auriculares con micrófono, Windows puede seguir usando el micrófono de la notebook o de la cámara. Hay que elegir el de los auriculares y probarlo."
  tecnico: "Sistema > Sonido > Entrada: seleccionar el micrófono del headset; Propiedades > Iniciar prueba; volumen de entrada; Bluetooth: Agregar dispositivo."
frases: ["no me detecta el micrófono de los auriculares", "en las llamadas usa el micrófono de la notebook y no el del auricular", "el micrófono del headset no aparece", "quiero probar el micrófono de los auriculares"]
pasos:
  - texto: "Con los auriculares conectados, abrí Sonido y fijate en «Entrada» que aparezca su micrófono. Si son Bluetooth y no aparecen, tocá «Agregar dispositivo»."
    abrir: "ms-settings:sound"
  - texto: "Elegí el micrófono de los auriculares y tocá la flechita «>» para abrir sus propiedades. Tocá «Iniciar prueba», hablá normal, después «Detener prueba» y escuchá la grabación."
  - texto: "Si se oye muy bajo, subí el «Volumen de entrada». Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/drivers/how-to-set-up-and-test-microphones-in-windows"
  - texto: "Si en el programa de videollamadas tampoco anda, escribile a PC Doctor «no funciona el micrófono» para revisar los permisos."
fuentes:
  - https://support.microsoft.com/windows/hardware/drivers/how-to-set-up-and-test-microphones-in-windows
madurez: T0
