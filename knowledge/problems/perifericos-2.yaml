id: HWP-021
area: audio
titulo:
  sencillo: "El sonido se escucha de un solo lado"
  tecnico: "Audio mono activado o balance izquierda/derecha desparejo"
explicacion:
  sencillo: "Si en los auriculares o parlantes se escucha de un solo lado (o distinto en cada oído), puede ser el balance entre izquierda y derecha, la opción «Audio mono» o, en auriculares Bluetooth, que se conectó uno solo."
  tecnico: "Sistema > Sonido: Audio mono; configuración de salida > Volumen Izquierda/Derecha; formato 2 canales; volver a emparejar si es Bluetooth."
frases: ["se escucha solo de un lado", "el auricular izquierdo no suena", "un auricular suena más fuerte que el otro", "el sonido sale por un solo parlante"]
pasos:
  - texto: "Abrí Sonido y, en la parte de salida, apagá «Audio mono»."
    abrir: "ms-settings:sound"
  - texto: "En «Salida», elegí tus auriculares o parlantes y, en la configuración de salida, revisá que el volumen «Izquierda» y «Derecha» estén iguales (normalmente en 100)."
  - texto: "Si son auriculares Bluetooth: quitalos en Bluetooth y dispositivos, ponelos en modo de emparejar y agregalos de nuevo; si pregunta, aceptá conectar el segundo auricular."
    abrir: "ms-settings:bluetooth"
  - texto: "Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/windows/hardware/bluetooth/fix-bluetooth-audio-only-playing-in-one-channel"
fuentes:
  - https://support.microsoft.com/windows/hardware/bluetooth/fix-bluetooth-audio-only-playing-in-one-channel
madurez: T0
