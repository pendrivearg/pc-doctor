id: HWP-015
area: hardware
titulo:
  sencillo: "Con dos monitores, el mouse no pasa al otro por el lado correcto"
  tecnico: "Organizar pantallas en Sistema > Pantalla"
explicacion:
  sencillo: "Windows tiene que saber dónde está cada monitor sobre tu mesa (a la izquierda, a la derecha, arriba). Si lo tiene al revés, la flechita sale por el lado equivocado."
  tecnico: "Identificar y arrastrar las pantallas en Sistema > Pantalla, Aplicar; modo de proyección con Windows + P."
frases: ["el mouse no pasa al otro monitor", "tengo que salir por la izquierda para ir al monitor de la derecha", "ordenar los dos monitores", "las pantallas están al revés"]
pasos:
  - texto: "Abrí Pantalla y tocá «Identificar»: en cada monitor aparece un número."
    abrir: "ms-settings:display"
  - texto: "Arrastrá los rectángulos numerados para que queden como están los monitores sobre tu mesa y tocá «Aplicar». Probá pasar el mouse de una pantalla a la otra."
  - texto: "Si las dos muestran lo mismo, apretá Windows + P y elegí «Extender»."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/how-to-use-multiple-monitors-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/how-to-use-multiple-monitors-in-windows
madurez: T0
