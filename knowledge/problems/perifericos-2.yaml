id: HWP-008
area: hardware
titulo:
  sencillo: "La notebook carga muy lento (o no carga) por USB-C"
  tecnico: "Notificación «Cargador lento» / «El equipo no se está cargando» por USB-C"
explicacion:
  sencillo: "Por USB-C la carga depende de que el cargador, el cable y la computadora aguanten la potencia necesaria. Un cargador de celular o un cable flojito cargan lento o directamente no cargan."
  tecnico: "Cargador o cable USB-C sin la potencia requerida, puerto que no es de carga, o conexión a través de un hub o dock."
frases: ["windows dice que el cargador es lento", "la notebook carga lentísimo con el cargador usb-c", "enchufé el cargador usb c y no carga", "me sale cargador lento conectado"]
pasos:
  - texto: "Usá el cargador y el cable que vinieron con la computadora. Un cargador de celular suele no alcanzar."
  - texto: "Enchufalo en el puerto USB-C que sirve para cargar (el manual de la computadora dice cuál es), directo y no a través de un adaptador, hub o base."
  - texto: "Si el puerto tiene pelusa o polvo, limpialo con aire comprimido, con la compu apagada."
    abrir: "https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows"
derivar: "Si con el cargador original tampoco carga, puede ser el cargador, el cable o el puerto: llevala al servicio técnico de la marca."
fuentes:
  - https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows
madurez: T0
---
id: HWP-009
area: hardware
titulo:
  sencillo: "Windows dice «La conexión de la pantalla puede estar limitada» por USB-C"
  tecnico: "Monitor por USB-C sin modo alternativo DisplayPort/MHL"
explicacion:
  sencillo: "No todos los puertos ni todos los cables USB-C pasan imagen. Si el puerto, el cable o el adaptador no lo permiten, el monitor no se ve o se ve con limitaciones."
  tecnico: "El equipo, el cable o la pantalla no admiten DisplayPort o MHL en modo alternativo sobre USB-C, o la conexión pasa por un hub/dock."
frases: ["conecté el monitor por usb c y no anda", "dice que la conexión de pantalla puede estar limitada", "el adaptador usb-c a hdmi no da imagen", "el monitor no se ve por el usb-c"]
pasos:
  - texto: "Fijate en el manual o la página del fabricante de tu computadora cuál de sus puertos USB-C da imagen (no todos lo hacen)."
  - texto: "Conectá el monitor directo a ese puerto, sin hubs ni bases intermedias."
  - texto: "Probá con otro cable: la computadora, el cable y el monitor tienen que admitir video por USB-C (DisplayPort o MHL)."
    abrir: "https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows
madurez: T0
---
id: HWP-010
area: perifericos
titulo:
  sencillo: "Windows dice que un aparato USB «puede necesitar más energía»"
  tecnico: "Notificación «Es posible que el dispositivo USB necesite más energía»"
explicacion:
  sencillo: "Algunos aparatos piden más energía de la que el puerto puede dar, sobre todo si la notebook está a batería o hay muchas cosas enchufadas."
  tecnico: "Consumo del dispositivo por encima de lo que entrega el puerto; alimentar externamente, conectar el equipo a la corriente y liberar puertos."
frases: ["dice que el dispositivo usb necesita más energía", "el usb avisa que le falta energía","me sale un aviso de energía del usb", "el aparato usb no tiene suficiente energía"]
pasos:
  - texto: "Si el aparato tiene su propio cargador o fuente, enchufalo."
  - texto: "Enchufá la notebook a la corriente en vez de usarla a batería."
  - texto: "Desenchufá los aparatos USB que no estés usando."
    abrir: "https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows
madurez: T0
