id: HWP-020
area: perifericos
titulo:
  sencillo: "La flechita se mueve cuando toco los números del teclado"
  tecnico: "Teclas del mouse activadas (el teclado numérico controla el puntero)"
explicacion:
  sencillo: "Windows tiene una opción de accesibilidad que deja manejar la flechita con los números del costado del teclado. Si quedó activada, esos números pueden mover el mouse en vez de escribir."
  tecnico: "Accesibilidad > Interacción > Mouse > Teclas del mouse."
frases: ["los números del teclado mueven el mouse", "el teclado numérico no escribe y mueve la flechita", "el mouse se mueve solo cuando aprieto el 8", "se activaron las teclas del mouse"]
pasos:
  - texto: "Abrí Configuración > Accesibilidad > Mouse."
    abrir: "ms-settings:easeofaccess-mouse"
  - texto: "Apagá «Teclas del mouse» si no lo usás. Si te sirve para manejar la flechita con el teclado, dejalo prendido."
    abrir: "https://support.microsoft.com/accessibility/windows/use-mouse-keys-to-move-the-mouse-pointer"
fuentes:
  - https://support.microsoft.com/accessibility/windows/use-mouse-keys-to-move-the-mouse-pointer
  - https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use
madurez: T0
