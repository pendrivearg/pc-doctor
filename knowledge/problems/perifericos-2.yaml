id: HWP-003
area: perifericos
titulo:
  sencillo: "La impresora imprime rayado, desteñido o borroso"
  tecnico: "Mala calidad de impresión (rayas, tenue, borroso)"
explicacion:
  sencillo: "Casi siempre es la tinta o el tóner que se está acabando, el cabezal sucio o que la impresora está en modo «ahorro». Hay una prueba sencilla para saber si el problema es de la impresora o de la computadora."
  tecnico: "Página de prueba desde el panel de la impresora, preferencias de impresión (calidad, borrador/ahorro, tipo de papel), limpieza y alineación de cabezales, consumibles y controlador."
frases: ["la impresora saca las hojas con rayas", "imprime todo clarito y desteñido", "las letras salen cortadas o con franjas", "la impresión sale borrosa", "imprime con manchas y líneas"]
pasos:
  - texto: "Imprimí una página de prueba desde los botones de la propia impresora. Si también sale mal, el problema es de la impresora; si sale bien, seguí con los pasos de la computadora."
  - texto: "Revisá que la tinta o el tóner no estén vacíos ni vencidos. En impresoras de chorro de tinta, usá la opción «Limpiar cabezal» o «Mantenimiento» del panel o del programa de la impresora (gasta tinta: no la repitas muchas veces)."
  - texto: "En Impresoras y escáneres, elegí tu impresora > «Preferencias de impresión»: poné la calidad en «Normal» o «Óptima», apagá los modos borrador, económico o ahorro de tóner, y elegí el tipo de papel que usás."
    abrir: "ms-settings:printers"
  - texto: "Microsoft explica el resto de los pasos."
    abrir: "https://support.microsoft.com/windows/fix-poor-print-quality-in-windows-blurry-faded-or-streaked-prints-d7498ada-4e54-4406-8969-a031b6311214"
fuentes:
  - https://support.microsoft.com/windows/fix-poor-print-quality-in-windows-blurry-faded-or-streaked-prints-d7498ada-4e54-4406-8969-a031b6311214
madurez: T0
