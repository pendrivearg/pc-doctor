id: HWP-005
area: perifericos
titulo:
  sencillo: "Quiero agregar una impresora Wi-Fi o de red"
  tecnico: "Agregar una impresora de red o inalámbrica"
explicacion:
  sencillo: "Una impresora Wi-Fi se puede usar desde cualquier compu de la casa, sin cables, siempre que estén conectadas a la misma red Wi-Fi."
  tecnico: "Impresoras y escáneres > Agregar dispositivo; si no aparece, «Agregar manualmente». Misma red que el equipo."
frases: ["quiero instalar la impresora wifi", "agregar una impresora de red", "la compu no encuentra la impresora inalámbrica", "conectar la impresora sin cable"]
pasos:
  - texto: "Prendé la impresora y fijate que esté conectada a la MISMA red Wi-Fi que la computadora (en el panel de la impresora suele haber una opción de red o Wi-Fi)."
  - texto: "Abrí Impresoras y escáneres y tocá «Agregar dispositivo». Esperá unos minutos a que aparezca tu impresora y tocá «Agregar dispositivo» al lado."
    abrir: "ms-settings:printers"
  - texto: "Si no aparece, tocá «Agregar manualmente» (al lado de «La impresora que deseo no está en la lista») y seguí las instrucciones de la ventana."
    abrir: "https://support.microsoft.com/windows/hardware/printer/add-or-install-a-printer-in-windows"
  - texto: "Después buscá actualizaciones en Windows Update para que se instale el controlador completo."
    abrir: "ms-settings:windowsupdate"
fuentes:
  - https://support.microsoft.com/windows/hardware/printer/add-or-install-a-printer-in-windows
madurez: T0
