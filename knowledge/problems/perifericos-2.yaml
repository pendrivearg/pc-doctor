id: HWP-002
area: perifericos
titulo:
  sencillo: "Error 0x0000011b o 0x00000709 al usar la impresora de otra compu"
  tecnico: "Fallas de conexión a una impresora compartida (0x0000011b / 0x00000709)"
explicacion:
  sencillo: "Estos códigos suelen aparecer cuando imprimís en una impresora que está conectada a OTRA computadora de la casa o la oficina. Muchas veces se debe a cambios de seguridad de Windows: las dos computadoras tienen que estar actualizadas."
  tecnico: "Errores al conectar con una impresora compartida (cambios de autenticación RPC de impresión, KB4599464). Actualizar cliente y servidor, revisar uso compartido y volver a agregar la impresora por nombre."
frases: ["me sale el error 0x0000011b al imprimir", "error 0x00000709 con la impresora", "windows no se puede conectar a la impresora compartida", "no puedo imprimir en la impresora de la otra compu"]
pasos:
  - texto: "Actualizá Windows en LAS DOS computadoras: la que tiene la impresora enchufada y la tuya. Microsoft pide que todas tengan las actualizaciones al día."
    abrir: "ms-settings:windowsupdate"
  - texto: "En la computadora que tiene la impresora, fijate que esté prendida y que tenga activados «Detección de redes» y «Uso compartido de archivos e impresoras» (Red e Internet > Configuración de red avanzada > Configuración de uso compartido avanzado)."
    abrir: "ms-settings:network-status"
  - texto: "En tu computadora, en Impresoras y escáneres, quitá esa impresora, reiniciá y volvé a agregarla: «Agregar dispositivo» > «Agregar manualmente» > «Seleccionar una impresora compartida por nombre»."
    abrir: "ms-settings:printers"
  - texto: "Microsoft explica cada paso para impresoras compartidas."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/printer/fix-shared-printer-connection-problems-in-windows"
derivar: "Si sigue el error, no cambies el registro de Windows ni desactives protecciones por tu cuenta: esas «soluciones» de Internet dejan la compu menos segura. Consultá a un técnico."
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/printer/fix-shared-printer-connection-problems-in-windows
  - https://support.microsoft.com/kb/4599464
madurez: T0
