id: HWP-012
area: hardware
titulo:
  sencillo: "El monitor no muestra nada o dice «Sin señal»"
  tecnico: "Monitor externo sin imagen"
explicacion:
  sencillo: "Si la computadora está prendida pero el monitor queda negro o con un cartel de «sin señal», muchas veces es el cable, el puerto o el modo de pantalla elegido en Windows."
  tecnico: "Modo de proyección (Windows + P), cable y puerto de video, adaptadores intermedios, reinicio del controlador gráfico (Windows + Ctrl + Mayús + B)."
frases: ["el monitor dice sin señal", "la pc prende pero el monitor queda negro", "el monitor no da imagen", "el monitor dice no signal"]
pasos:
  - texto: "Revisá que el cable del monitor esté bien firme en los dos extremos. Si tenés otro cable, probá con ese."
  - texto: "Si usás un adaptador o una base, sacalos y conectá el monitor directo. Si la computadora tiene otra salida de video (HDMI, DisplayPort, VGA), probá con esa."
  - texto: "Apretá Windows + P y elegí «Extender». También podés apretar Windows + Ctrl + Mayús + B: reinicia el video sin apagar la compu."
  - texto: "Reiniciá la computadora. Si podés, probá el monitor en otra compu para saber si la falla es del monitor o de la computadora."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/troubleshoot-external-monitor-connections-in-windows"
derivar: "Si el monitor tampoco anda en otra computadora, el problema es del monitor: consultá al service."
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/troubleshoot-external-monitor-connections-in-windows
madurez: T0
