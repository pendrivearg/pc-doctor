id: HWP-018
area: perifericos
titulo:
  sencillo: "La ruedita del mouse baja demasiado, muy poco o al revés"
  tecnico: "Configuración de desplazamiento de la rueda del mouse"
explicacion:
  sencillo: "Se puede elegir cuántas líneas baja cada «clic» de la ruedita, si salta una pantalla entera y hacia qué lado se mueve la página."
  tecnico: "Mouse > Desplazamiento: varias líneas o una pantalla a la vez, líneas por vez, desplazar ventanas inactivas y dirección de desplazamiento."
frases: ["la ruedita del mouse baja muy rápido", "la rueda del mouse sube cuando la bajo", "el scroll del mouse va al revés", "la ruedita salta una página entera"]
pasos:
  - texto: "Abrí la configuración del Mouse y buscá la sección de desplazamiento."
    abrir: "ms-settings:mousetouchpad"
  - texto: "Elegí que la rueda mueva varias líneas a la vez (no una pantalla a la vez) y ajustá con el control cuántas líneas baja."
  - texto: "Si va al revés, cambiá la dirección de desplazamiento para que al bajar la ruedita la página baje."
    abrir: "https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings"
fuentes:
  - https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings
madurez: T0
