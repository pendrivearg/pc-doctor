id: HWP-007
area: perifericos
titulo:
  sencillo: "Escaneé un documento y no sé dónde quedó (o en qué formato)"
  tecnico: "Escáner de Windows: tipo de archivo y carpeta de destino"
explicacion:
  sencillo: "La aplicación «Escáner de Windows» guarda lo escaneado como imagen (JPEG, PNG, TIFF o Bitmap), no como PDF. Si no elegiste otra carpeta, queda dentro de la carpeta Imágenes, en la de escaneos."
  tecnico: "Windows Scan: tipos JPEG, PNG, TIFF y Bitmap; destino predeterminado Imágenes > Scans (escaneos), configurable en «Mostrar más» > «Guardar archivo en»."
frases: ["dónde se guarda lo que escaneo", "escaneé y no encuentro el archivo", "quiero escanear en pdf", "en qué carpeta queda lo escaneado"]
pasos:
  - texto: "Abrí el Explorador de archivos (Windows + E) y entrá a Imágenes: adentro está la carpeta de escaneos (puede llamarse «Scans»). Ahí van si no elegiste otra carpeta."
  - texto: "Para el próximo: abrí «Escáner» desde Inicio, elegí el tipo en «Tipo de archivo» y, en «Mostrar más», tocá el enlace de «Guardar archivo en» para elegir la carpeta. Después tocá «Escanear»."
    abrir: "https://support.microsoft.com/windows/hardware/printer/install-and-use-a-scanner-in-windows"
  - texto: "Esta aplicación no guarda en PDF. Si te piden un PDF, escribile a PC Doctor «quiero guardar un documento como PDF»."
fuentes:
  - https://support.microsoft.com/windows/hardware/printer/install-and-use-a-scanner-in-windows
madurez: T0
