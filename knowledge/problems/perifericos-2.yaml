id: HWP-022
area: audio
titulo:
  sencillo: "El sonido sale distorsionado o con chasquidos"
  tecnico: "Audio distorsionado o crepitante: mejoras de audio, formato y controlador"
explicacion:
  sencillo: "Si los parlantes o auriculares suenan «rotos» o con chasquidos, muchas veces la culpa es de las «mejoras de audio» de Windows o del controlador de sonido."
  tecnico: "Desactivar mejoras de audio, cambiar el formato predeterminado, actualizar o reinstalar el controlador y reiniciar los servicios de audio de Windows."
frases: ["el sonido sale distorsionado", "los parlantes hacen chasquidos", "el audio chisporrotea", "el audio suena como roto"]
pasos:
  - texto: "Abrí Sonido, en «Salida» elegí tu aparato y apagá las «Mejoras de audio». Probá cómo suena."
    abrir: "ms-settings:sound"
  - texto: "Si sigue igual, en ese mismo aparato entrá a la configuración avanzada y elegí otro formato predeterminado. Probá de nuevo."
  - texto: "Si no mejora, actualizá el controlador de sonido desde el Administrador de dispositivos y reiniciá. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hardware/audio/fix-distorted-or-crackling-audio-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/audio/fix-distorted-or-crackling-audio-in-windows
madurez: T0
