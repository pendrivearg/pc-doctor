id: HWP-013
area: hardware
titulo:
  sencillo: "La pantalla se ve borrosa, estirada o con bordes negros"
  tecnico: "Resolución distinta de la recomendada"
explicacion:
  sencillo: "Cada pantalla tiene una resolución ideal. Si está puesta otra, las letras se ven menos nítidas, la imagen queda estirada o aparecen bordes negros."
  tecnico: "Sistema > Pantalla > Escala y diseño > Resolución de pantalla (Recomendado); cambios inesperados sugieren actualizar el controlador gráfico."
frases: ["la pantalla se ve borrosa", "la imagen se ve estirada", "aparecen bordes negros en el monitor", "se cambió la resolución sola", "las letras se ven desenfocadas"]
pasos:
  - texto: "Abrí Pantalla. Si tenés varios monitores, elegí arriba el que se ve mal."
    abrir: "ms-settings:display"
  - texto: "En «Escala y diseño», en «Resolución de pantalla», elegí la que dice «(Recomendado)»."
  - texto: "Si lo que querés es agrandar letras e íconos, no toques la resolución: cambiá «Escala» (también conviene la recomendada)."
  - texto: "Si la resolución se cambia sola, buscá actualizaciones en Windows Update: puede hacer falta actualizar el controlador de video."
    abrir: "ms-settings:windowsupdate"
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/change-your-screen-resolution-and-layout-in-windows
madurez: T0
