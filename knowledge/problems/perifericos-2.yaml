id: HWP-006
area: perifericos
titulo:
  sencillo: "Quiero imprimir en la impresora que está enchufada en otra compu"
  tecnico: "Compartir una impresora y conectarse por nombre (\\\\Equipo\\Impresora)"
explicacion:
  sencillo: "Si la impresora está conectada por cable a una computadora, se puede «compartir» para que las otras compus de la casa también la usen. La computadora que tiene la impresora tiene que estar prendida."
  tecnico: "Pestaña Compartir en las propiedades de la impresora; detección de redes y uso compartido de archivos e impresoras; agregar por nombre \\\\NombreEquipo\\NombreRecurso."
frases: ["usar la impresora de la otra computadora", "compartir la impresora entre dos compus", "imprimir desde la notebook en la impresora de la pc", "la impresora está en la otra compu y quiero usarla"]
pasos:
  - texto: "En la computadora que tiene la impresora: abrí las propiedades de la impresora, en la pestaña «Compartir» activá compartirla y anotá el nombre que le pone."
    abrir: "ms-settings:printers"
  - texto: "En las dos compus, activá «Detección de redes» y «Uso compartido de archivos e impresoras» (Red e Internet > Configuración de red avanzada > Configuración de uso compartido avanzado). Tienen que estar en la misma red."
    abrir: "ms-settings:network-status"
  - texto: "En la otra compu: Impresoras y escáneres > «Agregar dispositivo» > «Agregar manualmente» > «Seleccionar una impresora compartida por nombre», y escribí \\\\NombreDeLaCompu\\NombreDeLaImpresora."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/printer/fix-shared-printer-connection-problems-in-windows"
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/printer/fix-shared-printer-connection-problems-in-windows
madurez: T0
