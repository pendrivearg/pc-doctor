id: HWP-014
area: hardware
titulo:
  sencillo: "Activé HDR y todo se ve lavado, oscuro o con colores raros"
  tecnico: "HDR en Windows: activación, brillo del contenido SDR y modo duplicado"
explicacion:
  sencillo: "HDR sirve para ver películas y juegos con más brillo y colores, pero solo si la pantalla lo admite. Si lo demás se ve apagado, se puede ajustar el brillo de lo «normal» o directamente apagar HDR."
  tecnico: "Sistema > Pantalla > HDR; control «Brillo del contenido SDR»; HDR no se admite con pantallas duplicadas; en notebooks se apaga a batería por defecto."
frases: ["con hdr se ve todo lavado", "cómo activo el hdr", "no me aparece la opción hdr", "los colores se ven apagados con hdr", "el hdr se apaga solo en la notebook"]
pasos:
  - texto: "Abrí Pantalla, elegí arriba la pantalla que admite HDR y prendé o apagá «HDR» según lo que quieras."
    abrir: "ms-settings:display"
  - texto: "Si con HDR lo normal se ve lavado u oscuro, entrá a la opción HDR y mové el control de brillo del contenido SDR hasta que se vea bien."
  - texto: "Si en la notebook con un monitor conectado no aparece HDR, elegí «Extender estas pantallas»: con las pantallas duplicadas HDR no funciona."
  - texto: "En notebooks, HDR se apaga solo al desenchufar para ahorrar batería; se puede cambiar en la misma sección (gasta más batería). Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/hdr-settings-in-windows-2d767185-38ec-7fdc-6f97-bbc6c5ef24e6"
fuentes:
  - https://support.microsoft.com/windows/hdr-settings-in-windows-2d767185-38ec-7fdc-6f97-bbc6c5ef24e6
madurez: T0
