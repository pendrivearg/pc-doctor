id: HWP-019
area: perifericos
titulo:
  sencillo: "La flechita del mouse va muy rápido, muy lento o no le emboco"
  tecnico: "Velocidad y precisión del puntero"
explicacion:
  sencillo: "La velocidad de la flechita se puede ajustar a tu gusto. Así es más fácil apuntar a los botones chiquitos."
  tecnico: "Mouse > velocidad del puntero del mouse y «Mejorar la precisión del puntero»."
frases: ["el mouse va muy rápido", "la flechita se mueve muy lento", "no puedo apuntar bien con el mouse", "me cuesta acertarle a los botones con el mouse"]
pasos:
  - texto: "Abrí la configuración del Mouse y mové el control de velocidad del puntero hasta que te resulte cómodo."
    abrir: "ms-settings:mousetouchpad"
  - texto: "Activá «Mejorar la precisión del puntero» para que sea más fácil apuntar."
    abrir: "https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings"
fuentes:
  - https://support.microsoft.com/windows/hardware/input-devices/change-mouse-settings
madurez: T0
