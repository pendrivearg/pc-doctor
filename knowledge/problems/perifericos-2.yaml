id: HWP-024
area: audio
titulo:
  sencillo: "Enchufé los auriculares pero sigue sonando por los parlantes"
  tecnico: "Dispositivo de salida predeterminado incorrecto"
explicacion:
  sencillo: "Windows manda el sonido al aparato que tiene elegido como «predeterminado». Si no cambia solo a los auriculares, hay que elegirlos a mano."
  tecnico: "Sonido > Salida; configuración de sonido adicional > Reproducción > Establecer como predeterminado; mejoras de audio; solucionador de audio."
frases: ["enchufé los auriculares y suena por los parlantes", "los auriculares no se escuchan", "el sonido no pasa a los auriculares", "no me toma los auriculares"]
pasos:
  - texto: "Abrí Sonido y, en «Salida», elegí tus auriculares. Revisá que no estén en silencio y que el volumen esté arriba."
    abrir: "ms-settings:sound"
  - texto: "Si se vuelve a cambiar solo, en esa misma página entrá a la configuración de sonido adicional (más abajo), pestaña «Reproducción», hacé clic derecho en los auriculares y elegí la opción para establecerlos como predeterminados."
  - texto: "Si siguen mudos, en los auriculares (dentro de «Salida») apagá las «Mejoras de audio». Microsoft explica también el solucionador automático."
    abrir: "https://support.microsoft.com/windows/hardware/audio/fix-audio-issues-when-no-sound-plays-from-speakers-or-headphones-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/audio/fix-audio-issues-when-no-sound-plays-from-speakers-or-headphones-in-windows
madurez: T0
