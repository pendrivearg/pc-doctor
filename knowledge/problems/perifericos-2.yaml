id: HWP-004
area: perifericos
titulo:
  sencillo: "Un documento quedó trabado en la cola y no se borra"
  tecnico: "Cola de impresión bloqueada: reiniciar la cola de impresión y vaciar la carpeta PRINTERS"
explicacion:
  sencillo: "A veces un documento queda «colgado» en la lista de impresión y, aunque lo cancelás, no se va y no deja imprimir nada más. Se puede vaciar la lista a mano. Ojo: se borran TODOS los documentos que estaban esperando para imprimirse (tus archivos no se tocan)."
  tecnico: "Detener el servicio Cola de impresión (Print Spooler), borrar %WINDIR%\\system32\\spool\\PRINTERS y volver a iniciarlo en Automático."
frases: ["no puedo cancelar lo que mandé a imprimir", "el documento queda en eliminando y no se borra", "se trabó la cola de impresión", "quedó un trabajo atascado en la impresora"]
pasos:
  - texto: "Primero apagá la impresora, desenchufala, esperá 30 segundos y volvé a prenderla."
  - texto: "Si sigue trabado: tocá Windows + R, escribí services.msc y Enter. Hacé doble clic en «Cola de impresión» y tocá «Detener»."
  - texto: "Tocá Windows + R, escribí %WINDIR%\\system32\\spool\\PRINTERS y Enter. Borrá todo lo que hay en esa carpeta (son solo los documentos pendientes de imprimir)."
  - texto: "Volvé a «Cola de impresión», en «Tipo de inicio» elegí «Automático», tocá «Iniciar» y «Aceptar». Microsoft lo explica en el paso de la cola de impresión."
    abrir: "https://support.microsoft.com/windows/fix-printer-connection-and-printing-problems-in-windows-fb830bff-7702-6349-33cd-9443fe987f73"
fuentes:
  - https://support.microsoft.com/windows/fix-printer-connection-and-printing-problems-in-windows-fb830bff-7702-6349-33cd-9443fe987f73
madurez: T0
