# Periféricos y hardware (2): impresoras, monitores, teclado, mouse, USB-C, audio y lápiz. Fichas guiadas con fuente oficial (prefijo HWP).
id: HWP-001
area: perifericos
titulo:
  sencillo: "La impresora dice «Controlador no disponible»"
  tecnico: "Impresora con controlador ausente o incompatible"
explicacion:
  sencillo: "El controlador es el programita que le explica a Windows cómo hablar con tu impresora. Si falta o quedó viejo (pasa a veces después de una actualización), la impresora aparece pero no imprime. Se arregla volviendo a instalarlo."
  tecnico: "Estado «Controlador no disponible» en Impresoras y escáneres: reinstalar el controlador vía Windows Update o desde el sitio del fabricante, quitando y volviendo a agregar la impresora."
frases: ["la impresora dice controlador no disponible", "me aparece que no está disponible el driver de la impresora", "después de actualizar windows la impresora quedó sin controlador", "falta el driver de la impresora"]
pasos:
  - texto: "Abrí Impresoras y escáneres, elegí tu impresora y tocá «Quitar». Después tocá «Agregar dispositivo» para que Windows la vuelva a encontrar e instale su controlador."
    abrir: "ms-settings:printers"
  - texto: "Buscá actualizaciones en Windows Update: es la forma que recomienda Microsoft para conseguir el controlador de la impresora."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si sigue igual, anotá el modelo (está escrito en la impresora), entrá a la página oficial del fabricante, sección «Soporte» o «Drivers», y descargá el programa para tu versión de Windows. Abrí el archivo descargado y seguí los pasos."
    abrir: "https://support.microsoft.com/windows/hardware/printer/download-and-install-the-latest-printer-drivers"
  - texto: "Microsoft explica otros pasos si la impresora sigue sin imprimir."
    abrir: "https://support.microsoft.com/windows/fix-printer-connection-and-printing-problems-in-windows-fb830bff-7702-6349-33cd-9443fe987f73"
fuentes:
  - https://support.microsoft.com/windows/hardware/printer/download-and-install-the-latest-printer-drivers
  - https://support.microsoft.com/windows/fix-printer-connection-and-printing-problems-in-windows-fb830bff-7702-6349-33cd-9443fe987f73
  - https://support.microsoft.com/windows/hardware/printer/add-or-install-a-printer-in-windows
madurez: T0
