id: DEVC-013
area: hardware
titulo:
  sencillo: "Código 22: el dispositivo está deshabilitado"
  tecnico: "Código 22: CM_PROB_DISABLED"
explicacion:
  sencillo: "Alguien apagó ese aparato desde el Administrador de dispositivos. No está roto: hay que volver a habilitarlo."
  tecnico: "Dispositivo deshabilitado por el usuario en el Administrador de dispositivos; se resuelve con Habilitar dispositivo."
frases: ["el administrador de dispositivos dice código 22", "dice este dispositivo está deshabilitado", "la cámara aparece deshabilitada con código 22", "cómo vuelvo a activar un dispositivo deshabilitado"]
pasos:
  - texto: "Abrí el Administrador de dispositivos (clic derecho en Inicio) y buscá el aparato."
