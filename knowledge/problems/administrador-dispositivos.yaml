  - texto: "En el Administrador de dispositivos apretá F5 para actualizar la lista."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
  - texto: "Si el código 21 sigue ahí, reiniciá la compu."
fuentes:
