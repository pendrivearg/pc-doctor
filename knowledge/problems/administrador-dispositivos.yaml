id: DEVC-010
area: hardware
titulo:
  sencillo: "Código 18: hay que reinstalar los controladores del dispositivo"
  tecnico: "Código 18: CM_PROB_REINSTALL"
explicacion:
  sencillo: "Windows pide que se vuelva a instalar el controlador de ese aparato. Se hace desde el Administrador de dispositivos en un par de minutos."
  tecnico: "Reinstalar mediante Actualizar controlador, o Desinstalar + Acción > Buscar cambios de hardware. Suele ser transitorio."
frases: ["el administrador de dispositivos dice código 18", "dice que reinstale los controladores código 18", "error código 18 en un dispositivo"]
pasos:
  - texto: "En el Administrador de dispositivos, clic derecho en el aparato > «Actualizar controlador» > la opción de buscar automáticamente."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Si no cambia: guardá lo que estés haciendo, clic derecho en el aparato > «Desinstalar el dispositivo», y después menú «Acción» > «Buscar cambios de hardware» para que Windows lo vuelva a instalar."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
  - texto: "Si Windows no encuentra el controlador, bajalo de la página oficial del fabricante."
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-reinstall
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
