id: DEVC-008
area: hardware
titulo:
  sencillo: "Código 12 o 34: el dispositivo no encuentra recursos libres o no sabe cómo configurarse"
  tecnico: "Código 12 (CM_PROB_NORMAL_CONFLICT) y código 34 (CM_PROB_NO_SOFTCONFIG)"
explicacion:
  sencillo: "Cada pieza de la compu necesita unos «recursos» internos para comunicarse. Con el código 12, dos piezas quieren usar los mismos y chocan; con el código 34, Windows no sabe qué recursos darle y hay que configurarlo a mano. Es un tema más técnico que los demás."
  tecnico: "12: dos dispositivos con los mismos puertos de E/S, IRQ o canal DMA, o el BIOS no asignó recursos. 34: requiere configuración forzada en la pestaña Recursos."
frases: ["el administrador de dispositivos dice código 12", "no encuentra suficientes recursos libres código 12", "me sale código 34 en un dispositivo", "dice que tengo que deshabilitar otro dispositivo para usar este"]
pasos:
  - texto: "Anotá el nombre del aparato y el código que figura en «Estado del dispositivo» (clic derecho > «Propiedades»)."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
  - texto: "Código 12: el mensaje avisa que, para usar ese aparato, habría que deshabilitar otro. Microsoft indica resolver el conflicto desde el Administrador de dispositivos; a veces la causa es que el BIOS no le asignó recursos y hace falta una actualización del fabricante."
  - texto: "Código 34: hay que configurar el aparato según el manual del fabricante y después fijar sus recursos en la pestaña «Recursos» de sus propiedades."
derivar: "Resolver conflictos de recursos o tocar el BIOS es delicado: si no estás seguro, llevá la compu a un técnico con el nombre del aparato y el código."
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-normal-conflict
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-no-softconfig
madurez: T0
