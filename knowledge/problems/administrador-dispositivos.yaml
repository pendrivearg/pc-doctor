id: DEVC-005
area: hardware
titulo:
  sencillo: "El Administrador de dispositivos dice «Código 1»"
  tecnico: "Código 1: CM_PROB_NOT_CONFIGURED (dispositivo no configurado correctamente)"
explicacion:
  sencillo: "El código 1 quiere decir que ese aparato no está bien configurado: Windows no le instaló ningún controlador."
  tecnico: "Sin entrada ConfigFlags en el registro: no hay controlador instalado (normalmente no se encontró el INF)."
frases: ["el administrador de dispositivos dice código 1", "me aparece error código 1 en un dispositivo", "dice que el dispositivo no está configurado correctamente", "código 1 en el controlador"]
pasos:
  - texto: "Abrí el Administrador de dispositivos (clic derecho en Inicio), hacé clic derecho en el aparato con el signo amarillo y elegí «Actualizar controlador» > la opción de buscar automáticamente."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Si no encuentra nada, revisá las actualizaciones opcionales de Windows Update, instalá los controladores que aparezcan y reiniciá."
    abrir: "ms-settings:windowsupdate-optionalupdates"
  - texto: "Si sigue el código 1, bajá el controlador de la página oficial del fabricante e instalalo a mano: escribile a PC Doctor «cómo actualizo un driver a mano»."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-not-configured
  - https://support.microsoft.com/help/15046
