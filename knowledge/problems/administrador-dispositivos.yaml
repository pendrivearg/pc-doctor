id: DEVC-012
area: hardware
titulo:
  sencillo: "Código 21: Windows está quitando este dispositivo"
  tecnico: "Código 21: CM_PROB_WILL_BE_REMOVED"
explicacion:
  sencillo: "Windows está en pleno proceso de sacar ese aparato de la lista. Es pasajero: en general se va solo en unos segundos."
  tecnico: "Estado transitorio mientras se consulta y se quita el dispositivo."
