# Administrador de dispositivos: signo de exclamación amarillo, dispositivo desconocido, volver o actualizar controladores a mano y códigos de error (1 a 52). Guiadas con fuente oficial.
id: DEVC-001
area: hardware
titulo:
  sencillo: "Hay un aparato con un signo de exclamación amarillo"
  tecnico: "Dispositivo con signo de exclamación amarillo: ver su código de error"
explicacion:
  sencillo: "Cuando Windows tiene problemas con una pieza de la compu o un accesorio, en el Administrador de dispositivos le pone un signo de exclamación amarillo. Cada problema tiene un número («código») que dice qué pasa y cómo seguir."
  tecnico: "Administrador de dispositivos > Propiedades > General > Estado del dispositivo muestra el código (CM_PROB_* definidos en Cfg.h)."
frases: ["hay un signo de exclamación amarillo en el administrador de dispositivos", "me sale un triangulito amarillo al lado de un dispositivo", "cómo sé qué error tiene un dispositivo", "el administrador de dispositivos marca algo en amarillo"]
pasos:
  - texto: "Hacé clic derecho en el botón Inicio y elegí «Administrador de dispositivos»."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Abrí el grupo donde está el aparato marcado (por ejemplo «Adaptadores de pantalla»), hacé clic derecho sobre él y elegí «Propiedades»."
  - texto: "En la pestaña «General», mirá el recuadro «Estado del dispositivo»: ahí figura el número, por ejemplo «(Código 43)». Escribile ese código a PC Doctor, por ejemplo «el administrador de dispositivos dice código 43»."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-manager-error-messages
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
madurez: T0
