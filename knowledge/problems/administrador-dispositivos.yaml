id: DEVC-018
area: hardware
titulo:
  sencillo: "Código 32: el controlador del dispositivo está desactivado"
  tecnico: "Código 32: CM_PROB_DISABLED_SERVICE"
explicacion:
  sencillo: "El programa que hace andar ese aparato quedó configurado para no arrancar. A veces es a propósito porque otro controlador hace ese trabajo; si el aparato no te anda, conviene reinstalarlo."
