id: DEVC-004
area: windows
titulo:
  sencillo: "Quiero instalar a mano un controlador que bajé del fabricante"
  tecnico: "Actualizar un controlador manualmente desde una carpeta (Update driver > Browse my computer for drivers)"
explicacion:
  sencillo: "A veces Windows no encuentra solo el controlador correcto. Entonces se baja de la página oficial del fabricante y se lo indicás a Windows a mano. Bajalo únicamente del sitio oficial de la marca: de otras páginas puede venir con virus."
  tecnico: "Administrador de dispositivos > Actualizar controlador > buscar controladores en el equipo > Examinar (carpeta con el INF descomprimido) > Siguiente."
frases: ["cómo actualizo un driver a mano", "bajé el controlador y no sé cómo instalarlo", "instalar un controlador desde una carpeta", "windows no encuentra el driver y yo lo tengo descargado"]
pasos:
  - texto: "Primero probá lo fácil: en las actualizaciones opcionales de Windows Update, si hay controladores, instalalos y reiniciá."
    abrir: "ms-settings:windowsupdate-optionalupdates"
  - texto: "Si no, bajá el controlador de la página oficial del fabricante, eligiendo tu versión de Windows. Si viene comprimido (ZIP), descomprimilo en una carpeta."
  - texto: "En el Administrador de dispositivos, clic derecho en el aparato > «Actualizar controlador» y elegí la segunda opción, la de buscar los controladores en tu equipo. Tocá «Examinar», elegí la carpeta, «Aceptar» y después «Siguiente»."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Si Windows avisa que ya están instalados los mejores controladores, ese aparato ya está al día. Tocá «Cerrar»."
fuentes:
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
  - https://support.microsoft.com/help/15046
