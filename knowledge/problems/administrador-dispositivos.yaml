id: DEVC-009
area: hardware
titulo:
  sencillo: "Código 14 o 38: el dispositivo necesita que reinicies la compu"
  tecnico: "Código 14 (CM_PROB_NEED_RESTART) y código 38 (CM_PROB_DRIVER_FAILED_PRIOR_UNLOAD)"
explicacion:
  sencillo: "Estos dos códigos se arreglan reiniciando. El 14 aparece cuando se instaló o cambió algo que necesita un reinicio para terminar; el 38, cuando el controlador viejo quedó cargado en memoria y no deja arrancar el nuevo."
  tecnico: "14: operación pendiente que requiere reinicio (archivos o servicios en cola). 38: instancia previa del controlador todavía cargada."
frases: ["el administrador de dispositivos dice código 14", "dice que el dispositivo no va a funcionar hasta que reinicie", "me aparece código 38", "código 38 el controlador sigue en memoria"]
pasos:
  - texto: "Guardá lo que estés haciendo y cerrá los programas."
  - texto: "Reiniciá la compu: Inicio > botón de apagado > «Reiniciar»."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
  - texto: "Al volver, abrí el Administrador de dispositivos y fijate si el signo amarillo se fue. Si queda otro código, escribíselo a PC Doctor."
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-need-restart
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-driver-failed-prior-unload
madurez: T0
