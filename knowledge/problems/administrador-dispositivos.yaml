id: DEVC-019
area: hardware
titulo:
  sencillo: "Código 33 o 35: el dispositivo necesita una actualización del BIOS"
  tecnico: "Código 33 (CM_PROB_TRANSLATION_FAILED) y código 35 (CM_PROB_BIOS_TABLE)"
explicacion:
  sencillo: "Windows no logra saber qué recursos necesita el aparato (código 33), o el firmware de la placa (el BIOS) no trae la información necesaria (código 35). En general hace falta una actualización del BIOS del fabricante de la compu."
  tecnico: "33: falló la traducción de recursos. 35: tabla MPS del BIOS incorrecta; obtener BIOS nuevo del fabricante."
frases: ["el administrador de dispositivos dice código 35", "dice que contacte al fabricante para actualizar el bios", "me aparece código 33", "windows no puede determinar qué recursos necesita código 33"]
pasos:
  - texto: "Anotá la marca y el modelo exacto de tu compu (o de la placa madre) y el código que aparece."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
  - texto: "Entrá a la página de soporte oficial del fabricante y fijate si hay una actualización de BIOS o firmware para tu modelo."
  - texto: "Con el código 33, si la actualización no lo arregla, el aparato puede necesitar configurarse, repararse o reemplazarse."
derivar: "Actualizar el BIOS es delicado: seguí al pie de la letra las instrucciones del fabricante o pedíselo a un técnico."
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-translation-failed
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-bios-table
