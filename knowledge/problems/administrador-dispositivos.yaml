  - texto: "Usá el menú «Acción» > «Buscar cambios de hardware» para que se reinstale."
  - texto: "Si el código vuelve, bajá un controlador nuevo de la página oficial del fabricante."
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-failed-driver-entry
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-legacy-service-no-devices
