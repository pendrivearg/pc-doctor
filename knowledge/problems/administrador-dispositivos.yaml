id: DEVC-002
area: hardware
titulo:
  sencillo: "En el Administrador de dispositivos aparece un «Dispositivo desconocido»"
  tecnico: "Dispositivo sin controlador compatible"
explicacion:
  sencillo: "Windows ve que hay algo conectado o una pieza adentro de la compu, pero no tiene su controlador (el programita que la hace andar). Se arregla consiguiendo el controlador correcto: primero por Windows Update y, si no, de la página del fabricante."
  tecnico: "Revisar el código en Estado del dispositivo; código 28 = controladores no instalados (STATUS_PNP_NO_COMPAT_DRIVERS: no se encontró controlador compatible)."
frases: ["me aparece un dispositivo desconocido en el administrador", "hay algo que dice dispositivo desconocido con un signo amarillo", "windows no reconoce una pieza de la compu", "no sé qué es ese dispositivo desconocido"]
pasos:
  - texto: "Mirá qué código tiene: clic derecho en el aparato > «Propiedades» y fijate en «Estado del dispositivo». Si dice código 28 o código 1, le falta el controlador."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
  - texto: "Abrí las actualizaciones opcionales de Windows Update: si aparecen controladores, marcalos, tocá «Descargar e instalar» y reiniciá la compu al terminar."
    abrir: "ms-settings:windowsupdate-optionalupdates"
  - texto: "Si no aparece nada, en el Administrador de dispositivos hacé clic derecho en el aparato > «Actualizar controlador» y elegí la opción de buscar controladores automáticamente."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Si sigue igual, bajá el controlador solamente de la página oficial del fabricante de tu compu o de la pieza, nunca de otras páginas."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-failed-install
  - https://support.microsoft.com/help/15046
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
