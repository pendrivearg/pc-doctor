id: DEVC-006
area: hardware
titulo:
  sencillo: "Código 3: el controlador puede estar dañado o falta memoria"
  tecnico: "Código 3: CM_PROB_OUT_OF_MEMORY"
explicacion:
  sencillo: "Windows no pudo hacer andar el aparato: o su controlador está dañado, o a la compu le falta memoria en ese momento porque hay demasiadas cosas abiertas."
  tecnico: "Controlador dañado o memoria/recursos del sistema insuficientes (también si DriverEntry devuelve STATUS_INSUFFICIENT_RESOURCES)."
frases: ["el administrador de dispositivos marca código 3", "error código 3 en un dispositivo", "dice que el controlador puede estar dañado o que hay poca memoria", "me salió código 3 con muchos programas abiertos"]
pasos:
  - texto: "Cerrá los programas que no estés usando y fijate en el Administrador de tareas (Ctrl + Mayús + Esc) cuánta memoria está ocupada."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
  - texto: "Guardá lo que estés haciendo. En el Administrador de dispositivos, clic derecho en el aparato > «Desinstalar el dispositivo» > «Desinstalar», y reiniciá la compu: Windows intenta instalar el controlador de nuevo."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Si no se reinstaló solo, en el Administrador de dispositivos usá el menú «Acción» > «Buscar cambios de hardware»."
  - texto: "Si el código 3 vuelve cada vez que tenés muchas cosas abiertas, puede que la compu necesite más memoria RAM: escribile a PC Doctor «la PC tiene poca memoria RAM»."
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-out-of-memory
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
madurez: T0
