  - texto: "Si apareció de golpe sin que instalaras nada, revisá la compu con el antivirus: escribile a PC Doctor «creo que tengo un virus»."
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
