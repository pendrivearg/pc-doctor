id: DEVC-011
area: hardware
titulo:
  sencillo: "Código 19: la configuración del dispositivo está incompleta o dañada"
  tecnico: "Código 19: CM_PROB_REGISTRY"
explicacion:
  sencillo: "Windows guarda la configuración de cada aparato en una especie de libreta interna (el «registro»). Si esa parte se dañó, el aparato no arranca. Se arregla reinstalando el controlador o volviendo la compu a un punto anterior."
  tecnico: "Problema en el registro: más de un servicio definido, error al abrir la clave del servicio o nombre del controlador inaccesible (p. ej. filtro inexistente, STATUS_OBJECT_NAME_NOT_FOUND)."
frases: ["el administrador de dispositivos dice código 19", "código 19 información de configuración incompleta o dañada", "me salió código 19 en un dispositivo", "error código 19 en el registro"]
pasos:
  - texto: "Guardá lo que estés haciendo. En el Administrador de dispositivos, clic derecho en el aparato > «Desinstalar el dispositivo»."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
  - texto: "Después usá el menú «Acción» > «Buscar cambios de hardware» para que Windows lo instale de nuevo."
  - texto: "Si sigue, podés volver la compu a un punto de restauración de antes de que empezara el problema: escribile a PC Doctor «quiero volver la computadora a como estaba hace unos días»."
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-registry
madurez: T0
