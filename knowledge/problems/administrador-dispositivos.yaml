id: DEVC-003
area: windows
titulo:
  sencillo: "Actualicé un controlador y algo dejó de andar: quiero volver al anterior"
  tecnico: "Revertir al controlador anterior (Roll Back Driver)"
explicacion:
  sencillo: "Si un aparato (la pantalla, el sonido, el Wi-Fi) empezó a fallar justo después de actualizar su controlador, Windows te deja volver a la versión que tenías antes. Hace falta entrar con una cuenta de administrador."
  tecnico: "Administrador de dispositivos > Propiedades > pestaña Controlador > Revertir al controlador anterior; requiere permisos de administrador."
frases: ["quiero volver al driver que tenía antes", "actualicé el controlador y ahora anda peor", "cómo vuelvo atrás un controlador", "desde que actualicé el driver de video anda mal"]
pasos:
  - texto: "Hacé clic derecho en Inicio > «Administrador de dispositivos». Buscá el aparato, hacé clic derecho sobre él y elegí «Propiedades»."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Entrá a la pestaña «Controlador» y tocá «Revertir al controlador anterior». Elegí un motivo y confirmá con «Sí»."
  - texto: "Si te lo pide, reiniciá la compu y probá si el aparato volvió a andar."
  - texto: "Si ese botón no se puede tocar, conseguí la versión anterior en la página oficial del fabricante y escribile a PC Doctor «bajé el controlador y no sé cómo instalarlo»."
fuentes:
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
madurez: T0
