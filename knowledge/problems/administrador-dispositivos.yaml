id: DEVC-007
area: hardware
titulo:
  sencillo: "Código 10: el dispositivo no puede iniciar"
  tecnico: "Código 10: CM_PROB_FAILED_START"
explicacion:
  sencillo: "Windows encontró el aparato pero no lo pudo arrancar. Microsoft recomienda empezar por actualizar su controlador."
  tecnico: "Un controlador de la pila falló IRP_MN_START_DEVICE; el motivo puede verse en DEVPKEY_Device_ProblemStatus o en FailReasonString."
frases: ["el administrador de dispositivos dice código 10", "este dispositivo no puede iniciar código 10", "me sale código 10 en el audio", "error código 10 en un usb"]
pasos:
  - texto: "En el Administrador de dispositivos, clic derecho en el aparato > «Actualizar controlador» > la opción de buscar automáticamente. Si no encuentra nada, tocá la opción que te lleva a buscar en Windows Update."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Revisá las actualizaciones opcionales de Windows Update, instalá los controladores que haya y reiniciá al terminar."
    abrir: "ms-settings:windowsupdate-optionalupdates"
  - texto: "Si el código 10 apareció justo después de actualizar ese controlador, volvé al anterior: escribile a PC Doctor «quiero volver al driver que tenía antes»."
  - texto: "Si nada cambia, bajá el controlador de la página oficial del fabricante del aparato."
    abrir: "https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e"
fuentes:
  - https://support.microsoft.com/windows/error-codes-in-device-manager-in-windows-524e9e89-4dee-8883-0afa-6bca0456324e
  - https://learn.microsoft.com/windows-hardware/drivers/install/cm-prob-failed-start
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
  - https://support.microsoft.com/help/15046
