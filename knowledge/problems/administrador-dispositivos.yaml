  - texto: "Hay que activarlo en el BIOS (la configuración que aparece al prender la compu, antes de Windows). Cómo se entra y dónde está la opción depende de la marca: buscalo en el manual o en la página de soporte del fabricante de tu compu."
derivar: "Si no te sentís seguro de entrar al BIOS, pedile a un técnico que active ese dispositivo, y no toques otras opciones de ahí."
fuentes:
