id: ACC-PWD-001
area: basico
titulo:
  sencillo: "Me olvidé la contraseña de la computadora"
  tecnico: "Recuperación oficial de contraseña de Windows"
explicacion:
  sencillo: >-
    Hay caminos oficiales: si entrás con una cuenta Microsoft (un correo), la contraseña se cambia desde otro
    dispositivo. Si es una cuenta local, con las preguntas de seguridad o con otra cuenta de administrador.
    PC Doctor nunca saltea contraseñas.
  tecnico: "Restablecimiento de cuenta Microsoft en línea; cuenta local: preguntas de seguridad, disco de restablecimiento u otro administrador."
frases: ["me olvidé la contraseña de windows", "no me acuerdo la clave para entrar a la compu", "no puedo entrar a mi usuario", "olvidé el pin y la contraseña"]
pasos:
  - texto: "Si para entrar usás un correo (cuenta Microsoft), cambiá la contraseña desde el celular u otra computadora y después entrá con la nueva."
    abrir: "https://support.microsoft.com/accounts-billing/security/change-or-reset-your-microsoft-account-password-in-windows"
  - texto: "Si es una cuenta local, en la pantalla de inicio escribí cualquier cosa, tocá «Restablecer contraseña» y respondé las preguntas de seguridad."
    abrir: "https://support.microsoft.com/windows/security/change-or-reset-your-local-account-password-in-windows"
derivar: "Si ninguna opción oficial funciona, Microsoft no puede recuperar la contraseña: la única salida es restablecer la PC, y eso borra los datos de esa cuenta."
fuentes:
  - https://support.microsoft.com/windows/security/change-or-reset-your-local-account-password-in-windows
  - https://support.microsoft.com/accounts-billing/security/change-or-reset-your-microsoft-account-password-in-windows
madurez: T0
