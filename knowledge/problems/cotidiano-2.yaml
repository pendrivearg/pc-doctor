id: ACC-PIN-001
area: basico
titulo:
  sencillo: "El PIN para entrar a Windows no funciona"
  tecnico: "Restablecer el PIN de Windows Hello"
explicacion:
  sencillo: "El PIN se puede cambiar o crear de nuevo sin perder nada, usando la contraseña de la cuenta."
  tecnico: "Restablecimiento del PIN desde la pantalla de inicio de sesión o desde Opciones de inicio de sesión."
frases: ["no me funciona el pin", "me dice que el pin no está disponible", "olvidé el pin de la computadora"]
pasos:
  - texto: "En la pantalla de inicio, tocá «Olvidé mi PIN» y seguí los pasos (te va a pedir la contraseña de tu cuenta)."
  - texto: "Si ya entraste, podés cambiarlo en Opciones de inicio de sesión > PIN."
    abrir: "ms-settings:signinoptions"
fuentes:
  - https://support.microsoft.com/windows/security/change-or-reset-your-pin-in-windows
madurez: T0
