# Problemas cotidianos (módulos E, H, I, M, R): Bluetooth, pendrives, TV, celular, cuentas, programas predeterminados, publicidad.
id: BT-001
area: perifericos
titulo:
  sencillo: "Los auriculares o el parlante Bluetooth no se conectan"
  tecnico: "Fallas de emparejamiento o conexión Bluetooth"
explicacion:
  sencillo: "Casi siempre se arregla apagando y prendiendo el Bluetooth, o quitando el aparato de la lista y volviéndolo a agregar."
  tecnico: "Re-emparejamiento, ahorro de energía del adaptador y controlador Bluetooth."
frases: ["no se conectan los auriculares bluetooth", "el parlante bluetooth no aparece", "no me empareja el bluetooth", "se desconectan los auriculares inalámbricos"]
sondas: [dispositivos]
pasos:
  - texto: "Fijate que los auriculares o el parlante estén cargados y en modo para emparejar (suele ser mantener apretado el botón de encendido hasta que titile una luz)."
  - texto: "Abrí Bluetooth, apagalo y volvelo a prender. Si el aparato aparece en la lista, quitalo y agregalo de nuevo."
    abrir: "ms-settings:bluetooth"
  - texto: "Si no aparece la opción de Bluetooth, revisá que el modo avión esté apagado."
    abrir: "ms-settings:network-airplanemode"
fuentes:
  - https://support.microsoft.com/windows/hardware/bluetooth/fix-bluetooth-problems-in-windows
madurez: T0
---
id: USB-001
area: perifericos
titulo:
  sencillo: "El pendrive o el disco externo no aparece"
  tecnico: "Dispositivo de almacenamiento USB no reconocido"
explicacion:
  sencillo: "Suele ser el puerto, el cable o falta de energía. A veces aparece pero sin letra, o tiene un problema que Windows avisa con un código."
  tecnico: "Revisar puerto directo (sin hub), alimentación, estado en el Administrador de dispositivos y asignación de letra."
frases: ["no me aparece el pendrive", "no reconoce el disco externo", "enchufo el pendrive y no pasa nada", "dispositivo usb no reconocido"]
sondas: [dispositivos]
pasos:
  - texto: "Probá en otro puerto USB, directo en la computadora (no en un alargue o hub). En PCs de escritorio, mejor los de atrás."
  - texto: "Si es un disco externo con su propia fuente o dos cables, conectalos todos."
  - texto: "Abrí Discos y volúmenes y fijate si el pendrive aparece ahí aunque no tenga letra. Si aparece «sin formato», no lo formatees: primero intentá recuperar lo que tiene."
    abrir: "ms-settings:disksandvolumes"
derivar: "Si no aparece en ninguna PC, el pendrive o el disco probablemente esté dañado. Para recuperar fotos o documentos importantes, consultá a un técnico antes de formatearlo."
fuentes:
  - https://support.microsoft.com/windows/hardware/usb/fix-usb-c-problems-in-windows
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-manager-error-messages
madurez: T0
