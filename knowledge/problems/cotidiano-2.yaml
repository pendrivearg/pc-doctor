id: TV-001
area: audio
titulo:
  sencillo: "Quiero ver la computadora en el televisor"
  tecnico: "Proyección por HDMI o pantalla inalámbrica (Miracast)"
explicacion:
  sencillo: "Se puede con un cable HDMI o, si el televisor lo permite, sin cables. Con Windows + P elegís si se ve igual en los dos o solo en la tele."
  tecnico: "Modos de proyección (Win+P) y conexión Miracast (Win+K)."
frases: ["quiero ver la compu en la tele", "conectar la computadora al televisor", "pasar la pantalla a la tv", "no se ve en la tele con el hdmi"]
pasos:
  - texto: "Con cable: conectá un cable HDMI de la computadora al televisor y elegí esa entrada HDMI con el control remoto de la tele."
  - texto: "Apretá Windows + P y elegí «Duplicar» (se ve igual en las dos pantallas) o «Solo segunda pantalla»."
  - texto: "Sin cable: si el televisor admite pantalla inalámbrica (Miracast), prendelo y apretá Windows + K para elegirlo."
  - texto: "Si se ve pero el sonido sigue saliendo por la computadora, elegí el televisor como salida de sonido."
    abrir: "ms-settings:sound"
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/screen-mirroring-and-projecting-to-your-pc-or-wireless-display
madurez: T0
