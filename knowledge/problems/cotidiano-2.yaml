id: DAY-DEF-001
area: programas
titulo:
  sencillo: "Los archivos se abren con el programa equivocado"
  tecnico: "Aplicaciones predeterminadas por tipo de archivo"
explicacion:
  sencillo: "Windows permite elegir con qué programa se abre cada tipo de archivo, por ejemplo los PDF o las fotos."
  tecnico: "Configuración > Aplicaciones > Aplicaciones predeterminadas, por extensión."
frases: ["los pdf se me abren con otro programa", "las fotos se abren con un programa que no quiero", "cambiar con qué programa se abre un archivo"]
pasos:
  - texto: "Abrí Aplicaciones predeterminadas, buscá el tipo de archivo (por ejemplo .pdf) y elegí el programa que querés."
    abrir: "ms-settings:defaultapps"
  - texto: "Para una sola vez: clic derecho sobre el archivo > «Abrir con» > elegí el programa."
fuentes:
  - https://support.microsoft.com/windows/change-default-apps-in-windows-e5d82cad-17d1-c53b-3505-f10a32e1894d
madurez: T0
