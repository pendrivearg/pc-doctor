id: SEC-HIJ-003
area: seguridad
titulo:
  sencillo: "Aparecen avisos de publicidad o de páginas en la esquina de la pantalla"
  tecnico: "Notificaciones push de sitios web"
explicacion:
  sencillo: >-
    Alguna página web consiguió permiso para mandarte avisos (a veces con mensajes alarmantes o publicidad).
    No es un virus: se apaga desde el navegador, quitándole el permiso a esa página.
  tecnico: "Permisos de notificación por sitio en el navegador."
frases: ["me aparecen anuncios en la esquina de la pantalla", "me salen notificaciones de páginas raras", "avisos de publicidad abajo a la derecha", "me llegan avisos de premios y virus"]
sondas: [seguridad]
pasos:
  - texto: "Abrí el navegador, entrá a Configuración > Privacidad o Permisos del sitio > Notificaciones y bloqueá las páginas que no conocés."
    abrir: "https://support.microsoft.com/edge/manage-website-notifications-in-microsoft-edge"
  - texto: "No toques los avisos que dicen que ganaste un premio o que tenés virus: son engaños."
fuentes:
  - https://support.microsoft.com/edge/manage-website-notifications-in-microsoft-edge
madurez: T0
