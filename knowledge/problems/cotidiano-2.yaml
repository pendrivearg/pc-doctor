id: PHN-001
area: archivos
titulo:
  sencillo: "Pasar las fotos del celular a la computadora"
  tecnico: "Importación de fotos y videos desde el teléfono"
explicacion:
  sencillo: "Se puede con el cable del cargador (si sirve para pasar datos) o, en Android, con la aplicación Vínculo Móvil de Windows."
  tecnico: "Importación por USB (MTP) desde la app Fotos, Vínculo Móvil (Android) o iCloud para Windows (iPhone)."
frases: ["pasar las fotos del celular a la compu", "cómo paso las fotos del teléfono", "conecto el celular y no veo las fotos", "bajar fotos del iphone a la computadora"]
pasos:
  - texto: "Conectá el celular con un cable USB que sirva para pasar datos y desbloquealo. En Android, en el aviso que aparece en el celular elegí «Transferir archivos» o «Transferir fotos»."
  - texto: "Abrí la aplicación Fotos de Windows, tocá «Importar» y elegí el celular."
  - texto: "En Android también podés usar Vínculo Móvil para ver las fotos recientes sin cable."
    abrir: "ms-settings:mobile-devices"
  - texto: "En iPhone, se usa la aplicación iCloud para Windows."
fuentes:
  - https://support.microsoft.com/windows/apps/photos/import-photos-and-videos-from-phone-to-pc
madurez: T0
