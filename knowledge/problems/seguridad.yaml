id: SCAM-001
area: seguridad
titulo:
  sencillo: "Una página dice que mi PC está infectada y que llame a un número"
  tecnico: "Estafa de soporte técnico (bloqueo de navegador)"
explicacion:
  sencillo: >-
    Es una estafa. Ningún aviso real de Microsoft muestra un teléfono para llamar. La página no puede hacerle
    nada a tu computadora si no llamás ni instalás lo que te piden.
  tecnico: "Página de bloqueo de navegador con pantalla completa y audio; no implica infección local."
frases: ["me salió que mi pc está infectada y que llame", "una página dice que llame a microsoft", "pantalla de virus con un teléfono", "no puedo cerrar la página de virus"]
sondas: [seguridad]
pasos:
  - texto: "No llames al número ni instales nada."
  - texto: "Cerrá el navegador con Ctrl+Mayús+Esc (Administrador de tareas) > seleccioná el navegador > Finalizar tarea."
  - texto: "Al volver a abrir el navegador, elegí NO restaurar las pestañas."
fuentes:
  - https://support.microsoft.com/windows/protect-yourself-from-tech-support-scams-2ebf91bd-f94c-2a8a-e541-f5c800d18435
madurez: T0
