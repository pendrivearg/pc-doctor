id: ACC-GML-001
area: basico
titulo:
  sencillo: "Me olvidé la contraseña de Gmail"
  tecnico: "Recuperación de cuenta de Google"
explicacion:
  sencillo: >-
    Google la recupera solo por su página oficial, haciéndote preguntas para comprobar que la cuenta es tuya.
    Google no atiende por teléfono: si alguien te llama o te escribe diciendo que es de Google y te pide un código, es una estafa.
    PC Doctor no lee ni guarda contraseñas.
  tecnico: "Recuperación de cuenta de Google (g.co/recover); usar un dispositivo y lugar habituales; correo o teléfono de recuperación."
frases: ["me olvidé la clave del gmail", "no puedo entrar a mi correo de google", "recuperar mi cuenta de gmail", "no me acuerdo la contraseña de google"]
pasos:
  - texto: "Hacelo desde una computadora o celular donde ya hayas entrado antes a tu Gmail, y desde tu casa si es posible: Google lo tiene en cuenta."
  - texto: "Entrá a la página oficial de recuperación y respondé lo que pregunte. Si no sabés una respuesta, poné la mejor aproximación en vez de saltearla."
    abrir: "https://support.google.com/accounts/answer/7682439?hl=es-419"
  - texto: "Si te mandan un código, puede llegar al correo o teléfono de recuperación; revisá también la carpeta de spam."
derivar: "Nunca le des un código de verificación a alguien que te llama o te escribe: Google no pide códigos ni contraseñas."
fuentes:
  - https://support.google.com/accounts/answer/7682439?hl=es-419
  - https://support.google.com/accounts/answer/7299973?hl=es-419
madurez: T0
