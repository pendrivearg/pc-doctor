id: BAS-NOT-001
area: basico
titulo:
  sencillo: "Quiero que la compu deje de interrumpirme con notificaciones"
  tecnico: "Notificaciones de aplicaciones y modo No molestar"
explicacion:
  sencillo: "Se pueden apagar los avisos de un programa en particular, o activar «No molestar» para que no aparezca ninguno por un rato o en ciertos horarios."
  tecnico: "Configuración > Sistema > Notificaciones: por aplicación, No molestar manual o automático (horario, juegos, pantalla completa)."
frases: ["quiero silenciar las notificaciones", "me interrumpen todo el tiempo las notificaciones", "activar no molestar en la compu", "sacar los avisos de un programa"]
pasos:
  - texto: "Para silenciar todo un rato: tocá la fecha y hora (abajo a la derecha) y la campanita con «zZ»."
  - texto: "Para apagar los avisos de un programa: Notificaciones > elegí el programa > desactivalo. Ahí también podés programar «No molestar» por horario."
    abrir: "ms-settings:notifications"
  - texto: "Si los avisos son de una página web (en la esquina, con publicidad), escribile a PC Doctor «avisos de publicidad en la esquina»."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/notifications-and-do-not-disturb-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/notifications-and-do-not-disturb-in-windows
madurez: T0
