id: BAS-ZOOM-001
area: basico
titulo:
  sencillo: "Las páginas de Internet se ven muy chicas o muy grandes"
  tecnico: "Zoom del navegador"
explicacion:
  sencillo: "Cada navegador tiene su propio tamaño (zoom). Si se apretó una tecla sin querer, todo se ve gigante o diminuto. Se arregla con el teclado."
  tecnico: "Ctrl + Más / Ctrl + Menos / Ctrl + 0; zoom predeterminado en Configuración > Accesibilidad > Zoom de página (Edge)."
frases: ["las páginas de internet se ven muy chicas", "la página se ve gigante", "agrandar lo que se ve en el navegador", "se achicó todo en el navegador"]
pasos:
  - texto: "Con el navegador abierto: Ctrl + Más (+) agranda, Ctrl + Menos (−) achica y Ctrl + 0 (cero) vuelve al tamaño normal. También sirve Ctrl + la ruedita del mouse."
  - texto: "Para que todas las páginas se vean más grandes siempre: en Edge, Configuración > Accesibilidad > «Zoom de página»."
    abrir: "https://support.microsoft.com/accessibility/edge/accessibility-features-in-microsoft-edge"
fuentes:
  - https://support.microsoft.com/accessibility/edge/accessibility-features-in-microsoft-edge
  - https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad
madurez: T0
