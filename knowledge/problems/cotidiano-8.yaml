id: BAS-ICO-001
area: basico
titulo:
  sencillo: "Desaparecieron los íconos del escritorio"
  tecnico: "Íconos del escritorio ocultos o carpeta Escritorio movida"
explicacion:
  sencillo: "Casi siempre están ocultos por una opción del menú, no borrados. Otras veces la carpeta del escritorio quedó en OneDrive."
  tecnico: "Ver > Mostrar iconos del escritorio; Configuración de iconos del escritorio; ubicación de la carpeta Escritorio (copia de seguridad de OneDrive)."
frases: ["desaparecieron los íconos del escritorio", "el escritorio quedó vacío", "se borraron los accesos directos del escritorio", "no veo la papelera en el escritorio"]
pasos:
  - texto: "Hacé clic derecho en un lugar vacío del escritorio > Ver > marcá «Mostrar iconos del escritorio»."
  - texto: "Si falta la Papelera o «Este equipo»: Temas > «Configuración de iconos del escritorio», marcalos y Aceptar."
    abrir: "ms-settings:themes"
  - texto: "Si siguen sin aparecer, puede que la carpeta Escritorio haya quedado en otro lugar (por ejemplo, OneDrive). Microsoft explica cómo revisarlo."
    abrir: "https://support.microsoft.com/onedrive/where-have-my-desktop-icons-gone"
fuentes:
  - https://support.microsoft.com/windows/show-desktop-icons-in-windows-c13270f0-3812-c71d-f27e-29aa32588b20
  - https://support.microsoft.com/onedrive/where-have-my-desktop-icons-gone
madurez: T0
