id: DSP-ROT-001
area: windows
titulo:
  sencillo: "La pantalla quedó dada vuelta o de costado"
  tecnico: "Orientación de pantalla cambiada"
explicacion:
  sencillo: "A veces se aprieta sin querer una combinación de teclas que gira la imagen. Se vuelve a poner derecha en un minuto."
  tecnico: "Orientación de pantalla (Horizontal/Vertical/volteada); atajo Ctrl + Alt + flecha según el controlador de video."
frases: ["la pantalla quedó dada vuelta", "la imagen se ve de costado", "se giró la pantalla", "todo se ve al revés en el monitor"]
pasos:
  - texto: "Probá apretar Ctrl + Alt + flecha hacia arriba (en algunas computadoras endereza la imagen al instante)."
  - texto: "Si no cambia: Configuración > Sistema > Pantalla > «Orientación de la pantalla» y elegí «Horizontal». Confirmá con «Mantener cambios»."
    abrir: "ms-settings:display"
  - texto: "Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/windows/change-screen-orientation-f7ab1ff8-971d-58a5-b8ee-bc113bbf3acb"
fuentes:
  - https://support.microsoft.com/windows/change-screen-orientation-f7ab1ff8-971d-58a5-b8ee-bc113bbf3acb
  - https://support.microsoft.com/powerpoint/draw-straight-lines-or-align-things-with-the-ruler-in-powerpoint
