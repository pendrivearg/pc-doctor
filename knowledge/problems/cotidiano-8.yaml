id: BAS-MAG-001
area: basico
titulo:
  sencillo: "Quiero una lupa para ver mejor la pantalla"
  tecnico: "Lupa de Windows (Magnifier)"
explicacion:
  sencillo: "Windows trae una lupa que agranda la parte de la pantalla donde está el mouse. Se prende y se apaga con el teclado, cuando la necesitás."
  tecnico: "Lupa: Windows + Más para activar y acercar, Windows + Menos para alejar, Windows + Esc para cerrar."
frases: ["necesito una lupa para ver la pantalla", "agrandar una parte de la pantalla", "no veo bien lo que hay en la pantalla", "ver más grande donde está el mouse"]
pasos:
  - texto: "Apretá Windows + la tecla Más (+) para prender la lupa. Volvé a apretarla para acercar más; Windows + Menos (−) aleja."
  - texto: "Mové el mouse para recorrer la pantalla agrandada. Para cerrarla: Windows + Esc."
  - texto: "Si querés que todo (letras e íconos) quede siempre más grande, mejor cambiá la escala: escribile a PC Doctor «las letras se ven muy chicas»."
  - texto: "Desde Configuración podés elegir el aumento y que se prenda sola."
    abrir: "ms-settings:easeofaccess-magnifier"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/magnifier/chapter-1-introducing-magnifier"
fuentes:
  - https://support.microsoft.com/accessibility/windows/magnifier/chapter-1-introducing-magnifier
madurez: T0
