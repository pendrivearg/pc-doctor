id: DAY-DL-001
area: archivos
titulo:
  sencillo: "No encuentro lo que descargué"
  tecnico: "Ubicación de las descargas del navegador"
explicacion:
  sencillo: "Casi todo lo que bajás de Internet queda en la carpeta «Descargas». El navegador también tiene una lista de lo último que bajaste."
  tecnico: "Carpeta Descargas del perfil; lista de descargas del navegador (Ctrl + J); ubicación configurable en Configuración > Descargas."
frases: ["no encuentro lo que bajé", "dónde quedan las descargas", "descargué un archivo y no sé dónde está", "dónde se guardó lo que bajé de internet"]
pasos:
  - texto: "En el navegador, apretá Ctrl + J: aparece la lista de lo último que bajaste. Tocá «Mostrar en carpeta» para ver dónde está."
  - texto: "También podés abrir el Explorador de archivos (Windows + E) y entrar a «Descargas», a la izquierda."
  - texto: "Si el navegador guarda en otro lugar, Microsoft explica cómo ver y cambiar esa carpeta."
    abrir: "https://support.microsoft.com/microsoft-edge/find-where-your-browser-is-saving-downloads-d3e83af6-68bb-aa90-3167-eeb657013902"
fuentes:
  - https://support.microsoft.com/microsoft-edge/find-where-your-browser-is-saving-downloads-d3e83af6-68bb-aa90-3167-eeb657013902
  - https://support.microsoft.com/microsoft-edge/keyboard-shortcuts-in-microsoft-edge-50d3edab-30d9-c7e4-21ce-37fe2713cfad
madurez: T0
