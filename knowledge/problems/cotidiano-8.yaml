# Uso cotidiano y accesibilidad: dictar con la voz, lupa, pantalla girada, descargas, avisos, zoom del navegador, íconos del escritorio y Gmail. Guiadas con fuente oficial.
id: BAS-DIC-001
area: basico
titulo:
  sencillo: "Quiero escribir hablando, sin usar el teclado"
  tecnico: "Escritura por voz (Windows + H)"
explicacion:
  sencillo: "Windows escribe lo que decís. Funciona en cualquier lugar donde se pueda escribir (un correo, un documento, el buscador) y entiende español. Necesita Internet y un micrófono."
  tecnico: "Escritura por voz con reconocimiento en línea; idiomas español (México) y español (España) con comandos de puntuación."
frases: ["quiero escribir hablando", "dictarle un texto a la compu", "que la compu escriba lo que digo", "escribir con la voz sin teclado"]
pasos:
  - texto: "Hacé clic donde quieras escribir (por ejemplo, en un correo). Apretá Windows + H y esperá el aviso «Escuchando…». Hablá con normalidad."
  - texto: "Los signos se dictan diciéndolos (por ejemplo «coma» o «punto»). Para terminar, tocá el micrófono de la barrita de dictado."
  - texto: "Si no escribe nada, revisá que el micrófono funcione (también podés escribirle a PC Doctor «no funciona el micrófono»)."
    abrir: "ms-settings:privacy-microphone"
  - texto: "Microsoft lo explica, con todos los comandos de voz."
    abrir: "https://support.microsoft.com/accessibility/windows/use-voice-typing-to-talk-instead-of-type-on-your-pc"
fuentes:
  - https://support.microsoft.com/accessibility/windows/use-voice-typing-to-talk-instead-of-type-on-your-pc
madurez: T0
