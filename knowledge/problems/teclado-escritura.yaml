id: TEC-009
area: basico
titulo:
  sencillo: "Windows me cambia las palabras o me las subraya en rojo al escribir"
  tecnico: "Autocorrección y resaltado de palabras mal escritas de Windows"
explicacion:
  sencillo: "Windows tiene dos opciones de escritura: una corrige sola las palabras que cree que están mal y otra las marca con una rayita roja. Si te cambia palabras que estaban bien, podés apagarlas."
  tecnico: "Hora e idioma > Escritura: «Autocorregir palabras mal escritas» y «Resaltar palabras mal escritas»."
frases: ["la compu me cambia las palabras sola", "windows me corrige lo que escribo y no quiero", "me subraya en rojo palabras que están bien", "escribo un nombre y lo cambia por otra palabra"]
pasos:
  - texto: "Abrí Configuración > Hora e idioma > Escritura."
    abrir: "ms-settings:typing"
  - texto: "Buscá las opciones para autocorregir palabras mal escritas y para resaltarlas. Apagá la que te moleste (o las dos) y probá escribir de nuevo."
    abrir: "https://support.microsoft.com/en-us/windows/experience/backup-recovery/windows-backup-settings-catalog"
derivar: "Si las palabras te las cambia Word y no Windows, escribile a PC Doctor «Word me cambia las palabras solo»."
fuentes:
  - https://support.microsoft.com/en-us/windows/experience/backup-recovery/windows-backup-settings-catalog
madurez: T0
