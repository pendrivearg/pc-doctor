id: TEC-021
area: perifericos
titulo:
  sencillo: "El teclado Bluetooth se desconecta o deja de escribir"
  tecnico: "Teclado Bluetooth: pilas, re-emparejamiento e interferencias"
explicacion:
  sencillo: "Los teclados inalámbricos por Bluetooth se cortan casi siempre por pilas gastadas, porque quedaron conectados a otra compu o por tener muchos aparatos Bluetooth a la vez. Para ahorrar pilas también se «duermen» si no los usás un rato."
  tecnico: "Revisar pilas, quitar y volver a emparejar (botón de emparejamiento 5–7 s), modo avión 10–15 s, reducir dispositivos Bluetooth simultáneos; hibernación tras 8–10 min de inactividad."
frases: ["el teclado bluetooth se corta solo", "el teclado inalámbrico se desconecta a cada rato", "el teclado bluetooth tarda en escribir después de un rato", "se me desconectó el teclado bluetooth y no vuelve"]
pasos:
  - texto: "Revisá las pilas: que estén bien puestas, o cambialas por nuevas. Si el teclado es recargable, enchufalo con su cable."
    abrir: "https://support.microsoft.com/en-us/topic/troubleshoot-problems-with-your-surface-mouse-or-keyboard-5afe478d-6402-d72b-93b9-e4235fd5c4cd"
  - texto: "Abrí Bluetooth y dispositivos, quitá el teclado de la lista y volvé a agregarlo: mantené apretado su botón para emparejar unos 5 a 7 segundos y elegilo en «Agregar dispositivo» > «Bluetooth»."
    abrir: "ms-settings:bluetooth"
  - texto: "Si la luz del teclado titila tres veces y se apaga, quedó conectado a otra compu cercana: quitalo de esa y emparejalo con esta."
  - texto: "Apagá los aparatos Bluetooth que no uses: tener muchos conectados a la vez puede causar cortes. También ayuda prender el modo avión 10 a 15 segundos y apagarlo."
derivar: "Si el teclado no anda tampoco en otra compu, hay que reemplazarlo."
fuentes:
  - https://support.microsoft.com/en-us/topic/troubleshoot-problems-with-your-surface-mouse-or-keyboard-5afe478d-6402-d72b-93b9-e4235fd5c4cd
madurez: T0
