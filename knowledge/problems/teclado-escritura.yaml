    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "No sirve solo para texto: Ctrl + Y vuelve a hacer cualquier acción que hayas deshecho con Ctrl + Z, por ejemplo en una carpeta."
