id: TEC-014
area: basico
titulo:
  sencillo: "Quiero seleccionar todo el texto (o una parte) sin el mouse"
  tecnico: "Seleccionar todo (Ctrl + A) y selección con Mayús + flechas"
explicacion:
  sencillo: "Para elegir todo un texto o todos los archivos de una carpeta hay un atajo, y con la tecla Mayús y las flechas podés marcar de a poquito, letra por letra o palabra por palabra."
  tecnico: "Ctrl + A selecciona todo; Mayús + flechas selecciona caracteres o líneas; Ctrl + Mayús + flecha izquierda/derecha selecciona palabras."
