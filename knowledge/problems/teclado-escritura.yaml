id: TEC-025
area: basico
titulo:
  sencillo: "Toco sin querer la tecla de Copilot y se abre algo que no quiero"
  tecnico: "Personalizar la tecla Copilot del teclado"
explicacion:
  sencillo: "Las compus nuevas traen una tecla Copilot (cerca de la barra espaciadora) que abre el asistente de Microsoft. Se puede cambiar lo que hace."
  tecnico: "Configuración > Personalización > Entrada de texto > Personalizar la tecla Copilot del teclado; versiones nuevas permiten reasignarla a Ctrl derecha o Menú contextual."
frases: ["se me abre copilot cuando toco una tecla", "qué es la tecla nueva al lado del espacio", "quiero que la tecla copilot haga otra cosa", "aprieto ctrl y se abre el asistente"]
pasos:
  - texto: "Abrí Configuración > Personalización > Entrada de texto y buscá la opción para personalizar la tecla Copilot del teclado."
    abrir: "ms-settings:personalization-textinput-copilot-hardwarekey"
  - texto: "Elegí qué querés que haga esa tecla entre las opciones que te muestra."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "En algunas compus, en Bluetooth y dispositivos > Teclado, se puede convertir la tecla en Ctrl derecha o en la tecla de menú. Si la marca de tu compu trae su propia opción para esa tecla, usá una sola de las dos."
    abrir: "https://support.microsoft.com/en-us/accessibility/windows/copilot/understand-updates-to-the-copilot-key-on-windows-devices"
fuentes:
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
  - https://support.microsoft.com/en-us/accessibility/windows/copilot/understand-updates-to-the-copilot-key-on-windows-devices
