id: TEC-013
area: basico
titulo:
  sencillo: "Quiero copiar y pegar usando el teclado"
  tecnico: "Copiar, cortar y pegar (Ctrl + C, Ctrl + X, Ctrl + V)"
explicacion:
  sencillo: "Con tres combinaciones de teclas copiás un texto, una foto o un archivo y lo ponés en otro lado. Copiar deja el original donde estaba; cortar lo saca de ahí para moverlo."
  tecnico: "Ctrl + C copia, Ctrl + X corta y Ctrl + V pega lo último del portapapeles; funcionan en la mayoría de las aplicaciones, aunque no en todas."
frases: ["cómo copio y pego con el teclado", "qué teclas son para copiar", "control c control v cómo se usa", "quiero mover un texto de un lado a otro"]
pasos:
  - texto: "Seleccioná lo que querés copiar: arrastrá el mouse sobre el texto, o hacé un clic en el archivo."
  - texto: "Apretá Ctrl + C para copiar (o Ctrl + X para cortar, si lo querés sacar de ahí)."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "Hacé clic donde lo querés poner y apretá Ctrl + V para pegar. Podés pegar las veces que quieras."
  - texto: "Microsoft avisa que estos atajos andan casi siempre, pero hay programas donde no funcionan: ahí usá clic derecho > «Copiar» y «Pegar»."
    abrir: "https://support.microsoft.com/windows/hardware/input-devices/windows-keyboard-tips-and-tricks"
derivar: "Para pegar algo que copiaste antes, escribile a PC Doctor «cómo pego algo que copié antes»."
fuentes:
