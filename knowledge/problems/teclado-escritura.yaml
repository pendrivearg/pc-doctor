  - texto: "Para marcar solo una parte: poné el cursor donde empieza, mantené apretada Mayús y movete con las flechas. Con Ctrl + Mayús + flechas vas de a una palabra."
    abrir: "https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"
  - texto: "Con el texto marcado ya podés copiarlo (Ctrl + C), borrarlo o cambiarle la letra. Para desmarcar, hacé un clic en cualquier otro lado."
