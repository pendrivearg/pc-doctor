id: TEC-024
area: perifericos
titulo:
  sencillo: "Se rompió una tecla y quiero usar otra en su lugar"
  tecnico: "Reasignar teclas con PowerToys (Keyboard Manager)"
explicacion:
  sencillo: "Si una tecla dejó de andar, con un programa gratuito de Microsoft llamado PowerToys podés hacer que otra tecla que casi no usás escriba lo que hacía la rota, hasta que cambies el teclado."
  tecnico: "PowerToys > Keyboard Manager > Remap a key: tecla de origen y «To send»; requiere PowerToys en ejecución y no actúa en la pantalla de inicio de sesión."
frases: ["se me rompió una tecla del teclado", "quiero que otra tecla haga lo que hacía la rota", "la tecla de la a no anda y necesito escribir", "cambiar una tecla por otra en windows"]
pasos:
  - texto: "Instalá PowerToys desde la Microsoft Store (es de Microsoft)."
    abrir: "https://learn.microsoft.com/windows/powertoys/install"
  - texto: "Abrí PowerToys, entrá en «Keyboard Manager» y tocá «Remap a key» > «Add key remapping»."
    abrir: "https://learn.microsoft.com/windows/powertoys/keyboard-manager"
  - texto: "En la primera columna elegí la tecla que sí funciona y no usás; en «To send», la letra de la tecla rota. Tocá «OK»: el cambio funciona al instante."
  - texto: "Para que el cambio funcione, PowerToys tiene que quedar abierto en segundo plano. No funciona en la pantalla donde ponés la contraseña para entrar."
derivar: "Si son varias teclas o el teclado entero, escribile a PC Doctor «el mouse o el teclado no funcionan»."
fuentes:
  - https://learn.microsoft.com/windows/powertoys/keyboard-manager
  - https://learn.microsoft.com/windows/powertoys/install
madurez: T0
