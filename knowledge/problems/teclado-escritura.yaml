id: TEC-004
area: perifericos
titulo:
  sencillo: "Quiero prender (o apagar) la luz de las teclas"
  tecnico: "Retroiluminación del teclado"
explicacion:
  sencillo: "Muchas notebooks tienen teclas que se iluminan para escribir a oscuras. Se prenden, se apagan o cambian de intensidad con una tecla que tiene el dibujo de un teclado o de una lamparita. No todas las computadoras tienen esta luz."
  tecnico: "Tecla de retroiluminación (cicla niveles, incluido apagado); en algunos modelos, brillo automático en Configuración > Bluetooth y dispositivos > Teclado."
frases: ["cómo prendo la luz del teclado", "se apagó la luz de las teclas", "quiero que el teclado se ilumine de noche", "apagar las lucecitas del teclado de la notebook"]
pasos:
  - texto: "Buscá en la fila de arriba una tecla con el dibujo de un teclado con rayitas o una lamparita. Apretala varias veces (a veces junto con Fn): va pasando por los niveles de luz, incluido apagado."
    abrir: "https://support.microsoft.com/en-us/surface/accessories/cover-keyboard/special-keys-and-function-keys-for-surface-keyboards-or-type-covers"
  - texto: "Algunos modelos ajustan la luz solos según la luz del ambiente. Eso se activa en Configuración > Bluetooth y dispositivos > Teclado, si tu compu tiene esa opción."
  - texto: "Si tu teclado tiene luces de colores (los «gamer»), escribile a PC Doctor «cambiar los colores de las luces del teclado»."
derivar: "Si no encontrás ninguna tecla con ese dibujo, puede que tu teclado no tenga luz: fijate en el manual o la página del fabricante."
fuentes:
  - https://support.microsoft.com/en-us/surface/accessories/cover-keyboard/special-keys-and-function-keys-for-surface-keyboards-or-type-covers
madurez: T0
