id: TEC-007
area: basico
titulo:
  sencillo: "El teclado se cambia de idioma solo mientras escribo"
  tecnico: "Cambio involuntario de distribución (Windows + Barra espaciadora, Ctrl + Mayús)"
explicacion:
  sencillo: "Si tenés más de un teclado instalado, hay combinaciones de teclas que pasan de uno a otro. Apretarlas sin querer hace que de golpe las letras y los signos salgan cambiados. Abajo a la derecha se ve cuál está activo (por ejemplo, ESP o ENG)."
  tecnico: "Windows + Barra espaciadora recorre las distribuciones instaladas y Ctrl + Mayús alterna entre ellas; el indicador de idioma de la bandeja muestra la activa. Quitar las distribuciones que no se usan evita el cambio."
frases: ["de repente el teclado escribe cambiado", "abajo dice ENG y antes decía ESP", "se me cambia el idioma del teclado sin tocar nada", "en el medio de un texto empezaron a salir otros signos"]
pasos:
  - texto: "Mirá abajo a la derecha, al lado de la hora: hay unas letras que indican el teclado activo. Tocalas y elegí el tuyo (en Argentina suele ser Español, «Latinoamericano»)."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/input-devices/manage-the-language-and-keyboard-input-layout-settings-in-windows"
  - texto: "Con el teclado: mantené la tecla Windows y tocá la barra espaciadora hasta que aparezca el tuyo. Ojo: Ctrl + Mayús también cambia de teclado cuando hay más de uno."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "Si el otro teclado no lo usás, sacalo y se termina el problema: Configuración > Hora e idioma > Idioma y región > tres puntitos (…) al lado del idioma > «Opciones de idioma». En «Teclados», tres puntitos al lado del que sobra > «Quitar»."
    abrir: "ms-settings:regionlanguage"
derivar: "Si querés tener dos teclados a propósito y alternarlos, escribile a PC Doctor «agregar el teclado en inglés»."
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/input-devices/manage-the-language-and-keyboard-input-layout-settings-in-windows
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
