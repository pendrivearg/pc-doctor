id: TEC-003
area: perifericos
titulo:
  sencillo: "Las teclas de volumen o de brillo no hacen nada (o hacen otra cosa)"
  tecnico: "Tecla Fn: alternar entre teclas especiales y F1–F12"
explicacion:
  sencillo: "En muchas notebooks y teclados, las teclas de arriba sirven para dos cosas: subir el volumen o el brillo, o funcionar como F1, F2… La tecla Fn decide cuál de las dos hace. Si quedó trabada, parece que las teclas no andan."
  tecnico: "La fila superior funciona como teclas especiales (volumen, brillo, multimedia, retroiluminación) o como F1–F12 según el estado de Fn; algunos teclados muestran un LED de Fn y permiten configurarlo con la app del fabricante."
frases: ["no me anda la tecla para subir el volumen", "las teclas del brillo no funcionan", "aprieto f5 y me baja el volumen", "la tecla fn quedó trabada", "las teclas de arriba con dibujitos no hacen nada"]
pasos:
  - texto: "Mirá la fila de teclas de arriba: las que tienen dibujitos (un parlante, un sol) son las de volumen y brillo. Probá la tecla del dibujito sola y, si no hace nada, manteniendo apretada la tecla Fn."
  - texto: "En algunos teclados la tecla Fn queda «trabada» y se prende una lucecita en ella: ahí las teclas de arriba funcionan como F1–F12. Apretá Fn una vez para destrabarla (la luz se apaga) y probá de nuevo."
    abrir: "https://support.microsoft.com/en-us/surface/accessories/cover-keyboard/special-keys-and-function-keys-for-surface-keyboards-or-type-covers"
  - texto: "Algunos fabricantes traen un programa propio para elegir qué hacen esas teclas (en los Surface, la app Surface > «Customize keyboard»). Buscalo en Inicio con el nombre de la marca de tu compu."
derivar: "Si con Fn tampoco cambia el volumen, escribile a PC Doctor «no hay sonido»; si es el brillo, «la pantalla está muy oscura»."
fuentes:
  - https://support.microsoft.com/en-us/surface/accessories/cover-keyboard/special-keys-and-function-keys-for-surface-keyboards-or-type-covers
madurez: T0
