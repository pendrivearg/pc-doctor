id: TEC-006
area: basico
titulo:
  sencillo: "Tengo un teclado en inglés y quiero escribir tildes, ñ, ¿ y ¡"
  tecnico: "Distribución Estados Unidos-Internacional (teclas muertas y AltGr)"
explicacion:
  sencillo: "Los teclados en inglés no tienen la ñ ni las tildes a la vista. Si agregás el teclado «Estados Unidos-Internacional», podés escribirlas igual con combinaciones fáciles, sin comprar otro teclado."
  tecnico: "US-International: el apóstrofo (') y la tilde (~) actúan como teclas muertas (' + vocal = á; ~ + n = ñ); AltGr (Alt derecha) + n = ñ, + / = ¿, + 1 = ¡."
frases: ["mi teclado es en inglés y no tiene la ñ", "compré una notebook de afuera y no puedo poner tildes", "cómo pongo acentos con un teclado americano", "no me sale el signo de pregunta al revés"]
pasos:
  - texto: "Agregá el teclado «Estados Unidos-Internacional»: Configuración > Hora e idioma > Idioma y región, tocá los tres puntitos (…) al lado de tu idioma > «Opciones de idioma» > «Agregar un teclado»."
    abrir: "ms-settings:regionlanguage"
  - texto: "Para una vocal con tilde: apretá la tecla del apóstrofo (') y después la vocal: sale á, é, í, ó, ú. Para la ñ: apretá Mayús + la tecla que está a la izquierda del 1 (~) y después la n."
    abrir: "https://learn.microsoft.com/en-us/globalization/keyboards/kbdusx.html"
  - texto: "Otra forma: mantené apretada la tecla Alt de la derecha (AltGr) y tocá n para la ñ, la tecla / para ¿ o el 1 para ¡."
  - texto: "Para pasar de un teclado a otro, mantené la tecla Windows y tocá la barra espaciadora, o elegilo en el indicador de idioma de abajo a la derecha."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/input-devices/manage-the-language-and-keyboard-input-layout-settings-in-windows"
derivar: "Si tu teclado sí tiene la ñ dibujada pero no sale, escribile a PC Doctor «no me sale la arroba»."
fuentes:
  - https://learn.microsoft.com/en-us/globalization/keyboards/kbdusx.html
  - https://support.microsoft.com/en-us/windows/hardware/input-devices/manage-the-language-and-keyboard-input-layout-settings-in-windows
madurez: T0
