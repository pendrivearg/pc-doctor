id: TEC-002
area: programas
titulo:
  sencillo: "Escribí un texto entero en mayúsculas sin querer y no lo quiero escribir de nuevo"
  tecnico: "Cambiar mayúsculas y minúsculas en Word (Mayús + F3)"
explicacion:
  sencillo: "Si te quedó un párrafo TODO EN MAYÚSCULAS porque estaba activado Bloq Mayús, Word lo puede pasar a minúsculas sin que tengas que borrarlo."
  tecnico: "Word: pestaña Inicio > botón de cambio de mayúsculas y minúsculas (tipo oración, minúsculas, MAYÚSCULAS, cada palabra, invertido) o Mayús + F3 sobre la selección."
frases: ["me quedó todo el texto en mayúscula", "escribí todo con bloq mayús y no me di cuenta", "pasar un texto de mayúsculas a minúsculas", "cómo cambio las mayúsculas sin volver a escribir"]
pasos:
  - texto: "Seleccioná con el mouse el texto que quedó en mayúsculas."
  - texto: "Apretá Mayús + F3. Cada vez que lo apretás cambia entre minúsculas, MAYÚSCULAS y Mayúscula Al Principio De Cada Palabra. Soltá cuando quede como querés."
    abrir: "https://support.microsoft.com/en-us/word/change-the-capitalization-or-case-of-text"
  - texto: "Otra forma: en la pestaña Inicio, tocá el botón para cambiar mayúsculas y minúsculas y elegí, por ejemplo, la opción que deja mayúscula solo al principio de la oración."
  - texto: "Si no te gustó cómo quedó, apretá Ctrl + Z para volver atrás. Para que no te vuelva a pasar, apretá una vez Bloq Mayús antes de seguir escribiendo."
fuentes:
  - https://support.microsoft.com/en-us/word/change-the-capitalization-or-case-of-text
madurez: T0
