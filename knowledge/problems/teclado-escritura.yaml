id: TEC-020
area: basico
titulo:
  sencillo: "Quiero escribir símbolos como €, °, © que no están en el teclado"
  tecnico: "Panel de símbolos (Windows + punto) y códigos Alt"
explicacion:
  sencillo: "Windows tiene un panel con símbolos y letras especiales para elegirlos con el mouse. Y si tu teclado tiene números a la derecha, también se pueden escribir con la tecla Alt y un número."
  tecnico: "Windows + punto > Símbolos (puntuación, caracteres acentuados, etc.); códigos Alt con el teclado numérico: Alt + 0176 (°), Alt + 0128 (€), Alt + 0169 (©)."
frases: ["cómo escribo el símbolo del euro", "poner el signo de grados en la compu", "dónde está el símbolo de copyright", "quiero poner un símbolo raro que no está en el teclado"]
pasos:
  - texto: "Hacé clic donde estás escribiendo y apretá Windows + punto (.). En el panel que se abre, elegí la sección «Símbolos» y buscá el que necesitás."
    abrir: "https://support.microsoft.com/windows/hardware/input-devices/windows-keyboard-tips-and-tricks"
  - texto: "Con el teclado numérico de la derecha (con Bloq Num activado): mantené apretada Alt, escribí el número y soltá Alt. 0176 da °, 0128 da € y 0169 da ©. Con los números de arriba de las letras no funciona."
    abrir: "https://support.microsoft.com/en-us/word/insert-ascii-or-unicode-latin-based-symbols-and-characters"
derivar: "Si lo que buscás son caritas o corazones, escribile a PC Doctor «poner emojis en el correo»."
fuentes:
  - https://support.microsoft.com/windows/hardware/input-devices/windows-keyboard-tips-and-tricks
  - https://support.microsoft.com/en-us/word/insert-ascii-or-unicode-latin-based-symbols-and-characters
