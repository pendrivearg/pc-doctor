id: TEC-018
area: basico
titulo:
  sencillo: "Quiero pasar de una ventana a otra (o cerrarla) con el teclado"
  tecnico: "Cambiar de ventana (Alt + Tab) y cerrar la ventana activa (Alt + F4)"
explicacion:
  sencillo: "Si tenés abiertos el correo, el navegador y un documento, podés saltar de uno a otro sin buscarlos abajo. Y hay otro atajo para cerrar la ventana que estás usando."
  tecnico: "Alt + Tab alterna entre ventanas abiertas; Windows + Tab abre la Vista de tareas; Alt + F4 cierra la ventana activa (sin ventanas abiertas, ofrece apagar)."
frases: ["pasar de una ventana a otra rápido", "cambiar entre programas abiertos con el teclado", "alt tab para qué sirve", "cerrar la ventana sin buscar la cruz"]
pasos:
  - texto: "Mantené apretada la tecla Alt y tocá Tab: aparecen todas las ventanas abiertas. Seguí tocando Tab (sin soltar Alt) hasta llegar a la que querés y soltá."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "Para ver todas las ventanas juntas en grande, apretá Windows + Tab y hacé clic en la que quieras."
  - texto: "Para cerrar la ventana que estás usando, apretá Alt + F4. Ojo: si no queda ninguna ventana abierta, ese atajo ofrece apagar la compu: si no querés apagarla, no aceptes."
    abrir: "https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec"
fuentes:
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
  - https://support.microsoft.com/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec
