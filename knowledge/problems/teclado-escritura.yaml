id: TEC-019
area: basico
titulo:
  sencillo: "Deshice de más con Ctrl + Z y quiero recuperar lo que borré"
  tecnico: "Rehacer (Ctrl + Y)"
explicacion:
  sencillo: "Si apretaste Ctrl + Z más veces de las que querías y se borró algo que estaba bien, se puede «rehacer»: vuelve a aparecer lo que deshiciste."
  tecnico: "Ctrl + Y rehace la acción deshecha con Ctrl + Z."
