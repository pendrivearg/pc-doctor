id: TEC-005
area: perifericos
titulo:
  sencillo: "Quiero cambiar los colores de las luces del teclado o apagarlas"
  tecnico: "Iluminación dinámica (Dynamic Lighting) para dispositivos RGB"
explicacion:
  sencillo: "Los teclados y mouse con luces de colores se pueden manejar desde Windows: elegir el color, el brillo o apagarlas. Solo funciona con aparatos compatibles; los demás se manejan con el programa de la marca."
  tecnico: "Configuración > Personalización > Iluminación dinámica (HID LampArray): brillo, efectos, ajustes por dispositivo y prioridad de controladores en segundo plano."
frases: ["cambiar los colores de las luces del teclado", "las luces rgb del teclado no se apagan", "quiero el teclado de un solo color", "el teclado gamer cambia de colores solo"]
pasos:
  - texto: "Abrí Configuración > Personalización > Iluminación dinámica. Si tu teclado es compatible, aparece arriba como una tarjeta."
    abrir: "ms-settings:personalization-lighting"
  - texto: "Con el interruptor general podés prender o apagar el control de las luces desde Windows. Más abajo elegís el brillo y los colores o efectos; si tocás la tarjeta del teclado, cambiás solo los de ese aparato."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/input-devices/control-dynamic-lighting-devices-in-windows"
  - texto: "Si cambiás algo y no pasa nada, puede que el programa de la marca del teclado tenga el control. En la sección de control de luz en segundo plano, arrastrá arriba de todo el que quieras que mande."
derivar: "Si el teclado no aparece en esa página, sus luces solo se cambian con el programa del fabricante."
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/input-devices/control-dynamic-lighting-devices-in-windows
madurez: T0
