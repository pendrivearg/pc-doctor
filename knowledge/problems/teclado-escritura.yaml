# Teclado, escritura y atajos: Bloq Num, Fn, luces del teclado, tildes con teclado en inglés, idioma que cambia solo, sugerencias y autocorrección, teclado táctil, atajos útiles, símbolos, Bluetooth, líquido derramado, tecla Windows, teclas rotas y tecla Copilot. Guiadas con fuente oficial.
id: TEC-001
area: basico
titulo:
  sencillo: "Los números de la derecha del teclado no escriben"
  tecnico: "Teclado numérico desactivado (Bloq Num / Num Lock)"
explicacion:
  sencillo: "El bloque de números que está a la derecha del teclado tiene una tecla que lo prende y lo apaga: Bloq Num (en algunos teclados dice «Num Lock» o «NumLk»). Si está apagada, esos números no escriben."
  tecnico: "Con Bloq Num desactivado el teclado numérico envía teclas de navegación en lugar de dígitos; si además están activas las Teclas del mouse, mueve el puntero."
frases: ["los números del costado no andan", "no me escriben los números de la derecha", "el teclado numérico no funciona", "se me apagó el bloq num", "con los números de al lado no puedo poner el dni"]
pasos:
  - texto: "Apretá una vez la tecla Bloq Num (o «Num Lock») y probá escribir un número. Microsoft recuerda que hay teclados que necesitan Bloq Num activado para escribir números con ese bloque."
    abrir: "https://support.microsoft.com/en-us/word/insert-ascii-or-unicode-latin-based-symbols-and-characters"
  - texto: "Si en vez de escribir, esos números mueven la flechita del mouse, están activadas las «Teclas del mouse»: escribile a PC Doctor «los números del teclado mueven el mouse»."
  - texto: "Para salir del paso, el Teclado en pantalla tiene una opción para mostrar un teclado numérico: abrilo, tocá «Opciones» y activá esa opción."
    abrir: "https://support.microsoft.com/accessibility/windows/use-the-on-screen-keyboard-osk-to-type"
derivar: "Si ninguna tecla del bloque de números responde aunque Bloq Num esté activado, escribile a PC Doctor «el mouse o el teclado no funcionan»."
fuentes:
  - https://support.microsoft.com/en-us/word/insert-ascii-or-unicode-latin-based-symbols-and-characters
  - https://support.microsoft.com/accessibility/windows/use-the-on-screen-keyboard-osk-to-type
madurez: T0
