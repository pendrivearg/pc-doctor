id: TEC-008
area: basico
titulo:
  sencillo: "Me aparecen palabras sugeridas mientras escribo (o quiero que aparezcan)"
  tecnico: "Sugerencias de texto con el teclado físico"
explicacion:
  sencillo: "Windows puede mostrar, arriba de lo que escribís, unas palabras sugeridas para terminar más rápido, como en el celular. Se usan si querés y se pueden prender o apagar."
  tecnico: "Hora e idioma > Escritura: sugerencias de texto al escribir en el teclado físico y sugerencias de texto multilingües. Selección con flecha arriba, flechas laterales y Entrar; Esc descarta."
frases: ["me salen palabras arriba cuando escribo", "quiero que la compu me sugiera palabras como el celular", "sacar las sugerencias de palabras del teclado", "aparece un cuadrito con palabras mientras tipeo"]
pasos:
  - texto: "Abrí Configuración > Hora e idioma > Escritura."
    abrir: "ms-settings:typing"
  - texto: "Activá (o apagá, si te molestan) la opción de mostrar sugerencias de texto al escribir en el teclado físico. Si escribís en más de un idioma, está también la de sugerencias multilingües."
    abrir: "https://support.microsoft.com/en-us/accessibility/windows/enable-text-suggestions-in-windows"
  - texto: "Para usar una sugerencia: hacé clic en ella, o apretá la flecha hacia arriba, movete con las flechas izquierda y derecha y apretá Entrar. Para ignorarlas, apretá Esc o hacé clic afuera."
fuentes:
  - https://support.microsoft.com/en-us/accessibility/windows/enable-text-suggestions-in-windows
madurez: T0
