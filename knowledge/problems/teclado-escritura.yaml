id: TEC-012
area: basico
titulo:
  sencillo: "El teclado de la pantalla me pone mayúscula o un punto solo"
  tecnico: "Teclado táctil: mayúscula automática y punto con doble espacio"
explicacion:
  sencillo: "El teclado táctil (el que usás con el dedo) pone mayúscula al empezar cada oración y agrega un punto si tocás dos veces la barra espaciadora. Son ayudas que se pueden apagar."
  tecnico: "Hora e idioma > Escritura > Teclado táctil: «Poner en mayúscula la primera letra de cada oración» y «Agregar un punto después de pulsar dos veces la barra espaciadora»; también sonidos de teclas."
frases: ["el teclado táctil me pone mayúscula sola", "toco dos veces el espacio y aparece un punto", "no quiero que ponga mayúscula al principio", "el teclado de la tablet hace ruidito al escribir"]
pasos:
  - texto: "Abrí Configuración > Hora e idioma > Escritura y entrá en «Teclado táctil»."
    abrir: "ms-settings:typing"
  - texto: "Apagá la opción que pone mayúscula en la primera letra de cada oración y, si te molesta, la que agrega un punto al tocar dos veces la barra espaciadora."
    abrir: "https://support.microsoft.com/en-us/windows/experience/backup-recovery/windows-backup-settings-catalog"
  - texto: "Ahí mismo está la opción de reproducir sonidos al tocar las teclas, por si querés que deje de hacer ruido."
fuentes:
  - https://support.microsoft.com/en-us/windows/experience/backup-recovery/windows-backup-settings-catalog
madurez: T0
