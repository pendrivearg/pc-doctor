id: TEC-011
area: basico
titulo:
  sencillo: "Me aparece solo un teclado en la pantalla"
  tecnico: "Teclado táctil: ícono de la bandeja y aparición automática"
explicacion:
  sencillo: "Las compus con pantalla táctil traen un teclado que aparece en la pantalla para escribir con el dedo. Windows puede mostrarlo solo, o dejar un ícono abajo a la derecha. Se puede elegir que no aparezca."
  tecnico: "Personalización > Barra de tareas > Iconos de la bandeja del sistema > Teclado táctil (Nunca / Siempre / Cuando no hay teclado conectado); Escritura > Teclado táctil: mostrar automáticamente sin teclado conectado."
frases: ["me aparece un teclado en la pantalla solo", "toco para escribir y sale el teclado táctil", "sacar el iconito del teclado de abajo", "se abre un teclado en la pantalla que no pedí"]
pasos:
  - texto: "Hacé clic derecho en la barra de tareas (la de abajo) y elegí la configuración de la barra de tareas."
    abrir: "ms-settings:taskbar"
  - texto: "En «Iconos de la bandeja del sistema», buscá «Teclado táctil» y elegí la opción que lo oculta («Nunca»). También podés elegir que aparezca solo cuando no hay un teclado conectado."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/input-devices/enable-and-disable-the-touch-keyboard-in-windows"
  - texto: "Si igual aparece solo, en Configuración > Escritura, dentro de «Teclado táctil», apagá la opción que lo muestra cuando no hay ningún teclado conectado."
    abrir: "ms-settings:typing"
derivar: "Si el que aparece es un teclado grande en una ventana, que se usa con el mouse, es el Teclado en pantalla: escribile a PC Doctor «un teclado en la pantalla»."
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/input-devices/enable-and-disable-the-touch-keyboard-in-windows
madurez: T0
