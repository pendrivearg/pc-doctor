id: TEC-010
area: programas
titulo:
  sencillo: "Word me cambia las palabras solo mientras escribo"
  tecnico: "Autocorrección de Word (Reemplazar texto mientras escribe)"
explicacion:
  sencillo: "Word trae una lista de «correcciones automáticas»: si escribís algo que parece un error, lo reemplaza solo. A veces cambia nombres, siglas o palabras que estaban bien."
  tecnico: "Archivo > Opciones > Revisión > Opciones de Autocorrección > pestaña Autocorrección > Reemplazar texto mientras escribe."
frases: ["word me cambia las palabras solo", "escribo una sigla y word la cambia", "word me corrige y pone otra palabra", "sacar la autocorrección de word"]
pasos:
  - texto: "Si te cambió una palabra recién, apretá Ctrl + Z enseguida: vuelve a como la escribiste."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "Para apagar los reemplazos: en Word, andá a Archivo > Opciones > Revisión y tocá «Opciones de Autocorrección»."
    abrir: "https://support.microsoft.com/en-us/word/turn-autocorrect-on-or-off-in-word"
  - texto: "En la pestaña Autocorrección, sacale la tilde a «Reemplazar texto mientras escribe» y aceptá."
derivar: "Si lo que te molesta es el subrayado rojo de ortografía, escribile a PC Doctor «Word me subraya todo en rojo»."
fuentes:
  - https://support.microsoft.com/en-us/word/turn-autocorrect-on-or-off-in-word
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
