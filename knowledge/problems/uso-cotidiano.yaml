id: PRN-001
area: perifericos
titulo:
  sencillo: "La impresora no imprime"
  tecnico: "Fallas de impresión"
explicacion:
  sencillo: "Las causas más comunes: la impresora está apagada o sin papel, hay un documento trabado en la cola, o la PC manda a imprimir a otra impresora."
  tecnico: "Guía inicial; la reparación automática de la cola de impresión llega en la próxima versión."
frases: ["no imprime", "la impresora no anda", "no puedo imprimir", "la impresora no responde", "impresora sin conexión"]
sondas: [dispositivos, servicios]
acciones: [print.queue.clear, print.spooler.repair]
pasos:
  - texto: "Revisá que esté prendida, con papel, sin luces de error y conectada (cable USB o la misma red Wi-Fi)."
  - texto: "En Impresoras, elegí la tuya, abrí la cola y cancelá los documentos trabados. Fijate que sea la predeterminada."
    abrir: "ms-settings:printers"
  - texto: "Apagá la impresora y la PC, y volvelas a prender."
fuentes:
  - https://support.microsoft.com/windows/fix-printer-connection-and-printing-problems-in-windows-fb830bff-7702-6349-33cd-9443fe987f73
madurez: T0
