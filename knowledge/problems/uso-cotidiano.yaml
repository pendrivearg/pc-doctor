id: APP-OFF-001
area: programas
titulo:
  sencillo: "Word (u otro programa de Office) no abre"
  tecnico: "Aplicación de Office no inicia o se cierra"
explicacion:
  sencillo: "Muchas veces lo traba un complemento. Abrirlo en «modo seguro» permite saberlo; si no, Office tiene una reparación oficial."
  tecnico: "Diagnóstico: winword /safe para aislar complementos; reparación rápida o en línea de Click-to-Run."
frases: ["no puedo abrir word", "word no abre", "excel no abre", "se cierra el word", "office no funciona", "no me abre el word"]
sondas: [eventos]
pasos:
  - texto: "Apretá Windows + R, escribí  winword /safe  y Enter. Si abre así, el problema es un complemento: desactivalo en Archivo > Opciones > Complementos."
  - texto: "Si no abre ni en modo seguro: Aplicaciones instaladas > Microsoft 365 u Office > Modificar > «Reparación rápida» (y si no alcanza, «Reparación en línea»)."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si pide activar, iniciá sesión con la cuenta con la que compraste Office."
fuentes:
  - https://support.microsoft.com/office/repair-an-office-application-7821d4b6-7c1d-4205-aa0e-a6b40c5bb88b
madurez: T0
