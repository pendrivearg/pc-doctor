id: BAS-TXT-001
area: basico
titulo:
  sencillo: "Las letras se ven muy chicas"
  tecnico: "Tamaño de texto y escalado"
explicacion:
  sencillo: "Se puede agrandar solo el texto o todo lo que se ve en pantalla, sin perder calidad."
  tecnico: "Accesibilidad > Tamaño del texto y Pantalla > Escala."
frases: ["las letras son muy chicas", "no veo bien las letras", "agrandar la letra", "todo se ve muy chiquito", "quiero letra más grande"]
sondas: [sistema]
pasos:
  - texto: "En Tamaño del texto, mové la barra hasta que se lea cómodo y tocá «Aplicar»."
    abrir: "ms-settings:easeofaccess-display"
  - texto: "Para agrandar todo (íconos y ventanas), cambiá la «Escala» en Pantalla."
    abrir: "ms-settings:display"
  - texto: "En el navegador podés agrandar una página con Ctrl y la rueda del mouse (o Ctrl y +)."
fuentes:
  - https://support.microsoft.com/windows/change-the-size-of-text-in-windows-1d5830c3-eee3-8eaa-836b-abcc37d99b9a
madurez: T0
