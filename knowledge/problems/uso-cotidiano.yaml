id: GAM-001
area: juegos
titulo:
  sencillo: "Un juego anda mal o no abre"
  tecnico: "Problemas de juegos"
explicacion:
  sencillo: "PC Doctor revisó la placa de video, el procesador, la memoria y los errores recientes. Abajo están los problemas relacionados que encontró."
  tecnico: "Triaje de juegos; la comparación de requisitos por juego llega en la próxima versión."
frases: ["el juego no abre", "el juego anda lento", "tengo pocos fps", "se cierra el juego", "el juego se traba", "no puedo jugar"]
sondas: [gpu, cpu, ram, eventos]
pasos:
  - texto: "Actualizá el controlador de video desde Windows Update o desde el fabricante (NVIDIA, AMD, Intel)."
    abrir: "ms-settings:windowsupdate"
  - texto: "En Steam: clic derecho en el juego > Propiedades > Archivos instalados > «Verificar integridad de los archivos»."
  - texto: "En notebooks, jugá con el cargador conectado y elegí el modo de energía «Máximo rendimiento»."
    abrir: "ms-settings:powersleep"
fuentes:
  - https://help.steampowered.com/en/faqs/view/0C48-FCBD-DA71-93EB
madurez: T0
