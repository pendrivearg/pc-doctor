# Problemas que se detectan por lo que cuenta la persona (módulos B, E, G, Q, C). Cada uno corre las sondas relacionadas.
id: AUD-001
area: audio
titulo:
  sencillo: "No hay sonido"
  tecnico: "Sin salida de audio"
explicacion:
  sencillo: "Casi siempre es el volumen, un programa silenciado o que el sonido sale por otro aparato (el monitor, la TV o unos auriculares)."
  tecnico: "Revisar dispositivo de salida predeterminado, mezclador por aplicación y estado del controlador."
frases: ["no tengo sonido", "no se escucha nada", "no me anda el audio", "no suenan los parlantes", "la compu no tiene sonido", "no anda el sonido", "no se oye el sonido de los videos"]
sondas: [dispositivos, servicios]
acciones: [audio.service.repair]
pasos:
  - texto: "Subí el volumen con el ícono del parlante, abajo a la derecha, y fijate que no esté en silencio."
  - texto: "En Sonido, en «Salida», elegí el aparato por el que querés escuchar (parlantes, auriculares, TV)."
    abrir: "ms-settings:sound"
  - texto: "Si es un solo programa el que no suena, abrí el Mezclador de volumen y subí el volumen de ese programa."
    abrir: "ms-settings:apps-volume"
fuentes:
  - https://support.microsoft.com/windows/fix-sound-or-audio-problems-in-windows-73025246-b61c-40fb-671a-2535c7cd56c8
madurez: T0
---
id: PER-MIC-001
area: perifericos
titulo:
  sencillo: "No funciona el micrófono"
  tecnico: "Micrófono sin señal o bloqueado por privacidad"
explicacion:
  sencillo: "Muchas veces Windows bloquea el micrófono por privacidad, o el programa usa otro micrófono distinto."
  tecnico: "Revisar permisos de privacidad del micrófono y dispositivo de entrada predeterminado."
frases: ["no me escuchan", "no anda el micrófono", "en zoom no me escuchan", "el micrófono no funciona"]
sondas: [dispositivos]
pasos:
  - texto: "Activá «Acceso al micrófono» y el permiso para el programa que usás (Zoom, Meet en el navegador, etc.)."
    abrir: "ms-settings:privacy-microphone"
  - texto: "En Sonido > Entrada, elegí el micrófono correcto y hablá: la barra debería moverse."
    abrir: "ms-settings:sound"
fuentes:
  - https://support.microsoft.com/windows/fix-microphone-problems-5f230348-106d-bfa4-1db5-336f35576011
madurez: T0
---
id: PER-CAM-001
area: perifericos
titulo:
  sencillo: "No funciona la cámara"
  tecnico: "Cámara no disponible o bloqueada por privacidad"
explicacion:
  sencillo: "Puede estar tapada (muchas notebooks tienen una tapita o una tecla), bloqueada por privacidad, o usada por otro programa."
  tecnico: "Revisar obturador físico, permisos de privacidad y dispositivos con error."
frases: ["no me ven en la videollamada", "no anda la cámara", "la cámara no funciona", "la webcam no anda"]
sondas: [dispositivos]
pasos:
  - texto: "Fijate si la cámara tiene una tapita corrida o una tecla con el dibujo de una cámara."
  - texto: "Activá «Acceso a la cámara» y el permiso para el programa que usás."
    abrir: "ms-settings:privacy-webcam"
  - texto: "Cerrá otros programas que puedan estar usando la cámara."
fuentes:
  - https://support.microsoft.com/windows/hardware/camera/camera-doesn-t-work-in-windows
madurez: T0
