id: BAS-KB-001
area: basico
titulo:
  sencillo: "No me sale la @, la ñ o los acentos"
  tecnico: "Distribución de teclado distinta del teclado físico"
explicacion:
  sencillo: >-
    Windows tiene configurado un teclado de otro idioma. Con el teclado Latinoamericano la @ se escribe con AltGr+Q;
    con el Español (España), AltGr+2; con el Inglés (EE.UU.), Mayúscula+2.
  tecnico: "La distribución activa (Latinoamericano / Español / EE.UU.) no coincide con las teclas impresas."
frases: ["no me sale la arroba", "no puedo escribir la @", "no me sale la ñ", "el teclado escribe otra cosa", "no me salen los acentos", "el teclado está cambiado", "no encuentro la arroba"]
sondas: [sistema]
pasos:
  - texto: "Probá apretar Windows + Barra espaciadora: cambia entre los teclados instalados (aparece un cartel abajo a la derecha)."
  - texto: "En Idioma y región > Español > Opciones, agregá el teclado que coincide con el tuyo (en Argentina suele ser «Latinoamericano») y quitá el que sobra."
    abrir: "ms-settings:regionlanguage"
fuentes:
  - https://support.microsoft.com/windows/manage-the-input-and-display-language-settings-in-windows-12a10cb4-8626-9b77-0ccb-5013e0c7c7a2
madurez: T0
