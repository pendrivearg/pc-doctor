id: GOO-012
area: programas
titulo:
  sencillo: "Los videos de YouTube se traban o se quedan cargando"
  tecnico: "Reproducción entrecortada en YouTube: conexión y calidad del video"
explicacion:
  sencillo: "Si el video se frena cada tanto con la ruedita girando, casi siempre es que la conexión no alcanza para la calidad elegida. Bajar la calidad suele ayudar."
  tecnico: "Almacenamiento en búfer por ancho de banda insuficiente (1080p ≈ 5 Mbps); bajar la resolución, reiniciar el router, revisar extensiones."
frases: ["el video de youtube se traba a cada rato", "youtube se queda cargando con la ruedita", "los videos se cortan y vuelven a arrancar", "youtube anda a los saltos"]
pasos:
  - texto: "Bajá la calidad del video: tocá el engranaje del reproductor, «Calidad», y elegí un número más bajo (por ejemplo 480p)."
    abrir: "https://support.google.com/youtube/answer/91449?hl=es-419"
  - texto: "Reiniciá la conexión a Internet (por ejemplo, apagando y prendiendo el módem). Google indica que para ver en 1080p hacen falta unos 5 Mbps de velocidad."
    abrir: "https://support.google.com/youtube/answer/3037019?hl=es-419"
  - texto: "Reiniciá el navegador o la compu y probá de nuevo."
  - texto: "Si se traba todo Internet y no solo YouTube, escribile a PC Doctor «internet anda lento»."
fuentes:
  - https://support.google.com/youtube/answer/3037019?hl=es-419
  - https://support.google.com/youtube/answer/91449?hl=es-419
madurez: T0
