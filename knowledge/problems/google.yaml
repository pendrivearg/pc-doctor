id: GOO-007
area: programas
titulo:
  sencillo: "Quiero escribir un documento o hacer una planilla gratis con Google"
  tecnico: "Crear un archivo en Documentos o en Hojas de cálculo de Google"
explicacion:
  sencillo: "Si no tenés Word ni Excel, Google tiene «Documentos» (para escribir) y «Hojas de cálculo» (planillas) gratis en el navegador. Solo necesitás una cuenta de Google."
  tecnico: "docs.google.com > En blanco; sheets.google.com > Nueva (o docs.google.com/create y sheets.google.com/create)."
frases: ["no tengo word y necesito escribir una carta", "cómo hago una planilla en google", "quiero usar documentos de google", "hacer una hoja de cálculo gratis sin excel"]
pasos:
  - texto: "Para escribir: entrá a docs.google.com y, arriba a la izquierda, en «Iniciar un nuevo documento», tocá «En blanco»."
    abrir: "https://support.google.com/docs/answer/7068618?hl=es-419"
  - texto: "Para una planilla: entrá a sheets.google.com y tocá el botón «Nueva» (el signo más). Se abre una hoja vacía para escribir textos y números."
    abrir: "https://support.google.com/docs/answer/6000292?hl=es-419"
  - texto: "Si te equivocás, usá «Deshacer» arriba. Para que otra persona lo vea, escribile a PC Doctor «compartir un archivo de google drive»."
fuentes:
  - https://support.google.com/docs/answer/7068618?hl=es-419
  - https://support.google.com/docs/answer/6000292?hl=es-419
madurez: T0
