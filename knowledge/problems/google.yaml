  tecnico: "Obtener indicaciones y rutas en Google Maps (computadora)"
explicacion:
  sencillo: "Google Maps te dice el camino entre dos lugares, cuánto se tarda y qué colectivo o tren tomar, o cómo ir caminando o en auto."
  tecnico: "Cómo llegar > origen y destino > En automóvil / Transporte público / A pie / En bicicleta; rutas alternativas en gris; Opciones para evitar peajes."
