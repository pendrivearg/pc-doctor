  - texto: "Entrá a Google Maps en el navegador y tocá el botón «Cómo llegar»."
    abrir: "https://support.google.com/maps/answer/144339?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Escribí de dónde salís y adónde vas (una dirección o el nombre de un lugar)."
  - texto: "Elegí cómo vas: «En automóvil», «Transporte público», «A pie» o «En bicicleta». La mejor ruta aparece en azul y las otras en gris, cada una con su tiempo."
  - texto: "Si vas en auto y querés evitar peajes o autopistas, tocá «Opciones» y marcá la casilla."
