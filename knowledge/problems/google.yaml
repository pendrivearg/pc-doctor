id: GOO-017
area: seguridad
titulo:
  sencillo: "Quiero que YouTube no muestre videos para adultos en la compu"
  tecnico: "Modo restringido de YouTube en el navegador"
explicacion:
  sencillo: "El «Modo restringido» de YouTube oculta videos que pueden no ser apropiados para chicos. Se activa en cada navegador que uses en la compu."
  tecnico: "Foto de perfil > Modo restringido > Activar modo restringido; se aplica por navegador y por perfil."
frases: ["que youtube no muestre cosas feas a los chicos", "activar el modo restringido de youtube", "quiero filtrar youtube para mi nieto", "youtube dice modo restringido activado y no veo algunos videos"]
pasos:
  - texto: "Entrá a youtube.com con tu cuenta. Arriba a la derecha, tocá tu foto de perfil y, abajo del menú, elegí «Modo restringido»."
    abrir: "https://support.google.com/youtube/answer/174084?hl=es-419"
  - texto: "En el cuadrito que aparece, tocá «Activar modo restringido» (el mismo botón sirve para sacarlo)."
  - texto: "Repetilo en cada navegador de la compu (por ejemplo Chrome y Edge), y en cada perfil si hay varios: se configura por separado. Para algo más completo, escribile a PC Doctor «controlar lo que usan los chicos en la computadora»."
fuentes:
  - https://support.google.com/youtube/answer/174084?hl=es-419
