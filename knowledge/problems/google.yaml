id: GOO-025
area: basico
titulo:
  sencillo: "Quiero sacar mi cuenta de Google de esta compu"
  tecnico: "Salir de una cuenta de Google y quitarla de la página de acceso"
explicacion:
  sencillo: "Si usaste tu Gmail en una compu que no es tuya, o la vas a regalar, conviene cerrar la sesión y quitar la cuenta de la lista para que nadie más entre con ella. Eso no borra tu cuenta: solo la saca de esta compu."
  tecnico: "Foto de perfil > Salir / Salir de todas las cuentas > Quitar una cuenta > Quitar; repetir en cada navegador."
frases: ["cerrar mi gmail en una compu ajena", "quiero sacar mi cuenta de google de esta computadora", "en la compu aparece la cuenta de google de otra persona", "cómo quito una cuenta de la lista para elegir cuenta de google"]
pasos:
  - texto: "En el navegador, entrá a myaccount.google.com. Arriba a la derecha tocá tu foto o tu inicial y elegí «Salir» (o «Salir de todas las cuentas»)."
    abrir: "https://support.google.com/accounts/answer/1721977?hl=es-419"
  - texto: "En la pantalla que aparece, tocá «Quitar una cuenta» y después «Quitar» junto a la cuenta que querés sacar."
  - texto: "Hacé lo mismo en cada navegador de la compu donde la hayas usado (por ejemplo Chrome y Edge). Si te preocupa que alguien la siga usando en otro aparato, escribile a PC Doctor «ver en qué aparatos está abierta mi cuenta de google»."
fuentes:
  - https://support.google.com/accounts/answer/1721977?hl=es-419
