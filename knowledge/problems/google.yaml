id: GOO-011
area: programas
titulo:
  sencillo: "YouTube dice «Se produjo un error» y el video no arranca"
  tecnico: "Errores de reproducción de YouTube en el navegador"
explicacion:
  sencillo: "A veces YouTube muestra un cartel de error en vez del video. Suele arreglarse recargando, revisando Internet o desactivando un bloqueador de anuncios."
  tecnico: "«Se produjo un error al cargar la página» / «Se produjo un error. Actualiza la página...»: recargar, iniciar sesión, navegador actualizado, quitar bloqueadores, borrar caché y cookies."
frases: ["youtube me dice que se produjo un error", "el video de youtube no carga y sale un cartel", "youtube no me reproduce nada", "la pantalla del video queda negra en youtube"]
pasos:
  - texto: "Recargá la página (tecla F5). Si sigue igual, esperá un rato y probá de nuevo: a veces el problema es de YouTube."
    abrir: "https://support.google.com/youtube/answer/3037019?hl=es-419"
  - texto: "Fijate que Internet ande en otras páginas y que tengas la sesión iniciada en YouTube."
  - texto: "Si tenés un bloqueador de anuncios u otra extensión, probá el video en una ventana de incógnito (Ctrl + Mayús + N en Chrome), que abre sin extensiones. Si ahí anda, la culpa es de la extensión."
  - texto: "Si sigue fallando, reiniciá el navegador o la compu y actualizá el navegador. También podés borrar la caché y las cookies: escribile a PC Doctor «borrar la caché del navegador»."
fuentes:
  - https://support.google.com/youtube/answer/3037019?hl=es-419
madurez: T0
