id: GOO-009
area: programas
titulo:
  sencillo: "Quiero usar los documentos de Google aunque no tenga Internet"
  tecnico: "Acceso sin conexión a Documentos, Hojas de cálculo y Presentaciones"
explicacion:
  sencillo: "Se puede dejar preparado Drive para seguir escribiendo sin Internet. Hay que activarlo antes, mientras todavía tenés conexión, y funciona en Chrome o Edge."
  tecnico: "Requiere Chrome o Edge (no incógnito) y la extensión «Google Docs Offline»; Drive > Configuración > Sin conexión; «Disponible sin conexión» por archivo."
frases: ["quiero trabajar en google docs sin internet", "se me corta internet y no puedo abrir el documento de google", "usar las planillas de google sin conexión", "dejar un documento del drive disponible sin conexión"]
pasos:
  - texto: "Con Internet funcionando, abrí Drive en Chrome o Edge (no en ventana de incógnito). Arriba a la derecha tocá el engranaje de configuración y activá «Sin conexión». Si te lo pide, instalá la extensión «Google Docs Offline»."
    abrir: "https://support.google.com/docs/answer/6388102?hl=es-419"
  - texto: "Para un archivo en particular: en la pantalla principal de Documentos o Hojas de cálculo, tocá «Más» (los tres puntitos) junto al archivo y elegí «Disponible sin conexión»."
  - texto: "Para saber si quedó listo, abrí el archivo y tocá el ícono de estado que está al lado del título."
fuentes:
  - https://support.google.com/docs/answer/6388102?hl=es-419
madurez: T0
---
id: GOO-010
area: programas
titulo:
  sencillo: "Me mandaron un Word o un Excel y lo quiero abrir con Google"
  tecnico: "Abrir y editar archivos de Office en Documentos y Hojas de cálculo de Google"
explicacion:
  sencillo: "Si no tenés Office instalado, podés abrir y modificar archivos de Word o Excel con Documentos y Hojas de cálculo de Google, desde Drive."
  tecnico: "Doble clic en el archivo de Office en Drive; en Chrome, Modo de compatibilidad con Office (extensión «Edición de documentos de Office»)."
frases: ["no tengo word y me mandaron un archivo docx", "abrir un excel con google", "cómo edito un word en google drive", "me llegó un archivo de word y no lo puedo abrir"]
pasos:
  - texto: "Subí el archivo a Drive (si no sabés cómo, escribile a PC Doctor «subir un archivo a google drive»)."
  - texto: "En Drive, hacé doble clic sobre el archivo de Word o Excel: se abre en Documentos o en Hojas de cálculo de Google y lo podés modificar."
    abrir: "https://support.google.com/docs/answer/6055139?hl=es-419"
  - texto: "Si después lo tenés que devolver en Word o Excel, escribile a PC Doctor «pasar un documento de google a word»."
fuentes:
  - https://support.google.com/docs/answer/6055139?hl=es-419
madurez: T0
