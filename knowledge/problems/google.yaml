titulo:
  sencillo: "Google, Gmail o YouTube me aparecen en otro idioma"
  tecnico: "Cambiar el idioma de preferencia de la cuenta de Google en la Web"
explicacion:
  sencillo: "El idioma de las páginas de Google se elige en tu cuenta de Google. Si quedó en inglés u otro idioma, se puede volver a poner en español."
  tecnico: "myaccount.google.com/language > Idioma > Editar > seleccionar; afecta los servicios web, no las apps del celular."
frases: ["gmail me quedó en inglés", "youtube está en otro idioma", "cómo pongo google en español", "se me cambió el idioma de la cuenta de google"]
pasos:
  - texto: "Entrá a myaccount.google.com/language (si te lo pide, iniciá sesión)."
    abrir: "https://support.google.com/accounts/answer/32047?hl=es-419"
  - texto: "Tocá «Idioma» y después «Editar». Buscá «Español», elegilo y tocá «Seleccionar»."
  - texto: "Cerrá el navegador y volvé a abrirlo para que tome el cambio. Si lo que está en otro idioma es toda la compu, escribile a PC Doctor «windows está en otro idioma»."
