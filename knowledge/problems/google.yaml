id: GOO-006
area: archivos
titulo:
  sencillo: "Quiero tener Google Drive como una carpeta más en la compu"
  tecnico: "Instalar y usar Google Drive para computadoras en Windows"
explicacion:
  sencillo: "«Drive para computadoras» es un programa gratis de Google que muestra tus archivos de Drive dentro del Explorador de archivos, como si fuera una carpeta más."
  tecnico: "GoogleDriveSetup.exe; acceso desde la bandeja del sistema; carpeta Google Drive con «Mi unidad» en el Explorador."
frases: ["quiero el drive en el explorador de archivos", "cómo instalo google drive en la pc", "drive para computadoras", "quiero ver mis archivos del drive sin abrir el navegador"]
pasos:
  - texto: "Desde la página de ayuda de Google, tocá el botón de descarga para Windows. Se baja un archivo llamado GoogleDriveSetup.exe: abrilo y seguí los pasos del asistente. Bajalo solo desde la página oficial de Google."
    abrir: "https://support.google.com/drive/answer/10838124?hl=es-419"
  - texto: "Al abrirlo por primera vez, tocá «Comenzar» y «Acceder», y entrá con tu cuenta de Google."
  - texto: "Después abrí el Explorador de archivos y buscá la carpeta de Google Drive: adentro está «Mi unidad», con tus archivos. El ícono del programa queda abajo a la derecha, junto al reloj (si no lo ves, tocá la flechita «^»)."
fuentes:
  - https://support.google.com/drive/answer/10838124?hl=es-419
madurez: T0
