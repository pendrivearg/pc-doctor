id: GOO-013
area: programas
titulo:
  sencillo: "Los videos de YouTube se ven borrosos"
  tecnico: "Cambiar la calidad (resolución) de un video de YouTube"
explicacion:
  sencillo: "YouTube baja la calidad sola si la conexión es lenta, y eso hace que se vea borroso. Podés elegir una calidad más alta a mano. Si el video se grabó en baja calidad, no se puede mejorar."
  tecnico: "Configuración (engranaje) > Calidad; la calidad automática depende de la conexión, el tamaño del reproductor y el video original."
frases: ["youtube se ve borroso", "cómo pongo youtube en alta calidad", "los videos se ven pixelados", "quiero ver youtube en hd en la compu"]
pasos:
  - texto: "En el video, abajo a la derecha, tocá el engranaje («Configuración») y después «Calidad»."
    abrir: "https://support.google.com/youtube/answer/91449?hl=es-419"
  - texto: "Elegí un número más alto (por ejemplo 720p o 1080p). Si después se traba, volvé a bajarla."
  - texto: "Si no aparecen calidades altas, puede ser que el video se haya grabado así, o que el navegador no las admita: probá con otro video o con el navegador actualizado."
fuentes:
  - https://support.google.com/youtube/answer/91449?hl=es-419
madurez: T0
---
id: GOO-014
area: programas
titulo:
  sencillo: "Quiero poner (o sacar) los subtítulos en YouTube"
  tecnico: "Activar subtítulos y cambiar su tamaño y estilo en YouTube"
explicacion:
  sencillo: "Muchos videos de YouTube tienen subtítulos que se prenden y apagan con un botón. También se pueden agrandar o cambiar de color para leerlos mejor."
  tecnico: "Botón Subtítulos del reproductor; Configuración > Subtítulos > Opciones (fuente, color, tamaño, fondo)."
frases: ["cómo pongo subtítulos en youtube", "quiero sacar los subtítulos del video", "los subtítulos de youtube son muy chiquitos", "youtube me muestra letras abajo y no las quiero"]
pasos:
  - texto: "Abajo a la derecha del video, tocá el botón «Subtítulos» para activarlos; tocalo de nuevo para sacarlos. Si el botón no está, ese video no tiene subtítulos."
    abrir: "https://support.google.com/youtube/answer/100078?hl=es-419"
  - texto: "Para agrandarlos o cambiarles el color: engranaje («Configuración») > «Subtítulos» > «Opciones». Ahí elegís tamaño, color y fondo."
  - texto: "Queda así para los próximos videos. Para volver a como estaba, usá «Restablecer» en esas mismas opciones."
fuentes:
  - https://support.google.com/youtube/answer/100078?hl=es-419
madurez: T0
