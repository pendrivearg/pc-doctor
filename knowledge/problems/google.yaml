id: GOO-016
area: programas
titulo:
  sencillo: "YouTube no me deja ver un video porque dice que tiene restricción de edad"
  tecnico: "Videos con restricción de edad en YouTube"
explicacion:
  sencillo: "Algunos videos son solo para mayores de 18. Para verlos hay que tener la sesión iniciada con una cuenta de una persona adulta, y mirarlos en la página de YouTube."
  tecnico: "Requiere sesión iniciada y edad ≥ 18; no se reproducen incrustados en sitios de terceros; en la UE, EEE, Suiza, Reino Unido y Australia puede pedirse verificación adicional."
frases: ["youtube me pide confirmar la edad", "dice que el video tiene restricción de edad", "no me deja ver un video porque dice que puede ser inapropiado", "youtube pide iniciar sesión para ver un video"]
pasos:
  - texto: "Iniciá sesión en YouTube con tu cuenta de Google (arriba a la derecha, «Acceder»). Sin sesión iniciada, esos videos no se pueden ver."
    abrir: "https://support.google.com/youtube/answer/10070779?hl=es-419"
  - texto: "Si el video está metido dentro de otra página, abrilo directamente en youtube.com: Google indica que estos videos no se ven incrustados en otros sitios."
  - texto: "Si la cuenta es de un menor de 18, YouTube no lo va a mostrar. Google indica que el pedido extra de documentos para verificar la edad solo se aplica en la Unión Europea, Suiza, el Reino Unido y Australia."
fuentes:
  - https://support.google.com/youtube/answer/10070779?hl=es-419
madurez: T0
