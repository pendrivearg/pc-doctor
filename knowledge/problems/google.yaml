  tecnico: "Controles parentales de YouTube Kids en computadora"
explicacion:
  sencillo: "YouTube Kids es la versión de YouTube para chicos. Los padres pueden elegir qué tipo de videos ve el chico según su edad y apagar la búsqueda o que los videos sigan solos."
