id: GOO-015
area: programas
titulo:
  sencillo: "Quiero borrar lo que vi en YouTube (o que no se guarde)"
  tecnico: "Ver, borrar o pausar el historial de reproducciones de YouTube"
explicacion:
  sencillo: "YouTube guarda la lista de videos que viste y la usa para recomendarte otros. Podés borrar algunos, todos, o pausarlo para que no anote nada más."
  tecnico: "Mi actividad > Historial de YouTube > Administrar historial; BORRAR; Controles > Desactivar."
frases: ["borrar el historial de youtube", "no quiero que youtube guarde lo que miro", "cómo borro un video que vi en youtube", "youtube me recomienda cosas por lo que vio mi nieto"]
pasos:
  - texto: "Entrá a myactivity.google.com con tu cuenta, tocá «Historial de YouTube» y después «Administrar historial»: ahí está la lista de lo que viste."
    abrir: "https://support.google.com/youtube/answer/95725?hl=es-419"
  - texto: "Para sacar un solo video, tocá la cruz (×) al lado. Para borrar muchos, tocá «BORRAR» y elegí el período. Ojo: no se puede deshacer, también se borran las búsquedas de ese período y las recomendaciones pueden cambiar."
  - texto: "Para que deje de anotar: en esa misma página, en la pestaña «Controles», elegí «Desactivar»."
fuentes:
  - https://support.google.com/youtube/answer/95725?hl=es-419
madurez: T0
