id: GOO-022
area: basico
titulo:
  sencillo: "Quiero que el Calendario de Google me avise antes de un turno"
  tecnico: "Notificaciones (recordatorios) de eventos en el Calendario de Google"
explicacion:
  sencillo: "Cada evento del Calendario puede tener un aviso, por ejemplo un día antes o media hora antes. En la compu, el aviso aparece si el Calendario está abierto en el navegador y le diste permiso."
  tecnico: "Editar evento > Notificaciones > Agregar notificación; predeterminadas en Configuración del calendario; permitir notificaciones de calendar.google.com en el navegador."
frases: ["que google calendar me avise del turno", "poner un recordatorio en el calendario de google", "el calendario no me avisa de nada", "quiero que me avise un día antes del cumpleaños"]
pasos:
  - texto: "Abrí el evento en el Calendario y tocá «Editar evento». En «Notificaciones», cambiá el tiempo de aviso o tocá «Agregar notificación» para sumar otro. Después, «Guardar»."
    abrir: "https://support.google.com/calendar/answer/37242?hl=es-419"
  - texto: "Si el navegador te pregunta si «calendar.google.com» puede mostrar notificaciones, permitilo. Y dejá el Calendario abierto en una pestaña."
  - texto: "Si no te llegan los avisos, en Chrome revisá «Configuración» > «Privacidad y seguridad» > «Configuración de sitios» > «Notificaciones» y agregá calendar.google.com."
