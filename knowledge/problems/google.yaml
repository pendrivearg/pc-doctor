id: GOO-005
area: archivos
titulo:
  sencillo: "Borré un archivo de Google Drive y lo quiero recuperar"
  tecnico: "Restablecer archivos desde la Papelera de Drive"
explicacion:
  sencillo: "Lo que borrás en Drive no desaparece enseguida: queda 30 días en la «Papelera» y desde ahí se puede devolver a su lugar."
  tecnico: "drive.google.com > Papelera > clic derecho > Restablecer (30 días)."
frases: ["borré algo del drive sin querer", "cómo recupero un documento que eliminé de google drive", "dónde está la papelera del drive", "desapareció un archivo del drive"]
pasos:
  - texto: "Entrá a drive.google.com y, en el panel de la izquierda, tocá «Papelera»."
    abrir: "https://support.google.com/drive/answer/2405957?hl=es-419"
  - texto: "Hacé clic derecho sobre el archivo que querés y elegí «Restablecer». Vuelve a su lugar."
  - texto: "Hacelo pronto: los archivos quedan 30 días en la papelera y después se borran para siempre."
fuentes:
  - https://support.google.com/drive/answer/2405957?hl=es-419
madurez: T0
