# Servicios de Google en la PC: Drive, Documentos y Hojas de cálculo, YouTube, Maps, Calendario, Traductor y cuenta de Google. Guiadas con la ayuda oficial de Google (support.google.com, es-419).
id: GOO-001
area: archivos
titulo:
  sencillo: "Quiero subir un archivo o una carpeta a Google Drive"
  tecnico: "Subir archivos y carpetas a Google Drive desde el navegador"
explicacion:
  sencillo: "Google Drive es un lugar en Internet, dentro de tu cuenta de Google, donde podés guardar documentos y fotos para tenerlos a mano desde cualquier compu o celular."
  tecnico: "drive.google.com > Nuevo > Subir archivo / Subir carpeta."
frases: ["cómo subo un archivo al drive", "quiero guardar unas fotos en google drive", "pasar una carpeta de la compu al drive", "subir documentos a la nube de google"]
pasos:
  - texto: "En el navegador, entrá a drive.google.com con tu cuenta de Google."
  - texto: "Arriba a la izquierda, tocá el botón «Nuevo» y elegí «Subir archivo» o «Subir carpeta»."
    abrir: "https://support.google.com/drive/answer/2424368?hl=es-419"
  - texto: "Buscá en la compu el archivo o la carpeta, elegilo y esperá a que termine de subir antes de cerrar la ventana."
fuentes:
  - https://support.google.com/drive/answer/2424368?hl=es-419
madurez: T0
---
id: GOO-002
area: archivos
titulo:
  sencillo: "Quiero bajar a la compu un archivo que tengo en Google Drive"
  tecnico: "Descargar uno o varios archivos de Google Drive"
explicacion:
  sencillo: "Lo que está en Drive vive en Internet. Si lo querés tener en la compu (por ejemplo para pasarlo a un pendrive), hay que descargarlo."
  tecnico: "drive.google.com > seleccionar (Ctrl + clic para varios) > clic derecho > Descargar."
frases: ["cómo bajo un archivo del drive", "quiero descargar unas fotos de google drive a la compu", "pasar algo del drive a la computadora", "no puedo arrastrar el archivo del drive al escritorio"]
pasos:
  - texto: "Entrá a drive.google.com y hacé clic sobre el archivo que querés bajar. Para elegir varios, mantené apretada la tecla Ctrl mientras hacés clic en cada uno."
  - texto: "Hacé clic derecho sobre lo que elegiste y tocá «Descargar». Google aclara que no se puede arrastrar el archivo directamente al escritorio."
    abrir: "https://support.google.com/drive/answer/2423534?hl=es-419"
  - texto: "El archivo queda en la carpeta Descargas de la compu."
fuentes:
  - https://support.google.com/drive/answer/2423534?hl=es-419
madurez: T0
---
id: GOO-003
area: archivos
titulo:
  sencillo: "Quiero compartir un archivo de Google Drive con otra persona"
  tecnico: "Compartir archivos de Drive por correo o con un vínculo"
explicacion:
  sencillo: "Desde Drive podés darle permiso a otra persona para ver o cambiar un archivo, sin mandárselo pegado en un correo. Vos elegís si solo lo puede mirar o también modificar."
  tecnico: "Compartir > agregar correo > rol (Lector, Comentarista, Editor); o «Acceso general» + Copiar vínculo."
frases: ["cómo le comparto un archivo del drive a mi hija", "quiero mandar un link de google drive", "compartir una carpeta del drive con alguien", "que otra persona pueda ver mi documento de drive"]
pasos:
  - texto: "En Drive, elegí el archivo y tocá el botón «Compartir»."
    abrir: "https://support.google.com/drive/answer/2494822?hl=es-419"
  - texto: "Escribí el correo de la persona y elegí qué puede hacer: «Lector» (solo mirar), «Comentarista» (mirar y comentar) o «Editor» (cambiarlo). Después tocá «Enviar»."
  - texto: "Si preferís mandar un enlace por WhatsApp: en «Acceso general» elegí «Cualquier persona que tenga el vínculo», tocá «Copiar vínculo» y después «Listo». Ojo: cualquiera que reciba ese enlace podrá abrirlo."
fuentes:
  - https://support.google.com/drive/answer/2494822?hl=es-419
madurez: T0
---
id: GOO-004
area: archivos
titulo:
  sencillo: "Google Drive dice que no tengo más espacio para subir archivos"
  tecnico: "Liberar espacio en Drive: archivos más grandes, duplicados y papelera"
explicacion:
  sencillo: "El espacio gratis de tu cuenta de Google se comparte entre Drive, Gmail y Fotos. Cuando se llena, Drive no deja subir nada más. Se puede liberar lugar borrando lo que ya no usás."
  tecnico: "Cuota compartida de 15 GB; Drive > Almacenamiento ordena por tamaño; duplicados «(1)» o «Copia de»; vaciar papelera."
frases: ["el drive no me deja subir nada porque está lleno", "cómo veo qué ocupa tanto lugar en google drive", "se me llenó el drive", "tengo archivos repetidos en el drive y quiero liberar espacio"]
pasos:
  - texto: "En Drive, en el menú de la izquierda, entrá a «Almacenamiento»: ahí ves los archivos ordenados del más pesado al más liviano."
    abrir: "https://support.google.com/drive/answer/6374270?hl=es-419"
  - texto: "Buscá copias repetidas: Google sugiere ordenar por nombre y fijarse en los que dicen «(1)» o empiezan con «Copia de». Antes de borrar, asegurate de que no lo necesitás o de tenerlo guardado en otro lado."
  - texto: "Vaciá la papelera de Drive: lo que está ahí sigue ocupando lugar. Ojo: lo que se borra de la papelera ya no se puede recuperar. El espacio puede tardar de 48 a 72 horas en actualizarse."
  - texto: "Si el aviso aparece también en el correo, escribile a PC Doctor «gmail dice que me quedé sin espacio»."
fuentes:
  - https://support.google.com/drive/answer/6374270?hl=es-419
madurez: T0
