  - texto: "Poné un título (por ejemplo «Turno con el médico»), la fecha y la hora, y tocá «Guardar» arriba."
  - texto: "Más rápido: hacé clic en el espacio del día que querés, escribí el título y el horario, y tocá «Guardar»."
