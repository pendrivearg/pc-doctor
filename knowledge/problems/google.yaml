id: GOO-008
area: programas
titulo:
  sencillo: "Quiero pasar un documento de Google a Word o a PDF"
  tecnico: "Descargar desde Documentos u Hojas de cálculo de Google (.docx, .xlsx, PDF)"
explicacion:
  sencillo: "Un documento hecho en Google se puede bajar a la compu como archivo de Word o como PDF, por ejemplo para imprimirlo o mandarlo por correo. Las planillas se pueden bajar como Excel."
  tecnico: "Archivo > Descargar > elegir formato (Documentos: .docx; Hojas de cálculo: .xlsx); o Archivo > Imprimir > Guardar como PDF."
frases: ["cómo paso el documento de google a word", "guardar un google docs como pdf", "descargar la planilla de google como excel", "me pidieron el documento en word y lo tengo en google"]
pasos:
  - texto: "Abrí el documento o la planilla. Arriba, tocá «Archivo» y después la opción de descarga («Descargar»)."
    abrir: "https://support.google.com/docs/answer/49114?hl=es-419"
  - texto: "Elegí el tipo de archivo que necesitás: Google indica que un documento se puede guardar como .docx (Word) y una planilla como .xlsx (Excel). También está PDF. Queda en la carpeta Descargas."
    abrir: "https://support.google.com/docs/answer/6055139?hl=es-419"
  - texto: "Si el documento es muy grande y el PDF no sale: en Chrome, «Archivo» > «Imprimir», en «Destino» elegí «Guardar como PDF» y tocá «Guardar»."
fuentes:
  - https://support.google.com/docs/answer/49114?hl=es-419
  - https://support.google.com/docs/answer/6055139?hl=es-419
madurez: T0
