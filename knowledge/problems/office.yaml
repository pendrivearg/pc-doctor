id: OFC-008
area: programas
titulo:
  sencillo: "Quiero imprimir solo una parte de la planilla de Excel"
  tecnico: "Establecer o borrar el área de impresión en Excel"
explicacion:
  sencillo: "En Excel podés marcar qué celdas querés imprimir y el resto no sale en el papel. Queda guardado hasta que lo borres."
  tecnico: "Disposición de página > Configurar página > Área de impresión > Establecer área de impresión / Borrar área de impresión."
frases: ["imprimir solo algunas celdas de excel", "quiero imprimir una parte de la planilla", "excel me imprime todo y quiero solo un pedazo", "sacar por impresora solo una tabla de la hoja"]
pasos:
  - texto: "Seleccioná con el mouse las celdas que querés imprimir."
  - texto: "Andá a la pestaña de diseño de página («Disposición de página» o «Diseño de página», según la versión) > «Área de impresión» > «Establecer área de impresión». Después imprimí como siempre."
    abrir: "https://support.microsoft.com/excel/set-or-clear-a-print-area-on-a-worksheet"
  - texto: "Para volver a imprimir todo: misma pestaña > «Área de impresión» > «Borrar área de impresión»."
fuentes:
  - https://support.microsoft.com/excel/set-or-clear-a-print-area-on-a-worksheet
madurez: T0
