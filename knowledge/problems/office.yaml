id: OFC-022
area: programas
titulo:
  sencillo: "En Word aparecen puntitos y símbolos ¶ entre las palabras"
  tecnico: "Mostrar u ocultar marcas de formato en Word"
explicacion:
  sencillo: "Esos puntitos (espacios), flechitas (tabulaciones) y el símbolo ¶ (fin de párrafo) son caracteres ocultos que Word te deja ver para ayudar a acomodar el texto. No es un error y se pueden esconder con un botón."
  tecnico: "Botón Mostrar u ocultar (¶) en Inicio; Archivo > Opciones > Mostrar > «Mostrar siempre estas marcas de formato en la pantalla»."
frases: ["me aparecen puntitos entre las palabras en word", "sale un símbolo raro al final de cada renglón", "cómo saco los signos de párrafo", "aparecen flechitas en el documento"]
pasos:
  - texto: "En la pestaña «Inicio», tocá el botón con el símbolo ¶ (mostrar u ocultar). Las marcas desaparecen; tocándolo de nuevo vuelven."
    abrir: "https://support.microsoft.com/word/show-or-hide-tab-marks-in-word"
  - texto: "Si alguna marca sigue apareciendo igual, entrá a «Archivo» > «Opciones» > «Mostrar» y, en la parte de marcas de formato que se muestran siempre, desmarcá las que estén tildadas."
fuentes:
  - https://support.microsoft.com/word/show-or-hide-tab-marks-in-word
madurez: T0
