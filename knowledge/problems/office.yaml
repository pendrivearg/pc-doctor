id: OFC-005
area: programas
titulo:
  sencillo: "El video o la música de PowerPoint no se reproduce"
  tecnico: "Problemas de reproducción de audio y video en PowerPoint"
explicacion:
  sencillo: "Muchas veces el video no anda porque está en un formato raro o porque quedó «vinculado» a un archivo que está en otra computadora. PowerPoint trae una opción para dejarlo listo para cualquier equipo."
  tecnico: "Archivo > Información > Optimizar la compatibilidad; incrustar medios vinculados (Romper vínculo); formato recomendado .mp4 (H.264 + AAC) o .m4a."
frases: ["el video del powerpoint no anda", "en la presentación no se escucha la música", "power point no reproduce el video", "el video se ve en mi compu pero no en otra"]
pasos:
  - texto: "En la compu donde armaste la presentación, tocá «Archivo» > «Información». Si aparece «Optimizar la compatibilidad», tocala y esperá a que termine. Hacelo antes de llevar la presentación a otro lado."
    abrir: "https://support.microsoft.com/office/are-you-having-video-or-audio-playback-issues-e0a94444-8ea7-4a00-974b-6ad0d6edc4b1"
  - texto: "Si te avisa que hay videos vinculados, tocá «Ver vínculos» y después «Romper vínculo» en cada uno, así quedan guardados adentro de la presentación."
  - texto: "Si el video sigue sin andar, lo más seguro es usar un archivo .mp4 (para música, .m4a). Microsoft explica qué formatos funcionan mejor."
    abrir: "https://support.microsoft.com/powerpoint/video-and-audio-file-formats-supported-in-powerpoint"
fuentes:
  - https://support.microsoft.com/office/are-you-having-video-or-audio-playback-issues-e0a94444-8ea7-4a00-974b-6ad0d6edc4b1
  - https://support.microsoft.com/powerpoint/video-and-audio-file-formats-supported-in-powerpoint
madurez: T0
