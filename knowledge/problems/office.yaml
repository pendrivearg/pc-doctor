id: OFC-004
area: programas
titulo:
  sencillo: "Excel muestra la fórmula escrita en vez del resultado"
  tecnico: "Fórmulas que se ven como texto o no se calculan en Excel"
explicacion:
  sencillo: "Si en la celda ves «=SUMA(A1:A10)» en lugar del total, Excel la está tomando como texto o tiene activado mostrar las fórmulas. Se arregla con un par de clics."
  tecnico: "Causas: Mostrar fórmulas activado (Ctrl + acento grave), celda con formato Texto, falta el signo =, o cálculo del libro en Manual."
frases: ["excel no hace la cuenta", "en la celda aparece la fórmula y no el resultado", "la suma de excel no calcula", "puse una fórmula y queda escrita así nomás"]
pasos:
  - texto: "En la pestaña «Fórmulas», fijate si está apretado «Mostrar fórmulas». Si lo está, tocalo para apagarlo."
    abrir: "https://support.microsoft.com/office/how-to-avoid-broken-formulas-in-excel-8309381d-33e8-42f6-b889-84ef6df1d586"
  - texto: "Revisá que la fórmula empiece con el signo igual: «=SUMA(A1:A10)», no «SUMA(A1:A10)»."
  - texto: "Si sigue igual, la celda puede tener formato de texto: hacé clic derecho en la celda > «Formato de celdas» > «General» > «Aceptar». Después apretá F2 y Enter."
  - texto: "Si los resultados no se actualizan cuando cambiás un número, entrá a «Archivo» > «Opciones» > «Fórmulas» y en «Cálculo del libro» elegí «Automático»."
fuentes:
  - https://support.microsoft.com/office/how-to-avoid-broken-formulas-in-excel-8309381d-33e8-42f6-b889-84ef6df1d586
madurez: T0
