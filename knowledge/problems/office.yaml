id: OFC-014
area: programas
titulo:
  sencillo: "Quiero juntar varias celdas de Excel en una sola"
  tecnico: "Combinar y separar celdas en Excel"
explicacion:
  sencillo: "Combinar celdas sirve, por ejemplo, para poner un título que ocupe todo el ancho de una tabla. Ojo: si varias celdas tienen algo escrito, solo queda lo de la primera (la de arriba a la izquierda)."
  tecnico: "Inicio > Combinar y centrar; solo se conserva el contenido de la celda superior izquierda; Separar celdas para deshacer."
frases: ["juntar celdas en excel", "combinar celdas para un título", "unir dos celdas en una", "separar una celda combinada"]
pasos:
  - texto: "Antes de combinar, copiá en otro lado lo que esté escrito en las otras celdas: al combinar se pierde y solo queda lo de la primera."
  - texto: "Seleccioná las celdas que querés juntar y en la pestaña «Inicio» tocá «Combinar y centrar» (o su flechita > «Combinar celdas», si no querés que quede centrado)."
    abrir: "https://support.microsoft.com/excel/get-started/merge-and-unmerge-cells-in-excel"
  - texto: "Para separarlas de nuevo: tocá la celda combinada, abrí la flechita al lado de «Combinar y centrar» y elegí «Separar celdas». Si recién lo hiciste, también sirve Ctrl + Z."
fuentes:
  - https://support.microsoft.com/excel/get-started/merge-and-unmerge-cells-in-excel
madurez: T0
---
id: OFC-015
area: programas
titulo:
  sencillo: "Quiero que los títulos de Excel queden fijos cuando bajo en la planilla"
  tecnico: "Inmovilizar paneles (fijar filas y columnas) en Excel"
explicacion:
  sencillo: "En planillas largas, al bajar se pierden de vista los títulos de las columnas. Excel puede dejar fija la primera fila (o la primera columna) para que siempre se vea."
  tecnico: "Vista > Inmovilizar: fila superior, primera columna o paneles desde la celda seleccionada; Movilizar paneles para quitarlo."
frases: ["fijar la primera fila en excel", "que no se muevan los títulos al bajar", "dejar quieta la fila de arriba", "la planilla de arriba no se mueve y no sé por qué"]
pasos:
  - texto: "Excel deja fijas las filas que están arriba y las columnas que están a la izquierda de la celda que elijas. Para fijar solo la fila de los títulos, tocá la celda A2."
  - texto: "En la pestaña «Vista», tocá «Inmovilizar» y elegí «Inmovilizar paneles». Para fijar filas y columnas a la vez, elegí antes la celda que está justo debajo y a la derecha de lo que querés dejar quieto."
    abrir: "https://support.microsoft.com/excel/get-started/freeze-panes-to-lock-rows-and-columns"
  - texto: "Para sacarlo (o si la parte de arriba no se mueve y no sabés por qué): «Vista» > «Inmovilizar» > «Movilizar paneles»."
fuentes:
  - https://support.microsoft.com/excel/get-started/freeze-panes-to-lock-rows-and-columns
madurez: T0
