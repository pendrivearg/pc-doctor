id: OFC-020
area: programas
titulo:
  sencillo: "En Word aparecen tachones y textos de colores al costado"
  tecnico: "Control de cambios: aceptar cambios y desactivar el seguimiento"
explicacion:
  sencillo: "Cuando alguien corrige un documento con «Control de cambios», lo que borra aparece tachado y lo que agrega en color. Para que quede limpio hay que aceptar (o rechazar) esos cambios; esconderlos no alcanza."
  tecnico: "Revisar > Seguimiento > Control de cambios para dejar de marcar; Aceptar > Aceptar todos los cambios; la vista Sin marcas solo oculta temporalmente."
frases: ["word me tacha lo que borro", "aparecen letras de colores en el documento", "sacar las correcciones de word", "cómo saco las marcas de revisión"]
pasos:
  - texto: "Para que no marque más lo que escribís: en la pestaña «Revisar», tocá «Control de cambios» para que deje de estar resaltado. Lo que ya estaba marcado sigue ahí."
    abrir: "https://support.microsoft.com/word/training/track-changes-in-word"
  - texto: "Para dejar el texto limpio con todas las correcciones: en «Revisar», abrí la flechita de «Aceptar» y elegí «Aceptar todos los cambios»."
    abrir: "https://support.microsoft.com/word/accept-or-reject-tracked-changes-in-word"
  - texto: "Si preferís revisar uno por uno, usá «Aceptar» o «Rechazar» en cada cambio: Word pasa solo al siguiente. Si te mandaron el documento solo para revisar, puede que no te deje apagar el control de cambios: guardá una copia o pedile a quien te lo mandó que lo comparta de nuevo."
fuentes:
  - https://support.microsoft.com/word/training/track-changes-in-word
  - https://support.microsoft.com/word/accept-or-reject-tracked-changes-in-word
madurez: T0
