id: OFC-016
area: programas
titulo:
  sencillo: "Desaparecieron los botones de arriba en Word o Excel"
  tecnico: "Mostrar u ocultar la cinta de opciones en Office"
explicacion:
  sencillo: "La barra de botones de arriba (la «cinta de opciones») se puede esconder sin querer. No se borró nada: se vuelve a mostrar en un segundo."
  tecnico: "Cinta contraída (clic derecho en una pestaña > Contraer la cinta de opciones) u Opciones de presentación de la cinta; el modo de pantalla completa la oculta del todo."
frases: ["desaparecieron los botones de word", "se fue la barra de herramientas de excel", "no veo los menús de arriba", "solo se ven los nombres de las pestañas"]
pasos:
  - texto: "Si ves los nombres de las pestañas (Inicio, Insertar…) pero no los botones: hacé clic derecho sobre cualquier pestaña y desmarcá «Contraer la cinta de opciones»."
    abrir: "https://support.microsoft.com/office/foundations-experiences/show-or-hide-the-ribbon-in-office"
  - texto: "Otra forma: tocá una pestaña y, en el botón de opciones de presentación de la cinta (abajo a la derecha de la cinta), elegí «Mostrar siempre la cinta de opciones»."
  - texto: "Si no se ve ninguna pestaña, está en pantalla completa: tocá los tres puntitos «...» arriba a la derecha para que aparezca y cambiá la opción como en el paso anterior."
fuentes:
  - https://support.microsoft.com/office/foundations-experiences/show-or-hide-the-ribbon-in-office
madurez: T0
