id: OFC-013
area: programas
titulo:
  sencillo: "Quiero poner la hoja acostada (horizontal) en Word"
  tecnico: "Cambiar la orientación de página a horizontal o vertical"
explicacion:
  sencillo: "La hoja puede estar parada (vertical) o acostada (horizontal). Sirve para tablas anchas o carteles. Se puede cambiar todo el documento o solo una parte."
  tecnico: "Disposición > Orientación; para parte del documento, Configurar página > Horizontal > Aplicar a: Texto seleccionado."
frases: ["poner la hoja horizontal en word", "hoja apaisada", "dar vuelta la hoja para que quede acostada", "una sola página horizontal en el documento"]
pasos:
  - texto: "Para todo el documento: pestaña «Disposición» > «Orientación» > «Horizontal» (o «Vertical» para volver)."
    abrir: "https://support.microsoft.com/word/training/change-page-orientation-to-landscape-or-portrait"
  - texto: "Para una sola parte: seleccioná ese texto, en «Disposición» abrí la ventana de configurar página (la flechita chica en la esquina del grupo), elegí «Horizontal» y en «Aplicar a» poné «Texto seleccionado»."
fuentes:
  - https://support.microsoft.com/word/training/change-page-orientation-to-landscape-or-portrait
madurez: T0
