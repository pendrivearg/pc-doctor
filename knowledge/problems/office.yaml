# Word, Excel, PowerPoint y OneNote: problemas y tareas comunes (recuperar, vista protegida, errores de Excel, imprimir, formato, cuentas y reparación). Guiadas con fuente oficial.
id: OFC-001
area: archivos
titulo:
  sencillo: "Se cerró Word (o Excel) y no había guardado el documento"
  tecnico: "Recuperar archivos no guardados y Autorrecuperación en Office"
explicacion:
  sencillo: "Si Office se cerró de golpe o cerraste sin guardar, muchas veces queda una copia de emergencia. Hay que buscarla cuanto antes y guardarla con otro nombre."
  tecnico: "Panel Recuperación de documentos al reabrir; Archivo > Información > Administrar documento > recuperar no guardados; Autorrecuperación en Opciones > Guardar."
frases: ["se me cerró word y no guardé", "se cortó la luz y perdí el documento", "cerré excel sin guardar los cambios", "cómo recupero un documento que no guardé"]
pasos:
  - texto: "Volvé a abrir el mismo programa (Word, Excel o PowerPoint). Si aparece el panel «Recuperación de documentos», abrí la versión más nueva y guardala enseguida con «Guardar como»."
    abrir: "https://support.microsoft.com/office/collab-files/save-back-up-and-recover-a-file-in-microsoft-office"
  - texto: "Si no aparece: tocá «Archivo» > «Información» > «Administrar documento» (en Excel, «Administrar libro») y elegí la opción de recuperar los no guardados. Abrí el archivo y guardalo."
    abrir: "https://support.microsoft.com/office/recover-an-earlier-version-of-an-office-file-169cb166-e7e2-438e-8f39-9a8927828121"
  - texto: "Para la próxima: en «Archivo» > «Opciones» > «Guardar», dejá marcadas «Guardar información de Autorrecuperación cada x minutos» (5 o 10 minutos está bien) y la de mantener la última versión si cerrás sin guardar. Igual, guardá seguido: la Autorrecuperación no reemplaza a guardar."
    abrir: "https://support.microsoft.com/office/collab-files/help-protect-your-files-in-case-of-a-crash"
fuentes:
  - https://support.microsoft.com/office/collab-files/save-back-up-and-recover-a-file-in-microsoft-office
  - https://support.microsoft.com/office/recover-an-earlier-version-of-an-office-file-169cb166-e7e2-438e-8f39-9a8927828121
  - https://support.microsoft.com/office/collab-files/help-protect-your-files-in-case-of-a-crash
madurez: T0
