id: OFC-007
area: programas
titulo:
  sencillo: "Word no me marca las faltas de ortografía"
  tecnico: "La revisión ortográfica automática no subraya errores"
explicacion:
  sencillo: "Si escribís con errores y Word no los subraya, puede que la revisión mientras escribís esté apagada o que el documento tenga ocultos los errores."
  tecnico: "Archivo > Opciones > Revisión: Revisar ortografía mientras escribe y Excepciones para el documento; F7 para revisión manual."
frases: ["word no corrige la ortografía", "no me subraya las palabras mal escritas", "el corrector de word no funciona", "no aparecen las rayitas rojas en word"]
pasos:
  - texto: "Probá revisar a mano: apretá F7 (o en la pestaña «Revisar», el botón de ortografía y gramática)."
    abrir: "https://support.microsoft.com/office/check-spelling-and-grammar-in-office"
  - texto: "Para que marque mientras escribís: «Archivo» > «Opciones» > «Revisión» y marcá «Revisar ortografía mientras escribe»."
  - texto: "En esa misma pantalla, abajo, en la parte de excepciones para el documento, desmarcá las casillas que ocultan los errores de ortografía y de gramática solo en ese documento."
  - texto: "Si un pedazo del texto sigue sin revisarse, seleccionalo y en «Revisar» > «Idioma» > «Establecer idioma de corrección» desmarcá «No revisar la ortografía ni la gramática»."
    abrir: "https://support.microsoft.com/word/set-up-or-change-the-languages-used-to-check-spelling-and-grammar"
fuentes:
  - https://support.microsoft.com/office/check-spelling-and-grammar-in-office
  - https://support.microsoft.com/word/set-up-or-change-the-languages-used-to-check-spelling-and-grammar
madurez: T0
