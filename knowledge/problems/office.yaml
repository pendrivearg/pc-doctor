id: OFC-006
area: programas
titulo:
  sencillo: "Word me subraya todo en rojo porque corrige en otro idioma"
  tecnico: "Cambiar el idioma de corrección ortográfica en Word"
explicacion:
  sencillo: "Si Word marca como error palabras que están bien escritas, seguramente está revisando en inglés u otro idioma. Se le puede decir que revise en español."
  tecnico: "Revisar > Idioma > Establecer idioma de corrección para el texto seleccionado; Preferencias de idioma para agregar herramientas de corrección."
frases: ["word me marca todo en rojo", "el corrector está en inglés", "cambiar el idioma del corrector de word", "me subraya palabras que están bien escritas"]
pasos:
  - texto: "Seleccioná con el mouse el texto que querés corregir (o todo el documento). En la pestaña «Revisar», tocá «Idioma» > «Establecer idioma de corrección», elegí «Español» (por ejemplo, Argentina) y «Aceptar»."
    abrir: "https://support.microsoft.com/word/set-up-or-change-the-languages-used-to-check-spelling-and-grammar"
  - texto: "En esa misma ventana, si escribís en varios idiomas, podés marcar «Detectar el idioma automáticamente»."
  - texto: "Si el español no aparece o no tiene corrector, entrá a «Revisar» > «Idioma» > «Preferencias de idioma» y agregalo con sus herramientas de corrección."
fuentes:
  - https://support.microsoft.com/word/set-up-or-change-the-languages-used-to-check-spelling-and-grammar
madurez: T0
