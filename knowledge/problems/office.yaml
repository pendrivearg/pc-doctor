id: OFC-021
area: programas
titulo:
  sencillo: "Cuando escribo en Word se van borrando las letras de adelante"
  tecnico: "Modo Sobrescribir activado (tecla Insert) en Word"
explicacion:
  sencillo: "Si al escribir en el medio de una frase se «come» las letras que siguen, Word está en modo «sobrescribir». Seguramente se apretó sin querer la tecla Insert (Ins)."
  tecnico: "Archivo > Opciones > Avanzadas > Opciones de edición: Usar la tecla Insert para controlar el modo Sobrescribir / Usar el modo Sobrescribir."
frases: ["word me borra las letras cuando escribo", "escribo y se come lo que sigue", "se reemplaza el texto al escribir", "apreté insert y ahora escribe encima"]
pasos:
  - texto: "Apretá una vez la tecla Insert (en algunos teclados dice «Ins») y probá escribir de nuevo."
    abrir: "https://support.microsoft.com/office/type-over-text-in-word-for-windows-62c15c48-0936-4902-affe-4cadd71b7038"
  - texto: "Si sigue igual, entrá a «Archivo» > «Opciones» > «Avanzadas» y en las opciones de edición desmarcá las dos casillas del modo Sobrescribir (la de usar la tecla Insert y la de usar el modo Sobrescribir). Tocá «Aceptar»."
fuentes:
  - https://support.microsoft.com/office/type-over-text-in-word-for-windows-62c15c48-0936-4902-affe-4cadd71b7038
madurez: T0
