id: OFC-010
area: programas
titulo:
  sencillo: "Quiero ponerle número a las páginas en Word"
  tecnico: "Insertar números de página en Word"
explicacion:
  sencillo: "Word numera las páginas solo: elegís dónde querés el número (arriba o abajo) y aparece en todas las hojas."
  tecnico: "Insertar > Número de página; Primera página diferente en Encabezado y pie de página; Formato de los números de página > Iniciar en."
frases: ["numerar las hojas en word", "poner número de página", "que aparezca el número abajo de cada hoja", "que la carátula no tenga número"]
pasos:
  - texto: "En la pestaña «Insertar», tocá «Número de página» y elegí dónde lo querés (arriba o abajo de la página) y el estilo."
    abrir: "https://support.microsoft.com/word/training/insert-page-numbers"
  - texto: "Si no querés número en la primera hoja (la carátula), marcá «Primera página diferente» en la pestaña de encabezado y pie de página que se abre."
  - texto: "Cuando termines, tocá «Cerrar encabezado y pie de página» o apretá Esc. Para volver a editarlo, hacé doble clic sobre el número."
fuentes:
  - https://support.microsoft.com/word/training/insert-page-numbers
madurez: T0
