id: OFC-009
area: programas
titulo:
  sencillo: "La planilla de Excel sale cortada en varias hojas al imprimir"
  tecnico: "Ajustar la hoja a una página al imprimir en Excel"
explicacion:
  sencillo: "Cuando la planilla es más ancha que la hoja, Excel la parte en varios papeles. Se le puede pedir que la achique para que entre en una sola página (la letra sale más chica)."
  tecnico: "Archivo > Imprimir > escalado «Ajustar hoja en una página», o Ajustar área de impresión con Ancho y Alto en 1 página; orientación horizontal."
frases: ["excel me imprime en varias hojas", "la planilla sale cortada al imprimir", "que la tabla entre en una sola hoja", "se imprimen columnas sueltas en otra página"]
pasos:
  - texto: "Tocá «Archivo» > «Imprimir». Abajo de todo, en la opción de escala (normalmente dice «Sin escalado»), elegí «Ajustar hoja en una página»."
    abrir: "https://support.microsoft.com/excel/scale-a-worksheet"
  - texto: "Si queda muy chiquito, probá poner la hoja acostada: en la pestaña de diseño de página, «Orientación» > «Horizontal»."
  - texto: "Para volver a como estaba, en esa misma lista de escala elegí «Sin escalado»."
fuentes:
  - https://support.microsoft.com/excel/scale-a-worksheet
madurez: T0
