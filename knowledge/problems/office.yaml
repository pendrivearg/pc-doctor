id: OFC-018
area: programas
titulo:
  sencillo: "Word, Excel o PowerPoint andan mal y quiero repararlos"
  tecnico: "Reparar Microsoft 365 / Office desde Aplicaciones instaladas"
explicacion:
  sencillo: "Si los programas de Office se cierran solos, dan errores raros o no arrancan bien, Windows trae una opción para reparar los archivos del programa."
  tecnico: "Configuración > Aplicaciones > Aplicaciones instaladas > Microsoft 365/Office > Modificar > Reparación rápida o Reparación en línea (Hacer clic para ejecutar)."
frases: ["reparar el office", "el excel tira errores raros", "word anda mal desde hace días", "arreglar los programas de office"]
pasos:
  - texto: "Guardá y cerrá todos los documentos de Office. Si tenés documentos importantes, conviene tener una copia antes de empezar."
  - texto: "Abrí Aplicaciones instaladas, buscá «Microsoft 365» u «Office», tocá los tres puntitos > «Modificar» y aceptá el permiso de Windows."
    abrir: "ms-settings:appsfeatures"
  - texto: "Elegí «Reparación rápida» (más corta) o «Reparación en línea» (la más completa, necesita Internet y tarda más) y seguí las instrucciones. Si con la rápida no se arregla, hacé la en línea. Puede que haya que reiniciar la compu."
    abrir: "https://support.microsoft.com/office/lifecycle/repair-an-office-application"
fuentes:
  - https://support.microsoft.com/office/lifecycle/repair-an-office-application
madurez: T0
