id: OFC-011
area: programas
titulo:
  sencillo: "Quiero cambiar los márgenes de la hoja en Word"
  tecnico: "Cambiar los márgenes en Word"
explicacion:
  sencillo: "Los márgenes son el espacio en blanco alrededor del texto. Se pueden achicar para que entre más, o agrandar si te lo piden así en un trabajo."
  tecnico: "Disposición > Márgenes: valores predefinidos o Márgenes personalizados."
frases: ["cambiar los márgenes en word", "el texto queda muy pegado al borde", "me piden margen de 3 centímetros", "achicar el espacio en blanco de los costados"]
pasos:
  - texto: "En la pestaña «Disposición», tocá «Márgenes» y elegí una de las opciones que trae ya armadas."
    abrir: "https://support.microsoft.com/word/training/change-margins"
  - texto: "Si necesitás una medida exacta, tocá «Márgenes personalizados» al final de la lista y escribí la medida de arriba, abajo, izquierda y derecha."
fuentes:
  - https://support.microsoft.com/word/training/change-margins
madurez: T0
---
id: OFC-012
area: programas
titulo:
  sencillo: "Quiero poner una foto en un documento de Word"
  tecnico: "Insertar imágenes desde el equipo en Word"
explicacion:
  sencillo: "Podés agregar cualquier foto que tengas en la computadora y después agrandarla, achicarla o moverla."
  tecnico: "Insertar > Imágenes > Este dispositivo; controladores de esquina para el tamaño; ajuste de texto distinto de En línea con el texto para moverla."
frases: ["poner una foto en word", "agregar una imagen al documento", "insertar una foto en el texto", "no puedo mover la foto en word"]
pasos:
  - texto: "Hacé clic donde querés la foto. En la pestaña «Insertar», tocá «Imágenes» > «Este dispositivo», buscá la foto y tocá «Insertar»."
    abrir: "https://support.microsoft.com/word/training/insert-pictures"
  - texto: "Para cambiarle el tamaño, tocá la foto y arrastrá uno de los circulitos de las esquinas."
  - texto: "Si no la podés mover, tocá la foto y en las opciones de ajuste de texto elegí cualquiera que no sea «En línea con el texto». Después arrastrala a donde quieras."
fuentes:
  - https://support.microsoft.com/word/training/insert-pictures
madurez: T0
