id: OFC-025
area: programas
titulo:
  sencillo: "Quiero mostrar mi presentación de PowerPoint en pantalla completa"
  tecnico: "Iniciar la presentación con diapositivas y usar la Vista Moderador"
explicacion:
  sencillo: "Para presentar, PowerPoint muestra las diapositivas ocupando toda la pantalla. Si conectás un proyector o un televisor, en tu compu podés ver tus notas mientras el público ve solo las diapositivas."
  tecnico: "Presentación con diapositivas > Desde el principio (F5); Vista Moderador automática con dos pantallas o Alt + F5; Configuración de pantalla para intercambiar monitores."
frases: ["poner el powerpoint en pantalla completa", "cómo empiezo la presentación", "ver mis notas mientras presento", "en el proyector se ven mis notas en vez de las diapositivas"]
pasos:
  - texto: "Apretá F5 (o en la pestaña «Presentación con diapositivas», «Desde el principio»). Para terminar, apretá Esc."
    abrir: "https://support.microsoft.com/accessibility/powerpoint/use-keyboard-shortcuts-to-deliver-powerpoint-presentations"
  - texto: "Si tenés un proyector o televisor conectado, PowerPoint arma solo la vista del moderador: en tu pantalla, tus notas; en la otra, las diapositivas. Con una sola pantalla la podés probar con Alt + F5."
    abrir: "https://support.microsoft.com/office/start-the-presentation-and-see-your-notes-in-presenter-view-4de90e28-487e-435c-9401-eb49a3801257"
  - texto: "Si quedó al revés (tus notas en el proyector), en la barra de arriba de la vista del moderador tocá «Configuración de pantalla» y elegí la opción para intercambiar la vista del moderador y la presentación."
fuentes:
  - https://support.microsoft.com/office/start-the-presentation-and-see-your-notes-in-presenter-view-4de90e28-487e-435c-9401-eb49a3801257
  - https://support.microsoft.com/accessibility/powerpoint/use-keyboard-shortcuts-to-deliver-powerpoint-presentations
madurez: T0
