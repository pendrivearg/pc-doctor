id: OFC-023
area: programas
titulo:
  sencillo: "OneNote no sincroniza mis notas"
  tecnico: "Errores de sincronización en OneNote"
explicacion:
  sencillo: "OneNote guarda las notas en Internet (OneDrive) para verlas en otros aparatos. Si no sincroniza, puede ser la conexión, la cuenta o que el espacio de OneDrive esté lleno."
  tecnico: "Sincronización manual (Mayús + F9, o Archivo > Información > Ver estado de sincronización), espacio de almacenamiento lleno, cliente desactualizado (0xE40105F9)."
frases: ["onenote no sincroniza", "las notas no aparecen en el celular", "onenote dice error de sincronización", "no se actualiza el bloc de notas"]
pasos:
  - texto: "Importante: no cierres la sesión ni desinstales OneNote para intentar arreglarlo. Microsoft avisa que eso puede hacer perder notas que todavía no se sincronizaron."
  - texto: "Revisá que haya Internet. Después hacé clic derecho en el nombre del bloc de notas > «Sincronizar» > sincronizar este bloc (o apretá Mayús + F9)."
    abrir: "https://support.microsoft.com/onenote/onenote-help-and-learning/fix-issues-when-you-can-t-sync-onenote"
  - texto: "Para ver qué falla, entrá a «Archivo» > «Información» > «Ver estado de sincronización» y tocá para sincronizar todo."
  - texto: "Si el aviso habla de falta de espacio, fijate que OneDrive no esté lleno: si lo está, escribile a PC Doctor «onedrive dice que está lleno»."
  - texto: "Actualizá Office: una versión vieja de OneNote puede dejar de sincronizar."
fuentes:
  - https://support.microsoft.com/onenote/onenote-help-and-learning/fix-issues-when-you-can-t-sync-onenote
madurez: T0
