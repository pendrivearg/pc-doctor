id: OFC-019
area: programas
titulo:
  sencillo: "Office me pide iniciar sesión y no sé con qué cuenta"
  tecnico: "Iniciar sesión en Office y ver la cuenta asociada a la licencia"
explicacion:
  sencillo: "Office queda asociado a una cuenta (un correo): tu cuenta personal de Microsoft o la del trabajo o la escuela. Si te pide iniciar sesión, entrá con esa cuenta. PC Doctor nunca te va a pedir la contraseña: la escribís vos en la ventana de Microsoft."
  tecnico: "Archivo > Cuenta > Iniciar sesión; Información de producto muestra la cuenta a la que está asignada la licencia; si se inició con otra cuenta, cerrar sesión y entrar con la correcta."
frases: ["office me pide que inicie sesión", "con qué mail entro al word", "word me pide una cuenta", "no sé con qué correo activé el office"]
pasos:
  - texto: "Abrí Word o Excel, tocá «Archivo» > «Cuenta». En «Información de producto» figura a qué cuenta está asignado Office."
    abrir: "https://support.microsoft.com/accounts-billing/subscriptions/i-forgot-the-account-i-use-with-microsoft-365"
  - texto: "Si en esa pantalla dice «Iniciar sesión», tocalo y escribí el correo de esa cuenta y tu contraseña en la ventana de Microsoft."
    abrir: "https://support.microsoft.com/accounts-billing/subscriptions/sign-in-to-microsoft-365"
  - texto: "Si entraste con una cuenta equivocada, cerrá la sesión en esa misma pantalla y volvé a entrar con la correcta."
  - texto: "Si Office dice «Producto sin licencia», escribile a PC Doctor «office dice producto sin licencia»."
fuentes:
  - https://support.microsoft.com/accounts-billing/subscriptions/sign-in-to-microsoft-365
  - https://support.microsoft.com/accounts-billing/subscriptions/i-forgot-the-account-i-use-with-microsoft-365
madurez: T0
