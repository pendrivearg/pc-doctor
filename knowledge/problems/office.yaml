id: OFC-002
area: programas
titulo:
  sencillo: "El documento se abre pero no me deja escribir (barra amarilla «Vista protegida»)"
  tecnico: "Vista protegida: modo de solo lectura en Office"
explicacion:
  sencillo: "Cuando un archivo viene de Internet o de un correo, Office lo abre «en modo lectura» para cuidarte de virus. Si confiás en quien te lo mandó, lo podés habilitar para editarlo."
  tecnico: "Vista protegida: apertura de solo lectura para archivos de Internet, adjuntos, ubicaciones no seguras o con error de validación; se sale con Habilitar edición."
frases: ["el word no me deja escribir", "me dice vista protegida", "el archivo que me mandaron se abre solo para leer", "aparece una barra amarilla arriba del documento"]
pasos:
  - texto: "Antes que nada, pensá de dónde vino el archivo. Si no lo esperabas o te parece raro, no lo habilites: cerralo y borralo."
  - texto: "Si confiás en quien te lo mandó, tocá «Habilitar edición» en la barra amarilla de arriba. Ya vas a poder escribir."
    abrir: "https://support.microsoft.com/office/collab-files/what-is-protected-view"
  - texto: "Si la barra es roja o dice que editarlo puede dañar tu equipo, hacelo solo si estás seguro del origen. Si no te deja salir de ninguna forma, puede ser una regla de la empresa o la escuela: consultá con el encargado de sistemas."
fuentes:
  - https://support.microsoft.com/office/collab-files/what-is-protected-view
madurez: T0
