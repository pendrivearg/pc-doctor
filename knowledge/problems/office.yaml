id: OFC-003
area: programas
titulo:
  sencillo: "En Excel aparecen numerales (#####) en vez de números"
  tecnico: "Error ##### en celdas de Excel"
explicacion:
  sencillo: "Los ##### casi siempre quieren decir que el número no entra en la columna. El dato está bien: solo hay que hacer la columna más ancha o achicar cómo se muestra."
  tecnico: "##### aparece cuando el ancho de columna no alcanza para el valor o cuando una fecha u hora da negativa."
frases: ["en excel me salen numerales", "la celda muestra ##### en vez del número", "excel me pone todos cardinales", "no se ve el número en la planilla"]
pasos:
  - texto: "Arrastrá hacia la derecha el borde derecho de la letra de la columna (arriba de todo) hasta que aparezca el número."
    abrir: "https://support.microsoft.com/office/how-to-correct-a-error-bf801d0a-2a6e-44bd-a70e-0f780ae8f11e"
  - texto: "Si el número tiene muchos decimales, en la pestaña «Inicio» tocá el botón para disminuir decimales. Si es una fecha larga, en la lista de formato de número de «Inicio» elegí «Fecha corta»."
  - texto: "Si es una resta de fechas u horas, puede que el resultado haya dado negativo: revisá que la cuenta reste la fecha más vieja a la más nueva."
fuentes:
  - https://support.microsoft.com/office/how-to-correct-a-error-bf801d0a-2a6e-44bd-a70e-0f780ae8f11e
madurez: T0
