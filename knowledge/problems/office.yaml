id: OFC-017
area: archivos
titulo:
  sencillo: "Arriba del documento dice «Modo de compatibilidad»"
  tecnico: "Documentos .doc en modo de compatibilidad: convertir a .docx"
explicacion:
  sencillo: "Los documentos hechos con versiones viejas de Word (los que terminan en .doc) se abren en «modo de compatibilidad»: se pueden usar, pero algunas funciones nuevas quedan apagadas. Se pueden pasar al formato nuevo."
  tecnico: "Archivo > Información > Convertir (actualiza el formato y quita las opciones de compatibilidad); o Guardar como > Documento de Word (*.docx)."
frases: ["me dice modo de compatibilidad", "pasar un archivo doc a docx", "documento viejo de word no me deja usar cosas nuevas", "convertir un word viejo al formato nuevo"]
pasos:
  - texto: "Si el documento lo van a seguir usando personas con un Word muy viejo, mejor dejalo como está: el modo de compatibilidad existe para eso."
  - texto: "Para pasarlo al formato nuevo: con el documento abierto, tocá «Archivo» > «Información» > «Convertir» y aceptá. Desaparece el aviso de compatibilidad."
    abrir: "https://support.microsoft.com/word/converting-documents-to-a-newer-format"
  - texto: "Otra forma, que te deja el original intacto: «Archivo» > «Guardar como» y en el tipo de archivo elegí «Documento de Word». Revisá que el documento nuevo se vea bien."
fuentes:
  - https://support.microsoft.com/word/converting-documents-to-a-newer-format
madurez: T0
