id: OFC-024
area: archivos
titulo:
  sencillo: "Borré una página o una sección de OneNote sin querer"
  tecnico: "Recuperar notas eliminadas en OneNote (Papelera de reciclaje de blocs de notas)"
explicacion:
  sencillo: "OneNote guarda por un tiempo (hasta 60 días) las páginas y secciones que borrás, en una papelera propia. Desde ahí las podés volver a poner en su lugar."
  tecnico: "Historial > Papelera de reciclaje de blocs de notas > Mover o copiar; copias de seguridad en Archivo > Información > Abrir copias de seguridad."
frases: ["borré una nota de onenote", "desapareció una página de onenote", "recuperar una sección borrada de onenote", "dónde está la papelera de onenote"]
pasos:
  - texto: "Si recién lo borraste, apretá Ctrl + Z."
  - texto: "Si no, en la pestaña «Historial» abrí la papelera de reciclaje de blocs de notas, hacé clic derecho en la página o sección y elegí «Mover o copiar» para devolverla a un bloc."
    abrir: "https://support.microsoft.com/onenote/onenote-help-and-learning/recover-deleted-notes"
  - texto: "Si no está ahí, probá en «Archivo» > «Información» > abrir copias de seguridad."
fuentes:
  - https://support.microsoft.com/onenote/onenote-help-and-learning/recover-deleted-notes
madurez: T0
