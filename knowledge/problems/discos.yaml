id: DSK-012
area: hardware
titulo:
  sencillo: "El disco externo se desconecta solo mientras lo uso"
  tecnico: "Disco USB que se desconecta: puerto, alimentación y cable"
explicacion:
  sencillo: "Muchos discos externos necesitan más energía de la que dan algunos puertos USB, sobre todo los de alargues o hubs. También fallan seguido los cables. Si el disco se corta, tomalo como aviso para tener tus archivos copiados en otro lado."
  tecnico: "Algunos puertos (en especial hubs) no entregan suficiente energía a discos USB; probar puerto directo, alimentación externa, otro cable y revisar el Administrador de dispositivos."
frases: ["el disco externo se desconecta solo", "se me corta el disco usb cuando copio", "el disco externo aparece y desaparece", "copiando archivos se desconecta el disco"]
pasos:
  - texto: "Conectá el disco directo en la computadora, sin hub ni alargue. En una PC de escritorio, probá los puertos de atrás; probá también otros puertos."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management"
  - texto: "Si el disco tiene fuente de energía propia (o un cable con dos puntas USB), conectalo todo."
  - texto: "Probá con otro cable: los cables se gastan y fallan seguido."
  - texto: "Abrí el Administrador de dispositivos (clic derecho en el botón Inicio) y fijate si el disco o algo USB tiene un signo de advertencia. Si lo tiene, escribile a PC Doctor con el código que aparezca."
  - texto: "Probalo en otra computadora. Si ahí también se corta, el disco puede estar fallando: copiá tus archivos a otro lado cuanto antes."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management
madurez: T0
