id: DSK-013
area: hardware
titulo:
  sencillo: "Quiero juntar varios discos en uno, con copia por si se rompe uno (Espacios de almacenamiento)"
  tecnico: "Espacios de almacenamiento: grupo de almacenamiento con resistencia (espejo o paridad)"
explicacion:
  sencillo: "«Espacios de almacenamiento» junta dos o más discos (además del de Windows) en un solo grupo. Con la opción de espejo, Windows guarda tus archivos dos veces, en discos distintos: si se rompe uno, no perdés nada. Después podés sumar más discos."
  tecnico: "Grupo de almacenamiento con espacios virtuales; resistencia simple (sin protección), espejo doble (tolera 1 falla), espejo triple (2 fallas, 5 discos) o paridad. Requiere al menos dos discos además del de Windows; algunas carcasas o hubs USB ocultan los discos."
frases: ["juntar dos discos en uno solo", "quiero que mis archivos estén en dos discos a la vez", "hacer un espejo de discos en windows", "para qué sirven los espacios de almacenamiento"]
pasos:
  - texto: "Necesitás al menos dos discos además del de Windows (internos o externos). ADVERTENCIA: el espacio nuevo se formatea. Usá discos vacíos y, si tienen algo, copialo antes a otro lado."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/storage-spaces-in-windows"
  - texto: "Conectá los discos. Tocá la lupa de la barra de tareas, escribí «Espacios de almacenamiento» y abrilo. Elegí crear un grupo nuevo, marcá los discos que querés sumar y confirmá."
  - texto: "Ponele nombre al espacio y elegí la resistencia: el espejo doble (el que viene marcado) guarda dos copias y aguanta que se rompa un disco. La opción simple no protege nada."
  - texto: "Elegí el tamaño, la letra y el sistema de archivos, y tocá el botón para formatear. Vas a ver una unidad nueva en el Explorador."
  - texto: "Si un disco USB no aparece para sumarlo, puede ser por la carcasa o el hub: Windows solo acepta ciertos discos. Probalo conectado directo."
derivar: "El espejo protege si se rompe un disco, pero no si borrás algo sin querer: seguí haciendo copias de seguridad."
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/storage-spaces-in-windows
madurez: T0
