id: DSK-007
area: archivos
titulo:
  sencillo: "Quiero achicar una partición para hacer otra (reducir volumen)"
  tecnico: "Reducir un volumen básico NTFS en Administración de discos"
explicacion:
  sencillo: "Windows puede achicar una parte del disco y dejar espacio libre para crear otra (por ejemplo, separar tus documentos de Windows). Los archivos comunes se acomodan solos, pero algunos archivos del sistema no se mueven y limitan cuánto se puede achicar."
  tecnico: "Reducir volumen libera espacio no asignado al final del volumen (NTFS o sin sistema de archivos). Archivos inamovibles (archivo de paginación, instantáneas) limitan la reducción. En particiones RAW con datos puede destruirlos."
frases: ["quiero dividir el disco en dos", "achicar la partición c para hacer otra", "cómo reduzco un volumen", "hacer una partición nueva sin formatear"]
pasos:
  - texto: "ADVERTENCIA: cambiar el tamaño de las particiones siempre tiene algún riesgo. Antes, copiá tus archivos importantes a un disco externo o a la nube."
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio). Clic derecho sobre el volumen que querés achicar > «Reducir volumen»."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/shrink-a-basic-volume"
  - texto: "Windows calcula cuánto se puede achicar. Escribí cuánto espacio querés liberar (en MB) sin pasarte de lo que propone y tocá «Reducir»."
  - texto: "Va a aparecer una franja «No asignado». Para usarla, creá ahí un volumen nuevo: escribile a PC Doctor «quiero crear un volumen en el disco nuevo»."
  - texto: "No achiques ni toques las particiones sin letra (sistema EFI o recuperación): son de Windows."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/overview-of-disk-management"
fuentes:
  - https://learn.microsoft.com/windows-server/storage/disk-management/shrink-a-basic-volume
  - https://learn.microsoft.com/windows-server/storage/disk-management/overview-of-disk-management
madurez: T0
