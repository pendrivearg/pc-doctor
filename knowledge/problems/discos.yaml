id: DSK-015
area: archivos
titulo:
  sencillo: "Me avisa que el disco D: (u otro que no es C:) está casi lleno"
  tecnico: "Almacenamiento usado en otras unidades: uso por tipo de archivo en discos secundarios"
explicacion:
  sencillo: "Windows puede mostrarte qué ocupa lugar en cualquier disco, no solo en C:. Así ves si el disco D: o el externo está lleno de fotos, videos u otras cosas, y decidís qué pasar a otro lado."
  tecnico: "Sistema > Almacenamiento > Configuración avanzada de almacenamiento > Almacenamiento usado en otras unidades: uso desglosado por tipo de archivo en cada unidad conectada."
frases: ["el disco d está lleno", "me dice poco espacio en el disco d", "qué me ocupa el disco d", "se llenó el segundo disco"]
pasos:
  - texto: "Abrí Almacenamiento en Configuración y entrá en «Configuración avanzada de almacenamiento» > «Almacenamiento usado en otras unidades»."
    abrir: "ms-settings:storagesense"
  - texto: "Tocá el disco que se llenó: vas a ver cuánto ocupan los documentos, las fotos, los videos y lo demás."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows"
  - texto: "Pasá a un disco externo lo que no uses seguido: seleccioná los archivos, «Cortar», y «Pegar» en el disco externo. Antes de borrar algo, asegurate de tenerlo copiado."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/free-up-drive-space-in-windows"
  - texto: "Si lo que se llenó es una partición de recuperación, no le borres nada: escribile a PC Doctor «qué es la partición de recuperación»."
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows
  - https://support.microsoft.com/windows/experience/storage-filemanagement/free-up-drive-space-in-windows
