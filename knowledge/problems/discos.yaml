id: DSK-022
area: hardware
titulo:
  sencillo: "¿Qué es un «disco dinámico»? ¿Lo convierto?"
  tecnico: "Discos dinámicos: obsoletos; conversión básica/dinámica con pérdida de datos"
explicacion:
  sencillo: "Un disco dinámico es una forma vieja de organizar discos para unir o duplicar varios. Microsoft ya no la recomienda: para unir discos está «Espacios de almacenamiento». Pasar un disco de básico a dinámico o al revés exige borrar todos sus volúmenes, es decir, todos los archivos."
  tecnico: "Los discos dinámicos (volúmenes distribuidos, seccionados y reflejados) están en desuso; se recomiendan discos básicos o Espacios de almacenamiento. La conversión en Administración de discos requiere eliminar todos los volúmenes."
frases: ["qué es un disco dinámico", "me ofrece convertir a disco dinámico", "conviene pasar el disco a dinámico", "cómo vuelvo un disco dinámico a básico"]
pasos:
  - texto: "Si Windows o un programa te ofrece «Convertir en disco dinámico», lo más seguro es decir que no: Microsoft lo considera obsoleto y no lo recomienda para equipos nuevos."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/change-disk-type-dynamic-basic"
  - texto: "ADVERTENCIA: para volver un disco dinámico a básico (o al revés) hay que eliminar todos sus volúmenes, y eso BORRA todos los archivos. Antes, copiá todo a otro disco o a la nube."
  - texto: "Si lo que querés es juntar varios discos en uno, mirá la ficha de PC Doctor sobre «Espacios de almacenamiento»."
derivar: "Si tu disco ya es dinámico y tiene datos importantes, consultá a un técnico antes de convertirlo."
fuentes:
  - https://learn.microsoft.com/windows-server/storage/disk-management/change-disk-type-dynamic-basic
madurez: T0
---
id: DSK-023
area: hardware
titulo:
  sencillo: "Quiero saber si mi disco es GPT o MBR"
  tecnico: "Ver el estilo de partición de un disco (GPT o MBR)"
explicacion:
  sencillo: "GPT y MBR son dos maneras de organizar un disco. GPT es la moderna: acepta discos de más de 2 TB y más de cuatro particiones. MBR es la vieja, para equipos antiguos. Fijarte cuál tenés no cambia nada."
  tecnico: "MBR: esquema BIOS heredado, hasta cuatro particiones primarias y 2 TB. GPT: UEFI, más de cuatro particiones y discos de más de 2 TB. Se ve en Propiedades del disco > Volúmenes."
frases: ["mi disco es gpt o mbr", "cómo sé el estilo de partición del disco", "dónde veo si el disco está en gpt", "qué diferencia hay entre gpt y mbr"]
pasos:
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio)."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/change-disk-partition-scheme"
  - texto: "Abajo, hacé clic derecho sobre el recuadro del disco (donde dice «Disco 0», «Disco 1»...) > «Propiedades» > pestaña «Volúmenes». Ahí figura el estilo de partición: GPT o MBR."
  - texto: "Solo mirar no cambia nada. ADVERTENCIA: convertir de uno a otro con Administración de discos exige borrar todos los volúmenes del disco (todos los archivos). No lo hagas sin una copia de seguridad."
fuentes:
  - https://learn.microsoft.com/windows-server/storage/disk-management/change-disk-partition-scheme
  - https://learn.microsoft.com/windows-server/storage/disk-management/initialize-new-disks
madurez: T0
---
id: DSK-024
area: hardware
titulo:
  sencillo: "Compré un disco de 3 o 4 TB y Windows solo me deja usar 2 TB"
  tecnico: "Disco de más de 2 TB inicializado como MBR: requiere GPT"
explicacion:
  sencillo: "Si un disco grande se preparó con el estilo viejo (MBR), Windows solo puede usar los primeros 2 TB y el resto queda como espacio que no se puede usar. Hay que pasarlo a GPT, y eso implica borrar todo lo que tiene."
  tecnico: "MBR direcciona hasta ~2,2 TB (sectores de 512 bytes). En un disco de más capacidad iniciado como MBR, el resto queda no direccionable; hay que convertirlo a GPT (Convertir en disco GPT), lo que requiere eliminar los volúmenes."
frases: ["el disco de 4 tb me muestra 2 tb", "me falta espacio en el disco nuevo grande", "compré un disco de 3 teras y aparece más chico", "hay espacio no asignado que no puedo usar en el disco grande"]
pasos:
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio). Si el disco muestra dos franjas «No asignado» o una parte que no podés usar, y es MBR, esa es la causa."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/support-for-hard-disks-exceeding-2-tb"
  - texto: "ADVERTENCIA: para pasarlo a GPT hay que eliminar todos los volúmenes del disco, y eso BORRA todo. Si ya le copiaste archivos, pasalos antes a otro lado."
  - texto: "Con el disco vacío: clic derecho sobre cada volumen > «Eliminar volumen» > «Sí». Después, clic derecho sobre el recuadro del disco > «Convertir en disco GPT»."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/change-disk-partition-scheme"
  - texto: "Ahora todo el espacio aparece como «No asignado»: creá un volumen nuevo. Escribile a PC Doctor «quiero crear un volumen en el disco nuevo»."
derivar: "Si es el disco donde está Windows, no lo hagas así: consultá a un técnico."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/support-for-hard-disks-exceeding-2-tb
  - https://learn.microsoft.com/windows-server/storage/disk-management/change-disk-partition-scheme
madurez: T0
