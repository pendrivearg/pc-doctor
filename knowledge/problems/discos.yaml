id: DSK-011
area: archivos
titulo:
  sencillo: "Enchufo el disco externo y me dice que lo tengo que formatear"
  tecnico: "Volumen RAW o ilegible: no formatear si hay datos que recuperar"
explicacion:
  sencillo: "Ese aviso aparece cuando Windows no puede leer cómo están ordenados los archivos del disco. NO aceptes formatear si el disco tiene fotos o documentos: formatear borra todo. Muchas veces es el cable, el puerto o el disco que está fallando."
  tecnico: "Partición sin sistema de archivos reconocible (RAW) o firma dañada. Formatear o inicializar borra los datos; primero descartar cable, puerto, alimentación y probar en otra PC."
frases: ["el disco externo me pide formatear", "dice que hay que formatear el disco antes de usarlo", "el pendrive me pide formatear y tiene mis fotos", "el disco aparece como raw"]
pasos:
  - texto: "Tocá «Cancelar» en el aviso. NO formatees si el disco tiene archivos que te importan."
  - texto: "Desenchufalo, conectalo en otro puerto USB directo en la compu (sin alargue ni hub) y, si podés, con otro cable. Si el disco tiene fuente propia, enchufala."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management"
  - texto: "Mirá en «Administración de discos» (clic derecho en el botón Inicio) cómo aparece: si dice RAW o «No asignado», no formatees ni crees nada encima si querés recuperar lo que tenía."
  - texto: "Probalo en otra computadora. Si ahí tampoco anda, el disco probablemente esté fallando."
derivar: "Si los archivos son importantes, no sigas probando: un técnico o un servicio de recuperación de datos puede intentar rescatarlos antes de formatear."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management
madurez: T0
