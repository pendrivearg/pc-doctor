id: DSK-017
area: archivos
titulo:
  sencillo: "¿Qué es lo que me ocupa el disco: fotos, programas o Windows?"
  tecnico: "Uso del almacenamiento por categorías (Sistema > Almacenamiento)"
explicacion:
  sencillo: "La pantalla de Almacenamiento muestra, por categorías, cuánto ocupan las aplicaciones, los archivos temporales, Windows («Sistema y reservado») y tus cosas. Así sabés por dónde empezar a liberar lugar."
  tecnico: "Sistema > Almacenamiento: uso por categorías (Aplicaciones instaladas, Archivos temporales, Sistema y reservado, etc.); «Mostrar más categorías» despliega el resto, incluido el almacenamiento reservado del sistema."
frases: ["en qué se me va el espacio del disco", "qué categoría ocupa más en el disco", "qué es sistema y reservado", "ver cuánto ocupan los programas y cuánto las fotos"]
pasos:
  - texto: "Abrí Almacenamiento en Configuración. Vas a ver el disco C: con barras por categoría."
    abrir: "ms-settings:storagesense"
  - texto: "Tocá «Mostrar más categorías» para verlas todas (aplicaciones, archivos temporales, «Sistema y reservado» y las demás). Tocá una categoría para ver el detalle."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows"
  - texto: "«Sistema y reservado» es de Windows: incluye lugar apartado para actualizaciones. No es algo para borrar a mano."
  - texto: "Para liberar espacio de forma segura, escribile a PC Doctor «quiero encontrar los archivos grandes» o «el disco está casi lleno»."
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows
madurez: T0
