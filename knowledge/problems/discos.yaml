id: DSK-003
area: hardware
titulo:
  sencillo: "¿Mi compu tiene disco SSD o disco rígido (HDD)?"
  tecnico: "Ver el tipo de disco (SSD o HDD) en Discos y volúmenes"
explicacion:
  sencillo: "Hay dos tipos de disco: los rígidos de siempre (HDD) y los SSD, que son mucho más rápidos. Windows te dice qué tipo es cada disco de tu compu."
  tecnico: "Configuración > Sistema > Almacenamiento > Configuración avanzada de almacenamiento > Discos y volúmenes muestra el tipo de cada disco (SSD o HDD), su capacidad y su uso."
frases: ["mi disco es ssd o hdd", "cómo sé si tengo disco sólido", "qué tipo de disco tiene mi notebook", "tengo disco rígido o ssd"]
pasos:
  - texto: "Abrí «Discos y volúmenes» en Configuración."
    abrir: "ms-settings:disksandvolumes"
  - texto: "En cada disco figura el tipo (SSD o HDD), junto con su tamaño y cuánto está ocupado."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows"
  - texto: "Si Windows está en un HDD y la compu anda lenta, escribile a PC Doctor «conviene poner un ssd»."
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows
madurez: T0
