id: DSK-004
area: hardware
titulo:
  sencillo: "Puse un disco nuevo y no aparece en el Explorador"
  tecnico: "Disco nuevo «No inicializado»: inicializarlo en Administración de discos"
explicacion:
  sencillo: "Un disco recién comprado viene «en blanco»: Windows lo detecta, pero hasta que no lo prepares (inicializar y crear un volumen) no aparece en el Explorador. OJO: inicializar borra todo lo que tenga el disco, así que es solo para discos nuevos y vacíos."
  tecnico: "Disco sin firma válida: figura como «No inicializado» o «Desconocido» en Administración de discos. Inicializar disco (GPT por defecto) y luego crear un volumen simple. Inicializar borra todos los datos."
frases: ["puse un disco nuevo y no lo veo", "instalé un ssd nuevo y no aparece en este equipo", "el disco nuevo no figura en el explorador", "compré un disco y la compu no lo muestra", "dice disco no inicializado"]
pasos:
  - texto: "Hacé clic derecho en el botón Inicio y elegí «Administración de discos». Buscá el disco nuevo por su tamaño: suele decir «No inicializado» o «Desconocido». Si dice «Sin conexión», hacé clic derecho sobre él y elegí «En línea»."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows"
  - texto: "ADVERTENCIA antes de seguir: inicializar BORRA todo lo que tenga el disco. Hacelo solo si el disco es nuevo y está vacío. Si es un disco que ya usabas (por ejemplo, de otra compu) y tiene archivos, NO lo inicialices: primero hacé una copia de seguridad o escribile a PC Doctor «el disco aparece como no inicializado y tiene mis archivos»."
  - texto: "Si es nuevo: clic derecho sobre el disco (a la izquierda, donde dice «Disco 1» o similar) > «Inicializar disco». Revisá que esté marcado el disco correcto, dejá la opción GPT que viene elegida y tocá «Aceptar»."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/initialize-new-disks"
  - texto: "Todavía falta un paso para que aparezca en el Explorador: crear un volumen en el espacio «No asignado». Escribile a PC Doctor «quiero crear un volumen en el disco nuevo»."
derivar: "Si el disco no aparece ni siquiera en Administración de discos, revisá con un técnico que esté bien conectado adentro de la PC."
fuentes:
  - https://learn.microsoft.com/windows-server/storage/disk-management/initialize-new-disks
  - https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows
  - https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management
madurez: T0
