id: DSK-019
area: hardware
titulo:
  sencillo: "¿Mi disco está cifrado? ¿Qué es el «cifrado de dispositivo»?"
  tecnico: "Cifrado de dispositivo (BitLocker automático): qué es y cómo ver si está activado"
explicacion:
  sencillo: "El cifrado de dispositivo protege tu disco: si alguien te roba la compu y saca el disco, no puede leer tus archivos. Windows lo activa solo cuando configurás la compu con una cuenta de Microsoft, y guarda la clave de recuperación en esa cuenta."
  tecnico: "Cifrado de dispositivo activa BitLocker en la unidad del sistema y unidades fijas; se habilita al configurar con cuenta de Microsoft o profesional/educativa (la clave de recuperación queda en la cuenta), no con cuenta local. BitLocker completo: ediciones Pro, Enterprise y Education."
frases: ["cómo sé si mi disco está cifrado", "qué es el cifrado de dispositivo", "tengo bitlocker activado", "mi compu tiene el disco encriptado"]
pasos:
  - texto: "Abrí «Cifrado de dispositivo» en Configuración (está dentro de Privacidad y seguridad). Si el interruptor está activado, tu disco está cifrado."
    abrir: "ms-settings:deviceencryption"
  - texto: "Si esa opción no aparece, puede ser que tu compu no lo admita o que estés en una cuenta que no es de administrador."
    abrir: "https://support.microsoft.com/windows/security/encryption/device-encryption-in-windows"
  - texto: "Si está activado, asegurate de saber dónde está la clave de recuperación (queda en tu cuenta de Microsoft): escribile a PC Doctor «dónde está mi clave de bitlocker». No se la pases a nadie que te la pida por teléfono o mensaje."
fuentes:
  - https://support.microsoft.com/windows/security/encryption/device-encryption-in-windows
madurez: T0
