id: DSK-008
area: archivos
titulo:
  sencillo: "Quiero unir el disco C: con el D: en uno solo"
  tecnico: "Eliminar el volumen intermedio para extender C: (con pérdida de datos de ese volumen)"
explicacion:
  sencillo: "Windows solo puede agrandar C: con espacio libre que esté pegado. Si D: está en el mismo disco justo después de C:, la única forma con las herramientas de Windows es BORRAR D: entero y sumar ese espacio a C:. Todo lo que haya en D: se pierde, así que primero hay que copiarlo a otro lado."
  tecnico: "Extender volumen exige espacio no asignado contiguo. Con un volumen en medio, las opciones son eliminar ese volumen (destruye sus datos), usar una herramienta de terceros que mueva particiones, o crear un volumen separado."
frases: ["juntar la partición c y la d", "unir los dos discos en uno", "pasar el espacio de d a c", "borrar la partición d para agrandar c"]
pasos:
  - texto: "ADVERTENCIA: este procedimiento BORRA todo lo que hay en D:. Primero copiá todo el contenido de D: a un disco externo o a la nube y comprobá que la copia se abra bien."
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio). Confirmá que D: está en el mismo disco y justo a la derecha de C:. Si entre C: y D: hay una partición de recuperación, no sigas: esa no se borra."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/extend-a-basic-volume"
  - texto: "Con la copia hecha: clic derecho sobre D: > «Eliminar volumen» > «Sí». Queda una franja «No asignado»."
  - texto: "Clic derecho sobre C: > «Extender volumen» > «Siguiente», dejá el máximo y tocá «Finalizar». Después volvé a copiar tus archivos a C:."
derivar: "Si no estás seguro de qué partición es cuál, no borres nada: pedile ayuda a un técnico."
fuentes:
  - https://learn.microsoft.com/windows-server/storage/disk-management/extend-a-basic-volume
  - https://learn.microsoft.com/windows-server/storage/disk-management/overview-of-disk-management
madurez: T0
