id: DSK-006
area: archivos
titulo:
  sencillo: "Quiero agrandar el disco C: (o «Extender volumen» aparece en gris)"
  tecnico: "Extender un volumen básico con espacio no asignado contiguo"
explicacion:
  sencillo: "A una parte del disco se le puede sumar espacio libre («No asignado») que esté justo a su derecha en el mismo disco. Si el espacio libre está en otro lado, o hay otra partición en el medio, Windows no deja extender y la opción aparece en gris."
  tecnico: "Extender volumen requiere espacio no asignado inmediatamente después del volumen, en el mismo disco, y sistema de archivos NTFS o ReFS; en discos de más de 2 TB, estilo GPT."
frases: ["quiero agrandar el disco c", "extender volumen está en gris", "cómo le sumo espacio a la partición c", "no me deja extender el volumen"]
pasos:
  - texto: "Antes de tocar particiones, hacé una copia de seguridad de tus archivos importantes en un disco externo o en la nube."
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio) y fijate si hay una franja negra «No asignado» pegada a la derecha de la parte que querés agrandar."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/extend-a-basic-volume"
  - texto: "Si está pegada: clic derecho sobre el volumen > «Extender volumen» > «Siguiente». Dejá la cantidad máxima que propone, tocá «Siguiente» y «Finalizar»."
  - texto: "Si la opción está en gris es porque el espacio libre no está pegado, está en otro disco o el volumen no es NTFS. No borres particiones para hacer lugar (y nunca la de recuperación): escribile a PC Doctor «quiero unir el disco C: con el D:»."
fuentes:
  - https://learn.microsoft.com/windows-server/storage/disk-management/extend-a-basic-volume
  - https://learn.microsoft.com/windows-server/storage/disk-management/overview-of-disk-management
madurez: T0
