id: DSK-020
area: archivos
titulo:
  sencillo: "El disco D: (o una partición) desapareció del Explorador"
  tecnico: "Volumen sano sin letra de unidad: agregar una letra"
explicacion:
  sencillo: "A veces un disco o una partición sigue estando, con tus archivos, pero se quedó sin letra (D:, E:...). Sin letra, el Explorador no lo muestra. Ponerle una letra no borra nada."
  tecnico: "Volumen en línea y en buen estado con sistema de archivos pero sin letra asignada: Administración de discos > Cambiar la letra y rutas de acceso de unidad > Agregar."
frases: ["desapareció el disco d", "no me aparece más la partición d", "el disco d se fue del explorador", "se perdió la letra del disco"]
pasos:
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio). Buscá el volumen que falta: se reconoce por el tamaño y porque no tiene letra al lado del nombre."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management"
  - texto: "Si aparece como en buen estado y con formato (NTFS, exFAT o FAT32), hacé clic derecho > «Cambiar la letra y rutas de acceso de unidad...» > «Agregar». Elegí una letra libre, tocá «Aceptar» y confirmá."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/change-a-drive-letter"
  - texto: "No le pongas letra a las particiones de Windows sin nombre (sistema EFI o recuperación): esas no tienen que verse."
  - texto: "Si en lugar de formato dice RAW o «No asignado», no formatees ni crees nada: escribile a PC Doctor «el disco externo me pide formatear»."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management
  - https://learn.microsoft.com/windows-server/storage/disk-management/change-a-drive-letter
madurez: T0
