id: DSK-009
area: archivos
titulo:
  sencillo: "¿En qué formato pongo el disco externo: NTFS, exFAT o FAT32?"
  tecnico: "Elegir sistema de archivos para un disco externo o pendrive"
explicacion:
  sencillo: "El formato es la forma en que el disco ordena los archivos. FAT32 es el más viejo y no acepta archivos de más de 4 GB. exFAT es su sucesor y acepta archivos enormes. NTFS es el de Windows: además permite permisos, cifrado y compresión. Cambiar el formato borra todo lo que hay en el disco."
  tecnico: "FAT32: archivo máximo 4 GiB. exFAT: sucesor de FAT32, archivos de hasta 2^64-1 bytes, sin permisos ni registro en diario. NTFS: permisos (ACL), registro en diario de metadatos, cifrado y compresión."
frases: ["qué formato le pongo al disco externo", "ntfs o exfat cuál conviene", "en qué formato formateo el pendrive", "diferencia entre fat32 y ntfs"]
pasos:
  - texto: "Si el disco lo vas a usar solo en computadoras con Windows, NTFS es lo más completo. Si vas a pasar archivos grandes (películas, copias de seguridad) entre distintos aparatos, exFAT no tiene el límite de 4 GB por archivo."
    abrir: "https://learn.microsoft.com/windows/win32/fileio/filesystem-functionality-comparison"
  - texto: "Usá FAT32 solo si un aparato (una tele, un equipo de música, una cámara) te lo pide en su manual: no acepta archivos de más de 4 GB."
  - texto: "ADVERTENCIA: para cambiar el formato hay que formatear, y eso BORRA todo el contenido. Copiá antes lo que quieras conservar. Para hacerlo, escribile a PC Doctor «quiero formatear un pendrive»."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows"
fuentes:
  - https://learn.microsoft.com/windows/win32/fileio/filesystem-functionality-comparison
  - https://learn.microsoft.com/windows/win32/fileio/exfat-specification
  - https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows
madurez: T0
---
id: DSK-010
area: archivos
titulo:
  sencillo: "No puedo copiar un archivo grande al pendrive aunque tiene lugar"
  tecnico: "Límite de 4 GiB por archivo en volúmenes FAT32"
explicacion:
  sencillo: "Si el pendrive o el disco está en formato FAT32, no acepta archivos de más de 4 GB (una película o un respaldo grande), aunque tenga mucho espacio libre. Hay que pasarlo a exFAT o NTFS, y eso implica formatearlo."
  tecnico: "FAT32 admite archivos de hasta 4 GiB; exFAT y NTFS admiten hasta 2^64-1 bytes. Cambiar el sistema de archivos requiere formatear el volumen."
frases: ["el archivo es demasiado grande para el pendrive", "no me deja copiar una película al pendrive", "tengo lugar en el pendrive pero no copia el archivo", "no puedo pasar un archivo de más de 4 gb"]
pasos:
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio) y mirá el pendrive: al lado del tamaño dice su formato. Si dice FAT32, esa es la causa."
    abrir: "https://learn.microsoft.com/windows/win32/fileio/filesystem-functionality-comparison"
  - texto: "ADVERTENCIA: para cambiarlo a exFAT o NTFS hay que formatearlo, y eso BORRA todo lo que tiene. Primero copiá a la compu lo que haya en el pendrive."
  - texto: "Con la copia hecha, formatealo eligiendo exFAT (o NTFS) como sistema de archivos. Fijate bien de elegir el pendrive y no otro disco. Si no sabés cómo, escribile a PC Doctor «quiero formatear un pendrive»."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows"
  - texto: "Después volvé a copiar tus archivos y el archivo grande."
fuentes:
  - https://learn.microsoft.com/windows/win32/fileio/filesystem-functionality-comparison
  - https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows
madurez: T0
