id: DSK-014
area: archivos
titulo:
  sencillo: "Quiero revisar si un disco o pendrive tiene errores"
  tecnico: "Comprobación de errores (chkdsk) desde Propiedades > Herramientas"
explicacion:
  sencillo: "Windows trae una herramienta que revisa el disco y arregla errores en la forma en que están guardados los archivos. Se usa desde las propiedades del disco, sin escribir comandos. Si el disco está en uso, puede pedir hacerlo al reiniciar."
  tecnico: "Propiedades de la unidad > Herramientas > Comprobación de errores > Comprobar ejecuta chkdsk sobre el volumen. Para reparar, el volumen debe bloquearse; en el volumen del sistema se programa para el próximo reinicio. No conviene interrumpirlo."
frases: ["cómo reviso el disco por errores", "comprobar errores del pendrive", "pasarle el chkdsk al disco", "quiero escanear el disco externo"]
pasos:
  - texto: "Si el disco hace ruidos raros o Windows ya te avisó que está fallando, primero copiá tus archivos importantes a otro lado, por las dudas."
  - texto: "Abrí el Explorador (Windows + E) y tocá «Este equipo». Hacé clic derecho sobre el disco o pendrive que querés revisar > «Propiedades»."
    abrir: "https://support.microsoft.com/en-us/surface/performance/windows-doesn-t-respond-or-stops-working-on-surface"
  - texto: "Entrá en la pestaña «Herramientas» y, en «Comprobación de errores», tocá «Comprobar». Seguí lo que indica la pantalla."
  - texto: "Si es el disco C:, puede pedirte reiniciar para revisarlo. No la apagues ni cortes la revisión a la mitad: en discos grandes puede tardar bastante."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/chkdsk"
derivar: "Si la revisión encuentra errores una y otra vez, el disco puede estar fallando: escribile a PC Doctor «un disco informa que está fallando»."
fuentes:
  - https://support.microsoft.com/en-us/surface/performance/windows-doesn-t-respond-or-stops-working-on-surface
  - https://learn.microsoft.com/windows-server/administration/windows-commands/chkdsk
madurez: T0
