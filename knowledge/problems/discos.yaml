id: DSK-002
area: hardware
titulo:
  sencillo: "¿Qué discos tiene mi compu y cuánto lugar libre le queda a cada uno?"
  tecnico: "Configuración > Sistema > Almacenamiento > Configuración avanzada de almacenamiento > Discos y volúmenes"
explicacion:
  sencillo: "En «Discos y volúmenes» Windows muestra todos los discos, los de adentro y los externos, con sus partes (volúmenes), la letra de cada una, el tamaño y cuánto está ocupado. Solo mirar no cambia nada."
  tecnico: "Discos y volúmenes lista discos internos y externos con tipo, capacidad y uso; permite crear, formatear o cambiar el tamaño de volúmenes desde Propiedades."
frases: ["qué discos tiene mi computadora", "cuántos discos tengo en la pc", "ver todos los discos y particiones", "cuánto lugar libre tiene cada disco"]
pasos:
  - texto: "Para ver rápido el espacio libre: abrí el Explorador (Windows + E), tocá «Este equipo» y mirá «Dispositivos y unidades»: cada disco tiene una barra con lo libre."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/free-up-drive-space-in-windows"
  - texto: "Para ver todos los discos con detalle, abrí «Discos y volúmenes». Ahí aparecen los internos y los externos, con cada volumen, su letra y su tamaño."
    abrir: "ms-settings:disksandvolumes"
  - texto: "Desde ahí también se pueden formatear o achicar volúmenes, pero eso puede borrar datos: no toques nada si solo querías mirar, y nunca las partes sin letra, que son de Windows."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows
  - https://support.microsoft.com/windows/experience/storage-filemanagement/free-up-drive-space-in-windows
madurez: T0
