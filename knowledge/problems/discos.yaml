id: DSK-021
area: hardware
titulo:
  sencillo: "En Administración de discos mi disco aparece «Sin conexión»"
  tecnico: "Disco sin conexión (Offline): ponerlo en línea"
explicacion:
  sencillo: "Si un disco figura «Sin conexión», Windows lo ve pero no lo está usando, y sus archivos no aparecen en el Explorador. Ponerlo «En línea» no borra nada. Si no queda en línea, puede ser el cable o un disco que falla."
  tecnico: "Disco en estado Offline en Administración de discos. Clic derecho > En línea; si persiste, revisar cables, controlador y estado físico del disco."
frases: ["el disco dice sin conexión", "en administración de discos el disco está offline", "mi segundo disco aparece desconectado", "cómo pongo en línea un disco"]
pasos:
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio). En la parte de abajo, a la izquierda, ubicá el disco que dice «Sin conexión»."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management"
  - texto: "Hacé clic derecho sobre ese recuadro (donde dice «Disco 1» o similar) y elegí «En línea». Esto no borra nada."
  - texto: "Si vuelve a quedar sin conexión, revisá los cables (en un disco externo, probá otro cable y otro puerto) y reiniciá la compu."
  - texto: "Aprovechá para copiar tus archivos de ese disco a otro lado: un disco que se desconecta solo puede estar por fallar."
derivar: "Si es un disco interno y sigue «Sin conexión», consultá a un técnico para revisar la conexión adentro de la PC."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management
madurez: T0
