id: DSK-025
area: hardware
titulo:
  sencillo: "En Administración de discos mi disco aparece con un estado de error o «en riesgo»"
  tecnico: "Estados Ilegible, Error o Correcto (en riesgo) en Administración de discos"
explicacion:
  sencillo: "Administración de discos muestra al lado de cada disco y volumen si está bien. Si dice que está en riesgo, que tiene errores o que no se puede leer, el disco puede estar dañado o fallando. Lo primero es salvar tus archivos."
  tecnico: "Ilegible: falla de hardware, corrupción o errores de E/S. Error: volumen que no se inicia, disco dañado o sistema de archivos corrupto (indica pérdida de datos). Correcto (en riesgo): errores de E/S en el disco subyacente; respaldar y reemplazar."
frases: ["administración de discos dice que el disco está en riesgo", "el disco aparece como ilegible", "el volumen dice error en administración de discos", "el estado del disco tiene un signo de advertencia"]
pasos:
  - texto: "Si todavía podés abrir los archivos de ese disco, copiá ya lo importante a otro disco o a la nube. Es lo primero."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management"
  - texto: "Revisá que el disco esté bien conectado (cable y alimentación si es externo) y reiniciá la compu. Después, en «Administración de discos», menú «Acción» > «Volver a examinar los discos»."
  - texto: "Si el estado sigue igual, no formatees ni inicialices el disco: eso borra lo que todavía se podría recuperar."
  - texto: "Si es un disco NVMe, mirá también su salud: escribile a PC Doctor «quiero ver si mi disco está sano»."
derivar: "Si el estado de error o de riesgo no se va, el disco puede estar fallando: después de salvar tus archivos, pedile a un técnico que lo cambie."
