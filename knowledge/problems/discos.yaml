id: DSK-018
area: archivos
titulo:
  sencillo: "Quiero que una carpeta de otra compu aparezca como un disco en la mía (unidad de red)"
  tecnico: "Conectar a una unidad de red desde el Explorador de archivos"
explicacion:
  sencillo: "Si otra compu de la casa o de la oficina comparte una carpeta, podés conectarla como si fuera un disco más (por ejemplo, Z:). Aparece en «Este equipo» y se abre como cualquier disco."
  tecnico: "Explorador > Este equipo > Ver más > Conectar unidad de red: letra de unidad, ruta de la carpeta (\\\\equipo\\carpeta) y opción de volver a conectar al iniciar sesión."
frases: ["conectar una unidad de red", "mapear una carpeta compartida como disco", "que la carpeta de la oficina aparezca como z", "agregar el disco de red en este equipo"]
pasos:
  - texto: "Abrí el Explorador (Windows + E) y tocá «Este equipo» a la izquierda. Arriba, tocá los tres puntitos y elegí «Conectar unidad de red». Si no está, hacé clic derecho sobre «Este equipo»."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/file-sharing-over-a-network-in-windows"
  - texto: "Elegí una letra libre para la unidad. En la carpeta, escribí la dirección que te pasaron (empieza con dos barras, como \\\\NOMBRE-PC\\Carpeta) o tocá «Examinar» para buscarla."
  - texto: "Marcá la casilla para que se vuelva a conectar cada vez que iniciás sesión y tocá «Finalizar»."
  - texto: "Si no conecta, fijate que la otra compu esté prendida. Si es en una oficina, puede que no tengas permiso: consultá con quien administra la red."
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/file-sharing-over-a-network-in-windows
madurez: T0
