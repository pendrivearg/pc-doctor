id: DSK-016
area: archivos
titulo:
  sencillo: "Quiero que lo nuevo (fotos, documentos, apps) se guarde en otro disco"
  tecnico: "Dónde se guarda el contenido nuevo (ubicaciones de guardado predeterminadas)"
explicacion:
  sencillo: "Si C: se llena y tenés otro disco con lugar, podés decirle a Windows que guarde ahí las fotos, documentos, música, videos y aplicaciones nuevas. Lo que ya tenés no se mueve."
  tecnico: "Sistema > Almacenamiento > Configuración avanzada de almacenamiento > Dónde se guarda el contenido nuevo: unidad predeterminada por tipo (aplicaciones, documentos, música, fotos, videos)."
frases: ["guardar las fotos nuevas en el disco d", "que las cosas nuevas se guarden en otro disco", "cambiar el disco donde se guardan los documentos", "instalar las apps nuevas en otro disco"]
pasos:
  - texto: "Abrí «Dónde se guarda el contenido nuevo» en Configuración."
    abrir: "ms-settings:savelocations"
  - texto: "Para cada tipo (aplicaciones nuevas, documentos, música, fotos y videos) elegí el disco en la lista."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/free-up-drive-space-in-windows"
  - texto: "Conviene elegir un disco que esté siempre conectado, no un pendrive que sacás y ponés."
  - texto: "Esto vale para lo nuevo. Lo que ya está en C: tenés que pasarlo vos: seleccioná los archivos, «Cortar» y «Pegar» en el otro disco."
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/free-up-drive-space-in-windows
  - https://support.microsoft.com/windows/experience/storage-filemanagement/storage-settings-in-windows
