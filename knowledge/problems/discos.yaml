# Discos y almacenamiento: salud, discos y volúmenes, inicializar y formatear, extender y reducir, formatos, discos externos, Espacios de almacenamiento, espacio, unidades de red y cifrado. Guiadas con fuente oficial y advertencias antes de todo lo que puede borrar datos.
id: DSK-001
area: hardware
titulo:
  sencillo: "Quiero ver si mi disco está sano y cuánta vida le queda"
  tecnico: "Estado de un SSD NVMe en Configuración > Discos y volúmenes > Propiedades"
explicacion:
  sencillo: "Windows muestra la salud de los discos SSD de tipo NVMe: la vida útil que les queda (estimada), la reserva disponible y la temperatura. En discos rígidos comunes (HDD) y en SSD SATA no aparece esta información."
  tecnico: "Windows supervisa solo SSD NVMe: vida útil restante estimada, reserva disponible (0–100 %) y temperatura. Advertencias críticas: reserva baja, confiabilidad degradada o unidad en solo lectura."
frases: ["cómo sé si mi disco está bien de salud", "quiero ver cuánta vida le queda al disco", "dónde veo el estado del disco nvme", "revisar la salud del disco en windows"]
pasos:
  - texto: "Abrí «Discos y volúmenes» en Configuración."
    abrir: "ms-settings:disksandvolumes"
  - texto: "Tocá el disco y elegí «Propiedades». Si es un SSD NVMe vas a ver su estado: la vida útil restante estimada, la reserva disponible y la temperatura."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/what-to-do-about-a-critical-warning-for-a-storage-device"
  - texto: "Si Windows muestra una advertencia (poca reserva, confiabilidad degradada o disco en solo lectura), copiá tus archivos importantes a otro disco o a la nube YA, antes de hacer cualquier otra cosa."
  - texto: "Si no ves esos datos, tu disco no es NVMe (es un HDD o un SSD SATA): Windows no informa su salud en esta pantalla."
derivar: "Si aparece una advertencia, después de copiar tus archivos consultá a un técnico para reemplazar el disco."
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/what-to-do-about-a-critical-warning-for-a-storage-device
madurez: T0
