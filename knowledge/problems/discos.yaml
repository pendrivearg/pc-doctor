id: DSK-005
area: archivos
titulo:
  sencillo: "Quiero crear un volumen en el disco nuevo para poder usarlo"
  tecnico: "Nuevo volumen simple en espacio no asignado (letra y formato)"
explicacion:
  sencillo: "Después de inicializar un disco, queda una franja «No asignado». Hay que crear un volumen ahí: Windows le pone una letra (por ejemplo E:) y lo formatea, y recién entonces lo ves en el Explorador."
  tecnico: "Administración de discos > clic derecho en espacio no asignado > Nuevo volumen simple: tamaño (por defecto, todo el disco), letra de unidad y sistema de archivos (normalmente NTFS)."
frases: ["el disco dice no asignado", "cómo hago para que el disco nuevo tenga letra", "crear una partición en el disco nuevo", "quiero usar el espacio no asignado"]
pasos:
  - texto: "Abrí «Administración de discos» (clic derecho en el botón Inicio). Ubicá la franja negra que dice «No asignado» en el disco nuevo."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows"
  - texto: "ADVERTENCIA: hacé esto solo si sabés que ese espacio está vacío (un disco recién comprado). Si es un disco que tenía archivos y ahora dice «No asignado», no crees nada: escribile a PC Doctor «el disco externo me pide formatear»."
  - texto: "Clic derecho sobre «No asignado» > «Nuevo volumen simple» > «Siguiente». Dejá el tamaño que propone (usa todo el disco) y tocá «Siguiente»."
    abrir: "https://learn.microsoft.com/windows-server/storage/disk-management/initialize-new-disks"
  - texto: "Elegí la letra que quieras, después dejá el formato NTFS y ponele un nombre (por ejemplo «Fotos»). Tocá «Siguiente» y «Finalizar». En unos segundos el disco aparece en el Explorador."
fuentes:
  - https://learn.microsoft.com/windows-server/storage/disk-management/initialize-new-disks
  - https://support.microsoft.com/windows/experience/storage-filemanagement/disk-management-in-windows
  - https://learn.microsoft.com/troubleshoot/windows-server/backup-and-storage/troubleshoot-disk-management
madurez: T0
