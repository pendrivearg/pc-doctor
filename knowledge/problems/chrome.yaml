id: CHR-020
area: programas
titulo:
  sencillo: "Quiero instalar Chrome (o no se termina de instalar)"
  tecnico: "Instalar o reinstalar Chrome en Windows y errores de instalación"
explicacion:
  sencillo: "Chrome se baja gratis de la página oficial de Google. Si la instalación falla, casi siempre es por falta de espacio en el disco, un antivirus que la frena o porque Windows está en «modo S»."
  tecnico: "Instalador de google.com/chrome; errores 0x80070070 (disco lleno), 4 (ya hay una versión más nueva), 7/12/13/31/35/57/102/103 (causa desconocida); instalador sin conexión; modo S."
frases: ["cómo instalo google chrome", "chrome no se termina de instalar", "me da error al instalar chrome", "volver a instalar chrome"]
pasos:
  - texto: "Bajá el instalador solo de la página oficial, google.com/chrome. Abrí el archivo, y si Windows pregunta si permitís cambios, tocá «Sí». Seguí las instrucciones."
    abrir: "https://support.google.com/chrome/answer/95346?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Si da error 0x80070070, el disco está lleno: liberá espacio y probá de nuevo."
    abrir: "ms-settings:storagesense"
  - texto: "Con otros errores: revisá que Internet ande bien, bajá el instalador otra vez y usá el archivo nuevo. Si tenés un antivirus de otra marca, puede estar frenando la instalación."
    abrir: "https://support.google.com/chrome/answer/6315198?hl=es-419"
  - texto: "Si Windows dice que solo deja instalar aplicaciones de Microsoft Store, está en «modo S»: escribile a PC Doctor «salir del modo S». En la compu del trabajo, quizás necesites permiso del administrador."
fuentes:
  - https://support.google.com/chrome/answer/95346?hl=es-419&co=GENIE.Platform%3DDesktop
  - https://support.google.com/chrome/answer/6315198?hl=es-419
