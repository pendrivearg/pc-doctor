id: CHR-011
area: basico
titulo:
  sencillo: "Quiero que Chrome me lea en voz alta una página"
  tecnico: "Leer en voz alta desde el modo de lectura de Chrome"
explicacion:
  sencillo: "Chrome puede leerte en voz alta el texto de una página, desde el modo de lectura. Podés pausar, ir para adelante o atrás y elegir la velocidad y la voz."
  tecnico: "Modo de lectura > Reproducir, Pausar, Anterior, Siguiente, Velocidad de reproducción; Configuración > Selección de voz; Momento destacado de voz."
frases: ["que chrome me lea la página en voz alta", "escuchar una noticia en vez de leerla", "no veo bien y quiero escuchar el texto de la página", "chrome que hable lo que dice la página"]
pasos:
  - texto: "Abrí la página, hacé clic derecho y elegí «Abrir en modo de lectura» (o apretá Alt + Mayús + R)."
    abrir: "https://support.google.com/chrome/answer/14218344?hl=es-419"
  - texto: "Arriba a la derecha del modo de lectura, tocá «Reproducir». Con los botones de al lado pausás, vas a la parte anterior o a la siguiente, y cambiás la velocidad."
  - texto: "Para cambiar la voz o el idioma: «Configuración» > «Selección de voz». En «Momento destacado de voz» elegís si te va marcando la palabra o la oración que lee."
  - texto: "Si no se escucha nada, revisá el volumen de la compu. Si no hay sonido en ningún programa, escribile a PC Doctor «no tengo sonido»."
fuentes:
  - https://support.google.com/chrome/answer/14218344?hl=es-419
madurez: T0
