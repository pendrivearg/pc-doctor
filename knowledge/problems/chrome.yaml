id: CHR-008
area: seguridad
titulo:
  sencillo: "Una extensión de Chrome puede leer todas las páginas que visito y no me gusta"
  tecnico: "Acceso a sitios de una extensión: Al seleccionar, En sitios específicos o En todos los sitios"
explicacion:
  sencillo: "Muchas extensiones piden permiso para «leer y cambiar» los datos de las páginas que visitás. Podés limitarlas para que solo funcionen cuando las tocás o en las páginas que vos elijas."
  tecnico: "Administrar extensiones > Detalles > acceso a sitios: Al seleccionar, En sitios específicos (Agregar) o En todos los sitios."
frases: ["la extensión pide leer y cambiar mis datos", "limitar en qué páginas funciona una extensión", "no quiero que la extensión vea la página del banco", "permisos de las extensiones de chrome"]
pasos:
  - texto: "En Chrome: «Más» (tres puntitos) > «Extensiones» > «Administrar extensiones». En la extensión, tocá «Detalles»."
    abrir: "https://support.google.com/chrome_webstore/answer/2664769?hl=es-419"
  - texto: "Buscá la opción que le permite leer y cambiar los datos de los sitios y elegí «Al seleccionar» (solo funciona cuando la tocás) o «En sitios específicos»."
  - texto: "Si elegiste «En sitios específicos», tocá «Agregar» y escribí las páginas donde sí querés que funcione."
  - texto: "Si no confiás en esa extensión, mejor quitala: en «Administrar extensiones», «Quitar» y confirmá con «Quitar». Si apareció sola, escribile a PC Doctor «tengo extensiones raras»."
fuentes:
  - https://support.google.com/chrome_webstore/answer/2664769?hl=es-419
madurez: T0
