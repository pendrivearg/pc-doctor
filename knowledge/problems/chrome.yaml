id: CHR-023
area: seguridad
titulo:
  sencillo: "Quiero que Chrome me cuide más de las páginas truchas"
  tecnico: "Navegación segura: Protección mejorada en Chrome"
explicacion:
  sencillo: "Chrome tiene tres niveles de protección contra páginas, descargas y extensiones peligrosas. La «Protección mejorada» es la que más te cuida: también te avisa si usás una contraseña que se filtró."
  tecnico: "Configuración > Privacidad y seguridad > Seguridad > Navegación segura: Protección mejorada / Protección estándar / Sin protección. La mejorada envía URL y muestras a Google para su análisis."
frases: ["activar la protección mejorada de chrome", "que chrome me avise de páginas truchas", "navegación segura de google chrome", "chrome dice que estoy sin protección"]
pasos:
  - texto: "En Chrome: «Más» (tres puntitos) > «Configuración» > «Privacidad y seguridad» > «Seguridad»."
    abrir: "https://support.google.com/chrome/answer/9890866?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "En «Navegación segura», elegí «Protección mejorada». Nunca dejes «Sin protección»."
  - texto: "Para saber: con la protección mejorada, Chrome manda a Google las direcciones y una muestra de las páginas o descargas sospechosas para revisarlas. Google dice que lo usa solo por seguridad."
fuentes:
  - https://support.google.com/chrome/answer/9890866?hl=es-419&co=GENIE.Platform%3DDesktop
