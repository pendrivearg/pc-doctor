id: CHR-010
area: programas
titulo:
  sencillo: "Una página tiene tanta propaganda que no puedo leer la nota"
  tecnico: "Modo de lectura de Chrome"
explicacion:
  sencillo: "El modo de lectura de Chrome muestra solo el texto de la nota, sin tanta publicidad, y te deja agrandar la letra, cambiar los colores y ocultar las imágenes."
  tecnico: "Clic derecho > Abrir en modo de lectura, o Alt + Mayús + R; tamaño de fuente, tema de color, fuente, espaciado, vínculos e imágenes."
frases: ["leer una nota sin tanta publicidad", "no puedo leer la noticia por los anuncios", "modo lectura en chrome", "agrandar solo el texto de una noticia"]
pasos:
  - texto: "Abrí la nota que querés leer, hacé clic derecho en la página y elegí «Abrir en modo de lectura». También: Alt + Mayús + R, o «Más» > «Más herramientas» > «Modo de lectura»."
    abrir: "https://support.google.com/chrome/answer/14218344?hl=es-419"
  - texto: "Arriba a la derecha del modo de lectura tenés botones para disminuir, aumentar o restablecer el tamaño de la letra."
  - texto: "En «Configuración» (también arriba a la derecha) podés cambiar el tema de color, la fuente, el espacio entre líneas y ocultar vínculos e imágenes."
  - texto: "Si el modo de lectura se te abre solo, puede ser que otro programa use el mismo atajo de teclado."
fuentes:
  - https://support.google.com/chrome/answer/14218344?hl=es-419
madurez: T0
