id: CHR-012
area: programas
titulo:
  sencillo: "Quiero que Chrome arranque siempre en la misma página (o con las pestañas de antes)"
  tecnico: "Configuración «Al iniciar» y botón de página principal de Chrome"
explicacion:
  sencillo: "Podés elegir qué muestra Chrome cuando lo abrís: una pestaña nueva, las pestañas que tenías abiertas o las páginas que vos quieras. También podés poner un botón con una casita para volver a tu página preferida."
  tecnico: "Configuración > Al iniciar: Abrir la página Nueva pestaña / Continuar la sesión desde donde la dejaste / Abrir una página específica o un conjunto de páginas. Diseño > Mostrar el botón de la Página principal."
frases: ["que chrome abra con las pestañas que tenía", "poner el diario como página de inicio en chrome", "la casita de inicio en chrome", "cuando abro chrome quiero que arranque en google"]
pasos:
  - texto: "En Chrome: «Más» (tres puntitos) > «Configuración» > a la izquierda, «Al iniciar»."
    abrir: "https://support.google.com/chrome/answer/95314?hl=es-419"
  - texto: "Elegí «Continuar la sesión desde donde la dejaste» para que vuelvan tus pestañas, «Abrir una página específica o un conjunto de páginas» para que abra siempre tus páginas, o «Abrir la página Nueva pestaña»."
  - texto: "Para tener el botón de la casita: en «Configuración» > «Diseño», activá «Mostrar el botón de la Página principal» y elegí «Página Nueva pestaña» o escribí la dirección que quieras. Aparece a la izquierda de la barra de direcciones."
  - texto: "Si la página de inicio cambia sola, puede ser un programa no deseado: escribile a PC Doctor «me cambiaron la página de inicio»."
fuentes:
  - https://support.google.com/chrome/answer/95314?hl=es-419
madurez: T0
---
id: CHR-013
area: programas
titulo:
  sencillo: "Quiero elegir con qué buscador busca Chrome"
  tecnico: "Cambiar el motor de búsqueda predeterminado de Chrome"
explicacion:
  sencillo: "Cuando escribís algo en la barra de arriba de Chrome, se busca en el buscador que esté elegido (Google, Bing u otro). Lo podés cambiar cuando quieras."
  tecnico: "Configuración > Motor de búsqueda > Cambiar. Si cambia solo o no se puede cambiar, puede haber software malicioso; en equipos administrados lo define el administrador."
frases: ["chrome busca con bing y quiero google", "cambiar el buscador de la barra de chrome", "cuando escribo arriba me busca en otra página", "poner google como buscador en chrome"]
pasos:
  - texto: "En Chrome: «Más» (tres puntitos) > «Configuración» > «Motor de búsqueda»."
    abrir: "https://support.google.com/chrome/answer/95426?hl=es-419"
  - texto: "Al lado de «Motor de búsqueda», tocá «Cambiar» y elegí el que quieras usar."
  - texto: "Si el buscador se cambia solo o no te deja cambiarlo, puede haber un programa malicioso. Escribile a PC Doctor «dejar chrome como recién instalado». En la compu del trabajo, lo puede fijar la empresa."
fuentes:
  - https://support.google.com/chrome/answer/95426?hl=es-419
madurez: T0
