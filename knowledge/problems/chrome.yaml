id: CHR-007
area: programas
titulo:
  sencillo: "No encuentro el botoncito de una extensión en Chrome"
  tecnico: "Fijar o dejar de fijar extensiones en la barra de herramientas"
explicacion:
  sencillo: "Las extensiones que instalás quedan guardadas en un botón con forma de pieza de rompecabezas, a la derecha de la barra de direcciones. Las que usás seguido se pueden «fijar» para tenerlas siempre a la vista."
  tecnico: "Ícono de extensiones (rompecabezas) > Fijar; clic derecho > Dejar de fijar. Más > Extensiones > Administrar extensiones para activar o desactivar."
frases: ["no veo el ícono de la extensión en chrome", "la extensión desapareció de la barra de arriba", "qué es el rompecabezas que aparece en chrome", "quiero tener la extensión a mano arriba"]
pasos:
  - texto: "Tocá el ícono del rompecabezas, a la derecha de la barra de direcciones. Ahí están tus extensiones."
    abrir: "https://support.google.com/chrome_webstore/answer/2664769?hl=es-419"
  - texto: "Al lado de la que querés tener a mano, tocá el ícono de «Fijar» (un alfiler). Algunas extensiones no tienen esa opción."
  - texto: "Para sacar un ícono de la barra sin borrar la extensión: clic derecho sobre el ícono > «Dejar de fijar». Sigue disponible en el rompecabezas."
  - texto: "Si no aparece en la lista, entrá a «Más» (tres puntitos) > «Extensiones» > «Administrar extensiones» y revisá que su interruptor esté activado."
fuentes:
  - https://support.google.com/chrome_webstore/answer/2664769?hl=es-419
madurez: T0
