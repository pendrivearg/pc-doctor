id: CHR-014
area: programas
titulo:
  sencillo: "Quiero que los enlaces se abran en Chrome y no en otro navegador"
  tecnico: "Establecer Chrome como navegador predeterminado en Windows"
explicacion:
  sencillo: "Cuando tocás un enlace en un correo o en un documento, Windows lo abre con el navegador «predeterminado». Si querés que siempre sea Chrome, se elige en la Configuración de Windows."
  tecnico: "Windows 11: Configuración > Aplicaciones > Aplicaciones predeterminadas > Google Chrome > Establecer como predeterminado. Windows 10: Aplicaciones predeterminadas > Navegador web."
frases: ["los links se me abren en edge y quiero chrome", "poner chrome como navegador principal", "que todo se abra con google chrome", "hacer que chrome sea el navegador de siempre"]
pasos:
  - texto: "En Windows 11: «Configuración» > «Aplicaciones» > «Aplicaciones predeterminadas». En el buscador de esa página escribí Chrome y elegí «Google Chrome»."
    abrir: "ms-settings:defaultapps"
  - texto: "Tocá «Establecer como predeterminado», al lado de «Establecer Google Chrome como navegador predeterminado». Revisá la lista de abajo para ver que se aplicó."
    abrir: "https://support.google.com/chrome/answer/95417?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "En Windows 10: «Configuración» > «Aplicaciones» > «Aplicaciones predeterminadas». En «Navegador web», tocá el navegador que aparece y elegí «Google Chrome»."
fuentes:
  - https://support.google.com/chrome/answer/95417?hl=es-419&co=GENIE.Platform%3DDesktop
madurez: T0
