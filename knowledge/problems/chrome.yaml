id: CHR-024
area: programas
titulo:
  sencillo: "Quiero borrar el historial de Chrome (todo o una sola página)"
  tecnico: "Ver y borrar el historial de navegación de Chrome"
explicacion:
  sencillo: "Chrome guarda la lista de páginas que visitaste. Podés borrar una sola o todas. Si tenés Chrome conectado a tu cuenta con el historial sincronizado, se borra también en tus otros aparatos."
  tecnico: "Más > Historial > Historial (casilla > Borrar > Quitar); Más > Borrar datos de navegación > Todos > Historial de navegación > Borrar datos."
frases: ["borrar las páginas que visité en chrome", "borrar una sola página del historial de chrome", "limpiar el historial de google chrome", "que no quede registro de las páginas que entré"]
pasos:
  - texto: "Para borrar una sola página: «Más» (tres puntitos) > «Historial» > «Historial». Marcá la casilla de la página, tocá «Borrar» (arriba a la derecha) y después «Quitar»."
    abrir: "https://support.google.com/chrome/answer/95589?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Para borrar todo: «Más» > «Borrar datos de navegación». En el período elegí «Todos» y marcá «Historial de navegación»."
  - texto: "Ojo antes de tocar «Borrar datos»: dejá marcado solo lo que quieras borrar. Si el historial está sincronizado con tu cuenta, se borra también en tus otros aparatos."
  - texto: "Lo que buscaste en Google se guarda aparte, en tu cuenta de Google, y se borra desde ahí."
fuentes:
  - https://support.google.com/chrome/answer/95589?hl=es-419&co=GENIE.Platform%3DDesktop
