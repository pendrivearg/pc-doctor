id: CHR-015
area: programas
titulo:
  sencillo: "Una página me llena de avisos en la esquina de la pantalla"
  tecnico: "Bloquear notificaciones de sitios en Chrome"
explicacion:
  sencillo: "Si alguna vez tocaste «Permitir» cuando una página te ofreció notificaciones, esa página te puede mandar avisos. Se pueden bloquear desde la configuración de Chrome."
  tecnico: "Configuración > Privacidad y seguridad > Configuración de sitios > Notificaciones: predeterminado, notificaciones más discretas, listas «Pueden enviar» y «No pueden enviar notificaciones»."
frases: ["me aparecen avisos de una página en la esquina", "una página me manda notificaciones todo el tiempo", "cómo saco las notificaciones de un sitio en chrome", "acepté notificaciones de una página sin querer"]
pasos:
  - texto: "En Chrome: «Más» (tres puntitos) > «Configuración» > «Privacidad y seguridad» > «Configuración de sitios» > «Notificaciones»."
    abrir: "https://support.google.com/chrome/answer/3220216?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Para bloquear una página: al lado de «No pueden enviar notificaciones», tocá «Agregar», escribí la dirección de la página y tocá «Agregar» otra vez."
  - texto: "Arriba de esa pantalla podés elegir qué pasa con las páginas nuevas; si querés que molesten menos, activá «Usar notificaciones más discretas»."
  - texto: "Si los avisos vienen de Windows o de otros programas, escribile a PC Doctor «demasiadas notificaciones»."
fuentes:
  - https://support.google.com/chrome/answer/3220216?hl=es-419&co=GENIE.Platform%3DDesktop
