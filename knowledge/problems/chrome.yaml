# Google Chrome: perfiles, invitado, cuenta, extensiones, Lens, lectura, inicio, buscador, predeterminado, notificaciones, ventanas emergentes, letra, actualizar, instalar y desinstalar, celular, protección e historial. Guiadas con fuente oficial (support.google.com, es-419).
id: CHR-001
area: programas
titulo:
  sencillo: "Quiero que otra persona de la casa tenga su propio Chrome"
  tecnico: "Agregar un perfil de Chrome"
explicacion:
  sencillo: "Chrome permite tener «perfiles»: cada persona tiene sus propios favoritos, historial, contraseñas y configuración, separados de los tuyos. Es como tener un Chrome para cada uno en la misma compu."
  tecnico: "Ícono de perfil > Agregar perfil de Chrome; nombre, foto y esquema de colores; con Cuenta de Google el perfil toma el nombre de la cuenta."
frases: ["quiero un chrome para mi nieto aparte del mío", "agregar otro perfil en chrome", "que mi señora tenga sus favoritos separados en chrome", "crear un usuario nuevo en google chrome"]
pasos:
  - texto: "Abrí Chrome y tocá el ícono de perfil, arriba a la derecha (un circulito con una foto o una inicial). Elegí «Agregar perfil de Chrome»."
    abrir: "https://support.google.com/chrome/answer/2364824?hl=es-419"
  - texto: "Si la otra persona entra con su cuenta de Google, el perfil toma el nombre de esa cuenta. Si no, ponele vos un nombre."
  - texto: "Elegí una foto y un color distinto para cada perfil: así se reconoce enseguida de quién es cada ventana. Después se puede cambiar desde el ícono de perfil > «Personalizar el perfil»."
  - texto: "Ojo: los perfiles no tienen clave. Compartí la compu solo con gente de confianza, porque cualquiera puede pasar a otro perfil y ver qué páginas visitó esa persona."
fuentes:
  - https://support.google.com/chrome/answer/2364824?hl=es-419
madurez: T0
---
id: CHR-002
area: programas
titulo:
  sencillo: "Chrome se abrió con el perfil de otra persona y quiero pasar al mío"
  tecnico: "Cambiar de perfil de Chrome e identificar cada perfil"
explicacion:
  sencillo: "Si en la compu hay varios perfiles de Chrome, cada ventana pertenece a uno. Si ves favoritos o páginas que no son tuyas, seguramente estás en el perfil de otra persona: no se borró nada, solo hay que cambiar."
  tecnico: "Ícono de perfil > elegir el perfil; Administrar perfiles de Chrome > Más > Editar para cambiar nombre, foto o tema de color."
frases: ["el chrome me abre con las cosas de mi hija", "cómo paso a mi perfil de chrome", "no me aparecen mis favoritos porque estoy en otro perfil", "cambiar de usuario en chrome"]
pasos:
  - texto: "Tocá el ícono de perfil, arriba a la derecha de Chrome, y elegí tu perfil en la lista."
    abrir: "https://support.google.com/chrome/answer/2364824?hl=es-419"
  - texto: "Para no confundirte más: ícono de perfil > «Administrar perfiles de Chrome». En tu perfil tocá «Más» (los tres puntitos) > «Editar» y poné un nombre, una foto o un color bien distintos. Se guarda solo."
  - texto: "Si en ningún perfil aparecen tus favoritos, escribile a PC Doctor «desaparecieron mis favoritos»."
fuentes:
  - https://support.google.com/chrome/answer/2364824?hl=es-419
madurez: T0
---
id: CHR-003
area: programas
titulo:
  sencillo: "Quiero borrar un perfil de Chrome que ya no se usa"
  tecnico: "Eliminar un perfil de Chrome"
explicacion:
  sencillo: "Si un perfil de Chrome quedó de alguien que ya no usa la compu, se puede borrar. Ojo: se borran de esta compu sus favoritos, su historial, sus contraseñas guardadas y su configuración."
  tecnico: "Ícono de perfil > Administrar perfiles de Chrome > Más > Borrar; elimina de la computadora favoritos, historial, contraseñas y configuración de ese perfil."
frases: ["sacar un perfil de chrome que sobra", "eliminar el perfil de chrome de mi sobrino", "tengo perfiles viejos en chrome y los quiero borrar", "borrar un usuario de google chrome"]
pasos:
  - texto: "Antes de borrar, preguntale a la persona dueña de ese perfil si necesita algo de ahí (favoritos o contraseñas), porque se borran de esta compu."
  - texto: "Tocá el ícono de perfil, arriba a la derecha. En «Otros perfiles de Chrome», elegí «Administrar perfiles de Chrome»."
    abrir: "https://support.google.com/chrome/answer/2364824?hl=es-419"
  - texto: "En el perfil que querés quitar, tocá «Más» (los tres puntitos de su esquina) > «Borrar», y confirmá otra vez con «Borrar»."
fuentes:
  - https://support.google.com/chrome/answer/2364824?hl=es-419
madurez: T0
---
id: CHR-004
area: programas
titulo:
  sencillo: "Me piden la compu prestada y no quiero que vean mis cosas de Chrome"
  tecnico: "Navegar en Chrome como invitado"
explicacion:
  sencillo: "El modo invitado abre un Chrome vacío para otra persona: no ve tus favoritos, tus contraseñas ni tu historial, y cuando lo cierra se borra lo que hizo. El modo incógnito, en cambio, es para vos en tu propia compu."
  tecnico: "Ícono de perfil > perfil de invitado; al cerrar se borran historial, cookies y datos de sitios. Los sitios, el proveedor de Internet o la empresa pueden seguir viendo la actividad."
frases: ["prestar la compu sin que vean mi chrome", "abrir chrome como invitado", "una visita quiere usar internet en mi compu", "modo invitado de google chrome"]
pasos:
  - texto: "Abrí Chrome, tocá el ícono de perfil (arriba a la derecha) y abrí el perfil de invitado. Se abre una ventana aparte, sin tus cosas."
    abrir: "https://support.google.com/chrome/answer/6130773?hl=es-419"
  - texto: "Dejá que la otra persona use esa ventana. Tus favoritos y contraseñas no aparecen ahí."
  - texto: "Cuando termine, cerrá la ventana de invitado con «Cerrar» (arriba a la derecha), o desde el ícono de perfil > «Cerrar las ventanas de la sesión de invitado». Se borran el historial y las cookies de esa sesión."
  - texto: "Ojo: invitado no hace invisible a nadie. Las páginas que visita y quien da el Internet pueden ver lo que hace."
fuentes:
  - https://support.google.com/chrome/answer/6130773?hl=es-419
madurez: T0
