id: CHR-009
area: programas
titulo:
  sencillo: "Quiero buscar algo que veo en una foto o en una página con Google Lens"
  tecnico: "Buscar con Google Lens en Chrome (computadora)"
explicacion:
  sencillo: "Con Google Lens podés buscar en Google algo que estás viendo (una planta, un mueble, un texto) sin tener que escribirlo: lo marcás con el mouse y Chrome te muestra resultados al costado."
  tecnico: "Clic derecho en imagen > Buscar con Google Lens; Más > Buscar esta pestaña con Google Lens; resultados en el panel lateral. Requiere Google como motor de búsqueda predeterminado."
frases: ["buscar una foto en google desde chrome", "qué es esta planta que vi en una página", "cómo uso google lens en la compu", "buscar con la imagen en vez de escribir"]
pasos:
  - texto: "Para una imagen: hacé clic derecho sobre la foto y elegí «Buscar con Google Lens»."
    abrir: "https://support.google.com/chrome/answer/15086890?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Para cualquier parte de la página: «Más» (tres puntitos) > «Buscar esta pestaña con Google Lens», o clic derecho en la página y la misma opción. En el panel del costado, tocá algo, marcá un texto o arrastrá el mouse sobre la parte que te interesa."
  - texto: "Para cerrarlo, apretá Esc o tocá «Cerrar». Si no aparece la opción, revisá que Google sea el buscador de Chrome."
  - texto: "Ojo: para buscar, Chrome manda a Google una captura de la página. No lo uses sobre páginas con datos privados, como la del banco."
fuentes:
  - https://support.google.com/chrome/answer/15086890?hl=es-419&co=GENIE.Platform%3DDesktop
madurez: T0
