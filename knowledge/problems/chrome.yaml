id: CHR-019
area: programas
titulo:
  sencillo: "Quiero desinstalar Google Chrome"
  tecnico: "Desinstalar Chrome en Windows 11 y 10"
explicacion:
  sencillo: "Chrome se desinstala como cualquier programa, desde la Configuración de Windows. Al hacerlo podés elegir si también se borran tus favoritos y tu historial de esta compu."
  tecnico: "Configuración > Aplicaciones > Aplicaciones instaladas > Google Chrome > Desinstalar; casilla «Eliminar también los datos de navegación» borra el perfil local."
frases: ["sacar google chrome de la compu", "desinstalar el navegador de google", "quiero eliminar chrome de la computadora", "cómo borro el chrome"]
pasos:
  - texto: "Cerrá todas las ventanas de Chrome."
  - texto: "En Windows 11: «Configuración» > «Aplicaciones» > «Aplicaciones instaladas». Buscá Google Chrome, tocá los tres puntitos > «Desinstalar», otra vez «Desinstalar» y aceptá con «Sí». En Windows 10, la lista se llama «Aplicaciones y características»."
    abrir: "ms-settings:appsfeatures"
  - texto: "Ojo con la casilla «Eliminar también los datos de navegación»: si la marcás, se borran de esta compu tus favoritos y tu historial. Dejala sin marcar si pensás volver a instalarlo."
    abrir: "https://support.google.com/chrome/answer/95319?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Si usabas tu cuenta de Google en Chrome, parte de tu información sigue guardada en la cuenta."
fuentes:
  - https://support.google.com/chrome/answer/95319?hl=es-419&co=GENIE.Platform%3DDesktop
