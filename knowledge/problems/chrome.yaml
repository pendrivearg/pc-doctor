id: CHR-021
area: programas
titulo:
  sencillo: "Quiero instalar Chrome en el celular"
  tecnico: "Instalar Chrome en Android (Play Store) o iPhone (App Store)"
explicacion:
  sencillo: "Chrome también existe para el celular y es gratis. Se baja de la tienda de aplicaciones: Play Store en Android o App Store en iPhone."
  tecnico: "Android 10 o posterior: Play Store > Chrome > Instalar. iOS 18 o posterior: App Store > Chrome > Obtener."
frases: ["bajar chrome en el celular", "instalar google chrome en el iphone", "no tengo chrome en el teléfono", "poner chrome en el android"]
pasos:
  - texto: "En Android: abrí «Play Store», buscá Chrome y tocá «Instalar». Cuando termine, «Abrir». Hace falta Android 10 o más nuevo."
    abrir: "https://support.google.com/chrome/answer/95346?hl=es-419&co=GENIE.Platform%3DAndroid"
  - texto: "En iPhone: abrí la «App Store», buscá Chrome y tocá «Obtener». Si te pide la contraseña de tu ID de Apple, escribila vos en el celular (nunca se la pases a nadie). Hace falta iOS 18 o más nuevo."
    abrir: "https://support.google.com/chrome/answer/95346?hl=es-419&co=GENIE.Platform%3DiOS"
  - texto: "Para ver en el celular los mismos favoritos que en la compu, escribile a PC Doctor «tener los mismos favoritos en el celular»."
fuentes:
  - https://support.google.com/chrome/answer/95346?hl=es-419&co=GENIE.Platform%3DAndroid
  - https://support.google.com/chrome/answer/95346?hl=es-419&co=GENIE.Platform%3DiOS
