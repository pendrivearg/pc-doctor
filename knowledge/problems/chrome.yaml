id: CHR-022
area: programas
titulo:
  sencillo: "Estoy viendo una página en la compu y la quiero abrir en el celular"
  tecnico: "Enviar una pestaña a tus dispositivos o compartirla con código QR"
explicacion:
  sencillo: "Chrome puede mandar la página que estás viendo directo al Chrome de tu celular, o mostrarte un código QR para escanearlo con la cámara del teléfono."
  tecnico: "Más > Transmitir, guardar y compartir > Enviar a tus dispositivos (misma Cuenta de Google en ambos) o Crear código QR."
frases: ["pasar una página de la compu al celular", "mandar la pestaña al teléfono", "abrir en el celular lo que estoy viendo en chrome", "sacar un código qr de una página en chrome"]
pasos:
  - texto: "Para mandarla: tenés que haber entrado a Chrome con la misma cuenta de Google en la compu y en el celular."
    abrir: "https://support.google.com/chrome/answer/10051760?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "En la compu: «Más» (tres puntitos) > «Transmitir, guardar y compartir» > «Enviar a tus dispositivos» (o clic derecho en la pestaña) y elegí tu celular. Se abre sola en el Chrome del teléfono."
  - texto: "Sin cuenta: «Más» > «Transmitir, guardar y compartir» > «Crear código QR», y apuntale con la cámara del celular al código que aparece."
fuentes:
  - https://support.google.com/chrome/answer/10051760?hl=es-419&co=GENIE.Platform%3DDesktop
