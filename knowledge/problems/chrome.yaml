id: CHR-025
area: rendimiento
titulo:
  sencillo: "Cuando vuelvo a una pestaña de Chrome se vuelve a cargar sola"
  tecnico: "Ahorro de memoria: mantener sitios siempre activos y ver el uso de memoria por pestaña"
explicacion:
  sencillo: "Para que la compu no se ponga lenta, Chrome «duerme» las pestañas que no estás mirando y libera memoria. Cuando volvés, la página se carga de nuevo. Podés pedirle que no lo haga con las páginas que te importan."
  tecnico: "Configuración > Rendimiento > Ahorro de memoria (Moderado, Equilibrado, Máximo) y «Mantener estos sitios siempre activos»; Diseño > «Mostrar el uso de memoria de la pestaña»."
frases: ["la pestaña de chrome se recarga sola cuando vuelvo", "chrome me recarga la página que tenía abierta", "que chrome no duerma una página", "ver cuánta memoria gasta cada pestaña de chrome"]
pasos:
  - texto: "En Chrome: «Más» (tres puntitos) > «Configuración» > «Rendimiento»."
    abrir: "https://support.google.com/chrome/answer/12929150?hl=es-419"
  - texto: "A la derecha de «Mantener estos sitios siempre activos», tocá «Agregar». Elegí «Agregar sitios actuales» para marcar pestañas abiertas, o «Agregar sitios manualmente» para escribir la dirección, y confirmá con «Agregar»."
  - texto: "Si te pasa con muchas páginas, en «Ahorro de memoria» elegí «Moderado»: las pestañas tardan más en dormirse."
  - texto: "Para ver cuánta memoria gasta cada pestaña: «Configuración» > «Diseño» y activá «Mostrar el uso de memoria de la pestaña». Lo ves al pasar el mouse por encima de la pestaña."
fuentes:
  - https://support.google.com/chrome/answer/12929150?hl=es-419
madurez: T0
