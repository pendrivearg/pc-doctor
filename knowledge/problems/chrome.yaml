id: CHR-006
area: programas
titulo:
  sencillo: "Quiero agregarle una extensión a Chrome"
  tecnico: "Instalar una extensión desde Chrome Web Store"
explicacion:
  sencillo: "Las extensiones son agregados que le suman funciones a Chrome. Las seguras se bajan de la tienda oficial de Google, Chrome Web Store. Instalá solo las que necesites y que sean de alguien en quien confíes."
  tecnico: "Chrome Web Store > Agregar a Chrome > revisar permisos > Agregar extensión. No disponible en Incógnito ni como invitado; en equipos administrados puede estar bloqueado."
frases: ["cómo instalo una extensión en chrome", "agregar un complemento al chrome", "me dijeron que baje una extensión para chrome", "dónde está la tienda de extensiones de chrome"]
pasos:
  - texto: "Abrí Chrome Web Store (la tienda de extensiones de Google) en una ventana normal: en incógnito o como invitado no se pueden instalar."
    abrir: "https://support.google.com/chrome_webstore/answer/2664769?hl=es-419"
  - texto: "Buscá la extensión, abrila y tocá «Agregar a Chrome»."
  - texto: "Chrome te muestra qué permisos pide. Leelos: si te parece demasiado para lo que hace, no la instales. Si estás de acuerdo, tocá «Agregar extensión»."
  - texto: "Para usarla, tocá su ícono a la derecha de la barra de direcciones. En la compu del trabajo puede que no te deje instalar: consultá con quien la administra."
fuentes:
  - https://support.google.com/chrome_webstore/answer/2664769?hl=es-419
madurez: T0
