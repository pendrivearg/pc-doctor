id: CHR-017
area: basico
titulo:
  sencillo: "En Chrome quiero la letra más grande en todas las páginas (o una sola quedó agrandada)"
  tecnico: "Tamaño de fuente, zoom predeterminado y niveles de zoom por sitio en Chrome"
explicacion:
  sencillo: "Chrome deja agrandar la letra o todo lo que se ve en todas las páginas a la vez. Además recuerda el zoom de cada página: si agrandaste una, la próxima vez se va a ver igual de grande."
  tecnico: "Configuración > Diseño > Tamaño de fuente / Zoom de página; Configuración de sitios > Configuración adicional de contenido > Niveles de zoom."
frases: ["agrandar la letra de chrome para siempre", "una sola página se ve gigante en chrome", "tamaño de fuente en google chrome", "chrome se acuerda del zoom de una página y no quiero"]
pasos:
  - texto: "En Chrome: «Más» (tres puntitos) > «Configuración» > «Diseño». En «Tamaño de fuente» elegí uno más grande, o en «Zoom de página» elegí un porcentaje mayor para agrandar todo."
    abrir: "https://support.google.com/chrome/answer/96810?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Algunas páginas no dejan cambiar solo la letra: en esas usá el zoom (Ctrl + Más para agrandar, Ctrl + Menos para achicar)."
  - texto: "Si una página sola quedó grande o chica: «Configuración» > «Privacidad y seguridad» > «Configuración de sitios» > «Configuración adicional de contenido» > «Niveles de zoom», y tocá la X al lado de esa página."
  - texto: "Si lo que se ve chico es todo Windows y no solo Chrome, escribile a PC Doctor «las letras se ven muy chicas»."
fuentes:
  - https://support.google.com/chrome/answer/96810?hl=es-419&co=GENIE.Platform%3DDesktop
