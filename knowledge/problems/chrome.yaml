id: CHR-005
area: programas
titulo:
  sencillo: "Quiero salir de mi cuenta de Google en Chrome (o Chrome dice que mi cuenta tiene un error)"
  tecnico: "Salir de Chrome, quitar la cuenta y borrar los datos guardados en la cuenta"
explicacion:
  sencillo: "Si entraste a Chrome con tu cuenta de Google, podés salir cuando quieras. Lo que Chrome guardó en tu cuenta sigue en tu cuenta de Google; si también lo querés borrar, hay una página aparte para eso."
  tecnico: "Ícono de perfil > Salir de Chrome; con la cuenta en estado de error, Quitar la cuenta de Chrome. Datos en la cuenta: chrome.google.com/data > Borrar datos."
frases: ["salir de mi cuenta en chrome", "desconectar chrome de mi cuenta de google", "chrome dice que hay un error con mi cuenta", "borrar lo que chrome guardó en mi cuenta"]
pasos:
  - texto: "En Chrome, tocá el ícono de perfil (arriba a la derecha) > «Salir de Chrome»."
    abrir: "https://support.google.com/chrome/answer/185277?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Si ahí aparece un error con tu cuenta, o ya habías cerrado Gmail, usá «Quitar la cuenta de Chrome». Después podés volver a entrar con «Acceder a Chrome»."
  - texto: "Si además querés borrar lo que Chrome guardó en tu cuenta de Google: abrí Chrome, escribí chrome.google.com/data en la barra de direcciones y tocá «Borrar datos». Ojo: eso borra lo que Chrome guardó en tu cuenta de Google; hacelo solo si estás seguro."
  - texto: "Si usaste tu cuenta en una compu ajena y querés sacarla del todo, escribile a PC Doctor «sacar mi cuenta de google de esta compu»."
fuentes:
  - https://support.google.com/chrome/answer/185277?hl=es-419&co=GENIE.Platform%3DDesktop
madurez: T0
