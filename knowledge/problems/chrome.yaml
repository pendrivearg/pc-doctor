id: CHR-016
area: programas
titulo:
  sencillo: "La página del banco o de un trámite no abre una ventana porque Chrome la bloquea"
  tecnico: "Permitir ventanas emergentes de un sitio en Chrome"
explicacion:
  sencillo: "Chrome bloquea las ventanas emergentes para frenar la propaganda, pero algunas páginas serias (bancos, trámites) las usan para mostrar un comprobante o un formulario. Se pueden permitir solo para esa página."
  tecnico: "Ícono de ventana emergente bloqueada en la barra de direcciones > Siempre permitir ventanas emergentes y redireccionamientos; Configuración de sitios > Ventanas emergentes y redireccionamientos."
frases: ["chrome bloquea la ventana del banco", "no se abre el comprobante porque dice ventana emergente bloqueada", "permitir ventanas emergentes en una página", "la página del trámite no abre la otra ventana"]
pasos:
  - texto: "Entrá a la página donde no se abrió la ventana. En la barra de direcciones aparece un ícono de ventana emergente bloqueada: tocalo."
    abrir: "https://support.google.com/chrome/answer/95472?hl=es-419&co=GENIE.Platform%3DDesktop"
  - texto: "Tocá el enlace de la ventana que querés ver. Para que esa página siempre pueda abrirlas, elegí «Siempre permitir ventanas emergentes y redireccionamientos de» esa página y tocá «Listo»."
  - texto: "Hacelo solo con páginas que conocés. La lista se revisa en «Configuración» > «Privacidad y seguridad» > «Configuración de sitios» > «Ventanas emergentes y redireccionamientos»."
  - texto: "Si se te abren ventanas de propaganda solas, escribile a PC Doctor «se abren ventanas de propaganda»."
fuentes:
  - https://support.google.com/chrome/answer/95472?hl=es-419&co=GENIE.Platform%3DDesktop
