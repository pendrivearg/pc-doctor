id: CHR-018
area: programas
titulo:
  sencillo: "Chrome no se actualiza o da un error al actualizar"
  tecnico: "Errores de actualización de Chrome (3, 4, 7, 10, 11, 12; actualizaciones inhabilitadas)"
explicacion:
  sencillo: "A veces Chrome no puede actualizarse porque algo bloquea la descarga (un antivirus o un control parental), porque la compu necesita reiniciarse o porque Windows es muy viejo. Se puede revisar paso a paso."
  tecnico: "Errores 3/11: servidor no disponible; 4/10: no inicia la verificación; 7/12: falla la descarga. Revisar antivirus, firewall o control parental (tools.google.com, dl.google.com), modo de compatibilidad, requisitos, reinstalar."
frases: ["chrome no se quiere actualizar", "me sale error al actualizar chrome", "la actualización de google chrome falla", "chrome dice que el administrador desactivó las actualizaciones"]
pasos:
  - texto: "Reiniciá la compu y probá otra vez: «Más» (tres puntitos) > «Ayuda» > «Acerca de Google Chrome»."
    abrir: "https://support.google.com/chrome/answer/111996?hl=es-419"
  - texto: "Si tenés antivirus, firewall o control parental, revisá que permitan las actualizaciones de Chrome (las direcciones tools.google.com y dl.google.com no tienen que estar bloqueadas)."
  - texto: "Si dice que el administrador inhabilitó las actualizaciones, es una compu manejada por una empresa o escuela: consultá con quien la administra."
  - texto: "Chrome necesita Windows 10 o posterior. Si nada funciona, Google sugiere desinstalarlo y volver a instalarlo desde la página oficial: escribile a PC Doctor «quiero desinstalar Google Chrome»."
fuentes:
  - https://support.google.com/chrome/answer/111996?hl=es-419
madurez: T0
