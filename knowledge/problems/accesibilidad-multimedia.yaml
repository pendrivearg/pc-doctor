id: MED-019
area: programas
titulo:
  sencillo: "Un video no se reproduce o dice que falta un códec"
  tecnico: "Códec de video ausente (HEVC, VP9, AV1)"
explicacion:
  sencillo: "Un «códec» es una pieza que le enseña a la compu a leer cierto tipo de video. Si falta, el video no abre o no se ve bien. Algunos se agregan desde la Microsoft Store. No bajes «paquetes de códecs gratis» de páginas desconocidas: pueden traer problemas y dañar Windows."
  tecnico: "Extensiones de video de Microsoft Store (HEVC, VP9, AV1). Evitar los paquetes de códecs gratuitos de Internet; usar solo fuentes oficiales y crear un punto de restauración antes."
frases: ["el video no se reproduce", "dice que falta un códec", "el video se escucha pero no se ve", "no puedo abrir un video del celular en la compu"]
pasos:
  - texto: "Fijate qué dice el error. Si nombra una extensión (por ejemplo, «HEVC»), abrí la Microsoft Store, buscá ese nombre e instalala. Después cerrá y volvé a abrir el reproductor."
  - texto: "Si después de eso sigue sin andar, puede que el problema no sea el códec: no todas las fallas al reproducir son por eso."
  - texto: "No instales «paquetes de códecs gratis» de páginas desconocidas: Microsoft advierte que pueden causar problemas y dañar el sistema."
    abrir: "https://support.microsoft.com/en-us/windows/apps/windowsmediaplayer/codecs-faq"
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/windowsmediaplayer/codecs-faq
madurez: T0
