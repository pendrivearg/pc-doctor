# Accesibilidad, multimedia y juegos: subtítulos en vivo, filtros de color, contraste, acceso por voz, sonido mono, avisos visuales, teclado y cursor, audífonos, video y fotos, Game Bar, controles y componentes que piden los juegos. Guiadas con fuente oficial.
id: MED-001
area: basico
titulo:
  sencillo: "Quiero que la compu me ponga subtítulos a lo que se escucha"
  tecnico: "Subtítulos en vivo (Live captions) de Windows 11"
explicacion:
  sencillo: "Windows 11 puede escribir en pantalla lo que se dice en un video, una videollamada o cualquier sonido de la compu. Sirve mucho si escuchás poco o si no podés poner volumen. Funciona sin Internet una vez preparado."
  tecnico: "Live captions (Windows 11 22H2 o posterior): Windows + Ctrl + L o Configuración > Accesibilidad > Subtítulos. Reconocimiento en el dispositivo; la primera vez descarga el idioma."
frases: ["quiero subtítulos en todo lo que se escucha", "poner subtítulos a una videollamada", "no escucho bien los videos y quiero leerlos", "que la compu escriba lo que dicen"]
pasos:
  - texto: "Apretá Windows + Ctrl + L. También podés abrir Accesibilidad > Subtítulos y activar los subtítulos en vivo, o tocar el ícono del volumen o de la red (abajo a la derecha) y activarlos desde ahí."
    abrir: "ms-settings:easeofaccess-closedcaptioning"
  - texto: "La primera vez te pide permiso para procesar la voz en tu compu y descargar el idioma: aceptá y esperá a que termine."
  - texto: "Para moverlos, tocá el engranaje de la ventanita de subtítulos y elegí «Posición» (arriba, abajo o flotando). Ahí mismo, en «Preferencias», podés activar «Incluir audio del micrófono» para que también escriba lo que se dice cerca tuyo."
  - texto: "Microsoft lo explica paso a paso (hace falta Windows 11, versión 22H2 o más nueva)."
    abrir: "https://support.microsoft.com/windows/use-live-captions-to-better-understand-audio-b52da59c-14b8-4031-aeeb-f6a47e6055df"
fuentes:
  - https://support.microsoft.com/windows/use-live-captions-to-better-understand-audio-b52da59c-14b8-4031-aeeb-f6a47e6055df
  - https://support.microsoft.com/accessibility/windows/make-windows-easier-to-hear
madurez: T0
---
id: MED-002
area: basico
titulo:
  sencillo: "Soy daltónico y me cuesta distinguir algunos colores en la pantalla"
  tecnico: "Filtros de color de Windows"
explicacion:
  sencillo: "Windows trae «filtros de color» que cambian cómo se ven los colores en toda la pantalla, para que sea más fácil distinguir cosas que solo se diferencian por el color. Se prueban uno por uno hasta encontrar el que mejor te sirve."
  tecnico: "Configuración > Accesibilidad > Filtros de color (Windows + U): activar y probar cada filtro de la lista."
frases: ["soy daltónico y no distingo los colores", "no diferencio el rojo del verde en la pantalla", "los colores de la pantalla me confunden", "filtro para daltonismo en la compu"]
pasos:
  - texto: "Abrí Filtros de color (o apretá Windows + U y entrá en «Filtros de color»)."
    abrir: "ms-settings:easeofaccess-colorfilter"
  - texto: "Activá «Filtros de color» y probá cada filtro de la lista hasta que veas mejor la diferencia entre los colores."
  - texto: "Si la pantalla quedó con colores raros y no te gusta cómo se ve, apagá el mismo interruptor."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/use-color-filters-in-windows"
fuentes:
  - https://support.microsoft.com/accessibility/windows/use-color-filters-in-windows
madurez: T0
---
id: MED-003
area: basico
titulo:
  sencillo: "Quiero más contraste en la pantalla para leer mejor"
  tecnico: "Temas de contraste (alto contraste)"
explicacion:
  sencillo: "Los «temas de contraste» ponen colores muy marcados para que el texto y los botones se distingan mejor. Acá también está cómo sacarlos si se activaron sin querer y la pantalla cambió de colores de golpe."
  tecnico: "Configuración > Accesibilidad > Temas de contraste > elegir tema > Aplicar; «Ninguno» los desactiva. Atajo: Alt izquierda + Mayús izquierda + Impr Pant."
frases: ["quiero más contraste en la pantalla", "la pantalla se puso negra con letras amarillas", "poner alto contraste", "se activó el alto contraste y no sé sacarlo"]
pasos:
  - texto: "Abrí Temas de contraste, desplegá la lista, elegí un tema y tocá «Aplicar». Puede aparecer «Espere» unos segundos antes de que cambien los colores."
    abrir: "ms-settings:easeofaccess-highcontrast"
  - texto: "Para volver a los colores normales, elegí «Ninguno» en la misma lista y tocá «Aplicar»."
  - texto: "Atajo: Alt izquierda + Mayús izquierda + Impr Pant activa o apaga el alto contraste (si se activó solo, probablemente lo apretaste sin querer)."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/change-color-contrast-in-windows"
fuentes:
  - https://support.microsoft.com/accessibility/windows/change-color-contrast-in-windows
madurez: T0
