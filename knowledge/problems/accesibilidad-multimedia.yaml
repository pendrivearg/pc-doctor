id: MED-015
area: juegos
titulo:
  sencillo: "Un juego o programa viejo pide .NET Framework"
  tecnico: ".NET Framework 3.5 (incluye 2.0 y 3.0) no instalado"
explicacion:
  sencillo: "Algunos juegos y programas viejos necesitan una pieza de Windows llamada «.NET Framework 3.5». Windows 10 y 11 ya traen la versión nueva (4.8), pero no la vieja, que se agrega aparte gratis desde Microsoft."
  tecnico: "Windows 11 incluye .NET Framework 4.8/4.8.1; la 3.5 se habilita a pedido (Características de Windows) hasta 25H2. Desde 26H1 (compilación 28000) solo con instalador independiente."
frases: ["el juego me pide net framework", "dice que falta .net framework 3.5", "un programa viejo pide instalar una característica de windows", "no puedo instalar net framework"]
pasos:
  - texto: "Si aparece un cartel que ofrece «Descargar e instalar esta característica», aceptalo: es de Windows y necesita Internet."
  - texto: "Si no aparece: tocá Inicio, buscá «Características de Windows» y abrí «Activar o desactivar las características de Windows». Marcá «.NET Framework 3.5 (incluye .NET 2.0 y 3.0)», tocá «Aceptar» y reiniciá si te lo pide."
    abrir: "https://learn.microsoft.com/dotnet/framework/install/dotnet-35-windows"
  - texto: "Con Windows 11 26H1 o más nuevo, esa casilla ya no está: Microsoft da un instalador aparte en esta página. Bajalo solo de ahí."
    abrir: "https://learn.microsoft.com/dotnet/framework/install/dotnet-35-windows-11"
