id: MED-016
area: programas
titulo:
  sencillo: "Quiero recortar, enderezar o girar una foto"
  tecnico: "Editar imágenes en la app Fotos (recortar, girar, voltear, ajustes y filtros)"
explicacion:
  sencillo: "La app Fotos que viene con Windows sirve para recortar una foto, girarla si quedó de costado, enderezarla, darle más luz o ponerle un filtro, sin instalar nada."
  tecnico: "Fotos > Editar imagen (Ctrl + E): Recortar (relación de aspecto, girar 90°, voltear, rotación libre), ajustes de luz y color, Filtro; «Restablecer» deshace todo."
frases: ["quiero recortar una foto", "la foto quedó de costado y la quiero girar", "enderezar una foto torcida", "aclarar una foto que salió oscura"]
pasos:
  - texto: "Escribí «Fotos» en la búsqueda de la barra de tareas, abrí la app y tocá la foto."
  - texto: "Arriba, tocá «Editar imagen» (o Ctrl + E). En «Recortar» podés achicar el borde, girar la foto, voltearla o enderezarla con la barrita de rotación."
  - texto: "Con las barritas de la derecha ajustás la luz y el color; en «Filtro» elegís uno (con «Original» lo sacás). Si algo no te gusta, «Restablecer» deshace todos los cambios."
  - texto: "Al terminar, guardá los cambios. Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/windows/apps/photos/edit-photos-and-videos-in-windows"
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/photos/edit-photos-and-videos-in-windows
