id: MED-021
area: juegos
titulo:
  sencillo: "Se me abre una barra de Xbox en la pantalla y no la quiero"
  tecnico: "Desactivar Xbox Game Bar"
explicacion:
  sencillo: "Esa barra es la «Xbox Game Bar», que sirve para grabar juegos. Aparece al apretar Windows + G. Si no la usás, se puede apagar."
  tecnico: "Configuración > Juegos > Game Bar: apagar la opción que habilita Xbox Game Bar para grabar clips de juegos."
frases: ["me aparece la barra de xbox", "se abre la game bar sola", "sacar la barra de juegos de windows", "desactivar xbox game bar"]
pasos:
  - texto: "Si está abierta ahora, apretá Windows + G para esconderla."
  - texto: "Abrí Game Bar y apagá la opción que habilita Xbox Game Bar para cosas como grabar clips de juegos."
    abrir: "ms-settings:gaming-gamebar"
  - texto: "Si más adelante querés grabar un juego, prendé la misma opción. Microsoft muestra dónde está."
    abrir: "https://support.microsoft.com/en-us/accessibility/windows/use-a-screen-reader-to-record-your-screen-with-xbox-game-bar"
fuentes:
  - https://support.microsoft.com/en-us/accessibility/windows/use-a-screen-reader-to-record-your-screen-with-xbox-game-bar
