id: MED-020
area: juegos
titulo:
  sencillo: "Quiero grabar un pedazo del juego mientras juego"
  tecnico: "Grabar clips con Xbox Game Bar"
explicacion:
  sencillo: "Windows trae la «Xbox Game Bar», que graba lo que pasa en el juego con una combinación de teclas. Los videos quedan guardados en la carpeta Videos."
  tecnico: "Xbox Game Bar: Windows + Alt + R inicia y detiene la grabación; Windows + G muestra la barra; Windows + Alt + M micrófono. Clips MP4 en Videos > Capturas."
frases: ["grabar la partida de un juego", "quiero grabar lo que juego", "cómo grabo un clip del juego", "guardar una jugada en video"]
pasos:
  - texto: "Fijate que esté activada: abrí Game Bar y prendé la opción que habilita Xbox Game Bar para grabar clips de juegos."
    abrir: "ms-settings:gaming-gamebar"
  - texto: "Abrí el juego y apretá Windows + Alt + R para empezar a grabar. Para terminar, otra vez Windows + Alt + R."
  - texto: "Windows + G muestra la barra con todos los botones; Windows + Alt + M prende o apaga el micrófono mientras grabás."
  - texto: "El video queda en la carpeta Videos, dentro de «Capturas», con el nombre del juego y la fecha. Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/accessibility/windows/use-a-screen-reader-to-record-your-screen-with-xbox-game-bar"
derivar: "Para grabar la pantalla fuera de un juego, escribile a PC Doctor «grabar la pantalla»."
fuentes:
  - https://support.microsoft.com/en-us/accessibility/windows/use-a-screen-reader-to-record-your-screen-with-xbox-game-bar
madurez: T0
