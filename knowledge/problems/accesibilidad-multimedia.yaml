id: MED-010
area: basico
titulo:
  sencillo: "Escribo todo en mayúsculas sin darme cuenta"
  tecnico: "Teclas de alternancia (Toggle Keys): aviso sonoro de Bloq Mayús"
explicacion:
  sencillo: "Pasa cuando se aprieta sin querer la tecla Bloq Mayús. Windows puede hacer un sonido cada vez que se activa o desactiva, así te das cuenta enseguida."
  tecnico: "Configuración > Accesibilidad > Teclado > Teclas de alternancia: sonido al presionar Bloq Mayús, Bloq Num o Bloq Despl."
frases: ["se me escribe todo en mayúscula", "aprieto bloq mayús sin darme cuenta", "quiero que suene cuando activo las mayúsculas", "la clave no me entra porque estaba en mayúscula"]
pasos:
  - texto: "Para volver a minúsculas ahora, apretá una vez la tecla Bloq Mayús (a veces dice «Caps Lock»)."
  - texto: "Abrí Accesibilidad > Teclado y activá «Teclas de alternancia»: desde ahí, cada vez que toques Bloq Mayús o Bloq Num vas a escuchar un sonido."
    abrir: "ms-settings:easeofaccess-keyboard"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use
madurez: T0
