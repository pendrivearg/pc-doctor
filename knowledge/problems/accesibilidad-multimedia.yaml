id: MED-006
area: audio
titulo:
  sencillo: "No escucho los avisos de la compu: quiero que la pantalla parpadee"
  tecnico: "Avisos visuales en lugar de sonidos"
explicacion:
  sencillo: "Si no escuchás bien, Windows puede hacer titilar la ventana o toda la pantalla cada vez que suena un aviso, así te das cuenta aunque no lo oigas."
  tecnico: "Configuración > Accesibilidad > Audio: hacer parpadear la barra de título, la ventana activa o toda la pantalla durante las notificaciones de audio."
frases: ["no escucho cuando la compu me avisa algo", "que la pantalla titile en vez de sonar", "soy sordo y no me entero de los avisos", "avisos visuales en lugar del sonido"]
pasos:
  - texto: "Abrí Accesibilidad > Audio."
    abrir: "ms-settings:easeofaccess-audio"
  - texto: "En la opción para hacer parpadear la pantalla durante las notificaciones de audio, elegí qué querés que titile: la barra de título de la ventana, la ventana entera o toda la pantalla."
  - texto: "Si además los avisos se van muy rápido, escribile a PC Doctor «los avisos desaparecen muy rápido»."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-windows-easier-to-hear"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-windows-easier-to-hear
madurez: T0
