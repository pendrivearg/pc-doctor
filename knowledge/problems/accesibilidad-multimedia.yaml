id: MED-007
area: basico
titulo:
  sencillo: "Los avisos de la compu desaparecen antes de que los pueda leer"
  tecnico: "Tiempo de las notificaciones (Efectos visuales)"
explicacion:
  sencillo: "Los avisos que aparecen abajo a la derecha se van solos a los 5 segundos. Si leés despacio o no los ves a tiempo, podés hacer que se queden más tiempo en pantalla."
  tecnico: "Configuración > Accesibilidad > Efectos visuales > «Descartar notificaciones después de este período de tiempo» (predeterminado: 5 s)."
frases: ["los avisos se van muy rápido", "no llego a leer las notificaciones", "quiero que los mensajes de la compu duren más", "las notificaciones desaparecen enseguida"]
pasos:
  - texto: "Abrí Accesibilidad > «Efectos visuales»."
    abrir: "ms-settings:easeofaccess-visualeffects"
  - texto: "En la opción para descartar las notificaciones después de un tiempo, elegí uno más largo (por ejemplo, 1 minuto)."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-windows-easier-to-hear"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-windows-easier-to-hear
madurez: T0
