id: MED-012
area: basico
titulo:
  sencillo: "Quiero mover la flechita con el teclado porque no puedo usar el mouse"
  tecnico: "Teclas del mouse (teclado numérico)"
explicacion:
  sencillo: "Si el mouse no anda o te cuesta usarlo, podés mover la flechita con los números del costado derecho del teclado (el teclado numérico) y hacer clic con el 5."
  tecnico: "Configuración > Accesibilidad > Mouse > Teclas del mouse. 8/2/4/6 mueven, 7/9/1/3 en diagonal, 5 clic, + doble clic, / botón izquierdo, - botón derecho."
frases: ["mover el mouse con el teclado", "no puedo usar el mouse y quiero hacer clic", "manejar la flechita con los números", "el mouse se rompió y necesito hacer clic"]
pasos:
  - texto: "Abrí Accesibilidad > «Mouse» (en la parte de Interacción) y activá «Teclas del mouse». Sin mouse: apretá Windows + U para abrir Accesibilidad, movete con Tab y las flechas, y cuando estés en el interruptor apretá la barra espaciadora."
  - texto: "Usá el teclado numérico: 8 sube, 2 baja, 4 va a la izquierda, 6 a la derecha (7, 9, 1 y 3 en diagonal). El 5 hace clic y el + hace doble clic."
  - texto: "Para clic derecho, apretá primero la tecla menos (-) y después el 5. Para volver al clic normal, apretá la barra (/)."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/use-mouse-keys-to-move-the-mouse-pointer"
derivar: "Si el mouse dejó de funcionar, escribile a PC Doctor «el mouse no funciona»."
fuentes:
  - https://support.microsoft.com/accessibility/windows/use-mouse-keys-to-move-the-mouse-pointer
  - https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use
madurez: T0
