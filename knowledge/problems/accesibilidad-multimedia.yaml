id: MED-009
area: basico
titulo:
  sencillo: "Me tiembla la mano y se me escriben letras repetidas"
  tecnico: "Teclas de filtro (Filter Keys) para ignorar pulsaciones breves o repetidas"
explicacion:
  sencillo: "Si te tiembla la mano o rozás teclas sin querer, aparecen letras de más. Las «teclas de filtro» hacen que el teclado ignore los toques muy cortos o repetidos."
  tecnico: "Configuración > Accesibilidad > Teclado > Teclas de filtro: ajusta la sensibilidad para ignorar pulsaciones breves o repetidas."
frases: ["me tiembla la mano y escribo letras de más", "se me repiten las letras al escribir", "toco teclas sin querer", "el teclado es muy sensible para mí"]
pasos:
  - texto: "Abrí Accesibilidad > Teclado y activá «Teclas de filtro»."
    abrir: "ms-settings:easeofaccess-keyboard"
  - texto: "Escribí un rato. Si ahora el teclado parece que tarda en responder, apagalas desde el mismo lugar."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use
madurez: T0
