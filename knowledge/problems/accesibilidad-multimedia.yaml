id: MED-022
area: juegos
titulo:
  sencillo: "La notebook tiene dos placas de video y el juego usa la más débil"
  tecnico: "Preferencia de gráficos por aplicación (Alto rendimiento)"
explicacion:
  sencillo: "Muchas notebooks tienen una placa de video que ahorra batería y otra más potente para juegos. Windows deja elegir cuál usa cada juego, para que use la potente."
  tecnico: "Configuración > Sistema > Pantalla > Gráficos > Opciones personalizadas para aplicaciones > Opciones > Preferencia de gráficos: Alto rendimiento (solo con más de una GPU)."
frases: ["el juego no usa la placa de video buena", "quiero que el juego use la nvidia", "tengo dos placas de video y anda lento el juego", "elegir la placa de video para un juego"]
pasos:
  - texto: "Abrí Gráficos (Sistema > Pantalla > Gráficos). Si la página no aparece, tu compu no tiene esta opción."
    abrir: "ms-settings:display-advancedgraphics"
  - texto: "En las opciones personalizadas para aplicaciones, elegí el juego y tocá «Opciones»."
  - texto: "En «Preferencia de gráficos» elegí «Alto rendimiento», tocá «Guardar» y volvé a abrir el juego."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/display-graphics/optimizations-for-windowed-games-in-windows-11"
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/display-graphics/optimizations-for-windowed-games-in-windows-11
madurez: T0
