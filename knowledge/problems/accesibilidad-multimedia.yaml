id: MED-004
area: basico
titulo:
  sencillo: "Quiero manejar la computadora hablando, sin mouse ni teclado"
  tecnico: "Acceso por voz (Voice access) de Windows 11"
explicacion:
  sencillo: "Con el «acceso por voz» podés abrir programas, hacer clic y dictar texto diciendo lo que querés. Es distinto del dictado: acá manejás toda la compu con la voz. Necesitás un micrófono que funcione."
  tecnico: "Voice access (Windows 11 22H2 o posterior): Configuración > Accesibilidad > Voz. Descarga un modelo de idioma la primera vez (incluye español de España y de México); funciona sin conexión después."
frases: ["manejar la compu con la voz", "no puedo usar las manos para el mouse", "darle órdenes a la computadora hablando", "abrir programas diciendo el nombre"]
pasos:
  - texto: "Antes, fijate que el micrófono funcione. Después abrí Accesibilidad > «Voz» y activá «Acceso por voz» (o buscá «acceso por voz» en el menú Inicio)."
  - texto: "La primera vez elegí el idioma (español) y aceptá: descarga los archivos de voz. Hace falta Internet solo para esa descarga y puede tardar unos minutos."
  - texto: "Para que te escuche decí «Voice access wake up» o tocá el botón del micrófono; para que deje de escuchar, Alt + Mayús + B. Seguí el tutorial que ofrece para aprender las órdenes."
    abrir: "https://support.microsoft.com/accessibility/windows/voice-access/get-started-with-voice-access"
  - texto: "Si querés que arranque solo, en la misma página de «Voz» marcá que se inicie antes o después de iniciar sesión."
    abrir: "https://support.microsoft.com/accessibility/windows/voice-access/set-up-voice-access"
derivar: "Si el micrófono no anda, escribile a PC Doctor «no funciona el micrófono»."
fuentes:
  - https://support.microsoft.com/accessibility/windows/voice-access/get-started-with-voice-access
  - https://support.microsoft.com/accessibility/windows/voice-access/set-up-voice-access
madurez: T0
