id: MED-017
area: programas
titulo:
  sencillo: "Quiero cortar el principio o el final de un video"
  tecnico: "Recortar un video con la app Fotos"
explicacion:
  sencillo: "Si un video tiene partes de más al principio o al final, se puede recortar con la app Fotos de Windows y guardar como un video nuevo, sin tocar el original."
  tecnico: "Fotos > abrir el video > Recortar (Ctrl + E) > marcadores de inicio y fin > Guardar como copia. Edición avanzada: «Editar en el editor de video Clipchamp»."
frases: ["cortar el principio de un video", "recortar un video que grabé con el celular", "sacarle el final a un video", "achicar la duración de un video"]
pasos:
  - texto: "Escribí «Fotos» en la búsqueda de la barra de tareas, abrí la app y tocá el video."
  - texto: "Arriba, tocá «Recortar» (o Ctrl + E) y mové las barritas de abajo hasta donde querés que empiece y termine."
  - texto: "Tocá «Guardar como copia»: así queda un video nuevo y el original no se toca. (En la flechita de al lado está «Guardar», que reemplaza el original.)"
  - texto: "Para cosas más complicadas (unir videos o cortar una parte del medio), abrí el video con el editor Clipchamp. Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/windows/apps/photos/edit-photos-and-videos-in-windows"
fuentes:
  - https://support.microsoft.com/en-us/windows/apps/photos/edit-photos-and-videos-in-windows
