id: MED-008
area: basico
titulo:
  sencillo: "Me cuesta apretar dos teclas a la vez (como Ctrl + C)"
  tecnico: "Teclas especiales (Sticky Keys) para usar atajos de a una tecla"
explicacion:
  sencillo: "Muchos atajos piden apretar dos o tres teclas juntas. Si usás una sola mano o te cuesta, las «teclas especiales» te dejan apretarlas de a una: primero Ctrl, después C, y funciona igual."
  tecnico: "Configuración > Accesibilidad > Teclado > Teclas especiales: los modificadores (Ctrl, Alt, Mayús, Windows) quedan presionados hasta la siguiente tecla."
frases: ["no puedo apretar dos teclas juntas", "uso el teclado con una sola mano", "me cuesta hacer control c", "quiero apretar los atajos de a una tecla"]
pasos:
  - texto: "Abrí Accesibilidad > Teclado y activá «Teclas especiales»."
    abrir: "ms-settings:easeofaccess-keyboard"
  - texto: "Probá: apretá Ctrl, soltala, y después apretá C. Es lo mismo que Ctrl + C."
  - texto: "Si en algún momento querés apagarlas, es el mismo interruptor. Si el teclado empieza a hacer ruidos raros, escribile a PC Doctor «el teclado hace ruidos»."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use
madurez: T0
