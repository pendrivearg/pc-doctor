id: MED-011
area: basico
titulo:
  sencillo: "No encuentro dónde estoy escribiendo: la rayita que titila es muy finita"
  tecnico: "Cursor de texto: indicador y grosor"
explicacion:
  sencillo: "La rayita que marca dónde vas a escribir se pierde fácil. Windows la puede hacer más gruesa y ponerle una marca de color arriba y abajo para encontrarla enseguida."
  tecnico: "Configuración > Accesibilidad > Cursor de texto: Indicador de cursor de texto (tamaño y color) y Grosor del cursor de texto."
frases: ["no veo dónde estoy escribiendo", "la rayita que titila es muy finita", "pierdo el cursor cuando escribo", "hacer más grueso el cursor de texto"]
pasos:
  - texto: "Abrí Accesibilidad > «Cursor de texto»."
    abrir: "ms-settings:easeofaccess-cursor"
  - texto: "Activá «Indicador de cursor de texto», mové el tamaño y elegí un color que resalte."
  - texto: "Más abajo, mové el grosor del cursor de texto hasta que la vista previa se vea bien."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-your-mouse-keyboard-and-other-input-devices-easier-to-use
madurez: T0
