id: MED-018
area: programas
titulo:
  sencillo: "Quiero unir varios videos o sacar una parte del medio"
  tecnico: "Editar y exportar un video con Clipchamp"
explicacion:
  sencillo: "Clipchamp es el editor de video de Microsoft. Sirve para juntar varios videos en uno, cortar un pedazo del medio y guardar el resultado."
  tecnico: "Clipchamp: crear un video > Importar medios > arrastrar a la línea de tiempo > recortar (bordes) o dividir (tijera) > Exportar (480p, 720p, 1080p; 4K con suscripción)."
frases: ["unir dos videos en uno", "cortar una parte del medio de un video", "editar un video en la compu", "hacer un video con varios videos"]
pasos:
  - texto: "Abrí Clipchamp (buscalo en el menú Inicio), tocá el botón para crear un video nuevo y después el de importar medios para elegir tus videos."
    abrir: "https://support.microsoft.com/en-us/clipchamp/how-to-edit-a-video-in-clipchamp"
  - texto: "Arrastrá los videos a la línea de tiempo de abajo, en el orden que quieras."
  - texto: "Para acortar uno, tocalo y arrastrá sus bordes hacia adentro. Para sacar una parte del medio, poné la rayita donde querés cortar, tocá la tijera (dividir), seleccioná el pedazo que sobra y apretá Suprimir."
    abrir: "https://support.microsoft.com/en-us/clipchamp/how-to-trim-videos-images-or-audio-assets"
  - texto: "Arriba a la derecha tocá «Exportar» y elegí la calidad (1080p alcanza para casi todo; 4K pide suscripción)."
fuentes:
  - https://support.microsoft.com/en-us/clipchamp/how-to-edit-a-video-in-clipchamp
  - https://support.microsoft.com/en-us/clipchamp/how-to-trim-videos-images-or-audio-assets
