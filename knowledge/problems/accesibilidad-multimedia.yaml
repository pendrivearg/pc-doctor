id: MED-005
area: audio
titulo:
  sencillo: "Escucho bien de un solo oído o uso un solo auricular"
  tecnico: "Audio mono"
explicacion:
  sencillo: "Mucha música y muchos videos mandan sonidos distintos a cada lado. Si escuchás de un solo oído o usás un solo auricular, te perdés una parte. El «audio mono» junta todo en un solo canal para que escuches todo de los dos lados."
  tecnico: "Configuración > Accesibilidad > Audio > Audio mono (combina los canales estéreo en uno)."
frases: ["escucho de un solo oído y me pierdo sonidos", "uso un solo auricular", "quiero que suene igual de los dos lados", "poner el sonido en mono"]
pasos:
  - texto: "Abrí Accesibilidad > Audio y activá «Audio mono»."
    abrir: "ms-settings:easeofaccess-audio"
  - texto: "Probá un video o una canción con un solo auricular: ahora tendría que escucharse todo."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-windows-easier-to-hear"
fuentes:
  - https://support.microsoft.com/accessibility/windows/make-windows-easier-to-hear
madurez: T0
