    abrir: "ms-settings:easeofaccess-closedcaptioning"
  - texto: "En «Estilo de subtítulos» elegí cómo querés que se vean y fijate en la vista previa."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/make-windows-easier-to-hear"
fuentes:
