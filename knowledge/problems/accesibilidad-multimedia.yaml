id: MED-023
area: juegos
titulo:
  sencillo: "Los juegos en ventana andan peor que en pantalla completa"
  tecnico: "Optimizaciones para juegos en ventana (Windows 11)"
explicacion:
  sencillo: "Windows 11 tiene una opción que hace que los juegos que se juegan en ventana o «sin bordes» anden mejor."
  tecnico: "Configuración > Sistema > Pantalla > Gráficos > Configuración predeterminada > Optimizaciones para juegos en ventana. Activar HDR automático también la activa."
frases: ["el juego en ventana anda trabado", "en modo ventana el juego va peor", "mejorar los juegos sin bordes", "el juego no va fluido si no es pantalla completa"]
pasos:
  - texto: "Abrí Gráficos (Sistema > Pantalla > Gráficos)."
    abrir: "ms-settings:display-advancedgraphics"
  - texto: "En la configuración predeterminada, activá «Optimizaciones para juegos en ventana» y volvé a abrir el juego."
  - texto: "Si un juego en particular anda peor con esto, en las «Opciones» de ese juego podés apagarla solo para él. Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/windows/hardware/display-graphics/optimizations-for-windowed-games-in-windows-11"
derivar: "Si el juego anda mal igual, escribile a PC Doctor «el juego anda lento»."
fuentes:
  - https://support.microsoft.com/en-us/windows/hardware/display-graphics/optimizations-for-windowed-games-in-windows-11
