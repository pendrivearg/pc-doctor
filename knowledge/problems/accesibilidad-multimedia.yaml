id: MED-025
area: juegos
titulo:
  sencillo: "Quiero conectar un joystick de Xbox a la computadora"
  tecnico: "Emparejar un control inalámbrico de Xbox por Bluetooth"
explicacion:
  sencillo: "Los controles inalámbricos de Xbox que tienen Bluetooth se pueden conectar a la compu sin cables, como unos auriculares. Se hace una sola vez y después se conecta solo."
  tecnico: "Botón Xbox + botón de conexión (borde superior) hasta que sea detectable;Configuración > Bluetooth y dispositivos > Agregar dispositivo > Todo lo demás > Xbox Wireless Controller."
frases: ["conectar el joystick de la xbox a la pc", "quiero jugar con el control de xbox en la compu", "el mando de xbox no se conecta a la computadora", "usar el joystick inalámbrico en la notebook"]
pasos:
  - texto: "En el control, mantené apretados a la vez el botón Xbox y el botoncito de conexión (en el borde de arriba) hasta que quede listo para que la compu lo encuentre."
  - texto: "En la compu, abrí Bluetooth y dispositivos, tocá «Agregar dispositivo» y elegí la última opción («Todo lo demás»)."
    abrir: "ms-settings:bluetooth"
  - texto: "Cuando aparezca «Xbox Wireless Controller», tocalo, seguí lo que te pida y tocá «Listo»."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/en-us/surface/play-xbox-games-on-surface-a2eabfa6-3d8d-d997-1773-489cd43faead"
derivar: "Si no aparece o no se conecta, escribile a PC Doctor «los auriculares o el parlante Bluetooth no se conectan»: los pasos para revisar el Bluetooth son los mismos."
fuentes:
  - https://support.microsoft.com/en-us/surface/play-xbox-games-on-surface-a2eabfa6-3d8d-d997-1773-489cd43faead
