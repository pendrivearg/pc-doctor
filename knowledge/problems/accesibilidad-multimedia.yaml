id: MED-013
area: audio
titulo:
  sencillo: "Quiero escuchar la compu directo en mis audífonos"
  tecnico: "Audífonos con Bluetooth LE Audio en Windows 11"
explicacion:
  sencillo: "Algunos audífonos pueden recibir el sonido de la compu directo, como si fueran auriculares. Para eso, tanto la compu como los audífonos tienen que ser compatibles con «LE Audio». No todos lo son, aunque digan Bluetooth."
  tecnico: "Requiere Windows 11, Bluetooth LE integrado de fábrica y controladores con LE Audio; los audífonos ASHA o MFi no son LE Audio. Presets y sonido ambiente desde Windows 11 24H2."
frases: ["conectar los audífonos a la compu", "quiero escuchar la compu en mi audífono", "mis audífonos tienen bluetooth y no se conectan a la pc", "uso audífono y quiero oír los videos directo"]
pasos:
  - texto: "Fijate en el manual de los audífonos (o preguntale a tu fonoaudiólogo) si son compatibles con «LE Audio». Si son de tipo ASHA o «Made for iPhone», no van a funcionar con Windows."
  - texto: "Prendé los audífonos y ponelos en modo de emparejamiento. En la compu, tocá el ícono de la red, el volumen o la batería (abajo a la derecha); en el cuadro de Bluetooth entrá a administrar los dispositivos y elegí tus audífonos en la lista de dispositivos nuevos. Si aparece un aviso para conectarlos, tocá «Conectar»."
  - texto: "Después podés ver la batería y si están conectados en Bluetooth y dispositivos."
    abrir: "ms-settings:bluetooth"
  - texto: "Si tenés dos audífonos, conectá también el segundo cuando Windows te lo pida. Con Windows 11 24H2, en las propiedades del audífono podés cambiar el modo de sonido y el volumen del ambiente."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accessibility/windows/using-hearing-devices-with-your-windows-11-pc"
derivar: "Si son auriculares comunes y no conectan, escribile a PC Doctor «los auriculares Bluetooth no se conectan»."
fuentes:
  - https://support.microsoft.com/accessibility/windows/using-hearing-devices-with-your-windows-11-pc
madurez: T0
