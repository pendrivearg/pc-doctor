id: MED-014
area: juegos
titulo:
  sencillo: "El juego o programa dice que falta MSVCP140.dll o VCRUNTIME140.dll"
  tecnico: "Microsoft Visual C++ Redistributable ausente o dañado"
explicacion:
  sencillo: "Muchos juegos y programas necesitan unas piezas de Microsoft llamadas «Visual C++». Si faltan o se dañaron, aparece ese aviso. Se arregla instalándolas desde la página oficial de Microsoft. Nunca bajes el archivo .dll suelto de páginas de «descargar DLL»: son peligrosas y pueden traer virus."
  tecnico: "Instalar el Visual C++ v14 Redistributable más reciente (x64 y, para juegos de 32 bits, x86) desde learn.microsoft.com; solo instaladores descargados de Microsoft y firmados por Microsoft."
frases: ["falta msvcp140.dll", "dice que no se encuentra vcruntime140.dll", "el juego no abre por un archivo dll", "error de visual c++ al abrir un programa"]
pasos:
  - texto: "Primero fijate en la ayuda del juego o programa: Microsoft recomienda seguir las instrucciones de quien lo fabrica."
  - texto: "Si sigue, abrí la página oficial de Microsoft e instalá el «Visual C++ Redistributable» más reciente: el X64 y también el X86 (algunos juegos son de 32 bits). Reiniciá la compu y probá de nuevo."
    abrir: "https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist"
  - texto: "Si la instalación da error, instalá las actualizaciones pendientes de Windows, reiniciá y volvé a intentar."
    abrir: "ms-settings:windowsupdate"
  - texto: "Importante: no bajes el archivo .dll de otras páginas. Microsoft pide instalar solo lo que viene de sus sitios y firmado por Microsoft."
    abrir: "https://learn.microsoft.com/cpp/windows/troubleshoot-vc-redistributable-installation-issues"
fuentes:
  - https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist
  - https://learn.microsoft.com/cpp/windows/troubleshoot-vc-redistributable-installation-issues
madurez: T0
