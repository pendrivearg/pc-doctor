id: BSOD-008
area: hardware
titulo:
  sencillo: "Pantalla azul «MEMORY_MANAGEMENT»"
  tecnico: "Error de detención 0x1A MEMORY_MANAGEMENT"
explicacion:
  sencillo: "Windows encontró un desorden grave en la forma en que maneja la memoria. Muchas veces es una memoria RAM que está fallando."
  tecnico: "0x1A: error grave de administración de memoria (PTE/PFN dañados, etc.). Varios subcódigos apuntan a hardware; Microsoft recomienda el Diagnóstico de memoria de Windows."
frases: ["pantalla azul memory management", "me sale memory_management y se reinicia", "error memory management en windows 11", "pantallazo azul memory management después de poner más memoria"]
pasos:
  - texto: "Probá la memoria: guardá todo, tocá Inicio, escribí «memoria» y abrí «Diagnóstico de memoria de Windows». Elegí reiniciar ahora; la prueba corre sola."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x1a--memory-management"
  - texto: "Si le agregaste o cambiaste memoria hace poco, apagá, sacá el módulo nuevo y probá unos días sin él."
    abrir: "https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors"
  - texto: "Dejá libre al menos un 10 a 15 % del disco: Windows lo usa como memoria de apoyo."
    abrir: "ms-settings:storagesense"
  - texto: "Instalá todas las actualizaciones de Windows."
    abrir: "ms-settings:windowsupdate"
derivar: "Si el diagnóstico de memoria encuentra errores, hay que cambiar el módulo de RAM: llevala a un técnico."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x1a--memory-management
  - https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors
