id: BSOD-010
area: windows
titulo:
  sencillo: "Pantalla azul «INACCESSIBLE_BOOT_DEVICE» al prender"
  tecnico: "Error de detención 0x7B INACCESSIBLE_BOOT_DEVICE"
explicacion:
  sencillo: "Al arrancar, Windows perdió contacto con el disco donde está instalado. Pasa después de tocar la configuración de la BIOS, cambiar o agregar un disco, o cuando el disco empieza a fallar."
  tecnico: "0x7B: Windows perdió acceso a la partición del sistema durante el arranque. Causas: falla del dispositivo de arranque, controlador de almacenamiento, cambios en UEFI/BIOS (modo AHCI) o reparticionado."
frases: ["pantalla azul inaccessible boot device", "inaccessible_boot_device y no entra a windows", "me sale inaccessible boot device después de cambiar el disco", "no arranca y dice inaccessible boot device"]
pasos:
  - texto: "Si agregaste un disco o cambiaste algo en la BIOS (por ejemplo el modo del disco, AHCI), deshacé ese cambio y volvé a prender."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x7b--inaccessible-boot-device"
  - texto: "Si Windows llega a la pantalla «Elegir una opción», tocá «Solucionar problemas» > «Opciones avanzadas» > «Restaurar sistema» y elegí un punto anterior al error. Tus documentos no se tocan."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/system-restore"
  - texto: "Si logra entrar, arrancá una vez en modo seguro y después reiniciá normal: así Windows vuelve a cargar los controladores del disco."
    abrir: "https://support.microsoft.com/windows/start-your-pc-in-safe-mode-in-windows-92c27cff-db89-8644-1ce4-b3e5e56fe234"
  - texto: "Ya dentro de Windows, dejá libre al menos un 10 a 15 % del disco."
    abrir: "ms-settings:storagesense"
derivar: "Si no arranca de ninguna forma, puede que el disco esté fallando. No reinstales Windows sin antes rescatar tus archivos: un técnico puede sacarlos del disco."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x7b--inaccessible-boot-device
  - https://support.microsoft.com/windows/experience/backup-recovery/system-restore
  - https://support.microsoft.com/windows/start-your-pc-in-safe-mode-in-windows-92c27cff-db89-8644-1ce4-b3e5e56fe234
madurez: T0
