id: BSOD-023
area: hardware
titulo:
  sencillo: "Pantalla azul «KERNEL_DATA_INPAGE_ERROR»"
  tecnico: "Error de detención 0x7A KERNEL_DATA_INPAGE_ERROR"
explicacion:
  sencillo: "Windows necesitaba traer datos del disco a la memoria y no pudo leerlos. Suele ser un disco con sectores dañados, un cable flojo, memoria fallada o, a veces, un virus."
  tecnico: "0x7A: no se pudo leer en memoria una página de datos del kernel desde el archivo de paginación. El estado de error (parámetro 2) orienta: sectores defectuosos, cableado, controlador de disco o RAM."
frases: ["pantalla azul kernel data inpage error", "me salió kernel_data_inpage_error", "error kernel data inpage y el disco hace ruido", "pantallazo azul inpage error"]
pasos:
  - texto: "Primero, si podés entrar, copiá tus fotos y documentos importantes a un pendrive o a la nube: el disco puede estar fallando."
  - texto: "Revisá el disco: abrí «Símbolo del sistema» como administrador y escribí chkdsk C: /f /r. Aceptá que se haga al reiniciar y reiniciá. Puede tardar mucho; no apagues la compu mientras trabaja."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x7a--kernel-data-inpage-error"
  - texto: "Probá la memoria: tocá Inicio, escribí «memoria», abrí «Diagnóstico de memoria de Windows» y elegí reiniciar ahora."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x154--unexpected-store-exception"
  - texto: "Pasá un análisis completo del antivirus: en Seguridad de Windows, «Protección antivirus y contra amenazas» > «Opciones de examen» > «Examen completo»."
    abrir: "ms-settings:windowsdefender"
  - texto: "Instalá todas las actualizaciones de Windows."
    abrir: "ms-settings:windowsupdate"
derivar: "Si es una PC de escritorio, un técnico puede revisar los cables del disco y que las placas estén bien encajadas; si el disco tiene sectores dañados, conviene cambiarlo."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x7a--kernel-data-inpage-error
  - https://learn.microsoft.com/windows-server/administration/windows-commands/chkdsk
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x154--unexpected-store-exception
madurez: T0
