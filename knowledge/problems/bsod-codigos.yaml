id: BSOD-009
area: hardware
titulo:
  sencillo: "Pantalla azul «VIDEO_TDR_FAILURE»"
  tecnico: "Error de detención 0x116 VIDEO_TDR_FAILURE"
explicacion:
  sencillo: "La placa de video se quedó trabada y Windows no pudo despertarla. Pasa mucho jugando: controlador de video viejo, calor, poca fuente de energía o la placa forzada a andar más rápido."
  tecnico: "0x116: falló la recuperación por TDR (Timeout Detection and Recovery) del controlador de pantalla, o hubo demasiados TDR en poco tiempo. Causas: controlador, overclock, refrigeración, fuente o piezas defectuosas."
frases: ["pantalla azul video tdr failure", "me sale video_tdr_failure jugando", "error video tdr failure nvlddmkm", "se pone negra y después pantalla azul video tdr"]
pasos:
  - texto: "Actualizá el controlador de video: clic derecho en Inicio > «Administrador de dispositivos» > «Adaptadores de pantalla», clic derecho en tu placa > «Actualizar controlador». También podés bajarlo de la página oficial del fabricante de la placa."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Actualizá también el juego o programa con el que pasa, y Windows completo."
    abrir: "ms-settings:windowsupdate"
  - texto: "Revisá que la compu no se recaliente (ventiladores andando, sin polvo) y, si la placa o el procesador están con overclock, volvelos a fábrica."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x116---video-tdr-failure"
  - texto: "Cerrá los programas que no estés usando mientras jugás: si hay muchos en segundo plano, la placa puede no llegar a responder."
  - texto: "Probá la memoria: tocá Inicio, escribí «memoria», abrí «Diagnóstico de memoria de Windows» y elegí reiniciar ahora."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x116---video-tdr-failure"
derivar: "Si sigue con el controlador al día, puede ser la placa de video o la fuente: llevala a un técnico."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x116---video-tdr-failure
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
madurez: T0
