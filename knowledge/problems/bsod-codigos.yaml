id: BSOD-006
area: windows
titulo:
  sencillo: "Pantalla azul «DPC_WATCHDOG_VIOLATION»"
  tecnico: "Error de detención 0x133 DPC_WATCHDOG_VIOLATION"
explicacion:
  sencillo: "Windows tiene un «vigilante» que controla que cada controlador termine su tarea a tiempo. Uno se quedó trabado demasiado y Windows se detuvo."
  tecnico: "0x133: el watchdog de DPC detectó una DPC o ISR que excedió su tiempo, o demasiado tiempo acumulado en IRQL DISPATCH_LEVEL o superior. Casi siempre un controlador defectuoso."
frases: ["pantalla azul dpc watchdog violation", "me sale dpc_watchdog_violation cada tanto", "error dpc watchdog y se congela", "se tilda y aparece dpc watchdog violation"]
pasos:
  - texto: "Si en la pantalla azul figuraba un archivo .sys, buscá la actualización de ese controlador (o desactivá ese aparato un tiempo para confirmar que es él)."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Instalá todas las actualizaciones de Windows, también las opcionales de controladores."
    abrir: "ms-settings:windowsupdate-optionalupdates"
  - texto: "Si conectaste un aparato nuevo, confirmá en la página del fabricante que sea compatible con tu versión de Windows; si no, desconectalo."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x133-dpc-watchdog-violation"
derivar: "Si sigue, un técnico puede revisar el registro Sistema del Visor de eventos o el archivo de volcado para saber qué controlador se traba."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x133-dpc-watchdog-violation
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/stop-code-error-troubleshooting
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
