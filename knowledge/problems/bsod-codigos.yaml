id: BSOD-003
area: windows
titulo:
  sencillo: "Pantalla azul «PAGE_FAULT_IN_NONPAGED_AREA»"
  tecnico: "Error de detención 0x50 PAGE_FAULT_IN_NONPAGED_AREA"
explicacion:
  sencillo: "Windows quiso leer una parte de la memoria que no existía o ya estaba liberada. Puede ser un controlador, el antivirus, un disco con errores o una memoria RAM fallada."
  tecnico: "0x50: referencia a memoria del sistema inválida. Causas: controlador o servicio defectuoso, antivirus, volumen NTFS dañado o RAM defectuosa. Si se identifica el controlador, aparece en la pantalla azul."
frases: ["me salió page fault in nonpaged area", "pantalla azul page_fault_in_nonpaged_area", "error page fault in nonpaged area al prender la compu", "pantallazo azul que dice nonpaged area"]
pasos:
  - texto: "Si en la pantalla azul figuraba el nombre de un archivo (termina en .sys), anotalo: es el controlador sospechoso. Buscá su actualización en el Administrador de dispositivos o en la página del fabricante."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Probá la memoria: guardá todo, tocá Inicio, escribí «memoria» y abrí «Diagnóstico de memoria de Windows». Elegí reiniciar ahora; la prueba corre sola y el resultado queda anotado en el Visor de eventos como «MemoryDiagnostics-Results»."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x50--page-fault-in-nonpaged-area"
  - texto: "Revisá el disco: abrí «Símbolo del sistema» como administrador y escribí chkdsk C: /f /r. Te va a pedir hacerlo al reiniciar: decí que sí y reiniciá. Puede tardar mucho; no apagues la compu mientras trabaja."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/chkdsk"
  - texto: "Si usás un antivirus que no es el de Windows, desactivalo un tiempo para ver si el error deja de aparecer."
  - texto: "Si agregaste un aparato hace poco, desconectalo y probá de nuevo."
    abrir: "https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors"
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x50--page-fault-in-nonpaged-area
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/stop-code-error-troubleshooting
  - https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors
  - https://learn.microsoft.com/windows-server/administration/windows-commands/chkdsk
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
madurez: T0
