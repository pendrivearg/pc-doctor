id: BSOD-025
area: hardware
titulo:
  sencillo: "Pantalla azul «VIDEO_SCHEDULER_INTERNAL_ERROR»"
  tecnico: "Error de detención 0x119 VIDEO_SCHEDULER_INTERNAL_ERROR"
explicacion:
  sencillo: "El organizador de trabajo de la placa de video detectó un error grave. Casi siempre se arregla actualizando el controlador de video; si no, puede ser la memoria o la placa."
  tecnico: "0x119: el programador de video detectó una infracción fatal. Si el módulo culpable es el controlador de video, buscar su actualización; algunos subcódigos indican corrupción de memoria o hardware defectuoso."
frases: ["pantalla azul video scheduler internal error", "me sale video_scheduler_internal_error", "error video scheduler jugando", "pantallazo azul video scheduler al mirar videos"]
pasos:
  - texto: "Actualizá el controlador de video: clic derecho en Inicio > «Administrador de dispositivos» > «Adaptadores de pantalla», clic derecho en tu placa > «Actualizar controlador». También podés bajarlo de la página oficial del fabricante."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Instalá todas las actualizaciones de Windows, también las opcionales de controladores."
    abrir: "ms-settings:windowsupdate-optionalupdates"
  - texto: "Si conectaste o cambiaste algo hace poco, desconectalo y probá de nuevo."
    abrir: "https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors"
derivar: "Si sigue con el controlador al día, un técnico puede probar la memoria y la placa de video."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x119---video-scheduler-internal-error
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
  - https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors
madurez: T0
