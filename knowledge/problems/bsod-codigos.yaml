# Pantallas azules según su código de detención (stop code): una ficha por código, con la referencia oficial de Microsoft Learn y la guía de soporte de Microsoft. Guiadas, sin detección automática.
id: BSOD-001
area: windows
titulo:
  sencillo: "Pantalla azul «CRITICAL_PROCESS_DIED»"
  tecnico: "Error de detención 0xEF CRITICAL_PROCESS_DIED"
explicacion:
  sencillo: "Windows se frenó porque se cortó de golpe una de sus piezas imprescindibles. Suele venir de archivos de Windows dañados, de un controlador o de un aparato que conectaste hace poco."
  tecnico: "0xEF: terminó un proceso crítico del sistema (csrss.exe, wininit.exe, smss.exe, services.exe, winlogon.exe…). Revisar hardware nuevo, controladores, SFC y el registro Sistema del Visor de eventos."
frases: ["me salió pantalla azul critical process died", "critical process died y se reinicia sola", "la compu se cuelga con critical_process_died", "pantallazo azul que dice critical process died al prender"]
pasos:
  - texto: "Si conectaste algo nuevo (memoria, disco, placa, impresora) justo antes de que empezara, apagá la compu, desconectalo y volvé a prenderla."
    abrir: "https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors"
  - texto: "Repará los archivos de Windows: tocá Inicio, escribí «cmd», hacé clic derecho en «Símbolo del sistema» > «Ejecutar como administrador», escribí sfc /scannow y apretá Enter. Esperá a que llegue al 100 % sin apagar la compu."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/sfc"
  - texto: "Clic derecho en Inicio > «Administrador de dispositivos». Si algún aparato tiene un signo de advertencia amarillo, clic derecho sobre él > «Actualizar controlador»."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Instalá todas las actualizaciones de Windows."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si empezó hace poco y nada sirvió, volvé a un punto de restauración anterior. Tus documentos no se tocan, pero antes de confirmar tocá «Buscar programas afectados» para ver qué programas cambian."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/system-restore"
derivar: "Si sigue apareciendo, llevale a un técnico el código y la fecha: con el Visor de eventos puede ver qué falló justo antes."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0xef--critical-process-died
  - https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors
  - https://learn.microsoft.com/windows-server/administration/windows-commands/sfc
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
  - https://support.microsoft.com/windows/experience/backup-recovery/system-restore
madurez: T0
