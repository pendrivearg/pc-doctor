    abrir: "https://support.microsoft.com/windows/start-your-pc-in-safe-mode-in-windows-92c27cff-db89-8644-1ce4-b3e5e56fe234"
  - texto: "Si no se arregla, volvé a un punto de restauración anterior. Si Windows no arranca, desde «Elegir una opción» > «Solucionar problemas» > «Opciones avanzadas» > «Restaurar sistema». Tus documentos no se tocan."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/system-restore"
  - texto: "Si entra a Windows, repará sus archivos: abrí «Símbolo del sistema» como administrador, escribí sfc /scannow y Enter."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x74--bad-system-config-info"
  - texto: "Como último recurso queda restablecer la PC. Ojo: según la opción que elijas puede borrar programas y archivos, así que antes copiá tus cosas. Escribile a PC Doctor «quiero restablecer o reinstalar Windows»."
    abrir: "ms-settings:recovery"
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x74--bad-system-config-info
  - https://support.microsoft.com/windows/start-your-pc-in-safe-mode-in-windows-92c27cff-db89-8644-1ce4-b3e5e56fe234
  - https://support.microsoft.com/windows/experience/backup-recovery/system-restore
