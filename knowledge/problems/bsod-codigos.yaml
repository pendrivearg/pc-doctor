id: BSOD-011
area: windows
titulo:
  sencillo: "Pantalla azul «CRITICAL_STRUCTURE_CORRUPTION»"
  tecnico: "Error de detención 0x109 CRITICAL_STRUCTURE_CORRUPTION"
explicacion:
  sencillo: "Windows descubrió que alguien modificó una parte protegida de su corazón. Lo hace un controlador que se mete donde no debe o una memoria que está fallando."
