id: BSOD-002
area: windows
titulo:
  sencillo: "Pantalla azul «IRQL_NOT_LESS_OR_EQUAL»"
  tecnico: "Error de detención 0xA IRQL_NOT_LESS_OR_EQUAL"
explicacion:
  sencillo: "Un controlador (el programita que hace andar un aparato) quiso usar memoria de una forma prohibida y Windows se detuvo. Casi siempre aparece después de instalar un controlador, un antivirus o un aparato nuevo."
  tecnico: "0xA: acceso a memoria paginable o inválida con IRQL elevado, típico de un controlador en modo kernel con un puntero incorrecto. También por servicios, antivirus o herramientas de copia incompatibles tras actualizar Windows."
frases: ["pantalla azul irql not less or equal", "me tira irql_not_less_or_equal y se reinicia", "error irql not less or equal después de instalar algo", "pantallazo azul que dice irql"]
pasos:
  - texto: "Si agregaste un aparato hace poco, desconectalo y fijate si el error vuelve."
    abrir: "https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors"
  - texto: "Si empezó después de actualizar un controlador: clic derecho en Inicio > «Administrador de dispositivos», clic derecho en ese aparato > «Propiedades» > pestaña «Controlador» > «Revertir al controlador anterior»."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Si usás un antivirus que no es el de Windows, desactivalo un tiempo. Si el error desaparece, buscá la versión nueva en la página oficial de ese antivirus."
  - texto: "Instalá todas las actualizaciones de Windows, también las opcionales de controladores."
    abrir: "ms-settings:windowsupdate-optionalupdates"
derivar: "Si sigue después de esto, puede ser un aparato que está fallando: un técnico puede probarlo con el diagnóstico del fabricante."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0xa--irql-not-less-or-equal
  - https://support.microsoft.com/windows/experience/performance-optimization/troubleshooting-windows-unexpected-restarts-and-stop-code-errors
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
madurez: T0
