id: BSOD-005
area: windows
titulo:
  sencillo: "Pantalla azul «KMODE_EXCEPTION_NOT_HANDLED»"
  tecnico: "Error de detención 0x1E KMODE_EXCEPTION_NOT_HANDLED"
explicacion:
  sencillo: "Un programa que trabaja en lo más profundo de Windows (casi siempre un controlador) tuvo un error que nadie atajó. También puede venir de la BIOS o de la memoria."
  tecnico: "0x1E: un programa en modo kernel generó una excepción no controlada. Causas: controlador o servicio defectuoso, incompatibilidad de BIOS, conflictos de memoria o IRQ."
frases: ["pantalla azul kmode exception not handled", "me apareció kmode_exception_not_handled", "error kmode exception al iniciar windows", "kmode exception y no arranca"]
pasos:
  - texto: "Si en la pantalla azul figuraba un archivo .sys, ese controlador es el sospechoso. Desinstalá o actualizá los controladores y programas que agregaste hace poco."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Si se cuelga al arrancar, entrá en modo seguro: Configuración > Sistema > Recuperación > «Inicio avanzado» > «Reiniciar ahora»; después «Solucionar problemas» > «Opciones avanzadas» > «Configuración de inicio» > «Reiniciar», y apretá 4 o F4. Ahí podés desactivar el controlador en el Administrador de dispositivos."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/performance/stop-code-error-troubleshooting"
  - texto: "Fijate en la página del fabricante de tu computadora si hay una actualización de BIOS. Si no sabés cómo instalarla, pedíselo a un técnico."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x1e--kmode-exception-not-handled"
  - texto: "Probá la memoria: tocá Inicio, escribí «memoria», abrí «Diagnóstico de memoria de Windows» y elegí reiniciar ahora."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x154--unexpected-store-exception"
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x1e--kmode-exception-not-handled
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/stop-code-error-troubleshooting
  - https://support.microsoft.com/windows/start-your-pc-in-safe-mode-in-windows-92c27cff-db89-8644-1ce4-b3e5e56fe234
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x154--unexpected-store-exception
madurez: T0
