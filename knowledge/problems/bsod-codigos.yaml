id: BSOD-007
area: hardware
titulo:
  sencillo: "Pantalla azul «WHEA_UNCORRECTABLE_ERROR»"
  tecnico: "Error de detención 0x124 WHEA_UNCORRECTABLE_ERROR"
explicacion:
  sencillo: "Una pieza física de la computadora informó una falla grave: puede ser calor, la memoria, el procesador o que alguien la haya forzado a andar más rápido de lo normal."
  tecnico: "0x124: error de hardware fatal informado por WHEA (Windows Hardware Error Architecture). Suele ser calor, RAM, CPU que falla u overclocking; rara vez un controlador."
frases: ["pantalla azul whea uncorrectable error", "me salió whea_uncorrectable_error", "error whea y se apaga cuando juego", "pantallazo azul whea en la pc gamer"]
pasos:
  - texto: "Fijate que los ventiladores giren y que las salidas de aire no estén tapadas: el calor es una de las causas."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x124---whea-uncorrectable-error"
  - texto: "Si alguien le subió la velocidad al procesador o a la memoria (overclock), volvé a los valores de fábrica o pedíselo a quien lo hizo."
  - texto: "Probá la memoria: tocá Inicio, escribí «memoria», abrí «Diagnóstico de memoria de Windows» y elegí reiniciar ahora."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x154--unexpected-store-exception"
  - texto: "Instalá todas las actualizaciones de Windows por si es un controlador."
    abrir: "ms-settings:windowsupdate"
derivar: "Es casi siempre un problema físico: si sigue, llevala a un técnico para que pruebe memoria, procesador, temperatura y fuente."
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x124---whea-uncorrectable-error
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x154--unexpected-store-exception
