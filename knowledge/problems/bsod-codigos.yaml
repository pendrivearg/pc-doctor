id: BSOD-004
area: windows
titulo:
  sencillo: "Pantalla azul «SYSTEM_SERVICE_EXCEPTION»"
  tecnico: "Error de detención 0x3B SYSTEM_SERVICE_EXCEPTION"
explicacion:
  sencillo: "Una parte de Windows tuvo un error grave mientras atendía un pedido de un programa. Suele ser un controlador (muchas veces el de video) o archivos de Windows dañados."
  tecnico: "0x3B: excepción al ejecutar una rutina que pasa de código no privilegiado a privilegiado (a menudo 0xC0000005, violación de acceso). Revisar controladores recientes, Administrador de dispositivos y SFC."
frases: ["pantalla azul system service exception", "me sale system_service_exception", "error system service exception jugando", "se reinicia con system service exception"]
pasos:
  - texto: "Si instalaste o actualizaste un controlador o un programa hace poco, desinstalalo o actualizalo. Si en la pantalla azul figuraba un archivo .sys, anotalo: es el sospechoso."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Clic derecho en Inicio > «Administrador de dispositivos». Si algún aparato tiene un signo de advertencia amarillo, clic derecho > «Actualizar controlador»."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Repará los archivos de Windows: abrí «Símbolo del sistema» como administrador, escribí sfc /scannow y Enter. Esperá a que termine."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/performance/stop-code-error-troubleshooting"
  - texto: "Instalá todas las actualizaciones de Windows."
    abrir: "ms-settings:windowsupdate"
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x3b--system-service-exception
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/stop-code-error-troubleshooting
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
