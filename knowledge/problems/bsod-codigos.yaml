id: BSOD-024
area: windows
titulo:
  sencillo: "Pantalla azul «UNEXPECTED_STORE_EXCEPTION»"
  tecnico: "Error de detención 0x154 UNEXPECTED_STORE_EXCEPTION"
explicacion:
  sencillo: "Falló la parte de Windows que guarda datos de memoria de forma comprimida. Puede venir de la memoria RAM, de un controlador o de archivos de Windows dañados."
  tecnico: "0x154: el componente de almacén de memoria del kernel atrapó una excepción inesperada. Revisar Visor de eventos, Diagnóstico de memoria, controladores y SFC."
frases: ["pantalla azul unexpected store exception", "me sale unexpected_store_exception", "error unexpected store exception en la notebook", "pantallazo azul store exception"]
pasos:
  - texto: "Probá la memoria: guardá todo, tocá Inicio, escribí «memoria», abrí «Diagnóstico de memoria de Windows» y elegí reiniciar ahora. La prueba corre sola."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x154--unexpected-store-exception"
  - texto: "Clic derecho en Inicio > «Administrador de dispositivos». Si algún aparato tiene un signo de advertencia amarillo, clic derecho > «Actualizar controlador»."
    abrir: "https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6"
  - texto: "Repará los archivos de Windows: abrí «Símbolo del sistema» como administrador, escribí sfc /scannow y Enter."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/sfc"
  - texto: "Instalá todas las actualizaciones de Windows."
    abrir: "ms-settings:windowsupdate"
fuentes:
  - https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-0x154--unexpected-store-exception
  - https://support.microsoft.com/windows/update-drivers-through-device-manager-in-windows-ec62f46c-ff14-c91d-eead-d7126dc1f7b6
  - https://learn.microsoft.com/windows-server/administration/windows-commands/sfc
