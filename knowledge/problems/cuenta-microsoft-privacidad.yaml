id: CMS-025
area: seguridad
titulo:
  sencillo: "¿Qué es la «Protección contra alteraciones» del antivirus de Windows?"
  tecnico: "Protección contra alteraciones de Microsoft Defender"
explicacion:
  sencillo: "La protección contra alteraciones impide que un virus o un programa malicioso apague el antivirus de Windows o le cambie la configuración a escondidas. Conviene tenerla siempre activada."
  tecnico: "Seguridad de Windows > Protección contra virus y amenazas > Configuración de antivirus y protección contra amenazas > Administrar la configuración > Protección contra alteraciones. En equipos administrados por una organización la controla el administrador."
frases: ["qué es la protección contra alteraciones", "seguridad de windows dice que la protección contra alteraciones está desactivada", "activar la protección contra alteraciones", "un programa me pide desactivar la protección contra alteraciones"]
pasos:
  - texto: "Abrí Seguridad de Windows y entrá a «Protección contra virus y amenazas»."
    abrir: "ms-settings:windowsdefender"
  - texto: "En la configuración de protección contra virus y amenazas, tocá «Administrar la configuración»."
  - texto: "Buscá «Protección contra alteraciones» y dejala activada. Si la opción aparece gris, la compu la administra una empresa o colegio."
    abrir: "https://learn.microsoft.com/defender-endpoint/manage-tamper-protection-individual-device"
derivar: "Si un programa o una persona te pide apagarla, desconfiá: es lo que buscan los virus. Pasá el diagnóstico de PC Doctor o escribí «creo que tengo un virus»."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/manage-tamper-protection-individual-device
madurez: T0
