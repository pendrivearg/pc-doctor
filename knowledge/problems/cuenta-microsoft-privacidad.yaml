id: CMS-016
area: programas
titulo:
  sencillo: "Activé la verificación en dos pasos y un programa viejo dice que mi contraseña está mal"
  tecnico: "Contraseña de aplicación para la cuenta Microsoft"
explicacion:
  sencillo: "Algunos programas o aparatos viejos (por ejemplo, el correo que viene en ciertos celulares o un Outlook muy antiguo) no saben pedir el código de la verificación en dos pasos. Para ellos, Microsoft te da una «contraseña de aplicación»: una clave larga que se pone una sola vez en ese programa."
  tecnico: "Opciones de seguridad avanzadas > Contraseñas de aplicación (solo con verificación en dos pasos activa). Una por aplicación o dispositivo."
frases: ["después de activar la doble verificación el mail del celular no anda", "dice contraseña incorrecta en un programa viejo con mi hotmail", "qué es una contraseña de aplicación de microsoft", "el outlook viejo no acepta mi clave"]
pasos:
  - texto: "Entrá a la página de Seguridad de tu cuenta y abrí las opciones de seguridad avanzadas. Bajá hasta la parte de contraseñas de aplicación."
    abrir: "https://account.microsoft.com/security"
  - texto: "Creá una contraseña nueva y copiala."
  - texto: "Pegala en el programa o aparato donde antes ponías tu contraseña de siempre. Usá una distinta para cada programa y no se la des a nadie."
    abrir: "https://support.microsoft.com/accounts-billing/manage/how-to-get-and-use-app-passwords"
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/how-to-get-and-use-app-passwords
  - https://support.microsoft.com/accounts-billing/security/how-to-use-two-step-verification-with-your-microsoft-account
madurez: T0
