id: CMS-017
area: windows
titulo:
  sencillo: "No quiero que los programas sepan dónde estoy (ubicación)"
  tecnico: "Servicios de ubicación de Windows"
explicacion:
  sencillo: "Windows puede saber más o menos dónde está la compu (por el Wi-Fi o la conexión) y dárselo a los programas que lo piden. Vos elegís si lo permitís y a cuáles. Cuando un programa usa tu ubicación, aparece un ícono abajo a la derecha."
  tecnico: "Configuración > Privacidad y seguridad > Ubicación: servicios de ubicación, acceso de las aplicaciones y control por aplicación. Las aplicaciones de escritorio no se controlan una por una."
frases: ["no quiero que la compu sepa dónde estoy", "sacar la ubicación de windows", "qué programas usan mi ubicación", "me aparece un ícono de ubicación abajo a la derecha"]
pasos:
  - texto: "Abrí la página de Ubicación en Configuración."
    abrir: "ms-settings:privacy-location"
  - texto: "Para que ningún programa la use, apagá el permiso para que las aplicaciones accedan a tu ubicación. Si querés dejarla para algunos, apagá solo los programas que no la necesitan."
  - texto: "Ahí mismo ves cuándo la usó cada programa por última vez. Los programas comunes de escritorio no aparecen en esa lista: instalá solo programas de confianza."
    abrir: "https://support.microsoft.com/windows/privacy/windows-location-service-and-privacy"
fuentes:
  - https://support.microsoft.com/windows/privacy/windows-location-service-and-privacy
madurez: T0
