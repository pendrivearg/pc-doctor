id: CMS-013
area: seguridad
titulo:
  sencillo: "Me dice «el cambio de información de seguridad está pendiente» y no puedo cambiar la contraseña"
  tecnico: "Cambio de información de seguridad pendiente (30 días)"
explicacion:
  sencillo: "Cuando se reemplaza toda la información de seguridad de una cuenta, Microsoft espera 30 días antes de aplicar el cambio. Es para que, si fue un ladrón, el dueño de verdad tenga tiempo de darse cuenta. Mientras tanto no se puede cambiar la contraseña ni los alias, aunque casi todo lo demás sigue andando."
  tecnico: "Período de espera de 30 días; bloquea contraseña, alias, medios de pago, controles parentales y el Almacén personal de OneDrive. Se cancela o denuncia desde la página de Seguridad."
frases: ["dice que el cambio de información de seguridad está pendiente", "microsoft me hace esperar 30 días para cambiar el teléfono", "no me deja cambiar la contraseña porque hay un cambio pendiente", "yo no pedí cambiar la información de seguridad de mi hotmail"]
pasos:
  - texto: "Entrá a tu cuenta escribiendo vos la dirección en el navegador y abrí la página de Seguridad. Va a aparecer el aviso del cambio pendiente."
    abrir: "https://account.microsoft.com/security"
  - texto: "Si NO fuiste vos, en ese aviso elegí la opción para avisarle a Microsoft (está abajo de todo) y seguí los pasos."
  - texto: "Si fuiste vos y querés frenarlo, elegí la opción para cancelar la solicitud; vas a necesitar acceso a tu información de seguridad. Si querés que se aplique, solo esperá los 30 días."
    abrir: "https://support.microsoft.com/accounts-billing/manage/what-does-security-info-change-is-still-pending-mean"
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/what-does-security-info-change-is-still-pending-mean
madurez: T0
