id: CMS-020
area: windows
titulo:
  sencillo: "Quiero borrar los datos que Windows le manda a Microsoft (datos de diagnóstico)"
  tecnico: "Diagnóstico y comentarios: eliminar datos de diagnóstico"
explicacion:
  sencillo: "Windows le manda a Microsoft información técnica sobre cómo funciona la compu. Podés elegir mandar solo lo obligatorio y borrar lo que ya está guardado de esta compu. Borrar no frena lo que se mande de acá en adelante ni borra lo que está en tu cuenta de Microsoft."
  tecnico: "Configuración > Privacidad y seguridad > Diagnóstico y comentarios: datos de diagnóstico obligatorios u opcionales; «Eliminar datos de diagnóstico» > Eliminar."
frases: ["borrar los datos de diagnóstico de windows", "no quiero que windows mande tanta información a microsoft", "qué son los datos de diagnóstico opcionales", "windows me pide comentarios todo el tiempo"]
pasos:
  - texto: "Abrí la página de Diagnóstico y comentarios."
    abrir: "ms-settings:privacy-feedback"
  - texto: "En datos de diagnóstico, si querés mandar lo mínimo, apagá el envío de los datos opcionales."
  - texto: "En la parte para eliminar datos de diagnóstico, tocá «Eliminar». Ahí también podés elegir cada cuánto te pide comentarios."
    abrir: "https://support.microsoft.com/windows/privacy/diagnostics-feedback-and-privacy-in-windows"
fuentes:
  - https://support.microsoft.com/windows/privacy/diagnostics-feedback-and-privacy-in-windows
madurez: T0
