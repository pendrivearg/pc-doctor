id: CMS-019
area: windows
titulo:
  sencillo: "Quiero que Windows no guarde lo que hago (historial de actividad)"
  tecnico: "Historial de actividad de Windows"
explicacion:
  sencillo: "Windows puede guardar en la compu una lista de los programas que usás, los archivos que abrís y las páginas que visitás. Lo podés apagar y borrar lo que ya guardó."
  tecnico: "Configuración > Privacidad y seguridad > Historial de actividad: «Almacenar mi historial de actividad en este dispositivo» y «Borrar historial»."
frases: ["que windows no guarde lo que hago", "borrar el historial de actividad de la compu", "no quiero que quede registro de los archivos que abro", "apagar el historial de actividad de windows"]
pasos:
  - texto: "Abrí la página de Historial de actividad."
    abrir: "ms-settings:privacy-activityhistory"
  - texto: "Apagá la opción para guardar tu historial de actividad en este dispositivo."
  - texto: "Para borrar lo que ya había, tocá «Borrar historial» al lado de la opción para borrar el historial de esta cuenta."
    abrir: "https://support.microsoft.com/windows/privacy/windows-activity-history-and-your-privacy"
fuentes:
  - https://support.microsoft.com/windows/privacy/windows-activity-history-and-your-privacy
