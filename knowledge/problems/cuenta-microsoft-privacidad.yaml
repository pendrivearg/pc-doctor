id: CMS-014
area: basico
titulo:
  sencillo: "Quiero agregar otro correo a mi cuenta de Microsoft o sacar uno (alias)"
  tecnico: "Alias de la cuenta Microsoft"
explicacion:
  sencillo: "Un alias es otra dirección de correo que usa la misma cuenta de Microsoft: misma bandeja, mismos contactos y misma contraseña. Sirve, por ejemplo, si querés una dirección nueva sin perder todo lo que tenés."
  tecnico: "Tu información > administrar cómo inicio sesión > Agregar correo / Quitar. Los códigos por correo solo van al alias principal o a correos agregados para verificar."
frases: ["quiero cambiar mi dirección de hotmail sin perder los mails", "agregar otro correo a mi cuenta microsoft", "qué es un alias de outlook", "borrar una dirección vieja de mi cuenta microsoft"]
pasos:
  - texto: "Entrá a tu cuenta de Microsoft y abrí la parte de tu información, donde se administra cómo iniciás sesión."
    abrir: "https://account.microsoft.com/"
  - texto: "Para sumar una dirección, elegí la opción para agregar un correo y seguí los pasos."
  - texto: "Para sacar una, tocá «Quitar» al lado. Antes de borrar una dirección @hotmail u @outlook, pensalo bien: Microsoft lo explica."
    abrir: "https://support.microsoft.com/accounts-billing/manage/change-the-email-address-or-phone-number-for-your-microsoft-account"
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/change-the-email-address-or-phone-number-for-your-microsoft-account
madurez: T0
