id: CMS-015
area: seguridad
titulo:
  sencillo: "Quiero cerrar o borrar para siempre mi cuenta de Microsoft"
  tecnico: "Cerrar una cuenta Microsoft"
explicacion:
  sencillo: "ATENCIÓN: cerrar la cuenta de Microsoft es casi definitivo. Pasado el plazo para arrepentirse (30 o 60 días, lo elegís vos), Microsoft borra tus correos, archivos y todo lo que tengas en esa cuenta, y no se puede recuperar. Si te la hackearon y la querés de vuelta, no la cierres: recuperala."
  tecnico: "Cerrar la cuenta > confirmar > período de reapertura de 30 o 60 días > Marcar cuenta para cierre. Pasado ese plazo se eliminan datos y contenido. Requiere poder iniciar sesión."
frases: ["quiero borrar mi cuenta de hotmail", "cómo elimino mi cuenta de microsoft", "dar de baja mi cuenta outlook", "cerrar para siempre mi cuenta microsoft"]
pasos:
  - texto: "Antes de seguir: guardá en otro lado los correos, fotos y archivos que quieras conservar. Lo que quede en la cuenta se va a borrar."
  - texto: "Entrá a tu cuenta de Microsoft y, desde la página oficial para cerrar la cuenta, confirmá que es la cuenta correcta. Leé y marcá cada aviso de la lista."
    abrir: "https://support.microsoft.com/accounts-billing/manage/how-to-close-your-microsoft-account"
  - texto: "Elegí cuánto tiempo querés para arrepentirte (30 o 60 días), elegí el motivo y confirmá. Mientras no pase ese plazo, todavía la podés reabrir."
derivar: "Si cambiaste toda tu información de seguridad hace poco, Microsoft no te deja cerrarla hasta que pasen 60 días."
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/how-to-close-your-microsoft-account
madurez: T0
