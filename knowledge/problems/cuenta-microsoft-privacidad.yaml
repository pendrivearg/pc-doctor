id: CMS-024
area: seguridad
titulo:
  sencillo: "Seguridad de Windows dice que la «Integridad de memoria» está desactivada"
  tecnico: "Aislamiento del núcleo: integridad de memoria (HVCI)"
explicacion:
  sencillo: "La integridad de memoria es una protección que hace más difícil que un virus se meta en lo más profundo de Windows. A veces no se puede activar porque hay un controlador (driver) viejo que no es compatible con ella; la solución es actualizar ese controlador, no borrarlo a mano."
  tecnico: "Seguridad de Windows > Seguridad del dispositivo > Detalles de aislamiento del núcleo > Integridad de memoria. Requiere virtualización activa en UEFI/BIOS; los controladores incompatibles impiden activarla."
frases: ["dice que la integridad de memoria está desactivada", "no puedo activar el aislamiento del núcleo", "integridad de memoria controladores incompatibles", "seguridad de windows muestra un aviso en seguridad del dispositivo"]
pasos:
  - texto: "Abrí Seguridad de Windows, entrá a «Seguridad del dispositivo» y después a los detalles de aislamiento del núcleo."
    abrir: "ms-settings:windowsdefender"
  - texto: "Activá «Integridad de memoria». Si Windows te pide reiniciar, reiniciá."
  - texto: "Si no te deja porque hay controladores incompatibles, anotá cuáles son y buscá una versión nueva en Windows Update o en la página del fabricante de ese aparato. Si no hay, quizás tengas que dejar de usar ese aparato o programa."
    abrir: "https://support.microsoft.com/windows/security/windows-security/device-security-in-the-windows-security-app"
derivar: "No borres controladores a mano para forzarla: Microsoft no lo recomienda. Si después de activarla algo deja de andar o la compu no arranca, pedí ayuda técnica."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/device-security-in-the-windows-security-app
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity
madurez: T0
