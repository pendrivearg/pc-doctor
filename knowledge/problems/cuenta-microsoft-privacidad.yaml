id: CMS-012
area: seguridad
titulo:
  sencillo: "Quiero cambiar el correo o el celular de seguridad de mi cuenta de Microsoft"
  tecnico: "Información de seguridad de la cuenta Microsoft"
explicacion:
  sencillo: "La información de seguridad son las formas que tiene Microsoft de comprobar que sos vos: otro correo, la aplicación Authenticator o una llave de acceso. Si cambiaste de correo o de número, conviene agregar el nuevo antes de borrar el viejo, para no quedarte sin forma de entrar."
  tecnico: "account.microsoft.com/security > administrar cómo inicio sesión > agregar un nuevo método; hasta 10 métodos. La opción de teléfono puede no estar disponible en algunas cuentas."
frases: ["cambiar el teléfono de recuperación de mi hotmail", "cambiar el mail alternativo de mi cuenta microsoft", "los códigos de microsoft me llegan a un número viejo", "actualizar la información de seguridad de outlook"]
pasos:
  - texto: "Entrá a la página de Seguridad de tu cuenta y abrí la opción para administrar cómo iniciás sesión."
    abrir: "https://account.microsoft.com/security"
  - texto: "Elegí agregar una nueva forma de iniciar sesión o verificarte, poné el correo nuevo (o configurá Authenticator) y escribí el código que te llega ahí."
  - texto: "Recién cuando el nuevo funciona, quitá el correo o el número viejo. Puede que en tu cuenta no aparezca la opción de agregar teléfono: en ese caso usá otro correo o Authenticator."
    abrir: "https://support.microsoft.com/account-billing/microsoft-account-security-info-verification-codes-bf2505ca-cae5-c5b4-77d1-69d3343a5452"
derivar: "Si reemplazás toda la información de seguridad de golpe, el cambio queda pendiente 30 días. Nadie legítimo te va a pedir los códigos que te llegan."
fuentes:
  - https://support.microsoft.com/account-billing/microsoft-account-security-info-verification-codes-bf2505ca-cae5-c5b4-77d1-69d3343a5452
  - https://support.microsoft.com/accounts-billing/manage/what-does-security-info-change-is-still-pending-mean
madurez: T0
