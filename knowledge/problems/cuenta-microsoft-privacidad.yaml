id: CMS-018
area: windows
titulo:
  sencillo: "Quiero elegir qué programas pueden ver mis contactos, mi cámara o mi micrófono"
  tecnico: "Permisos de aplicaciones en Privacidad y seguridad"
explicacion:
  sencillo: "En Windows podés decidir qué aplicaciones pueden usar tus contactos, el calendario, la cámara o el micrófono. Hay un interruptor general y uno para cada aplicación."
  tecnico: "Configuración > Privacidad y seguridad > permisos de aplicaciones (Contactos, Calendario, Cámara, Micrófono): interruptor general y por aplicación. No afecta a las aplicaciones de escritorio."
frases: ["qué aplicaciones pueden ver mis contactos", "sacarle permisos a una aplicación en windows", "no quiero que las apps vean mi calendario", "revisar los permisos de privacidad de las aplicaciones"]
pasos:
  - texto: "Abrí la página de Contactos en Privacidad y seguridad."
    abrir: "ms-settings:privacy-contacts"
  - texto: "Con el interruptor general decidís si alguna aplicación puede usarlos. Abajo, apagá las aplicaciones que no quieras que los vean."
  - texto: "Lo mismo podés hacer con el calendario, la cámara o el micrófono, desde la misma sección de Privacidad y seguridad."
    abrir: "ms-settings:privacy"
  - texto: "Los programas de escritorio no aparecen en esas listas: se configuran dentro de cada programa. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/privacy/windows-privacy-settings-that-apps-use"
fuentes:
  - https://support.microsoft.com/windows/privacy/windows-privacy-settings-that-apps-use
madurez: T0
