id: CMS-009
area: seguridad
titulo:
  sencillo: "Me hackearon la cuenta de Microsoft (Hotmail, Outlook)"
  tecnico: "Recuperar una cuenta Microsoft comprometida"
explicacion:
  sencillo: "Si alguien entró a tu cuenta, hay que revisar la compu por si tiene un virus, cambiar la contraseña y revisar que no te hayan dejado configurado un reenvío de tus correos. Si ya no podés entrar, Microsoft tiene un formulario oficial de recuperación."
  tecnico: "Examen completo con antivirus, cambio o restablecimiento de contraseña, revisión de cuentas conectadas, reenvío y respuestas automáticas; formulario de recuperación de cuenta si no hay acceso."
frases: ["me hackearon el hotmail", "alguien entró a mi cuenta outlook y manda correos", "me robaron la cuenta de microsoft", "me cambiaron la contraseña de mi correo de microsoft"]
pasos:
  - texto: "Primero revisá la compu: abrí Seguridad de Windows > «Protección contra virus y amenazas» > «Opciones de examen», elegí «Examen completo» y «Examinar ahora»."
    abrir: "ms-settings:windowsdefender"
  - texto: "Cambiá la contraseña desde la página de Seguridad de tu cuenta. Si ya no podés entrar, usá la opción para restablecerla en la pantalla de inicio de sesión."
    abrir: "https://account.microsoft.com/security"
  - texto: "Ya adentro, revisá en Outlook que no haya un reenvío de correos, respuestas automáticas o cuentas conectadas que no pusiste vos. Microsoft explica dónde está cada cosa."
    abrir: "https://support.microsoft.com/accounts-billing/manage/how-to-recover-a-hacked-or-compromised-microsoft-account"
  - texto: "Si no podés recuperarla con el código de seguridad, completá el formulario oficial de recuperación, mejor desde una compu y un lugar donde usaste la cuenta antes (tu casa o el trabajo). Poné un correo de contacto distinto que sí puedas leer y todos los datos que recuerdes."
    abrir: "https://support.microsoft.com/accounts-billing/manage/help-with-the-microsoft-account-recovery-form"
derivar: "El soporte de Microsoft no puede darte la contraseña ni mandarte enlaces para cambiarla. Desconfiá de quien te ofrezca «recuperar la cuenta» por teléfono o por redes."
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/how-to-recover-a-hacked-or-compromised-microsoft-account
  - https://support.microsoft.com/accounts-billing/manage/help-with-the-microsoft-account-recovery-form
  - https://support.microsoft.com/accounts-billing/manage/reset-a-forgotten-microsoft-account-password
madurez: T0
---
id: CMS-010
area: seguridad
titulo:
  sencillo: "Tengo que llenar el formulario de recuperación de mi cuenta de Microsoft"
  tecnico: "Formulario de recuperación de cuenta Microsoft"
explicacion:
  sencillo: "Cuando no podés entrar y no te llega ningún código, Microsoft tiene un formulario con preguntas que solo vos deberías saber. Lo revisan y te contestan en unas 24 horas al correo de contacto que pongas. Se puede mandar hasta dos veces por día."
  tecnico: "Formulario de recuperación: correo de contacto alternativo, contraseñas anteriores, asuntos de correos enviados, contactos; respuesta en 24 h, máximo dos intentos diarios. No aplica si la verificación en dos pasos está activa sin métodos alternativos."
frases: ["el formulario de recuperación de microsoft me rechaza", "qué pongo en el formulario para recuperar mi hotmail", "no me llega ningún código y no puedo entrar a mi cuenta microsoft", "cómo lleno el formulario de recuperación de outlook"]
pasos:
  - texto: "Antes probá restablecer la contraseña desde la pantalla de inicio de sesión, con «¿Olvidaste tu contraseña?». Si no reconocés el correo o teléfono que te ofrece, no lo elijas."
    abrir: "https://support.microsoft.com/accounts-billing/manage/reset-a-forgotten-microsoft-account-password"
  - texto: "Si no hay caso, completá el formulario desde una compu y un lugar donde usaste la cuenta antes. Necesitás un correo de contacto que funcione: puede ser el de un familiar."
    abrir: "https://support.microsoft.com/accounts-billing/manage/help-with-the-microsoft-account-recovery-form"
  - texto: "Contestá con todo lo que recuerdes: contraseñas viejas, a quiénes les escribías, asuntos exactos de correos que mandaste. Si no estás seguro, adiviná: equivocarte no te resta."
  - texto: "Esperá la respuesta en ese correo de contacto. Si no te aceptan, podés volver a intentarlo, como mucho dos veces por día."
derivar: "Si tenías la verificación en dos pasos activa y perdiste todos los métodos, Microsoft avisa que no puede ayudarte con el formulario. Nunca le pagues a nadie que prometa recuperarte la cuenta."
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/help-with-the-microsoft-account-recovery-form
  - https://support.microsoft.com/accounts-billing/manage/reset-a-forgotten-microsoft-account-password
madurez: T0
---
id: CMS-011
area: seguridad
titulo:
  sencillo: "Quiero cerrar la sesión de mi cuenta de Microsoft en todos los aparatos"
  tecnico: "Cerrar sesión en todas partes (cuenta Microsoft)"
explicacion:
  sencillo: "Si creés que alguien tiene tu cuenta abierta en otro lado, Microsoft te deja cerrar la sesión en todos los navegadores y aplicaciones de una vez. Puede tardar hasta 24 horas y no cierra la sesión de las consolas Xbox. Conviene hacerlo después de cambiar la contraseña."
  tecnico: "Seguridad > Opciones de seguridad avanzadas > Cerrar sesión en todas partes; efectivo en hasta 24 h; excluye consolas Xbox."
frases: ["cerrar mi hotmail en todas las compus", "cerrar la sesión de microsoft en todos lados", "dejé abierta mi cuenta outlook en otra compu", "sacar mi cuenta de microsoft de todos los dispositivos"]
pasos:
  - texto: "Si sospechás que alguien sabe tu contraseña, cambiala primero desde la página de Seguridad de tu cuenta."
  - texto: "En esa misma página, abrí las opciones de seguridad avanzadas."
    abrir: "https://account.microsoft.com/security"
  - texto: "Bajá hasta la parte de cerrar sesión en todas partes y tocá el botón para cerrar sesión. Tené en cuenta que puede tardar hasta 24 horas."
  - texto: "Si usás Xbox, cerrá la sesión de la consola aparte. Microsoft lo explica."
    abrir: "https://support.microsoft.com/accounts-billing/manage/how-to-sign-out-of-your-microsoft-account-everywhere"
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/how-to-sign-out-of-your-microsoft-account-everywhere
  - https://support.microsoft.com/accounts-billing/security/what-is-the-recent-activity-page
madurez: T0
