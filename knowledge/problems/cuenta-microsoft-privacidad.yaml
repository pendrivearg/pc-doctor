# Cuenta de Microsoft y privacidad: actividad rara, verificación en dos pasos, Authenticator, cuenta hackeada, permisos de Windows, Buscar mi dispositivo, firewall y protecciones del núcleo. Guiadas con fuente oficial.
id: CMS-001
area: seguridad
titulo:
  sencillo: "Quiero ver desde dónde entraron a mi cuenta de Microsoft"
  tecnico: "Página de actividad reciente de la cuenta Microsoft"
explicacion:
  sencillo: "Microsoft guarda una lista de cuándo y desde dónde se usó tu cuenta (Hotmail, Outlook) en los últimos 30 días. Si ves algo que no fuiste vos, se puede avisar y proteger la cuenta. Ojo: el lugar que muestra es aproximado, y con datos del celular puede aparecer otra ciudad aunque hayas sido vos."
  tecnico: "Actividad reciente (30 días): secciones «Actividad inusual» (Fui yo / No fui yo) y «Actividad reciente» (Proteger tu cuenta). Ubicación aproximada por IP."
frases: ["quiero ver quién entró a mi hotmail", "ver los inicios de sesión de mi cuenta de microsoft", "en mi cuenta outlook aparece un ingreso desde otro país", "cómo sé si alguien usó mi cuenta de microsoft"]
pasos:
  - texto: "Entrá a la página de Seguridad de tu cuenta de Microsoft escribiendo vos la dirección en el navegador (no desde un enlace de un correo). Desde ahí abrí la actividad reciente."
    abrir: "https://account.microsoft.com/security"
  - texto: "Tocá cada entrada para ver el lugar, el aparato y el navegador o la aplicación que se usó."
  - texto: "Si en «Actividad inusual» aparece algo que no hiciste, abrilo y elegí la opción que dice que no fuiste vos. Si está en «Actividad reciente», elegí la opción para proteger tu cuenta. Después cambiá la contraseña."
    abrir: "https://support.microsoft.com/accounts-billing/security/what-is-the-recent-activity-page"
derivar: "Nadie de Microsoft te va a pedir la contraseña ni te va a mandar un enlace para cambiarla. Si alguien lo hace, es una estafa."
fuentes:
  - https://support.microsoft.com/accounts-billing/security/what-is-the-recent-activity-page
  - https://support.microsoft.com/accounts-billing/security/what-happens-if-there-s-an-unusual-sign-in-to-your-account
madurez: T0
---
id: CMS-002
area: seguridad
titulo:
  sencillo: "Microsoft me avisó de un «inicio de sesión inusual» en mi cuenta"
  tecnico: "Alerta de actividad inusual en la cuenta Microsoft"
explicacion:
  sencillo: "Cuando alguien entra a tu cuenta desde un lugar o un aparato nuevo, Microsoft te manda un correo o un mensaje y a veces te pide un código para confirmar que sos vos. Puede pasar si viajaste o si estrenaste celular, pero también si alguien quiso entrar."
  tecnico: "Detección de inicio de sesión desde ubicación o dispositivo nuevo; alerta por correo/SMS y posible verificación con código. Revisión en Actividad reciente."
frases: ["me llegó un mail de actividad inusual en mi cuenta microsoft", "dice que detectaron un inicio de sesión raro en mi outlook", "microsoft me pide un código porque detectó actividad inusual", "me avisan que entraron a mi hotmail desde otro lado"]
pasos:
  - texto: "No toques los enlaces del aviso. Fijate primero quién lo manda: los avisos reales de la cuenta llegan de una dirección que termina en «@accountprotection.microsoft.com»."
  - texto: "Entrá vos a tu cuenta escribiendo la dirección en el navegador y abrí la actividad reciente desde la página de Seguridad."
    abrir: "https://account.microsoft.com/security"
  - texto: "Si no fuiste vos, elegí la opción que dice que no fuiste vos (o la de proteger tu cuenta) y cambiá la contraseña."
  - texto: "Si ya no podés entrar porque te cambiaron la contraseña, probá restablecerla. Microsoft lo explica."
    abrir: "https://support.microsoft.com/accounts-billing/security/what-happens-if-there-s-an-unusual-sign-in-to-your-account"
derivar: "Nadie legítimo te va a pedir por teléfono o por mensaje el código que te llega: no se lo des a nadie."
fuentes:
  - https://support.microsoft.com/accounts-billing/security/what-happens-if-there-s-an-unusual-sign-in-to-your-account
  - https://support.microsoft.com/accounts-billing/security/what-is-the-recent-activity-page
madurez: T0
---
id: CMS-003
area: seguridad
titulo:
  sencillo: "¿Este correo es de verdad de Microsoft o es falso?"
  tecnico: "Verificar correos del equipo de cuentas Microsoft"
explicacion:
  sencillo: "Los avisos reales de tu cuenta de Microsoft (códigos de seguridad, cambio de contraseña) llegan siempre de una dirección que termina en «@accountprotection.microsoft.com». Si te llega un código que no pediste, puede ser que alguien esté intentando entrar o que alguien se equivocó al escribir su correo."
  tecnico: "Remitente legítimo: dominio @accountprotection.microsoft.com (verificable en los encabezados). Código no solicitado = posible intento de acceso."
frases: ["me llegó un mail de microsoft y no sé si es verdadero", "cómo sé si un correo de microsoft es falso", "me mandaron un código de microsoft que no pedí", "un mail dice que es del equipo de cuentas microsoft"]
pasos:
  - texto: "Mirá la dirección completa de quien lo manda, no solo el nombre. Tiene que terminar exactamente en «@accountprotection.microsoft.com»."
  - texto: "Fijate que el correo hable de tu cuenta y que vos hayas pedido el código. Si no pediste nada, no lo uses ni se lo pases a nadie."
  - texto: "Ante la duda, no toques ningún enlace: entrá vos a tu cuenta escribiendo la dirección en el navegador y revisá si hay algo raro."
    abrir: "https://account.microsoft.com/security"
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/accounts-billing/security/can-i-trust-email-from-the-microsoft-account-team"
derivar: "El soporte de Microsoft no manda enlaces para cambiar la contraseña ni pide tu clave. Si un mensaje te los pide, es una estafa."
fuentes:
  - https://support.microsoft.com/accounts-billing/security/can-i-trust-email-from-the-microsoft-account-team
  - https://support.microsoft.com/accounts-billing/security/what-happens-if-there-s-an-unusual-sign-in-to-your-account
madurez: T0
---
id: CMS-004
area: seguridad
titulo:
  sencillo: "Quiero activar la verificación en dos pasos en mi cuenta de Microsoft"
  tecnico: "Verificación en dos pasos de la cuenta Microsoft"
explicacion:
  sencillo: "Con la verificación en dos pasos, para entrar a tu cuenta no alcanza con la contraseña: también hace falta un código o la aprobación desde el celular. Así, aunque alguien sepa tu clave, no puede entrar. Antes de activarla, asegurate de tener varias formas de comprobar que sos vos, porque si perdés todas podés quedarte afuera hasta 30 días."
  tecnico: "account.microsoft.com/security > administrar cómo inicio sesión > Seguridad adicional > Verificación en dos pasos > Activar. Se recomiendan tres métodos de seguridad."
frases: ["quiero poner doble verificación en mi hotmail", "activar la verificación en dos pasos de microsoft", "que mi cuenta outlook pida un código además de la clave", "proteger mi cuenta de microsoft con el celular"]
pasos:
  - texto: "Antes que nada, revisá que tu cuenta tenga más de una forma de verificarte (otro correo, la aplicación Authenticator). Microsoft recomienda tener tres."
  - texto: "Entrá a la página de Seguridad de tu cuenta y abrí la opción para administrar cómo iniciás sesión."
    abrir: "https://account.microsoft.com/security"
  - texto: "En la parte de seguridad adicional, buscá «Verificación en dos pasos», elegí activarla y seguí las instrucciones. Si usás la aplicación Authenticator, vas a tener que escanear un código con el celular."
  - texto: "Si después algún programa viejo te dice que la contraseña es incorrecta, puede necesitar una contraseña de aplicación. Microsoft lo explica."
    abrir: "https://support.microsoft.com/accounts-billing/security/how-to-use-two-step-verification-with-your-microsoft-account"
fuentes:
  - https://support.microsoft.com/accounts-billing/security/how-to-use-two-step-verification-with-your-microsoft-account
madurez: T0
---
id: CMS-005
area: seguridad
titulo:
  sencillo: "Quiero tener un código de recuperación por si pierdo el acceso a mi cuenta de Microsoft"
  tecnico: "Código de recuperación de la cuenta Microsoft"
explicacion:
  sencillo: "El código de recuperación es un código largo (25 caracteres) que sirve para volver a entrar a tu cuenta si te olvidás la contraseña o si te la roban. Conviene imprimirlo y guardarlo en un lugar seguro, no en la compu ni en el celular con el que entrás."
  tecnico: "Código de 25 caracteres generado en administrar cómo inicio sesión > Código de recuperación. Generar uno nuevo invalida el anterior; no se puede volver a ver el existente."
frases: ["dónde saco el código de recuperación de microsoft", "quiero un código de respaldo para mi hotmail", "perdí el código de recuperación de mi cuenta outlook", "para qué sirve el código de recuperación de microsoft"]
pasos:
  - texto: "Entrá a la página de Seguridad de tu cuenta y abrí la opción para administrar cómo iniciás sesión."
    abrir: "https://account.microsoft.com/security"
  - texto: "Bajá hasta la parte del código de recuperación y elegí generar uno nuevo. Ojo: apenas creás uno nuevo, el anterior deja de funcionar."
  - texto: "Imprimilo o anotalo en papel y guardalo en un lugar seguro. No lo guardes en el aparato con el que entrás a la cuenta y no se lo pases a nadie."
  - texto: "Si un día lo necesitás, se usa desde la opción «¿Olvidaste tu contraseña?» al iniciar sesión. Microsoft lo explica paso a paso."
    abrir: "https://support.microsoft.com/accounts-billing/manage/how-to-get-a-microsoft-account-recovery-code"
derivar: "Nadie legítimo te va a pedir este código. Si no podés entrar a la cuenta para generarlo, usá el asistente de inicio de sesión de Microsoft."
fuentes:
  - https://support.microsoft.com/accounts-billing/manage/how-to-get-a-microsoft-account-recovery-code
madurez: T0
