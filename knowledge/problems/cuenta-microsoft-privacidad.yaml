id: CMS-023
area: seguridad
titulo:
  sencillo: "El firewall de Windows no deja que un programa se conecte"
  tecnico: "Permitir una aplicación a través del Firewall de Windows"
explicacion:
  sencillo: "El firewall es una barrera que frena conexiones peligrosas. A veces frena un programa que sí es de confianza (un juego en red, un programa del trabajo). Se le puede dar permiso a ese programa solo, sin apagar el firewall. Hacelo únicamente con programas que conocés."
  tecnico: "Seguridad de Windows > Firewall y protección de red > Permitir una aplicación a través del firewall > Cambiar la configuración > marcar la aplicación o Permitir otra aplicación."
frases: ["el firewall bloquea un programa", "windows no deja que un juego se conecte a internet", "dar permiso a un programa en el firewall", "el firewall no deja entrar a un programa del trabajo"]
pasos:
  - texto: "Abrí Seguridad de Windows y entrá a «Firewall y protección de red»."
    abrir: "ms-settings:windowsdefender"
  - texto: "Tocá la opción para permitir una aplicación a través del firewall y después «Cambiar la configuración» (te puede pedir permiso de administrador)."
  - texto: "Marcá la casilla del programa. Si no está en la lista, usá «Permitir otra aplicación» y buscalo. Nunca permitas un programa que no reconocés."
    abrir: "https://support.microsoft.com/windows/security/firewall/risks-of-allowing-apps-through-windows-firewall"
  - texto: "Cuando ya no lo uses, volvé y desmarcalo. No apagues el firewall para que el programa ande."
fuentes:
  - https://support.microsoft.com/windows/security/firewall/risks-of-allowing-apps-through-windows-firewall
madurez: T0
