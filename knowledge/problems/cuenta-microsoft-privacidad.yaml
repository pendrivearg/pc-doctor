id: CMS-006
area: seguridad
titulo:
  sencillo: "Quiero instalar Microsoft Authenticator en el celular"
  tecnico: "Instalar Microsoft Authenticator y agregar la cuenta personal"
explicacion:
  sencillo: "Microsoft Authenticator es una aplicación gratuita para el celular que te da los códigos para entrar a tu cuenta o te pide que apruebes el ingreso con un toque. No existe para la computadora: solo para celulares Android y iPhone."
  tecnico: "Instalación desde Google Play o App Store; alta en account.microsoft.com/security > administrar cómo inicio sesión > Usar una aplicación; en el celular: + > Cuenta personal > Escanear un código QR."
frases: ["cómo instalo el authenticator de microsoft", "me piden la aplicación microsoft authenticator", "bajar authenticator en el celular", "agregar mi cuenta hotmail al authenticator"]
pasos:
  - texto: "En el celular, abrí Google Play (Android) o la App Store (iPhone), buscá «Microsoft Authenticator» e instalalo. Bajalo solo de la tienda oficial."
    abrir: "https://support.microsoft.com/authenticator/download-microsoft-authenticator"
  - texto: "En la compu, entrá a la página de Seguridad de tu cuenta, abrí la opción para administrar cómo iniciás sesión y agregá una nueva forma de verificarte usando una aplicación. Va a aparecer un código cuadrado (QR)."
    abrir: "https://account.microsoft.com/security"
  - texto: "En el celular, abrí Authenticator, tocá el «+», elegí cuenta personal y escaneá el código de la pantalla. Si no lo podés escanear, hay una opción para escribir el código a mano."
  - texto: "Microsoft lo explica con imágenes."
    abrir: "https://support.microsoft.com/authenticator/how-to-add-your-accounts-to-microsoft-authenticator"
fuentes:
  - https://support.microsoft.com/authenticator/download-microsoft-authenticator
  - https://support.microsoft.com/authenticator/how-to-add-your-accounts-to-microsoft-authenticator
madurez: T0
---
id: CMS-007
area: seguridad
titulo:
  sencillo: "Cambio de celular y no quiero perder lo que tengo en Microsoft Authenticator"
  tecnico: "Copia de seguridad y restauración de Microsoft Authenticator"
explicacion:
  sencillo: "Authenticator puede guardar una copia de tus cuentas para pasarlas al celular nuevo, pero hay que activarla antes de cambiar. Solo funciona entre celulares del mismo tipo (de Android a Android o de iPhone a iPhone). Si cambiás de Android a iPhone o al revés, hay que volver a agregar las cuentas a mano."
  tecnico: "Android: Configuración > Copia de seguridad en la nube con cuenta Microsoft personal. iPhone: iCloud Drive, Llavero e iCloud Backup. Restaurar con «Iniciar recuperación». Las credenciales sin contraseña y de trabajo no se respaldan."
frases: ["cambié el celular y perdí el authenticator", "pasar microsoft authenticator al teléfono nuevo", "cómo hago copia de seguridad del authenticator", "me compré otro celular y no me llegan las aprobaciones de microsoft"]
pasos:
  - texto: "En el celular viejo, antes de cambiarlo: en Android, abrí Authenticator, tocá los tres puntos > Configuración y activá la copia de seguridad en la nube con tu cuenta de Microsoft. En iPhone, tené activados iCloud Drive, el Llavero de iCloud y la copia de iCloud."
    abrir: "https://support.microsoft.com/authenticator/back-up-your-accounts-in-microsoft-authenticator"
  - texto: "En el celular nuevo, instalá Authenticator y, antes de agregar ninguna cuenta, elegí la opción para recuperar desde la copia de seguridad. Entrá con la misma cuenta de Microsoft que usaste para la copia."
    abrir: "https://support.microsoft.com/authenticator/restore-account-credentials-from-microsoft-authenticator"
  - texto: "Si alguna cuenta dice que tenés que iniciar sesión para recuperarla, entrá de nuevo. El inicio sin contraseña y las cuentas del trabajo no se copian: se configuran otra vez."
  - texto: "No borres nada del celular viejo hasta comprobar que en el nuevo todo funciona."
fuentes:
  - https://support.microsoft.com/authenticator/back-up-your-accounts-in-microsoft-authenticator
  - https://support.microsoft.com/authenticator/restore-account-credentials-from-microsoft-authenticator
madurez: T0
---
id: CMS-008
area: seguridad
titulo:
  sencillo: "Quiero entrar a mi cuenta de Microsoft sin contraseña, aprobando desde el celular"
  tecnico: "Cuenta Microsoft sin contraseña (passwordless)"
explicacion:
  sencillo: "Microsoft te deja quitar la contraseña de tu cuenta y entrar aprobando desde la aplicación Authenticator, con Windows Hello o con una llave de seguridad. Sin contraseña no hay nada que te puedan robar. Algunos programas y aparatos viejos todavía piden contraseña."
  tecnico: "Administrar cómo inicio sesión > Cuenta sin contraseña > Activar; requiere Authenticator (u Outlook para Android). Se puede desactivar y volver a poner una contraseña."
frases: ["quiero entrar a hotmail sin poner la contraseña", "sacar la contraseña de mi cuenta microsoft", "entrar a mi cuenta aprobando desde el celular", "qué es la cuenta sin contraseña de microsoft"]
pasos:
  - texto: "Primero instalá Microsoft Authenticator en el celular y agregá tu cuenta."
    abrir: "https://support.microsoft.com/authenticator/how-to-add-your-accounts-to-microsoft-authenticator"
  - texto: "En la compu, entrá a la página de Seguridad de tu cuenta y abrí la opción para administrar cómo iniciás sesión."
    abrir: "https://account.microsoft.com/security"
  - texto: "Buscá la parte de cuenta sin contraseña, elegí activarla, seguí los pasos y aprobá el aviso que te llega a Authenticator."
  - texto: "Si cambiás o perdés el celular, quitá ese aparato de las opciones de seguridad avanzadas de tu cuenta. Microsoft lo explica."
    abrir: "https://support.microsoft.com/accounts-billing/security/how-to-go-passwordless-with-your-microsoft-account"
fuentes:
  - https://support.microsoft.com/accounts-billing/security/how-to-go-passwordless-with-your-microsoft-account
madurez: T0
