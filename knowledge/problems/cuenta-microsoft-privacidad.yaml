id: CMS-021
area: seguridad
titulo:
  sencillo: "Me robaron o perdí la notebook y quiero encontrarla o bloquearla"
  tecnico: "Buscar mi dispositivo (Windows)"
explicacion:
  sencillo: "Si la notebook tenía activado «Buscar mi dispositivo», podés verla en un mapa y bloquearla desde otra compu o el celular, entrando a tu cuenta de Microsoft. Tiene que haber estado activado antes de perderla, con la ubicación prendida y una cuenta de Microsoft."
  tecnico: "Requiere Buscar mi dispositivo activado, ubicación activa, cuenta Microsoft personal con rol de administrador. account.microsoft.com/devices > Buscar mi dispositivo > Buscar / Bloquear."
frases: ["me robaron la notebook y quiero encontrarla", "cómo bloqueo la compu que perdí", "activar buscar mi dispositivo en windows", "ver en el mapa dónde está mi notebook"]
pasos:
  - texto: "Si todavía la tenés, activalo ahora para el día que haga falta."
    abrir: "ms-settings:findmydevice"
  - texto: "Si ya la perdiste, desde otro aparato entrá a la página de dispositivos de tu cuenta de Microsoft, abrí la pestaña de Buscar mi dispositivo, elegí la notebook y tocá «Buscar»."
    abrir: "https://account.microsoft.com/devices"
  - texto: "Para bloquearla, en el mapa tocá «Bloquear» y seguí los pasos. Después cambiá la contraseña de tu cuenta."
    abrir: "https://support.microsoft.com/accounts-billing/security/find-and-lock-a-lost-windows-device"
  - texto: "Hacé la denuncia y avisale al seguro. El número de serie figura en la misma página de dispositivos."
fuentes:
  - https://support.microsoft.com/accounts-billing/security/find-and-lock-a-lost-windows-device
madurez: T0
