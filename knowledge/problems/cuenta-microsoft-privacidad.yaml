id: CMS-022
area: seguridad
titulo:
  sencillo: "Quiero que la compu se bloquee sola cuando me alejo con el celular"
  tecnico: "Bloqueo dinámico"
explicacion:
  sencillo: "Si el celular está conectado por Bluetooth a la compu, Windows puede bloquearse solo cuando te alejás con el celular en el bolsillo, en menos de un minuto. Es una ayuda extra: lo mejor sigue siendo bloquearla vos con Windows + L."
  tecnico: "Configuración > Cuentas > Opciones de inicio de sesión > Bloqueo dinámico; requiere teléfono emparejado por Bluetooth. Bloquea cuando baja la señal y el equipo está inactivo."
frases: ["que la compu se bloquee sola cuando me levanto", "bloquear la pc cuando me voy con el celular", "qué es el bloqueo dinámico de windows", "la compu se bloquea sola cuando me alejo"]
pasos:
  - texto: "Primero emparejá el celular con la compu por Bluetooth."
    abrir: "ms-settings:bluetooth"
  - texto: "Abrí las opciones de inicio de sesión, buscá «Bloqueo dinámico» en la configuración adicional y activalo."
    abrir: "ms-settings:signinoptions-dynamiclock"
  - texto: "Cuando te alejes con el celular, la compu se bloquea en menos de un minuto. Si se te bloquea sin querer, apagalo desde el mismo lugar."
    abrir: "https://support.microsoft.com/en-us/help/4028111/windows-lock-your-windows-10-pc-automatically-when-you-step-away-from"
fuentes:
  - https://support.microsoft.com/en-us/help/4028111/windows-lock-your-windows-10-pc-automatically-when-you-step-away-from
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/hello-feature-dynamic-lock
madurez: T0
