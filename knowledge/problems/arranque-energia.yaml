# Arranque, UEFI/BIOS y energía: inicio rápido, suspender e hibernar, tapa y botón, modos de energía, batería, recuperación y arranque. Guiadas con fuente oficial.
id: ENE-001
area: windows
titulo:
  sencillo: "Apagué la compu y el problema sigue igual: ¿apagar o reiniciar?"
  tecnico: "Inicio rápido (Fast Startup): apagado híbrido frente a reinicio completo"
explicacion:
  sencillo: "Windows viene con el «inicio rápido»: cuando tocás «Apagar», en realidad guarda una parte de Windows en el disco para prender más rápido la próxima vez. Por eso, si algo anda mal, lo que sirve es «Reiniciar», que sí arranca Windows de cero."
  tecnico: "Con Fast Startup, Apagar cierra la sesión e hiberna la sesión del kernel en hiberfil.sys (S4); Reiniciar hace un arranque completo. shutdown /s /t 0 fuerza un apagado completo."
frases: ["apago la compu y el problema sigue igual", "qué diferencia hay entre apagar y reiniciar", "conviene sacar el inicio rápido de windows", "la compu no se apaga del todo"]
pasos:
  - texto: "Cuando algo ande raro, andá a Inicio > botón de encendido > «Reiniciar» (no «Apagar»). El reinicio no usa el inicio rápido: arranca Windows completo."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/deployment/fast-startup-causes-system-hibernation-shutdown-fail"
  - texto: "Si alguna vez necesitás apagarla del todo, guardá lo que tengas abierto, apretá Windows + R, escribí «shutdown /s /t 0» y tocá «Aceptar»: se apaga en el acto, sin inicio rápido."
  - texto: "El inicio rápido viene activado de fábrica y Microsoft no recomienda desactivarlo. Dejalo como está, salvo que un técnico te lo pida por un problema puntual."
  - texto: "Microsoft explica cómo funcionan el apagado, la hibernación y el inicio rápido."
    abrir: "https://learn.microsoft.com/windows/win32/power/system-power-states"
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/deployment/fast-startup-causes-system-hibernation-shutdown-fail
  - https://learn.microsoft.com/windows/win32/power/system-power-states
madurez: T0
