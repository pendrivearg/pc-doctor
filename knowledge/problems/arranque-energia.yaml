id: ENE-023
area: hardware
titulo:
  sencillo: "Al prender dice que no encuentra el disco («No bootable device»)"
  tecnico: "El firmware no detecta un disco de arranque (fase PreBoot)"
explicacion:
  sencillo: "Antes de Windows, la placa busca un disco para arrancar. Si no lo encuentra, muestra un cartel en inglés como «No bootable device» o «Boot device not found». Puede ser un pendrive puesto, el orden de arranque cambiado o un disco que falla."
  tecnico: "Fallo en la fase PreBoot: el firmware no encuentra un disco de sistema válido. Revisar periféricos, presencia del disco en el firmware y orden de arranque; si el disco no aparece, sospechar hardware."
frases: ["dice no bootable device al prender", "la compu no encuentra el disco al arrancar", "sale boot device not found", "dice que no hay disco de arranque"]
pasos:
  - texto: "Sacá pendrives, discos externos, tarjetas de memoria y CD, y prendé de nuevo."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/performance/windows-boot-issues-troubleshooting"
  - texto: "Entrá a la configuración de la placa apretando la tecla del fabricante apenas la prendés (Esc, Supr, F1, F2, F10, F11 o F12) y fijate si el disco aparece en la lista de arranque. Mirá sin cambiar otras opciones."
    abrir: "https://learn.microsoft.com/windows-hardware/manufacture/desktop/boot-to-uefi-mode-or-legacy-bios-mode"
  - texto: "Si el disco aparece pero no está primero en el orden de arranque, ponelo primero, guardá y reiniciá."
    abrir: "https://www.microsoft.com/software-download/windows11"
  - texto: "Si el disco no aparece en ningún lado, es probable que sea un problema físico (el disco o su conexión). No reinstales Windows: si tus archivos son importantes, primero hay que rescatarlos."
derivar: "Cuando el disco no figura en la configuración de la placa, hace falta revisar el hardware: un técnico puede ver si es el disco, el cable o la placa, y recuperar lo que se pueda."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/windows-boot-issues-troubleshooting
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/boot-to-uefi-mode-or-legacy-bios-mode
  - https://www.microsoft.com/software-download/windows11
