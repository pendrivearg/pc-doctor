id: ENE-008
area: windows
titulo:
  sencillo: "Quiero elegir qué hace el botón de encendido"
  tecnico: "Acción del botón de inicio/apagado"
explicacion:
  sencillo: "Al apretar una vez el botón de encendido con la compu prendida, Windows puede suspenderla, hibernarla, apagarla o no hacer nada. Eso se cambia en las Opciones de energía."
  tecnico: "Opciones de energía > Elegir el comportamiento del botón de inicio/apagado > Al presionar el botón de inicio/apagado (Con batería / Conectado)."
frases: ["aprieto el botón de prender y se suspende", "que el botón de encendido apague la compu", "cambiar lo que hace el botón de encendido", "toco el botón sin querer y se apaga"]
pasos:
  - texto: "Buscá «panel de control» en la lupa y abrí «Sistema y seguridad» > «Opciones de energía» > «Elegir el comportamiento del botón de inicio/apagado»."
    abrir: "https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff"
  - texto: "En «Al presionar el botón de inicio/apagado» elegí lo que prefieras (por ejemplo «Suspender» o «Apagar»). En las notebooks hay un valor «Con batería» y otro «Conectado»."
  - texto: "Tocá «Guardar cambios». Si en tu casa hay chicos que tocan el botón sin querer, «Suspender» es más seguro que «Apagar»: no se pierde lo que tenías abierto."
fuentes:
  - https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff
madurez: T0
