id: ENE-019
area: seguridad
titulo:
  sencillo: "Me avisan que los certificados del Arranque seguro vencen en 2026"
  tecnico: "Vencimiento de los certificados de Secure Boot de 2011 y paso a los de 2023"
explicacion:
  sencillo: "El Arranque seguro usa unos «certificados» de Microsoft de 2011 que empezaron a vencer en junio de 2026. La mayoría de las compus reciben los nuevos solas por Windows Update. Si una no los tiene, igual prende y funciona, pero deja de recibir protecciones nuevas para el arranque."
  tecnico: "Las CA de Secure Boot de 2011 vencen desde junio de 2026 y se reemplazan por las CA 2023 vía Windows Update; algunos equipos necesitan además una actualización de firmware del fabricante. Estado en Seguridad de Windows > Seguridad del dispositivo > Arranque seguro."
frases: ["vencen los certificados del arranque seguro", "secure boot certificados 2026", "dice que hay que actualizar el arranque seguro", "aviso amarillo en arranque seguro en seguridad de windows"]
pasos:
  - texto: "Instalá todas las actualizaciones de Windows y reiniciá cuando te lo pida: los certificados nuevos llegan por ahí."
    abrir: "ms-settings:windowsupdate"
  - texto: "Para ver cómo está tu compu: Seguridad de Windows > «Seguridad del dispositivo» > «Arranque seguro». Si está en verde y dice que ya se aplicaron todas las actualizaciones, no hay que hacer nada. Si está en amarillo o rojo, leé el mensaje."
    abrir: "https://support.microsoft.com/en-us/topic/secure-boot-certificate-update-status-in-the-windows-security-app-5ce39986-7dd2-4852-8c21-ef30dd04f046"
  - texto: "Si el mensaje dice que tu equipo no admite la actualización automática por limitaciones de hardware o firmware, consultá al fabricante si hay una actualización de BIOS/UEFI para tu modelo."
    abrir: "https://support.microsoft.com/en-us/servicing/os/secure-boot/2026/02/when-secure-boot-certificates-expire-on-windows-devices"
  - texto: "No desactives el Arranque seguro para «esquivar» el vencimiento: Microsoft lo desaconseja porque deja la compu mucho menos protegida."
fuentes:
  - https://support.microsoft.com/en-us/servicing/os/secure-boot/2026/02/when-secure-boot-certificates-expire-on-windows-devices
  - https://support.microsoft.com/en-us/topic/secure-boot-certificate-update-status-in-the-windows-security-app-5ce39986-7dd2-4852-8c21-ef30dd04f046
