id: ENE-015
area: rendimiento
titulo:
  sencillo: "La compu tarda mucho en apagarse"
  tecnico: "Apagado lento: aplicaciones o servicios que demoran el cierre, actualizaciones pendientes"
explicacion:
  sencillo: "Al apagar, Windows primero cierra todos los programas. Si alguno tarda en cerrarse o quedó trabado, o si Windows está instalando actualizaciones, el apagado se hace largo."
  tecnico: "El apagado cierra las aplicaciones y las sesiones antes de hibernar el kernel (inicio rápido) o apagar; las demoras suelen venir de software o servicios de terceros o de actualizaciones pendientes. Se aísla con un arranque limpio (msconfig)."
frases: ["la compu tarda mucho en apagarse", "se queda apagando un montón de tiempo", "queda la ruedita girando al apagar", "tarda años en apagarse la notebook"]
pasos:
  - texto: "Antes de apagar, guardá y cerrá vos los programas abiertos: Windows tiene que cerrarlos todos antes de terminar."
    abrir: "https://learn.microsoft.com/windows-hardware/drivers/kernel/distinguishing-fast-startup-from-wake-from-hibernation"
  - texto: "Si en el botón de encendido aparecía «Actualizar y apagar», es esperable que tarde más: está instalando actualizaciones. Dejala terminar."
    abrir: "https://support.microsoft.com/en-us/servicing/os/windows/docs/2026/07/kb5121772-one-restart-a-month-for-windows-updates"
  - texto: "Si tarda siempre, probá un «arranque limpio» para ver si la culpa es de algún programa: buscá «msconfig» y abrí Configuración del sistema; en «Servicios» ocultá los de Microsoft y deshabilitá el resto; en «Inicio» abrí el Administrador de tareas y deshabilitá lo que arranca solo (anotá qué apagaste). Reiniciá y probá apagar."
    abrir: "https://support.microsoft.com/topic/how-to-perform-a-clean-boot-in-windows-da2f9573-6eec-00ad-2f8a-a97a1807f3dd"
  - texto: "Si así se apaga rápido, el culpable es uno de esos programas: volvé a activarlos de a poco hasta encontrarlo. Para dejar todo como antes, en msconfig elegí «Inicio normal», volvé a habilitar los servicios y los programas de inicio."
  - texto: "Si no te animás a tocar msconfig, pedí ayuda: usado mal puede dejar la compu inestable."
fuentes:
  - https://support.microsoft.com/topic/how-to-perform-a-clean-boot-in-windows-da2f9573-6eec-00ad-2f8a-a97a1807f3dd
  - https://learn.microsoft.com/windows-hardware/drivers/kernel/distinguishing-fast-startup-from-wake-from-hibernation
  - https://support.microsoft.com/en-us/servicing/os/windows/docs/2026/07/kb5121772-one-restart-a-month-for-windows-updates
madurez: T0
