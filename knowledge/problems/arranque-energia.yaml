id: ENE-003
area: windows
titulo:
  sencillo: "No me aparece la opción «Hibernar» al apagar"
  tecnico: "Agregar Hibernar al menú de energía"
explicacion:
  sencillo: "Windows trae la opción «Hibernar» escondida. Se agrega desde las Opciones de energía del Panel de control. En algunas computadoras nuevas directamente no existe, y no es una falla."
  tecnico: "Opciones de energía > Elegir el comportamiento del botón de inicio/apagado > Cambiar la configuración actualmente no disponible > Configuración de apagado > Hibernar. Requiere el archivo de hibernación (powercfg /hibernate on). No disponible en equipos InstantGo."
frases: ["no me aparece la opción hibernar", "cómo agrego hibernar al menú de apagado", "en el botón de apagar no está hibernar", "quiero hibernar la notebook y no puedo"]
pasos:
  - texto: "Buscá «panel de control» en la lupa y abrilo. Entrá a «Sistema y seguridad» > «Opciones de energía» > «Elegir el comportamiento del botón de inicio/apagado» (en Windows 10 se llama «Elegir qué hacen los botones de inicio/apagado»)."
    abrir: "https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff"
  - texto: "Tocá «Cambiar la configuración actualmente no disponible». Abajo, en «Configuración de apagado», marcá «Hibernar» y tocá «Guardar cambios». Desde ahora aparece en Inicio > botón de encendido."
  - texto: "Si la casilla «Hibernar» no está, puede que la hibernación esté apagada. Buscá «cmd», hacé clic derecho en «Símbolo del sistema» > «Ejecutar como administrador», escribí «powercfg /hibernate on» y Enter. Después repetí el paso anterior."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/disable-and-re-enable-hibernation"
  - texto: "Si aun así no aparece, tu computadora no ofrece hibernar (pasa en algunas con el modo de espera moderno). Para muchas horas sin usarla, apagala."
fuentes:
  - https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff
  - https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/disable-and-re-enable-hibernation
madurez: T0
