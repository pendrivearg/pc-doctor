id: ENE-006
area: windows
titulo:
  sencillo: "Quiero suspender la compu y se apaga del todo"
  tecnico: "Se apaga en lugar de suspenderse: acción del botón o tapa y estados disponibles (powercfg /a)"
explicacion:
  sencillo: "Si al suspender, cerrar la tapa o apretar el botón la compu se apaga del todo, puede ser que esté configurada para «Apagar», que la batería estuviera muy baja o que esa compu no tenga la suspensión disponible. Windows te puede decir qué modos tiene."
  tecnico: "Acción del botón de inicio/apagado o de la tapa configurada en Apagar; apagado por batería crítica; o estados de suspensión no disponibles (powercfg /availablesleepstates)."
frases: ["cuando la suspendo se apaga del todo", "cierro la tapa y se apaga en vez de dormirse", "no me aparece la opción suspender", "la pc se apaga cuando quiero que se duerma"]
pasos:
  - texto: "Panel de control > «Sistema y seguridad» > «Opciones de energía» > «Elegir el comportamiento del botón de inicio/apagado». Si el botón o la tapa dicen «Apagar», cambialos a «Suspender» y tocá «Guardar cambios»."
    abrir: "https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff"
  - texto: "Si pasó con la batería casi vacía, es normal: Windows guarda lo tuyo y la apaga. Probá suspenderla enchufada."
  - texto: "Para ver qué modos tiene tu compu: buscá «cmd», abrí «Símbolo del sistema», escribí «powercfg /a» y Enter. Muestra los modos de suspensión disponibles y, si falta alguno, intenta explicar por qué."
    abrir: "https://learn.microsoft.com/windows-hardware/design/device-experiences/powercfg-command-line-options"
  - texto: "Si la suspensión no figura como disponible, pasá el diagnóstico de PC Doctor y guardá lo que dice ese comando para mostrárselo a un técnico."
fuentes:
  - https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/powercfg-command-line-options
madurez: T0
