id: ENE-013
area: rendimiento
titulo:
  sencillo: "Quiero usar el «Ahorro de energía» de Windows 11"
  tecnico: "Ahorro de energía (Energy saver, Windows 11 24H2 o posterior)"
explicacion:
  sencillo: "En Windows 11 nuevo, el «Ahorro de energía» reemplazó al viejo ahorro de batería. Baja un poco el brillo y frena tareas de fondo para gastar menos. Se puede prender cuando quieras, hacer que se active solo con poca batería o dejarlo siempre, incluso enchufada."
  tecnico: "Energy saver: se activa desde Configuración rápida, en forma automática según el porcentaje de batería, o siempre (también conectado). Reduce el brillo 30 %, desactiva la transparencia y bloquea el cambio de modo de energía; con batería baja limita apps en segundo plano, sincronización y descargas no críticas de Windows Update."
frases: ["activar el ahorro de energía en windows 11", "que la compu gaste menos luz", "dónde está el ahorro de batería en windows 11", "con el ahorro de energía se oscurece la pantalla"]
pasos:
  - texto: "La forma rápida: tocá el ícono de la batería (o de energía) abajo a la derecha y activá «Ahorro de energía»."
    abrir: "https://learn.microsoft.com/windows-hardware/design/component-guidelines/energy-saver"
  - texto: "Para que se active solo o quede siempre prendido: Configuración > Sistema > Energía y batería > «Ahorro de energía». Ahí elegís el porcentaje de batería en que se enciende o la opción de usarlo siempre."
    abrir: "ms-settings:powersleep"
  - texto: "Mientras está activo, el brillo baja un 30 % (esa parte se puede desactivar) y no se puede cambiar el modo de energía."
  - texto: "Con la batería baja y desenchufada, además frena aplicaciones en segundo plano y algunas sincronizaciones (OneDrive, OneNote): si algo no se actualiza, puede ser por esto."
    abrir: "https://support.microsoft.com/windows/experience/power-battery/battery-saving-tips-for-windows"
fuentes:
  - https://learn.microsoft.com/windows-hardware/design/component-guidelines/energy-saver
  - https://support.microsoft.com/windows/experience/power-battery/battery-saving-tips-for-windows
madurez: T0
