id: ENE-017
area: windows
titulo:
  sencillo: "Quiero que la compu arranque desde un pendrive"
  tecnico: "Menú de arranque y orden de arranque (boot order)"
explicacion:
  sencillo: "Para instalar Windows o usar un pendrive de rescate, la compu tiene que arrancar desde el pendrive y no desde el disco. Eso se elige en el menú de arranque de la placa, que se abre con una tecla al prender."
  tecnico: "Menú de arranque del firmware (tecla del fabricante) o Inicio avanzado > Usar un dispositivo (solo UEFI); elegir la entrada UEFI del USB. El Arranque seguro puede ocultar medios no firmados."
frases: ["arrancar la compu desde un pendrive", "cambiar el orden de arranque", "la pc no bootea desde el usb", "cómo hago para que arranque del pendrive"]
pasos:
  - texto: "Con el pendrive puesto, prendé la PC y apretá varias veces la tecla del menú de arranque o de configuración (suele ser F2, F12, Supr o Esc; muchas veces aparece en pantalla al prender)."
    abrir: "https://www.microsoft.com/software-download/windows11"
  - texto: "Elegí el pendrive en la lista. Si aparece dos veces, elegí el que dice «UEFI» (por ejemplo, «UEFI: USB»)."
    abrir: "https://learn.microsoft.com/windows-hardware/manufacture/desktop/boot-to-uefi-mode-or-legacy-bios-mode"
  - texto: "Si Windows prende bien, también podés hacerlo desde ahí: Inicio > botón de encendido > Mayús + «Reiniciar» > «Usar un dispositivo», y elegí el pendrive."
  - texto: "Si el pendrive no aparece en la lista, puede ser por el Arranque seguro. No lo desactives por tu cuenta: consultá la ayuda del fabricante de tu PC."
  - texto: "Si cambiaste el orden de arranque, cuando termines volvé a poner el disco primero para que la PC arranque normal."
fuentes:
  - https://www.microsoft.com/software-download/windows11
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/boot-to-uefi-mode-or-legacy-bios-mode
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-recovery-environment--windows-re--technical-reference
