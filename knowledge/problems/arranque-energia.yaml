id: ENE-020
area: windows
titulo:
  sencillo: "Quiero entrar a las opciones de recuperación de Windows"
  tecnico: "Inicio avanzado y Entorno de recuperación de Windows (WinRE)"
explicacion:
  sencillo: "Windows tiene una «sala de reparaciones» que se abre antes de que arranque: desde ahí se pueden desinstalar actualizaciones, volver a un punto anterior, iniciar en modo seguro o restablecer la compu."
  tecnico: "Inicio avanzado (Configuración > Sistema > Recuperación > Reiniciar ahora, o Mayús + Reiniciar) arranca WinRE: Solucionar problemas > Opciones avanzadas (Desinstalar actualizaciones, Restaurar sistema, Configuración de inicio) o Restablecer este equipo."
frases: ["cómo entro al inicio avanzado", "abrir las opciones de recuperación de windows", "entrar a solucionar problemas antes de que arranque windows", "reiniciar con shift para reparar"]
pasos:
  - texto: "Guardá todo. Andá a Configuración > Sistema > Recuperación y, en «Inicio avanzado», tocá «Reiniciar ahora»."
    abrir: "ms-settings:recovery"
  - texto: "Si no podés entrar a tu usuario: en la pantalla de inicio de sesión tocá el botón de encendido, mantené apretada la tecla Mayús y elegí «Reiniciar»."
    abrir: "https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-recovery-environment--windows-re--technical-reference"
  - texto: "En la pantalla azul, entrá a «Solucionar problemas» > «Opciones avanzadas». Ahí están, entre otras, «Desinstalar actualizaciones» y «Restaurar sistema». «Restablecer este equipo» es lo último: reinstala Windows."
    abrir: "https://support.microsoft.com/windows/recovery-options-in-windows-31ce2444-7de3-818c-d626-e3b5a3024da5"
  - texto: "Si te pide la clave de recuperación de BitLocker, escribile a PC Doctor «dónde encuentro la clave de recuperación de BitLocker»."
fuentes:
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-recovery-environment--windows-re--technical-reference
  - https://support.microsoft.com/windows/recovery-options-in-windows-31ce2444-7de3-818c-d626-e3b5a3024da5
