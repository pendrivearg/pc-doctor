id: ENE-007
area: windows
titulo:
  sencillo: "Quiero cerrar la tapa de la notebook sin que se duerma"
  tecnico: "Acción al cerrar la tapa"
explicacion:
  sencillo: "Lo que hace la notebook al cerrar la tapa se puede elegir: suspenderse, hibernar, apagarse o no hacer nada. No hacer nada sirve, por ejemplo, si la usás cerrada con un monitor, teclado y mouse aparte."
  tecnico: "Opciones de energía > Elegir el comportamiento del cierre de la tapa > Al cerrar la tapa (Con batería / Conectado)."
frases: ["cierro la tapa y se suspende la notebook", "usar la notebook cerrada con un monitor", "que no se apague al bajar la tapa", "qué hace la notebook cuando cierro la tapa"]
pasos:
  - texto: "Buscá «panel de control» en la lupa y abrí «Sistema y seguridad» > «Opciones de energía» > «Elegir el comportamiento del cierre de la tapa»."
    abrir: "https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff"
  - texto: "En «Al cerrar la tapa» elegí lo que quieras, por separado para «Con batería» y «Conectado». Para usarla cerrada con un monitor, en «Conectado» elegí la opción que no hace nada."
  - texto: "Tocá «Guardar cambios»."
  - texto: "Ojo: con esa opción, si la cerrás y la guardás en la mochila sigue prendida y gastando batería. Para guardarla, suspendela o apagala desde el menú de Inicio."
fuentes:
  - https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff
madurez: T0
