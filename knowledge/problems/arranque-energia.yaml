id: ENE-021
area: windows
titulo:
  sencillo: "La compu entra siempre a «Reparación automática» y no sale de ahí"
  tecnico: "Bucle de reparación automática (Startup Repair) en WinRE"
explicacion:
  sencillo: "Si Windows no logra arrancar dos veces seguidas, abre solo la reparación automática. Cuando no puede arreglarlo, avisa que no pudo reparar el equipo y, al reiniciar, vuelve a empezar. Desde esa pantalla hay otras herramientas para probar."
  tecnico: "Tras dos inicios fallidos consecutivos WinRE ejecuta Reparación automática; si no corrige, se repite. Opciones: desconectar periféricos, Desinstalar actualizaciones, Restaurar sistema/punto en el tiempo, Restablecer; Srttrail.txt registra el diagnóstico."
frases: ["la compu entra siempre a reparación automática", "dice que la reparación automática no pudo reparar el equipo", "se queda en un bucle de reparación", "cada vez que prendo intenta reparar y no arranca"]
pasos:
  - texto: "Desenchufá todo lo que no haga falta (pendrives, discos externos, impresora, tarjetas de memoria), tocá «Apagar» y prendela de nuevo."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/performance/windows-boot-issues-troubleshooting"
  - texto: "Si vuelve a fallar, en esa pantalla tocá «Opciones avanzadas» > «Solucionar problemas» > «Opciones avanzadas». Si empezó después de una actualización, probá «Desinstalar actualizaciones»; si no, «Restaurar sistema»."
    abrir: "https://support.microsoft.com/windows/recovery-options-in-windows-31ce2444-7de3-818c-d626-e3b5a3024da5"
  - texto: "Si te pide la clave de recuperación de BitLocker, la mayoría de estas opciones no funcionan sin ella: buscala en tu cuenta de Microsoft desde el celular (escribile a PC Doctor «dónde encuentro la clave de BitLocker»)."
  - texto: "Antes de usar «Restablecer este equipo», rescatá tus fotos y documentos con el pendrive de PC Doctor (escribí «la computadora no arranca»)."
derivar: "Si nada de esto funciona, puede haber una falla del disco o de los archivos de arranque: un técnico puede revisarlo con las herramientas avanzadas de recuperación."
fuentes:
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-re-troubleshooting-features
  - https://support.microsoft.com/windows/recovery-options-in-windows-31ce2444-7de3-818c-d626-e3b5a3024da5
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/windows-boot-issues-troubleshooting
