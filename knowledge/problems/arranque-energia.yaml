id: ENE-002
area: basico
titulo:
  sencillo: "¿Suspender o hibernar? No sé cuál usar"
  tecnico: "Suspensión frente a hibernación"
explicacion:
  sencillo: "«Suspender» deja la compu dormida: gasta muy poquito y vuelve al instante donde estabas. «Hibernar» guarda todo en el disco y la deja casi apagada: gasta menos todavía, pero tarda un poco más en volver. Para un rato, suspendé; para muchas horas sin cargador, hiberná o apagá."
  tecnico: "Suspensión: S3 o Modern Standby, con la memoria alimentada. Hibernación: S4, la memoria se guarda en hiberfil.sys y el consumo es casi el de apagado."
frases: ["qué es mejor suspender o hibernar", "diferencia entre suspender y apagar la compu", "para qué sirve hibernar", "si la dejo suspendida gasta batería"]
pasos:
  - texto: "Para un rato (comer, una reunión): Inicio > botón de encendido > «Suspender». Se despierta tocando una tecla o el botón de encendido y aparece todo como lo dejaste."
    abrir: "https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff"
  - texto: "Si la notebook va a quedar muchas horas sin poder cargarse, elegí «Hibernar» o «Apagar»: casi no gasta batería."
  - texto: "Si no te aparece «Hibernar» en el menú, escribile a PC Doctor «no me aparece la opción hibernar»."
  - texto: "Por las dudas, guardá lo importante antes de suspender o hibernar: si la batería se agota, Windows intenta guardar y apagar, pero mejor no arriesgar."
fuentes:
  - https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff
  - https://learn.microsoft.com/windows/win32/power/system-power-states
madurez: T0
