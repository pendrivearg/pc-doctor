id: ENE-005
area: windows
titulo:
  sencillo: "La compu nunca se suspende sola aunque no la toque"
  tecnico: "Solicitudes de energía que impiden la suspensión (powercfg /requests)"
explicacion:
  sencillo: "Si dejás la compu sin tocar y nunca se duerme, casi siempre hay algo que «la mantiene despierta»: un video, una descarga, una llamada o un programa que lo pide. Windows te puede decir cuál es."
  tecnico: "Las solicitudes de energía de aplicaciones y controladores impiden apagar la pantalla o suspender; powercfg /requests las lista."
frases: ["la compu nunca se suspende sola", "dejo la pc sin tocar y no se duerme", "no entra en suspensión aunque la deje horas", "algo no deja que la compu se duerma"]
pasos:
  - texto: "Primero revisá en Energía que haya un tiempo puesto para suspender (y que no diga «Nunca»), tanto enchufada como con batería."
    abrir: "ms-settings:powersleep"
  - texto: "Cerrá lo que pueda estar reproduciendo o descargando (videos, música, juegos, descargas, llamadas) y dejala de nuevo sin tocar."
  - texto: "Para encontrar al culpable: buscá «cmd», clic derecho en «Símbolo del sistema» > «Ejecutar como administrador», escribí «powercfg /requests» y Enter. Si en la lista aparece el nombre de un programa o un aparato, ese es el que no la deja dormir."
    abrir: "https://learn.microsoft.com/windows-hardware/design/device-experiences/powercfg-command-line-options"
  - texto: "Cerrá ese programa y probá otra vez. Si es un programa que usás siempre, buscá en sus opciones si tiene algo para no impedir la suspensión."
fuentes:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/powercfg-command-line-options
  - https://support.microsoft.com/windows/power-settings-in-windows-11-0d6a2b6b-2e87-4611-9980-ac9ea2175734
madurez: T0
