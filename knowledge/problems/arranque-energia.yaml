id: ENE-014
area: windows
titulo:
  sencillo: "¿Qué toco: «Actualizar y apagar» o «Actualizar y reiniciar»?"
  tecnico: "Completar actualizaciones pendientes: reinicio completo frente a apagado con inicio rápido"
explicacion:
  sencillo: "Cuando Windows tiene actualizaciones listas, el botón de encendido muestra esas dos opciones y las dos instalan lo pendiente. Pero algunas actualizaciones solo terminan con un reinicio completo: si apagás y al otro día te sigue pidiendo actualizar, usá «Actualizar y reiniciar»."
  tecnico: "Con el inicio rápido, Apagar es una hibernación y algunas actualizaciones solo se completan tras un inicio completo; Reiniciar las completa. Desde julio de 2026, Windows 11 24H2 o posterior agrupa los reinicios con la actualización de seguridad mensual."
frases: ["actualizar y apagar o actualizar y reiniciar", "apago con actualizar y al otro día me sigue pidiendo", "la actualización no termina nunca de instalarse al apagar", "qué pasa si toco actualizar y apagar"]
pasos:
  - texto: "Guardá todo y cerrá los programas. Después andá a Inicio > botón de encendido > «Actualizar y reiniciar» y esperá a que vuelva a aparecer la pantalla de inicio."
    abrir: "https://support.microsoft.com/en-us/servicing/os/windows/docs/2026/07/kb5121772-one-restart-a-month-for-windows-updates"
  - texto: "Si siempre usás «Actualizar y apagar» y la actualización vuelve a aparecer, es por el inicio rápido: hay actualizaciones que solo se terminan de instalar reiniciando."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/updates-not-install-with-fast-startup"
  - texto: "También podés ir a Configuración > Windows Update y tocar «Reiniciar ahora»."
    abrir: "ms-settings:windowsupdate"
  - texto: "Para que Windows no se reinicie mientras la usás, configurá tus horas activas en Windows Update > Opciones avanzadas."
    abrir: "ms-settings:windowsupdate-activehours"
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/updates-not-install-with-fast-startup
  - https://support.microsoft.com/en-us/servicing/os/windows/docs/2026/07/kb5121772-one-restart-a-month-for-windows-updates
