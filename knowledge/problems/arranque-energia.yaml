id: ENE-016
area: windows
titulo:
  sencillo: "Necesito entrar a la BIOS (UEFI) y no llego a apretar la tecla"
  tecnico: "Entrar a la configuración de firmware UEFI desde Windows"
explicacion:
  sencillo: "La «BIOS» o «UEFI» es la configuración interna de la placa de la compu. Como Windows prende muy rápido, muchas veces no da tiempo de apretar la tecla. Desde Windows se puede entrar sin apuro."
  tecnico: "Inicio avanzado (Configuración > Sistema > Recuperación, o Mayús + Reiniciar) > Solucionar problemas > Opciones avanzadas > Configuración de firmware UEFI. Solo en equipos UEFI."
frases: ["cómo entro a la bios", "no llego a apretar la tecla para entrar al setup", "entrar a la uefi desde windows", "qué tecla es para entrar a la bios"]
pasos:
  - texto: "IMPORTANTE: en la BIOS/UEFI no cambies nada que no conozcas. Si tu disco tiene BitLocker, antes tené a mano la clave de recuperación (escribile a PC Doctor «dónde encuentro la clave de recuperación de BitLocker»)."
  - texto: "Guardá lo que tengas abierto. Andá a Configuración > Sistema > Recuperación y, en «Inicio avanzado», tocá «Reiniciar ahora». Otra forma: Inicio > botón de encendido, mantené apretada la tecla Mayús y tocá «Reiniciar»."
    abrir: "ms-settings:recovery"
  - texto: "En la pantalla azul que aparece, elegí «Solucionar problemas» > «Opciones avanzadas» > la opción de configuración de firmware UEFI, y confirmá con «Reiniciar»."
    abrir: "https://learn.microsoft.com/windows-hardware/manufacture/desktop/boot-to-uefi-mode-or-legacy-bios-mode"
  - texto: "Si esa opción no aparece, tu PC no la ofrece (por ejemplo, si arranca en modo antiguo). Entonces apagala, prendela y apretá varias veces la tecla del fabricante: suele ser Esc, Supr, F1, F2, F10, F11 o F12, y muchas veces se indica en pantalla al prender."
fuentes:
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/boot-to-uefi-mode-or-legacy-bios-mode
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-recovery-environment--windows-re--technical-reference
  - https://support.microsoft.com/windows/recovery-options-in-windows-31ce2444-7de3-818c-d626-e3b5a3024da5
