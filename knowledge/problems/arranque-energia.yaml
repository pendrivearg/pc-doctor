id: ENE-024
area: hardware
titulo:
  sencillo: "La notebook se descarga estando suspendida o en la mochila"
  tecnico: "Consumo en Modern Standby (S0 de bajo consumo)"
explicacion:
  sencillo: "Muchas notebooks modernas, al suspenderse, quedan como un celular: con la pantalla apagada pero conectadas, haciendo tareas cortas de vez en cuando (correo, actualizaciones). Por eso pierden algo de batería aunque estén «dormidas»."
  tecnico: "Modern Standby mantiene el sistema en S0 de bajo consumo con actividad periódica de red y mantenimiento; la hibernación (S4) o el apagado consumen casi nada. powercfg /sleepstudy informa la actividad de los últimos 3 días."
frases: ["la notebook se descarga suspendida", "la dejo dormida y al otro día no tiene batería", "la saco de la mochila y está caliente", "pierde batería con la tapa cerrada"]
pasos:
  - texto: "Si la vas a guardar muchas horas sin cargador, usá «Hibernar» o «Apagar» en vez de «Suspender». Si no tenés «Hibernar» (algunas no lo traen), apagala."
    abrir: "https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff"
  - texto: "En Configuración > Sistema > Energía y batería revisá los tiempos de suspensión e hibernación: si tu notebook tiene la opción de hibernar después de un rato, conviene usarla."
    abrir: "ms-settings:powersleep"
  - texto: "Para ver qué hizo mientras dormía: abrí «Símbolo del sistema», escribí «powercfg /sleepstudy» y Enter. Guarda un informe (archivo .html) en la carpeta que muestra la ventana, con la actividad de los últimos 3 días. Es técnico: podés mostrárselo a un técnico."
    abrir: "https://learn.microsoft.com/windows-hardware/design/device-experiences/powercfg-command-line-options"
  - texto: "Microsoft explica cómo funciona este modo de suspensión."
    abrir: "https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby"
fuentes:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby
  - https://support.microsoft.com/windows/shut-down-sleep-or-hibernate-your-pc-2941d165-7d0a-a5e8-c5ad-8c972e8e6eff
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/powercfg-command-line-options
madurez: T0
