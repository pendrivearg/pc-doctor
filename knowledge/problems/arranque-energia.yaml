id: ENE-018
area: seguridad
titulo:
  sencillo: "¿Mi compu tiene TPM 2.0? (lo pide Windows 11)"
  tecnico: "Comprobar y habilitar TPM 2.0 (fTPM / PTT) en el firmware"
explicacion:
  sencillo: "El TPM es un chip de seguridad que Windows 11 exige en su versión 2.0. Casi todas las compus de los últimos años lo tienen, pero a veces viene apagado en la configuración de la placa."
  tecnico: "Windows 11 requiere TPM 2.0 y firmware UEFI compatible con Arranque seguro. Comprobación: tpm.msc o Seguridad de Windows > Seguridad del dispositivo > Procesador de seguridad. Habilitación en UEFI: Intel PTT, AMD fTPM, Security Device Support o TPM State."
frases: ["mi compu tiene tpm", "cómo sé si tengo tpm 2.0", "windows 11 me pide tpm", "activar el tpm en la bios"]
pasos:
  - texto: "Apretá Windows + R, escribí «tpm.msc» y tocá «Aceptar». Si dice que no encuentra un TPM compatible, puede estar desactivado. Si aparece la información del TPM, fijate que la versión de la especificación sea 2.0."
    abrir: "https://support.microsoft.com/windows/enable-tpm-2-0-on-your-pc-1fd5a332-360d-4f46-a1e7-ae6b0c90645c"
  - texto: "Otra forma: abrí Seguridad de Windows > «Seguridad del dispositivo». Si no aparece la sección del procesador de seguridad, el TPM puede estar apagado."
    abrir: "ms-settings:windowsdefender"
  - texto: "IMPORTANTE antes de activarlo: en la BIOS/UEFI no cambies otras opciones, y si tu disco tiene BitLocker tené a mano la clave de recuperación."
  - texto: "Entrá a la UEFI (escribile a PC Doctor «entrar a la BIOS desde Windows»). Buscá en menús como «Advanced», «Security» o «Trusted Computing» una opción llamada «Intel PTT», «AMD fTPM», «Security Device Support» o «TPM State», activala y guardá. Si no la encontrás, mirá la ayuda del fabricante."
fuentes:
  - https://support.microsoft.com/windows/enable-tpm-2-0-on-your-pc-1fd5a332-360d-4f46-a1e7-ae6b0c90645c
  - https://learn.microsoft.com/windows/whats-new/windows-11-requirements
madurez: T0
