id: ENE-009
area: rendimiento
titulo:
  sencillo: "Quiero que la compu rinda más (o que gaste menos): el modo de energía"
  tecnico: "Modo de energía de Windows 11 / control deslizante de Windows 10"
explicacion:
  sencillo: "Windows tiene tres modos: uno que ahorra energía, uno equilibrado y uno de máximo rendimiento. Se elige por separado para cuando está enchufada y cuando usa batería. Más rendimiento significa más consumo y, en notebooks, menos batería."
  tecnico: "Configuración > Sistema > Energía y batería > Modo de energía (máxima eficiencia, equilibrado, máximo rendimiento), por separado Conectado / Con batería."
frases: ["poner la compu en máximo rendimiento", "dónde elijo el modo de energía en windows 11", "quiero que la notebook rinda más enchufada", "modo ahorro o modo rendimiento en windows"]
pasos:
  - texto: "Abrí Configuración > Sistema > Energía y batería y buscá «Modo de energía»."
    abrir: "ms-settings:powersleep"
  - texto: "Elegí el modo para «Conectado» y para «Con batería»: el de mejor eficiencia ahorra batería, el equilibrado es el normal y el de mejor rendimiento saca todo lo que puede la compu."
    abrir: "https://support.microsoft.com/en-us/windows/change-the-power-mode-for-your-windows-pc-c2aff038-22c9-f46d-5ca0-78696fdf2de8"
  - texto: "En Windows 10: tocá el ícono de la batería en la barra de tareas y mové el control deslizante. No está en todas las PCs: depende del equipo y del fabricante."
  - texto: "Si la opción está gris y no te deja cambiarla, escribile a PC Doctor «no me deja cambiar el modo de energía»."
fuentes:
  - https://support.microsoft.com/en-us/windows/change-the-power-mode-for-your-windows-pc-c2aff038-22c9-f46d-5ca0-78696fdf2de8
madurez: T0
