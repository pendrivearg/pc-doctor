id: ENE-004
area: archivos
titulo:
  sencillo: "Hay un archivo «hiberfil.sys» enorme ocupando el disco"
  tecnico: "Archivo de hibernación (hiberfil.sys): desactivar o reducir"
explicacion:
  sencillo: "hiberfil.sys es el archivo donde Windows guarda la memoria para poder hibernar y para el inicio rápido. Puede ocupar varios gigas. Se puede sacar, pero entonces dejás de tener «Hibernar» y el inicio rápido."
  tecnico: "hiberfil.sys (oculto, en la raíz de C:) tiene un tamaño cercano a la RAM. powercfg /hibernate off lo elimina y desactiva hibernación y suspensión híbrida; /type reduced deja uno más chico solo para el inicio rápido."
frases: ["qué es hiberfil.sys", "un archivo de sistema me ocupa muchos gigas", "puedo borrar hiberfil.sys", "liberar espacio sacando la hibernación"]
pasos:
  - texto: "No intentes borrarlo a mano. Si te sobra espacio, lo mejor es dejarlo como está."
  - texto: "Para sacarlo: buscá «cmd», clic derecho en «Símbolo del sistema» > «Ejecutar como administrador», escribí «powercfg /hibernate off» y Enter. El archivo desaparece, junto con la opción «Hibernar»."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/disable-and-re-enable-hibernation"
  - texto: "Ojo en PCs de escritorio: si usás la «suspensión híbrida», sin este archivo podés perder lo que tenías abierto si se corta la luz mientras está suspendida."
  - texto: "Término medio: con «powercfg /hibernate /type reduced» el archivo queda más chico y sigue sirviendo para el inicio rápido (sin «Hibernar»)."
    abrir: "https://learn.microsoft.com/windows/win32/power/system-power-states"
  - texto: "Si te arrepentís, el mismo comando con «on» lo vuelve a crear: «powercfg /hibernate on»."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/setup-upgrade-and-drivers/disable-and-re-enable-hibernation
  - https://learn.microsoft.com/windows/win32/power/system-power-states
madurez: T0
