id: ENE-011
area: hardware
titulo:
  sencillo: "La batería no llega al 100 % aunque esté enchufada"
  tecnico: "Carga inteligente (Smart charging) o límite de carga del fabricante"
explicacion:
  sencillo: "Muchas notebooks frenan la carga antes del 100 % a propósito, para que la batería dure más años. Si ves un corazoncito en el ícono de la batería, es eso: la batería no está rota."
  tecnico: "Carga inteligente de Windows 11/10 (ícono de batería con corazón): la carga se pausa por debajo del 100 % para reducir el desgaste; cada fabricante la implementa y la controla a su manera."
frases: ["la batería se queda en 80 y no carga más", "la notebook no carga al 100 por ciento", "la batería tiene un corazoncito", "enchufada no pasa del 80"]
pasos:
  - texto: "Mirá el ícono de la batería en la barra de tareas o en Configuración > Sistema > Energía y batería: si tiene un corazón, está activa la carga inteligente."
    abrir: "ms-settings:powersleep"
  - texto: "Si pasás el mouse por arriba del ícono, aparece un aviso de que la carga inteligente la frenó a propósito. Es normal aunque siga enchufada."
    abrir: "https://support.microsoft.com/en-us/windows/experience/power-battery/use-smart-charging-in-windows"
  - texto: "Conviene dejarla así. Si un día necesitás la batería llena (un viaje, muchas horas sin enchufe), la forma de apagarla depende de la marca: buscala en la página de ayuda o en la aplicación del fabricante."
  - texto: "Si no ves el corazón y la carga igual no avanza, es otra cosa: escribile a PC Doctor «la notebook está enchufada pero no carga»."
fuentes:
  - https://support.microsoft.com/en-us/windows/experience/power-battery/use-smart-charging-in-windows
madurez: T0
