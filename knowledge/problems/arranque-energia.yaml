id: ENE-012
area: hardware
titulo:
  sencillo: "Quiero saber qué aplicación me gasta la batería"
  tecnico: "Uso de la batería por aplicación y actividad en segundo plano"
explicacion:
  sencillo: "Windows anota cuánta batería gastó cada aplicación, incluso las que trabajan escondidas. Si una gasta mucho y no la usás, le podés quitar el permiso de funcionar en segundo plano."
  tecnico: "Configuración > Sistema > Energía y batería > Uso de la batería > uso por aplicación; Más opciones > Administrar la actividad en segundo plano (Windows 11 24H2 o posterior)."
frases: ["qué programa me come la batería", "ver cuánta batería usa cada aplicación", "una app me descarga la notebook", "qué aplicación gasta batería en segundo plano"]
pasos:
  - texto: "Abrí Configuración > Sistema > Energía y batería > «Uso de la batería». Abajo está la lista de aplicaciones y cuánto gastó cada una."
    abrir: "ms-settings:batterysaver-usagedetails"
  - texto: "Si una aplicación que casi no usás gasta mucho en segundo plano, tocá los tres puntitos («Más opciones») al lado de su nombre > administrar la actividad en segundo plano, y cambiá el permiso para que no funcione en segundo plano."
    abrir: "https://support.microsoft.com/windows/experience/power-battery/battery-saving-tips-for-windows"
  - texto: "No le quites el permiso a programas que necesitás que avisen solos (por ejemplo, el correo o WhatsApp): dejarían de mandarte notificaciones."
fuentes:
  - https://support.microsoft.com/windows/experience/power-battery/battery-saving-tips-for-windows
madurez: T0
