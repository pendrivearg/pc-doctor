id: ENE-010
area: rendimiento
titulo:
  sencillo: "No me deja cambiar el modo de energía (está gris)"
  tecnico: "Modo de energía bloqueado: ahorro de energía activo o plan de energía personalizado"
explicacion:
  sencillo: "Pasa por dos motivos: está prendido el ahorro de energía (mientras está activo no se puede cambiar el modo) o la compu tiene un plan de energía personalizado, por ejemplo uno que instaló el fabricante o un programa."
  tecnico: "Con Ahorro de energía activo no se puede cambiar el modo de energía; con un plan personalizado hay que volver al plan Equilibrado (Panel de control > Opciones de energía)."
frases: ["no me deja cambiar el modo de energía", "el modo de energía está gris", "no puedo poner máximo rendimiento", "el modo de energía no se puede tocar"]
pasos:
  - texto: "Fijate si está activo el ahorro de energía (en Configuración > Sistema > Energía y batería, o en el ícono de la batería abajo a la derecha). Apagalo y probá cambiar el modo."
    abrir: "ms-settings:powersleep"
  - texto: "Si sigue gris, buscá «panel de control» en la lupa > «Sistema y seguridad» > «Opciones de energía» y elegí el plan «Equilibrado»."
    abrir: "https://support.microsoft.com/en-us/windows/change-the-power-mode-for-your-windows-pc-c2aff038-22c9-f46d-5ca0-78696fdf2de8"
  - texto: "Volvé a Energía y batería y elegí el modo que quieras."
  - texto: "Microsoft explica qué cambia mientras el ahorro de energía está activo."
    abrir: "https://learn.microsoft.com/windows-hardware/design/component-guidelines/energy-saver"
fuentes:
  - https://support.microsoft.com/en-us/windows/change-the-power-mode-for-your-windows-pc-c2aff038-22c9-f46d-5ca0-78696fdf2de8
  - https://learn.microsoft.com/windows-hardware/design/component-guidelines/energy-saver
madurez: T0
