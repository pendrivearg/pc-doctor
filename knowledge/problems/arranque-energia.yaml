id: ENE-022
area: windows
titulo:
  sencillo: "Al prender aparece «Preparando reparación automática»"
  tecnico: "Conmutación automática a WinRE por inicio incompleto"
explicacion:
  sencillo: "Windows muestra ese cartel cuando el arranque anterior no terminó bien, por ejemplo si se cortó la luz o se apagó mientras arrancaba. Muchas veces no hay ningún daño y a la vuelta siguiente arranca normal."
  tecnico: "El cargador marca el inicio y Windows borra la marca antes del inicio de sesión; si no se borra (fallo o corte de energía durante el arranque), el siguiente inicio entra a WinRE. Puede ser un falso positivo."
frases: ["al prender dice preparando reparación automática", "se cortó la luz y ahora dice reparación automática", "se queda diagnosticando el equipo", "aparece reparación automática después de un apagón"]
pasos:
  - texto: "Dejala trabajar unos minutos sin tocarla: está revisando el arranque."
    abrir: "https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-re-troubleshooting-features"
  - texto: "Si te muestra opciones, probá primero «Continuar» (o apagar y volver a prender). Si fue por un corte de luz, suele arrancar normal."
  - texto: "Antes de volver a prender, sacá pendrives, discos externos y tarjetas de memoria."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/performance/windows-boot-issues-troubleshooting"
  - texto: "Si aparece cada vez que la prendés, escribile a PC Doctor «la compu entra siempre a reparación automática»."
fuentes:
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-re-troubleshooting-features
  - https://learn.microsoft.com/windows-hardware/manufacture/desktop/windows-recovery-environment--windows-re--technical-reference
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/windows-boot-issues-troubleshooting
