id: ENE-025
area: windows
titulo:
  sencillo: "Toco «Apagar» y vuelve a la pantalla de bloqueo"
  tecnico: "El apagado híbrido (inicio rápido) falla y regresa a la pantalla de bloqueo"
explicacion:
  sencillo: "Si al tocar «Apagar» la compu no se apaga y vuelve a la pantalla de bloqueo, puede ser una falla del inicio rápido: al apagar, Windows intenta guardar una parte del sistema y algo se lo impide."
  tecnico: "Con Fast Startup, el apagado hiberna la sesión del kernel; si falla la carga del controlador de volcado (evento 45, DumpFilters en CrashControl), vuelve a la pantalla de bloqueo. Alternativa: shutdown /s /t 0 (apagado completo)."
frases: ["toco apagar y vuelve a la pantalla de bloqueo", "la compu no se apaga, vuelve al inicio de sesión", "le doy apagar y aparece la pantalla con la hora", "no se apaga y vuelve a pedirme el pin"]
pasos:
  - texto: "Para apagarla igual: guardá todo, apretá Windows + R, escribí «shutdown /s /t 0» y tocá «Aceptar». Así se apaga completa, sin inicio rápido."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/deployment/fast-startup-causes-system-hibernation-shutdown-fail"
  - texto: "«Reiniciar» no usa el inicio rápido, así que debería funcionar normal."
  - texto: "La corrección de fondo que da Microsoft toca el registro de Windows: no la hagas por tu cuenta."
derivar: "La solución oficial revisa el registro (valor DumpFilters en CrashControl) y el evento 45 del registro del sistema: pedíselo a un técnico de confianza."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/deployment/fast-startup-causes-system-hibernation-shutdown-fail
madurez: T0
