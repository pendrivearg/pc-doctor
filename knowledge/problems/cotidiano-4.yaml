id: DSP-002
area: hardware
titulo:
  sencillo: "La pantalla parpadea o titila"
  tecnico: "Parpadeo de pantalla (controlador de video o aplicación)"
explicacion:
  sencillo: "Suele ser el controlador de video o un programa que no se lleva bien con Windows. Hay un atajo que reinicia el video sin apagar la PC."
  tecnico: "Si el Administrador de tareas también parpadea, es el controlador; si no, una aplicación incompatible."
frases: ["la pantalla parpadea", "la pantalla titila", "la imagen tiembla", "el monitor hace como flashes"]
sondas: [gpu, eventos]
pasos:
  - texto: "Apretá Windows + Ctrl + Mayús + B: reinicia el video (la pantalla se pone negra un segundo). Si sigue, reiniciá la PC."
  - texto: "Abrí el Administrador de tareas (Ctrl + Mayús + Esc). Si también parpadea, actualizá el controlador de video; si no, el problema es un programa: actualizalo o desinstalalo."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/troubleshoot-screen-flickering-in-windows"
  - texto: "Revisá que el cable del monitor esté bien enchufado en los dos extremos."
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/troubleshoot-screen-flickering-in-windows
madurez: T0
