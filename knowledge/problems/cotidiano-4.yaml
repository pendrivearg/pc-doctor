id: DSP-003
area: hardware
titulo:
  sencillo: "No detecta el segundo monitor"
  tecnico: "Monitor externo no detectado"
explicacion:
  sencillo: "Casi siempre se arregla eligiendo el modo «Extender» con Windows + P, o tocando «Detectar» en la configuración de pantalla."
  tecnico: "Modo de proyección, detección manual, cable/adaptador y controlador de video."
frases: ["no me detecta el segundo monitor", "conecté otro monitor y no anda", "el monitor externo no da imagen", "dos pantallas no funciona"]
sondas: [gpu]
pasos:
  - texto: "Apretá Windows + P y elegí «Extender»."
  - texto: "En Pantalla > Varias pantallas, tocá «Detectar»."
    abrir: "ms-settings:display"
  - texto: "Probá otro cable o puerto, y quitá adaptadores intermedios para descartar que fallen."
    abrir: "https://support.microsoft.com/windows/hardware/display-graphics/troubleshoot-external-monitor-connections-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/display-graphics/troubleshoot-external-monitor-connections-in-windows
madurez: T0
