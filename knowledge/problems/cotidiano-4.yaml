id: APP-GEN-006
area: programas
titulo:
  sencillo: "«Esta aplicación no se puede ejecutar en el equipo»"
  tecnico: "Programa incompatible o bloqueado"
explicacion:
  sencillo: >-
    Puede ser un programa viejo, uno hecho para otro tipo de procesador, o que Windows lo bloqueó porque no confía
    en él (Control inteligente de aplicaciones). En ese último caso, conseguí una versión oficial actualizada.
  tecnico: "Compatibilidad (modo de compatibilidad), arquitectura (x86/x64/ARM64) o bloqueo por Smart App Control."
frases: ["esta aplicación no se puede ejecutar en el equipo", "el programa no es compatible con windows", "un programa viejo no anda en windows 11", "windows bloqueó el programa"]
sondas: [sistema]
pasos:
  - texto: "Descargá la versión más nueva del programa desde su página oficial."
  - texto: "Para programas viejos: clic derecho sobre el programa > Propiedades > Compatibilidad, y probá con una versión anterior de Windows."
    abrir: "https://support.microsoft.com/windows/make-older-apps-or-programs-compatible-with-the-latest-version-of-windows-783d6dd7-b439-bdb0-0490-54eea0f45938"
derivar: "Si Windows lo bloquea por seguridad, no lo fuerces: puede ser un programa peligroso."
fuentes:
  - https://support.microsoft.com/windows/make-older-apps-or-programs-compatible-with-the-latest-version-of-windows-783d6dd7-b439-bdb0-0490-54eea0f45938
  - https://support.microsoft.com/windows/smart-app-control-frequently-asked-questions-285ea03d-fa88-4d56-882e-6698afdb7003
madurez: T0
