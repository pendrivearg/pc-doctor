id: APP-GEN-004
area: programas
titulo:
  sencillo: "No puedo desinstalar un programa"
  tecnico: "Desinstalación bloqueada o fallida"
explicacion:
  sencillo: "Se desinstala desde Aplicaciones instaladas. Si da error, Microsoft tiene una herramienta oficial que destraba la desinstalación."
  tecnico: "Desinstalación estándar y solucionador de problemas de instalación/desinstalación."
frases: ["no puedo desinstalar un programa", "el programa no se quiere borrar", "cómo saco un programa que no uso", "da error al desinstalar"]
pasos:
  - texto: "Abrí Aplicaciones instaladas, buscá el programa, tocá los tres puntos > Desinstalar."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si da error, seguí la guía oficial de Microsoft para programas que no se pueden quitar."
    abrir: "https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d"
derivar: "Si es un antivirus de otra marca, usá la herramienta de desinstalación oficial de ese fabricante."
fuentes:
  - https://support.microsoft.com/windows/uninstall-or-remove-apps-and-programs-in-windows-4b55f974-2cc6-2d2b-d092-5905080eaf98
  - https://support.microsoft.com/topic/fix-problems-that-block-programs-from-being-installed-or-removed-cca7d1b6-65a9-3d98-426b-e9f927e1eb4d
madurez: T0
