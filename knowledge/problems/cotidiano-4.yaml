id: PER-MOU-001
area: perifericos
titulo:
  sencillo: "El mouse o el teclado no funcionan"
  tecnico: "Mouse o teclado sin respuesta"
explicacion:
  sencillo: "Suele ser el puerto, las pilas o el receptor inalámbrico. Si en otra computadora tampoco anda, el aparato está roto."
  tecnico: "Conexión USB, alimentación, receptor inalámbrico y controlador."
frases: ["no me anda el mouse", "el teclado no escribe nada", "el mouse no se mueve", "el teclado inalámbrico no responde"]
sondas: [dispositivos]
pasos:
  - texto: "Desenchufalo y enchufalo en otro puerto USB, directo en la computadora."
  - texto: "Si es inalámbrico: cambiá las pilas, y desenchufá el receptor, esperá 10 segundos y volvelo a enchufar."
  - texto: "Probalo en otra computadora: si tampoco anda, hay que reemplazarlo."
    abrir: "https://support.microsoft.com/windows/hardware/input-devices/mouse-and-keyboard-problems-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/input-devices/mouse-and-keyboard-problems-in-windows
madurez: T0
