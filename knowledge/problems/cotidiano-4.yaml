id: MIG-002
area: archivos
titulo:
  sencillo: "Quiero pasar mis cosas a una computadora nueva"
  tecnico: "Transferencia de archivos y configuraciones a otra PC"
explicacion:
  sencillo: "Windows puede pasar tus archivos y configuraciones a la PC nueva con la aplicación Copia de seguridad de Windows, o lo podés hacer con un disco externo."
  tecnico: "Windows Backup / transferencia PC a PC, o copia manual de carpetas de usuario."
frases: ["compré una computadora nueva y quiero pasar mis cosas", "pasar los archivos a la notebook nueva", "mudar todo a la pc nueva"]
pasos:
  - texto: "Forma simple: copiá Documentos, Escritorio, Imágenes y Descargas a un disco externo y después a la PC nueva."
  - texto: "Forma automática: Microsoft explica cómo usar Windows Backup para pasar archivos y configuraciones."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/transfer-your-files-and-settings-to-a-new-windows-pc"
  - texto: "Los programas no se copian: hay que instalarlos de nuevo en la PC nueva (con sus licencias)."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/transfer-your-files-and-settings-to-a-new-windows-pc
madurez: T0
