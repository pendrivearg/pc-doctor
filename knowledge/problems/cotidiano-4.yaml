id: BAS-NIG-001
area: basico
titulo:
  sencillo: "La pantalla se ve amarillenta o me cansa la vista de noche"
  tecnico: "Luz nocturna (filtro de luz azul)"
explicacion:
  sencillo: "La «luz nocturna» pone la pantalla más cálida (amarillenta) para descansar la vista a la noche. Se puede prender, apagar o programar."
  tecnico: "Night light: intensidad y programación (atardecer-amanecer u horario)."
frases: ["la pantalla se ve amarilla", "me cansa la vista la pantalla de noche", "la pantalla está naranja", "quiero que la pantalla no moleste a la noche"]
pasos:
  - texto: "En Luz nocturna podés apagarla (si la ves amarillenta sin querer) o programarla para la noche."
    abrir: "ms-settings:nightlight"
fuentes:
  - https://support.microsoft.com/windows/set-your-display-for-night-time-in-windows-18fe903a-e0a1-8326-4c68-fd23d7aaf136
