id: LAP-BAT-002
area: hardware
titulo:
  sencillo: "Quiero que la batería de la notebook dure más"
  tecnico: "Ahorro de batería"
explicacion:
  sencillo: "Bajar el brillo, usar el modo de ahorro y cerrar lo que no se usa alarga mucho la batería. PC Doctor también revisa si la batería está gastada."
  tecnico: "Brillo, modo de energía, suspensión, uso de batería por aplicación."
frases: ["cómo hago que dure más la batería", "ahorrar batería en la notebook", "qué gasta tanta batería"]
sondas: [bateria]
pasos:
  - texto: "Bajá el brillo de la pantalla y activá el Ahorro de batería cuando estés sin cargador."
    abrir: "ms-settings:powersleep"
  - texto: "Microsoft tiene más consejos para ahorrar batería."
    abrir: "https://support.microsoft.com/windows/experience/power-battery/battery-saving-tips-for-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/power-battery/battery-saving-tips-for-windows
madurez: T0
