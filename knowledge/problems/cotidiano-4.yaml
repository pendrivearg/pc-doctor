id: MIG-006
area: windows
titulo:
  sencillo: "Después de una actualización algo anda mal: quiero volver atrás"
  tecnico: "Volver a la versión anterior de Windows"
explicacion:
  sencillo: "Durante unos días después de una actualización grande, Windows permite volver a la versión anterior sin perder tus archivos."
  tecnico: "Revertir actualización de característica (disponible por tiempo limitado)."
frases: ["desde que se actualizó windows anda mal", "quiero volver a la versión anterior de windows", "deshacer la actualización de windows", "después de actualizar no funciona nada"]
pasos:
  - texto: "En Recuperación, si aparece «Volver», tocala y seguí los pasos. Solo está disponible por unos días después de actualizar."
    abrir: "ms-settings:recovery"
    # La opción aparece solo si Windows conservó la versión anterior.
  - texto: "Microsoft lo explica con detalle."
    abrir: "https://support.microsoft.com/windows/deployment/install-upgrade/go-back-to-the-previous-version-of-windows"
fuentes:
  - https://support.microsoft.com/windows/deployment/install-upgrade/go-back-to-the-previous-version-of-windows
madurez: T0
