id: MIG-005
area: windows
titulo:
  sencillo: "Quiero restablecer o reinstalar Windows"
  tecnico: "Restablecer este equipo / reinstalar Windows"
explicacion:
  sencillo: >-
    Es el último recurso cuando nada funciona. Antes conviene probar opciones más suaves. «Mantener mis archivos»
    conserva tus documentos pero borra los programas instalados. Siempre hacé antes una copia de tus cosas.
  tecnico: "Opciones de recuperación: reinstalar con Windows Update (conserva todo), Restablecer este equipo (mantener archivos o quitar todo), descarga en la nube o reinstalación local."
frases: ["quiero formatear la computadora", "cómo reinstalo windows", "quiero dejar la compu como nueva", "restablecer de fábrica"]
pasos:
  - texto: "Primero hacé una copia de tus fotos y documentos en un disco externo (ver «copia de seguridad»)."
  - texto: "Si tenés BitLocker, anotá la clave de recuperación antes de empezar."
    abrir: "https://account.microsoft.com/devices/recoverykey"
  - texto: "En Recuperación, probá primero «Corregir problemas con Windows Update» (conserva archivos y programas). Si no alcanza, usá «Restablecer este equipo» > «Mantener mis archivos»."
    abrir: "ms-settings:recovery"
  - texto: "Microsoft explica cada opción."
    abrir: "https://support.microsoft.com/windows/experience/backup-recovery/reset-your-pc"
derivar: "«Quitar todo» borra tus archivos. Si la PC tiene información importante, no elijas esa opción sin ayuda."
fuentes:
  - https://support.microsoft.com/windows/experience/backup-recovery/reset-your-pc
  - https://support.microsoft.com/windows/experience/backup-recovery/recovery-options-in-windows
madurez: T0
