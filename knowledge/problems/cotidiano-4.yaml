id: BAS-ACC-001
area: basico
titulo:
  sencillo: "La computadora habla sola y lee todo en voz alta"
  tecnico: "Narrador activado"
explicacion:
  sencillo: "Se activó el Narrador, una ayuda para personas que no ven bien. Se apaga con un atajo de teclado."
  tecnico: "Narrador (Windows + Ctrl + Enter)."
frases: ["la compu habla sola", "una voz lee todo lo que toco", "se activó una voz que lee la pantalla", "aparece un recuadro azul y habla"]
pasos:
  - texto: "Apretá a la vez Windows + Ctrl + Enter: el Narrador se apaga."
  - texto: "Para que no se prenda solo, revisá la configuración del Narrador."
    abrir: "ms-settings:easeofaccess-narrator"
fuentes:
  - https://support.microsoft.com/accessibility/windows/narrator/chapter-1-introducing-narrator
