id: FAM-001
area: basico
titulo:
  sencillo: "Quiero controlar lo que usan los chicos en la computadora"
  tecnico: "Control parental (Microsoft Family Safety)"
explicacion:
  sencillo: "Con Microsoft Family Safety (gratis) podés poner horarios, límites de tiempo y filtrar páginas para la cuenta de cada chico."
  tecnico: "Grupo familiar, cuenta de menor como usuario estándar, límites de tiempo y filtros."
frases: ["control parental", "limitar el tiempo de los chicos en la compu", "que mi hijo no entre a cualquier página", "poner horarios a la computadora de los chicos"]
pasos:
  - texto: "Creá un grupo familiar con tu cuenta Microsoft y agregá a los chicos. Su cuenta en la PC tiene que ser «usuario estándar», no administrador."
    abrir: "https://account.microsoft.com/family"
  - texto: "Microsoft explica cómo configurar horarios y límites."
    abrir: "https://support.microsoft.com/family-safety/set-up-microsoft-family-safety"
fuentes:
  - https://support.microsoft.com/family-safety/set-up-microsoft-family-safety
  - https://support.microsoft.com/family-safety/set-screen-time-limits-across-devices
