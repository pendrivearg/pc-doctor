id: PRN-004
area: perifericos
titulo:
  sencillo: "Quiero escanear un documento"
  tecnico: "Instalación y uso de un escáner"
explicacion:
  sencillo: "Windows trae una aplicación gratuita (Escáner de Windows). Si el escáner no aparece, se agrega desde Impresoras y escáneres."
  tecnico: "Detección del dispositivo y app Windows Scan."
frases: ["cómo escaneo un documento", "no me aparece el escáner", "quiero escanear una hoja", "el escáner no funciona"]
pasos:
  - texto: "Conectá y prendé el escáner (o la impresora con escáner). Si no aparece, agregalo en Impresoras y escáneres > Agregar dispositivo."
    abrir: "ms-settings:printers"
  - texto: "Abrí la aplicación «Escáner de Windows» desde el menú Inicio, elegí el escáner y tocá «Escanear». Si no la tenés, se instala gratis desde la Microsoft Store."
    abrir: "https://support.microsoft.com/windows/hardware/printer/install-and-use-a-scanner-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/printer/install-and-use-a-scanner-in-windows
madurez: T0
