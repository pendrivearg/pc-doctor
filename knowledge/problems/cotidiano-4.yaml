# Periféricos, pantallas, accesibilidad, familia, recuperación y programas (módulos E, G, Q, S, B). Guiadas con fuente oficial.
id: PRN-003
area: perifericos
titulo:
  sencillo: "La impresora figura «sin conexión»"
  tecnico: "Impresora en estado Offline"
explicacion:
  sencillo: "Windows cree que la impresora está desconectada. A veces es real (apagada o en otra red Wi-Fi) y a veces quedó marcada «usar sin conexión»."
  tecnico: "Red distinta, cola en pausa o «Usar impresora sin conexión» activado."
frases: ["la impresora dice sin conexión", "la impresora figura desconectada", "impresora offline", "la impresora aparece apagada pero está prendida"]
sondas: [servicios]
pasos:
  - texto: "Revisá que la impresora esté prendida y conectada a la misma red Wi-Fi que la computadora (o por cable USB)."
  - texto: "En Impresoras y escáneres elegí tu impresora > Abrir cola de impresión > menú Impresora y destildá «Usar impresora sin conexión» y «Pausar la impresión»."
    abrir: "ms-settings:printers"
  - texto: "Microsoft explica los demás pasos."
    abrir: "https://support.microsoft.com/windows/hardware/printer/troubleshooting-offline-printer-problems-in-windows"
fuentes:
  - https://support.microsoft.com/windows/hardware/printer/troubleshooting-offline-printer-problems-in-windows
madurez: T0
