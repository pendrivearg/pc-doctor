id: PER-TPD-001
area: perifericos
titulo:
  sencillo: "El panel táctil (touchpad) de la notebook no responde"
  tecnico: "Touchpad deshabilitado o sin controlador"
explicacion:
  sencillo: "Muchas notebooks tienen una tecla que apaga el panel táctil sin querer. También puede faltar su controlador."
  tecnico: "Activación del touchpad (tecla Fn o Configuración) y controlador."
frases: ["no anda el panel de la notebook", "el touchpad no responde", "no se mueve la flechita con el dedo", "se desactivó el touchpad"]
pasos:
  - texto: "Buscá en el teclado una tecla con el dibujo de un panel táctil (a veces junto con Fn) y apretala."
  - texto: "Revisá que el panel táctil esté activado en Configuración."
    abrir: "ms-settings:devices-touchpad"
  - texto: "Si sigue sin andar, Microsoft explica cómo actualizar su controlador."
    abrir: "https://support.microsoft.com/windows/fix-touchpad-problems-in-windows-30b498e5-0caa-9740-2b21-336ea75ee756"
fuentes:
  - https://support.microsoft.com/windows/fix-touchpad-problems-in-windows-30b498e5-0caa-9740-2b21-336ea75ee756
madurez: T0
