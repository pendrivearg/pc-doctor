pasos:
  - texto: "Fijate que la cámara no tenga una tapita corrida o un botón de privacidad apagado, y que en la reunión el botón de la cámara no esté tachado."
  - texto: "Cerrá los otros programas que puedan usar la cámara (Zoom, Teams, WhatsApp, la app Cámara) y volvé a cargar la página de Meet."
  - texto: "En Meet, tocá la flechita al lado del botón de la cámara y elegí la cámara correcta de la lista."
  - texto: "Revisá que Windows deje usar la cámara: en «Privacidad y seguridad» > «Cámara», tienen que estar activados el acceso a la cámara y «Permitir que las apps accedan a la cámara»."
    abrir: "ms-settings:privacy-webcam"
  - texto: "Si todavía no te ven, seguí la guía de Google para la cámara en Meet."
    abrir: "https://support.google.com/meet/answer/10621292?hl=es-419"
fuentes:
