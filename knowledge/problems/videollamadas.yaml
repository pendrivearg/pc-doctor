titulo:
  sencillo: "En la reunión de Google Meet no me ven"
  tecnico: "La cámara no funciona en una reunión de Meet (pantalla negra o cámara tachada)"
explicacion:
  sencillo: "Si en Meet los demás no te ven, puede que la cámara esté apagada en la reunión, que otro programa la esté usando, que Meet esté usando otra cámara o que Windows o el navegador no le den permiso."
  tecnico: "Causas habituales: cámara equivocada en Meet, otra app usando la cámara, tapa o interruptor de privacidad, permisos del sitio o de Windows (Privacidad y seguridad > Cámara)."
