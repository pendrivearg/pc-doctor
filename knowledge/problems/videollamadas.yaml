# Videollamadas y reuniones: Google Meet y Microsoft Teams (personal y del trabajo). Unirse, cámara, micrófono, parlantes, eco, compartir pantalla, fondo, subtítulos, chat, cortes, agendar, grabar y salir. Guiadas con fuente oficial.
id: VID-001
area: programas
titulo:
  sencillo: "Me mandaron un enlace de Google Meet y no sé cómo entrar"
  tecnico: "Unirse a una videoconferencia de Google Meet desde un vínculo, el Calendario o un código"
explicacion:
  sencillo: "Para entrar a una reunión de Meet desde la compu alcanza con tocar el enlace que te mandaron por correo o por chat. Se abre en el navegador, ves cómo salís en cámara y tocás «Unirse ahora». Si no estabas invitado, tenés que pedir permiso y esperar que te acepten."
  tecnico: "Vínculo de la reunión, evento de Google Calendar («Unirse con Google Meet») o código en meet.google.com; si no figurás entre los invitados, se solicita acceso al organizador."
frases: ["me pasaron un link de meet y no sé cómo entrar", "cómo me uno a una reunión de google meet", "toco el enlace de meet y no sé qué hacer", "tengo un código de reunión de meet dónde lo pongo"]
pasos:
  - texto: "Abrí el correo o el chat donde te mandaron la reunión y hacé clic en el enlace (empieza con meet.google.com)."
  - texto: "Se abre una pantalla donde te ves en cámara. Revisá que estén prendidos el micrófono y la cámara y hacé clic en «Unirse ahora»."
  - texto: "Si dice que tenés que solicitar la entrada, pedila y esperá: el organizador o alguien de la reunión te tiene que aceptar."
  - texto: "Si te pasaron un código en vez de un enlace, entrá a meet.google.com, escribí el código donde lo pide y tocá «Unirse». Google lo explica acá."
    abrir: "https://support.google.com/meet/answer/9303069?hl=es-419"
fuentes:
  - https://support.google.com/meet/answer/9303069?hl=es-419
madurez: T0
