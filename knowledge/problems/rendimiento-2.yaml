id: REN-010
area: rendimiento
titulo:
  sencillo: "Quiero sacar las animaciones para que la compu vaya más rápida"
  tecnico: "Opciones de rendimiento: Ajustar para obtener el mejor rendimiento"
explicacion:
  sencillo: "Windows usa sombras, animaciones y otros efectos que se ven lindos pero gastan recursos. En compus con poca potencia, sacarlos puede hacerlas más ágiles. Se ve más simple, pero funciona igual."
  tecnico: "Opciones de rendimiento > Efectos visuales > Ajustar para obtener el mejor rendimiento."
frases: ["sacar los efectos visuales de windows", "quitar las animaciones para que ande más rápido", "poner windows en modo rendimiento", "que windows se vea más simple pero ande mejor"]
pasos:
  - texto: "Tocá la lupa, escribí «rendimiento» y abrí «Ajustar la apariencia y rendimiento de Windows»."
  - texto: "En la pestaña «Efectos visuales», elegí «Ajustar para obtener el mejor rendimiento» y tocá «Aceptar»."
  - texto: "Microsoft lo explica entre sus consejos para que la compu ande mejor."
    abrir: "https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96"
fuentes:
  - https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96
