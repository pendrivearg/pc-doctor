id: REN-018
area: programas
titulo:
  sencillo: "La compu nueva vino con programas que no uso"
  tecnico: "Desinstalar aplicaciones preinstaladas"
explicacion:
  sencillo: "Muchas compus vienen con juegos, programas de prueba y aplicaciones del fabricante. Los que no usás se pueden desinstalar para liberar espacio. Algunos son parte de Windows y no se pueden sacar."
  tecnico: "Desinstalación desde Aplicaciones instaladas o Panel de control > Programas y características; las aplicaciones integradas de Windows no se pueden quitar."
frases: ["la compu vino llena de programas que no uso", "sacar los programas que trae la notebook", "desinstalar los juegos que vinieron con la compu", "borrar los programas de fábrica"]
pasos:
  - texto: "Abrí Aplicaciones instaladas, buscá el programa, tocá los tres puntitos (…) > «Desinstalar» y seguí los pasos. Desinstalá solo lo que reconocés y sabés que no usás."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si un programa no se deja sacar desde ahí, probá desde Panel de control > «Programas» > «Programas y características»: clic derecho > «Desinstalar»."
    abrir: "https://support.microsoft.com/windows/uninstall-or-remove-apps-and-programs-in-windows-4b55f974-2cc6-2d2b-d092-5905080eaf98"
  - texto: "Si te aparece un antivirus de prueba vencido, escribile a PC Doctor «el antivirus de prueba se venció»."
fuentes:
  - https://support.microsoft.com/windows/uninstall-or-remove-apps-and-programs-in-windows-4b55f974-2cc6-2d2b-d092-5905080eaf98
  - https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96
madurez: T0
