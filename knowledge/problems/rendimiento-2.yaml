id: REN-016
area: rendimiento
titulo:
  sencillo: "La búsqueda de Windows (indexación) usa mucho la compu"
  tecnico: "SearchIndexer: rendimiento de la indización de Windows Search"
explicacion:
  sencillo: "Para encontrar archivos rápido, Windows arma una lista (un «índice») de todo lo que tenés. Mientras la arma usa procesador y disco, sobre todo después de copiar muchos archivos. Con muchísimos archivos o un correo de Outlook enorme, puede andar pesado."
  tecnico: "El rendimiento depende de la cantidad de elementos indizados y del tamaño del índice; por encima de 400.000 elementos pueden aparecer problemas."
frases: ["el searchindexer consume mucho", "la indexación de windows me pone lenta la pc", "la búsqueda de windows usa mucho disco", "windows search indexer al 100"]
pasos:
  - texto: "Si copiaste muchos archivos hace poco, dejá la compu prendida y enchufada unas horas: la indexación termina sola y se frena mientras la estás usando."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/shell-experience/windows-search-performance-issues"
  - texto: "Para que indexe menos: Configuración > Privacidad y seguridad > la sección de búsqueda en Windows, y usá la opción para excluir una carpeta con muchísimos archivos que nunca buscás."
  - texto: "Si la búsqueda anda mal o no termina nunca, en esa misma sección entrá en las opciones avanzadas de indexación > «Opciones avanzadas» > «Reconstruir». Puede tardar hasta un día."
  - texto: "No apagues el servicio de búsqueda ni uses programas «optimizadores» que lo apagan: Microsoft recomienda no usarlos si querés buscar en la compu."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/shell-experience/windows-search-performance-issues
madurez: T0
