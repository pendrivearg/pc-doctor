id: REN-022
area: archivos
titulo:
  sencillo: "OneDrive está sincronizando y me pone lenta la compu o Internet"
  tecnico: "Pausar la sincronización de OneDrive"
explicacion:
  sencillo: "Cuando OneDrive sube o baja muchos archivos, usa Internet y el disco. Si necesitás la compu liviana un rato, lo podés pausar 2, 8 o 24 horas; después sigue solo."
  tecnico: "Clic derecho en el ícono de OneDrive > pausar 2, 8 o 24 h. También se pausa solo con ahorro de batería o en redes de uso medido."
frases: ["onedrive me consume todo internet", "pausar onedrive un rato", "onedrive está sincronizando y todo anda lento", "parar un rato la sincronización de onedrive"]
pasos:
  - texto: "Abajo a la derecha, hacé clic derecho en la nube de OneDrive (puede estar escondida bajo la flechita «^»)."
    abrir: "https://support.microsoft.com/onedrive/how-to-pause-and-resume-onedrive-sync"
  - texto: "Elegí pausar y por cuánto tiempo: 2, 8 o 24 horas. La nube queda marcada como en pausa."
  - texto: "Cuando pasa ese tiempo, vuelve a sincronizar solo. Para seguir antes, tocá la nube y el botón de reanudar. Mientras está en pausa, los cambios no se suben a la nube."
derivar: "Si OneDrive nunca termina de sincronizar, escribile a PC Doctor «OneDrive no sincroniza»."
fuentes:
  - https://support.microsoft.com/onedrive/how-to-pause-and-resume-onedrive-sync
madurez: T0
