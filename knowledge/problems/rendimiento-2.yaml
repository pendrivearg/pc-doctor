id: REN-008
area: archivos
titulo:
  sencillo: "Voy a borrar los archivos temporales: ¿qué casillas marco?"
  tecnico: "Elegir categorías en Archivos temporales y en el Liberador de espacio en disco"
explicacion:
  sencillo: "Cuando limpiás los archivos temporales, Windows te muestra una lista de cosas para borrar, cada una con lo que ocupa. La mayoría se puede borrar sin problema, pero conviene leer cada casilla antes, porque algunas pueden incluir cosas tuyas."
  tecnico: "Sistema > Almacenamiento > Archivos temporales (Windows 11) o Liberador de espacio en disco; por defecto vienen marcados archivos de programas descargados, temporales de Internet y miniaturas."
frases: ["qué tildo para borrar los temporales", "qué casillas marco en el liberador de espacio", "es seguro borrar todos los archivos temporales", "qué son las miniaturas y los temporales de internet"]
pasos:
  - texto: "Abrí Almacenamiento y tocá «Archivos temporales». Esperá a que Windows calcule cuánto ocupa cada cosa."
    abrir: "ms-settings:storagesense"
  - texto: "Leé cada casilla antes de marcarla. Si en la lista ves «Descargas» o la Papelera, marcalas solo si ya revisaste lo que hay adentro y no necesitás nada."
  - texto: "Cuando tengas marcado solo lo que querés borrar, tocá «Quitar archivos»."
    abrir: "https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96"
  - texto: "En el Liberador de espacio en disco pasa lo mismo: vienen marcadas algunas casillas por defecto y podés desmarcar las que quieras conservar. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/disk-cleanup-in-windows-8a96ff42-5751-39ad-23d6-434b4d5b9a68"
derivar: "Si lo que querés es que la limpieza se haga sola, escribile a PC Doctor «activar el sensor de almacenamiento»."
fuentes:
  - https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96
  - https://support.microsoft.com/windows/disk-cleanup-in-windows-8a96ff42-5751-39ad-23d6-434b4d5b9a68
madurez: T0
