id: REN-020
area: seguridad
titulo:
  sencillo: "El antivirus se pone a revisar la compu justo cuando la estoy usando"
  tecnico: "Programar el análisis de Microsoft Defender Antivirus (Programador de tareas)"
explicacion:
  sencillo: "El antivirus de Windows revisa la compu cada tanto y trata de hacerlo cuando no la usás. Si igual te agarra en medio del trabajo, le podés indicar un horario en el que la compu esté prendida pero sin uso."
  tecnico: "Programador de tareas > Biblioteca > Microsoft > Windows > Windows Defender > «Windows Defender Scheduled Scan» > Desencadenadores > Nuevo."
frases: ["el antivirus escanea cuando estoy trabajando", "cambiar el horario del análisis de windows defender", "programar el escaneo del antivirus", "que el antivirus revise la compu a la noche"]
pasos:
  - texto: "Tocá la lupa, escribí «Programador de tareas» y abrilo."
    abrir: "https://support.microsoft.com/windows/schedule-a-scan-in-microsoft-defender-antivirus-54b64e9c-880a-c6b6-2416-0eb330ed5d2d"
  - texto: "A la izquierda, abrí «Biblioteca del Programador de tareas» > «Microsoft» > «Windows» y elegí la carpeta «Windows Defender»."
  - texto: "En el medio, hacé doble clic en «Windows Defender Scheduled Scan». Andá a la pestaña «Desencadenadores» y tocá «Nuevo»."
  - texto: "Elegí cada cuánto y a qué hora querés el análisis (un horario en que la compu esté prendida pero no la uses) y tocá «Aceptar». No borres ni desactives esa tarea: es la revisión del antivirus."
fuentes:
  - https://support.microsoft.com/windows/schedule-a-scan-in-microsoft-defender-antivirus-54b64e9c-880a-c6b6-2416-0eb330ed5d2d
madurez: T0
