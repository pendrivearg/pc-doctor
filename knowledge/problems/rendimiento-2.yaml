id: REN-017
area: programas
titulo:
  sencillo: "No uso Copilot y lo quiero sacar de la compu"
  tecnico: "Desinstalar la aplicación Microsoft Copilot"
explicacion:
  sencillo: "Copilot es el asistente con inteligencia artificial de Microsoft. Es una aplicación más: si no la usás, la podés desinstalar, y si algún día la querés, la volvés a bajar de la Microsoft Store."
  tecnico: "Aplicaciones > Aplicaciones instaladas > Copilot > … > Desinstalar. La tecla Copilot se puede reasignar en Personalización > Entrada de texto."
frases: ["quiero sacar copilot", "desinstalar copilot de windows", "se me abre copilot y no lo uso", "cómo quito la inteligencia artificial de la compu"]
pasos:
  - texto: "Abrí Aplicaciones instaladas, buscá «Copilot», tocá los tres puntitos (…) y elegí «Desinstalar»."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si es una compu del trabajo, consultá antes con quien la administra. Si después lo querés de vuelta, buscalo en la Microsoft Store."
    abrir: "https://learn.microsoft.com/windows/client-management/manage-windows-copilot"
derivar: "Si lo que te molesta es que se abre al tocar una tecla nueva del teclado, escribile a PC Doctor «toco sin querer la tecla de Copilot»."
fuentes:
  - https://learn.microsoft.com/windows/client-management/manage-windows-copilot
  - https://support.microsoft.com/windows/uninstall-or-remove-apps-and-programs-in-windows-4b55f974-2cc6-2d2b-d092-5905080eaf98
madurez: T0
