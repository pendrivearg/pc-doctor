id: REN-004
area: rendimiento
titulo:
  sencillo: "«Host de servicio» aparece usando mucho en el Administrador de tareas"
  tecnico: "svchost.exe (Service Host) con consumo alto"
explicacion:
  sencillo: "«Host de servicio» no es un virus: es la forma en que Windows hace funcionar sus servicios (actualizaciones, red, sonido y otros). Por eso hay muchos en la lista. Si uno gasta mucho, hay que ver qué servicio tiene adentro."
  tecnico: "svchost.exe aloja servicios cargados desde DLL. Con más de 3,5 GB de RAM cada servicio corre en su propia instancia, así que el servicio que consume se identifica directamente."
frases: ["service host usa mucho cpu", "host de servicio me consume la memoria", "qué es svchost y por qué hay tantos", "un host de servicio está al máximo"]
pasos:
  - texto: "Abrí el Administrador de tareas (Ctrl + Mayús + Esc). En «Procesos», tocá la flechita al lado del «Host de servicio» que más gasta: abajo aparece el nombre del servicio que está trabajando."
    abrir: "https://learn.microsoft.com/windows/application-management/svchost-service-refactoring"
  - texto: "Que haya muchos «Host de servicio» es normal: Windows pone cada servicio en el suyo para que, si uno falla, no arrastre a los demás."
  - texto: "No detengas servicios desde la pestaña «Servicios»: Windows los necesita. Si el consumo alto sigue todo el día, escribile a PC Doctor «la computadora está lenta»."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/support-tools/support-tools-task-manager"
fuentes:
  - https://learn.microsoft.com/windows/application-management/svchost-service-refactoring
  - https://learn.microsoft.com/troubleshoot/windows-server/support-tools/support-tools-task-manager
madurez: T0
