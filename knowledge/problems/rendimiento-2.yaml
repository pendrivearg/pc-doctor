# Rendimiento y mantenimiento de Windows: Administrador de tareas, procesos que consumen, disco, memoria virtual, limpieza, energía, monitores y registros. Guiadas con fuente oficial.
id: REN-001
area: rendimiento
titulo:
  sencillo: "Quiero ver qué programa está haciendo trabajar a la compu"
  tecnico: "Administrador de tareas: pestañas Procesos y Rendimiento"
explicacion:
  sencillo: "El Administrador de tareas muestra cada programa abierto y cuánto usa del procesador, de la memoria, del disco y de la red. Sirve para descubrir cuál es el que pone pesada la compu."
  tecnico: "Ctrl + Mayús + Esc. Procesos: aplicaciones y procesos en segundo plano con su consumo; Rendimiento: gráficos de uso total por recurso."
frases: ["cómo veo qué programa me come la compu", "qué es lo que está consumiendo tanto en la pc", "abrir el administrador de tareas", "quiero saber qué programa usa más memoria"]
pasos:
  - texto: "Apretá Ctrl + Mayús + Esc. Si la ventana se abre chiquita, tocá «Más detalles» abajo."
    abrir: "https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows"
  - texto: "En «Procesos» está la lista de programas. Fijate en las columnas «CPU», «Memoria» y «Disco»: muestran cuánto usa cada uno en este momento."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/support-tools/support-tools-task-manager"
  - texto: "En «Rendimiento» ves con gráficos el uso total del procesador, la memoria, el disco y la red."
  - texto: "Si un programa que no estás usando aparece gastando mucho, cerralo. Microsoft lo explica entre sus consejos para que la compu ande mejor."
    abrir: "https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96"
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/support-tools/support-tools-task-manager
  - https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
