id: REN-024
area: seguridad
titulo:
  sencillo: "Tengo dos antivirus instalados y la compu anda pesada"
  tecnico: "Varios productos antivirus en el mismo equipo"
explicacion:
  sencillo: "Tener dos antivirus funcionando a la vez no protege más: pueden chocar entre sí y poner lenta la compu. Cuando instalás otro antivirus, el de Windows se hace a un lado solo, y vuelve a prenderse si el otro se vence o lo desinstalás."
  tecnico: "En Windows 10/11, con un antivirus de terceros activo, Microsoft Defender Antivirus pasa a deshabilitado automáticamente y se reactiva si el otro deja de proteger. Los conflictos entre productos afectan el rendimiento."
frases: ["tengo dos antivirus", "instalé otro antivirus y ahora anda lenta la compu", "puedo tener el avast y el defender juntos", "qué antivirus está activo en mi compu"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Protección antivirus y contra amenazas». Debajo de «¿Quién me protege?», tocá «Administrar proveedores» para ver qué antivirus está activo."
    abrir: "ms-settings:windowsdefender"
  - texto: "Si tenés más de un antivirus que no es de Microsoft (por ejemplo, uno de prueba que vino con la compu y otro que instalaste), quedate con uno solo y desinstalá el otro desde Aplicaciones instaladas."
    abrir: "ms-settings:appsfeatures"
  - texto: "No desactives el Antivirus de Microsoft Defender: si desinstalás el otro, Windows lo vuelve a prender solo."
    abrir: "https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-compatibility"
derivar: "Si no sabés cuál de los dos dejar, escribile a PC Doctor «el antivirus de prueba se venció» o pasá el diagnóstico."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-compatibility
  - https://learn.microsoft.com/defender-endpoint/troubleshoot-performance-issues
madurez: T0
