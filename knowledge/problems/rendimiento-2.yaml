id: REN-002
area: rendimiento
titulo:
  sencillo: "«Antimalware Service Executable» usa mucho procesador"
  tecnico: "MsMpEng.exe (Antivirus de Microsoft Defender) con uso alto de CPU"
explicacion:
  sencillo: "Ese nombre es el antivirus de Windows (Microsoft Defender) trabajando. Cuando revisa la compu, después de actualizarse o al abrir programas nuevos, puede usar mucho procesador un rato. No hay que apagarlo: es lo que te protege."
  tecnico: "Picos por análisis programados, análisis tras actualizaciones de inteligencia de seguridad, archivos complejos o conflictos con otro producto de seguridad."
frases: ["el antimalware service executable me consume todo", "antimalware service executable usa mucho cpu", "el antivirus de windows me pone lenta la compu", "msmpeng.exe está al 100"]
pasos:
  - texto: "Si la compu recién se prendió o se actualizó, esperá unos minutos: el antivirus suele estar haciendo un análisis y después baja solo."
    abrir: "https://learn.microsoft.com/defender-endpoint/schedule-antivirus-scans"
  - texto: "Windows trata de revisar la compu cuando no la estás usando. Dejala prendida y enchufada un rato sin usarla para que termine tranquila."
    abrir: "https://support.microsoft.com/windows/schedule-a-scan-in-microsoft-defender-antivirus-54b64e9c-880a-c6b6-2416-0eb330ed5d2d"
  - texto: "Revisá que no tengas dos antivirus a la vez: chocan entre sí. Abrí Seguridad de Windows > «Protección antivirus y contra amenazas» y fijate cuál figura. Si instalaste otro, escribile a PC Doctor «tengo dos antivirus»."
    abrir: "ms-settings:windowsdefender"
  - texto: "No lo desactives ni lo cierres a la fuerza. Si sigue alto todo el día durante varios días, escribile a PC Doctor «creo que tengo un virus»."
    abrir: "https://learn.microsoft.com/defender-endpoint/troubleshoot-performance-issues"
fuentes:
  - https://learn.microsoft.com/defender-endpoint/troubleshoot-performance-issues
  - https://learn.microsoft.com/defender-endpoint/schedule-antivirus-scans
  - https://support.microsoft.com/windows/schedule-a-scan-in-microsoft-defender-antivirus-54b64e9c-880a-c6b6-2416-0eb330ed5d2d
