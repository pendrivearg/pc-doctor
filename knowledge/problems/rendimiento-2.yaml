id: REN-011
area: rendimiento
titulo:
  sencillo: "La compu se calienta y se pone lenta"
  tecnico: "Pérdida de rendimiento por temperatura alta"
explicacion:
  sencillo: "Cuando la compu está muy caliente, puede andar más lenta. Dejarla enfriar y cerrar lo que más la exige suele ayudar."
  tecnico: "Con temperatura alta el equipo reduce el rendimiento; las tareas exigentes (video, juegos) aumentan el calor."
frases: ["la notebook se pone re caliente y se tilda", "cuando se calienta anda lentísima", "la compu quema y se pone lenta", "se recalienta y baja el rendimiento"]
pasos:
  - texto: "Llevala a un lugar más fresco y esperá unos cinco minutos para ver si vuelve a andar más rápido."
    abrir: "https://support.microsoft.com/help/4023507"
  - texto: "Cerrá un rato lo que más la exige, como videos o juegos: así se enfría."
  - texto: "Si es notebook, enchufala cuando puedas."
  - texto: "Abrí el Administrador de tareas (Ctrl + Mayús + Esc) y fijate si algún programa que no estás usando gasta mucho procesador."
    abrir: "https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96"
derivar: "Si se calienta aunque no estés haciendo nada pesado, o el ventilador hace un ruido raro, puede necesitar una limpieza o una revisión por dentro: llevala a un técnico."
fuentes:
  - https://support.microsoft.com/help/4023507
  - https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96
madurez: T0
