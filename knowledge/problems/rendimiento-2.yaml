id: REN-015
area: windows
titulo:
  sencillo: "Abrí el Visor de eventos y está lleno de errores: ¿es grave?"
  tecnico: "Visor de eventos (eventvwr): mensajes habituales del sistema"
explicacion:
  sencillo: "El Visor de eventos es un registro donde Windows anota muchísimos mensajes del sistema. Que aparezcan errores o advertencias no quiere decir por sí solo que la compu esté rota. Ojo: los estafadores telefónicos muestran esos mensajes normales para asustarte."
  tecnico: "Registros de eventos de Windows (eventvwr). Las estafas de soporte técnico presentan mensajes normales del sistema como síntomas de problemas."
frases: ["el visor de eventos tiene un montón de errores", "me llamaron y me dijeron que abra el visor de eventos", "qué es el visor de eventos", "hay errores rojos en el registro de windows"]
pasos:
  - texto: "Si alguien te llamó diciendo que es de Microsoft y te pidió abrir el Visor de eventos, cortá: es una estafa. Microsoft no te llama si vos no lo pediste."
    abrir: "https://support.microsoft.com/windows/protect-yourself-from-tech-support-scams-2ebf91bd-f94c-2a8a-e541-f5c800d18435"
  - texto: "Si lo querés mirar vos: apretá Windows + R, escribí eventvwr y apretá Enter."
    abrir: "https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc766401(v=ws.11)"
  - texto: "Para algo más fácil de entender, usá el historial de confiabilidad: escribile a PC Doctor «ver el historial de errores de la compu»."
fuentes:
  - https://support.microsoft.com/windows/protect-yourself-from-tech-support-scams-2ebf91bd-f94c-2a8a-e541-f5c800d18435
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc766401(v=ws.11)
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
