id: REN-025
area: programas
titulo:
  sencillo: "Edge aparece funcionando aunque no lo abrí"
  tecnico: "Aumento de inicio (startup boost) de Microsoft Edge"
explicacion:
  sencillo: "Edge deja una parte de sí mismo funcionando en segundo plano para abrir más rápido. Por eso puede aparecer en el Administrador de tareas aunque no lo hayas abierto. Usa muy pocos recursos, pero si preferís, se puede apagar."
  tecnico: "Startup boost mantiene procesos mínimos de Edge en segundo plano tras iniciar sesión o cerrar el navegador; se activa o desactiva en edge://settings/system/manageSystem."
frases: ["el edge aparece abierto aunque no lo uso", "microsoft edge en el administrador de tareas sin abrirlo", "edge queda funcionando en segundo plano", "por qué edge arranca solo con la compu"]
pasos:
  - texto: "Abrí Edge, escribí edge://settings/system/manageSystem en la barra de direcciones y apretá Enter."
    abrir: "https://support.microsoft.com/edge/get-help-with-startup-boost"
  - texto: "Buscá la opción de aumento de inicio (en inglés, «Startup boost») y apagala si no la querés. Edge va a tardar un poquito más en abrir."
  - texto: "Si Edge se abre solo con páginas que no pediste, escribile a PC Doctor «el navegador se abre solo»."
fuentes:
  - https://support.microsoft.com/edge/get-help-with-startup-boost
madurez: T0

