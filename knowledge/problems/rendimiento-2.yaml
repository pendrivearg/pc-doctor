id: REN-005
area: rendimiento
titulo:
  sencillo: "Hay aplicaciones que siguen funcionando aunque no las abra"
  tecnico: "Permisos de aplicaciones en segundo plano"
explicacion:
  sencillo: "Algunas aplicaciones siguen trabajando escondidas, en «segundo plano», aunque no las tengas abiertas. Si no las necesitás, les podés decir que no lo hagan y la compu queda más liviana."
  tecnico: "Windows 11: Aplicaciones > Aplicaciones instaladas > … > Opciones avanzadas > permisos de aplicaciones en segundo plano = Nunca. Windows 10: Privacidad > Aplicaciones en segundo plano."
frases: ["apps que funcionan en segundo plano", "que las aplicaciones no queden andando escondidas", "desactivar las aplicaciones en segundo plano", "programas que siguen funcionando aunque los cierre"]
pasos:
  - texto: "Abrí Aplicaciones instaladas."
    abrir: "ms-settings:appsfeatures"
  - texto: "Buscá la aplicación, tocá los tres puntitos (…) y elegí «Opciones avanzadas». Si no aparece esa opción, esa aplicación no se maneja desde acá."
  - texto: "En la parte de permisos de segundo plano, elegí «Nunca». Hacelo solo con aplicaciones que no usás seguido."
  - texto: "En Windows 10 está en Privacidad > «Aplicaciones en segundo plano». Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96"
fuentes:
  - https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96
madurez: T0
