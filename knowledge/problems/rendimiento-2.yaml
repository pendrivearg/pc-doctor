id: REN-003
area: rendimiento
titulo:
  sencillo: "El Administrador de tareas muestra el disco al 100 %"
  tecnico: "Uso de disco sostenido al 100 %"
explicacion:
  sencillo: "Cuando el disco está al 100 %, todo tarda: abrir carpetas, programas o el navegador. Suele pasar un rato después de prender o mientras Windows trabaja. Si pasa siempre, hay que ver qué programa lo está usando."
  tecnico: "Disco saturado de lecturas y escrituras (frecuente en discos rígidos). Identificar el proceso con el Administrador de tareas o el Monitor de recursos."
frases: ["el disco está al 100 por ciento", "disco al 100 en el administrador de tareas", "el disco no baja del 100", "el uso del disco está siempre al máximo"]
pasos:
  - texto: "Apretá Ctrl + Mayús + Esc, entrá en «Procesos» y mirá la columna «Disco»: ahí ves qué programa lo está usando."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-server/support-tools/support-tools-task-manager"
  - texto: "Cerrá los programas que no uses y reiniciá la compu (Inicio > Encendido > Reiniciar). Fijate si después baja."
    abrir: "https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96"
  - texto: "Para ver más detalle: apretá Windows + R, escribí perfmon /res y apretá Enter. En la pestaña «Disco» del Monitor de recursos figura cada programa que está leyendo o escribiendo."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/perfmon"
  - texto: "Si la compu tiene un disco rígido común (no SSD) y esto pasa siempre, escribile a PC Doctor «cambiar el disco por un SSD»."
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-server/support-tools/support-tools-task-manager
  - https://support.microsoft.com/windows/tips-to-improve-pc-performance-in-windows-b3b3ef5b-5953-fb6a-2528-4bbed82fba96
  - https://learn.microsoft.com/windows-server/administration/windows-commands/perfmon
madurez: T0
