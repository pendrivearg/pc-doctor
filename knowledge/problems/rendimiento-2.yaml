id: REN-007
area: archivos
titulo:
  sencillo: "Quiero que Windows libere espacio solo, sin tener que acordarme"
  tecnico: "Configurar la ejecución automática del Sensor de almacenamiento"
explicacion:
  sencillo: "El Sensor de almacenamiento borra solo los archivos temporales y, si querés, lo viejo de la Papelera y de Descargas. Viene apagado: lo podés prender y elegir cada cuánto trabaja."
  tecnico: "Sistema > Almacenamiento > Sensor de almacenamiento: limpieza automática, frecuencia, Papelera, Descargas y contenido de OneDrive a solo en línea. Actúa solo en la unidad del sistema (C:)."
frases: ["que la compu borre sola los temporales", "activar el sensor de almacenamiento", "limpieza automática del disco", "que se vacíe sola la papelera"]
pasos:
  - texto: "Abrí la configuración del Sensor de almacenamiento y activalo."
    abrir: "ms-settings:storagepolicies"
  - texto: "Elegí cada cuánto querés que trabaje. Si no cambiás nada, trabaja cuando queda poco espacio."
  - texto: "Ojo antes de activar el borrado de Descargas o de la Papelera: lo que tenga más tiempo que el que elijas se borra. Pasá antes a otra carpeta lo que quieras guardar."
  - texto: "Si usás OneDrive, puede dejar archivos «solo en línea»: no se borran, siguen en la nube. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/manage-drive-space-with-storage-sense-654f6ada-7bfc-45e5-966b-e24aded96ad5"
fuentes:
  - https://support.microsoft.com/windows/manage-drive-space-with-storage-sense-654f6ada-7bfc-45e5-966b-e24aded96ad5
madurez: T0
