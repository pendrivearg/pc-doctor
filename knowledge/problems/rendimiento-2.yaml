id: REN-021
area: red
titulo:
  sencillo: "Windows usa mi Internet para compartir actualizaciones con otras compus"
  tecnico: "Optimización de distribución: descargas de otros dispositivos y límites de ancho de banda"
explicacion:
  sencillo: "Windows puede bajar actualizaciones desde Microsoft y también desde otras compus, y compartir las que ya bajó. Podés limitarlo a las compus de tu casa o ponerle un tope para que no te frene Internet."
  tecnico: "Windows Update > Opciones avanzadas > Optimización de distribución: descargas desde otros dispositivos, límites de descarga y subida, límite mensual de subida y monitor de actividad."
frases: ["windows usa mi internet para actualizar otras compus", "las actualizaciones me consumen todo internet", "qué es la optimización de distribución", "limitar lo que baja windows update"]
pasos:
  - texto: "Abrí Optimización de distribución."
    abrir: "ms-settings:delivery-optimization"
  - texto: "En la opción para permitir descargas de otros dispositivos, elegí que sea solo con los dispositivos de tu red local (los de tu casa), o apagala. Las actualizaciones siguen llegando desde Microsoft."
  - texto: "En las opciones avanzadas podés poner un límite a lo que usa para bajar y para subir, y un tope de subida por mes."
  - texto: "En el monitor de actividad ves cuánto bajó y subió este mes. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/deployment/updates-lifecycle/delivery-optimization-in-windows"
fuentes:
  - https://support.microsoft.com/windows/deployment/updates-lifecycle/delivery-optimization-in-windows
madurez: T0
