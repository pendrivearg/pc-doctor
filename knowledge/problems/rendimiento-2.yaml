id: REN-019
area: rendimiento
titulo:
  sencillo: "Quiero que la compu gaste menos energía sin tocar mil opciones"
  tecnico: "Recomendaciones de energía (Sistema > Energía y batería)"
explicacion:
  sencillo: "Windows 11 junta en una sola pantalla los ajustes que más energía ahorran: el modo de energía, el brillo, cuándo se apaga la pantalla y cuándo se suspende la compu. Los aplicás de a uno."
  tecnico: "Sistema > Energía y batería > Recomendaciones de energía; cada recomendación se aplica por separado y varía según el equipo."
frases: ["recomendaciones de energía de windows", "que la compu consuma menos luz", "ahorrar energía en la pc", "configurar la energía como recomienda windows"]
pasos:
  - texto: "Abrí Recomendaciones de energía."
    abrir: "ms-settings:energyrecommendations"
  - texto: "Leé cada recomendación y aplicá las que quieras, por ejemplo que la pantalla se apague y la compu se suspenda después de unos minutos sin usarla."
  - texto: "Algunas solo aparecen en notebooks o en equipos con sensores. Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/power-battery/learn-more-about-energy-recommendations"
derivar: "Si después la pantalla se apaga demasiado rápido, escribile a PC Doctor «la pantalla se apaga muy rápido»."
fuentes:
  - https://support.microsoft.com/windows/experience/power-battery/learn-more-about-energy-recommendations
madurez: T0
