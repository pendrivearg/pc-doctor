id: REN-006
area: rendimiento
titulo:
  sencillo: "Quiero desfragmentar u optimizar el disco"
  tecnico: "Desfragmentar y optimizar unidades (desfragmentación en HDD, TRIM en SSD)"
explicacion:
  sencillo: "Windows ya ordena el disco solo, una vez por semana. En los discos rígidos junta los pedazos de los archivos; en los SSD hace otra limpieza distinta. Si querés, también lo podés hacer a mano."
  tecnico: "Optimización programada semanal por defecto: desfragmenta discos rígidos y envía TRIM a los SSD."
frases: ["cómo desfragmento el disco", "optimizar el disco duro", "hay que desfragmentar un ssd", "ordenar el disco para que ande más rápido"]
pasos:
  - texto: "Tocá la lupa de la barra de tareas, escribí «desfragmentar» y abrí «Desfragmentar y optimizar unidades»."
  - texto: "Elegí el disco y tocá «Optimizar». En un disco rígido podés tocar antes «Analizar» para ver si hace falta."
  - texto: "Fijate que la «Optimización programada» esté activada: así Windows lo sigue haciendo solo."
  - texto: "Microsoft lo explica."
    abrir: "https://support.microsoft.com/windows/experience/storage-filemanagement/defragment-optimize-your-data-drives-in-windows"
fuentes:
  - https://support.microsoft.com/windows/experience/storage-filemanagement/defragment-optimize-your-data-drives-in-windows
madurez: T0
