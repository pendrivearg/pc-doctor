id: REN-012
area: rendimiento
titulo:
  sencillo: "El ventilador suena fuerte cuando uso el navegador"
  tecnico: "Navegador con consumo alto: ahorro de energía en Edge y Chrome"
explicacion:
  sencillo: "Muchas pestañas, videos o páginas pesadas hacen trabajar al procesador, y el ventilador se acelera para enfriarlo. Edge y Chrome tienen un ahorro de energía que frena lo que hacen las pestañas que no estás mirando."
  tecnico: "Edge: Ahorro de energía (antes «modo de eficiencia») en Sistema y rendimiento > Rendimiento. Chrome: Ahorro de energía en Rendimiento (solo con batería baja o desenchufado)."
frases: ["el ventilador se acelera cuando abro chrome", "la compu hace ruido de turbina con el navegador", "cuando navego el cooler suena fuerte", "el edge hace que suene el ventilador"]
pasos:
  - texto: "En Edge: «Configuración y más» (…) > «Configuración» > «Sistema y rendimiento» > «Rendimiento», y activá el ahorro de energía (antes se llamaba «modo de eficiencia»)."
    abrir: "https://support.microsoft.com/edge/learn-about-performance-features-in-microsoft-edge"
  - texto: "En Chrome: tres puntitos («Más») > «Configuración» > «Rendimiento», y activá «Ahorro de energía». Ojo: en Chrome solo funciona con la notebook desenchufada o con poca batería."
    abrir: "https://support.google.com/chrome/answer/12929150?hl=es-419"
  - texto: "Si el ventilador sigue fuerte aunque cierres el navegador, escribile a PC Doctor «la compu se calienta y se pone lenta»."
fuentes:
  - https://support.microsoft.com/edge/learn-about-performance-features-in-microsoft-edge
  - https://support.google.com/chrome/answer/12929150?hl=es-419
madurez: T0
