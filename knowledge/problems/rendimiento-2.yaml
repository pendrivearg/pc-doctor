id: REN-023
area: archivos
titulo:
  sencillo: "Quiero encontrar los archivos grandes que me ocupan el disco"
  tecnico: "Recomendaciones de limpieza: archivos grandes o sin usar"
explicacion:
  sencillo: "Windows te muestra en una lista los archivos más grandes y los que hace mucho no abrís, además de aplicaciones que no usás. Vos decidís qué borrar."
  tecnico: "Sistema > Almacenamiento > Recomendaciones de limpieza: archivos temporales, archivos grandes o sin usar, archivos sincronizados con la nube y aplicaciones sin usar."
frases: ["qué archivos ocupan más lugar", "encontrar los archivos grandes de la pc", "ver qué me llena el disco", "archivos viejos que no uso y ocupan espacio"]
pasos:
  - texto: "Abrí Recomendaciones de limpieza."
    abrir: "ms-settings:storagerecommendations"
  - texto: "Mirá la parte de archivos grandes o sin usar y marcá solo lo que estés seguro de que no necesitás."
  - texto: "Ojo: lo que limpies se borra. Si dudás, pasalo antes a un pendrive o a un disco externo. Después tocá el botón para limpiar."
    abrir: "https://support.microsoft.com/windows/disk-cleanup-in-windows-8a96ff42-5751-39ad-23d6-434b4d5b9a68"
  - texto: "Ahí también aparecen aplicaciones que no usás. Para sacarlas, escribile a PC Doctor «la compu vino llena de programas que no uso»."
fuentes:
  - https://support.microsoft.com/windows/disk-cleanup-in-windows-8a96ff42-5751-39ad-23d6-434b4d5b9a68
madurez: T0
