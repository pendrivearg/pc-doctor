id: REN-014
area: windows
titulo:
  sencillo: "Quiero ver el historial de errores y cuelgues de la compu"
  tecnico: "Monitor de confiabilidad (perfmon /rel)"
explicacion:
  sencillo: "Windows anota día por día los programas que se colgaron, los errores de Windows y lo que se instaló. En un gráfico podés ver desde cuándo empezaron los problemas."
  tecnico: "Monitor de confiabilidad: índice de estabilidad e informe por día (errores de aplicaciones, de Windows, de hardware, varios e instalaciones de software)."
frases: ["ver el historial de errores de la compu", "desde cuándo empezó a fallar la compu", "abrir el monitor de confiabilidad", "ver qué programas se colgaron"]
pasos:
  - texto: "Apretá Windows + R, escribí perfmon /rel y apretá Enter."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/perfmon"
  - texto: "Cada columna es un día. Los íconos de error marcan fallas (programas que dejaron de funcionar, errores de Windows) y los de información, programas o actualizaciones que se instalaron."
  - texto: "Tocá un día para ver abajo el detalle. Si los problemas empezaron justo después de instalar algo, ahí tenés una pista."
    abrir: "https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc749583(v=ws.10)"
  - texto: "Si se repite siempre el mismo programa, actualizalo o escribile a PC Doctor «un programa se cierra solo»."
fuentes:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/perfmon
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc749583(v=ws.10)
madurez: T0
