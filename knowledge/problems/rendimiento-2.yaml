id: REN-009
area: rendimiento
titulo:
  sencillo: "Un programa dice que no hay memoria suficiente (memoria virtual)"
  tecnico: "Archivo de paginación (memoria virtual) insuficiente o desactivado"
explicacion:
  sencillo: "Además de la memoria RAM, Windows usa un archivo en el disco como memoria de reserva. Si ese archivo está apagado o el disco está lleno, los programas pueden dar errores de memoria, colgarse o cerrarse."
  tecnico: "Límite de confirmación = RAM + archivos de paginación. Administrado por el sistema (opción por defecto), crece hasta 3 × RAM o 4 GB si hay espacio libre en el disco."
frases: ["dice que la memoria virtual es insuficiente", "el programa dice que no hay memoria", "qué es el archivo de paginación", "me desactivaron la memoria virtual"]
pasos:
  - texto: "Revisá que el disco C: tenga espacio libre: la memoria virtual crece usando el disco. Si está lleno, escribile a PC Doctor «el disco está casi lleno»."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/performance/introduction-to-the-page-file"
  - texto: "Abrí Configuración > Sistema > Información (o apretá Windows + Pausa) y tocá «Configuración avanzada del sistema». En «Rendimiento», tocá «Configuración»."
    abrir: "ms-settings:about"
  - texto: "Pestaña «Opciones avanzadas» > «Memoria virtual» > «Cambiar». Lo normal es que esté marcado «Administrar automáticamente el tamaño del archivo de paginación para todas las unidades». Si alguien lo cambió, volvé a marcarlo, tocá «Aceptar» y reiniciá."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/performance/how-to-determine-the-appropriate-page-file-size-for-64-bit-versions-of-windows"
  - texto: "Si aun así siguen los errores de memoria, Microsoft explica cómo poner un tamaño fijo más grande."
    abrir: "https://learn.microsoft.com/troubleshoot/windows-client/performance/slow-page-file-growth-memory-allocation-errors"
fuentes:
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/introduction-to-the-page-file
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/how-to-determine-the-appropriate-page-file-size-for-64-bit-versions-of-windows
  - https://learn.microsoft.com/troubleshoot/windows-client/performance/slow-page-file-growth-memory-allocation-errors
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
