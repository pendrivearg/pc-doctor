id: REN-013
area: rendimiento
titulo:
  sencillo: "Quiero ver en detalle qué usa el disco, la memoria o Internet"
  tecnico: "Monitor de recursos (perfmon /res)"
explicacion:
  sencillo: "El Monitor de recursos es como un Administrador de tareas más detallado: muestra en vivo qué programa usa el procesador, la memoria, el disco o la red."
  tecnico: "Vista de recursos de Windows: pestañas Información general, CPU, Memoria, Disco y Red; filtro por proceso con las casillas."
frases: ["abrir el monitor de recursos", "ver qué programa usa internet", "ver en detalle qué programa usa el disco", "resmon"]
pasos:
  - texto: "Apretá Windows + R, escribí perfmon /res y apretá Enter."
    abrir: "https://learn.microsoft.com/windows-server/administration/windows-commands/perfmon"
  - texto: "Arriba tenés pestañas para el procesador, la memoria, el disco y la red. Si marcás la casilla de un programa, la ventana te muestra solo lo que hace ese programa."
    abrir: "https://learn.microsoft.com/training/modules/monitor-windows-server-performance/3-use-resource-monitor-to-review-current-resource-usage"
  - texto: "Tené en cuenta que muestra lo que pasa en ese momento: miralo un rato antes de sacar conclusiones."
fuentes:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/perfmon
  - https://learn.microsoft.com/training/modules/monitor-windows-server-performance/3-use-resource-monitor-to-review-current-resource-usage
  - https://support.microsoft.com/accessibility/windows/keyboard-shortcuts-in-windows
madurez: T0
