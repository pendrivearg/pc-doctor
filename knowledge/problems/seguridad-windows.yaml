id: WSEC-004
area: seguridad
titulo:
  sencillo: "Seguridad del dispositivo dice que «no se admite la seguridad de hardware estándar»"
  tecnico: "Nivel de seguridad de hardware en Seguridad del dispositivo"
explicacion:
  sencillo: "Abajo de todo, en «Seguridad del dispositivo», Windows dice qué tan protegida está la compu por su hardware. Si dice que no cumple el nivel estándar, falta alguna pieza: por ejemplo, el chip de seguridad (TPM 2.0) o el Arranque seguro. La compu funciona igual, pero con menos protección."
  tecnico: "Mensajes: cumple seguridad de hardware estándar (integridad de memoria/aislamiento del núcleo admitidos, TPM 2.0, Arranque seguro, DEP, UEFI MAT); mejorada (integridad de memoria activada); Secured-core (además protección SMM); «Standard hardware security not supported» si falla algún requisito."
frases: ["no se admite la seguridad de hardware estándar", "seguridad del dispositivo dice que no cumple los requisitos", "qué significa seguridad de hardware estándar", "mi compu no tiene seguridad de hardware mejorada"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Seguridad del dispositivo» y bajá hasta el final: ahí está el mensaje sobre el nivel de seguridad de hardware."
    abrir: "ms-settings:windowsdefender"
  - texto: "Si no cumple el estándar, mirá en esa misma pantalla si falta el procesador de seguridad (TPM) o si el Arranque seguro aparece apagado. Microsoft sugiere activar esas funciones en la BIOS/UEFI o consultar al fabricante."
    abrir: "https://support.microsoft.com/windows/security/windows-security/device-security-in-the-windows-security-app"
  - texto: "Para el chip de seguridad, escribile a PC Doctor «¿mi compu tiene TPM 2.0?»; para el arranque, «el Arranque seguro está desactivado»."
derivar: "Tocar la BIOS/UEFI es para alguien con experiencia: si tenés BitLocker, tené a mano la clave de recuperación y no cambies otras opciones. Ante la duda, pedí ayuda técnica."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/device-security-in-the-windows-security-app
madurez: T0
