id: WSEC-019
area: seguridad
titulo:
  sencillo: "¿Qué es Windows Sandbox y cómo lo activo?"
  tecnico: "Windows Sandbox: escritorio aislado y descartable; requisitos"
explicacion:
  sencillo: "Es como una «compu de prueba» dentro de tu compu: se abre en una ventana, ahí podés probar un programa o un archivo dudoso, y al cerrarla se borra todo lo que hiciste, sin tocar tu Windows. Solo viene en Windows Pro, Enterprise y Education, no en Home."
  tecnico: "Windows Sandbox: máquina virtual liviana y descartable aislada por hipervisor; cada inicio es limpio. Red habilitada por defecto. Requisitos: AMD64 o Arm64, virtualización activada en BIOS/UEFI, 4 GB de RAM (8 recomendados), 1 GB libre, 2 núcleos. Se activa en Características de Windows."
frases: ["qué es windows sandbox", "quiero probar un programa sin que toque mi compu", "no me aparece windows sandbox", "abrir un archivo dudoso en un lugar aislado"]
pasos:
  - texto: "Fijate tu edición de Windows: si dice «Home», Sandbox no está disponible."
    abrir: "ms-settings:about"
  - texto: "Buscá en Inicio «Activar o desactivar las características de Windows», marcá «Windows Sandbox» y tocá «Aceptar». Reiniciá si te lo pide. Después aparece en el menú Inicio."
    abrir: "https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/windows-sandbox-install"
  - texto: "Si la opción no está, la compu no cumple algún requisito: al menos 4 GB de memoria, 2 núcleos, 1 GB libre y la virtualización activada en la BIOS/UEFI."
  - texto: "Adentro tiene Internet y acceso a tu red, así que un programa malo podría intentar llegar a otras compus de tu casa. Para saber si un archivo tiene virus, es más fácil revisarlo con el antivirus."
    abrir: "https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/"
derivar: "Activar la virtualización en la BIOS/UEFI es para alguien con experiencia: si no sabés, pedí ayuda técnica y no cambies otras opciones."
fuentes:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/windows-sandbox-install
madurez: T0
---
id: WSEC-020
area: seguridad
titulo:
  sencillo: "En las propiedades de un archivo aparece una casilla «Desbloquear»: ¿la marco?"
  tecnico: "Marca de la web (Mark of the Web) y casilla Desbloquear"
explicacion:
  sencillo: "Windows le pone una marca a lo que bajás de Internet o te llega por correo, para tratarlo con más cuidado. Por eso algunos archivos muestran avisos o se abren limitados. La casilla «Desbloquear» saca esa marca: hacelo solo con archivos en los que confiás de verdad. Ante la duda, no lo desbloquees."
  tecnico: "MOTW (Zone.Identifier) en archivos de zona Internet o Sitios restringidos (descargas, adjuntos), solo en NTFS. Propiedades > General > Desbloquear lo elimina (equivale a Unblock-File)."
frases: ["el archivo dice que procede de otro equipo y podría bloquearse", "qué es la casilla desbloquear en propiedades", "el archivo que bajé está bloqueado", "tengo que desbloquear un archivo descargado"]
pasos:
  - texto: "Preguntate: ¿sabés quién te lo mandó y lo estabas esperando? Si no, no lo desbloquees y borralo."
  - texto: "Revisalo antes con el antivirus: clic derecho y la opción para examinarlo con Microsoft Defender."
    abrir: "https://support.microsoft.com/windows/security/windows-security/stay-protected-with-the-windows-security-app"
  - texto: "Solo si confiás en el archivo: clic derecho > «Propiedades». En la pestaña «General», marcá «Desbloquear» y tocá «Aceptar»."
    abrir: "https://learn.microsoft.com/microsoft-365-apps/security/internet-macros-blocked"
  - texto: "Si la casilla no aparece (pasa con archivos en carpetas de red), no busques otras formas de desbloquearlo: consultá con sistemas o con quien te lo mandó."
fuentes:
  - https://learn.microsoft.com/microsoft-365-apps/security/internet-macros-blocked
  - https://support.microsoft.com/windows/security/windows-security/stay-protected-with-the-windows-security-app
madurez: T0
