id: WSEC-009
area: seguridad
titulo:
  sencillo: "En el firewall aparecen «Red de dominio», «Red privada» y «Red pública»: ¿qué son?"
  tecnico: "Perfiles de red del Firewall de Windows"
explicacion:
  sencillo: "El firewall tiene tres «modos» según dónde estés conectado. Red pública: bares, hoteles o aeropuertos; es la más estricta. Red privada: tu casa, si confiás en los que se conectan. Red de dominio: solo para compus de una empresa. Lo correcto es que el firewall esté activado en las tres."
  tecnico: "Perfiles: dominio (se aplica solo si el equipo está unido a un dominio y ve un controlador; no se elige a mano), privado (redes de confianza), público (predeterminado para redes no identificadas, más restrictivo). Las reglas se asignan por perfil. Microsoft no recomienda deshabilitar el firewall."
frases: ["qué es red de dominio en el firewall", "en el firewall dice red privada y red pública", "cuál de las tres redes del firewall estoy usando", "el firewall tiene tres redes y no sé cuál activar"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Firewall y protección de red». Vas a ver las tres redes, y Windows marca a cuál estás conectado ahora."
    abrir: "ms-settings:windowsdefender"
  - texto: "Las tres tienen que tener el firewall activado. Si alguna figura desactivada, tocala y encendé el firewall de Microsoft Defender. Apagarlo deja la compu más expuesta."
    abrir: "https://support.microsoft.com/topic/ec0844f7-aebd-0583-67fe-601ecf5d774f"
  - texto: "Si dice «Red de dominio» y no estás en una empresa, no te preocupes: esa solo se usa en compus de trabajo."
    abrir: "https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/"
  - texto: "Para elegir si tu Wi-Fi es pública o privada, escribile a PC Doctor «¿pongo mi red como pública o privada?»."
fuentes:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/
  - https://support.microsoft.com/topic/ec0844f7-aebd-0583-67fe-601ecf5d774f
madurez: T0
