id: WSEC-014
area: seguridad
titulo:
  sencillo: "El antivirus se llevó un archivo mío y quiero recuperarlo"
  tecnico: "Restaurar un elemento en cuarentena desde el Historial de protección"
explicacion:
  sencillo: "Cuando el antivirus encuentra algo sospechoso, muchas veces no lo borra: lo encierra en «cuarentena». Se puede devolver, pero solo conviene si estás totalmente seguro de que el archivo es confiable. Si era un virus, lo estarías soltando otra vez."
  tecnico: "Historial de protección > filtro de elementos en cuarentena > Restaurar (requiere administrador). El archivo vuelve a su ubicación original; Defender lo detecta de nuevo como «Amenaza encontrada - acción necesaria» y hay que elegir Permitir en el dispositivo."
frases: ["el antivirus me borró un archivo", "recuperar un archivo de la cuarentena", "defender se llevó un programa que necesito", "sacar algo de la cuarentena de windows"]
pasos:
  - texto: "ANTES de seguir: si el archivo vino de una página que no es la oficial, de un correo, o es un «crack» o activador, no lo restaures. Lo más probable es que sea peligroso."
  - texto: "Abrí Seguridad de Windows > «Protección antivirus y contra amenazas» > «Historial de protección». Filtrá los elementos en cuarentena y tocá el que querés."
    abrir: "ms-settings:windowsdefender"
  - texto: "En las acciones, elegí «Restaurar». Te va a pedir permiso de administrador."
    abrir: "https://learn.microsoft.com/defender-endpoint/restore-quarantined-files-microsoft-defender-antivirus"
  - texto: "El archivo vuelve a su lugar, pero el antivirus lo va a detectar de nuevo y te va a pedir que decidas. Solo si estás seguro, elegí permitirlo en el dispositivo."
    abrir: "https://support.microsoft.com/windows/security/windows-security/protection-history-in-the-windows-security-app"
derivar: "Si tenés dudas, dejalo en cuarentena y consultá a un técnico de confianza: es mejor perder un archivo que infectar la compu."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/protection-history-in-the-windows-security-app
  - https://learn.microsoft.com/defender-endpoint/restore-quarantined-files-microsoft-defender-antivirus
madurez: T0
