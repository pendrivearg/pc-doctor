id: WSEC-024
area: seguridad
titulo:
  sencillo: "Seguridad de Windows avisa que la protección en la nube o el envío de muestras está desactivado"
  tecnico: "Protección proporcionada en la nube y Envío automático de muestras"
explicacion:
  sencillo: "Son dos ayudas del antivirus. La protección en la nube le permite consultar a Microsoft para reconocer virus nuevísimos en segundos; el envío automático de muestras manda archivos sospechosos para analizarlos. Si están apagadas, la compu queda menos protegida: Microsoft recomienda tenerlas encendidas."
  tecnico: "Administrar la configuración > Protección proporcionada en la nube / Envío automático de muestras. Sin la nube no funcionan el bloqueo a primera vista y otras funciones. Con envío de muestras seguras, los archivos con posibles datos personales piden confirmación. Si aparecen atenuadas, las administra una directiva."
frases: ["la protección en la nube está desactivada", "envío automático de muestras desactivado", "aviso amarillo de protección proporcionada en la nube", "qué es el envío de muestras de defender"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Protección antivirus y contra amenazas» y, en su configuración, tocá «Administrar la configuración»."
    abrir: "ms-settings:windowsdefender"
  - texto: "Encendé «Protección proporcionada en la nube» y «Envío automático de muestras»."
    abrir: "https://learn.microsoft.com/defender-endpoint/cloud-protection-configure"
  - texto: "Si te preocupa la privacidad: cuando un archivo puede tener datos personales, Windows te pregunta antes de mandarlo."
    abrir: "https://support.microsoft.com/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app"
  - texto: "Si los interruptores están grises, la compu la administra una empresa o colegio: consultá con sistemas."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-configure
  - https://support.microsoft.com/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app
madurez: T0
