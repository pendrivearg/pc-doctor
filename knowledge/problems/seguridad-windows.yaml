id: WSEC-006
area: seguridad
titulo:
  sencillo: "Seguridad de Windows avisa que la «Protección basada en reputación» está desactivada"
  tecnico: "Configuración de protección basada en reputación (SmartScreen)"
explicacion:
  sencillo: "Son los controles que revisan si un programa, un archivo o una página son conocidos como peligrosos antes de que los abras. Si alguno está apagado, Windows te muestra el signo amarillo. Conviene tenerlos encendidos."
  tecnico: "Control de aplicaciones y navegador > Protección basada en reputación: Comprobar aplicaciones y archivos, SmartScreen para Microsoft Edge, Protección contra suplantación de identidad, Bloqueo de aplicaciones potencialmente no deseadas, SmartScreen para aplicaciones de Microsoft Store."
frases: ["la protección basada en reputación está desactivada", "aviso amarillo en control de aplicaciones y navegador", "smartscreen para microsoft edge está apagado", "activar comprobar aplicaciones y archivos"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Control de aplicaciones y navegador» y entrá en la configuración de la protección basada en reputación."
    abrir: "ms-settings:windowsdefender"
  - texto: "Encendé los interruptores que estén apagados: «Comprobar aplicaciones y archivos», «SmartScreen para Microsoft Edge», el bloqueo de aplicaciones potencialmente no deseadas y el de aplicaciones de Microsoft Store. Puede pedir permiso de administrador."
    abrir: "https://support.microsoft.com/windows/security/windows-security/app-browser-control-in-the-windows-security-app"
  - texto: "Si un programa o una persona te pidió apagarlos para instalar algo, desconfiá: es lo que buscan los virus y las estafas."
  - texto: "Si los interruptores están grises, la compu la administra una empresa o colegio: consultá con sistemas."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/app-browser-control-in-the-windows-security-app
madurez: T0
