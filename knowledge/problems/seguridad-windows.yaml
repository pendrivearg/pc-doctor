id: WSEC-023
area: seguridad
titulo:
  sencillo: "Seguridad de Windows dice que el antivirus de Microsoft está apagado porque uso otro"
  tecnico: "Microsoft Defender deshabilitado por otro antivirus; examen periódico limitado"
explicacion:
  sencillo: "Si instalaste otro antivirus, el de Windows se apaga solo para no chocar. No es una falla. Mientras el otro esté activo y al día, estás protegido; si lo desinstalás o se vence, el de Windows vuelve a prenderse solo."
  tecnico: "Con un antivirus compatible registrado, Defender se desactiva y la sección de virus y amenazas muestra el producto activo con un enlace. Opciones del Antivirus de Microsoft Defender > examen periódico limitado: detecta poco, no reemplaza al antivirus principal."
frases: ["dice que el antivirus de microsoft defender está desactivado", "seguridad de windows muestra el nombre de otro antivirus", "qué es el examen periódico de defender", "se apagó el defender cuando instalé otro antivirus"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Protección antivirus y contra amenazas»: ahí aparece el antivirus que te está protegiendo y un enlace para abrirlo. Fijate que esté activo y actualizado."
    abrir: "ms-settings:windowsdefender"
  - texto: "Si querés una revisión extra liviana, debajo del otro antivirus abrí las opciones del Antivirus de Microsoft Defender y activá el examen periódico. Ojo: revisa de vez en cuando y detecta mucho menos; no reemplaza al antivirus principal."
    abrir: "https://learn.microsoft.com/defender-endpoint/limited-periodic-scanning-microsoft-defender-antivirus"
  - texto: "Si el otro antivirus se venció o no lo querés más, desinstalalo desde Aplicaciones instaladas: el de Windows se vuelve a activar solo."
    abrir: "ms-settings:appsfeatures"
  - texto: "No tengas dos antivirus completos funcionando a la vez: escribile a PC Doctor «tengo dos antivirus instalados»."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/limited-periodic-scanning-microsoft-defender-antivirus
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-security-center-antivirus
  - https://support.microsoft.com/windows/security/windows-security/windows-security-app-overview
madurez: T0
