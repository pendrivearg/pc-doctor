id: WSEC-018
area: seguridad
titulo:
  sencillo: "Windows me pide la contraseña de un administrador para instalar algo"
  tecnico: "UAC: aviso de credenciales en una cuenta de usuario estándar"
explicacion:
  sencillo: "Si tu usuario es «estándar» (no administrador), Windows pide que el dueño o encargado de la compu escriba su clave para permitir cambios importantes. Es una protección: así nadie instala cosas sin permiso."
  tecnico: "Credential prompt: un usuario estándar debe ingresar credenciales de un administrador local para elevar. Microsoft recomienda que la cuenta principal sea de usuario estándar."
frases: ["me pide la contraseña del administrador para instalar", "no puedo instalar nada porque no soy administrador", "windows pide usuario y clave de administrador", "mi usuario no tiene permiso para hacer cambios"]
pasos:
  - texto: "Es normal: la cuenta con la que entrás no es de administrador. Microsoft recomienda justamente usar así la compu, porque es más segura."
    abrir: "https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/how-it-works"
  - texto: "Pedile a quien administra la compu (un familiar, tu técnico o sistemas del trabajo) que escriba su clave, si está de acuerdo con ese cambio."
  - texto: "Nunca le pases esa clave a alguien que te llama o te escribe para «arreglarte» la compu, y no la escribas en un cartel que apareció solo."
    abrir: "https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/"
fuentes:
  - https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/how-it-works
  - https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/
madurez: T0
