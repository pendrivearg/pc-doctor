id: WSEC-017
area: seguridad
titulo:
  sencillo: "Me sale «¿Quieres permitir que esta aplicación haga cambios en el dispositivo?»"
  tecnico: "Control de cuentas de usuario (UAC): aviso de consentimiento"
explicacion:
  sencillo: "Es el Control de cuentas de usuario: Windows oscurece la pantalla y te pregunta antes de que un programa haga cambios importantes en la compu. Si decís «Sí», el programa recibe permisos de administrador; si decís «No», el cambio no se hace y no se rompe nada."
  tecnico: "UAC: elevación con el token de administrador en el escritorio seguro. Aviso de consentimiento (administradores) o de credenciales (usuarios estándar). Fondo gris: aplicación de Windows o editor verificado; amarillo: sin firma o no confiable."
frases: ["me pregunta si quiero permitir que esta aplicación haga cambios", "se oscurece la pantalla y me pide sí o no", "qué es el control de cuentas de usuario", "le doy sí o no al cartel de windows que pide permiso"]
pasos:
  - texto: "Mirá el nombre del programa y del fabricante que muestra el cartel. Si lo acabás de abrir vos (por ejemplo, un instalador que bajaste de la página oficial), podés decir «Sí»."
    abrir: "https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/"
  - texto: "Decí «No» si el cartel apareció solo sin que abrieras nada, si no reconocés el programa, o si alguien por teléfono o por mensaje te pide que aceptes."
  - texto: "Fijate el color: si el cartel es amarillo, el programa no tiene firma o no es de confianza conocida. Pensalo dos veces."
    abrir: "https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/how-it-works"
  - texto: "Decir «No» es seguro: solo hace que ese programa no pueda hacer el cambio."
fuentes:
  - https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/
  - https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/how-it-works
madurez: T0
