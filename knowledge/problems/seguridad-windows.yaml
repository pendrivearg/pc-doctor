id: WSEC-007
area: seguridad
titulo:
  sencillo: "Windows me avisó que escribí mi contraseña en un lugar peligroso o en el Bloc de notas"
  tecnico: "Protección contra suplantación de identidad (Windows 11)"
explicacion:
  sencillo: "Windows 11 puede cuidar la contraseña con la que entrás a la compu: te avisa si la escribís en una página falsa, si la usás repetida en otros sitios o si la guardás escrita en el Bloc de notas o en Word. Si te avisó, lo más seguro es cambiarla."
  tecnico: "Control de aplicaciones y navegador > Protección basada en reputación > Protección contra suplantación de identidad: aviso por sitio malicioso (activo por defecto), reutilización de contraseña y almacenamiento no seguro (Bloc de notas, Microsoft 365). Solo protege la contraseña escrita de inicio de sesión de Windows 11, no el PIN."
frases: ["windows me avisó que escribí mi contraseña en un sitio peligroso", "aviso por guardar la contraseña en el bloc de notas", "windows dice que reutilicé mi contraseña", "me salió que cambie la contraseña por suplantación de identidad"]
pasos:
  - texto: "Si el aviso salió mientras escribías tu clave en una página, cerrá esa página: puede ser una copia falsa para robártela."
  - texto: "Cambiá la contraseña de tu cuenta desde un lugar seguro. Escribile a PC Doctor «quiero cambiar la contraseña de la computadora». Nunca se la dictes a nadie."
  - texto: "Si la tenías anotada en el Bloc de notas o en un documento, borrá esa nota. Es mejor guardarla en un administrador de contraseñas."
    abrir: "https://support.microsoft.com/windows/security/windows-security/app-browser-control-in-the-windows-security-app"
  - texto: "Para ver qué avisos tenés activados: Seguridad de Windows > «Control de aplicaciones y navegador» > configuración de la protección basada en reputación > «Protección contra suplantación de identidad»."
    abrir: "ms-settings:windowsdefender"
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/app-browser-control-in-the-windows-security-app
madurez: T0
