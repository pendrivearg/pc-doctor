id: WSEC-025
area: seguridad
titulo:
  sencillo: "Seguridad de Windows me pide configurar OneDrive para la «recuperación de datos de ransomware»"
  tecnico: "Recuperación de datos de ransomware con OneDrive"
explicacion:
  sencillo: "El ransomware es un virus que secuestra tus archivos y pide plata. Windows te ofrece tener copia de tus archivos importantes en OneDrive para poder recuperarlos si pasa. El aviso es una recomendación: no quiere decir que tengas un virus."
  tecnico: "Protección contra ransomware > Recuperación de datos de ransomware > Configurar: vincula OneDrive; tras un ataque guía la restauración desde OneDrive y avisa si hay problemas con la copia."
frases: ["seguridad de windows me pide configurar onedrive", "qué es la recuperación de datos de ransomware", "aviso de configurar onedrive en protección contra ransomware", "para qué quiere onedrive el antivirus"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Protección antivirus y contra amenazas» > «Protección contra ransomware» y entrá a administrarla."
    abrir: "ms-settings:windowsdefender"
  - texto: "En «Recuperación de datos de ransomware», tocá «Configurar» y seguí los pasos para entrar o vincular tu OneDrive."
