id: WSEC-015
area: seguridad
titulo:
  sencillo: "Le di «Permitir» a una amenaza en el antivirus y me arrepentí"
  tecnico: "Quitar un elemento de Amenazas permitidas"
explicacion:
  sencillo: "Si alguna vez le dijiste al antivirus que dejara pasar algo, queda anotado en «Amenazas permitidas» y no lo vuelve a frenar. Lo podés sacar de esa lista para que el antivirus vuelva a actuar."
  tecnico: "Protección antivirus y contra amenazas > Amenazas actuales > Amenazas permitidas > seleccionar > No permitir. En la próxima detección, Defender actúa sobre el elemento."
frases: ["permití un virus sin querer", "le di permitir a una amenaza en defender", "cómo deshago lo que permití en el antivirus", "dónde están las amenazas permitidas"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Protección antivirus y contra amenazas». En la parte de amenazas actuales, buscá «Amenazas permitidas»."
    abrir: "ms-settings:windowsdefender"
  - texto: "Tocá el elemento que ya no querés permitir y elegí «No permitir». Desde ahí, el antivirus lo vuelve a frenar cuando lo encuentra."
    abrir: "https://support.microsoft.com/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app"
  - texto: "Para que lo encuentre ya, hacé un examen completo desde «Opciones de examen» y después mirá el «Historial de protección»."
    abrir: "https://support.microsoft.com/windows/security/windows-security/protection-history-in-the-windows-security-app"
fuentes:
  - https://support.microsoft.com/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app
  - https://support.microsoft.com/windows/security/windows-security/protection-history-in-the-windows-security-app
madurez: T0
