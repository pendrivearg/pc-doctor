id: WSEC-016
area: seguridad
titulo:
  sencillo: "El antivirus de Windows me muestra avisos de resumen todo el tiempo"
  tecnico: "Notificaciones adicionales de Microsoft Defender Antivirus"
explicacion:
  sencillo: "Además de avisar cuando encuentra algo peligroso, el antivirus manda avisos «de resumen»: que terminó un examen, qué revisó, etc. Esos avisos extra se pueden apagar. Los importantes, los de cuando encuentra una amenaza, siguen apareciendo igual."
  tecnico: "Configuración de protección antivirus y contra amenazas > Notificaciones > Cambiar la configuración de notificaciones: desactivar las notificaciones adicionales (mejoradas). Las críticas (detección y corrección de amenazas) no se desactivan."
frases: ["defender me llena de notificaciones", "me avisa todo el tiempo que terminó de revisar la compu", "sacar los avisos de resumen del antivirus", "el antivirus de windows me manda muchos mensajes"]
pasos:
  - texto: "Antes de cerrar un aviso, leelo: si dice que encontró una amenaza, no es para ignorar. En ese caso escribile a PC Doctor «el antivirus de Windows dice que encontró una amenaza»."
  - texto: "Para los avisos de resumen: abrí Seguridad de Windows > «Protección antivirus y contra amenazas» > su configuración, bajá hasta «Notificaciones» y tocá la opción para cambiar la configuración de notificaciones."
    abrir: "ms-settings:windowsdefender"
  - texto: "Apagá solo los avisos adicionales. Microsoft aclara que los avisos importantes, como los de amenazas encontradas, siguen apareciendo igual."
    abrir: "https://learn.microsoft.com/defender-endpoint/configure-notifications-microsoft-defender-antivirus"
fuentes:
  - https://learn.microsoft.com/defender-endpoint/configure-notifications-microsoft-defender-antivirus
madurez: T0
