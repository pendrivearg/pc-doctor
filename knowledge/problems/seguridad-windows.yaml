id: WSEC-011
area: seguridad
titulo:
  sencillo: "Quiero revisar con el antivirus un pendrive o una carpeta"
  tecnico: "Examen personalizado de Microsoft Defender Antivirus"
explicacion:
  sencillo: "Si te prestaron un pendrive o te pasaron una carpeta con archivos, podés pedirle al antivirus de Windows que revise solo eso, sin esperar un examen de toda la compu."
  tecnico: "Protección antivirus y contra amenazas > Opciones de examen > Examen personalizado (windowsdefender://customscan/) > elegir la unidad o carpeta."
frases: ["revisar un pendrive con el antivirus", "pasarle el antivirus a una carpeta sola", "me prestaron un pendrive y quiero ver si tiene virus", "analizar el disco externo con defender"]
pasos:
  - texto: "Enchufá el pendrive y esperá que aparezca en el Explorador de archivos."
  - texto: "Abrí Seguridad de Windows > «Protección antivirus y contra amenazas» > «Opciones de examen». Elegí «Examen personalizado» y tocá el botón para empezar."
    abrir: "ms-settings:windowsdefender"
  - texto: "Se abre una ventana: elegí el pendrive (o la carpeta) y aceptá. Esperá a que termine y leé el resultado."
    abrir: "https://support.microsoft.com/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app"
  - texto: "Si encontró algo, no abras los archivos del pendrive y escribile a PC Doctor «el antivirus de Windows dice que encontró una amenaza»."
fuentes:
  - https://support.microsoft.com/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app
madurez: T0
---
id: WSEC-012
area: seguridad
titulo:
  sencillo: "Quiero revisar un solo archivo con el antivirus antes de abrirlo"
  tecnico: "Examinar un archivo o carpeta con Microsoft Defender desde el clic derecho"
explicacion:
  sencillo: "Antes de abrir algo que te mandaron o que bajaste, podés hacerle clic derecho y pedirle al antivirus de Windows que lo revise. Tarda unos segundos."
  tecnico: "Explorador de archivos > clic derecho > Examinar con Microsoft Defender (en Windows 11 puede estar dentro de «Mostrar más opciones»). El resultado se ve en Seguridad de Windows."
frases: ["cómo le paso el antivirus a un archivo solo", "revisar un adjunto antes de abrirlo", "clic derecho para escanear un archivo con defender", "no encuentro la opción de examinar con microsoft defender"]
pasos:
  - texto: "Abrí el Explorador de archivos (Windows + E) y buscá el archivo, por ejemplo en Descargas."
  - texto: "Hacé clic derecho sobre el archivo y elegí la opción para examinarlo con Microsoft Defender. En Windows 11, si no la ves, tocá primero «Mostrar más opciones»."
    abrir: "https://support.microsoft.com/windows/security/windows-security/stay-protected-with-the-windows-security-app"
  - texto: "Se abre Seguridad de Windows con el resultado. Si encontró algo, no lo abras. Si dice que está limpio, igual pensá si confiás en quien te lo mandó."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/stay-protected-with-the-windows-security-app
madurez: T0
