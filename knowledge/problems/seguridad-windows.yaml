id: WSEC-010
area: seguridad
titulo:
  sencillo: "Al abrir un programa, el firewall pregunta si le permito el acceso a la red"
  tecnico: "Aviso del Firewall de Windows al iniciar una aplicación de red"
explicacion:
  sencillo: "La primera vez que un programa quiere recibir conexiones de la red, el firewall te pregunta si lo dejás. Si decís que no o cerrás el cartel, Windows lo bloquea y no vuelve a preguntar. Solo conviene permitirlo si es un programa que conocés y necesita la red (un juego en línea, un programa del trabajo)."
  tecnico: "Sin regla de permiso previa, al primer intento de escucha se muestra un diálogo; con permisos de administrador, «No» o cancelar crea reglas de bloqueo (TCP y UDP); sin permisos, se crean reglas de bloqueo elija lo que elija. Las reglas pueden aplicarse solo al perfil privado."
frases: ["el firewall me preguntó si permito el acceso a un programa", "cartel del firewall al abrir un juego", "le di cancelar al firewall y ahora el programa no se conecta", "windows defender firewall bloqueó algunas características de esta aplicación"]
pasos:
  - texto: "Mirá qué programa es. Si no lo reconocés o no lo abriste vos, no lo permitas."
  - texto: "Si es un programa de confianza, permitile el acceso solo en redes privadas (tu casa), no en las públicas, salvo que de verdad lo necesites afuera."
    abrir: "https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/rules"
  - texto: "Si le diste «Cancelar» por error, el programa queda bloqueado y el cartel no vuelve a salir. Para darle permiso después, escribile a PC Doctor «el firewall de Windows no deja que un programa se conecte»."
    abrir: "https://support.microsoft.com/topic/ec0844f7-aebd-0583-67fe-601ecf5d774f"
  - texto: "No apagues el firewall para que un programa ande."
fuentes:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/rules
  - https://support.microsoft.com/topic/ec0844f7-aebd-0583-67fe-601ecf5d774f
madurez: T0
