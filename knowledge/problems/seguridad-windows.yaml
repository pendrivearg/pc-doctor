# La app Seguridad de Windows y sus avisos: íconos de estado, cuentas, dispositivo, firewall, exámenes, cuarentena, exclusiones, UAC, Sandbox, archivos y macros bloqueados. Guiadas con fuente oficial; nunca apagar protecciones.
id: WSEC-001
area: seguridad
titulo:
  sencillo: "¿Qué significan el tilde verde, el signo amarillo y la cruz roja en Seguridad de Windows?"
  tecnico: "Íconos de estado de la página Inicio de Seguridad de Windows"
explicacion:
  sencillo: "En Seguridad de Windows cada parte (antivirus, firewall, cuentas y demás) tiene un dibujito. El tilde verde quiere decir que está todo bien. El signo amarillo, que hay una recomendación para mirar cuando puedas. La cruz roja, que hay algo que atender ya."
  tecnico: "Página Inicio: verde = protegido, sin acciones recomendadas; amarillo = recomendación de seguridad; rojo = requiere atención inmediata. Áreas: virus y amenazas, cuentas, firewall y red, control de aplicaciones y navegador, seguridad del dispositivo, rendimiento y estado, opciones de familia, historial de protección."
frases: ["qué significa el tilde verde en seguridad de windows", "me aparece un signo amarillo en seguridad de windows", "hay una cruz roja en el escudito de windows", "qué quieren decir los colores del antivirus de windows"]
pasos:
  - texto: "Abrí Seguridad de Windows (buscala en Inicio) y mirá la página de inicio: cada sección tiene su ícono."
    abrir: "ms-settings:windowsdefender"
  - texto: "Tilde verde: no hay que hacer nada. Signo amarillo: tocá esa sección, leé la recomendación y seguila con calma. Cruz roja: entrá ya a esa sección y hacé lo que te indica."
    abrir: "https://support.microsoft.com/windows/security/windows-security/windows-security-app-overview"
  - texto: "Si la cruz roja está en la parte de virus y amenazas, escribile a PC Doctor «el antivirus de Windows dice que encontró una amenaza»."
  - texto: "En una compu de una empresa o colegio puede haber secciones que no aparecen o no se pueden cambiar: eso lo maneja el encargado de sistemas."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/windows-security-app-overview
madurez: T0
---
id: WSEC-002
area: seguridad
titulo:
  sencillo: "El antivirus encontró una amenaza y dice «Se requiere una acción»"
  tecnico: "Historial de protección: estado «Amenaza encontrada - acción necesaria»"
explicacion:
  sencillo: "El antivirus de Windows encontró algo sospechoso, pero no lo tocó: espera que decidas vos. Si no sabés qué es, lo más seguro es mandarlo a cuarentena, donde queda encerrado y no puede hacer daño."
  tecnico: "Estado Threat found - action needed en el Historial de protección: acciones Cuarentena o Permitir en el dispositivo. Ver los detalles requiere permisos de administrador. Recomendación de Microsoft: ante la duda, Cuarentena."
frases: ["el antivirus dice se requiere una acción", "amenaza encontrada acción necesaria", "defender me pregunta qué hago con una amenaza", "me salió un aviso del antivirus esperando que elija algo"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Protección antivirus y contra amenazas» > «Historial de protección». Tocá el aviso que pide una acción para ver los detalles (puede pedirte permiso de administrador)."
    abrir: "ms-settings:windowsdefender"
  - texto: "En las acciones, elegí la de poner en cuarentena. Si no estás seguro de qué es, siempre cuarentena: es lo que recomienda Microsoft."
    abrir: "https://support.microsoft.com/windows/security/windows-security/protection-history-in-the-windows-security-app"
  - texto: "No elijas permitirlo en el dispositivo salvo que sepas con certeza que ese archivo es tuyo y confiable: si era un virus, tus datos y tu compu quedan en riesgo."
  - texto: "Después, revisá toda la compu: escribile a PC Doctor «creo que tengo un virus»."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/protection-history-in-the-windows-security-app
madurez: T0
---
id: WSEC-003
area: seguridad
titulo:
  sencillo: "¿Qué es «Protección de cuentas» en Seguridad de Windows?"
  tecnico: "Protección de cuentas: cuenta Microsoft, Windows Hello y bloqueo dinámico"
explicacion:
  sencillo: "Es la parte de Seguridad de Windows que junta todo lo que cuida tu forma de entrar a la compu: la cuenta de Microsoft, el ingreso con PIN, huella o cara (Windows Hello) y el bloqueo automático cuando te alejás."
  tecnico: "Protección de cuentas (windowsdefender://account/): estado de la cuenta Microsoft (no aparece con cuentas profesionales o educativas), Windows Hello y bloqueo dinámico, con enlaces a Configuración > Cuentas > Opciones de inicio de sesión."
frases: ["qué es protección de cuentas en seguridad de windows", "seguridad de windows me dice algo de mi cuenta", "dónde configuro la huella desde seguridad de windows", "protección de cuentas me pide configurar windows hello"]
pasos:
  - texto: "Abrí Seguridad de Windows y entrá en «Protección de cuentas». Ahí ves tu cuenta de Microsoft, Windows Hello y el bloqueo dinámico, cada uno con un enlace a su configuración."
    abrir: "ms-settings:windowsdefender"
  - texto: "Si te recomienda Windows Hello, podés configurar un PIN, la huella o la cara en las opciones de inicio de sesión."
    abrir: "ms-settings:signinoptions"
  - texto: "Para que la compu se bloquee sola cuando te alejás con el celular, escribile a PC Doctor «quiero que la compu se bloquee sola cuando me alejo»."
  - texto: "Si entrás con una cuenta del trabajo o del colegio, la parte de la cuenta de Microsoft no aparece: es normal."
    abrir: "https://support.microsoft.com/windows/security/windows-security/account-protection-in-the-windows-security-app"
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/account-protection-in-the-windows-security-app
madurez: T0
