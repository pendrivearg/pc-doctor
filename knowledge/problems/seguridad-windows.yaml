id: WSEC-022
area: seguridad
titulo:
  sencillo: "El antivirus de Windows da error al buscar actualizaciones"
  tecnico: "Falla de la actualización de inteligencia de seguridad de Microsoft Defender"
explicacion:
  sencillo: "El antivirus baja seguido la información de los virus nuevos («inteligencia de seguridad»). Si esa actualización falla, el antivirus queda atrasado y no reconoce lo más nuevo. Suele deberse a Internet, a Windows Update o a que hay otro antivirus instalado."
  tecnico: "Error «Protection definition update failed» o «Signature Update failed»; códigos 0x8024402c, 0x80240022, 0x80004002, 0x80070422, 0x80072efd, 0x80070005, 0x80072f78, 0x80072ee2, 0x8007001B. Causas: conectividad o proxy, otro antivirus registrado (Defender deshabilitado), Windows Update. Paquete manual en microsoft.com/wdsi/defenderupdates."
frases: ["no se actualiza la inteligencia de seguridad", "error al actualizar el windows defender", "falló la actualización de definiciones del antivirus", "buscar actualizaciones de protección da error"]
pasos:
  - texto: "Revisá que tengas Internet y probá de nuevo: Seguridad de Windows > «Protección antivirus y contra amenazas» > las actualizaciones de protección > «Buscar actualizaciones»."
    abrir: "ms-settings:windowsdefender"
  - texto: "Esa información también llega por Windows Update: entrá, buscá actualizaciones e instalá lo que haya."
    abrir: "ms-settings:windowsupdate"
  - texto: "Si tenés otro antivirus instalado, el de Windows queda desactivado y no se actualiza: es normal. Lo que tiene que estar al día es el otro."
    abrir: "https://learn.microsoft.com/defender-endpoint/troubleshoot-security-intelligence-not-updated"
  - texto: "Si sigue fallando, Microsoft ofrece el paquete para descargarlo e instalarlo a mano desde su página oficial: elegí el de tu Windows (64 bits, 32 bits o ARM)."
    abrir: "https://www.microsoft.com/wdsi/defenderupdates"
derivar: "Si Windows Update también falla, anotá el código de error que aparece y escribíselo a PC Doctor."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/troubleshoot-security-intelligence-not-updated
  - https://www.microsoft.com/wdsi/defenderupdates
  - https://support.microsoft.com/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app
madurez: T0
