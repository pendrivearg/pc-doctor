id: WSEC-013
area: seguridad
titulo:
  sencillo: "Un programa o un video me dice que agregue una «exclusión» al antivirus"
  tecnico: "Exclusiones de Microsoft Defender Antivirus: riesgos y qué no excluir"
explicacion:
  sencillo: "Una exclusión le dice al antivirus «esto no lo revises». Es un agujero en la protección: si ahí se mete un virus, el antivirus no lo ve. Casi nunca hace falta, y menos si te lo pide una página, un video, un juego «gratis» o alguien por teléfono."
  tecnico: "Administrar la configuración > Agregar o quitar exclusiones (Archivo, Carpeta, Tipo de archivo, Proceso). Microsoft desaconseja excluir la unidad del sistema, Usuarios, carpetas Temp, carpetas de programas y extensiones como .exe, .zip, .js o .bat; usar ruta completa."
frases: ["agregar una exclusión en windows defender", "me piden excluir una carpeta del antivirus", "poner un programa en excepciones del antivirus", "el instalador dice que lo agregue a las exclusiones de seguridad de windows"]
pasos:
  - texto: "Si te lo pide un programa «crackeado», un activador, un video o alguien que te llama: no lo hagas. Es una trampa típica para que un virus pase sin ser visto."
    abrir: "https://learn.microsoft.com/defender-endpoint/defender-endpoint-exclusions-common-mistakes"
  - texto: "Nunca excluyas el disco entero, tu carpeta de usuario, las carpetas temporales ni tipos de archivo como .exe o .zip: Microsoft lo desaconseja aunque confíes en el programa."
  - texto: "Si un programa de confianza de verdad lo necesita (por ejemplo, uno del trabajo), que lo configure el técnico, solo para ese archivo y con su ubicación completa."
  - texto: "Para revisar exclusiones que ya existan: Seguridad de Windows > «Protección antivirus y contra amenazas» > «Administrar la configuración» > «Agregar o quitar exclusiones». Si hay alguna que no reconocés, elegila y tocá «Quitar»."
    abrir: "ms-settings:windowsdefender"
fuentes:
  - https://learn.microsoft.com/defender-endpoint/defender-endpoint-exclusions-common-mistakes
  - https://support.microsoft.com/windows/security/threat-malware-protection/virus-and-threat-protection-in-the-windows-security-app
madurez: T0
