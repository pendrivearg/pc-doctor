id: WSEC-008
area: seguridad
titulo:
  sencillo: "¿Qué es la «Protección contra vulnerabilidades» y tengo que tocar algo?"
  tecnico: "Protección contra vulnerabilidades (Exploit protection)"
explicacion:
  sencillo: "Es una protección que ya viene configurada y le pone «trabas» a Windows y a los programas para que un virus no pueda aprovechar sus fallas. No hace falta configurar nada: lo mejor es dejarla como viene."
  tecnico: "Exploit protection aplica automáticamente mitigaciones (DEP, ASLR, CFG, SEHOP, etc.) al sistema y a las aplicaciones; viene preconfigurada. Algunas mitigaciones pueden tener problemas de compatibilidad con ciertas aplicaciones."
frases: ["qué es la protección contra vulnerabilidades", "para qué sirve exploit protection", "un tutorial me dice que cambie la protección contra vulnerabilidades", "configuración del sistema en protección contra vulnerabilidades"]
pasos:
  - texto: "Está en Seguridad de Windows > «Control de aplicaciones y navegador» > «Protección contra vulnerabilidades». Podés mirarla, pero no hace falta cambiar nada."
    abrir: "ms-settings:windowsdefender"
  - texto: "Microsoft explica que viene preparada para la mayoría de la gente. No cambies esas opciones por tu cuenta ni porque te lo pide un video o un programa."
    abrir: "https://support.microsoft.com/windows/security/windows-security/app-browser-control-in-the-windows-security-app"
  - texto: "Cambiarlas mal puede hacer que algún programa deje de abrir: hasta las empresas las prueban antes de aplicarlas."
    abrir: "https://learn.microsoft.com/defender-endpoint/exploit-protection"
derivar: "Si alguien ya cambió esa configuración y ahora un programa no abre, pedí ayuda técnica para dejarla como venía."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/app-browser-control-in-the-windows-security-app
  - https://learn.microsoft.com/defender-endpoint/exploit-protection
madurez: T0
