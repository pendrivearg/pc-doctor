id: WSEC-005
area: seguridad
titulo:
  sencillo: "Seguridad de Windows muestra un problema con el «procesador de seguridad» (TPM)"
  tecnico: "Solución de problemas del procesador de seguridad y Borrar TPM"
explicacion:
  sencillo: "El procesador de seguridad (TPM) es un chip que guarda claves secretas de la compu, como las del PIN o del cifrado del disco. Si Windows muestra un error de ese chip, a veces alcanza con reiniciar o actualizar la BIOS. La opción «Borrar TPM» es delicada: borra esas claves y se pueden perder datos."
  tecnico: "Seguridad del dispositivo > Detalles del procesador de seguridad > Solución de problemas del procesador de seguridad. Mensajes: actualización de firmware necesaria, TPM deshabilitado, almacenamiento o atestación no disponible (sugiere borrar), registro de arranque medido ausente (reiniciar). Borrar TPM pierde las claves (PIN, tarjetas inteligentes virtuales, datos cifrados); requiere administrador."
frases: ["hay un problema con el tpm reinicie el dispositivo", "seguridad de windows me pide borrar el tpm", "error en el procesador de seguridad", "dice que hace falta actualizar el firmware del procesador de seguridad"]
pasos:
  - texto: "Abrí Seguridad de Windows > «Seguridad del dispositivo» > los detalles del procesador de seguridad, y leé el mensaje en la solución de problemas."
    abrir: "ms-settings:windowsdefender"
  - texto: "Si dice que reinicies, reiniciá. Si habla de una actualización de firmware o de que el TPM está deshabilitado, buscá en la página del fabricante de tu compu una actualización de BIOS/UEFI, o pedí ayuda técnica."
    abrir: "https://support.microsoft.com/windows/security/windows-security/device-security-in-the-windows-security-app"
  - texto: "IMPORTANTE: no toques «Borrar TPM» sin antes hacer una copia de tus datos y tener a mano la clave de recuperación de BitLocker si la usás. Se pierden las claves del chip, como el PIN para entrar. En una compu del trabajo o del colegio, no lo borres nunca sin que te lo indique sistemas."
    abrir: "https://learn.microsoft.com/windows/security/hardware-security/tpm/initialize-and-configure-ownership-of-the-tpm"
  - texto: "Si después de reiniciar el problema sigue, Microsoft aconseja contactar al fabricante de la compu."
fuentes:
  - https://support.microsoft.com/windows/security/windows-security/device-security-in-the-windows-security-app
  - https://learn.microsoft.com/windows/security/hardware-security/tpm/initialize-and-configure-ownership-of-the-tpm
madurez: T0
