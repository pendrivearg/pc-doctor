id: WSEC-021
area: seguridad
titulo:
  sencillo: "Word o Excel avisa que bloqueó las macros por un «riesgo de seguridad»"
  tecnico: "Bloqueo predeterminado de macros VBA en archivos de Internet"
explicacion:
  sencillo: "Las macros son pequeños programas dentro de un archivo de Office. Los delincuentes las usan mucho para meter virus, por eso Office las bloquea en los archivos que llegan por correo o que bajás de Internet. Si no esperabas un archivo con macros, lo más seguro es dejarlo así."
  tecnico: "Office para Windows (Access, Excel, PowerPoint, Project, Publisher, Visio, Word) bloquea macros VBA en archivos con MOTW; la barra RIESGO DE SEGURIDAD no ofrece Habilitar contenido. Desbloqueo por archivo: Propiedades > General > Desbloquear; alternativas: ubicación de confianza o editor de confianza."
frases: ["excel dice que bloqueó las macros", "riesgo de seguridad macros bloqueadas en word", "la planilla que me mandaron no funciona porque bloquea las macros", "cómo habilito las macros de un archivo que me llegó por mail"]
pasos:
  - texto: "Si el archivo vino de alguien que no conocés o de un correo inesperado (una factura, un envío, una multa), no lo desbloquees: cerralo y borralo. Es una forma muy común de meter virus."
  - texto: "Muchas veces podés leer el archivo igual sin las macros: probá usarlo así."
  - texto: "Solo si sabés quién lo hizo y confiás (por ejemplo, una planilla del trabajo que siempre usás): cerralo, clic derecho sobre el archivo > «Propiedades», en «General» marcá «Desbloquear», «Aceptar» y volvé a abrirlo."
    abrir: "https://learn.microsoft.com/microsoft-365-apps/security/internet-macros-blocked"
  - texto: "No cambies la configuración de macros de Office para habilitarlas todas. Si pasa con muchos archivos del trabajo, que lo resuelva sistemas."
fuentes:
  - https://learn.microsoft.com/microsoft-365-apps/security/internet-macros-blocked
madurez: T0
