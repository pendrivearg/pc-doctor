id: MAIL-021
area: programas
titulo:
  sencillo: "Quiero que Outlook mueva solo los correos a una carpeta"
  tecnico: "Outlook: reglas de la Bandeja de entrada (crear, desactivar, eliminar)"
explicacion:
  sencillo: "Una regla es una orden para Outlook: por ejemplo, que todo lo que mande el banco vaya a la carpeta «Banco». Se arma una vez y funciona sola con los correos que llegan."
  tecnico: "Clic derecho > Reglas > Crear regla; Configuración > Correo > Reglas (nuevo Outlook/Outlook.com); clásico: Archivo > Administrar reglas y alertas."
frases: ["que los mails del banco vayan solos a una carpeta", "crear una regla en outlook", "ordenar automáticamente el hotmail", "outlook me mueve correos solo a otra carpeta"]
pasos:
  - texto: "Hacé clic derecho sobre un correo de esa persona, elegí «Reglas» > «Crear regla», elegí la carpeta adonde querés que vayan y tocá «Aceptar»."
    abrir: "https://support.microsoft.com/en-us/outlook/mail/manage-email-messages-by-using-rules-in-outlook"
  - texto: "Para ver, apagar o borrar reglas en Outlook.com o el nuevo Outlook: Configuración (el engranaje) > «Correo» > «Reglas». El interruptor al lado de cada regla la apaga sin borrarla."
  - texto: "En Outlook clásico, las reglas están en «Archivo» > «Administrar reglas y alertas»: desmarcá la casilla para apagarla o elegila y tocá «Eliminar»."
  - texto: "Si te faltan correos que «desaparecen», revisá esta lista: puede haber una regla que los mueve. El nuevo Outlook no aplica reglas a cuentas de Gmail o Yahoo."
fuentes:
  - https://support.microsoft.com/en-us/outlook/mail/manage-email-messages-by-using-rules-in-outlook
madurez: T0
