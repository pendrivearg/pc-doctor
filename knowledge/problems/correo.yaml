id: MAIL-019
area: programas
titulo:
  sencillo: "Mi buzón de Outlook o Hotmail está lleno"
  tecnico: "Outlook.com: límite de almacenamiento del buzón (15 GB) y de la nube de Microsoft (5 GB)"
explicacion:
  sencillo: "El correo gratis de Microsoft tiene un espacio para mensajes y otro para adjuntos y OneDrive. Si cualquiera de los dos se llena, no podés mandar ni recibir correos, y los que te mandan rebotan."
  tecnico: "15 GB de buzón + 5 GB de nube compartidos con OneDrive; Configuración > Cuenta > Almacenamiento; Elementos eliminados cuenta hasta vaciarse."
frases: ["mi buzón de outlook está lleno", "hotmail dice que no tengo espacio", "me rebotan los mails porque la casilla está llena", "cuota excedida en el correo de outlook"]
pasos:
  - texto: "En Outlook.com, tocá Configuración (el engranaje) > «Cuenta» > «Almacenamiento». Ahí ves qué carpeta ocupa más."
    abrir: "https://support.microsoft.com/en-us/outlook/storage-limits-in-outlook-com"
  - texto: "Desde esa misma página podés borrar una carpeta entera o solo los correos de más de 3, 6 o 12 meses. Ojo: lo que borres desde ahí se elimina para siempre; guardá antes lo que necesites."
  - texto: "Vaciá «Elementos eliminados»: lo que está ahí sigue ocupando lugar hasta que la vaciás."
  - texto: "Si lo que se llenó es OneDrive, escribile a PC Doctor «OneDrive dice que está lleno»."
fuentes:
  - https://support.microsoft.com/en-us/outlook/storage-limits-in-outlook-com
  - https://support.microsoft.com/office/d39e3341-8d79-4bf1-b3c7-ded602233642
madurez: T0
