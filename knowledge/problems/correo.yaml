id: MAIL-007
area: programas
titulo:
  sencillo: "Me voy de vacaciones y quiero que Gmail conteste solo"
  tecnico: "Gmail: respuesta automática (fuera de la oficina)"
explicacion:
  sencillo: "Gmail puede contestar solo a quien te escriba, con un mensaje tipo «Estoy de vacaciones hasta el lunes». Le ponés fecha de inicio y de fin y se apaga solo."
  tecnico: "Configuración > Ver toda la configuración > General > Respuesta automática activada; período, asunto y mensaje."
frases: ["poner un mensaje de vacaciones en gmail", "que el mail conteste solo que no estoy", "respuesta automática en el correo", "aviso de que estoy de viaje en el gmail"]
pasos:
  - texto: "En Gmail, en la computadora, tocá el engranaje > «Ver toda la configuración». En la pestaña «General», buscá la sección «Respuesta automática»."
    abrir: "https://support.google.com/mail/answer/25922?hl=es-419"
  - texto: "Elegí «Respuesta automática activada» y completá el primer día, el último día, el asunto y el mensaje."
  - texto: "Si querés, marcá la casilla para que solo les conteste a tus contactos. Abajo de todo tocá «Guardar cambios»."
  - texto: "Si volvés antes, tocá «Finalizar ahora» en el aviso que aparece arriba de Recibidos."
fuentes:
  - https://support.google.com/mail/answer/25922?hl=es-419
madurez: T0
