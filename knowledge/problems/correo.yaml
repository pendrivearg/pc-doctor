id: MAIL-006
area: programas
titulo:
  sencillo: "Quiero poner mi nombre y teléfono al final de cada correo de Gmail"
  tecnico: "Gmail: crear una firma"
explicacion:
  sencillo: "La firma es un textito que Gmail agrega solo al final de tus correos, por ejemplo tu nombre y tu teléfono. Se arma una vez y queda."
  tecnico: "Configuración > Ver toda la configuración > General > Firma > Guardar cambios."
frases: ["poner una firma en el gmail", "que salga mi nombre abajo de los mails", "agregar mis datos al final del correo", "cómo hago la firma del mail"]
pasos:
  - texto: "En Gmail, en la computadora, tocá el engranaje (Configuración) arriba a la derecha y después «Ver toda la configuración»."
    abrir: "https://support.google.com/mail/answer/8395?hl=es-419"
  - texto: "Bajá hasta la sección «Firma» y escribí lo que quieras que aparezca (nombre, teléfono)."
  - texto: "Abajo de todo, tocá «Guardar cambios». Probá escribiendo un correo nuevo: la firma aparece sola."
fuentes:
  - https://support.google.com/mail/answer/8395?hl=es-419
madurez: T0
