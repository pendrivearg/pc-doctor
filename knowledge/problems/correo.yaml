id: MAIL-010
area: programas
titulo:
  sencillo: "Quiero que Gmail ordene solo los correos que llegan"
  tecnico: "Gmail: crear, editar y borrar filtros"
explicacion:
  sencillo: "Un filtro es una orden que le das a Gmail: por ejemplo, que todos los correos del club vayan a una etiqueta, se marquen como importantes o se archiven solos."
  tecnico: "Opciones de búsqueda > criterios > Crear filtro > acción (etiqueta, archivar, borrar, destacar, reenviar); gestión en Filtros y direcciones bloqueadas."
frases: ["que los mails de alguien vayan a una carpeta solos", "ordenar el correo automáticamente", "crear un filtro en gmail", "que gmail archive solo los mails de propaganda"]
pasos:
  - texto: "En Gmail, en la computadora, abrí las opciones de búsqueda (el ícono a la derecha de la barra de búsqueda) y escribí, por ejemplo, la dirección de quien manda esos correos."
    abrir: "https://support.google.com/mail/answer/6579?hl=es-419"
  - texto: "Abajo de esa ventanita tocá «Crear filtro» y elegí qué querés que haga Gmail (ponerle una etiqueta, archivarlos, destacarlos…). Confirmá con «Crear filtro»."
  - texto: "Para cambiarlo o borrarlo: engranaje > «Ver toda la configuración» > «Filtros y direcciones bloqueadas», y al lado del filtro tocá «Editar» o «Eliminar»."
  - texto: "Cuidado con los filtros que borran: si un correo importante deja de llegar, revisá esta lista primero."
fuentes:
  - https://support.google.com/mail/answer/6579?hl=es-419
  - https://support.google.com/mail/answer/7015314?hl=es-419
madurez: T0
