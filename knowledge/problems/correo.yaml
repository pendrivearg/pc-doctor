id: MAIL-002
area: programas
titulo:
  sencillo: "Un correo que espero se va a Spam en Gmail"
  tecnico: "Gmail: recuperar mensajes de Spam («No es spam») y evitar falsos positivos"
explicacion:
  sencillo: "Gmail a veces se equivoca y manda a la carpeta Spam correos buenos, como los del médico o del banco. Se pueden sacar de ahí y avisarle a Gmail que no son spam."
  tecnico: "Carpeta Spam > seleccionar > «No es spam»; agregar al remitente a Contactos de Google; no bloquearlo."
frases: ["los mails buenos se me van a spam", "un correo importante me cayó en correo basura", "tengo que buscar los mails en spam siempre", "cómo saco un correo de spam en gmail"]
pasos:
  - texto: "En Gmail, en el menú de la izquierda tocá «Más» y después «Spam»."
    abrir: "https://support.google.com/mail/answer/1366858?hl=es-419"
  - texto: "Marcá la casilla del correo bueno y arriba tocá «No es spam». El correo vuelve a Recibidos."
  - texto: "Para que no vuelva a pasar, agregá a esa persona a tus contactos de Google. Escribile a PC Doctor «quiero agendar un contacto en gmail»."
    abrir: "https://support.google.com/contacts/answer/1069522?hl=es-419"
  - texto: "Ojo: si un correo de Spam te pide claves o datos del banco, no lo saques ni toques sus enlaces. Escribile a PC Doctor «me llegó un correo sospechoso»."
fuentes:
  - https://support.google.com/mail/answer/1366858?hl=es-419
  - https://support.google.com/contacts/answer/1069522?hl=es-419
madurez: T0
