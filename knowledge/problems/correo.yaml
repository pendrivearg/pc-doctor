id: MAIL-016
area: programas
titulo:
  sencillo: "Borré un correo en Outlook o Hotmail y lo quiero recuperar"
  tecnico: "Outlook: restaurar desde Elementos eliminados y recuperar elementos eliminados de esta carpeta"
explicacion:
  sencillo: "Lo que borrás va primero a «Elementos eliminados». Si ya lo vaciaste, en Outlook.com todavía hay unos 30 días para recuperarlo desde una opción especial de esa carpeta."
  tecnico: "Elementos eliminados > Restaurar/Mover; «Recuperar elementos eliminados de esta carpeta» (30 días en Outlook.com); clásico: Inicio > Recuperar elementos eliminados del servidor."
frases: ["borré un mail del hotmail sin querer", "vacié la papelera del outlook y necesito un correo", "recuperar un correo eliminado en outlook", "dónde van los mails borrados en hotmail"]
pasos:
  - texto: "Abrí la carpeta «Elementos eliminados». Si ves el correo, hacé clic derecho > «Restaurar» (o arrastralo a la Bandeja de entrada)."
    abrir: "https://support.microsoft.com/outlook/mail/recover-and-restore-deleted-items-in-outlook"
  - texto: "Si no está: dentro de «Elementos eliminados» tocá «Recuperar elementos eliminados de esta carpeta», marcá los correos y tocá «Restaurar». Hacelo desde la computadora: en el celular no se puede."
  - texto: "En Outlook clásico, con «Elementos eliminados» abierto, en la pestaña «Inicio» tocá «Recuperar elementos eliminados del servidor». Si esa opción no aparece, tu tipo de cuenta no lo permite."
  - texto: "Pasados unos 30 días, el correo se borra para siempre y ya no se puede recuperar."
fuentes:
  - https://support.microsoft.com/outlook/mail/recover-and-restore-deleted-items-in-outlook
madurez: T0
