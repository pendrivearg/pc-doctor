id: MAIL-020
area: programas
titulo:
  sencillo: "El archivo es muy grande para mandarlo por correo"
  tecnico: "Adjunto demasiado grande: compartir enlace de OneDrive o Google Drive, comprimir o reducir imágenes"
explicacion:
  sencillo: "Los correos tienen un tamaño máximo (en Outlook.com y Gmail, alrededor de 20 a 25 MB contando todo). Para mandar algo más pesado, se sube a la nube y se manda el enlace."
  tecnico: "Outlook.com y Gmail: ~20 MB por mensaje según Microsoft; Gmail: 25 MB y conversión automática a enlace de Drive; alternativas: OneDrive, ZIP, Cambiar tamaño de imágenes grandes."
frases: ["el archivo es muy grande para mandarlo por correo", "no puedo mandar un video por mail", "dice que el adjunto supera el tamaño permitido", "cómo mando muchas fotos juntas por correo"]
pasos:
  - texto: "En Gmail no tenés que hacer nada: si el archivo pasa los 25 MB, Gmail lo sube solo a Google Drive y pone un enlace en el correo."
    abrir: "https://support.google.com/mail/answer/6584?hl=es-419"
  - texto: "En Outlook: subí el archivo a OneDrive (o Google Drive), copiá el enlace para compartir y pegalo en el correo. La otra persona lo abre y lo descarga desde ahí."
    abrir: "https://support.microsoft.com/en-us/office/reduce-attachment-size-to-send-large-files-with-outlook-8c698842-b462-4a4c-8d53-5c5dd04f77ef"
  - texto: "Para muchas fotos o documentos, podés juntarlos en un archivo comprimido (ZIP). Escribile a PC Doctor «cómo hago un zip»."
  - texto: "En Outlook clásico, con las fotos adjuntas: «Archivo» > «Información» y marcá la opción para cambiar el tamaño de las imágenes grandes al enviar."
fuentes:
  - https://support.microsoft.com/en-us/office/reduce-attachment-size-to-send-large-files-with-outlook-8c698842-b462-4a4c-8d53-5c5dd04f77ef
  - https://support.google.com/mail/answer/6584?hl=es-419
madurez: T0
