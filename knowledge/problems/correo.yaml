id: MAIL-012
area: programas
titulo:
  sencillo: "No me llegan los correos a Hotmail u Outlook.com, o no puedo mandar"
  tecnico: "Outlook.com: no se puede enviar ni recibir (almacenamiento, No deseado, reglas, reenvío)"
explicacion:
  sencillo: "En Hotmail/Outlook.com lo más común es que el espacio esté lleno (entonces no entra ni sale nada), que el correo haya ido a «Correo no deseado» o a la pestaña «Otros», o que una regla lo mueva de carpeta."
  tecnico: "Revisar cuota de almacenamiento, carpeta Correo no deseado, bandeja Prioritarios/Otros, reenvío y reglas; adjuntos de más de 25 MB no se envían."
frases: ["no me entran los mails al hotmail", "outlook.com no me deja mandar correos", "dejé de recibir correos en hotmail", "me escriben y no me llega nada al outlook"]
pasos:
  - texto: "Fijate si tu espacio está lleno: si lo está, no podés mandar ni recibir, y lo que te manden mientras tanto rebota. Escribile a PC Doctor «mi buzón de outlook está lleno»."
    abrir: "https://support.microsoft.com/office/d39e3341-8d79-4bf1-b3c7-ded602233642"
  - texto: "Mirá la pestaña «Otros» (al lado de «Prioritarios») y la carpeta «Correo no deseado». Si encontrás el correo ahí, hacé clic derecho y marcalo como que no es correo no deseado."
  - texto: "Revisá si hay reglas que muevan tus correos de carpeta (Configuración, el engranaje > «Correo» > «Reglas») o si está activado el reenvío a otra dirección."
    abrir: "https://support.microsoft.com/en-us/outlook/mail/manage-email-messages-by-using-rules-in-outlook"
  - texto: "Si no podés mandar un correo con un archivo, puede ser que pese más de 25 MB. Escribile a PC Doctor «el archivo es muy grande para mandarlo por correo»."
fuentes:
  - https://support.microsoft.com/office/d39e3341-8d79-4bf1-b3c7-ded602233642
  - https://support.microsoft.com/en-us/outlook/mail/manage-email-messages-by-using-rules-in-outlook
madurez: T0
---
id: MAIL-013
area: programas
titulo:
  sencillo: "Los correos se quedan en la Bandeja de salida de Outlook y no se van"
  tecnico: "Mensaje atascado en la Bandeja de salida (Outlook clásico y Outlook.com)"
explicacion:
  sencillo: "Cuando un correo queda trabado en la Bandeja de salida, casi siempre es porque tiene un archivo adjunto muy pesado o porque Outlook quedó «sin conexión»."
  tecnico: "Causa habitual: adjunto grande. Trabajar sin conexión, mover a Borradores y quitar el adjunto; desactivar Trabajar sin conexión y Enviar todo."
frases: ["los mails se quedan en bandeja de salida", "outlook no manda los correos", "el correo queda trabado sin enviarse", "tengo mensajes que no salen del outlook"]
pasos:
  - texto: "En Outlook clásico, mirá la pestaña «Enviar y recibir»: si el botón «Trabajar sin conexión» está marcado (azul), tocalo para volver a conectarte y después tocá «Enviar todo»."
    abrir: "https://support.microsoft.com/outlook/outlook-email-stuck"
  - texto: "Si sigue trabado: activá «Trabajar sin conexión», abrí la «Bandeja de salida», arrastrá el correo a «Borradores», abrilo y sacale el archivo adjunto pesado."
  - texto: "Si Outlook dice que lo está transmitiendo y no te deja, cerrá Outlook (si no se cierra, escribile a PC Doctor «un programa se congeló»), abrilo de nuevo y repetí el paso anterior."
  - texto: "Volvé a tocar «Trabajar sin conexión» para conectarte y mandalo. En Outlook.com, revisá «Borradores» y «Bandeja de salida»; si el adjunto pasa los 25 MB, subilo a OneDrive y mandá el enlace."
fuentes:
  - https://support.microsoft.com/outlook/outlook-email-stuck
madurez: T0
---
id: MAIL-014
area: programas
titulo:
  sencillo: "Correos que espero me caen en «Correo no deseado» de Outlook"
  tecnico: "Outlook: rescatar mensajes de Correo no deseado y agregar remitentes seguros"
explicacion:
  sencillo: "Outlook a veces manda correos buenos a la carpeta «Correo no deseado». Los podés devolver a la bandeja y anotar a esa persona como remitente seguro para que no vuelva a pasar. Lo que queda en esa carpeta se borra solo después de un tiempo."
  tecnico: "Marcar como no deseado/no es correo no deseado; Configuración > Correo > Correo no deseado > Remitentes y dominios seguros. Retención de 30 días en Outlook en la web."
frases: ["los mails buenos se me van a no deseado en hotmail", "un correo importante me cayó en correo no deseado", "outlook me manda todo a correo basura", "cómo hago para que un mail no vaya a no deseado"]
pasos:
  - texto: "Abrí la carpeta «Correo no deseado», hacé clic derecho sobre el correo bueno y elegí la opción para marcarlo como que no es correo no deseado: vuelve a la Bandeja de entrada."
    abrir: "https://support.microsoft.com/office/d39e3341-8d79-4bf1-b3c7-ded602233642"
  - texto: "Para que no se repita (Outlook.com y nuevo Outlook): tocá Configuración (el engranaje) > «Correo» > «Correo no deseado». En «Remitentes y dominios seguros» tocá «Agregar», escribí la dirección y tocá «Guardar»."
    abrir: "https://support.microsoft.com/en-us/outlook/filter-junk-email-and-spam-in-outlook"
  - texto: "Revisá esa carpeta cada tanto: lo que queda ahí se borra solo después de unos días y ya no se puede recuperar."
  - texto: "Si el correo te pide claves o datos del banco, no lo saques de ahí. Escribile a PC Doctor «me llegó un correo sospechoso»."
fuentes:
  - https://support.microsoft.com/office/d39e3341-8d79-4bf1-b3c7-ded602233642
  - https://support.microsoft.com/en-us/outlook/filter-junk-email-and-spam-in-outlook
madurez: T0
