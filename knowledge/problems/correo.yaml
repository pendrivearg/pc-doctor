id: MAIL-003
area: programas
titulo:
  sencillo: "Mandé un correo por error en Gmail"
  tecnico: "Gmail: Deshacer el envío y período de cancelación"
explicacion:
  sencillo: "Gmail te da unos segundos para arrepentirte: justo después de tocar «Enviar», aparece abajo a la izquierda el botón «Deshacer». Pasado ese tiempo, el correo ya no se puede frenar."
  tecnico: "Notificación «Deshacer» tras enviar; Configuración > Ver toda la configuración > Deshacer el envío: 5, 10, 20 o 30 segundos."
frases: ["mandé un mail sin querer", "se me fue el correo antes de terminarlo", "quiero cancelar un mail que acabo de mandar", "le mandé el correo a la persona equivocada"]
pasos:
  - texto: "Apenas lo mandes, mirá abajo a la izquierda: tocá «Deshacer» en el aviso. El correo vuelve a la pantalla de escribir y no se envía."
    abrir: "https://support.google.com/mail/answer/2819488?hl=es-419"
  - texto: "Para tener más tiempo la próxima vez: tocá el engranaje > «Ver toda la configuración». Al lado de «Deshacer el envío» elegí 30 segundos y tocá «Guardar cambios» abajo de todo."
  - texto: "Si ya pasó el tiempo, el correo se envió y no se puede borrar del otro lado. Lo mejor es mandar otro correo aclarando el error."
fuentes:
  - https://support.google.com/mail/answer/2819488?hl=es-419
madurez: T0
