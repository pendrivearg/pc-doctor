id: MAIL-005
area: programas
titulo:
  sencillo: "Borré un correo de Gmail y lo quiero recuperar"
  tecnico: "Gmail: restaurar mensajes desde la Papelera (30 días)"
explicacion:
  sencillo: "Los correos que borrás no desaparecen enseguida: quedan en la Papelera unos 30 días y de ahí se pueden devolver a Recibidos. Después de ese plazo se borran para siempre."
  tecnico: "Más > Papelera > seleccionar > Mover a > Recibidos. Retención de hasta 30 días; los borradores descartados no se recuperan."
frases: ["borré un mail sin querer", "eliminé un correo de gmail y lo necesito", "dónde quedan los correos borrados", "recuperar un mail que tiré a la papelera"]
pasos:
  - texto: "En Gmail, en el menú de la izquierda tocá «Más» y después «Papelera»."
    abrir: "https://support.google.com/mail/answer/7401?hl=es-419"
  - texto: "Marcá la casilla de cada correo que quieras recuperar, tocá «Mover a» arriba y elegí «Recibidos»."
  - texto: "No vacíes la Papelera mientras buscás: lo que se vacía o pasa los 30 días ya no se puede recuperar."
fuentes:
  - https://support.google.com/mail/answer/7401?hl=es-419
madurez: T0
