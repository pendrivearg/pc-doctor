id: MAIL-018
area: programas
titulo:
  sencillo: "Quiero poner una firma al final de mis correos de Outlook"
  tecnico: "Outlook: crear y elegir una firma predeterminada"
explicacion:
  sencillo: "La firma es el texto que Outlook agrega solo al final de cada correo: tu nombre, tu teléfono o lo que quieras."
  tecnico: "Nuevo Outlook/Outlook.com: Configuración > Cuentas > Firmas; clásico: mensaje nuevo > Mensaje > Firma > Firmas."
frases: ["poner firma en outlook", "que aparezca mi nombre al final de los mails de hotmail", "cambiar la firma del correo de outlook", "armar una firma para el mail del trabajo"]
pasos:
  - texto: "En Outlook.com o el nuevo Outlook: Configuración (el engranaje) > «Cuentas» > «Firmas». Tocá el botón para agregar una firma, ponele un nombre y escribila."
    abrir: "https://support.microsoft.com/en-us/outlook/mail/how-to-add-and-change-an-email-signature-in-outlook"
  - texto: "Marcá las casillas para que se agregue sola en los mensajes nuevos y en las respuestas, y tocá «Guardar»."
  - texto: "En Outlook clásico: abrí un mensaje nuevo y andá a «Mensaje» > «Firma» > «Firmas». Tocá «Nueva», escribila, elegila en «Mensajes nuevos» y tocá «Aceptar»."
fuentes:
  - https://support.microsoft.com/en-us/outlook/mail/how-to-add-and-change-an-email-signature-in-outlook
madurez: T0
