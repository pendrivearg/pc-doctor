id: MAIL-008
area: programas
titulo:
  sencillo: "Gmail dice que me quedé sin espacio"
  tecnico: "Almacenamiento de Google lleno (15 GB compartidos entre Gmail, Drive y Fotos)"
explicacion:
  sencillo: "Tu cuenta de Google tiene un espacio gratis que se comparte entre los correos, las fotos de Google Fotos y los archivos de Drive. Si se llena, no podés mandar ni recibir correos: los que te mandan rebotan."
  tecnico: "Cuota de 15 GB compartida (Gmail, Drive, Fotos, copias de WhatsApp); con la cuota excedida no se envía ni recibe correo."
frases: ["gmail dice que no tengo espacio", "se me llenó el almacenamiento de google", "me dicen que mi casilla está llena y les rebota", "cómo libero espacio en el gmail"]
pasos:
  - texto: "Primero, vaciá la Papelera y la carpeta Spam de Gmail: lo que está ahí también ocupa lugar. Ojo: lo que vacíes ya no se recupera."
    abrir: "https://support.google.com/drive/answer/6374270?hl=es-419"
  - texto: "Buscá los correos más pesados: en la barra de búsqueda de Gmail escribí has:attachment larger:10M y borrá los que no necesites."
    abrir: "https://support.google.com/mail/answer/7190?hl=es-419"
  - texto: "Revisá también Google Fotos y Drive, que comparten el mismo espacio. Después de borrar mucho, el espacio puede tardar de 48 a 72 horas en actualizarse."
  - texto: "Si igual te falta lugar, Google ofrece comprar más espacio con Google One. No hace falta: primero probá liberar."
fuentes:
  - https://support.google.com/drive/answer/6374270?hl=es-419
  - https://support.google.com/mail/answer/7190?hl=es-419
madurez: T0
