id: MAIL-017
area: programas
titulo:
  sencillo: "Me voy de vacaciones y quiero que Outlook conteste solo"
  tecnico: "Outlook: respuestas automáticas (fuera de la oficina)"
explicacion:
  sencillo: "Outlook puede contestar solo a quien te escriba mientras no estás. Le ponés desde cuándo y hasta cuándo, y después se apaga solo."
  tecnico: "Outlook.com: Configuración > Cuenta(s) > Respuestas automáticas; nuevo Outlook: Ver > Configuración de vista > Cuentas; clásico: Archivo > Respuestas automáticas. No disponible para cuentas Gmail, Yahoo, POP o IMAP."
frases: ["poner respuesta automática en outlook", "mensaje de fuera de la oficina en hotmail", "que outlook avise que estoy de vacaciones", "contestador automático del correo de outlook"]
pasos:
  - texto: "En Outlook.com o el nuevo Outlook: entrá a Configuración (el engranaje) > «Cuentas» (en Outlook.com puede decir «Cuenta») > «Respuestas automáticas» y activá el interruptor."
    abrir: "https://support.microsoft.com/en-us/office/how-to-set-up-out-of-office-automatic-replies-in-outlook-9742f476-5348-4f9f-997f-5e208513bd67"
  - texto: "Marcá la opción para enviar respuestas solo durante un período y poné la fecha de inicio y de fin. Escribí el mensaje y tocá «Guardar». Conviene marcar que solo les conteste a tus contactos."
  - texto: "En Outlook clásico: «Archivo» > «Respuestas automáticas» > «Enviar respuestas automáticas», poné las fechas y el mensaje y tocá «Aceptar»."
  - texto: "Si en Outlook usás una cuenta de Gmail, esta opción no está: configurala desde Gmail. Escribile a PC Doctor «poner un mensaje de vacaciones en gmail»."
fuentes:
  - https://support.microsoft.com/en-us/office/how-to-set-up-out-of-office-automatic-replies-in-outlook-9742f476-5348-4f9f-997f-5e208513bd67
madurez: T0
