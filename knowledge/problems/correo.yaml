id: MAIL-022
area: archivos
titulo:
  sencillo: "Quiero guardar una copia de mis correos de Outlook o abrir un archivo .pst"
  tecnico: "Outlook clásico: exportar a un archivo de datos de Outlook (.pst) y abrir archivos .pst"
explicacion:
  sencillo: "Outlook clásico puede guardar tus correos en un archivo con terminación .pst, como una copia de seguridad que podés llevar a un pendrive. Ese mismo archivo después se abre en Outlook para ver los correos viejos."
  tecnico: "Archivo > Abrir y exportar > Importar o exportar > Exportar a un archivo > Archivo de datos de Outlook (.pst); abrir: Archivo > Abrir y exportar > Abrir archivo de datos de Outlook. Ubicación habitual: Documentos\\Archivos de Outlook."
frases: ["hacer copia de seguridad del outlook", "guardar todos mis mails en un archivo", "tengo un archivo pst y no sé cómo abrirlo", "pasar los correos de outlook a otra computadora"]
pasos:
  - texto: "Para hacer la copia, en Outlook clásico: «Archivo» > «Abrir y exportar» > «Importar o exportar». Elegí «Exportar a un archivo» > «Siguiente» > «Archivo de datos de Outlook (.pst)» > «Siguiente»."
    abrir: "https://support.microsoft.com/en-us/outlook/back-up-your-outlook-email"
  - texto: "Elegí la carpeta que querés guardar (por ejemplo, tu cuenta entera), después dónde guardar el archivo y tocá «Finalizar». Si te ofrece ponerle una clave al archivo es opcional: si la ponés, anotala, porque sin ella no lo vas a poder abrir."
  - texto: "Para abrir un .pst: «Archivo» > «Abrir y exportar» > «Abrir archivo de datos de Outlook» y elegí el archivo. Aparece en la lista de carpetas de la izquierda."
    abrir: "https://support.microsoft.com/en-us/outlook/open-and-find-items-in-an-outlook-data-file-pst"
  - texto: "Si lo buscás en la computadora, suele estar en Documentos, dentro de la carpeta de archivos de Outlook. El nuevo Outlook solo los abre si también tenés Outlook clásico instalado."
fuentes:
  - https://support.microsoft.com/en-us/outlook/back-up-your-outlook-email
  - https://support.microsoft.com/en-us/outlook/open-and-find-items-in-an-outlook-data-file-pst
madurez: T0
