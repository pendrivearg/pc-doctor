id: MAIL-015
area: programas
titulo:
  sencillo: "Quiero bloquear a alguien que me manda correos en Outlook o Hotmail"
  tecnico: "Outlook: bloquear y desbloquear remitentes y dominios"
explicacion:
  sencillo: "Si bloqueás una dirección, lo que te mande va directo a «Correo no deseado» y no te aparece en la bandeja de entrada."
  tecnico: "Nuevo Outlook/Outlook.com: Configuración > Correo > Correo no deseado > Remitentes bloqueados. Clásico: clic derecho > Bloquear remitente u Opciones de correo no deseado."
frases: ["bloquear un mail en hotmail", "no quiero que me escriba más una persona al outlook", "cómo bloqueo una dirección de correo en outlook", "me llegan correos de alguien y los quiero bloquear"]
pasos:
  - texto: "En Outlook.com o el nuevo Outlook: tocá Configuración (el engranaje) > «Correo» > «Correo no deseado». En «Remitentes bloqueados», escribí la dirección, tocá «Agregar» y después «Guardar»."
    abrir: "https://support.microsoft.com/en-us/outlook/mail/block-or-unblock-senders-in-outlook"
  - texto: "En Outlook clásico: hacé clic derecho sobre un correo de esa persona y elegí la opción para bloquear al remitente."
  - texto: "Para desbloquearla, volvé a esa lista de remitentes bloqueados y quitala."
  - texto: "Si usás una cuenta de Gmail o Yahoo dentro del nuevo Outlook, ahí no se puede bloquear: hacelo desde Gmail. Escribile a PC Doctor «bloquear a alguien en gmail»."
fuentes:
  - https://support.microsoft.com/en-us/outlook/mail/block-or-unblock-senders-in-outlook
madurez: T0
