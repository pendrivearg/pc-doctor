id: MAIL-009
area: programas
titulo:
  sencillo: "No encuentro un correo viejo en Gmail"
  tecnico: "Gmail: búsqueda avanzada y operadores (from:, subject:, has:attachment, in:anywhere)"
explicacion:
  sencillo: "El buscador de arriba de Gmail encuentra correos por quién te lo mandó, por una palabra o por la fecha. Si no aparece, puede estar en Spam o en la Papelera."
  tecnico: "Operadores: from:, to:, subject:, after:/before:, has:attachment, filename:; in:anywhere incluye Spam y Papelera."
frases: ["no encuentro un mail que me mandaron", "buscar un correo viejo en gmail", "cómo encuentro el mail de la obra social", "busco un correo que tenía un archivo adjunto"]
pasos:
  - texto: "Tocá la barra de búsqueda de arriba en Gmail y escribí el nombre de quien te lo mandó o una palabra que recuerdes del correo."
    abrir: "https://support.google.com/mail/answer/7190?hl=es-419"
  - texto: "Para afinar: escribí from: seguido de la dirección de quien lo mandó (por ejemplo from:juan@gmail.com), o has:attachment si tenía un archivo adjunto."
  - texto: "Si no aparece, sumale in:anywhere a la búsqueda (por ejemplo in:anywhere factura): así busca también en Spam y en la Papelera."
  - texto: "Si sigue sin aparecer, escribile a PC Doctor «no me llegan los mails al gmail»."
    abrir: "https://support.google.com/mail/answer/7015314?hl=es-419"
fuentes:
  - https://support.google.com/mail/answer/7190?hl=es-419
  - https://support.google.com/mail/answer/7015314?hl=es-419
madurez: T0
