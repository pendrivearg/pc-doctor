id: MAIL-011
area: programas
titulo:
  sencillo: "Quiero agendar una dirección de correo en Gmail"
  tecnico: "Contactos de Google: crear un contacto"
explicacion:
  sencillo: "Si guardás a una persona en tus contactos, después la encontrás escribiendo su nombre, y Gmail deja de mandar sus correos a Spam."
  tecnico: "contacts.google.com > Crear contacto > Guardar; Gmail guarda automáticamente las direcciones a las que escribís en «Otros contactos»."
frases: ["quiero agendar un contacto en gmail", "guardar el mail de alguien", "agregar una dirección a mis contactos", "dónde guardo los correos de mis amigos"]
pasos:
  - texto: "Abrí Contactos de Google (contacts.google.com) en el navegador, con la misma cuenta de tu Gmail."
    abrir: "https://support.google.com/contacts/answer/1069522?hl=es-419"
  - texto: "Arriba a la izquierda tocá «Crear contacto», escribí el nombre, el correo y si querés el teléfono, y tocá «Guardar»."
  - texto: "Las personas a las que ya les escribiste quedan guardadas solas en «Otros contactos»."
fuentes:
  - https://support.google.com/contacts/answer/1069522?hl=es-419
  - https://support.google.com/mail/answer/1366858?hl=es-419
