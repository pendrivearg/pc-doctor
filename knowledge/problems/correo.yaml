id: MAIL-025
area: programas
titulo:
  sencillo: "Me llegó un «mensaje protegido» o cifrado y no lo puedo leer"
  tecnico: "Abrir mensajes cifrados o protegidos de Microsoft 365 desde Gmail, Yahoo u Outlook.com"
explicacion:
  sencillo: "Algunos bancos, médicos u oficinas mandan correos «protegidos»: en vez del texto, llega un aviso con un botón para leerlo. Al tocarlo, se abre una página de Microsoft donde entrás con tu cuenta o te mandan un código de un solo uso a tu correo."
  tecnico: "Mensajes de Cifrado de mensajes de Microsoft Purview/Microsoft 365: «Leer el mensaje» > iniciar sesión con Google/Yahoo/Microsoft o código de un solo uso (vence a los 15 minutos)."
frases: ["me llegó un mensaje protegido y no lo puedo abrir", "el correo dice que es un mensaje cifrado", "me piden un código para leer un mail", "no puedo ver un correo seguro que me mandaron"]
pasos:
  - texto: "Antes de nada, fijate que conozcas a quien te lo manda. Si no esperabas ese correo o te pide claves, no toques nada y escribile a PC Doctor «me llegó un correo sospechoso»."
    abrir: "https://support.microsoft.com/en-us/outlook/mail/open-encrypted-and-protected-messages"
  - texto: "Abrí el correo y tocá el botón para leer el mensaje. Si usás Gmail, elegí iniciar sesión con Google y aceptá; el mensaje se abre en una pestaña nueva del navegador."
  - texto: "Si no, elegí la opción del código de un solo uso: te llega otro correo con un código. Escribilo en la página y tocá «Continuar». El código vence a los 15 minutos; si se vence, empezá de nuevo."
fuentes:
  - https://support.microsoft.com/en-us/outlook/mail/open-encrypted-and-protected-messages
madurez: T0
