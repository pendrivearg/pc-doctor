id: MAIL-004
area: programas
titulo:
  sencillo: "Quiero bloquear a alguien que me manda correos en Gmail"
  tecnico: "Gmail: bloquear y desbloquear un remitente"
explicacion:
  sencillo: "Si alguien te manda correos que no querés, lo podés bloquear: lo que te mande después va directo a Spam y no lo ves en Recibidos."
  tecnico: "Abrir mensaje > Más (⋮) > Bloquear a {remitente}; desbloqueo en Configuración > Filtros y direcciones bloqueadas."
frases: ["no quiero recibir más mails de una persona", "bloquear a alguien en gmail", "una dirección me llena el correo y quiero bloquearla", "cómo hago para que no me lleguen más correos de alguien"]
pasos:
  - texto: "En Gmail, abrí un correo de esa persona. Arriba a la derecha, al lado de «Responder», tocá «Más» (los tres puntitos) y elegí «Bloquear a…» con su nombre."
    abrir: "https://support.google.com/mail/answer/8151?hl=es-419"
  - texto: "Si te arrepentís, repetí lo mismo y elegí «Desbloquear a…». También podés ir al engranaje > «Ver toda la configuración» > «Filtros y direcciones bloqueadas», marcar la dirección y tocar «Desbloquear las direcciones seleccionadas»."
  - texto: "Si el correo es una estafa (te pide claves o plata), además escribile a PC Doctor «me llegó un correo sospechoso»."
fuentes:
  - https://support.google.com/mail/answer/8151?hl=es-419
madurez: T0
