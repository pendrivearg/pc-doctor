# Correo electrónico (Gmail, Outlook.com/Hotmail, nuevo Outlook y Outlook clásico): no llegan, spam, enviar, borrar, firma, vacaciones, almacenamiento, reglas, PST, celular y calendario. Guiadas con fuente oficial.
id: MAIL-001
area: programas
titulo:
  sencillo: "No me llegan los correos a Gmail"
  tecnico: "Gmail: mensajes faltantes (búsqueda en Spam/Papelera, filtros, reenvío, POP/IMAP, almacenamiento)"
explicacion:
  sencillo: "Muchas veces el correo sí llegó, pero quedó en Spam, en la Papelera o lo movió un filtro. También deja de llegar todo si se llenó el espacio de tu cuenta de Google."
  tecnico: "Buscar con alcance «Correo, Spam y Papelera»; revisar filtros con «Borrar» u «Omitir Recibidos», reenvío y POP/IMAP; cuota compartida de 15 GB."
frases: ["no me llegan los mails al gmail", "me dicen que me mandaron un correo y no lo tengo", "dejaron de entrarme los correos", "no recibo ningún mail nuevo en gmail"]
pasos:
  - texto: "En Gmail, en la barra de búsqueda tocá el ícono «Mostrar opciones de búsqueda». Al lado de «Buscar» elegí «Correo, Spam y Papelera», escribí quién te lo mandó y tocá «Buscar»."
    abrir: "https://support.google.com/mail/answer/7015314?hl=es-419"
  - texto: "Revisá los filtros: tocá el engranaje (Configuración) > «Ver toda la configuración» > pestaña «Filtros y direcciones bloqueadas». Si hay uno que diga «Borrar» u «Omitir Recibidos» y no lo hiciste vos, tocá «Editar» o «Eliminar»."
  - texto: "En la pestaña «Reenvío y correo POP/IMAP», fijate que no esté reenviando tus correos a otra dirección sin dejar copia en Recibidos."
  - texto: "Fijate si se te llenó el espacio de Google: si está lleno, los correos nuevos rebotan. Escribile a PC Doctor «gmail dice que no tengo espacio»."
    abrir: "https://support.google.com/drive/answer/6374270?hl=es-419"
derivar: "Si encontrás un filtro o un reenvío que vos no pusiste, puede que alguien haya entrado a tu cuenta: escribile a PC Doctor «me olvidé la contraseña de Gmail» para cambiarla desde la página oficial de Google."
fuentes:
  - https://support.google.com/mail/answer/7015314?hl=es-419
  - https://support.google.com/drive/answer/6374270?hl=es-419
madurez: T0
