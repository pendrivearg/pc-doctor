id: MAIL-023
area: programas
titulo:
  sencillo: "Outlook me pide la contraseña una y otra vez"
  tecnico: "Outlook clásico solicita credenciales repetidamente"
explicacion:
  sencillo: "Si Outlook te pide la clave a cada rato, casi siempre es porque la cambiaste en otro lado (por ejemplo, en la página de Hotmail o de Gmail) y Outlook todavía tiene guardada la vieja. PC Doctor nunca ve ni guarda tu clave."
  tecnico: "Causas: Bloq Mayús, usuario incompleto, contraseña cambiada o vencida en el proveedor; actualizarla en la configuración de la cuenta de Outlook."
frases: ["outlook me pide la contraseña todo el tiempo", "sale la ventanita de la clave del correo a cada rato", "pongo la clave en outlook y la vuelve a pedir", "outlook no acepta mi contraseña"]
pasos:
  - texto: "Fijate que no esté activado Bloq Mayús (la clave distingue mayúsculas) y que el usuario sea tu dirección de correo completa, con el @ y todo."
    abrir: "https://support.microsoft.com/en-us/outlook/getstarted/troubleshoot-outlook-email-setup"
  - texto: "Si hace poco cambiaste la clave en la página de tu correo (o se venció), Outlook sigue usando la vieja: actualizala en Outlook escribiendo la nueva cuando te la pida, en su propia ventana."
  - texto: "Si no estás seguro de cuál es tu clave, no pruebes muchas veces seguidas: escribile a PC Doctor «me olvidé la contraseña de Gmail» o «mi cuenta de Microsoft está bloqueada»."
  - texto: "Si tu cuenta es del trabajo, puede que la clave se haya vencido: consultá con el encargado de sistemas."
fuentes:
  - https://support.microsoft.com/en-us/outlook/getstarted/troubleshoot-outlook-email-setup
madurez: T0
