id: MAIL-024
area: programas
titulo:
  sencillo: "Quiero ver mi correo en el celular"
  tecnico: "Configurar Outlook para Android/iOS o agregar Outlook/Hotmail a la app de Gmail"
explicacion:
  sencillo: "Podés tener el mismo correo en la computadora y en el celular. Se instala la app de Outlook (o se usa la de Gmail que ya viene en Android) y se agrega la cuenta. La clave la escribís vos en la pantalla oficial."
  tecnico: "Outlook móvil: Agregar cuenta (o Configuración > Cuenta > Agregar cuenta); app Gmail Android: Perfil > Agregar otra cuenta > Outlook."
frases: ["poner el hotmail en el celular", "configurar el correo en el teléfono", "quiero ver los mails en el celu", "agregar mi cuenta de outlook al celular"]
pasos:
  - texto: "Con la app de Outlook en Android: instalala desde Google Play, abrila, tocá «Agregar cuenta», escribí tu correo y seguí los pasos. Para una cuenta de Gmail elegí la opción de agregar cuenta de Google."
    abrir: "https://support.microsoft.com/en-us/outlook/install-mobile/set-up-email-in-the-outlook-for-android-app"
  - texto: "En iPhone: descargá Outlook desde la App Store, abrila, tocá «Agregar cuenta», escribí tu correo y seguí los pasos en pantalla."
    abrir: "https://support.microsoft.com/en-us/outlook/install-mobile/set-up-the-outlook-app-for-ios"
  - texto: "Si preferís la app de Gmail de Android: tocá tu foto de perfil arriba a la derecha > «Agregar otra cuenta» > «Outlook» y seguí los pasos."
    abrir: "https://support.google.com/mail/answer/6078445?hl=es-419&co=GENIE.Platform%3DAndroid"
  - texto: "Si tenés la verificación en dos pasos, puede que te pida confirmar con un código o una aprobación en el celular: es normal."
fuentes:
  - https://support.microsoft.com/en-us/outlook/install-mobile/set-up-email-in-the-outlook-for-android-app
  - https://support.microsoft.com/en-us/outlook/install-mobile/set-up-the-outlook-app-for-ios
  - https://support.google.com/mail/answer/6078445?hl=es-419&co=GENIE.Platform%3DAndroid
madurez: T0
