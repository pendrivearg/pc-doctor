id: NET-HOT-002
area: red
titulo:
  sencillo: "Quiero compartir el Internet de la computadora con otros aparatos"
  tecnico: "Zona con cobertura inalámbrica móvil de Windows"
explicacion:
  sencillo: "Windows puede convertir la computadora en un Wi-Fi para que se conecten el celular, una tablet u otra PC. Sirve, por ejemplo, si la compu tiene Internet por cable."
  tecnico: "Mobile hotspot: comparte Wi-Fi, Ethernet o datos móviles por Wi-Fi o Bluetooth, con nombre, clave y banda configurables."
frases: ["quiero compartir el internet de la compu con el celular", "usar la notebook como wifi", "hacer una zona wifi con la computadora", "la compu tiene internet por cable y quiero wifi para el celular"]
pasos:
  - texto: "Abrí Zona con cobertura inalámbrica móvil, elegí qué conexión compartir y activala. Ahí ves el nombre de la red y la clave (o un código QR)."
    abrir: "ms-settings:network-mobilehotspot"
  - texto: "En el celular, buscá esa red en la lista de Wi-Fi y escribí la clave, o escaneá el código QR."
  - texto: "Microsoft lo explica paso a paso. Si la PC usa datos móviles, gasta datos de ese plan."
    abrir: "https://support.microsoft.com/windows/experience/connectivity-networking/use-your-windows-device-as-a-mobile-hotspot"
fuentes:
  - https://support.microsoft.com/windows/experience/connectivity-networking/use-your-windows-device-as-a-mobile-hotspot
madurez: T0
