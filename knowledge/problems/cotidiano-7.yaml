id: APP-EDG-001
area: programas
titulo:
  sencillo: "Microsoft Edge se cierra o no abre"
  tecnico: "Edge no responde, se bloquea o no inicia"
explicacion:
  sencillo: "Edge se puede reparar desde Configuración sin perder tus favoritos ni tus contraseñas guardadas. Antes conviene probar lo simple: cerrar pestañas, actualizar y reiniciar."
  tecnico: "Liberar memoria, actualizar Edge, examen antimalware, reinicio y Reparar (Aplicaciones instaladas > Microsoft Edge > Modificar)."
frases: ["el edge se cierra solo", "no abre el microsoft edge", "el navegador edge se cuelga", "edge dejó de funcionar"]
sondas: [ram]
pasos:
  - texto: "Cerrá las pestañas y programas que no uses y quitá las extensiones que no necesites."
  - texto: "Actualizá Edge: menú de los tres puntos > Configuración > Acerca de Microsoft Edge. Después reiniciá la computadora."
  - texto: "Si sigue fallando, repará Edge: cerralo, buscalo en Aplicaciones instaladas > tres puntos > Modificar > Reparar (necesita Internet). Tus datos y configuraciones no se tocan."
    abrir: "ms-settings:appsfeatures"
  - texto: "Microsoft lo explica según el caso (se cierra, deja de responder o no abre)."
    abrir: "https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a"
fuentes:
  - https://support.microsoft.com/microsoft-edge/what-to-do-if-microsoft-edge-isn-t-working-cc0657a6-acd2-cbbd-1528-c0335c71312a
madurez: T0
