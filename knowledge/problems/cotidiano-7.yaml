id: NET-HOT-001
area: red
titulo:
  sencillo: "Quiero usar el Internet del celular en la computadora"
  tecnico: "Zona Wi-Fi (hotspot) o anclaje de red del teléfono"
explicacion:
  sencillo: >-
    Si no hay Wi-Fi, el celular puede compartir sus datos y la computadora se conecta a él como a cualquier Wi-Fi.
    Gasta datos del plan del celular, y algunas compañías lo limitan o lo cobran aparte.
  tecnico: "Hotspot Wi-Fi, anclaje USB o Bluetooth del teléfono (Android: Zona Wi-Fi; iPhone: Compartir Internet)."
frases: ["quiero usar el internet del celular en la compu", "compartir los datos del celular con la notebook", "conectar la compu al celular para tener internet", "no tengo wifi y quiero usar los datos del teléfono"]
pasos:
  - texto: "Android: deslizá desde arriba, mantené apretado el ícono «Zona Wi-Fi» (o «Hotspot») y activalo. Ahí ves el nombre y la clave."
    abrir: "https://support.google.com/android/answer/9059108?hl=es-419"
  - texto: "iPhone: Configuración > Compartir Internet (o Datos celulares > Compartir Internet), y activá «Permitir a otros conectarse»."
    abrir: "https://support.apple.com/es-mx/111785"
  - texto: "En la computadora, elegí la red del celular en la lista de Wi-Fi y escribí la clave que muestra el teléfono."
    abrir: "ms-settings:network-wifi"
  - texto: "Dejá el celular enchufado mientras compartís y apagá la zona Wi-Fi cuando termines: gasta batería y datos."
derivar: "Si el celular no tiene la opción o no conecta, consultá a tu compañía de celular: algunos planes no la incluyen."
fuentes:
  - https://support.google.com/android/answer/9059108?hl=es-419
  - https://support.apple.com/es-mx/111785
madurez: T0
