id: SEC-AV-003
area: seguridad
titulo:
  sencillo: "El antivirus de prueba se venció y me pide pagar"
  tecnico: "Antivirus de terceros vencido o no deseado"
explicacion:
  sencillo: >-
    Muchas computadoras vienen con un antivirus de prueba (McAfee, Norton y otros) que después pide pagar. No hace falta:
    Windows trae Microsoft Defender gratis, y se vuelve a activar solo cuando el otro antivirus se desinstala o se vence.
  tecnico: "En Windows 10/11 Defender pasa a deshabilitado con un antivirus de terceros y se reactiva automáticamente si ese producto vence o se desinstala."
frases: ["el antivirus de prueba se venció", "me pide pagar el antivirus", "quiero desinstalar el mcafee", "quiero sacar el norton de la compu", "me aparecen avisos del antivirus para que lo compre"]
sondas: [seguridad]
pasos:
  - texto: "Desinstalá el antivirus de prueba: Configuración > Aplicaciones > Aplicaciones instaladas > tres puntos junto al antivirus > Desinstalar. Reiniciá la PC."
    abrir: "ms-settings:appsfeatures"
  - texto: "Si no se deja desinstalar, Microsoft explica otras formas. Si tampoco funciona, buscá la «herramienta de desinstalación» en la página oficial del fabricante del antivirus."
    abrir: "https://support.microsoft.com/windows/uninstall-or-remove-apps-and-programs-in-windows-4b55f974-2cc6-2d2b-d092-5905080eaf98"
  - texto: "Después del reinicio, abrí Seguridad de Windows y comprobá que Microsoft Defender esté activo. Volvé a pasar el diagnóstico de PC Doctor para confirmarlo."
    abrir: "ms-settings:windowsdefender"
derivar: "Nunca pagues desde una ventana que aparece sola en el navegador: los antivirus de verdad no te avisan así."
fuentes:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-compatibility
  - https://support.microsoft.com/windows/uninstall-or-remove-apps-and-programs-in-windows-4b55f974-2cc6-2d2b-d092-5905080eaf98
madurez: T0
