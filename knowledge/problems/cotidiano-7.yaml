id: DAY-WA-001
area: programas
titulo:
  sencillo: "Quiero usar WhatsApp en la computadora"
  tecnico: "WhatsApp Web / WhatsApp para Windows (dispositivo vinculado)"
explicacion:
  sencillo: "WhatsApp se usa en la computadora vinculándola con tu celular: la compu muestra un código QR y lo escaneás con el celular. Tus chats aparecen en las dos."
  tecnico: "Dispositivos vinculados: hasta 4 por teléfono; se desvinculan si el teléfono no se usa por más de 14 días."
frases: ["quiero usar whatsapp en la compu", "cómo pongo el whatsapp en la computadora", "whatsapp web no conecta", "el whatsapp de la pc se desconectó", "escanear el código de whatsapp"]
pasos:
  - texto: "En la computadora, abrí WhatsApp para Windows (desde Microsoft Store) o entrá a web.whatsapp.com. Va a aparecer un código QR."
  - texto: "En el celular: Android: tres puntitos > Dispositivos vinculados > Vincular un dispositivo. iPhone: Configuración > Dispositivos vinculados > Vincular un dispositivo. Apuntá la cámara al código de la pantalla."
  - texto: "Si se desconectó: cerrá sesión en la computadora y volvé a vincularla. Usá WhatsApp en el celular al menos cada dos semanas para que no se desvincule."
  - texto: "WhatsApp lo explica paso a paso."
    abrir: "https://faq.whatsapp.com/539218963354346"
fuentes:
  - https://faq.whatsapp.com/539218963354346
madurez: T0
