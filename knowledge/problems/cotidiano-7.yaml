# Navegadores (Chrome, Edge, página de inicio cambiada), WhatsApp en la PC, antivirus de prueba y compartir Internet. Guiadas con fuente oficial.
id: APP-CHR-001
area: programas
titulo:
  sencillo: "Google Chrome se cierra, se cuelga o muestra «¡Oh, no!»"
  tecnico: "Fallos de Chrome y errores de carga de páginas"
explicacion:
  sencillo: "Casi siempre es falta de memoria por muchas pestañas, una extensión que anda mal o Chrome sin actualizar. Si falla una sola página, el problema suele ser de esa página."
  tecnico: "Memoria, extensiones, caché, versión de Chrome, software no deseado o antivirus que inspecciona HTTPS."
frases: ["el chrome se cierra solo", "google chrome se cuelga", "chrome me dice oh no", "el chrome no abre las páginas", "se tilda el chrome"]
sondas: [ram]
pasos:
  - texto: "Recargá la página. Si falla una sola página y las demás andan, el problema es de esa página."
  - texto: "Cerrá las pestañas que no uses. Abrí la página en una ventana de incógnito (Ctrl + Mayús + N): si ahí anda, desactivá las extensiones de a una para encontrar la que falla."
  - texto: "Actualizá Chrome: menú de los tres puntos > Ayuda > Información de Google Chrome. Después reiniciá la computadora."
  - texto: "Si sigue igual, hacé un examen con Microsoft Defender por si hay algún programa no deseado."
    abrir: "ms-settings:windowsdefender"
  - texto: "Google explica cada mensaje de error."
    abrir: "https://support.google.com/chrome/answer/95669?hl=es-419"
fuentes:
  - https://support.google.com/chrome/answer/95669?hl=es-419
madurez: T0
