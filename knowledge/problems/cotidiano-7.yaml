id: SEC-BRW-001
area: seguridad
titulo:
  sencillo: "Me cambiaron la página de inicio o el buscador del navegador"
  tecnico: "Página de inicio o motor de búsqueda modificados sin permiso"
explicacion:
  sencillo: >-
    Algunos programas gratuitos, al instalarse, cambian la página que abre el navegador o el buscador por otro lleno de publicidad.
    Se vuelve atrás desde la configuración del navegador y quitando la extensión o el programa que lo cambió.
  tecnico: "Secuestro de página de inicio/buscador por extensiones o software no deseado (PUA)."
frases: ["me cambió la página de inicio sola", "el buscador del navegador cambió solo", "se abre una página rara al abrir el navegador", "me cambiaron google por otro buscador"]
sondas: [seguridad]
pasos:
  - texto: "Revisá las extensiones del navegador y quitá las que no reconozcas."
  - texto: "Volvé a poner tu página de inicio (en Edge: Configuración > Inicio, página principal y nuevas pestañas)."
    abrir: "https://support.microsoft.com/microsoft-edge/change-your-browser-home-page-a531e1b8-ed54-d057-0262-cc5983a065c6"
  - texto: "Volvé a elegir tu buscador (en Edge: Configuración > Privacidad, búsqueda y servicios > Barra de direcciones y búsqueda)."
    abrir: "https://support.microsoft.com/microsoft-edge/change-your-default-search-engine-in-microsoft-edge-cccaf51c-a4df-a43e-8036-d4d2c527a791"
  - texto: "Desinstalá los programas que no recuerdes haber instalado y hacé un examen completo con Microsoft Defender."
    abrir: "ms-settings:windowsdefender"
fuentes:
  - https://support.microsoft.com/microsoft-edge/change-your-browser-home-page-a531e1b8-ed54-d057-0262-cc5983a065c6
  - https://support.microsoft.com/microsoft-edge/change-your-default-search-engine-in-microsoft-edge-cccaf51c-a4df-a43e-8036-d4d2c527a791
madurez: T0
