source /boot/grub/config.cfg

# PC Doctor: arranca solo el modo rescate a los 5 segundos.
set default=0
set timeout=5

menuentry "PC Doctor - Modo rescate" --hotkey=r {
	linux	/live/vmlinuz-KERNEL boot=live components quiet loglevel=3 hooks=medium locales=es_AR.UTF-8 keyboard-layouts=latam timezone=America/Argentina/Buenos_Aires
	initrd	/live/initrd.img-KERNEL
}
menuentry "PC Doctor - Modo rescate (si la pantalla queda negra)" {
	linux	/live/vmlinuz-KERNEL boot=live components quiet loglevel=3 nomodeset hooks=medium locales=es_AR.UTF-8 keyboard-layouts=latam timezone=America/Argentina/Buenos_Aires
	initrd	/live/initrd.img-KERNEL
}
if [ "${grub_platform}" = "efi" ]; then
	menuentry "Configuración de la placa (UEFI)" {
		fwsetup
	}
fi
